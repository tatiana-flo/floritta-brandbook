<script>
(function(){
const $=App.$;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const close=`<button class="ib" onclick="App.closeSheet()" aria-label="Close">${App.icon("close")}</button>`;
window.ACC=window.ACC||{};const ACC=window.ACC;
ACC.mode=ACC.mode||"details";              /* guest | details | signed (proposed) */
ACC.details=ACC.details||{name:"Tatiana S.",email:"tatiana@example.com",phone:"+44 7700 900 123",save:true};
ACC.notif=ACC.notif===undefined?true:ACC.notif;
ACC.osBlocked=!!ACC.osBlocked;ACC.noApps=!!ACC.noApps;
ACC.initials=function(){const d=ACC.details;const src=d.name||d.email||"";const parts=src.split(/\s+/).filter(Boolean);return parts.length?parts.slice(0,2).map(p=>p[0].toUpperCase()).join(""):"·"};
ACC.hasDetails=()=>!!(ACC.details.name||ACC.details.email||ACC.details.phone);

/* ids: APP-ACCOUNT-028 APP-ACCOUNT-040 – external links fail with a toast when the device has no app for them */
window.accExternal=function(msg,kind){if(ACC.noApps){App.toast("Couldn't open that on this device");return false}App.toast(msg);return true};
/* ids: APP-ACCOUNT-026 APP-ORDERS-039 APP-ORDERS-040 */
window.accWhatsApp=function(orderCode){
  const text=orderCode?`Hello Floritta, I have a question about order #${orderCode}.`:"";
  App.sheet(`<div class="sh-head"><div class="h3">WhatsApp</div>${close}</div><div class="sh-body"><p class="soft sm" style="margin:0 0 12px">Opens WhatsApp with our shop number +44 7387 939120${text?" and this message ready to send:":"."}</p>${text?`<div class="panel sm">${esc(text)}</div>`:""}<p class="xs muted" style="margin:12px 0 0">Changes, cancellations and special requests are handled here by a person, 8:00–22:00.</p></div><div class="sh-foot"><button class="btn" onclick="App.closeSheet();window.accExternal('Opening WhatsApp…','wa')">Open WhatsApp</button></div>`);
};
/* ids: APP-ACCOUNT-032 APP-ACCOUNT-037 APP-TRACK-002 – pages of floritta.uk open inside the app (WebView) with a title */
window.accOpenWeb=function(title,url){
  App.sheet(`<div class="sh-head"><div class="h3">${esc(title)}</div>${close}</div><div class="sh-body"><div class="panel" style="min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div class="caps muted">In-app browser</div><div class="sm mt8">${esc(url)}</div><div class="xs muted mt8">The website page loads here. Nothing from it is linked to this phone's data.</div></div></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Close</button><button class="btn" onclick="App.toast('Opened in Safari')">Open in browser</button></div>`,{full:true});
};

window.mount_account=function(){
  const guest=ACC.mode==="guest"||(ACC.mode==="details"&&!ACC.hasDetails());
  $("#a-guest").hidden=!guest;$("#a-head").hidden=guest;
  $("#a-av").textContent=ACC.initials();
  $("#a-nm").textContent=ACC.details.name||ACC.details.email||"";
  $("#a-em").textContent=ACC.mode==="signed"?(ACC.details.email||"")+" · signed in by phone":(ACC.details.email||ACC.details.phone||"");
  const n=App.state.fav.size;$("#a-fav-n").textContent=n?n+(n===1?" bouquet":" bouquets"):"None yet";
  const on=ACC.orders?ACC.orders.length:0;$("#a-ord-n").textContent=ACC.ordersEmpty||!on?"None yet":on+(on===1?" order":" orders");
  const an=ACC.addresses?ACC.addresses.length:0;$("#a-addr-n").textContent=an?an+" saved":"None yet";
  const sw=$("#a-notif");sw.classList.toggle("on",ACC.notif&&!ACC.osBlocked);
  $("#a-notif-d").textContent=ACC.osBlocked?"Off in your phone’s Settings – allow Floritta notifications there":"Reminder nudges before your dates";
  $("#a-forget").hidden=!(ACC.hasDetails()||(ACC.addresses&&ACC.addresses.length));
  $("#a-logout").hidden=ACC.mode!=="signed";$("#a-create").hidden=ACC.mode==="signed";
  App.$$("#s-account .chip[data-mode]").forEach(c=>c.classList.toggle("on",c.dataset.mode===ACC.mode));
  $("#a-demo-blocked").classList.toggle("on",ACC.osBlocked);$("#a-demo-noapps").classList.toggle("on",ACC.noApps);
};
/* ids: APP-ACCOUNT-013 APP-ACCOUNT-014 APP-ACCOUNT-015 APP-ACCOUNT-016 */
window.acctNotif=function(){
  const sw=$("#a-notif");
  if(sw.classList.contains("on")){ACC.notif=false;window.mount_account();App.toast("Reminder notifications off · scheduled nudges removed");return}
  if(ACC.osBlocked){App.sheet(`<div class="sh-head"><div class="h3">Notifications</div></div><div class="sh-body"><p class="soft" style="margin:0 0 8px">Notifications are blocked for Floritta. Turn them on in Settings.</p></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Cancel</button><button class="btn" onclick="App.closeSheet();App.toast('Opening iOS Settings → Floritta')">Open settings</button></div>`);return}
  App.sheet(`<div class="sh-head"><div class="h3">“Floritta” would like to send you notifications</div></div><div class="sh-body"><p class="soft sm" style="margin:0 0 8px">System permission prompt. Notifications may include alerts, sounds and icon badges.</p></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet();App.toast('Permission declined · switch stays off')">Don’t allow</button><button class="btn" onclick="App.closeSheet();window.ACC.notif=true;window.mount_account();App.toast('Reminder notifications on · nudges rescheduled')">Allow</button></div>`);
};
/* ids: APP-ACCOUNT-030 APP-ACCOUNT-031 */
window.acctAbout=function(){
  const tick='<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>';
  const facts=["Open every day 8:00–22:00","Same-day delivery across London – order by 22:00","A photo of your bouquet before it leaves the shop","Free delivery on orders over £120","Google 4.6 · 590 reviews","British Florist Association finalist 2026","80 Willow Walk, Bermondsey, London SE1 5SY"];
  App.sheet(`<div class="sh-head"><div class="h3">About Floritta</div>${close}</div><div class="sh-body"><p class="soft" style="margin:0">A family flower shop in Bermondsey. Every bouquet is hand-tied by our florists on the day it is delivered, and photographed before it leaves.</p><ul class="about">${facts.map(f=>`<li>${tick}<span>${f}</span></li>`).join("")}</ul></div><div class="sh-foot"><button class="btn" onclick="App.closeSheet()">Close</button></div>`);
};

window.acctDelete=function(){
  App.sheet(`<div class="sh-head"><div class="h3">Delete your account?</div></div><div class="sh-body"><p class="soft" style="margin:0 0 8px">This asks our team to delete your floritta.uk account and its data. We send an email from your email app – nothing is deleted from this phone, and the request is handled by a person within 30 days.</p><div class="panel sm mt8"><div class="caps muted">Email draft</div><div class="mt8">To: info@floritta.uk<br>Subject: Please delete my Floritta account<br><br>Name:<br>Email used for the account:</div></div></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Cancel</button><button class="btn --accent" onclick="App.closeSheet();if(window.ACC.noApps){App.toast('<span class=accent>No email app found – please write to info@floritta.uk</span>')}else{App.toast('Opening your email app with the request')}">Write the email</button></div>`);
};
/* ids: APP-ACCOUNT-038 APP-ACCOUNT-039 */
window.acctForget=function(){
  App.confirm("Forget your details?","Your name, contacts and saved addresses are removed from this phone. Orders and reminders stay.","Forget",()=>{ACC.details={name:"",email:"",phone:"",save:false};ACC.addresses=[];ACC.mode="guest";window.mount_account();App.toast("Details removed from this phone")});
};
document.addEventListener("fav",()=>{if(document.getElementById("s-account").classList.contains("on"))window.mount_account()});
})();
</script>
