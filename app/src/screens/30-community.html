<style>
/* ---- garden ---- */
#s-garden .bed{margin-top:4px}
#s-garden .bed-in{aspect-ratio:16/10;background:var(--silver);position:relative;overflow:hidden}
#s-garden .bed-in svg{width:100%;height:100%;display:block}
#s-garden .stem{cursor:pointer;transition:opacity .3s}
#s-garden .stem path,#s-garden .stem ellipse,#s-garden .stem circle,#s-garden .stem line{stroke:var(--ink);fill:none;stroke-width:1.1;stroke-linecap:round}
#s-garden .stem .st{stroke-dasharray:1;stroke-dashoffset:1;animation:gdnGrow .9s var(--m-ease) forwards}
#s-garden .stem .hd{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:gdnHead .6s var(--m-ease) forwards}
#s-garden .stem.on path,#s-garden .stem.on ellipse,#s-garden .stem.on circle{stroke-width:1.8}
#s-garden .bed-in.sel .stem:not(.on){opacity:.4}
#s-garden .stem .lbl{font-family:var(--f-body);font-size:7px;letter-spacing:.08em;text-transform:uppercase;fill:var(--grey);stroke:none}
#s-garden .ground{stroke:var(--light);stroke-width:1}
@keyframes gdnGrow{to{stroke-dashoffset:0}}
#s-garden .bed-in.done .stem .st{stroke-dashoffset:0;animation:none}
#s-garden .bed-in.done .stem .hd{transform:scale(1);animation:none}
@keyframes gdnHead{to{transform:scale(1)}}
#s-garden .pcard{margin-top:12px;display:flex;gap:14px;align-items:center;animation:fu .4s var(--m-ease) both}
#s-garden .pcard .av,#s-garden .prow .av{width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;flex:none}
#s-garden .pcard .btn{flex:none}
#s-garden .streak{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
#s-garden .streak i{aspect-ratio:1;border:1px solid var(--light);display:grid;place-items:center;position:relative;font-style:normal}
#s-garden .streak i.f{background:var(--ink);border-color:var(--ink)}
#s-garden .streak i.t{border-color:var(--ink)}
#s-garden .streak i svg{width:70%;height:70%;stroke:var(--paper);fill:none;stroke-width:1.4}
#s-garden .streak i.bloom svg{animation:gdnHead .6s var(--m-ease) both;transform-box:fill-box;transform-origin:center}
#s-garden .prow{display:flex;align-items:center;gap:14px;padding:14px var(--gutter);border-bottom:1px solid var(--hair);width:100%;text-align:left}
#s-garden .prow .sz{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);white-space:nowrap}
#s-garden .prow.late .d{color:var(--accent)}
#s-garden .season{display:flex;align-items:center;gap:14px;width:100%;padding-top:4px;padding-bottom:4px}
#s-garden .sq4{display:flex;gap:5px;flex:none}
#s-garden .sq4 i{width:14px;height:14px;border:1px solid var(--light)}
#s-garden .sq4 i.f{background:var(--ink);border-color:var(--ink)}
#s-garden .relc{display:flex;gap:8px;flex-wrap:wrap}

/* ---- living ---- */
#s-living .bloom-wrap{display:flex;justify-content:center;padding:8px 0 4px}
#s-living #lv-flower svg{width:260px;height:260px;display:block}
#s-living .pt{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%;transform:scale(.08) rotate(0deg);opacity:0;transition:transform 1.6s var(--m-ease),opacity 1s}
#s-living .open .pt{transform:scale(1) rotate(0deg);opacity:1}
#s-living .day5 .pt{transform:scale(.86) rotate(0deg);opacity:1}
#s-living .ctr{fill:none;stroke:var(--ink);stroke-width:1.1}
#s-living .lv-t1{min-height:2.2em}
#s-living .lv-t2{opacity:0;transition:opacity .9s;min-height:1.5em}
#s-living .lv-t2.in{opacity:1}
#s-living .lv-real{display:flex;gap:14px;align-items:center;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:14px 0}
#s-living .lv-real img{width:56px;height:70px;object-fit:cover;flex:none}
#s-living .react{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
#s-living .react button,.lv-react button{border:1px solid var(--light);padding:14px 12px;display:flex;align-items:center;gap:10px;font-size:14px;text-align:left;transition:all var(--m-fast)}
.lv-react{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.lv-react button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;flex:none}
.lv-react button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}

/* ---- petals ---- */
#s-petals .pt-big{font-family:var(--f-display);font-weight:300;font-size:72px;line-height:1;display:flex;align-items:baseline;gap:12px}
#s-petals .pt-unit{font-family:var(--f-body);font-size:12px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey)}
#s-petals .ladder{position:relative;height:64px}
#s-petals .ladder .ln{position:absolute;left:0;right:0;top:9px;height:1px;background:var(--light)}
#s-petals .ladder .ln i{position:absolute;left:0;top:0;height:1px;background:var(--ink);width:0;transition:width .9s var(--m-ease)}
#s-petals .ladder .nd{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--grey);white-space:nowrap}
#s-petals .ladder .nd:first-child{transform:none;align-items:flex-start}
#s-petals .ladder .nd:last-child{transform:translateX(-100%);align-items:flex-end}
#s-petals .ladder .nd b{width:19px;height:19px;border:1px solid var(--light);background:var(--paper);display:block}
#s-petals .ladder .nd.done b{background:var(--ink);border-color:var(--ink)}
#s-petals .ladder .nd.now{color:var(--ink);font-weight:500}
#s-petals .ladder .nd.now b{border-color:var(--ink);box-shadow:0 0 0 4px var(--accent-bg)}
#s-petals .earn .val{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
#s-petals .perk{padding:14px 0;border-bottom:1px solid var(--hair)}
#s-petals .perk .tt{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
#s-petals .perk .tt .tag{margin-left:8px}
#s-petals .perk ul{margin:6px 0 0;padding-left:16px;font-size:14px;color:var(--graphite)}
#s-petals .perk.locked{color:var(--grey)}
#s-petals .spend{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#s-petals .spend .it{border:1px solid var(--hair);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:150px}
#s-petals .spend .it svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.5}
#s-petals .spend .it .n{font-size:14px;flex:1}
#s-petals .spend .it .c{font-family:var(--f-display);font-size:22px;line-height:1}
#s-petals .spend .it .c small{font-family:var(--f-body);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);margin-left:4px}
#s-petals .hist .val.neg{color:var(--accent)}
#s-petals .hist .val.pos{color:var(--ink)}

/* ---- care ---- */
#s-care .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
#s-care .days div{border:1px solid var(--light);padding:10px 0 8px;text-align:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
#s-care .days div b{display:block;font-family:var(--f-display);font-size:22px;font-weight:300;color:var(--ink);line-height:1;margin-bottom:4px}
#s-care .days div.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
#s-care .days div.done b{color:var(--paper)}
#s-care .days div.now{border-color:var(--ink);color:var(--ink)}
#s-care .task{display:flex;align-items:center;gap:14px;padding:16px var(--gutter);border-bottom:1px solid var(--hair);width:100%;text-align:left}
#s-care .task .bx{width:24px;height:24px;border:1px solid var(--light);display:grid;place-items:center;flex:none;transition:all var(--m-fast)}
#s-care .task .bx svg{width:14px;height:14px;stroke:var(--paper);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
#s-care .task.on .bx{background:var(--ink);border-color:var(--ink)}
#s-care .task.on .bx svg{animation:gdnGrow .45s var(--m-ease) forwards}
#s-care .task.on .l{color:var(--grey);text-decoration:line-through}
</style>
<style>

.cmz .post .ph img{width:100%;height:100%;object-fit:cover}
.cmz .post .ph .q{position:absolute;inset:0;display:flex;align-items:flex-end;padding:20px;background:linear-gradient(180deg,rgba(30,26,23,0) 40%,rgba(30,26,23,.6) 100%);color:#fff;font-family:var(--f-display);font-size:28px;font-weight:300;line-height:1.1}

.cmz .post .ph .ba>div{position:relative;overflow:hidden}
.cmz .post .ph .ba>div img{width:100%;height:100%;object-fit:cover}

.cmz .post .rep .r b{font-weight:500}
.cmz .post .vc{padding:8px var(--gutter) 0;font-size:13px;color:var(--grey)}
#s-community .more{margin:32px var(--gutter) 0}
#s-community .fend{padding:24px var(--gutter) 8px;text-align:center;color:var(--grey);font-size:13px}
