<section class="scr" id="s-flora" data-nav="Flora (AI florist)" data-group="Extras">
  <div class="appbar">
    <button class="ib" onclick="App.back()" aria-label="Back">${back}</button>
    <div class="ava">${flower}</div>
    <div class="ttl-wrap"><div class="ttl">Flora</div><div class="st">Usually replies instantly</div></div>
    <button class="ib" onclick="App.go('help')" aria-label="Help">${help}</button>
  </div>
  <div class="scr-body" id="fl-body"><div class="chat" id="fl-chat"></div></div>
  <div class="inbar">
    <button class="ib" onclick="App.toast('Listening… say what you need')" aria-label="Voice">${mic}</button>
    <input class="input" id="fl-input" placeholder="Ask Flora anything" onkeydown="if(event.key==='Enter')Extras.flSend()">
    <button class="ib send" onclick="Extras.flSend()" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
  </div>
</section>
