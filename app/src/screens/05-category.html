<!-- Экран категории /category/[slug] – реестр 02-shop-search-saved.md. Логика – ShopX в 04-shop.html (mount_category, Shop.*). -->
<section class="scr" id="s-category" data-tab="shop" data-nav="Category" data-group="Shop">
  <!-- ids: APP-CAT-002 APP-CAT-003 APP-CAT-004 – заголовок из ?title=/каталога/slug, счётчик «N designs» (live region), назад и лупа -->
  <div class="appbar">
    <button class="ib" onclick="App.back('shop')" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="f1" style="min-width:0"><div class="ttl" id="cat-title">Bouquets</div><div class="xs muted" id="cat-count" style="margin-top:4px" aria-live="polite">13 designs</div></div>
    <button class="ib" onclick="App.go('search')" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
  </div>
  <div class="scr-body has-tab" id="catx-body">
    <div class="sticky">
      <!-- ids: APP-CAT-006 APP-CAT-007 APP-CAT-008 – липкая панель: сортировка (подпись = текущая) и «Filter» с бейджем числа активных фильтров -->
      <div class="tools pad">
        <button class="tool" onclick="Shop.sortSheet()"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span id="cat-sort-l">Recommended</span></button>
        <button class="tool" onclick="Shop.filterSheet()"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span>Filter</span><i class="n" id="cat-filter-n"></i></button>
      </div>
      <!-- ids: APP-CAT-009 – быстрые чипы Ready now / Pet-friendly / Under £60 / Sale -->
      <div class="chips" id="cat-quick"></div>
    </div>
    <!-- ids: APP-CAT-017 – ряд снимаемых чипов -->
    <div class="chips applied" id="cat-applied"></div>
    <!-- ids: APP-CAT-018 APP-CAT-019 APP-CAT-026 APP-SHOP-001 APP-SHOP-002 APP-SHOP-003 APP-SHOP-004 APP-SHOP-005 APP-SHOP-006 APP-SHOP-007 – сетка 2 колонки (скелетон 4 карточек в первые 400 мс), карточки ShopX.card: фото 4:5, до 2 меток, сердце, название 2 строки, цена/старая, квадратная кнопка-сумка (быстрое добавление, галочка 1,3 с, тост «Added to bag · View bag», дата заказа) -->
    <div class="grid-2 mt16" id="cat-grid"></div>
    <!-- ids: APP-CAT-020 APP-CAT-021 – «Show more · N left» по 8, конец списка -->
    <div class="pad mt24" id="cat-more"></div>
    <!-- ids: APP-CAT-022 APP-CAT-023 APP-CAT-024 – фильтры ничего не нашли -->
    <div class="empty" id="cat-empty" hidden>
      <div class="h2">Nothing matches just yet</div>
      <p class="soft sm">Try fewer filters – or let Flora find something close.</p>
      <div class="flex g8"><button class="btn --secondary --sm" onclick="Shop.clear()">Clear filters</button><button class="btn --ghost --sm" onclick="App.go('flora')">Ask Flora</button></div>
    </div>
    <!-- ids: APP-CAT-001 APP-CAT-025 – раздел пуст или slug неизвестен (deep link) -->
    <div class="empty" id="catx-empty-coll" hidden>
      <div class="h2">No designs here yet</div>
      <p class="soft sm">This collection is empty right now – have a look at everything else.</p>
      <button class="btn --secondary --sm" onclick="Shop.browseAll()">Browse all flowers</button>
    </div>
    <!-- ids: APP-CAT-005 – фильтры из query (deep link ?price=&sort=&delivery=&colour=&pet=&ready=&under60=&sale=) – примеры на экране «Shop · demo states» -->
    <div class="pad mt24 tc"><button class="textbtn" style="border:0;color:var(--grey)" onclick="App.go('shx-demo')">Deep links &amp; demo states</button></div>
  </div>
</section>
<!-- ids: APP-SHOP-008 APP-CAT-010 APP-CAT-011 APP-CAT-012 APP-CAT-013 APP-CAT-014 APP-CAT-015 APP-CAT-016 – шторки сортировки и фильтра (App.sheet: закрываются крестиком, тапом по фону, системной «назад»; свайпа вниз нет): Delivery Today/Tomorrow + подпись по времени (после 22:00 акцентом), Price 5 диапазонов, Colour 7 свотчей (ИЛИ), переключатели Pet-friendly / Ready now, Clear (сортировка остаётся), «Show N designs» / «No designs» неактивна -->
<style>
/* category */
#s-category .sticky{position:sticky;top:0;z-index:6;background:var(--paper);padding:4px 0 10px;border-bottom:1px solid var(--hair)}
#s-category .tools{display:flex;gap:8px;margin-bottom:10px}
#s-category .tool{flex:1;height:44px;border:1px solid var(--light);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:12px;letter-spacing:var(--ls-caps);text-transform:uppercase;position:relative;transition:border-color var(--m-fast)}
#s-category .tool:active{border-color:var(--ink)}
#s-category .tool svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#s-category .tool .n{font-style:normal;min-width:18px;height:18px;padding:0 5px;background:var(--ink);color:var(--paper);font-size:10px;display:flex;align-items:center;justify-content:center;letter-spacing:0}
#s-category .tool .n:empty{display:none}
#s-category .applied{margin-top:12px}
#s-category .applied:empty{display:none}
#s-category .applied .chip{background:var(--silver);border-color:var(--silver);padding-right:8px}
#s-category .applied .chip svg{width:14px;height:14px}
#s-category .empty{padding:56px var(--gutter) 24px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#s-category .empty p{margin:0 0 10px}
#s-category .empty[hidden]{display:none}
/* filter sheet */
.fsheet .fs-sec{padding:16px 0;border-bottom:1px solid var(--hair)}
.fsheet .fs-sec:last-child{border-bottom:0}
.fsheet .fs-t{font-size:12px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);margin-bottom:12px}
.fsheet .fs-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair)}
.fsheet .fs-row:last-child{border-bottom:0}
.fsheet .fs-row .l{font-size:15px}.fsheet .fs-row .d{font-size:13px;color:var(--grey);margin-top:1px}
.fsheet .wrap{display:flex;flex-wrap:wrap;gap:8px}
.fsheet .sw{width:44px;height:44px;border:1px solid var(--light);display:grid;place-items:center;position:relative;transition:border-color var(--m-fast)}
.fsheet .sw i{display:block;width:24px;height:24px;border:1px solid rgba(30,26,23,.12)}
.fsheet .sw.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fsheet .sw.on::after{content:"";position:absolute;right:-1px;top:-1px;width:12px;height:12px;background:var(--ink)}
.fsheet .swl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);text-align:center;margin-top:4px}
.fsheet .accent{color:var(--accent)}
</style>
