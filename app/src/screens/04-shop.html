<script>
/* ShopX – логика раздела «Магазин, категория, поиск, избранное» по реестру 02-shop-search-saved.md.
   Переопределяет mount_shop / mount_category / mount_search / mount_saved и методы window.Shop из шелла
   (шелл не трогаем – правило BRIEF №1). Всё локально, как в приложении: каталог, фильтры, поиск – на устройстве. */
(function(){
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)], P=window.PRODUCTS;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const X=window.ShopX={late:false,recent:["Peonies","Red roses","Birthday"],OC:{day:null,win:null,card:null,anon:false}};

  /* ---- время: Europe/London, отсечка same-day 22:00; X.late – демо-состояние «после 10 pm» ---- */
  X.now=()=>{const d=new Date();if(X.late){d.setHours(22,30,0,0)}return d};
  X.sameDayOpen=()=>X.now().getHours()<22;

  /* ---- каталог: категории, поводы, виртуальные коллекции ---- */
  const COLOUR={1:"peach",2:"mixed",3:"pink",4:"white",5:"pink",6:"red",7:"pink",8:"pink",9:"mixed",10:"white",11:"mixed",12:"pink",13:"purple"};
  const isPet=p=>p.t.some(t=>/pet/i.test(t)), isReady=p=>!!p.fast, isSale=p=>!!p.o||p.t.some(t=>/sale/i.test(t));
  const CATS={
    bouquets:{n:"Bouquets",img:"img/pink-garden.webp",ids:()=>P.map(p=>p.id)},
    hydrangeas:{n:"Hydrangeas",img:"img/pink-manifesto.webp",ids:()=>[3,12,2]},
    roses:{n:"Roses",img:"img/red-roses.webp",ids:()=>P.filter(p=>p.cat==="roses").map(p=>p.id)},
    balloons:{n:"Balloons",img:"img/addon-balloon.webp",ids:()=>[]},
    gifts:{n:"Gifts",img:"img/charmingly.webp",ids:()=>[8,9,11]},
    "flower-boxes":{n:"Flower boxes",img:"img/daydream-basket.webp",ids:()=>[8,9]},
    plants:{n:"Plants",img:"img/veronica.webp",ids:()=>[10,4,9,7]},
    "flower-baskets":{n:"Flower baskets",img:"img/peony-basket.webp",ids:()=>P.filter(p=>p.cat==="baskets").map(p=>p.id)},
    "autumn-flowers":{n:"Autumn flowers",img:"img/peach-posy.webp",ids:()=>[1,13,11,12]},
    letterbox:{n:"Letterbox",ids:()=>[5,7,1,4,13]},
    "add-ons":{n:"Add-ons",ids:()=>[11,3,13,10,2]}
  };
  const OCC={birthday:{n:"Birthday",ids:[1,2,12,11,7,5]},anniversary:{n:"Anniversary",ids:[6,3,8,13]},sympathy:{n:"Sympathy",ids:[4,10,9]},"thank-you":{n:"Thank you",ids:[1,7,5,13]},"new-baby":{n:"New baby",ids:[4,10,7,1]},"get-well":{n:"Get well",ids:[1,5,10,13]},congratulations:{n:"Congratulations",ids:[12,2,11,6]},"just-because":{n:"Just because",ids:[2,5,7,12,1,13,10]},"mothers-day":{n:"Mother’s Day",ids:[]}};
  const VIRT={all:{n:"All flowers",f:()=>true},sale:{n:"Sale",f:isSale},"ready-now":{n:"Ready now",f:isReady},"pet-friendly":{n:"Pet-friendly",f:isPet},"best-selling":{n:"Best sellers",f:p=>p.cat==="bestsellers"||p.t.some(t=>/best/i.test(t))}};
  const TILE_ORDER=["bouquets","hydrangeas","roses","balloons","gifts","sympathy","flower-boxes","plants","flower-baskets","autumn-flowers","all"];
  const catName=p=>({bestsellers:"Best sellers",roses:"Roses",baskets:"Flower baskets"})[p.cat]||"Bouquets";
  const slugify=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const humanise=s=>{s=String(s||"").replace(/-/g," ").trim();return s?s[0].toUpperCase()+s.slice(1):"Category"};
  /* APP-CAT-001: slug → коллекция: категория, повод, all/sale/ready-now/pet-friendly/best-selling, <colour>-flowers; пустой = all; неизвестный → пусто */
  X.resolve=function(slug){
    slug=slugify(slug||"all")||"all";
    if(CATS[slug])return {slug,n:CATS[slug].n,kind:"cat",pool:CATS[slug].ids().map(App.product).filter(Boolean)};
    if(OCC[slug])return {slug,n:OCC[slug].n,kind:"occ",pool:OCC[slug].ids.map(App.product).filter(Boolean)};
    if(VIRT[slug])return {slug,n:VIRT[slug].n,kind:"virt",pool:P.filter(VIRT[slug].f)};
    const m=slug.match(/^([a-z]+)-flowers$/);
    if(m&&Object.values(COLOUR).includes(m[1]))return {slug,n:humanise(slug),kind:"colour",pool:P.filter(p=>COLOUR[p.id]===m[1])};
    return {slug,n:null,kind:"unknown",pool:[]};
  };
  X.occasions=()=>Object.keys(OCC).map(k=>({slug:k,n:OCC[k].n,count:OCC[k].ids.length}));
  X.categories=()=>Object.keys(CATS).map(k=>({slug:k,n:CATS[k].n,count:CATS[k].ids().length}));
  X.catName=catName;X.COLOUR=COLOUR;X.isPet=isPet;X.isReady=isReady;X.isSale=isSale;

  /* ---- цены ---- */
  const PRICE={under50:{l:"Under £50",a:0,b:50},"50-75":{l:"£50–£75",a:50,b:75},"75-100":{l:"£75–£100",a:75,b:100},"100-150":{l:"£100–£150",a:100,b:150},"150plus":{l:"£150+",a:150,b:1e9},"50-100":{l:"£50–£100",a:50,b:100},"100plus":{l:"£100+",a:100,b:1e9}};
  const SHOP_PRICE=["under50","50-100","100plus"], SHEET_PRICE=["under50","50-75","75-100","100-150","150plus"];
  const inPrice=(p,k)=>{const r=PRICE[k];return r?p.p>=r.a&&p.p<r.b:true};
  const SORTS=[["rec","Recommended"],["asc","Price low–high"],["desc","Price high–low"],["new","Newest"]];
  const SWATCH={pink:"#e9b9c4",white:"#f6f1ea",red:"#9b2f38",blue:"#aebfd9",purple:"#c9b6d9",peach:"#f3c3a6",mixed:"linear-gradient(135deg,#e9b9c4 0 33%,#f3c3a6 33% 66%,#c9b6d9 66%)"};

  /* ---- выбор доставки на весь заказ (стор order-choice.v1 – на устройстве) ---- */
  X.days=()=>App.nextDays(7);
  /* APP-SHOP-006 / APP-PDP-026: сохранённый выбор ещё доступен – остаётся; иначе ближайший день (сегодня до 22:00, иначе завтра) и окно «any» */
  X.ensureDelivery=function(){
    const oc=X.OC;const open=X.sameDayOpen();
    const stale=oc.day===null||oc.day>6||(oc.day===0&&!open);
    if(stale){oc.day=open?0:1;oc.win="any"}
    if(oc.day===0)oc.win="today";
    X.syncDelivery();
  };
  X.syncDelivery=function(){const d=X.days()[X.OC.day||0];App.state.delivery={date:d.d,label:d.label,win:X.winLabel(X.OC.win)}};
  X.winLabel=k=>({today:"Today, by 10 pm",any:"Any time","9-13":"9–13","13-18":"13–18","18-23":"18–23"})[k]||null;

  /* ---- карточка в сетке (APP-SHOP-001…007) ---- */
  X.card=function(p){
    const tags=(p.t||[]).slice(0,2).map(t=>{const [k,v]=t.includes(":")?t.split(":"):["soft",t];return `<span class="tag --${k}">${v}</span>`}).join("");
    return `<div class="card shx-card" data-id="${p.id}">
      <div class="ph" onclick="App.go('pdp',{id:${p.id}})"><img loading="lazy" src="${p.img}" alt=""><div class="tags">${tags}</div>
        <button class="fav ${App.state.fav.has(p.id)?"on":""}" onclick="event.stopPropagation();App.toggleFav(${p.id},this)" aria-label="${App.state.fav.has(p.id)?"Remove from favourites":"Save to favourites"}">${App.icon("heart")}</button></div>
      <div class="nm" onclick="App.go('pdp',{id:${p.id}})">${p.n}</div>
      <div class="prow"><div class="pr">${App.fmt(p.p)}${p.o?`<s>${App.fmt(p.o)}</s>`:""}</div><button class="qa" onclick="ShopX.quickAdd(${p.id},this)" aria-label="Add to bag">${App.icon("bag")}</button></div>
    </div>`;
  };
  /* APP-SHOP-005…007: быстрое добавление – размер по умолчанию («as on the photo»), без доп., qty 1; одинаковая строка суммирует qty, макс. 20; тост с «View bag» */
  X.quickAdd=function(id,btn){
    const line=App.state.bag.find(l=>l.id==id&&l.size==="Standard"&&!l.addons.length);
    if(line&&line.qty>=20){App.toast("You already have 20 of this design in your bag");return}
    App.addToBag(id,{size:"Standard",silent:true});X.ensureDelivery();App.haptic();
    if(btn){btn.classList.add("done");btn.innerHTML=App.icon("check");setTimeout(()=>{btn.classList.remove("done");btn.innerHTML=App.icon("bag")},1300)}
    App.toast("Added to bag",{action:{label:"View bag",onclick:"App.tab('bag')"},ms:3200});
  };

    if(!list.length){b.innerHTML=`<!-- APP-SAVED-008 --><div class="empty"><div class="h2">Nothing saved yet</div><p class="soft sm">Tap the heart on any design and it will wait for you here.</p><button class="btn --secondary" onclick="App.go('category',{slug:'best-selling'})">Browse bestsellers</button></div>`;return}
    b.innerHTML=`<!-- APP-SAVED-003 --><div class="sub">${list.length} design${list.length===1?"":"s"} · tap the heart to remove</div>
      <div class="grid-2 mt16">${list.map(X.card).join("")}</div>
      <div class="pad mt32"><button class="btn --ghost --block" onclick="App.go('category',{slug:'bouquets'})">Find more to save</button></div>
      <p class="xs muted tc pad mt12">Saved on this phone only · not linked to your account</p>`;
  }
  document.addEventListener("fav",()=>{if(App.state.current==="saved")setTimeout(renderSaved,420);else renderSaved()});
})();
</script>
