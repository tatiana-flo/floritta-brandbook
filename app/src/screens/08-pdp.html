<!-- ids: APP-PDP-014 – компактная шапка после прокрутки за галерею: назад, название, «цена · размер», сердце -->

<!-- ids: APP-PDP-003 APP-PDP-004 APP-PDP-005 APP-PDP-006 APP-PDP-007 APP-PDP-008 APP-PDP-009 APP-PDP-010 APP-PDP-011 APP-PDP-012 APP-PDP-013 APP-PDP-015 APP-PDP-016 APP-PDP-017 APP-PDP-018 APP-PDP-019 APP-PDP-020 APP-PDP-021 APP-PDP-022 APP-PDP-023 APP-PDP-024 APP-PDP-025 APP-PDP-026 APP-PDP-027 APP-PDP-028 APP-PDP-029 APP-PDP-030 APP-PDP-031 APP-PDP-032 APP-PDP-033 APP-PDP-034 APP-PDP-035 APP-PDP-036 APP-PDP-037 APP-PDP-038 APP-PDP-039 APP-PDP-040 APP-PDP-041 APP-PDP-042 APP-PDP-043 APP-PDP-044
     Тело рендерит PDP.mount (шелл) + PDPX: галерея 4:5 со свайпом, точками, скелетоном под фото, метками (≤3, без Pet-friendly), плавающие Back/Share/Heart, «Tap to zoom» → просмотр (свайп, двойной тап ×2,5, «Photo N of M», «Close photos»); категория капсом, название, цена размера + «was» + «−N%»; рейтинг «4.6 · Floritta on Google · 590 reviews»; обещание доставки с отсчётом до 22:00 / «closed for today»; размеры с «Most chosen» и «As on the photo» (по умолчанию); 7 дней («Today» после 22:00 неактивен), окна «Today, by 10 pm» / Any time, 9–13, 13–18, 18–23 (недоступное зачёркнуто), подпись с галочкой, «saved on this phone»; «Make it special»: открытка Free → Write/Edit (шторка: 150 знаков, счётчик, 4 подсказки, Anonymous sender, ошибка «Add a few words first», Add card → тост, Remove), доп. товары «+ Add»/«Added»; аккордеон «The details» (What’s inside открыт, Care guide, Delivery & returns £120/£7.95, Pet-friendly?); «Anything more?» ≤3 строк с «+ Add»; «You may also like» ≤6 карточек с сердцем без сумки + «Shop all». -->

<!-- ids: APP-PDP-045 APP-PDP-046 APP-PDP-047 APP-PDP-048 APP-PDP-049 – липкая панель: степпер 1–20, «Add to bag» с итогом (размер + доп.) × qty → «Added ✓» 1,3 с + тост «Added to bag · View bag»; «Buy now» словом под кнопкой – в корзину и сразу к данным доставки -->
<div class="cta-bar">
  <div class="qty"><button onclick="PDP.qty(-1)" aria-label="Less">−</button><span id="pdp-qty">1</span><button onclick="PDP.qty(1)" aria-label="More">+</button></div>
  <button class="btn" id="pdp-add" onclick="PDP.add()"><span>Add to bag</span><span class="btn-price" id="pdp-add-p"></span></button>
  <button class="btn --ghost" aria-hidden="true" tabindex="-1"></button>

<script>
/* PDPX – доводка страницы товара до реестра 03-product.md поверх window.PDP шелла. */
(function(){
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const X=window.ShopX, PDP=window.PDP;
  const SIZES=[{k:"Standard",x:0},{k:"Deluxe",x:25},{k:"Grand",x:55}];
  const WINS=[["any","Any time"],["9-13","9–13"],["13-18","13–18"],["18-23","18–23"]];
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const slug=p=>p.n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const PX=window.PDPX={id:null,qty:1,T:null};
  const orig=window.mount_pdp;

  window.mount_pdp=function(params){
    const id=(params&&params.id)||1;
    /* APP-PDP-001 / 002: товар по slug не найден → отдельный экран */
    if(!App.product(id)){setTimeout(()=>App.go("shx-pdp-404",{id},{replace:true}),0);return}
    /* APP-PDP-003: товар → товар сбрасывает выбор (размер, доп., qty) */
    if(PX.id!==id){PX.id=id;PX.qty=1}
    orig(params);
    const pr=App.product(id);
    /* APP-PDP-015: категория капсом */
    const caps=$("#s-pdp .info .caps");if(caps)caps.textContent=X.catName(pr);
    /* APP-PDP-007: до 3 меток без Pet-friendly */
    const gt=$("#s-pdp .gtags");if(gt){const keep=[...gt.children].filter(t=>!/pet/i.test(t.textContent)).slice(0,3);gt.innerHTML="";keep.forEach(t=>gt.appendChild(t))}
    /* APP-PDP-017: статичная строка рейтинга */
    const rr=$("#s-pdp .rrow > span:not(.stars)");if(rr)rr.innerHTML=`<b>4.6</b> · Floritta on Google · <u>590 reviews</u>`;
    /* APP-PDP-018: обещание доставки – свой отсчёт (каждые 30 с), шелловский таймер отключён переименованием элемента */
    const pm=$("#pdp-promise");if(pm)pm.id="pdpx-promise";
    tick();clearInterval(PX.T);PX.T=setInterval(tick,30000);
    /* APP-PDP-019…021: «Most chosen», «As on the photo» у размера по умолчанию */
    $$("#pdp-sizes .tile").forEach((t,i)=>{const bd=t.querySelector(".badge");if(bd)bd.textContent="Most chosen";if(i===0)t.insertAdjacentHTML("beforeend",'<span class="asph">As on the photo</span>')});
    /* APP-PDP-022…027: дата и окна на весь заказ */
    X.ensureDelivery();renderDelivery();
    /* APP-PDP-028: открытка – Write / Edit */
    cardLabel();
    /* APP-PDP-040: pet-friendly по флагу товара */
    $$("#s-pdp .acc details").forEach(d=>{if(/Pet-friendly/.test(d.querySelector("summary").textContent))d.querySelector(".acc-b").textContent=X.isPet(pr)?"Yes – this one is marked pet-friendly.":"Not marked pet-friendly. Keep it out of reach of curious cats and dogs – or ask Flora for a pet-safe alternative."});
    /* APP-PDP-041/042 и 043/044 */
    $$("#s-pdp .sec-head").forEach(h=>{const t=h.querySelector(".h2");if(!t)return;
      if(t.textContent==="Anything more?"){const pad=h.nextElementSibling;const minis=$$(".mini",pad).slice(0,3);pad.innerHTML="";minis.forEach(m=>{const mid=+(m.getAttribute("onclick").match(/id:(\d+)/)||[])[1];const row=document.createElement("div");row.className="pdpx-am";row.appendChild(m);row.insertAdjacentHTML("beforeend",`<button class="btn --secondary --xs" onclick="PDPX.addMore(${mid})">+ Add</button>`);pad.appendChild(row)});if(!minis.length){h.hidden=true;pad.hidden=true}}
      if(t.textContent==="You may also like"){const hs=h.nextElementSibling;$$(".add",hs).forEach(x=>x.remove());[...hs.children].slice(6).forEach(x=>x.remove())}
    });
    $("#pdp-body").insertAdjacentHTML("beforeend",`<div class="pad tc" style="padding-bottom:8px"><button class="textbtn" style="border:0;color:var(--grey)" onclick="App.go('shx-demo')">Prototype states</button></div>`);
    renderTotal();
  };

  function tick(){const el=$("#pdpx-promise");if(!el)return;const n=X.now();const cut=new Date(n);cut.setHours(22,0,0,0);const box=el.closest(".promise");
    if(n<cut){const ms=cut-n,h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);el.innerHTML=`Order within <b>${h} h ${String(m).padStart(2,"0")} m</b> for delivery today`;box&&box.classList.remove("closed")}
    else{el.innerHTML="Same-day orders are closed for today – delivery from <b>tomorrow</b>";box&&box.classList.add("closed")}}

  function renderDelivery(){
    const days=X.days(),open=X.sameDayOpen(),OC=X.OC;
    const dz=$("#pdp-days");if(!dz)return;
    /* APP-PDP-022 / 023 */
    dz.innerHTML=days.map((d,i)=>`<button class="day ${i===OC.day?"on":""}" ${i===0&&!open?'disabled aria-label="Today – closed for today"':""} onclick="PDPX.day(${i})"><span class="dl">${i===0?"Today":i===1?"Tmrw":d.label}</span><span class="dd">${d.day}</span><span class="dm">${d.mon}</span></button>`).join("");
    /* APP-PDP-024 / 025 */
    const w=$("#pdp-wins");
    w.innerHTML=OC.day===0?`<button class="chip on" ${open?"":'disabled aria-label="No longer available today"'} onclick="PDPX.win('today')">Today, by 10 pm</button>`:WINS.map(([k,l])=>`<button class="chip ${OC.win===k?"on":""}" onclick="PDPX.win('${k}')">${l}</button>`).join("");
    /* APP-PDP-027 / 026 */
    const d=days[OC.day];
    $("#pdp-dnote").innerHTML=`${App.icon("check")}${OC.day===0?"Same-day · hand-delivered by our courier":App.dateLabel(d.d)+" · photo of your bouquet before it leaves"}`;
    if(!$("#pdpx-dsaved"))$("#pdp-dnote").insertAdjacentHTML("afterend",'<div class="dsaved" id="pdpx-dsaved">Saved on this phone · applies to your whole order and to checkout</div>');
    X.syncDelivery();
  }
  PX.day=i=>{const OC=X.OC;OC.day=i;if(i===0)OC.win="today";else if(!OC.win||OC.win==="today")OC.win="any";renderDelivery();App.haptic()};
  PX.win=k=>{X.OC.win=k;renderDelivery();App.haptic()};

  /* ---- цена: (размер + доп.) × qty – APP-PDP-045/046 ---- */
  const sizeIdx=()=>Math.max(0,$$("#pdp-sizes .tile").findIndex(t=>t.classList.contains("on")));
  const addonIds=()=>$$("#pdp-addons .ad.on").map(a=>a.dataset.ad);
  const unit=()=>{const pr=App.product(PX.id);if(!pr)return 0;return pr.p+SIZES[sizeIdx()].x+addonIds().reduce((a,id)=>a+((ADDONS.find(x=>x.id===id)||{p:0}).p),0)};
  function renderTotal(){const ap=$("#pdp-add-p");if(ap)ap.textContent=App.fmt(unit()*PX.qty);const q=$("#pdp-qty");if(q)q.textContent=PX.qty}
  PDP.qty=d=>{PX.qty=Math.min(20,Math.max(1,PX.qty+d));renderTotal();App.haptic();if(PX.qty===20&&d>0)App.toast("Maximum 20 per design")};
  const oSize=PDP.size;PDP.size=i=>{oSize(i);renderTotal()};
  const oAddon=PDP.addon;PDP.addon=id=>{oAddon(id);renderTotal()};

  /* ---- открытка – APP-PDP-028/033/034/035 ---- */
  function cardLabel(){const el=$('#s-pdp .ad[data-ad="card"]');if(!el)return;const on=!!X.OC.card;el.classList.toggle("on",on);el.querySelector(".ab").textContent=on?"Edit":"Write"}
  const oSheet=PDP.cardSheet;PDP.cardSheet=function(){oSheet();const f=$("#sheet-inner .sh-foot");if(X.OC.card&&f&&!f.querySelector(".--secondary"))f.insertAdjacentHTML("afterbegin",'<button class="btn --secondary" onclick="PDP.cardRemove()">Remove</button>');const t=$("#pdp-msg");if(t)t.addEventListener("input",()=>{const e=$(".pdpx-err");e&&e.remove()})};
  const oSave=PDP.cardSave;PDP.cardSave=function(){const t=$("#pdp-msg");if(!t||!t.value.trim()){if(!$(".pdpx-err"))t.insertAdjacentHTML("afterend",'<div class="pdpx-err">Add a few words first</div>');App.haptic();return}
    oSave();X.OC.card=t.value.trim();cardLabel();renderTotal()};
  const oRemove=PDP.cardRemove;PDP.cardRemove=function(){oRemove();X.OC.card=null;cardLabel();renderTotal()};

  /* ---- «Anything more?» – APP-PDP-042: размер по умолчанию, qty 1, дату заказа не трогает ---- */
  PX.addMore=id=>{const p=App.product(id);if(!p)return;App.addToBag(id,{size:"Standard",silent:true});App.haptic();App.toast(`<b>${p.n}</b> added`,{action:{label:"View bag",onclick:"App.tab('bag')"},ms:3200})};

  /* ---- в корзину / Buy now – APP-PDP-047…049 ---- */
  PDP.add=function(){const btn=$("#pdp-add");const sz=SIZES[sizeIdx()];
    App.addToBag(PX.id,{size:sz.k,extra:sz.x,addons:addonIds(),qty:PX.qty,silent:true});X.ensureDelivery();App.haptic();
    const t=btn.innerHTML;btn.innerHTML="<span>Added ✓</span>";btn.classList.add("pop");setTimeout(()=>{btn.innerHTML=t;btn.classList.remove("pop");renderTotal()},1300);
    App.toast("Added to bag",{action:{label:"View bag",onclick:"App.tab('bag')"},ms:3200})};
  PDP.buyNow=function(){const sz=SIZES[sizeIdx()];App.addToBag(PX.id,{size:sz.k,extra:sz.x,addons:addonIds(),qty:PX.qty,silent:true});X.ensureDelivery();App.haptic();App.go(document.getElementById("s-checkout")?"checkout":"bag")};

  /* ---- зум – APP-PDP-008…010 ---- */
  PDP.zoom=function(i){const pr=App.product(PX.id);const tr=$("#pdp-tr");const imgs=$$("img",tr).map(im=>im.outerHTML);const k=typeof i==="number"?i:Math.round(tr.scrollLeft/tr.clientWidth);
    App.sheet(`<div class="sh-head"><div class="h3">${pr.n}</div><button class="ib" onclick="App.closeSheet()" aria-label="Close photos">${App.icon("close")}</button></div>
      <div class="sh-body"><div class="pdp-lb" id="pdp-lb" onscroll="PDPX.lbScroll(this)">${imgs.map(h=>`<div ondblclick="this.classList.toggle('z')">${h}</div>`).join("")}</div>
      <div class="flex jc-sb mt12 xs muted"><span>Pinch or double-tap to zoom</span><span id="pdpx-lbc" ${imgs.length>1?"":"hidden"}>Photo ${k+1} of ${imgs.length}</span></div></div>`,
      {full:true,onOpen:()=>{const lb=document.getElementById("pdp-lb");lb.scrollLeft=k*lb.clientWidth}})};
  PX.lbScroll=lb=>{const n=lb.children.length,k=Math.round(lb.scrollLeft/lb.clientWidth);const c=$("#pdpx-lbc");if(c)c.textContent=`Photo ${k+1} of ${n}`};

  /* ---- Share – APP-PDP-012: системное меню, «<Name> from Floritta – <url>» ---- */
  PDP.share=function(){const pr=App.product(PX.id);const url=`https://floritta.uk/product/${slug(pr)}`;const msg=`${pr.n} from Floritta – ${url}`;
    App.sheet(`<div class="sh-head"><div class="h3">Share</div><button class="ib" onclick="App.closeSheet()" aria-label="Close">${App.icon("close")}</button></div>
      <div class="sh-body pdpx-share"><div class="msg">${esc(msg)}</div>
      ${[["Copy link","Link copied"],["Messages","Opens Messages with the link"],["WhatsApp","Opens WhatsApp with the link"],["Mail","Opens Mail with the link"],["More…","System share sheet"]].map(([l,t])=>`<button class="row" onclick="App.closeSheet();App.toast('${t}')"><div class="rt"><div class="l">${l}</div></div>${App.icon("chev").replace("<svg",'<svg class="chev"')}</button>`).join("")}
      <p class="xs muted mt12" style="margin-bottom:0">On the phone this is the system share sheet.</p></div>`)};

  document.addEventListener("screen",e=>{if(e.detail.id!=="pdp")clearInterval(PX.T)});
})();
</script>
