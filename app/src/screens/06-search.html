<!-- Экран поиска /search – реестр 02-shop-search-saved.md. Логика – ShopX в 04-shop.html (mount_search, ShopX.search/groups/remember). -->
<section class="scr" id="s-search" data-nav="Search" data-group="Shop">

  <div class="appbar">
    <div class="input-wrap f1">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input class="input" id="search-in" type="search" enterkeyhint="search" placeholder="Search flowers, occasions…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
      <button class="xbtn" id="search-x" onclick="ShopX.clearQuery()" aria-label="Clear search" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></button>
    </div>
    <button class="textbtn" style="border:0" onclick="App.back('home')">Cancel</button>
  </div>
  <!-- ids: APP-SEARCH-006 APP-SEARCH-007 APP-SEARCH-008 APP-SEARCH-009 APP-SEARCH-010 APP-SEARCH-011 APP-SEARCH-012 APP-SEARCH-013 APP-SEARCH-014 APP-SEARCH-015 APP-SEARCH-016 APP-SEARCH-017 APP-SEARCH-018 – тело: пустое поле → Recent (до 8, часы, Clear, «saved on this phone»), Popular now с «N designs», Occasions; ввод → «N results», чипы-группы с иконкой тега, строки 64×80 с подсветкой и старой ценой (≤40); ничего → «No results for …» + Ask a florist + All designs. Прокрутка списка прячет клавиатуру (blur on scroll). -->

</section>
