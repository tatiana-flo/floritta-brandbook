<!-- Экран за флагом bloomLive (false во всех сборках, в коде приложения нигде не используется). В реестре 11-community.md его нет – это эскиз «живой ленты флористов» для будущего; ID реестра не присваиваем, чтобы не считать покрытым то, чего в приложении нет. Родственные функции сообщества (лайк двойным тапом, Share, профиль) размечены на экранах 30–34. -->
<style>
/* ---- shared bloom bits ---- */
#s-bloom .petals,#s-post .petals{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border:1px solid var(--light);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
#s-bloom .petals svg,#s-post .petals svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
#s-bloom .av,#s-florist .av,#s-post .av{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-size:15px;font-weight:400;letter-spacing:.04em;flex:none}

/* ---- stories strip ---- */
#s-bloom .stories{display:flex;gap:14px;overflow-x:auto;padding:6px var(--gutter) 4px;scrollbar-width:none}
#s-bloom .stories::-webkit-scrollbar{display:none}
#s-bloom .story{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
#s-bloom .story .sav{width:64px;height:64px;position:relative;background:var(--silver);overflow:hidden;outline:1px solid var(--light);outline-offset:2px}
#s-bloom .story .sav img{width:100%;height:100%;object-fit:cover}
#s-bloom .story .sav .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:var(--ink);background:var(--silver)}
#s-bloom .story.--live .sav{outline:1.5px solid var(--ink)}
#s-bloom .story.--live .sav::after{content:"Live";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px}
#s-bloom .story .sl{font-size:11px;line-height:1.25;color:var(--graphite);max-width:68px}
#s-bloom .story.seen .sav{outline-color:var(--hair);opacity:.8}
#s-bloom .chips{margin-top:18px}

/* ---- feed ---- */
#s-bloom .feed{display:flex;flex-direction:column;gap:32px;margin-top:28px}
#s-bloom .post{display:flex;flex-direction:column}
#s-bloom .post .ph-wrap{position:relative;margin:0 var(--gutter)}
#s-bloom .post .ph-wrap .ph{aspect-ratio:4/5;background:var(--silver);overflow:hidden;position:relative}
#s-bloom .post .ph img{width:100%;height:100%;object-fit:cover}
#s-bloom .post.--thanks .ph img{object-position:50% 85%;transform:scale(1.25)}
#s-bloom .post .ph .tagz{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-direction:column;align-items:flex-start}
#s-bloom .post .ph .tag{background:rgba(253,253,253,.9)}
#s-bloom .post .bigheart{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#s-bloom .post .bigheart svg{width:96px;height:96px;stroke:#fff;fill:none;stroke-width:1.2;opacity:0;filter:drop-shadow(0 2px 10px rgba(30,26,23,.35))}
#s-bloom .post .bigheart.go svg{animation:bh .9s var(--m-ease)}
@keyframes bh{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.08)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
#s-bloom .post .hd{display:flex;align-items:center;gap:10px;padding:12px var(--gutter) 0}
#s-bloom .post .hd .who{flex:1;min-width:0}
#s-bloom .post .hd .who .n{font-size:14px;line-height:1.3}
#s-bloom .post .hd .who .n b{font-weight:500}
#s-bloom .post .hd .who .n .muted{font-weight:300}
#s-bloom .post .hd .who .w{font-size:12px;color:var(--grey);margin-top:1px}
#s-bloom .post .acts{display:flex;align-items:center;gap:2px;padding:6px var(--gutter) 0;margin-left:-8px}
#s-bloom .post .acts .ib{width:44px;height:44px}
#s-bloom .post .acts .ib.cnt{width:auto;padding:0 10px 0 8px;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
#s-bloom .post .acts .ib.like.on svg{fill:var(--accent);stroke:var(--accent)}
#s-bloom .post .acts .ib.save.on svg{fill:var(--ink)}
#s-bloom .post .acts .ib.pop svg{animation:pop .4s var(--m-ease)}
#s-bloom .post .cap{padding:4px var(--gutter) 0;font-size:14px;line-height:1.45;color:var(--ink)}
#s-bloom .post .cap .tag{margin-left:6px;vertical-align:1px}
#s-bloom .post .thanks{margin:10px var(--gutter) 0;padding:12px 14px;background:var(--ok-bg);display:flex;gap:10px;align-items:center;font-size:13px;color:var(--graphite)}
#s-bloom .post .thanks svg{width:18px;height:18px;stroke:var(--ok);fill:none;stroke-width:1.5;flex:none}
#s-bloom .post .winner{margin:10px var(--gutter) 0;padding:12px 14px;border:1px solid var(--ink);display:flex;gap:12px;align-items:center;font-size:13px}
#s-bloom .post .winner .f1 b{font-weight:500}
#s-bloom .post .ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--gutter) 0}
#s-bloom .post .ft .pr{font-family:var(--f-display);font-size:24px;font-weight:300;line-height:1}
#s-bloom .post .ft .pr small{font-family:var(--f-body);font-size:12px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--grey);margin-right:6px}
#s-bloom .post .ft .btn{height:40px;padding:0 18px;font-size:11.5px}
#s-bloom .post .ft .btn svg{width:16px;height:16px}
#s-bloom .more{margin:32px var(--gutter) 0}
#s-bloom .fend{padding:24px var(--gutter) 8px;text-align:center;color:var(--grey);font-size:13px}
/* skeleton post while loading more */
#s-bloom .skel .ph{aspect-ratio:4/5;margin:0 var(--gutter)}
#s-bloom .skel .ln{height:12px;margin:12px var(--gutter) 0;width:60%}

/* ---- story sheet ---- */
#st-sheet{position:relative;height:720px;max-height:82vh;display:flex;flex-direction:column;background:var(--ink);color:var(--paper);overflow:hidden}
#st-sheet .st-bars{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:3}
#st-sheet .st-bars i{flex:1;height:2px;background:rgba(255,255,255,.35);position:relative;overflow:hidden}
#st-sheet .st-bars i b{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff}
#st-sheet .st-bars i.done b{width:100%}
#st-sheet .st-bars i.run b{animation:stbar 3s linear forwards}
@keyframes stbar{from{width:0}to{width:100%}}
#st-sheet .st-hd{position:absolute;top:26px;left:16px;right:16px;display:flex;align-items:center;gap:10px;z-index:3;font-size:13px}
#st-sheet .st-hd .av{width:32px;height:32px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:14px}
#st-sheet .st-hd .x{margin-left:auto;width:40px;height:40px;display:grid;place-items:center}
#st-sheet .st-hd .x svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.5}
#st-sheet .st-img{position:absolute;inset:0}
#st-sheet .st-img img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
#st-sheet .st-img img.on{opacity:1}
#st-sheet .st-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,26,23,.55) 0,rgba(30,26,23,0) 25%,rgba(30,26,23,0) 60%,rgba(30,26,23,.7) 100%)}
#st-sheet .st-cap{position:absolute;left:20px;right:20px;bottom:28px;z-index:3}
#st-sheet .st-cap .c{font-family:var(--f-display);font-size:26px;font-weight:300;line-height:1.1}
#st-sheet .st-cap .m{font-size:13px;opacity:.75;margin-top:6px}
#st-sheet .st-cap .btn{margin-top:14px}
#st-sheet .st-tap{position:absolute;inset:0;z-index:2}
#st-sheet .st-tap button{position:absolute;top:0;bottom:0;width:50%}
#st-sheet .st-tap button:first-child{left:0}#st-sheet .st-tap button:last-child{right:0}

/* ---- florist profile ---- */
#s-florist .hero{padding:8px var(--gutter) 0;display:flex;gap:16px;align-items:center}
#s-florist .hero .bigav{width:84px;height:84px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-size:32px;font-weight:300;letter-spacing:.04em;flex:none}
#s-florist .hero .nm{font-family:var(--f-display);font-size:30px;font-weight:300;line-height:1.05}
#s-florist .hero .rl{font-size:13px;color:var(--graphite);margin-top:2px}
#s-florist .hero .sn{font-size:12px;color:var(--grey);margin-top:2px}
#s-florist .stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--hair);margin:20px var(--gutter) 0}
#s-florist .stats>div{padding:12px 8px;text-align:center;border-right:1px solid var(--hair);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite)}
#s-florist .stats>div:last-child{border-right:0}
#s-florist .stats b{display:block;font-family:var(--f-display);font-size:22px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1.1;margin-bottom:3px}
#s-florist .follow{margin:16px var(--gutter) 0;display:flex;gap:10px}
#s-florist .follow .btn{flex:1;height:44px}
#s-florist .follow .btn.on{background:transparent;color:var(--ink)}
#s-florist .request{margin:32px var(--gutter) 0;padding:18px}
#s-florist .request .h3{font-weight:300;font-size:24px;margin-top:4px}
#s-florist .request p{font-size:13px;opacity:.8;margin:6px 0 14px;line-height:1.45}
#s-florist .request .btn{height:44px}
#s-florist .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 var(--gutter)}
#s-florist .g3 button{aspect-ratio:1;background:var(--silver);overflow:hidden;position:relative}
#s-florist .g3 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#s-florist .g3 .pr{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(253,253,253,.9);padding:1px 6px}
#s-florist .rv{padding:14px var(--gutter);border-bottom:1px solid var(--hair)}
#s-florist .rv .rh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
#s-florist .rv p{margin:6px 0 0;font-size:14px;color:var(--graphite);line-height:1.5}
#s-florist .rv p b{font-weight:500;color:var(--ink)}

/* ---- post view ---- */
#s-post .ph{position:relative;aspect-ratio:4/5;background:var(--silver);overflow:hidden}
#s-post .ph img{width:100%;height:100%;object-fit:cover}
#s-post .ph .tagz{position:absolute;left:12px;top:12px;display:flex;gap:4px;flex-direction:column;align-items:flex-start}
#s-post .ph .tag{background:rgba(253,253,253,.9)}
#s-post .hd{display:flex;align-items:center;gap:12px;padding:16px var(--gutter) 0}
#s-post .hd .who{flex:1}
#s-post .hd .who .n{font-size:15px}
#s-post .hd .who .n b{font-weight:500}
#s-post .hd .who .w{font-size:12px;color:var(--grey);margin-top:1px}
#s-post .title{padding:20px var(--gutter) 0}
#s-post .title .h2{font-size:30px}
#s-post .title .pr{font-family:var(--f-display);font-size:22px;margin-top:6px}
#s-post .inside{margin:0 var(--gutter)}
#s-post .inside .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);font-size:14px}
#s-post .inside .it svg{width:18px;height:18px;stroke:var(--grey);fill:none;stroke-width:1.5;flex:none}
#s-post .inside .it .q{margin-left:auto;color:var(--grey);font-size:13px;font-variant-numeric:tabular-nums}
#s-post .react{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 var(--gutter)}
#s-post .react button{height:64px;border:1px solid var(--light);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--graphite);transition:all var(--m-fast)}
#s-post .react button svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--m-fast)}
#s-post .react button.on{border-color:var(--ink);color:var(--ink)}
#s-post .react button.on svg{animation:pop .4s var(--m-ease)}
#s-post .thanks{margin:16px var(--gutter) 0;padding:14px;background:var(--ok-bg);font-size:13px;color:var(--graphite);line-height:1.45}
#s-post .thanks b{font-weight:500;color:var(--ink)}
</style>
<section class="scr" id="s-bloom" data-tab="community" data-nav="Bloom – live feed" data-group="Flag: off" data-flag="bloomLive">
  <div class="appbar">
    <div class="ttl">Bloom</div>
    <button class="petals" onclick="App.go('account')" aria-label="Petals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><ellipse cx="12" cy="6" rx="2.6" ry="3.4"/><ellipse cx="12" cy="18" rx="2.6" ry="3.4"/><ellipse cx="6" cy="12" rx="3.4" ry="2.6"/><ellipse cx="18" cy="12" rx="3.4" ry="2.6"/></svg><span data-petals>1,240</span></button>
    <button class="ib" onclick="App.go('notifications')" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span class="dot" data-n="2">2</span></button>
  </div>
  <div class="scr-body has-tab">
    <div class="stories" id="bl-stories"></div>
    <div class="chips" id="bl-chips"></div>
    <div class="feed" id="bl-feed"></div>
    <div class="more"><button class="btn --ghost --block" id="bl-more" onclick="Bloom.more()">Load more</button></div>
    <div class="fend">Every bouquet here was hand-tied in Bermondsey today.</div>
  </div>
</section>
