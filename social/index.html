<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floritta · раздел «Соцсети» · прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@300;400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Токены – брендбук Floritta 2026-11 (палитра сайта, радиус 0) */
:root{
  --paper:#fdfdfd; --ink:#1e1a17; --graphite:#5c5450; --grey:#8b8378; --light:#cecece; --hair:#e6e6e6; --silver:#f2f2f4;
  --accent:#b4595f; --accent-dark:#9a474c; --accent-bg:#f3e1e1; --ok:#7a8a6b; --ok-bg:#eef0e9; --warn:#9a6a0a; --warn-bg:#fbf1d4;
  --f-display:"Cormorant Infant",Georgia,serif; --f-body:"Jost","Helvetica Neue",Arial,sans-serif;
  --ls-btn:.12em; --ls-caps:.04em; --ls-eyebrow:.14em; --gutter:16px; --tab-h:64px;
  --m-fast:180ms; --m-base:320ms; --m-ease:cubic-bezier(.22,1,.36,1);
  --shadow-sheet:0 -12px 40px rgba(30,26,23,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#ececee;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-weight:300;-webkit-font-smoothing:antialiased}
b,strong{font-weight:500}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea,select{font:inherit;color:inherit}
img{display:block;max-width:100%}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Стенд */
.stage{display:grid;grid-template-columns:264px minmax(0,1fr) 300px;gap:28px;padding:28px 24px;align-items:start}
.gl,.gr{position:sticky;top:28px;max-height:calc(100vh - 56px);overflow:auto;scrollbar-width:none}
.gl::-webkit-scrollbar,.gr::-webkit-scrollbar{display:none}
.stage-title{font-family:var(--f-display);font-weight:300;font-size:34px;line-height:1.02;letter-spacing:.01em;margin:0 0 8px;text-transform:uppercase}
.stage-sub{color:var(--graphite);font-size:13px;margin:0 0 18px}
.eyebrow{font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);font-weight:400}
.rseg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--light);margin:6px 0 16px}
.rseg button{height:34px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;border-right:1px solid var(--light);border-bottom:1px solid var(--light)}
.rseg button:nth-child(2n){border-right:0}.rseg button:nth-last-child(-n+2){border-bottom:0}
.rseg button.on{background:var(--ink);color:var(--paper)}
.nav-list{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:2px}
.nav-list .grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);padding:12px 10px 4px}
.nav-list button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 10px;font-size:13.5px}
.nav-list button:hover{background:var(--silver)}
.nav-list button.on{background:var(--ink);color:var(--paper)}
.nav-list button.off{color:var(--light)}
.nav-list button small{opacity:.55;font-size:11px}
.notes{font-size:13.5px;color:var(--graphite)}
.notes h4{font-family:var(--f-body);font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);font-weight:400;margin:20px 0 8px}
.notes ul{padding-left:16px;margin:0}.notes li{margin:0 0 6px}.notes li b{color:var(--ink)}
.center{display:flex;justify-content:center;min-width:0}
@media (max-width:1180px){.stage{grid-template-columns:1fr}.gl,.gr{position:static;max-height:none}}
.stage.wide{grid-template-columns:240px minmax(0,1fr)}
.stage.wide .gr{grid-column:2;position:static;max-height:none;border-top:1px solid var(--hair);padding-top:4px}
.stage.wide .gr ul{columns:2;column-gap:32px}
.stage.wide .center{justify-content:flex-start}
.stage.wide .browser{max-width:none}

/* Телефон */
.phone{position:relative;width:414px;height:880px;background:#141210;border-radius:50px;padding:12px;flex:none}
.phone .wrap{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--paper)}
.notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:116px;height:32px;background:#141210;border-radius:20px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:14px;font-weight:500;z-index:55;pointer-events:none}
.pscr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.appbar{display:flex;align-items:center;gap:10px;min-height:52px;padding:58px var(--gutter) 8px;flex:none}
.appbar .ttl{flex:1;font-family:var(--f-display);font-size:26px;font-weight:300;line-height:1;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:active{background:var(--silver)}.ib svg{width:22px;height:22px}
.body{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:calc(var(--tab-h) + 20px)}
.body::-webkit-scrollbar{display:none}
.body.cta{padding-bottom:96px}
.pad{padding:0 var(--gutter)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--tab-h);display:grid;background:rgba(253,253,253,.96);border-top:1px solid var(--hair);z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);position:relative;font-weight:400;text-align:center}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}.tab.on svg{stroke-width:1.9}
.tab .dot{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;background:var(--accent);color:#fff;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center}
.cta-bar{position:absolute;left:0;right:0;bottom:0;padding:12px var(--gutter) 20px;background:rgba(253,253,253,.96);border-top:1px solid var(--hair);z-index:45;display:flex;gap:10px}
.cta-bar .btn{flex:1}
.h2{font-family:var(--f-display);font-weight:300;font-size:26px;line-height:1.08;margin:0;text-transform:uppercase;letter-spacing:.02em}
.h3{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.15;margin:0;text-transform:uppercase;letter-spacing:.02em}
.caps{font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;font-weight:400;color:var(--grey)}
.sm{font-size:13.5px}.xs{font-size:12px}.muted{color:var(--grey)}.soft{color:var(--graphite)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--gutter);margin:26px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 22px;font-size:13px;font-weight:400;letter-spacing:var(--ls-btn);text-transform:uppercase;border:1px solid var(--ink);background:var(--ink);color:var(--paper);white-space:nowrap;text-align:center}
.btn:hover{background:var(--graphite);border-color:var(--graphite)}
.btn.sec2{background:transparent;color:var(--ink)}.btn.sec2:hover{background:var(--silver);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:var(--light);color:var(--ink)}.btn.ghost:hover{background:transparent;border-color:var(--ink)}
.btn.m{height:40px;padding:0 16px;font-size:12px}.btn.s{height:32px;padding:0 12px;font-size:11px;letter-spacing:.08em}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--light);font-size:13px;white-space:nowrap;background:var(--paper)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 var(--gutter);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}.chips>*{flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--ink);height:44px;margin:0 var(--gutter)}
.seg button{font-size:11.5px;letter-spacing:var(--ls-caps);text-transform:uppercase;text-align:center}
.seg button.on{background:var(--ink);color:var(--paper)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--silver);color:var(--graphite);white-space:nowrap;font-weight:400}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.pill.doing{background:var(--ink);color:var(--paper)}.pill.review{background:var(--warn-bg);color:var(--warn)}.pill.done{background:var(--ok-bg);color:var(--ok)}.pill.late{background:var(--accent-bg);color:var(--accent)}.pill.plain::before{display:none}
.row{display:flex;align-items:center;gap:14px;padding:14px var(--gutter);border-bottom:1px solid var(--hair);min-height:60px;width:100%}
.row:active{background:var(--silver)}
.row .th{width:48px;height:60px;object-fit:cover;background:var(--silver);flex:none}
.row .rt{flex:1;min-width:0}.row .l{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .d{font-size:12.5px;color:var(--grey);margin-top:2px}
.tcard{display:block;width:100%;border:1px solid var(--hair);padding:14px;background:var(--paper)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11.5px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--grey)}
.input{height:52px;border:1px solid var(--light);background:var(--paper);padding:0 14px;font-size:15px;width:100%;outline:none}
.input:focus{border-color:var(--ink)}
textarea.input{height:auto;min-height:88px;padding:12px 14px;resize:none;line-height:1.4}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;min-height:44px;width:100%;font-size:14px}
.check .bx{width:22px;height:22px;border:1px solid var(--ink);flex:none;display:grid;place-items:center;margin-top:1px}
.check.on .bx{background:var(--ink);color:var(--paper)}.check .bx svg{width:14px;height:14px;opacity:0}.check.on .bx svg{opacity:1}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pick button{position:relative;aspect-ratio:4/5;background:var(--silver);overflow:hidden}
.pick img{width:100%;height:100%;object-fit:cover}
.pick button.on::after{content:"";position:absolute;inset:0;border:3px solid var(--ink)}
.pick button.on::before{content:attr(data-n);position:absolute;right:6px;top:6px;width:20px;height:20px;background:var(--ink);color:var(--paper);font-size:11px;display:grid;place-items:center;z-index:2;font-weight:500}
.pick .vid{display:grid;place-items:center;color:var(--light);border:1px dashed var(--light);background:var(--paper);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.kv{display:grid;grid-template-columns:112px 1fr;gap:6px 12px;font-size:13.5px}.kv dt{color:var(--grey)}.kv dd{margin:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 16px 22px;font-size:14px}
.tl li::before{content:"";position:absolute;left:3px;top:6px;width:9px;height:9px;border:1px solid var(--light);background:var(--paper)}
.tl li::after{content:"";position:absolute;left:7px;top:17px;bottom:-4px;width:1px;background:var(--hair)}
.tl li:last-child::after{display:none}
.tl li.ok::before{background:var(--ink);border-color:var(--ink)}
.tl li small{display:block;color:var(--grey);font-size:12px}
.note{border:1px solid var(--hair);background:var(--silver);padding:12px 14px;font-size:13.5px}
.note.warn{background:var(--warn-bg);border-color:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--accent)}
.swipe{margin:0 var(--gutter);border:1px solid var(--hair)}
.swipe .ph{aspect-ratio:4/5;background:var(--silver);overflow:hidden;position:relative}.swipe .ph img{width:100%;height:100%;object-fit:cover}
.swipe .cnt{position:absolute;left:8px;top:8px;background:var(--paper);font-size:11px;padding:2px 8px;letter-spacing:.06em;text-transform:uppercase}
.swipe .inf{padding:12px 14px}
.acts3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px var(--gutter) 0}
.sheet-bg{position:absolute;inset:0;background:rgba(30,26,23,.35);z-index:80;opacity:0;visibility:hidden;transition:all var(--m-base)}
.sheet-bg.on{opacity:1;visibility:visible}
.psheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--paper);z-index:90;display:flex;flex-direction:column;transform:translateY(100%);transition:transform var(--m-base) var(--m-ease);box-shadow:var(--shadow-sheet)}
.psheet.on{transform:none}
.psheet .grab{width:40px;height:4px;background:var(--light);margin:10px auto 4px;flex:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px var(--gutter) 12px;flex:none}
.sh-body{overflow-y:auto;padding:0 var(--gutter) 16px;flex:1;min-height:0;scrollbar-width:none}
.sh-foot{padding:12px var(--gutter) 20px;border-top:1px solid var(--hair);flex:none;display:flex;gap:10px}.sh-foot .btn{flex:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:13px 18px;font-size:14px;z-index:200;opacity:0;visibility:hidden;transition:all var(--m-base) var(--m-ease);max-width:520px}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 var(--gutter)}
.kbox{border:1px solid var(--hair);padding:12px 14px}.kbox .n{font-family:var(--f-display);font-size:32px;line-height:1;font-weight:300}

/* CRM */
.browser{width:100%;max-width:1180px;background:var(--paper);border:1px solid var(--light);min-width:0}
.bbar{height:34px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--silver);font-size:12px;color:var(--grey)}
.bbar i{width:9px;height:9px;border:1px solid var(--light);display:block}
.bbar span{margin-left:12px}
.crm{display:grid;grid-template-columns:168px minmax(0,1fr);height:780px;font-size:14px;position:relative;overflow:hidden}
.side{border-right:1px solid var(--hair);padding:14px 8px;overflow:auto;scrollbar-width:none}
.side .logo{font-family:var(--f-display);font-size:22px;letter-spacing:.14em;text-transform:uppercase;padding:2px 10px 12px}
.sb{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;font-size:13.5px;color:var(--graphite)}
.sb.on{background:var(--ink);color:#fff}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:52px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:14px;padding:0 20px;flex:none}
.top .h2{font-size:24px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--hair);padding:0 20px;flex:none;overflow-x:auto;scrollbar-width:none}
.tabs button{height:40px;padding:0 12px;font-size:13px;color:var(--grey);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button.new{color:var(--ink)}
.page{flex:1;min-height:0;overflow:auto;padding:16px 20px 24px}
.views{display:flex;gap:2px;border-bottom:1px solid var(--hair);margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.views button{height:36px;padding:0 12px;font-size:13px;color:var(--graphite);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.views button .n{font-size:11px;color:var(--grey)}
.views button.on{color:var(--ink);border-bottom-color:var(--ink)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{flex:1}
.crm .btn{height:40px;padding:0 18px}.crm .btn.s{height:32px;padding:0 12px}
.crm .chip{height:30px;padding:0 12px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);font-weight:400;padding:0 12px;height:36px;border-bottom:1px solid var(--hair);white-space:nowrap}
.tbl td{padding:8px 12px;height:44px;border-bottom:1px solid var(--hair);vertical-align:middle}
.tbl tr.r{cursor:pointer}.tbl tr.r:hover td{background:var(--silver)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .sub{display:block;font-size:12px;color:var(--grey)}
.tbl-wrap{border:1px solid var(--hair);overflow:auto}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi-card{border:1px solid var(--hair);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi{font-family:var(--f-display);font-weight:300;font-size:36px;line-height:1}
.delta{font-size:12px;color:var(--grey)}.delta.up{color:var(--ok)}.delta.down{color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--hair);border-top:1px solid var(--hair)}
.cal .dh{font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);padding:8px 10px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.cal .dc{min-height:150px;padding:6px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:6px}
.cal .dn{font-size:12px;color:var(--grey);padding:0 4px}
.ev{display:block;width:100%;border:1px solid var(--hair);padding:6px 8px;font-size:12px;line-height:1.3;background:var(--paper)}
.ev:hover{border-color:var(--grey)}
.ev b{display:block;font-weight:400;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
.ev.hand{border-style:dashed;border-color:var(--ink)}
.ev.draft{color:var(--grey)}
.ev.late{box-shadow:inset 3px 0 0 var(--accent)}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px 12px}
.asset .ph{aspect-ratio:4/5;background:var(--silver);overflow:hidden}.asset .ph img{width:100%;height:100%;object-fit:cover}
.asset .nm{font-size:13px;margin-top:8px}.asset .mt{font-size:12px;color:var(--grey)}
.ed{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;gap:24px;min-height:0}
.ed .ph{aspect-ratio:4/5;background:var(--silver);overflow:hidden}.ed .ph img{width:100%;height:100%;object-fit:cover}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr) 66px;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.frow .k{color:var(--grey)}
.tagm{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--light);color:var(--graphite);text-align:center;white-space:nowrap;align-self:start}
.tagm.hand{border-color:var(--ink);color:var(--ink);border-style:dashed}
.rd{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:13px;border-bottom:1px solid var(--hair)}
.rd .m{width:16px;height:16px;flex:none;border:1px solid var(--light);margin-top:2px;display:grid;place-items:center}
.rd.ok .m{background:var(--ink);border-color:var(--ink);color:var(--paper)}.rd .m svg{width:11px;height:11px;opacity:0}.rd.ok .m svg{opacity:1}
.rd small{display:block;color:var(--grey);font-size:11.5px}
.chat{display:flex;flex-direction:column;gap:10px;max-width:680px}
.msg{padding:10px 14px;border:1px solid var(--hair);font-size:14px;max-width:86%}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.msg small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);margin-bottom:4px}
.msg.me small{color:var(--light)}
.prop{border:1px solid var(--hair);padding:14px 16px;margin-bottom:12px}
.prop .hd{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.prop .diff{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0;font-size:13px}
.prop .diff div{border:1px solid var(--hair);padding:8px 10px}.prop .diff small{display:block;color:var(--grey);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
