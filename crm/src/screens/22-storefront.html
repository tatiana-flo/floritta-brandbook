<script>
/* ===== 22 · Storefront / SEO / Content – shared runtime + Storefront screens (fictional demo data) ===== */
window.SF22_STATE=window.SF22_STATE||{configured:true,ownerWs:true,token:true,siteSettings:true,migrated:true,translate:true,quiet:false,errors:false,gsc:true,ga4:true,audited:true,analyst:false};
window.SF22_DEFS=window.SF22_DEFS||{};
(()=>{
const S=window.SF22_STATE, DEFS=window.SF22_DEFS;
const esc=s=>App.esc(s), ic=n=>App.icon(n);
const NAVS={
 storefront:[["sf-redirects","Redirects"],["sf-menus","Menus"],["sf-landing","Landing pages"],["sf-site-pages","Site pages"],["sf-bulk","Bulk edits"],["sf-news","News"],["sf-authors","Authors"],["sf-faq","FAQ"],["sf-parameters","Parameters"],["sf-reviews","Reviews"],["sf-subscription","Subscription options"],["sf-forms","Forms"],["sf-delivery","Delivery"],["sf-subscribers","Subscribers"],["sf-messages","Messages"]],
 seo:[["seo","Overview"],["seo-onpage","On-page"],["seo-keywords","Keywords"],["seo-content","Content"],["seo-tech","Technical"],["seo-local","Local"],["seo-geo","Geo"],["seo-ai","AI search"],["seo-pages","Pages"],["seo-links","Links"],["seo-brief","Brief"],["seo-rollout","Rollout"],["seo-machine","Machine"],["seo-gbp","GBP"]],
 content:[["content","Pages"],["content-news","News"],["content-faq","FAQ"],["content-authors","Authors"],["content-menus","Menus"],["content-reference","Reference"],["content-languages","Languages"],["content-report","Report"]]
};
const SEC_TAG={storefront:`<span class="tag --accent">Live site</span><span class="sm soft sf-desc">floritta.uk database – saves go live within a minute</span>`,seo:`<span class="tag --ink">SEO</span><span class="sm soft sf-desc">CRM tables · Search Console · AI tasks</span>`,content:`<span class="tag --line">CRM-only CMS</span><span class="sm soft sf-desc">Not read by the site – internal pages</span>`,hub:``};
const sectionOf=id=>id==="storefront"?"hub":id.startsWith("seo")?"seo":id.startsWith("content")?"content":"storefront";
const isOwner=()=>App.role()==="owner";
const canWrite=sec=>isOwner()&&(sec!=="storefront"||(S.configured&&S.ownerWs));
const subnav=(sec,cur)=>sec==="hub"?"":`<div class="views sf-sub">${NAVS[sec].map(n=>`<button class="${n[0]===cur?"on":""}" onclick="App.go('${n[0]}')">${n[1]}</button>`).join("")}</div>`;
/* ---- form helpers ---- */
const fld=(id,label,val="",o={})=>`<div class="field ${o.cls||""}"><label>${label}${o.req?' <span class="accent">*</span>':''}${o.counter?` <span class="xs" id="${id}-cnt" style="margin-left:auto"></span>`:""}</label>${o.type==="textarea"?`<textarea class="textarea" id="${id}" placeholder="${esc(o.ph||"")}" ${o.ro?"readonly":""} ${o.counter?`oninput="SFX.cnt('${id}',${o.counter})"`:""} style="${o.h?`min-height:${o.h}px`:""}">${esc(val)}</textarea>`:o.type==="select"?`<select class="select" id="${id}" ${o.on?`onchange="${o.on}"`:""}>${o.opts.map(x=>`<option ${x===val?"selected":""}>${esc(x)}</option>`).join("")}</select>`:`<input class="input" id="${id}" type="${o.type||"text"}" value="${esc(val)}" placeholder="${esc(o.ph||"")}" ${o.ro?"readonly style='color:var(--grey)'":""} ${o.counter?`oninput="SFX.cnt('${id}',${o.counter})"`:""} ${o.on?`oninput="${o.on}"`:""}>`}${o.hint?`<div class="xs muted">${o.hint}</div>`:""}<div class="xs accent sf-err" id="${id}-err"></div></div>`;
const chk=(id,label,on,hint,on2)=>`<div class="field"><label class="check"><input type="checkbox" id="${id}" ${on?"checked":""} ${on2?`onchange="${on2}"`:""}> ${label}</label>${hint?`<div class="xs muted" style="margin-left:28px">${hint}</div>`:""}<div class="xs accent sf-err" id="${id}-err" style="margin-left:28px"></div></div>`;

function mount(id,params){
  const sec=document.getElementById("s-"+id), d=DEFS[id];if(!sec||!d)return;
  const section=sectionOf(id), W=canWrite(section);
  const r=d(params||{},W)||{};
  const head=sec.querySelector(".scr-head"), body=sec.querySelector(".scr-body");

  if(section==="storefront"&&!S.configured){body.innerHTML=`<div class="empty" style="padding:80px 20px">${ic("globe")}<div class="h3">Storefront database connection is not configured</div><div class="sm">STOREFRONT_DB_* is missing in the CRM environment – nothing can be read or written. Header buttons are hidden.</div><button class="btn --ghost --sm" onclick="App.go('settings')">Open settings</button></div>`;return}
  body.innerHTML=pre+(r.body||"");
  if(r.after)r.after(sec);

window.SF22={S,DEFS,esc,ic,fld,chk,val,err,need,tag,tbl,url,saveFoot,enterSubmits,live,translated,canWrite,isOwner,mount,NAVS,re(){const c=App.state.current;if(DEFS[c])mount(c,App.state.params)}};
const SF=window.SF22;
window.SFX={
  demo(ev){const t=(k,a,b)=>({t:(S[k]?a:b),ic:S[k]?"check":"close",fn:()=>{S[k]=!S[k];SF.re();App.toast(S[k]?a:b)}});
    App.pop(ev,["Demo state",t("configured","Storefront DB configured","Storefront DB not configured"),t("ownerWs","Workspace owns floritta.uk","Floritta One client workspace"),t("token","Internal API token set","Internal API token missing"),t("siteSettings","site_settings table deployed","site_settings not deployed"),t("migrated","Shoppable-blog migrated","Shoppable-blog not migrated"),t("translate","AI translation on","AI translation off"),"-",t("gsc","GSC data synced","GSC: no data yet"),t("ga4","GA4 connected","GA4 not connected"),t("audited","AI-search audit done","AI-search: never audited"),t("analyst","SEO analyst enabled","SEO analyst disabled"),"-",t("quiet","Data present","Empty states"),t("errors","Server accepts saves","Server returns validation errors")])},
  cnt(id,max){const e=document.getElementById(id),c=document.getElementById(id+"-cnt");if(!e||!c)return;const n=e.value.length;c.textContent=n+"/"+max;c.className="xs "+(n>max?"warn":"muted")},
  go(id){App.go(id)}
};
/* ===== DEMO DATA ===== */
const RED=[["/catalog/peonies-2025","/catalog/peonies",1,[]],["/catalog/valentines-roses","/catalog/red-roses",1,[]],["/blog/old-wedding-guide","/blog/wedding-flowers-london-guide",1,[]],["/catalog/loop-test","/catalog/loop-test",1,["loop"]],["/catalog/spring-tulips","/catalog/tulips",1,["chain"]],["/catalog/tulips","/catalog/spring-flowers",1,[]],["/catalog/xmas-2024","/catalog/christmas-wreaths-2024",1,["dead"]],["/delivery-info","https://floritta.uk/delivery",0,[]]].map((r,i)=>({id:412-i,old:r[0],to:r[1],on:!!r[2],flags:r[3]}));
const MENUS={
 header:{t:"Header menu",tree:true,items:[["Shop","",0,1,"none"],["Roses","/catalog/roses",1,1,"ok"],["Bouquets","/catalog/bouquets",1,1,"ok"],["Baskets","/catalog/baskets",1,1,"ok"],["Peonies","/catalog/peonies-2025",1,0,"redirected"],["Occasions","",0,1,"none"],["Birthday","/catalog/birthday",1,1,"ok"],["Sympathy","/catalog/sympathy",1,1,"ok"],["Same-day","/catalog/same-day-flowers-se1",1,1,"404"],["Blog","/blog",0,1,"route"],["Delivery","/delivery",0,1,"ok"]]},

  const rules=[["STSC-011","Every Storefront save writes to the live floritta.uk database","No draft, no confirmation except Delete redirect, Bulk apply and Bulk undo. The site picks it up within ~1 min (redirect cache 60 s, menu micro-cache, page cache). Audit in CRM only for Delivery, News covers, Text and Bulk."],["STSC-012","Machine translation runs on edits of Landing page, Site page, FAQ and News","Creating a landing page, site page or FAQ queues nothing – new objects are translated by the nightly catch-up (04:40). Text editor and Bulk edits do not queue translation either."],["STSC-013","Server success / error / info arrive as toasts","Many Storefront saves return an empty redirect – then only the sheet closes. In this design every save shows a toast."],["STSC-014","Esc, backdrop click and ✕ close any sheet","Current CRM discards unsaved edits silently. Proposed: ask “Discard changes?” when the form is dirty (shown in every sheet footer)."],["STSC-233","Validation errors without a field of their own are shown under the form","Current CRM shows nothing (Text blocks, article products, form-builder fields, Bulk scope, scheme prices, parameter labels, author socials, SEO meta title, brief keyword, Content category, default language). Toggle “Server returns validation errors” in Demo state to see them."],["STSC-234","Errors and typed values are cleared when a sheet opens","Current CRM keeps last attempt's errors and the abandoned draft until the next open."],["STSC-235","Enter submits only single-field sheets (Edit redirect, author, FAQ question, subscription size) and forms with a submit button (Delivery, Brief, Reference search)","Elsewhere Save is the footer button only – the hint is printed next to the button."],["STSC-008","All SEO screens also check seo.manage – not defined anywhere, passes for admin only (Gate::before)","Giving the ability to another role would not open the screen."],["STSC-009","A workspace that does not own floritta.uk (Floritta One client) gets 404 on every write and “not connected” on read","Demo state → “Floritta One client workspace”."],["STSC-010","Without STOREFRONT_DB_* all 15 Storefront screens show the not-configured state and hide header buttons","Demo state → “Storefront DB not configured”."],["STSC-004","Sidebar highlight","Current CRM lights Content / Storefront only on the first sub-tab; this design highlights by section prefix (/storefront, /seo, /content)."]];

Object.assign(SFX,{
  redAdd(){App.modal({title:"Add redirect",body:`<div class="col" style="gap:14px">${fld("rd-old","Old URL","",{req:true,ph:"/catalog/old-slug",hint:"Starts with “/”. The home page “/” cannot be redirected."})}${fld("rd-new","Redirect to","",{req:true,ph:"/catalog/new-slug",hint:"Carries the old page's search weight to the new one. An http(s):// address is saved as-is and sends visitors off-site – diagnostics cannot check it."})}<div class="xs muted">The rule is active on floritta.uk as soon as it is saved. Two fields – Enter does not submit, use Save.</div></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="SFX.redSave()">Save</button>`})},
  redSave(){if(!need(["rd-old","rd-new"]))return;let o=val("rd-old").trim(),n=val("rd-new").trim();if(!o.startsWith("/")){err("rd-old","Must start with “/”");return}if(o==="/"){err("rd-old","The home page cannot be redirected");return}o=o.replace(/\/+$/,"")||"/";if(!n.startsWith("http"))n="/"+n.replace(/^\/+|\/+$/g,"");if(o===n){err("rd-new","Old and new URL must differ");return}const d=RED.find(r=>r.old===o);if(d){err("rd-old",`A rule for ${o} already exists (id ${d.id})`);return}if(S.errors){err("rd-new","The storefront rejected the rule (422)");return}RED.unshift({id:413+RED.length,old:o,to:n,on:true,flags:[]});App.closeModal();SF.re();live("Redirect added")},
  redEdit(id){const r=RED.find(x=>x.id===id);App.modal({title:"301: "+esc(r.old),body:`<div class="col" style="gap:14px">${fld("rd-old2","Old URL",r.old,{ro:true,hint:"The old URL cannot change – delete the rule and add a new one."})}${fld("rd-new2","Redirect to",r.to,{req:true})}${chk("rd-on",`Active`,r.on,"Inactive rules stay in the table but the site ignores them.")}<div class="xs muted">One editable field – Enter saves.</div></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="SFX.redUpd(${id})">Save</button>`,onMount:b=>enterSubmits(b,()=>SFX.redUpd(id))})},
  redUpd(id){const r=RED.find(x=>x.id===id);const n=val("rd-new2").trim();if(!n){err("rd-new2","Required");return}if(n===r.old){err("rd-new2","Old and new URL must differ");return}r.to=n.startsWith("http")?n:"/"+n.replace(/^\/+|\/+$/g,"");r.on=val("rd-on");r.flags=r.to===r.old?["loop"]:RED.some(x=>x.old===r.to)?["chain"]:[];App.closeModal();SF.re();live("Redirect updated")},
  redDel(id){const r=RED.find(x=>x.id===id);App.confirm("Delete this redirect?",`Delete the rule for ${r.old}? The old URL will 404 again if the page no longer exists. This cannot be undone – there is no audit record.`,"Delete rule",()=>{RED.splice(RED.indexOf(r),1);SF.re();live("Rule deleted")},{danger:true})}

  const list=(t,scope)=>{const gs=S.quiet?[]:PARAMS[scope];return `<div class="sec-head"><div class="h3">${t}</div></div>${gs.length?gs.map(g=>grp(scope,g)).join(""):`<div class="empty">${ic("tag")}<div class="sm">No parameter groups</div></div>`}`};
  return {body:`<div class="note-box mb16">${ic("info")} Saving changes the size / colour selector labels on floritta.uk and the p2 auto-matching in the bridge. One group open at a time; unsaved edits in other groups are kept (and marked) until you leave the page. Save writes only its own group.</div><div class="sf-two">${["product","variant"].map(s=>`<div>${list(s==="product"?"Product-level groups":"Variant-level groups (size, colour)",s)}</div>`).join("")}</div>`}};
Object.assign(SFX,{paramSave(scope,id){const key=scope+id,g=PARAMS[scope].find(x=>x.id===id),ed=T22.pEdits[key]||{},add=(T22.pAdded[key]||[]).filter(v=>v.trim());const tooLong=Object.values(ed).concat(add).find(v=>v.length>255);if(tooLong){App.toast("Error: a label is longer than 255 characters");return}T22.pBusy=true;SF.re();setTimeout(()=>{Object.entries(ed).forEach(([k,v])=>{if(v.trim()){const row=g.vals.find(x=>String(x[0])===k);if(row)row[1]=v}});add.forEach(v=>g.vals.push([g.vals.length+1,v]));delete T22.pEdits[key];delete T22.pAdded[key];T22.pBusy=false;SF.re();live(g.t+" saved")},500)}});

/* ===== REVIEWS ===== */
const stars=n=>`<span class="sf-stars">${[1,2,3,4,5].map(i=>`<svg class="${i<=n?"on":""}" viewBox="0 0 24 24" style="stroke:var(--light);fill:none;stroke-width:1.5"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>`).join("")}</span>`;
DEFS["sf-reviews"]=(p,W)=>{const rows=(S.quiet?[]:REV).map(r=>`<tr class="r"><td><div>${esc(r.name)} ${r.home?`<span class="tag --ink">On homepage</span>`:""}</div><span class="xs muted">${r.src} · ${r.date}</span></td><td>${stars(r.rating)}</td><td class="wrap xs"><div style="max-height:2.6em;overflow:hidden">${esc(r.text)}</div></td><td>${tag(r.on,"Visible","Hidden")}</td><td class="num">${W?`<button class="textbtn" onclick="SFX.revEdit(${r.id})">Edit</button>`:""}</td></tr>`);
  return {body:tbl([{t:"Name",w:"22%"},{t:"Rating",w:"100px"},{t:"Review"},{t:"Status",w:"100px"},{t:"",w:"70px"}],rows,"No reviews","star")+`<div class="sf-note">Latest 300. Reviews are not created or deleted here – only moderated.</div>`}};
Object.assign(SFX,{revEdit(id){const r=REV.find(x=>x.id===id);App.sheet({eyebrow:"Storefront · reviews · live site",title:esc(r.name),body:`<div class="col" style="gap:14px">${fld("rv-name","Name",r.name,{req:true})}${fld("rv-rating","Rating (1–5)",String(r.rating),{type:"select",opts:["1","2","3","4","5"]})}${fld("rv-text","Review",r.text,{type:"textarea"})}${chk("rv-home","On homepage",r.home)}${chk("rv-on","Visible on the site",r.on)}</div>`,foot:saveFoot(`SFX.revSave(${id})`)})},revSave(id){if(!need(["rv-name"]))return;Object.assign(REV.find(x=>x.id===id),{name:val("rv-name"),rating:+val("rv-rating"),text:val("rv-text"),home:val("rv-home"),on:val("rv-on")});App.closeSheet();SF.re();live("Review saved")}});

/* ===== SUBSCRIPTION OPTIONS ===== */
DEFS["sf-subscription"]=(p,W)=>{const t=T22.subTab;const Q=S.quiet;const sizes=SUB.sizes.slice().sort((a,b)=>b.rank-a.rank);
  const views=`<div class="views">${[["schemes","Colour schemes",SUB.schemes.length],["sizes","Sizes",SUB.sizes.length],["addons","Add-ons",SUB.addons.length]].map(v=>`<button class="${t===v[0]?"on":""}" onclick="SF22.data.T22.subTab='${v[0]}';SF22.re()">${v[1]} <span class="n">${v[2]}</span></button>`).join("")}</div>`;
  let body="";const ed=(k,id)=>W?`<button class="textbtn" onclick="SFX.subEdit('${k}',${id})">Edit</button>`:"";
  if(t==="schemes")body=tbl([{t:"",w:"56px"},{t:"Name"},{t:"Prices per size, £"},{t:"Status",w:"100px"},{t:"",w:"70px"}],(Q?[]:SUB.schemes).map(s=>`<tr class="r"><td><div class="thumb --s"><img src="${s.img}" alt=""></div></td><td>${esc(s.name)}</td><td class="tnum xs">${sizes.map(z=>`${z.name}: £${s.prices[z.name]??"–"}`).join(" · ")}</td><td>${tag(s.on,"Visible","Hidden")}</td><td class="num">${ed("schemes",s.id)}</td></tr>`),"Nothing here yet","gift");
  else if(t==="sizes")body=tbl([{t:"Name"},{t:"Free add-on",w:"110px"},{t:"Rank",w:"70px",cls:"num"},{t:"Status",w:"100px"},{t:"",w:"70px"}],(Q?[]:sizes).map(s=>`<tr class="r"><td>${esc(s.name)}</td><td>${s.free?ic("check"):"–"}</td><td class="num">${s.rank}</td><td>${tag(s.on,"Visible","Hidden")}</td><td class="num">${ed("sizes",s.id)}</td></tr>`),"Nothing here yet","gift");
  else body=tbl([{t:"Name"},{t:"Price, £",w:"90px",cls:"num"},{t:"Asks for a text note",w:"150px"},{t:"Status",w:"100px"},{t:"",w:"70px"}],(Q?[]:SUB.addons.slice().sort((a,b)=>b.rank-a.rank)).map(a=>`<tr class="r"><td>${esc(a.name)}</td><td class="num">${a.price}</td><td>${a.note?ic("check"):"–"}</td><td>${tag(a.on,"Visible","Hidden")}</td><td class="num">${ed("addons",a.id)}</td></tr>`),"Nothing here yet","gift");
  return {actions:`<button class="btn --sm" onclick="SFX.subEdit('${t}',0)">${ic("plus")} Add option</button>`,body:views+body+`<div class="sf-note">“Add option” creates a record in the current tab. Prices go straight into the subscription configurator on floritta.uk. The tab is not kept in the URL.</div>`}};
Object.assign(SFX,{
  subEdit(k,id){const isNew=!id;const o=isNew?null:SUB[k].find(x=>x.id===id);const sizes=SUB.sizes.slice().sort((a,b)=>b.rank-a.rank);const ttl={schemes:"Colour scheme",sizes:"Size",addons:"Add-on"}[k];
    let f=fld("sb-name","Name",o?o.name:"",{req:true});
    if(k==="schemes")f+=`<div class="field"><label>Prices per size, £</label><div class="sf-form">${sizes.map(z=>fld("sb-p-"+z.id,z.name,o?o.prices[z.name]??"":"",{type:"number"})).join("")}</div></div>`+(o?`<div class="field"><label>Photo</label><div class="row" style="gap:12px"><div class="thumb --l"><img src="${o.img}" alt=""></div><div><button class="btn --ghost --sm" onclick="App.toast('Image updated · WebP 1000×1000 → R2 (uploads on pick, no Save needed)')">${ic("upload")} Upload photo</button><div class="xs muted mt8">Picking a file uploads it immediately. The old file is kept in R2.</div></div></div></div>`:"");
    if(k==="sizes")f+=chk("sb-free","Free add-on",o?o.free:false,"The customer may add one add-on for free at this size.");
    if(k==="addons")f+=`<div class="sf-form">${fld("sb-price","Price, £",o?o.price:"",{type:"number",req:true})}<div class="field">${chk("sb-note","Asks for a text note",o?o.note:false)}</div></div>`;
    if(o)f+=`<div class="sf-form">${fld("sb-rank","Rank",o.rank,{type:"number"})}<div class="field">${chk("sb-on","Visible on the site",o.on)}</div></div>`;else f+=`<div class="xs muted">Rank and visibility appear on Edit – a new record is visible and placed first.</div>`;
    App.sheet({eyebrow:"Storefront · subscription configurator · live site",title:isNew?"Add "+ttl.toLowerCase():esc(o.name),body:`<div class="col" style="gap:14px">${f}</div>`,foot:saveFoot(`SFX.subSave('${k}',${id})`),onMount:b=>{if(k==="sizes"&&isNew)enterSubmits(b,()=>SFX.subSave(k,0))}})},
  subSave(k,id){if(!need(["sb-name"].concat(k==="addons"?["sb-price"]:[])))return;const list=SUB[k];let o=id?list.find(x=>x.id===id):{id:list.length+1,on:1,rank:Math.max(0,...list.map(x=>x.rank||0))+1,img:"img/lilac-dream.webp"};
    o.name=val("sb-name");if(k==="schemes"){o.prices={};let bad=false;SUB.sizes.forEach(z=>{const v=val("sb-p-"+z.id);if(v!==""&&(isNaN(+v)||+v<0)){err("sb-p-"+z.id,"Price must be a number ≥ 0");bad=true}if(v!=="")o.prices[z.name]=+v});if(bad)return}
    if(k==="sizes")o.free=val("sb-free")?1:0;if(k==="addons"){o.price=+val("sb-price");o.note=val("sb-note")?1:0}if(id){o.rank=+val("sb-rank")||0;o.on=val("sb-on")?1:0}else list.push(o);App.closeSheet();SF.re();live("Option saved")}
});

/* ===== FORMS ===== */
DEFS["sf-forms"]=(p,W)=>{const rows=(S.quiet?[]:FORMS).map(f=>`<tr class="r"><td>${esc(f.name)}</td><td class="wrap xs">${f.fields.map(x=>esc(x.name)).join(", ")}</td><td class="xs">${f.sendWh&&f.webhook?`<span class="sf-url">${esc(f.webhook)}</span>`:"<span class='muted'>–</span>"}</td><td class="num">${W?`<button class="textbtn" onclick="SFX.formEdit(${f.id})">Edit</button>`:""}</td></tr>`);
  return {actions:`<button class="btn --sm" onclick="SFX.formEdit(0)">${ic("plus")} New form</button>`,body:tbl([{t:"Name",w:"22%"},{t:"Fields"},{t:"Webhook",w:"26%"},{t:"",w:"70px"}],rows,"No forms","edit")+`<div class="sf-note">Answers arrive in Messages → Form submissions. Form visibility and rank are not shown or edited here (rank is kept from the data on edit).</div>`}};
Object.assign(SFX,{
  formEdit(id){const f=id?JSON.parse(JSON.stringify(FORMS.find(x=>x.id===id))):{name:"",desc:"",btn:"",webhook:"",sendWh:false,order:false,consent:true,under:"",fields:[]};T22.form=f;
    App.sheet({eyebrow:"Storefront · form builder · live site",title:id?esc(f.name):"New form",wide:true,body:`<div class="sf-form">${fld("fm-name","Name",f.name,{req:true})}${fld("fm-btn","Button label",f.btn,{ph:"Send"})}${fld("fm-desc","Description",f.desc,{cls:"--full"})}${fld("fm-wh","Webhook URL",f.webhook,{ph:"https://",hint:"Checked as a URL. With “Send webhook” on, the site posts every answer there."})}${fld("fm-under","Text under the button",f.under)}<div class="--full row" style="gap:20px;flex-wrap:wrap">${chk("fm-sendwh","Send webhook",f.sendWh)}${chk("fm-order","Order form",f.order)}${chk("fm-consent","Show consent checkbox",f.consent)}</div></div><div class="sec-head"><div class="h3">Fields</div><button class="textbtn" onclick="SF22.data.T22.form.fields.push({type:'input',name:'',ph:'',req:false});SFX.formFields()">+ Add field</button></div><div id="fm-fields"></div><div class="xs muted mt8">New field: type input, width td12, optional. Width and description of existing fields are kept but not edited here.</div>`,foot:saveFoot(`SFX.formSave(${id})`),onMount:()=>this.formFields()})},
  formFields(){const w=document.getElementById("fm-fields"),F=T22.form;if(!w)return;w.innerHTML=F.fields.length?`<div class="sf-fld xs muted" style="border-bottom:1px solid var(--hair)"><span>Type</span><span>Name</span><span>Placeholder / options</span><span>Required</span><span></span></div>`+F.fields.map((x,i)=>`<div class="sf-fld"><select class="select" onchange="SF22.data.T22.form.fields[${i}].type=this.value;SFX.formFields()">${["input","email","phone","date","select","multicheckbox","checkbox","textarea"].map(t=>`<option ${x.type===t?"selected":""}>${t}</option>`).join("")}</select><div><input class="input" value="${esc(x.name)}" placeholder="Field name" oninput="SF22.data.T22.form.fields[${i}].name=this.value" style="${x.err?"border-color:var(--accent)":""}">${x.err?`<div class="xs accent">${x.err}</div>`:""}</div>${["select","multicheckbox"].includes(x.type)?`<input class="input" value="${esc(x.opts||"")}" placeholder="Options, separated by ;" oninput="SF22.data.T22.form.fields[${i}].opts=this.value">`:`<input class="input" value="${esc(x.ph||"")}" placeholder="Placeholder" oninput="SF22.data.T22.form.fields[${i}].ph=this.value">`}<label class="check"><input type="checkbox" ${x.req?"checked":""} onchange="SF22.data.T22.form.fields[${i}].req=this.checked"> yes</label><button class="ib" title="Delete field" onclick="SF22.data.T22.form.fields.splice(${i},1);SFX.formFields()">${ic("trash")}</button></div>`).join(""):`<div class="empty" style="padding:20px">${ic("edit")}<div class="sm">No fields yet</div></div>`},
  formSave(id){if(!need(["fm-name"]))return;const F=T22.form;const wh=val("fm-wh").trim();if(wh&&!/^https?:\/\//.test(wh)){err("fm-wh","Must be a valid URL");return}let bad=false;F.fields.forEach(x=>{x.err=x.name.trim()?"":"Field name is required";if(x.err)bad=true});if(bad){this.formFields();return}
    Object.assign(F,{name:val("fm-name"),btn:val("fm-btn"),desc:val("fm-desc"),webhook:wh,under:val("fm-under"),sendWh:val("fm-sendwh"),order:val("fm-order"),consent:val("fm-consent")});F.fields.forEach(x=>delete x.err);if(id)FORMS[FORMS.findIndex(x=>x.id===id)]=F;else{F.id=FORMS.length+1;FORMS.unshift(F)}App.closeSheet();SF.re();live("Form saved")}
});

/* ===== DELIVERY ===== */
const DELIV={cost:12,free:80,legacy:false};
DEFS["sf-delivery"]=(p,W)=>{if(!S.siteSettings)return {body:`<div class="empty" style="padding:60px">${ic("truck")}<div class="h3">The site release with the site_settings table is not deployed yet.</div><div class="sm">Delivery price is still read from the legacy site config.</div></div>`};
  return {body:`<div class="card" style="max-width:520px">${DELIV.legacy?`<div class="note-box --warn mb16">${ic("info")} Currently using the legacy site config value – saving here takes over.</div>`:""}<div class="sf-form">${fld("dl-cost","Delivery cost, £",DELIV.cost,{type:"number",req:true})}${fld("dl-free","Free delivery from, £",DELIV.free,{type:"number",hint:"Orders above this total ship free."})}</div><div class="row mt16">${W?`<button class="btn --sm" onclick="SFX.delivSave()">Save</button><span class="xs muted">Enter saves · applies to every order on floritta.uk · old and new values go to the audit log</span>`:`<span class="xs muted">Read-only</span>`}</div></div><div class="sf-note">Last change: 12 Oct · Tatiana · £10 → £12 (audit: storefront.delivery.update)</div>`,after(sec){enterSubmits(sec,()=>SFX.delivSave())}}};
Object.assign(SFX,{delivSave(){if(!SF.canWrite("storefront"))return;const c=+val("dl-cost"),f=+val("dl-free");if(isNaN(c)||c<0){err("dl-cost","Number ≥ 0");return}App.confirm("Change delivery pricing on floritta.uk?",`Delivery £${DELIV.cost} → £${c}, free from £${DELIV.free} → £${f}. Applies to all new site orders within a minute.`,"Save",()=>{DELIV.cost=c;DELIV.free=f;DELIV.legacy=false;SF.re();App.toast("Delivery settings saved · audit written")})}});

/* ===== SUBSCRIBERS ===== */
DEFS["sf-subscribers"]=(p,W)=>{const list=S.quiet?[]:SUBS;const rows=list.map(s=>`<tr class="r"><td>${esc(s.email)}</td><td>${esc(s.name)||"<span class='muted'>–</span>"}</td><td class="xs">${s.date}</td><td>${tag(s.on,"Subscribed","Unsubscribed")}</td><td class="num">${W?(s.on?`<button class="textbtn --accent" onclick="SFX.subsToggle(${s.id},false)">Unsubscribe</button>`:`<button class="textbtn" onclick="SFX.subsToggle(${s.id},true)">Resubscribe</button>`):""}</td></tr>`);
  return {actions:`<button class="btn --ghost --sm" onclick="SFX.subsCsv()">${ic("download")} Download CSV</button>`,body:`<div class="sec-head" style="margin-top:0"><div class="h3">${list.length?1248:0} newsletter opt-ins on floritta.uk</div><span class="xs muted">latest 500 shown</span></div>${tbl([{t:"Email"},{t:"Name"},{t:"Signed up",w:"100px"},{t:"Status",w:"130px"},{t:"",w:"110px"}],rows,"No subscribers","mail")}<div class="sf-note">Unsubscribe / Resubscribe apply immediately without a confirmation (subscribers.display).</div>`}};
Object.assign(SFX,{subsToggle(id,on){const s=SUBS.find(x=>x.id===id);s.on=on;SF.re();App.toast((on?"Resubscribed ":"Unsubscribed ")+s.email,"Undo",()=>{s.on=!on;SF.re()})},subsCsv(){App.confirm("Download all subscribers?","site-subscribers-2026-10-20.csv · ID, Email, Name, Surname, Date, Active · personal data – opens in a new tab.","Download",()=>App.toast("Downloading site-subscribers-2026-10-20.csv"))}});

/* ===== MESSAGES ===== */
DEFS["sf-messages"]=(p,W)=>{const t=T22.msgTab;const Q=S.quiet;
  const views=`<div class="views">${[["msgs","Messages",MSGS.length],["forms","Form submissions",FSUB.length]].map(v=>`<button class="${t===v[0]?"on":""}" onclick="SF22.data.T22.msgTab='${v[0]}';SF22.re()">${v[1]} <span class="n">${Q?0:v[2]}</span></button>`).join("")}</div>`;
  const body=t==="msgs"?tbl([{t:"Name",w:"26%"},{t:"Message"},{t:"Date",w:"130px"}],(Q?[]:MSGS).map(m=>`<tr><td><div>${esc(m[0])}</div><span class="xs muted">${[m[1],m[2]].filter(Boolean).join(" · ")}</span></td><td class="wrap xs">${esc(m[3])}</td><td class="xs">${m[4]}</td></tr>`),"Nothing here yet","inbox"):tbl([{t:"Form",w:"22%"},{t:"Answers"},{t:"Date",w:"150px"}],(Q?[]:FSUB).map(f=>`<tr><td>${esc(f[0])}</td><td class="wrap xs">${Object.entries(f[1]).map(([k,v])=>`<b style="font-weight:400">${esc(k)}:</b> ${esc(v)}`).join(" · ")}</td><td class="xs">${f[2]}</td></tr>`),"Nothing here yet","inbox");

/* ---- mount functions for every screen of this group (SEO/Content defs live in 22-storefront-2.html) ---- */
["storefront",...NAVS.storefront.map(n=>n[0]),...NAVS.seo.map(n=>n[0]),...NAVS.content.map(n=>n[0])].forEach(id=>{window["mount_"+id.replace(/-/g,"_")]=p=>mount(id,p)});
document.addEventListener("DOMContentLoaded",()=>App.registerCommands([{g:"Go to",t:"Storefront · live site",ic:"globe",fn:()=>App.go("storefront")},{g:"Go to",t:"SEO overview",ic:"growth",fn:()=>App.go("seo")},{g:"Go to",t:"Bulk edits · find & replace",ic:"edit",fn:()=>App.go("sf-bulk")}]));
})();
</script>
