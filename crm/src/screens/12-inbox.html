function statusOf(c){return{waiting:isWaiting(c),unresolved:!!c.x.unresolved,draft:!!c.x.draft&&isWaiting(c),follow:!!c.x.followUp}}
function filtered(){
 const me=A().me();let list=convos().filter(c=>!c.x.hidden);
 if(st.status==="lane_all"){list=list.filter(c=>c.x.lane==="managers"||seesAll())}else list=list.filter(c=>c.x.lane===st.lane);
 list=list.filter(c=>{const s=statusOf(c);switch(st.status){case"action":return s.waiting||s.unresolved||s.draft||s.follow;case"waiting":return s.waiting;case"unresolved":return s.unresolved;case"draft":return s.draft;case"follow_up":return s.follow;default:return true}});
 if(st.extra==="mine")list=list.filter(c=>c.assigned===me.id);
 if(st.extra==="attention")list=list.filter(c=>isWaiting(c)&&waitMin(c)>3||!!c.x.unresolved);
 if(st.chan)list=list.filter(c=>CH_SHORT[c.chan]===st.chan);
 if(st.q){const q=st.q.toLowerCase();list=list.filter(c=>{const u=cu(c);return u.n.toLowerCase().includes(q)||u.phone.replace(/\s/g,"").includes(q.replace(/\s/g,""))||c.msgs.some(m=>(m.t||"").toLowerCase().includes(q))||String(c.id).includes(q)})}
 list.sort((a,b)=>{if(a.x.pinned!==b.x.pinned)return a.x.pinned?-1:1;if(st.status==="follow_up")return new Date(a.x.followUp?.at||0)-new Date(b.x.followUp?.at||0);const wa=isWaiting(a),wb=isWaiting(b);if(wa!==wb)return wa?-1:1;if(wa&&wb)return waitMin(b)-waitMin(a);return new Date(b.last)-new Date(a.last)});
 return list;
}

 if(p.assigned){st.extra=null;st.status="all"}
 if(p.q!==undefined)st.q=p.q;
 if(p.compose){api.compose(p.compose,p.name||"")}
 let open=null;if(p.id)open=cv(p.id);if(p.customer)open=convos().find(c=>c.customer===Number(p.customer));
 if(p.customer&&!open){const u=A().customer(p.customer);if(u){open={id:7100+convos().length,customer:u.id,chan:"WhatsApp",unread:false,order:null,assigned:A().me().id,msgs:[],last:A().NOW.toISOString(),flora:null};convos().push(open);seed();if(p.draft){st.drafts[open.id]=p.draft}}}
 if(open){if(st.status!=="all"&&!filtered().includes(open))st.status="all";st.cur=open.id;open.unread=false;st.ph="chat";if(p.draft)st.drafts[open.id]=p.draft}
 else if(!st.cur)st.ph="list";
 renderAll();
 clearInterval(st.timer);st.timer=setInterval(()=>{if(A().state.current!=="inbox"){clearInterval(st.timer);const t=document.getElementById("tb-title");return}st.tick++;const e=document.getElementById("ib-live");if(e)e.textContent="live · "+(st.tick*10)%60+" s";if(st.tick%3===0)renderList()},10000);
 A().registerCommands([{g:"Actions",t:"New WhatsApp chat",ic:"chat",fn:()=>api.compose()},{g:"Actions",t:"Open e-mail (Gmail)",ic:"mail",fn:()=>{A().go("inbox",{filter:"email"})}},{g:"Go to",t:"Customers · Due to reorder",ic:"customers",fn:()=>A().go("customers-due")}]);
};
document.addEventListener("orders",()=>{if(A().state.current==="inbox")renderCtx()});
document.addEventListener("keydown",e=>{if(A().state.current!=="inbox")return;const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea")return;if(e.key==="j")api.move(1);if(e.key==="k")api.move(-1)});
return Object.assign(api,{nav,st});
})();
