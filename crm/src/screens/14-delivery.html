  const RE={c:null,order:[],orig:[],optimal:[],saving:false,evalTxt:null,evaluating:false,addOpen:false,q:"",err:null,drag:null};

  function reRender(){const t=T[RE.c];if(!t)return;const el=document.getElementById("d14-re"),ft=document.getElementById("d14-re-foot");if(!el)return;

    const rows=RE.order.map((id,i)=>{const o=App.order(id);const s=t.stops.find(x=>x.id===id)||{fc:hm(NOWM+30+i*20),dev:0};const river=i===1;const late=s.dev>10;

    const evalBox=RE.order.length?`<div class="eval ${RE.evaluating&&RE.evalTxt?"--dim":""}">${RE.evaluating&&!RE.evalTxt?"Recalculating…":RE.err==="eval"?"Could not calculate this order":RE.evalTxt||"Drag a row or use the arrows to change the order – the planner re-checks it 400 ms after each change."}</div>`:`<div class="empty">${ic("route")}<div class="h3">No open stops to reorder</div></div>`;

      ${RE.err==="changed"?`<div class="note-box --accent mb8">The stop list has changed – reopen the route</div>`:RE.err==="save"?`<div class="note-box --accent mb8">Could not save – try again</div>`:RE.err==="rm"?`<div class="note-box --accent mb8">Could not remove / add the order – try again</div>`:""}

  buildRun(){const w=App.$("#dp-wave")?.value||"All waves",z=App.$("#dp-zone")?.value||"All zones";const n=window.D14.todays().filter(o=>o.status==="ready"&&!(window.D14.D[o.id]||{}).relay).length;if(!n){App.toast("No deliveries to dispatch match "+w+" · "+z);return}App.toast("Run created with "+n+" stops · "+w+" · "+z+" · ETAs by Google Routes, 20-min steps","Open Routes",()=>App.go("delivery-routes"))},
  pause(){App.confirm("Pause marketplaces for 30 minutes?","Take every marketplace listing (Uber Eats, Deliveroo, Just Eat) off for 30 minutes. Uber Eats stores pause via the API; the others must be closed by hand in the partner hub.","Pause",()=>{App.modal({title:"Reason",body:`<div class="field"><label>Why</label><input class="input" id="dp-why" value="Couriers at capacity"></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="window.D14.S.paused={until:window.D14.hm(window.D14.NOWM+30),by:App.me().n,reason:App.$('#dp-why').value};App.closeModal();App.remount();App.toast('Marketplaces paused · 30 min')">Pause marketplaces</button>`})})},
  resume(){window.D14.S.paused=null;App.remount();App.toast("Marketplaces back online · Uber Eats via API")},
  card(o,k){const D14=window.D14,D=D14.D,S=D14.S,d=D[o.id]||{},esc=App.esc,ic=App.icon,can=D14.manage();const c=App.customer(o.customer);const relay=d.relay;const uber=o.courier==="Uber Direct";
    const next={assigned:"in_transit",in_transit:"delivered",failed:"ready"}[k];
    const couriers=["daniel","george","omar"].map(id=>App.user(id)).sort((a,b)=>(b.on-a.on));
    const r=D14.rec(o);
    let h=`<div class="kcard ${d.slotType==="before"?"--before":""}">`;
    h+=`<div class="k-top"><b onclick="App.openOrder(${o.id})">#${o.id}</b>${uber&&relay?`<span class="muted">(${relay.account})</span>`:""}<span class="sp"></span><span class="tnum">${App.fmt(o.total)}</span></div>`;
    h+=`<div class="k-title"><b>${esc(o.recipient)}</b></div><div class="k-line"><span class="tnum">${D14.pcOf(o)}</span> · <span class="tnum">${esc(o.slot)}</span>${d.narrow?`<span class="warn" title="Marketplace window is narrower than our promise">⚠ narrow window</span>`:""}</div>`;
    if(d.alcohol)h+=`<div class="k-line ${d.ageVerified?"":"--accent"}" title="Licensed premises – alcohol must be handed to an adult (Challenge 25)">${ic("alert")} ${d.ageVerified?"18+ · ID checked ✓":"18+ · Challenge 25"}</div>`;
    if(d.overflow)h+=`<div class="k-line" title="Cheaper with an external carrier">→ external courier · ${d.overflow.zone?"zone "+d.overflow.zone:"basket under "+d.overflow.basket}</div>`;
    if(relay){h+=`<div class="k-line ${relay.dead?"--accent":""}">${esc(relay.carrier)} · ${esc(relay.status)}${relay.dead?` · ⚠ stuck – call again`:""}${relay.hidden?` <span title="Tracking hidden – address came from the recipient">${ic("lock")}</span>`:` <button class="textbtn" onclick="App.toast('Uber tracking opens in a new tab')">Track</button>`}${can&&k!=="delivered"&&k!=="failed"&&!relay.dead?` <button class="textbtn --accent" onclick="D14.uberCancel(${o.id})">Cancel</button>`:""}</div>`;
      if(relay.vehicle)h+=`<div class="k-line">${ic("truck")} ${esc(relay.vehicle)}${relay.xl===false&&o.size==="Grand"?` <span class="accent">⚠ Needs a car!</span>`:""}</div>`}
    h+=`<div class="k-line muted">${uber?"Uber Direct":o.courier?App.avatar(o.courier,"--s")+" "+esc(App.user(o.courier).n):d.dpdPlanned?"DPD":"Unassigned"}</div>`;
    if(can&&(k==="ready"||(k==="assigned"&&!uber))){h+=`<select class="select" onchange="DP.assign(${o.id},this.value);this.value=''"><option value="">${o.courier?"Reassign courier":"Assign courier"}</option>${couriers.map(u=>`<option value="${u.id}">${u.id==="daniel"?"✨ ":""}${u.n} · load ${u.id==="daniel"?7:u.id==="george"?3:0}${r.courier===u.id?" (advisor)":""}</option>`).join("")}${d.dpdPlanned?"":`<option value="dpd">DPD${r.kind==="dpd"?" (advisor)":""}</option>`}${o.courier||d.dpdPlanned?`<option value="off">– Take courier off</option>`:""}</select>`;
      h+=`<div class="adv">Advisor: <b>${esc(r.kind==="uber"?"Uber – "+r.why:r.kind==="dpd"?"DPD – outside London":r.text.replace(" · №"," · leaves "+(11+(o.id%3))+":00 · №"))}</b></div>`}
    if(can&&k==="ready"&&!relay){const tip=S.tips[o.id]||0;h+=`<div class="ho"><div class="row" style="gap:4px;flex-wrap:wrap"><span class="xs muted">Tip</span>${[0,1,2,3].map(v=>`<button class="chip ${tip===v?"on":""}" onclick="D14.S.tips[${o.id}]=${v};App.remount()">${v?"+£"+v:"No tip"}</button>`).join("")}<label class="check xs"><input type="checkbox" ${S.xl[o.id]?"checked":""} onchange="D14.S.xl[${o.id}]=this.checked"> XL</label></div><div class="row" style="gap:6px"><button class="btn --sm" ${S.busy===o.id?"disabled":""} onclick="D14.uberBook(${o.id},false)">${ic("truck")} Call Uber</button><button class="btn --ghost --sm" onclick="DP.estimate(${o.id})">Own courier ≈ ${S.est[o.id]!=null?S.est[o.id]:""}</button></div></div>`}
    if(can&&relay&&relay.dead)h+=`<div class="ho"><button class="btn --sm --accent" onclick="D14.uberModal(${o.id},true)">${ic("refresh")} Call again</button></div>`;
    if(can&&k!=="ready"&&!(relay&&!relay.dead)){const ho=S.ho[o.id];const hv=d.handover;
      if(ho)h+=`<div class="ho"><select class="select" onchange="D14.S.ho[${o.id}].m=this.value;App.remount()">${["Not recorded","Own courier","Freelancer","DPD","Royal Mail","Evri","Taxi","Rail","Other"].map(m=>`<option ${ho.m===m?"selected":""}>${m}</option>`).join("")}</select>${ho.m&&ho.m!=="Not recorded"?`<input class="input" placeholder="Tracking no." value="${esc(ho.ref||"")}" onchange="D14.S.ho[${o.id}].ref=this.value"><input class="input" placeholder="Cost £" value="${esc(ho.cost||"")}" onchange="D14.S.ho[${o.id}].cost=this.value">`:""}<button class="btn --sm" onclick="DP.saveHo(${o.id})">Save</button><span class="xs muted">No cancel – the form closes on save only</span></div>`;
      else h+=`<div class="k-line"><button class="textbtn" onclick="D14.S.ho[${o.id}]={m:'${hv?hv.method:"Not recorded"}',ref:'${hv?hv.ref||"":""}',cost:'${hv?hv.cost||"":""}'};App.remount()">${hv?esc(hv.method)+(hv.cost?" · £"+hv.cost:""):"How it left"}</button>${d.notHome?`<span class="tag --accent" title="Not home since ${d.notHomeAt} · redelivery link sent">Not home</span>`:""}</div>`}
    if(can&&(k==="assigned"||k==="in_transit")&&!d.notHome)h+=`<div class="k-line"><button class="textbtn" onclick="DP.notHome(${o.id})">Not home</button></div>`;
    h+=`<div class="k-foot">${can?`<button class="textbtn" onclick="DP.moveMenu(event,${o.id},'${k}')">Move to…</button>`:`<span></span>`}${can&&next?`<button class="btn --ghost --sm" onclick="DP.advance(${o.id},'${k}')">Advance →</button>`:""}</div></div>`;
    return h},
  assign(id,v){const D14=window.D14,D=D14.D,T=D14.T,o=App.order(id);if(!v)return;
    if(v==="off"){if(o.courier&&o.courier!=="Uber Direct"&&T[o.courier])T[o.courier].stops=T[o.courier].stops.filter(s=>s.id!==id);o.courier=null;D[id].dpdPlanned=false;o.log.push({at:App.NOW.toISOString(),who:App.me().id,t:"Courier taken off"});App.emit("orders");App.toast("#"+id+" · courier taken off · back to Ready");DP.refreshed();return}
    if(v==="dpd"){D14.assignDpd(id);DP.refreshed();return}
    const r=D14.rec(o);const t=T[v];const against=r.courier&&r.courier!==v||r.kind!=="run";const confirmed=t&&t.status==="confirmed";
    if(against||confirmed){const impact=`<ul class="d14-impact"><li>Place in the run: <b>№${t&&t.stops.length?t.stops.length+1:1}</b>${confirmed?" · on the next run (the current one is on the road)":""}</li><li>ETA for #${id}: <b>≈ ${D14.hm(D14.NOWM+75)}</b> (window ${D14.winOf(o)})</li><li>The run gets <b>+14 min</b> longer</li><li>Delays: #${t&&t.stops[t.stops.length-1]?t.stops[t.stops.length-1].id:"—"} by ≈ 9 min</li></ul>`;
      App.modal({title:against?"The advisor suggested "+(r.kind==="uber"?"Uber":r.kind==="dpd"?"DPD":App.user(r.courier).n)+". Assign "+App.user(v).n+"?":t.state==="on_road"?App.user(v).n+" is on the road – the order can only go on the next run":"Add to "+App.user(v).n+"'s run? The route is already confirmed",body:impact+`<div class="xs muted">Impact is read-only (courier-trips/impact) – nothing is written until you choose.</div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button>${r.kind==="uber"?`<button class="btn --ghost --sm" onclick="App.closeModal();D14.uberBook(${id},false)">Call Uber for #${id}</button>`:""}<button class="btn --sm" onclick="App.closeModal();DP.doAssign(${id},'${v}')">${against?"Assign anyway":"Assign"}</button>`});return}
    DP.doAssign(id,v)},
  doAssign(id,v){const D14=window.D14,T=D14.T,o=App.order(id);const prev=o.courier;if(prev&&prev!=="Uber Direct"&&T[prev]){T[prev].stops=T[prev].stops.filter(s=>s.id!==id);App.push("Order taken off","#"+id+" is no longer yours – "+App.user(v).n+" takes it",{icon:"truck"})}
    if(D14.D[id].relay&&D14.D[id].relay.dead)delete D14.D[id].relay;D14.D[id].dpdPlanned=false;App.assignCourier(id,v);T[v].stops.push({id,plan:D14.hm(D14.NOWM+75),fc:D14.hm(D14.NOWM+79),dev:4,status:"waiting",badges:T[v].state==="on_road"?["next run"]:[]});App.push("New order","#"+id+" · "+D14.pcOf(o)+" · "+D14.winOf(o),{icon:"truck"});DP.refreshed()},
  refreshed(){window.D14.tick();App.remount();App.toast("Board re-read · columns, KPIs, couriers and advisor caches")},
  moveMenu(ev,id,k){const allowed={ready:["assigned","failed"],assigned:["in_transit","ready","failed"],in_transit:["delivered","failed"],failed:["ready"],delivered:[]}[k];App.pop(ev,["Move to (allowed transitions)",...allowed.map(s=>({t:window.D14.STAGE_LBL[s],ic:s==="failed"?"alert":"chev",cls:s==="failed"?"--accent":"",fn:()=>DP.setStage(id,s)}))])},
  advance(id,k){DP.setStage(id,{assigned:"in_transit",in_transit:"delivered",failed:"ready"}[k])},
  setStage(id,s){const D14=window.D14,D=D14.D,o=App.order(id);
    if(s==="delivered"){App.modal({title:"Proof of delivery · #"+id,body:`<div class="sm soft mb8">Delivered needs a POD: photo, «no photo», PIN or signature. The order becomes Fulfilled – customer email, marketplace mirror, courier's shift may auto-close, Active points.</div><div class="chips"><button class="chip on" onclick="App.closeModal();DP.deliver(${id},'photo')">Photo taken</button><button class="chip" onclick="App.closeModal();DP.deliver(${id},'no photo')">No photo</button><button class="chip" onclick="App.closeModal();DP.deliver(${id},'PIN')">PIN</button><button class="chip" onclick="App.closeModal();DP.deliver(${id},'signature')">Signature</button></div>${D[id].alcohol&&!D[id].ageVerified?`<div class="note-box --accent mt16">Alcohol order – outside licensed hours the server refuses «delivered».</div>`:""}`,foot:null});return}
    if(s==="failed"){D[id].failed=true;D[id].failReason="Recipient not answering";if(o.status==="ready")o.status="out";o.log.push({at:App.NOW.toISOString(),who:App.me().id,t:"Delivery failed"});App.emit("orders");App.toast("#"+id+" · Failed");return}
    D[id].failed=false;
    if(s==="ready"){o.status="ready";o.courier=null;o.log.push({at:App.NOW.toISOString(),who:App.me().id,t:"Back to Ready to dispatch"});App.emit("orders");App.toast("#"+id+" · Ready to dispatch");return}
    if(s==="assigned"){if(!o.courier){App.toast("Pick a courier first – Assigned needs one");return}App.toast("#"+id+" · Assigned");App.remount();return}
    if(s==="in_transit"){App.setOrderStatus(id,"out",{courier:o.courier||"daniel",silent:true});App.toast("#"+id+" · out for delivery · «on its way» email + tracking SMS sent");return}},
  deliver(id,pod){const D=window.D14.D;D[id].failed=false;D[id].pod=pod;App.setOrderStatus(id,"delivered",{silent:true});App.toast("#"+id+" · Delivered ("+pod+") · order Fulfilled, email sent, courier +points")},
  estimate(id){const S=window.D14.S;S.est[id]="£"+(5.2+(id%5)*0.7).toFixed(2);App.remount();App.toast("Own courier estimate · Google Routes × hourly rate")},
  saveHo(id){const S=window.D14.S,D=window.D14.D;const f=S.ho[id];if(!f.m||f.m==="Not recorded")delete D[id].handover;else D[id].handover={method:f.m,ref:f.ref,cost:f.cost};delete S.ho[id];App.remount();App.toast("Handover recorded · nothing is sent to the carrier")},
  notHome(id){App.confirm("Mark the recipient as not home?","The redelivery link will need to be sent to the recipient (WhatsApp – email is rarely filled). A «nobody home» case opens in Exceptions with an AI draft.","Mark not home",()=>{const D=window.D14.D;D[id].notHome=true;D[id].notHomeAt=window.D14.hm(window.D14.NOWM);App.remount();App.toast("#"+id+" · Not home · case opened","Open Exceptions",()=>App.go("delivery-exceptions"))})}
};

/* ===== Couriers today (s-couriers-today) ===== */
window.mount_couriers_today=function(params){
  const D14=window.D14,S=D14.S,D=D14.D,T=D14.T,esc=App.esc,ic=App.icon;D14.ensure();
  if(params&&params.focus){S.focus=params.focus;S.mapOpen=true;params.focus=null}
  document.getElementById("d14-nav-ct").innerHTML=D14.nav("couriers-today");
  const can=D14.manage();const isToday=S.date==="today";
  App.$("#d14-ct-head").innerHTML=`<div class="field" style="flex-direction:row;align-items:center;gap:8px"><label>Date</label><select class="select" style="width:190px;height:32px" onchange="D14.S.date=this.value;App.remount();App.toast('Courier day · '+this.options[this.selectedIndex].text+' · full reload')"><option value="today" ${isToday?"selected":""}>Tue 20 Oct · courier day</option><option value="yesterday" ${S.date==="yesterday"?"selected":""}>Mon 19 Oct</option><option value="tomorrow" ${S.date==="tomorrow"?"selected":""}>Wed 21 Oct</option></select><span class="xs muted" title="Before 08:00 London the courier day is still yesterday">courier day rolls at 08:00</span></div><span class="sp"></span>${D14.live("30 s","also in a background tab")}<button class="btn --ghost --sm" onclick="D14.S.mapOpen=!D14.S.mapOpen;App.remount();App.toast('Map choice remembered in this browser')">${ic("map")} ${S.mapOpen?"Hide map":"Show map"}</button>${can?`<button class="btn --ghost --sm" onclick="D14.buildAdvice()">${ic("refresh")} Build advice</button>`:""}${D14.demoBtn()}`;
  let h="";
  if(!isToday){h+=`<div class="note-box mb16">Showing ${S.date==="yesterday"?"Mon 19 Oct":"Wed 21 Oct"} – the advice banner is only built for the current courier day.</div>`}
  // <!-- ids: DLOP-009 -->
  if(isToday&&S.ctAdvice)h+=`<div class="d14-banner"><span>${ic("sparkle")}</span><div class="t"><b>Advice: send George home after his run</b> – 3 remaining evening drops are cheaper with Uber (≈ £27 vs 2 h 10 min of shift).<small>Built 60 s ago · only «recommend = home» is shown here</small></div><button class="btn --sm --ghost" onclick="App.toast('George gets a push: finish the run and clock out · 3 drops queued for Uber')">Send home</button><button class="ib" onclick="D14.S.ctAdvice=false;App.remount()">${ic("close")}</button></div>`;
  // <!-- ids: DLOP-011 DLOP-012 DLOP-013 DLOP-014 DLOP-015 -->
  if(S.mapOpen)h+=D14.mapHtml({id:"d14-map-ct"});
  // <!-- ids: DLOP-016 DLOP-019 DLOP-020 DLOP-021 DLOP-022 DLOP-023 DLOP-024 DLOP-025 DLOP-026 DLOP-186 -->
  const un=D14.unassigned();const stops=un.map(o=>({id:o.id,plan:"",fc:D14.hm(D14.NOWM+40),dev:0,status:"none",badges:D[o.id].alcohol?["18+"]:[]}));
  h+=`<div class="d14-unas ${un.length?"--hot":""}"><div class="uh"><div class="h4">Not assigned · <span class="n">${un.length}</span></div>${D14.live("60 s","advisor")}${can||true?`<button class="btn --ghost --sm" onclick="D14.buildAdvice()">${ic("refresh")} Build advice</button>`:""}</div><div class="us">Delivery orders for this day with no in-house courier and no other arrangement (Uber, DPD, freelancer). Advisor actions here are not hidden by delivery.manage – the server refuses instead.</div>${un.length?D14.stopsTable(stops,{advisor:true,noPlanFact:true}):`<div class="empty">${ic("check")}<div class="h3">Every delivery for this day has a courier</div></div>`}</div>`;
  // <!-- ids: DLOP-027 DLOP-028 DLOP-029 DLOP-030 DLOP-031 DLOP-032 DLOP-033 DLOP-034 DLOP-035 DLOP-036 DLOP-037 DLOP-038 DLOP-039 DLOP-040 DLOP-041 DLOP-042 DLOP-185 -->
  h+=`<div class="sec-head mt24"><div class="h2">Couriers</div><span class="muted xs">all active courier logins (test / review accounts hidden) · with orders first</span></div>`;
  if(S.noLogins)h+=`<div class="empty">${ic("user")}<div class="h3">No active courier logins</div><div class="sm">add them in Settings → Team</div></div>`;
  else ["daniel","george","omar"].forEach(c=>{const u=App.user(c),t=T[c];const runsOnly=t.runsOnly;
    const presence=c==="daniel"?"last seen just now":c==="george"?"on shift, no ping":"no presence data";
    const stopsN=t.stops.length,delivN=t.stops.filter(s=>s.status==="delivered").length,failN=t.stops.filter(s=>s.status==="failed").length;const op=t.stops.filter(s=>s.status==="waiting"||s.status==="picked").length;
    h+=`<div class="d14-card ${runsOnly?"--runsonly":""}" id="ct-${c}"><div class="ch">${App.avatar(c)}<span class="dot ${u.on?"--ok":""}" title="${u.on?"online":"offline"}"></span><span class="nm">${esc(u.n)}</span><span class="muted xs">${presence}</span>${runsOnly?`<span class="tag --line">shift closed · runs only</span>`:`<span class="st ${t.status==="awaiting_confirmation"?"--accent":""}">${DP.tripState(c)}</span>`}<span class="sp"></span>${stopsN?`<span class="cnt"><span>stops: ${stopsN} · delivered ${delivN} · <span class="${failN?"f":""}">failed ${failN}</span></span>${t.status==="awaiting_confirmation"?`<span>back at ${D14.hm(D14.mins(t.stops[t.stops.length-1].plan)+20)}</span>`:""}${t.ccz?`<span title="Congestion charge for this run">CCZ £${t.ccz}</span>`:""}</span>`:`<span class="cnt">no orders</span>`}${can&&["confirmed","awaiting_confirmation"].includes(t.status)&&op?`<button class="btn --sm" onclick="D14.routeEditor('${c}')">${ic("route")} Change route</button>`:""}<button class="ib" title="More" onclick="D14.courierPop(event,'${c}')">${ic("dots")}</button></div>`;
    if(!runsOnly&&stopsN){h+=`<div class="cb">${DP.planFact(c,true)}<div class="via">${DP.via(t.via)}${S.planFact?` · <button class="textbtn" onclick="D14.S.planFact=false;App.remount()">ETA only</button>`:` · <button class="textbtn" onclick="D14.S.planFact=true;App.remount()">Plan / fact</button>`}</div>${D14.stopsTable(t.stops)}</div>`}
    if(t.runs&&t.runs.length){h+=`<details class="d14-runs" ${runsOnly?"open":""}><summary>Runs today (${t.runs.length}) <span class="muted" style="letter-spacing:0;text-transform:none">· analytics every 60 s</span></summary>${t.runs.map(r=>`<div class="run"><div class="l1"><b>Run ${r.n}</b> · ${r.at} · plan ${r.plan} min${r.act?` / actual ${r.act} min (${r.act-r.plan>0?"+":""}${r.act-r.plan})`:""}${r.act?"":` <span class="tag --ink">in progress</span>`}${r.grade?` <span class="tag">Grade ${r.grade}</span>`:""}<span class="tnum">£${r.cost} · £${r.per}/drop</span></div><div class="l2"><span>${r.followed?"followed the route":"deviated"}${r.flags.length?" · "+r.flags.join(" · "):""}</span>${r.overrun?`<span class="accent">overrun ${r.overrun} min · £${r.overrunCost}</span>`:""}<span>${r.chips.map(x=>`<span class="tag --line">${x}</span>`).join(" ")}</span></div>
      <div class="tbl-wrap --flush mt8"><table class="tbl d14-stops"><tr><th>Order</th><th>Window</th><th>Plan</th><th>Actual</th><th>Δ</th><th>Leg plan/actual</th><th>At the door</th></tr>${r.stops.map((o,i)=>{const s=t.stops.find(x=>x.id===o.id)||{plan:D14.hm(8*60+15+i*17),act:D14.hm(8*60+20+i*17),dev:5};return`<tr><td><span class="pos">${i+1}</span> <button class="link" onclick="App.openOrder(${o.id})">#${o.id}</button> <span class="muted xs tnum">${D14.pcOf(o)}</span>${i===1&&r.n===1?` <span class="muted xs">(delivered 3)</span>`:""}${r.flags.includes("no photo")&&i===0?` <span class="tag --accent">no photo</span>`:""}</td><td class="tnum">${D14.winOf(o)}</td><td class="tnum">${s.plan}</td><td class="tnum">${s.act||"—"}</td><td class="dev ${s.dev>10?"--late":"--ok"}">${s.dev>0?"+":""}${s.dev}</td><td class="tnum">${9+i*2} / ${11+i*2} min</td><td class="tnum">${3+(o.id%4)} min</td></tr>`}).join("")}</table></div></div>`).join("")}${t.day?`<div class="day">Day: ${t.day.runs} runs, ${t.day.drops} drops, £${t.day.cost} · £${t.day.per}/drop, overpaid £${t.day.over}</div>`:""}</details>`}
    h+=`</div>`});
  App.$("#d14-ct-body").innerHTML=h;
  if(params&&params.courier){const el=document.getElementById("ct-"+params.courier);if(el)el.scrollIntoView({block:"start"});params.courier=null}
};
document.addEventListener('orders',()=>{if(App.state.current==='couriers-today')window.mount_couriers_today(App.state.params)});
</script>
