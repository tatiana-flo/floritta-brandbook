<script>
window.T12C=(()=>{
const A=()=>window.App;const esc=s=>A().esc(s);const ic=n=>A().icon(n);
const st={view:"all",q:"",page:1,open:{},due:"all",cur:null,form:null,ed:{},hl:null,demo:{wallet:true,walletLoaded:{}}};
const SEG={New:"",Growing:"",Loyal:"",VIP:"--ink",Sleeping:"",Lost:"--accent"};
const X={};
function cx(id){const u=A().customer(id);if(!u)return null;if(X[id])return X[id];const os=A().data.orders.filter(o=>o.customer===id);const i=id-5001;const ln=u.n.split(" ")[1];
 const seg=u.tags.includes("VIP")?"VIP":u.orders>=8?"Loyal":u.orders>=3?"Growing":i%7===6?"Sleeping":i%11===10?"Lost":"New";
 const reason=i%5===0?{t:"Occasion in 9 days · "+u.occasion,due:"2026-10-22",msg:"Hi "+u.first+", "+u.occasion.split(" · ")[0].toLowerCase()+" is coming up – shall we prepare something special this year? Same style as last time, or a change?",no:"no lilies",ch:"whatsapp"}:i%5===2?{t:"Rhythm due · usually every 5 weeks",due:"2026-10-20",msg:"Hi "+u.first+", it has been a little while – would you like us to put together your usual bouquet this week?",no:"",ch:i%2?"call":"whatsapp"}:i%5===4?{t:"Asked for a quote · no order yet",due:"2026-10-18",msg:"Hello "+u.first+", just checking in on the quote we sent – shall I hold the slot for you?",no:"ferrero",ch:"whatsapp"}:null;
 X[id]={seg,reason,drafted:i%5===0&&i%2?A().T(9,0,-1):null,kind:u.tags.includes("Corporate")?"company":i%9===8?"partner":"private",status:"active",risk:i%6===5?["Unpaid order"]:i%13===12?["Frequent complaints","Refunds"]:[],address:u.first,answersOn:u.channel,country:"GB",tz:"Europe/London",manager:i%3?"vanessa":(i%2?"elise":null),lang:i%6===0?"Russian":"English",
  restr:{noContact:false,noCalls:i%5===2&&i%2===1,anon:i%8===7,noPhotos:i%4===3,erasure:null,erased:null},
  recipients:[{id:1,n:"Mum – Mrs "+ln,rel:"mother",addr:"SE1",phone:i%2?"":"+44 7700 900"+String(100+i*3).slice(-3),notes:"Flat 4, bell broken",how:"Mrs "+ln,call:i%3===0?"yes":i%3===1?"no":"?",pets:i%2===0,facts:[{k:"Must not",t:"lilies (allergy)",ok:true,src:"customer, 14 Oct: “no lilies please”"},{k:"Likes",t:"garden roses",ok:i%2===0,src:"Flora, from chat 7001"},{k:"Address note",t:"leave with concierge",ok:true,src:"manual"}],gifts:os.slice(0,2).map(o=>({id:o.id,t:A().product(o.product).name+" · "+A().fmtDate(o.date)})),occ:[u.occasion]}].concat(i%3===0?[{id:2,n:"Office reception",rel:"colleague",addr:"SE1",phone:"",notes:"",how:"",call:"?",pets:false,facts:[],gifts:[],occ:["Monday desk flowers"]}]:[]),
  buyerFacts:[{k:"Likes",t:"pastel colours",ok:true,src:"Flora, from chat"},{k:"Dislikes",t:"cellophane wrap",ok:false,src:"Flora, unconfirmed"}],
  occasions:[{d:u.occasion.split(" · ")[1]||"8 Mar",t:u.occasion.split(" · ")[0],who:"Mum",every:true,ok:true,note:"",outcome:i%3===0?"ordered after the reminder":i%3===1?"reminded, no reply":null,remind:"5 days ahead"}].concat(i%4===0?[{d:"24 Dec",t:"Christmas table",who:"Home",every:false,ok:false,note:"asked once in chat",outcome:null,remind:"7 days ahead"}]:[]),
  identities:[{type:"phone",v:u.phone,primary:true,arrives:true,conf:"exact",src:"website order"},{type:"email",v:u.email,primary:true,arrives:i%7!==6,conf:i%2?"exact":"probable",src:"checkout"}].concat(i%4===0?[{type:"phone",v:"+44 7700 900"+String(100+i),primary:false,arrives:true,conf:"to check",src:"Deliveroo",service:true}]:[]),
  consents:{WhatsApp:{v:"yes",at:"14 Oct 2026",how:"in chat",who:"Vanessa"},SMS:{v:"not asked"},Email:{v:i%2?"yes":"no",at:"2 Sep 2026",how:"checkout tick box",who:"website"},Calls:{v:"not asked"},"Marketing overall":{v:i%2?"yes":"no"}},
  addresses:[{a:u.addr,place:"home",when:"weekdays after 18:00",notes:1,map:true}].concat(i%3===0?[{a:"Reception, 1 Tooley Street, SE1",place:"office",when:"Mon–Fri 08:00–18:00",notes:0,map:false}]:[]),
  notes:[{at:A().T(9,10,-3),by:"vanessa",t:"Prefers a call before delivery.",pin:true}].concat(i%2?[{at:A().T(15,0,-20),by:"elise",t:"Asked about weekly office flowers – send a quote.",pin:false}]:[]),
  tasks:i%3===0?[{due:A().T(15,0),t:"Send office flowers quote",who:"vanessa"}]:[],
  b2b:u.tags.includes("Corporate")?{name:ln+" & Partners Ltd",legal:ln+" & Partners Limited",bill:"3 Snowsfields, London SE1 3SU",vat:"GB 123 4567 89",co:"0987654",terms:30,limit:1500,words:"Net 30, invoice monthly",po:true,people:[{n:u.n,role:"orders",phone:u.phone,email:u.email},{n:"Finance team",role:"pays",phone:"",email:"ap@example.com"}]}:null,
  stats:{orders:u.orders,rev:u.spent,rev12:Math.round(u.spent*.7/1.2),aov:u.orders?Math.round(u.spent/u.orders):0,first:"Mar "+u.since,lastD:ri(3,120),interval:ri(3,9)+" weeks",occ:"Birthday ×"+Math.max(1,Math.round(u.orders/2))+", Anniversary ×1",cats:"Roses 60%, Baskets 40%",chans:u.channel+" "+ri(55,90)+"%",card:"card 80% · gift 40% · subscription 0",onTime:ri(88,100)+"%",inc:ri(0,2),refund:"£"+ri(0,60),fb:ri(4,5)+".0 ★ ×"+ri(0,4),promo:"NEW15 ×1",gift:"–",gp:ri(40,62)+"%",forecast:"£"+ri(60,400)+" · "+ri(20,80)+"% chance",lastContact:ri(1,30)+" d ago · WhatsApp",chat:"7001",computed:"today 03:10"}};
 return X[id]}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function nav(active){return window.T12?T12.nav(active):""}
const lastOrder=c=>{const os=A().data.orders.filter(o=>o.customer===c.id);return os.length?os.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0]:null};

/* ---------- CUSTOMERS LIST ---------- */
function cuRender(){
 const all=A().data.customers;const owner=A().role()==="owner";
 document.getElementById("cu-head").innerHTML=`${nav("customers")}<button class="btn --ghost --sm" onclick="T12C.exportCsv()">${ic("download")} Export CSV</button><button class="btn --sm" onclick="App.go('customer-form')">${ic("plus")} New customer</button>`;
 const VIEWS=[["all","All",c=>true],["due","Write today",c=>cx(c.id).reason&&cx(c.id).reason.due<="2026-10-20"],["New","New",c=>cx(c.id).seg==="New"],["Growing","Growing",c=>cx(c.id).seg==="Growing"],["Loyal","Loyal",c=>cx(c.id).seg==="Loyal"],["VIP","VIP",c=>cx(c.id).seg==="VIP"],["Sleeping","Sleeping",c=>cx(c.id).seg==="Sleeping"],["Lost","Lost",c=>cx(c.id).seg==="Lost"]];
 const EXTRA={vip:c=>c.tags.includes("VIP"),corporate:c=>c.tags.includes("Corporate"),birthdays:c=>/Birthday · \d+ Oct/.test(c.occasion),noemail:c=>!c.email||(c.id-5001)%7===6,repeat:c=>c.orders>=3};
 const vf=(VIEWS.find(v=>v[0]===st.view)||[])[2]||EXTRA[st.view]||(()=>true);
 let list=all.filter(vf);
 if(st.q){const q=st.q.toLowerCase();list=list.filter(c=>c.n.toLowerCase().includes(q)||c.phone.replace(/\s/g,"").includes(q.replace(/\s/g,""))||(c.email||"").toLowerCase().includes(q))}
 list.sort((a,b)=>{if(st.view==="due")return cx(a.id).reason.due.localeCompare(cx(b.id).reason.due);const x=lastOrder(a),y=lastOrder(b);const d=(y?new Date(y.date):0)-(x?new Date(x.date):0);return d||a.n.localeCompare(b.n)});
 const per=25,pages=Math.max(1,Math.ceil(list.length/per));if(st.page>pages)st.page=pages;const pg=list.slice((st.page-1)*per,st.page*per);
 const due=st.view==="due";
 document.getElementById("cu-body").innerHTML=`<div class="toolbar"><div class="search">${ic("search")}<input id="cu-q" placeholder="Search name, phone or email" value="${esc(st.q)}" onkeydown="if(event.key==='Enter')T12C.cuSearch(this.value)"></div><button class="btn --ghost --sm" onclick="T12C.cuSearch(document.getElementById('cu-q').value)">Apply</button><span class="xs muted">Apply keeps the segment chip</span></div>
 <div class="chips mb16">${VIEWS.map(v=>`<button class="chip ${st.view===v[0]?"on":""}" onclick="T12C.cuView('${v[0]}')">${v[1]}<span class="n">${all.filter(v[2]).length}</span></button>`).join("")}${EXTRA[st.view]?`<button class="chip on" onclick="T12C.cuView('all')">${st.view} ${ic("close")}</button>`:""}</div>
 <div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:15%">Name</th><th class="ph-hide" style="width:12%">Phone</th><th class="ph-hide" style="width:16%">Email</th><th class="num" style="width:7%">Orders</th><th class="num" style="width:8%">LTV</th><th class="ph-hide" style="width:9%">Last order</th><th style="width:13%">Segment</th>${due?`<th style="width:28%">Write</th>`:""}<th class="ph-hide"></th></tr></thead><tbody>
 ${pg.map(c=>{const x=cx(c.id),o=lastOrder(c);return`<tr class="r" onclick="App.go('customer-card',{id:${c.id}})"><td class="nm"><b>${esc(c.n)}</b></td><td class="tnum ph-hide">${esc(c.phone)}</td><td class="ph-hide">${c.email&&(c.id-5001)%7!==6?esc(c.email):'<span class="accent">no email</span>'}</td><td class="num">${c.orders}</td><td class="num">${A().fmt(c.spent)}</td><td class="ph-hide">${o?A().fmtDay(o.date):'<span class="muted">—</span>'}</td><td><span class="tag ${SEG[x.seg]}">${x.seg}</span>${x.reason?`<span class="sub">${esc(x.reason.t.split(" · ")[0])}</span>`:""}</td>${due?`<td class="wt" onclick="event.stopPropagation()">${writeToday(c,x)}</td>`:""}<td class="ph-hide"><span class="acts"><button class="ib" title="Message" onclick="event.stopPropagation();App.go('inbox',{customer:${c.id}})">${ic("chat")}</button><button class="ib" title="New order" onclick="event.stopPropagation();App.go('order-new',{customer:${c.id}})">${ic("plus")}</button></span></td></tr>`}).join("")||`<tr><td colspan="9"><div class="empty">${ic("customers")}<div class="h3">No customers</div><button class="textbtn" onclick="T12C.cuView('all');T12C.cuSearch('')">Show all</button></div></td></tr>`}
 </tbody></table></div>
 <div class="pager">${list.length} customers · ${per} per page <span class="sp"></span><button class="btn --ghost --sm" ${st.page<=1?"disabled":""} onclick="T12C.page(-1)">${ic("back")}</button> page ${st.page} of ${pages} <button class="btn --ghost --sm" ${st.page>=pages?"disabled":""} onclick="T12C.page(1)">${ic("chev")}</button></div>`;
}
function writeToday(c,x){const r=x.reason;if(!r)return`<span class="muted">–</span>`;const open=st.open[c.id];return`<div>${esc(r.t)}</div><button class="textbtn" onclick="T12C.toggleMsg(${c.id})">${open?"Hide message":"Ready message"}</button>${open?`<div class="rm">${esc(r.msg)}</div>`:""}${r.no?`<div class="xs accent mt8">Must not get: ${esc(r.no)}</div>`:""}<div class="btn-row mt8">${r.ch==="whatsapp"?`<button class="btn --sm" onclick="T12C.draftWA(${c.id})">${ic("chat")} Draft in WhatsApp</button>`:`<button class="btn --ghost --sm" onclick="App.toast('Dialling ${esc(c.phone)} (tel: link)')">${ic("phone")} Call ${esc(c.phone)}</button>`}${x.restr.noCalls?`<span class="xs accent">No calls, text only</span>`:""}${x.drafted?`<span class="xs muted">draft opened ${A().fmtDay(x.drafted)}</span>`:""}</div>`}

/* ---------- DUE TO REORDER ---------- */
function dueRender(){
 const rows=A().data.customers.filter(c=>c.orders>=3).map(c=>{const i=c.id-5001;const rhythm=3+i%6;const over=(i%9)-4;return{c,rhythm,over,expected:over>0?"was due "+over+" d ago":"in "+(-over)+" d",consent:i%2?"yes":"no",mobile:i%8!==7}}).filter(r=>st.due==="all"||(st.due==="overdue"?r.over>0:r.over<=0)).sort((a,b)=>b.over-a.over||b.c.spent-a.c.spent);
 const all=A().data.customers.filter(c=>c.orders>=3).map(c=>({c,over:((c.id-5001)%9)-4}));const od=all.filter(r=>r.over>0),up=all.filter(r=>r.over<=0);
 document.getElementById("due-head").innerHTML=`${nav("customers-due")}<button class="btn --ghost --sm" onclick="App.toast('CSV · ${st.due} · ${rows.length} rows · logged in the audit')">${ic("download")} Export CSV</button>`;

 <div class="card"><div class="sec-head"><div class="h3">Company</div>${x.b2b&&!st.ed.b2b?`<button class="textbtn" onclick="T12C.ed('b2b',true)">edit</button>`:""}</div>${x.b2b&&!st.ed.b2b?`<div class="sm"><b>${esc(x.b2b.name)}</b> · ${esc(x.b2b.bill)} · VAT ${x.b2b.vat} · Co. ${x.b2b.co} · pays in ${x.b2b.terms} d · limit ${A().fmt(x.b2b.limit)}${x.b2b.po?" · PO required":""} · ${esc(x.b2b.words)}</div><div class="sec-head mt16"><div class="h3">People at the company</div></div><div class="list" style="border:1px solid var(--hair)">${x.b2b.people.map((p,i)=>`<div class="li" style="cursor:default"><div class="t"><b>${esc(p.n)} · ${p.role}</b><small>${esc(p.phone||"–")} · ${esc(p.email||"–")}</small></div><button class="textbtn --accent" onclick="T12C.personDel(${i})">delete</button></div>`).join("")}</div><div class="form-inline mt8"><input class="input" id="cc-pn" placeholder="Name"><select class="select" id="cc-pr"><option>orders</option><option>approves</option><option>pays</option><option>other</option></select><input class="input" id="cc-pp" placeholder="Phone"><input class="input" id="cc-pe" placeholder="Email"><div style="grid-column:1/-1"><button class="btn --ghost --sm" onclick="T12C.personAdd()">Add person</button></div></div>`:(x.b2b||st.ed.b2b)?`<div class="form-inline">${[["name","Name *"],["legal","Legal name for invoices"],["bill","Billing address"],["vat","VAT number"],["co","Company number"],["terms","Payment terms days"],["limit","Credit limit £"],["words","Terms in words"]].map(([k,l])=>`<div class="field"><label>${l}</label><input class="input" id="cc-b-${k}" value="${esc(x.b2b?x.b2b[k]:"")}"></div>`).join("")}<label class="check" style="grid-column:1/-1"><input type="checkbox" id="cc-b-po" ${x.b2b?.po?"checked":""}> PO number required on every order</label><div class="btn-row" style="grid-column:1/-1"><button class="btn --sm" onclick="T12C.b2bSave()">Save</button><button class="btn --secondary --sm" onclick="T12C.ed('b2b',false)">Cancel</button><span class="xs accent" id="cc-b-err"></span></div></div>`:`<div class="muted sm">Private customer.</div><button class="textbtn mt8" onclick="T12C.ed('b2b',true)">+ This is a company: add billing details</button>`}</div>`;
 if(st.hl){const el=document.getElementById("recipient-1");if(el)setTimeout(()=>el.scrollIntoView({block:"center"}),50);st.hl=null}
}
function recForm(rr){return`<div class="form-inline"><div class="field"><label>Name *</label><input class="input" id="cc-rn" value="${esc(rr.n)}"></div><div class="field"><label>Who they are</label><select class="select" id="cc-rr">${["mother","father","partner","wife","husband","friend","colleague","boss","client","daughter","son","sister","brother","grandmother","neighbour","other"].map(k=>`<option ${k===rr.rel?"selected":""}>${k}</option>`).join("")}</select></div><div class="field"><label>Phone</label><input class="input" id="cc-rp" value="${esc(rr.phone)}"></div><div class="field"><label>How to address</label><input class="input" id="cc-rh" value="${esc(rr.how)}"></div><div class="field"><label>Notes</label><input class="input" id="cc-rno" value="${esc(rr.notes)}"></div><div class="field"><label>May call ahead</label><select class="select" id="cc-rc"><option ${rr.call==="yes"?"selected":""}>yes</option><option ${rr.call==="no"?"selected":""}>no</option><option ${rr.call==="?"?"selected":""}>not known</option></select></div><label class="check"><input type="checkbox" id="cc-rpet" ${rr.pets?"checked":""}> Has pets</label><div class="btn-row" style="grid-column:1/-1"><button class="btn --sm" onclick="T12C.recSave('${rr.id}')">Save</button><button class="btn --secondary --sm" onclick="T12C.recEdit('${rr.id}',false)">Cancel</button><span class="xs accent" id="cc-rerr"></span></div></div>`}

const api={
 cuView(v){st.view=v;st.page=1;cuRender()},
 cuSearch(q){st.q=q;st.page=1;cuRender()},
 page(d){st.page+=d;cuRender()},
 toggleMsg(id){st.open[id]=!st.open[id];cuRender()},
 draftWA(id){const x=cx(id);const u=A().customer(id);if(x.restr.noContact){A().toast("Do not contact – no draft created");return}x.drafted=A().NOW.toISOString();A().toast("Draft placed in the WhatsApp chat – not sent");A().go("inbox",{customer:id,draft:x.reason.msg})},
 exportCsv(){const n=A().data.customers.length;A().modal({title:"Export CSV",body:`<div class="sm">Columns: ID, Name, Phone, Email, Channel, Orders, LTV, Last order.</div><div class="col mt16" style="gap:8px"><label class="check"><input type="radio" name="cx" checked> Whole base · ${n} customers</label><label class="check"><input type="radio" name="cx"> Current view and search only</label></div><div class="xs muted mt8">Logged in the audit as customer.export</div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="App.closeModal();App.toast('customers.csv downloaded')">Download</button>`})},
 dueFilter(k){st.due=k;dueRender()},
 cfBack(){if(st.form)A().go("customer-card",{id:st.form});else A().go("customers")},
 cfSave(){const g=id=>(document.getElementById("cf-"+id)?.value||"").trim();const n=g("name"),p=g("phone"),e=g("email");st.err={};
  if(!n)st.err.name="Name is required";if(p&&!/^\+44 ?7\d{3} ?\d{6}$/.test(p))st.err.phone="UK mobile in international format";
  if(Object.keys(st.err).length){cfRender();return}
  const dup=A().data.customers.find(c=>c.id!==st.form&&((p&&c.phone.replace(/\s/g,"")===p.replace(/\s/g,""))||(e&&c.email===e)));
  if(!st.form&&dup){A().toast("Matched an existing customer – opened their card instead");A().go("customer-card",{id:dup.id});return}
  const noContact=document.getElementById("cf-nocontact").classList.contains("on");
  if(st.form){const u=A().customer(st.form);const x=cx(u.id);u.n=n;u.phone=p||u.phone;u.email=e;u.note=g("notes");u.tags=g("tags")?g("tags").split(",").map(s=>s.trim()).filter(Boolean):[];x.restr.noContact=noContact;x.restr.noCalls=document.getElementById("cf-nocalls").classList.contains("on");x.restr.anon=document.getElementById("cf-anon").classList.contains("on");x.restr.noPhotos=document.getElementById("cf-nophotos").classList.contains("on");x.lang=g("lang");x.address=g("how");x.kind=g("kind").toLowerCase();x.answersOn=g("ans");x.country=g("country").toUpperCase();x.tz=g("tz");const mg=A().data.staff.find(s=>s.n===g("mgr"));x.manager=mg?mg.id:null;if(noContact){x.consents["Marketing overall"]={v:"no",at:"today",how:"Do not contact",who:A().me().n}}A().toast("Saved"+(noContact?" · marketing off, refusal logged":""));A().go("customer-card",{id:u.id})}
  else{const id=5100+A().data.customers.filter(c=>c.id>=5100).length;A().data.customers.push({id,n,first:n.split(" ")[0],phone:p,email:e,addr:"",tags:g("tags")?g("tags").split(",").map(s=>s.trim()):[],occasion:"—",orders:0,spent:0,since:"2026",channel:g("ans")||"Phone",note:g("notes")});const x=cx(id);x.restr.noContact=noContact;x.lang=g("lang");A().toast(n+" created · source CRM");A().go("customer-card",{id})}},
 merge(){const u=A().customer(st.cur);A().modal({title:"Merge with…",wide:true,body:`<div class="field"><label>Search by name, phone or email (2+ characters)</label><input class="input" id="cc-mq" oninput="T12C.mergeSearch(this.value)"></div><div id="cc-mres" class="mt8"></div><div id="cc-mprev" class="mt16"></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm is-disabled" id="cc-mgo" onclick="T12C.mergeGo()">Merge</button>`,onMount:()=>setTimeout(()=>document.getElementById("cc-mq")?.focus(),40)})},
 mergeSearch(q){q=q.trim().toLowerCase();const r=document.getElementById("cc-mres");if(q.length<2){r.innerHTML="";return}const list=A().data.customers.filter(c=>c.n.toLowerCase().includes(q)||c.phone.includes(q)||(c.email||"").includes(q)).slice(0,5);r.innerHTML=`<div class="list" style="border:1px solid var(--hair)">${list.map(c=>`<div class="li" onclick="T12C.mergePick(${c.id})"><div class="t"><b>${esc(c.n)}</b><small>${esc(c.phone)} · ${c.orders} orders</small></div></div>`).join("")||'<div class="muted sm" style="padding:8px 12px">Nothing found</div>'}</div>`},
 mergePick(id){const u=A().customer(st.cur),o=A().customer(id);const p=document.getElementById("cc-mprev");st.mergeWith=id;if(id===st.cur){p.innerHTML=`<div class="note-box --accent">This card cannot be merged – pick another one.</div>`;document.getElementById("cc-mgo").classList.add("is-disabled");return}p.innerHTML=`<div class="grid g2"><div class="card"><span class="caps">Stays</span><b>${esc(u.n)}</b><div class="xs muted">#${u.id} · ${u.orders} orders</div></div><div class="card --flat"><span class="caps">Merged in and removed</span><b>${esc(o.n)}</b><div class="xs muted">#${o.id} · ${o.orders} orders</div></div></div><div class="sm mt8">Moves here: Orders ${o.orders}, Addresses 1, Chat contacts 1, Phones and emails 2, Recipients, Facts, Consents.</div>`;document.getElementById("cc-mgo").classList.remove("is-disabled")},
 mergeGo(){const o=A().customer(st.mergeWith);const u=A().customer(st.cur);u.orders+=o.orders;u.spent+=o.spent;A().closeModal();A().toast(`Customer #${o.id} merged in (${o.orders} orders moved)`);ccRender()},
 wallet(id){st.demo.walletLoaded[id]=true;ccRender()},
 walletOff(){st.demo.wallet=!st.demo.wallet;ccRender()},
 ed(k,v){st.ed[k]=v;ccRender()},
 recEdit(id,v=true){st.ed["r"+id]=v;if(id==="new")st.ed.rnew=v;ccRender()},
 recSave(id){const x=cx(st.cur);const n=document.getElementById("cc-rn").value.trim();if(!n){document.getElementById("cc-rerr").textContent="Name is required – the form stays open";return}const d={n,rel:document.getElementById("cc-rr").value,phone:document.getElementById("cc-rp").value.trim(),how:document.getElementById("cc-rh").value.trim(),notes:document.getElementById("cc-rno").value.trim(),call:{yes:"yes",no:"no","not known":"?"}[document.getElementById("cc-rc").value],pets:document.getElementById("cc-rpet").checked};
  if(id==="new"){x.recipients.push(Object.assign({id:Date.now()%1000,addr:"",facts:[],gifts:[],occ:[]},d));st.ed.rnew=false;A().toast("Recipient added · gifts pulled from orders")}else{const r=x.recipients.find(r=>String(r.id)===String(id));Object.assign(r,d);st.ed["r"+id]=false;A().toast("Recipient saved")}ccRender()},
 recDel(id){const x=cx(st.cur);A().confirm("Delete this recipient?","Occasions stay with the customer, facts are closed, gifts are removed.","Delete",()=>{x.recipients=x.recipients.filter(r=>r.id!==id);ccRender();A().toast("Recipient deleted")},{danger:true})},
 factAdd(rid,v){st.ed[rid==="b"?"fb":"f"+rid]=v;ccRender()},
 factSave(rid){const x=cx(st.cur);const k=document.getElementById("cc-fk-"+rid).value,t=document.getElementById("cc-ft-"+rid).value.trim();if(!t){A().toast("Write what to note – the form stays open");return}const f={k,t,ok:true,src:"manual · "+A().me().n};if(rid==="b")x.buyerFacts.push(f);else x.recipients.find(r=>r.id===rid).facts.push(f);st.ed[rid==="b"?"fb":"f"+rid]=false;ccRender();A().toast("Fact saved · confirmed")},
 factClose(rid,t){const x=cx(st.cur);A().confirm("Close this fact?","“"+t+"” is not deleted – it stays in Facts review.","Close fact",()=>{if(rid==="b")x.buyerFacts=x.buyerFacts.filter(f=>f.t!==t);else{const r=x.recipients.find(r=>r.id===rid);r.facts=r.facts.filter(f=>f.t!==t)}ccRender();A().toast("Fact closed")})},
 declined(i){const x=cx(st.cur);A().confirm("Mark as declined?","The customer said no this year – the reminder will come back next year.","Mark declined",()=>{x.occasions[i].outcome="declined this time";ccRender();A().toast("Marked as declined")})},
 primary(i){const x=cx(st.cur);const d=x.identities[i];x.identities.forEach(o=>{if(o.type===d.type)o.primary=false});d.primary=true;ccRender();A().toast("Primary "+d.type+" · "+d.v)},
 consSave(){const x=cx(st.cur);const ch=document.getElementById("cc-ch").value,ans=document.getElementById("cc-ans").value;if(ch==="Instagram DM"){document.getElementById("cc-cons-err").textContent="The card has no contact for this channel.";return}x.consents[ch]={v:ans,at:"today",how:"recorded by hand",who:A().me().n};st.ed.cons=false;ccRender();A().toast("Consent recorded")},
 erasure(step){const x=cx(st.cur);if(step==="requested")A().confirm("Record an erasure request?","Switches on Do not contact and turns marketing off. The data itself is erased by an admin by hand.","Record request",()=>{x.restr.erasure=A().fmtDate(A().NOW.toISOString());x.restr.noContact=true;x.consents["Marketing overall"]={v:"no",at:"today",how:"erasure request",who:A().me().n};ccRender();A().toast("Erasure request recorded")},{danger:true});else A().confirm("Mark the erasure as done?","Confirms the personal data was removed by hand.","Mark done",()=>{x.restr.erased=A().fmtDate(A().NOW.toISOString());ccRender();A().toast("Erasure marked done")})},
 addrSave(i){const x=cx(st.cur);x.addresses[i].place=document.getElementById("cc-ap-"+i).value;x.addresses[i].when=document.getElementById("cc-aw-"+i).value;st.ed["a"+i]=false;ccRender();A().toast("Address saved")},
 noteSave(){const x=cx(st.cur);const t=document.getElementById("cc-note").value.trim();if(!t){A().toast("Write the note first");return}x.notes.unshift({at:A().NOW.toISOString(),by:A().me().id,t,pin:false});ccRender();A().toast("Note saved")},
 noteDel(i){const x=cx(st.cur);const list=x.notes.slice().sort((a,b)=>b.pin-a.pin);A().confirm("Delete this note?","“"+list[i].t+"” – the text is kept in the audit log.","Delete",()=>{x.notes=x.notes.filter(n=>n!==list[i]);ccRender();A().toast("Note deleted")},{danger:true})},
 taskAdd(){const x=cx(st.cur);const t=document.getElementById("cc-task").value.trim();if(!t){A().toast("Name the task");return}x.tasks.push({due:document.getElementById("cc-task-d").value+"T15:00:00",t,who:x.manager||A().me().id});ccRender();A().toast("Task created · Tasks module")},
 b2bSave(){const x=cx(st.cur);const g=k=>document.getElementById("cc-b-"+k).value.trim();if(!g("name")){document.getElementById("cc-b-err").textContent="Company name is required";return}x.b2b=Object.assign(x.b2b||{people:[]},{name:g("name"),legal:g("legal"),bill:g("bill"),vat:g("vat"),co:g("co"),terms:+g("terms")||30,limit:+g("limit")||0,words:g("words"),po:document.getElementById("cc-b-po").checked});if(x.kind==="private")x.kind="company";st.ed.b2b=false;ccRender();A().toast("Company details saved")},
 personAdd(){const x=cx(st.cur);const n=document.getElementById("cc-pn").value.trim();if(!n){A().toast("Name is required");return}x.b2b.people.push({n,role:document.getElementById("cc-pr").value,phone:document.getElementById("cc-pp").value,email:document.getElementById("cc-pe").value});ccRender();A().toast("Person added")},
 personDel(i){const x=cx(st.cur);A().confirm("Remove this person?",x.b2b.people[i].n+" will no longer be listed at the company.","Remove",()=>{x.b2b.people.splice(i,1);ccRender();A().toast("Person removed")},{danger:true})},
 cx
};
window.mount_customers=function(p){p=p||{};if(p.view)st.view=p.view;if(p.rfm)st.view="all";if(p.q!==undefined)st.q=p.q;cuRender();A().registerCommands([{g:"Actions",t:"New customer",ic:"user",fn:()=>A().go("customer-form")},{g:"Actions",t:"Customers · Write today",ic:"chat",fn:()=>A().go("customers",{view:"due"})}])};
window.mount_customers_due=function(){dueRender()};
window.mount_customer_form=function(p){p=p||{};st.form=p.id?Number(p.id):null;st.err=null;cfRender()};
window.mount_customer_card=function(p){p=p||{};if(p.id)st.cur=Number(p.id);if(!st.cur)st.cur=A().data.customers[0].id;st.ed={};st.hl=p.anchor||null;ccRender()};
document.addEventListener("orders",()=>{const c=A().state.current;if(c==="customer-card")ccRender();if(c==="customers")cuRender()});
return api;
})();
</script>
