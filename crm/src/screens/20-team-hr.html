<script>
(()=>{
const A=App,E=s=>A.esc(s),I=n=>A.icon(n),$=A.$,$$=A.$$;
const isAdmin=()=>A.role()==="owner",isMgr=()=>A.isMgr();
const name=id=>A.user(id)?.n||id;
/* demo switches */
const st={limited:false,floristEditor:false,month:"2026-10",flash:null,sjTab:"shifts",enpsState:"form",noProfile:false,resEmpty:false,candQ:"",candF:{role:"",stage:"",work:"",source:"",exp:false},candSort:"new",pplRead:false,weeks:8};
const fmtD=(y,m,d)=>new Date(y,m-1,d).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const MONTHS={"2026-09":"September 2026","2026-10":"October 2026","2026-11":"November 2026"};
const toast=A.toast;
function flash(type,text){st.flash={type,text}}
const flashHtml=()=>st.flash?`<div class="flash --${st.flash.type}">${I(st.flash.type==="err"?"alert":"info")}<span>${E(st.flash.text)}</span><span class="x" onclick="TH.clearFlash()">${I("close")}</span></div>`:"";

/* ---------- HrNav ---------- */
const HRNAV=[["team","Schedule"],["team-leave","Leave"],["team-candidates","Candidates"],["team-reserve","Reserve","mgr"],["team-shifts-jobs","Shifts & jobs","mgr"],["team-announcements","Announcements","mgr"],["team-motivation","Motivation","adm"],["team-people","People","adm"],["team-pay-statements","Pay statements","adm"],["team-hiring","Hiring","adm"]];
function nav(cur){
  const items=HRNAV.filter(n=>!n[2]||(n[2]==="mgr"&&isMgr())||(n[2]==="adm"&&isAdmin())).filter(n=>!(st.limited&&A.role()==="florist")||["team","team-leave","team-candidates"].includes(n[0]));
  const cnt={"team-reserve":RESERVE.filter(p=>p.rtw==="sent").length,"team-shifts-jobs":OFFERS.filter(o=>o.status==="open").length,"team-hiring":CANDS.filter(c=>c.stage!=="pool"&&c.stage!=="hired"&&c.stage!=="rejected").length};
  return items.map(n=>`<button class="${cur===n[0]?"on":""}" onclick="App.go('${n[0]}')">${n[1]}${cnt[n[0]]?`<span class="n">${cnt[n[0]]}</span>`:""}</button>`).join("")+
   (A.role()==="florist"?`<span class="demo"><span class="xs muted">Demo: seasonal / trainee</span><span class="switch ${st.limited?"on":""}" onclick="TH.toggle('limited')" title="Limited access role sees only Schedule, Leave, Candidates and cannot open Closing the day"></span></span>`:"");
}
function paintNav(){$$(".th-nav").forEach(el=>{el.innerHTML=nav(el.dataset.navFor)})}
function toggle(k){st[k]=!st[k];A.remount();toast(k==="limited"?(st.limited?"Viewing as a seasonal / trainee florist – limited access":"Full florist access"):k==="floristEditor"?(st.floristEditor?"You are now the florist-schedule editor":"Florist schedule editor removed"):k==="noProfile"?(st.noProfile?"Login not linked to a team profile":"Profile linked"):k==="resEmpty"?"Reserve demo state changed":k==="pplRead"?(st.pplRead?"Read-only branch":"Editing enabled"):"Changed")}

/* ---------- SCHEDULE data (fictional) ---------- */
const SECTIONS=[["florists","Florists",["svetlana","marina","olesya","anna","lina"]],["managers","Managers",["valeria","kamila"]],["support","Support",["eliza"]],["couriers","Couriers",["daniel","george","omar"]]];
const CODES=[["D","Day · 08:00–17:00"],["EV","Evening · 13:00–22:00"],["2","Double · 08:00–22:00"],["M","Morning · 08:00–13:00"],["Event","Event / workshop"],["H","Holiday"]];
const PAT={svetlana:"DDDDD..",marina:"DEVD.DD.",olesya:"EVEVEV.EVEV.",anna:"DD.DD..",lina:"D.DDD..",valeria:"MMMMM..",kamila:".EVEVEVEVEV.",eliza:"DDDDD..",daniel:"DDDDDD.",george:".EVEVEVEVEVEV",omar:"..EVEVEVEV."};

function buildMonth(m){

  const sel=(k,opts,ph)=>`<select class="select" style="width:auto;min-width:130px" onchange="TH.candFilter('${k}',this.value)"><option value="">${ph}</option>${opts.map(o=>`<option value="${o[0]}" ${f[k]===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select>`;
  $("#th-cand-body").innerHTML=`${flashHtml()}${webN?`<div class="flash --warn">${I("globe")}<span>New applications from the website: <b>${webN}</b> – open a card to mark it seen.</span><button class="textbtn" style="margin-left:auto" onclick="TH.candFilter('source','Website form')">show</button></div>`:""}
    <div class="toolbar"><div class="search">${I("search")}<input placeholder="Search name, phone, email, skill… (Enter)" value="${E(st.candQ)}" onkeydown="if(event.key==='Enter')TH.candSearch(this.value)"></div><button class="btn --ghost --sm" onclick="TH.candSearch(this.previousElementSibling.querySelector('input').value)">Search</button>
      ${sel("role",ROLES,"Role(s)")}${sel("stage",STAGES,"Stage")}${sel("work",WORK,"Work type")}${sel("source",SOURCES.map(s=>[s,s]),"Where we met")}
      <label class="check sm"><input type="checkbox" ${f.exp?"checked":""} onchange="TH.candFilter('exp',this.checked)">Retention expiring</label>
      ${(q||f.role||f.stage||f.work||f.source||f.exp)?`<button class="textbtn" onclick="TH.candReset()">clear</button>`:""}</div>
    ${list.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="sort" onclick="TH.candSortBy('new')">Name ${st.candSort==="new"?"↓":""}</th><th>Role(s)</th><th>Stage</th><th>Phone</th><th>Email</th><th>Added by</th><th class="sort" onclick="TH.candSortBy('contacted')">Last contacted ${st.candSort==="contacted"?"↓":""}</th></tr></thead><tbody>${list.map(c=>`<tr class="r" onclick="TH.openCand(${c.id})"><td><b style="font-weight:400">${E(c.name)}</b> ${c.web?`<span class="tag --line">From the website</span>`:""}${c.anonymised?`<span class="tag">Anonymised</span>`:""}</td><td>${c.roles.map(r=>ROLES.find(x=>x[0]===r)[1]).join(", ")}</td><td>${A.pill(c.stage==="hired"?"done":c.stage==="rejected"?"cancelled":c.stage==="pool"?"queue":"doing",stageLbl(c.stage))} ${expiring(c)?`<span class="tag --accent">Retention expiring</span>`:""}</td><td class="tnum">${E(c.phone)||"–"}</td><td>${E(c.email)||"–"}</td><td>${c.added==="system"?"Website":E(name(c.added))}</td><td class="muted">${c.contacted?fmtD(...c.contacted.split("-").map(Number)):"–"}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan="7">${list.length} candidates · all shown, no pagination · consent kept 36 months</td></tr></tfoot></table></div>`:`<div class="empty">${I("user")}<div class="h3">Nobody added yet</div><div class="sm">${q||f.role||f.stage?"Nothing matches these filters.":"Add the first candidate."}</div><button class="btn --sm" onclick="TH.candForm()">Add a candidate</button></div>`}`;
}

  $("#th-ann-body").innerHTML=`${flashHtml()}<div class="two"><div class="card"><div class="h3 mb16">New announcement</div><div class="field"><label>Title * (160)</label><input class="input" id="an-title" maxlength="160" value="${E(annDraft.title)}" oninput="TH.annIn()"></div><div class="field mt8"><label>Text * (20 000)</label><textarea class="textarea" id="an-text" style="min-height:110px" oninput="TH.annIn()">${E(annDraft.text)}</textarea></div><div class="field mt8"><label>Who should read it</label><div class="chips">${[["everyone","Everyone"],["florist","Florists"],["manager","Managers"],["courier","Couriers"],["assistant","Assistants"]].map(x=>`<button class="chip ${annDraft.aud.includes(x[0])?"on":""}" onclick="TH.annAud('${x[0]}')">${x[1]}</button>`).join("")}</div></div><div class="row mt16"><label class="check sm"><input type="checkbox" id="an-ack" ${annDraft.ack?"checked":""}>Ask for «Got it»</label></div><div class="row mt16"><button class="btn --sm" id="an-pub" ${annDraft.title&&annDraft.text?"":"disabled"} onclick="TH.annPublish()">${I("send")} Publish</button><span class="xs muted">Push «Announcement · …» to the audience; you are confirmed automatically. No editing after publishing – post a correction.</span></div></div>
   <div>${list.length?list.map(a=>`<div class="ann">${needMe(a)?`<div class="flash --warn" style="margin-bottom:8px">${I("bell")}<span>You have not confirmed this one – tap «Got it» in the app.</span></div>`:""}<div class="t">${E(a.title)}</div><div class="meta">${a.at} · by ${E(name(a.by))} · ${a.aud.includes("everyone")?"Everyone":a.aud.map(r=>r[0].toUpperCase()+r.slice(1)+"s").join(", ")}</div><div class="body">${E(a.text)}</div><div class="row mt8" style="flex-wrap:wrap;gap:8px">${a.ack?`<span class="pill ${a.pending.length?"--review":"--done"}">Got it: ${a.acked.length} of ${a.acked.length+a.pending.length}</span>`:`<span class="pill --plain">No confirmation asked</span>`}${a.ack&&a.pending.length?`<span class="sm">Not yet: ${a.pending.map(p=>E(name(p))).join(", ")}</span><button class="btn --ghost --sm" title="Once per 60 min" ${a.reminded==="just now"?"disabled":""} onclick="TH.annRemind(${a.id})">${I("bell")} Remind</button>${a.reminded?`<span class="xs muted">Last reminded ${a.reminded}</span>`:""}`:a.ack?`<span class="sm ok">Everyone has confirmed</span>`:""}</div>${a.acked.length?`<details class="mt8"><summary>Confirmed · ${a.acked.length}</summary><div class="sm soft mt8">${a.acked.map(x=>`${E(name(x[0]))} · ${x[1]}`).join("<br>")}</div></details>`:""}</div>`).join(""):`<div class="empty">${I("bell")}<div class="h3">No announcements yet</div></div>`}<div class="xs muted">Unconfirmed-by-you first, then newest. Expired announcements drop off the feed.</div></div></div>`}
function annIn(){annDraft.title=$("#an-title").value;annDraft.text=$("#an-text").value;annDraft.ack=$("#an-ack").checked;$("#an-pub").disabled=!(annDraft.title.trim()&&annDraft.text.trim())}
function annAud(r){if(r==="everyone")annDraft.aud=["everyone"];else{annDraft.aud=annDraft.aud.filter(x=>x!=="everyone");if(annDraft.aud.includes(r))annDraft.aud=annDraft.aud.filter(x=>x!==r);else annDraft.aud.push(r);if(!annDraft.aud.length)annDraft.aud=["everyone"]}mountAnn()}
function annPublish(){annIn();const aud=annDraft.aud;const ppl=A.data.staff.filter(s=>s.id!==A.me().id&&(aud.includes("everyone")||aud.includes(s.role)||(aud.includes("assistant")&&s.title==="Assistant")));ANN.unshift({id:Date.now(),title:annDraft.title.trim(),text:annDraft.text.trim(),by:A.me().id,at:"Tue 20 Oct 10:42",aud:aud.slice(),ack:annDraft.ack,acked:[],pending:annDraft.ack?ppl.map(p=>p.id):[],reminded:null});flash("ok",`Published · push sent to ${ppl.length} people`);A.push("Announcement · "+annDraft.title.trim(),annDraft.text.trim().slice(0,80),{icon:"bell"});Object.assign(annDraft,{title:"",text:"",aud:["everyone"],ack:true});mountAnn()}
function annRemind(id){const a=ANN.find(x=>x.id===id);if(a.reminded==="just now"){flash("err","Too soon – once per 60 min");mountAnn();return}a.reminded="just now";flash("ok",`Reminded ${a.pending.length}`);mountAnn()}

function pplSet(id,f,v){const p=PEOPLE.find(x=>x.id===id);if(!p.login&&(f==="variant"||f==="contour")){flash("err","This person has no login");mountPeople();return}p[f]=f==="tier"?+v:v;if(f==="emp")p.contour=v;toast(`${p.n} · ${f==="emp"?"employment":f==="variant"?"app version":f==="contour"?"contour":"tier"} → ${v}`);mountPeople()}
function rateSet(id,inp){const p=PEOPLE.find(x=>x.id===id);const raw=inp.value.trim().replace(",",".");const e=$("#rate-e-"+id);e.textContent="";if(!raw){p.rate=null;toast(p.n+" · tier rate");return}const v=parseFloat(raw);if(isNaN(v)||v<8||v>60){e.textContent="Rate must be £8–£60/h – value reverted";inp.value=p.rate??"";return}p.rate=v;toast(p.n+" · own rate £"+v+"/h")}
function skillSet(id,i,v){const p=PEOPLE.find(x=>x.id===id);p.skills[i]=+v;toast(`${p.n} · ${SKILLS[i]} → ${v}`);mountPeople()}
function agrEnds(k,v){if(v&&v<"2026-10-20"){flash("err","Agreement end date cannot be in the past");mountPeople();return}AGR_ENDS[k]=v;toast(k+" agreements end "+(v||"by term from signing")+" · every current signature recalculated")}

function avatarSet(id,src){PEOPLE.find(x=>x.id===id).photo=src;A.closeModal();toast("Photo uploaded");mountPeople()}
function resetPw(id){const p=PEOPLE.find(x=>x.id===id);if(p.id===A.me().id){flash("err","You cannot change your own password here – use Settings");mountPeople();return}A.modal({title:"Set a new login password for "+E(p.n),body:`<div class="sm muted mb16">${E(p.email)} · every app and API session is signed out.</div><div class="field"><label>New password</label><input class="input" type="password" id="pw-in" placeholder="≥ 8 characters, letters and digits"><div class="ferr" id="pw-e"></div></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="TH.resetPwGo('${id}')">Save</button>`})}
function resetPwGo(id){const v=$("#pw-in").value;if(v.length<8||!/\d/.test(v)||!/[a-zA-Z]/.test(v)){$("#pw-e").textContent="At least 8 characters with letters and digits";return}A.closeModal();flash("ok","Password updated · "+name(id)+" signed out everywhere");mountPeople()}

function paperGo(id){const p=PEOPLE.find(x=>x.id===id);const k=$("#pp-kind").value;p.agreement={kind:k,state:"signed on paper",until:AGR_ENDS[k]||"6 months"};A.closeModal();toast("Agreement saved · signed on paper");mountPeople()}
function pplDelete(id){const p=PEOPLE.find(x=>x.id===id);if(p.id===A.me().id){flash("err","You cannot delete yourself");mountPeople();return}A.confirm(`Delete ${E(p.n)} completely – login, roster card and shifts?`,"Shifts, schedule rows, 1:1s, trainings, leave, skills, profile, login and tokens are removed. This cannot be undone.","Delete",()=>{PEOPLE.splice(PEOPLE.indexOf(p),1);flash("ok",p.n+" deleted");mountPeople()},{danger:true})}
function trainDone(id){const t=TRAININGS.find(x=>x.id===id);A.confirm("Mark the training done?",`${name(t.who)} · ${t.skill} → level ${t.to}. The skill level is updated on the matrix.`,"Done",()=>{const p=PEOPLE.find(x=>x.id===t.who);if(p)p.skills[SKILLS.indexOf(t.skill)]=Math.max(p.skills[SKILLS.indexOf(t.skill)],t.to);TRAININGS.splice(TRAININGS.indexOf(t),1);flash("ok","Training done · "+name(t.who)+" is now level "+t.to+" in "+t.skill);mountPeople()})}

function trainAddGo(){TRAININGS.push({id:Date.now(),who:$("#tr-who").value,skill:$("#tr-skill").value,to:+$("#tr-to").value,how:$("#tr-how").value||"To plan",deadline:$("#tr-dl").value});A.closeModal();toast("Training added");mountPeople()}

   <div class="sec-head"><div class="h3">Shift-KPI bonuses · October</div><span class="xs muted">Bonus = (bouquets − 50) × £1.50 · defects and late starts shown for context</span></div>

   <div class="two"><div><div class="sec-head"><div class="h3">1:1 cadence</div></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Person</th><th>Last</th><th>Next</th><th>Status</th></tr></thead><tbody>${o2o.length?o2o.map(x=>`<tr><td>${E(name(x.who))} ${empTag(x.who)}</td><td>${x.last}</td><td>${x.next||"–"}${x.note?`<span class="sub">${E(x.note)}</span>`:""}</td><td>${A.pill(x.status==="Overdue"?"late":x.status==="Planned"?"doing":"done",x.status)}</td></tr>`).join(""):`<tr><td colspan="4">–</td></tr>`}</tbody></table></div></div>
   <div><div class="sec-head"><div class="h3">Leave</div><span class="xs muted">all requests · decide here</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Person</th><th>Dates</th><th>Status</th><th></th></tr></thead><tbody>${LEAVE.length?LEAVE.slice().sort((a,b)=>(a.status==="requested"?0:1)-(b.status==="requested"?0:1)).map(l=>`<tr><td>${E(name(l.who))} ${empTag(l.who)}</td><td>${fmtD(...l.from.split("-").map(Number))} – ${fmtD(...l.to.split("-").map(Number))}</td><td>${A.pill(l.status==="approved"?"done":l.status==="rejected"?"cancelled":"review",l.status[0].toUpperCase()+l.status.slice(1))}</td><td style="text-align:right">${l.status==="requested"?`<div class="row" style="gap:4px;justify-content:flex-end"><button class="btn --sm" onclick="TH.leaveDecide(${l.id},true)">Approve</button><button class="btn --ghost --sm" onclick="TH.leaveDecide(${l.id},false)">Reject</button></div>`:""}</td></tr>`).join(""):`<tr><td colspan="4">–</td></tr>`}</tbody></table></div></div></div>`}
function leaveDecide(id,ok){const l=LEAVE.find(x=>x.id===id);if(ok){const m=l.from.slice(0,7);const g=SCHED[m]?.[l.who]||{};const clash=Object.keys(g).filter(d=>{const ds=m+"-"+String(d).padStart(2,"0");return ds>=l.from&&ds<=l.to&&g[d].code!=="H"});if(clash.length){flash("err",`Cannot approve – ${name(l.who)} has ${clash.length} published shift${clash.length>1?"s":""} in those dates (${clash.join(", ")} ${MONTHS[m]?.split(" ")[0]||m}). Clear them in the schedule first.`);mountMot();return}l.status="approved";flash("ok",`Leave approved · ${name(l.who)} · task closed`)}else{l.status="rejected";flash("ok",`Leave rejected · ${name(l.who)}`)}A.push("Leave "+(ok?"approved":"rejected"),name(l.who)+" · "+l.from+" – "+l.to,{icon:"calendar"});mountMot()}
function runEnps(){flash("ok","eNPS survey for Q4 2026 sent – it was already open, nothing changed. Share the link with the team: the survey is on Team → eNPS survey.");mountMot()}

  $("#th-enps-head").innerHTML=`<button class="ib" onclick="App.back()">${I("back")}</button><div class="h3">eNPS survey · ${ENPS.survey}</div><span class="sp"></span><div class="seg-ctl">${[["none","No survey"],["answered","Answered"],["form","Form"]].map(x=>`<button class="${s===x[0]?"on":""}" onclick="TH.enpsState('${x[0]}')">${x[1]}</button>`).join("")}</div>`;
  $("#th-enps-body").innerHTML=s==="none"?`<div class="empty">${I("chat")}<div class="h3">No active eNPS survey right now.</div><div class="sm">The owner starts one each quarter from Motivation.</div></div>`:s==="answered"?`<div class="empty">${I("check")}<div class="h3">Thanks – you have already answered this survey.</div><div class="sm">Answers are anonymous; only the score and the comment are kept.</div></div>`:
   `<div class="card" style="max-width:640px"><div class="h3">How likely are you to recommend Floritta as a place to work?</div><div class="xs muted mt8 mb16">Anonymous · 0 = not at all likely · 10 = extremely likely</div><div class="scale">${Array.from({length:11},(_,i)=>`<button class="${enpsScore===i?"on":""}" onclick="TH.enpsPick(${i})">${i}</button>`).join("")}</div><div class="row mt8" style="justify-content:space-between"><span class="xs muted">Not at all likely</span><span class="xs muted">Extremely likely</span></div><div class="field mt16"><label>Anything you want to add? (optional)</label><textarea class="textarea" id="enps-c"></textarea></div><div class="row mt16"><button class="btn --sm" id="enps-go" ${enpsScore===null?"disabled":""} onclick="TH.enpsSubmit()">Submit</button><div class="ferr" id="enps-e"></div></div></div>`}
function enpsState(s){st.enpsState=s;mountEnps()}
function enpsPick(i){enpsScore=i;$$("#s-team-enps .scale button").forEach((b,k)=>b.classList.toggle("on",k===i));$("#enps-go").disabled=false}

/* ---------- PAY STATEMENTS ---------- */
const WORKERS=()=>PEOPLE.filter(p=>p.contour==="worker");
const PAY={};// week -> worker -> status
const weekList=n=>Array.from({length:n},(_,i)=>{const s=new Date(2026,9,19);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+6);return{key:s.toISOString().slice(0,10),s,e,cur:i===0}});
function payRow(w,wk,i){const seed=(w.id.length*7+i*13)%9;const booked=2+seed%3,clocked=wk.cur?Math.max(0,booked-1):booked;const hrs=clocked*7+(seed%2?0.5:0);const rate=w.rate||TIER_RATE[w.tier];const urgent=seed===4?1:0;const pay=hrs*rate+urgent*2*7,bonus=seed%3===0?15:0,learn=seed*6,hol=+(pay*0.1207).toFixed(2);return{booked,clocked,hrs,rate,urgent,pay,bonus,learn,hol,total:pay+bonus+hol,status:PAY[wk.key]?.[w.id]||(i>=3?"paid":i>=1?"approved":"draft"),paidAt:i>=3?fmtD(2026,wk.e.getMonth()+1,wk.e.getDate()+2):null}}
function mountPay(){paintNav();const ws=WORKERS();
  $("#th-pay-head").innerHTML=`<div class="h3">Pay statements</div><span class="xs muted">casual workers · draft → approved → paid</span><span class="sp"></span><select class="select" style="width:160px" onchange="TH.weeks(this.value)">${[4,8,13,26].map(n=>`<option value="${n}" ${st.weeks===n?"selected":""}>Last ${n} weeks</option>`).join("")}</select>`;
  if(!ws.length){$("#th-pay-body").innerHTML=`<div class="empty">${I("pound")}<div class="h3">Nobody is in the worker contour yet</div><div class="sm">Set it in <button class="link" onclick="App.go('team-people')">People</button>.</div></div>`;return}
  $("#th-pay-body").innerHTML=flashHtml()+weekList(st.weeks).map((wk,i)=>{const rows=ws.map(w=>({w,r:payRow(w,wk,i)}));const tot=rows.reduce((a,x)=>a+x.r.total,0);
   return `<div class="wk"><div class="wk-h"><div class="h4">Week ${fmtD(2026,wk.s.getMonth()+1,wk.s.getDate())} – ${fmtD(2026,wk.e.getMonth()+1,wk.e.getDate())}${wk.cur?' <span class="tag --line">in progress</span>':""}</div><span class="sm">Week total <b class="tnum">${A.fmt(tot)}</b></span></div><div class="tbl-wrap --flush"><table class="tbl"><thead><tr><th>Worker</th><th>Shifts</th><th class="num">Hours</th><th class="num">Pay</th><th class="num">Bonus</th><th class="num">Learning, min</th><th class="num">Holiday</th><th class="num">Total</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(({w,r})=>`<tr><td>${E(w.n)}<span class="sub">${E(w.title)} · £${r.rate}/h</span></td><td>${r.clocked} / ${r.booked}${r.urgent?` <span class="tag --accent">+£2/h</span>`:""}</td><td class="num">${r.hrs}</td><td class="num">${A.fmt(r.pay)}</td><td class="num">${A.fmt(r.bonus)}</td><td class="num">${r.learn}</td><td class="num">${A.fmt(r.hol)}</td><td class="num"><b>${A.fmt(r.total)}</b></td><td>${A.pill(r.status==="paid"?"paid":r.status==="approved"?"done":"queue",r.status[0].toUpperCase()+r.status.slice(1))}${r.status==="paid"&&r.paidAt?`<span class="sub">paid ${r.paidAt}</span>`:""}</td><td style="text-align:right">${r.status==="draft"?(wk.cur?`<span class="xs muted">week not over</span>`:`<button class="btn --sm" onclick="TH.payAct('${wk.key}','${w.id}','approved')">Approve</button>`):r.status==="approved"?`<div class="row" style="gap:4px;justify-content:flex-end"><button class="btn --sm" onclick="TH.payAct('${wk.key}','${w.id}','paid')">Mark paid</button><button class="btn --ghost --sm" onclick="TH.payAct('${wk.key}','${w.id}','draft')">Reopen</button></div>`:""}</td></tr>`).join("")}</tbody></table></div></div>`}).join("")+`<div class="xs muted">Approve freezes the numbers; Mark paid is a record only – money moves through payroll, not here.</div>`}
function weeks(n){st.weeks=+n;mountPay();$("#url").textContent="app.floritta.ai/team/pay-statements?weeks="+n}
function payAct(wk,w,s){PAY[wk]=PAY[wk]||{};if(s==="paid"){A.confirm("Mark as paid?",`${name(w)} · week of ${wk}. This is the final record; money is not moved by the CRM.`,"Mark paid",()=>{PAY[wk][w]=s;flash("ok",name(w)+" · week "+wk+" marked paid");mountPay()});return}PAY[wk][w]=s;flash("ok",`${name(w)} · week ${wk} ${s==="approved"?"approved – numbers frozen":"reopened – live draft again"}`);mountPay()}

const CHANNELS=[["Website form","floritta.uk/careers · free",0],["Instagram","stories + bio",0],["Indeed","sponsored · Oct",180],["Referral","£50 bonus after 3 months",100],["Workshop guest","guests who asked about work",0],["hh","Kazakhstan remote roles",45]];
function mountHiring(){paintNav();const funnel=["pool","applied","screening","interview","trial","offer"];const inF=CANDS.filter(c=>["applied","screening","interview","trial","offer"].includes(c.stage)).length;
  $("#th-hire-head").innerHTML=`<div class="h3">Hiring</div><span class="xs muted">same candidates as the register, laid out by stage</span><span class="sp"></span><button class="btn --sm" onclick="TH.candForm(true)">${I("plus")} Add candidate</button>`;

   <div class="kanban mb16">${funnel.map(s=>{const l=CANDS.filter(c=>c.stage===s&&!c.anonymised);return `<div class="kcol"><div class="k-head">${stageLbl(s)}<span class="n">${l.length}</span></div><div class="k-body">${l.map(c=>`<div class="kcard" onclick="TH.openCand(${c.id})"><div class="k-top"><span>${c.roles.map(r=>ROLES.find(x=>x[0]===r)[1]).join(", ")}</span><span class="sp"></span>${c.web?I("globe"):""}</div><div class="k-title">${E(c.name)}</div><div class="k-foot"><span>${E(c.source)}${c.notes[0]?" · "+E(c.notes[0].t.slice(0,40))+(c.notes[0].t.length>40?"…":""):""}</span></div><div class="row" style="gap:6px"><button class="btn --ghost --sm" onclick="event.stopPropagation();TH.advance(${c.id})">${s==="offer"?"Hire":"Advance →"}</button>${s!=="pool"?`<button class="textbtn" onclick="event.stopPropagation();TH.candStageQuiet(${c.id},'rejected')">reject</button>`:""}</div></div>`).join("")||`<div class="empty" style="padding:20px 8px"><span class="xs">Empty</span></div>`}</div></div>`}).join("")}</div>
   <div class="sec-head"><div class="h3">Sourcing channels</div><span class="xs muted">cost this month</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Channel</th><th>Note</th><th class="num">Candidates</th><th class="num">Cost</th></tr></thead><tbody>${CHANNELS.map(ch=>`<tr><td>${ch[0]}</td><td class="muted">${ch[1]}</td><td class="num">${CANDS.filter(c=>c.source===ch[0]).length}</td><td class="num">${ch[2]?A.fmt(ch[2]):"–"}</td></tr>`).join("")}</tbody></table></div>`}
function advance(id){const c=CANDS.find(x=>x.id===id);const order=["pool","applied","screening","interview","trial","offer","hired"];const i=order.indexOf(c.stage);if(c.stage==="offer"){A.confirm("Hire "+E(c.name)+"?","Stage → Hired, hired date set. Next: invite to the reserve from the card so they get the app.","Hire",()=>{c.stage="hired";c.hiredOn="2026-10-20";flash("ok",c.name+" hired – open the card to invite to the reserve");mountHiring()});return}c.stage=order[i+1]||"applied";toast(c.name+" → "+stageLbl(c.stage));mountHiring()}
function candStageQuiet(id,s){const c=CANDS.find(x=>x.id===id);c.stage=s;toast(c.name+" → "+stageLbl(s));mountHiring()}
