  applyRange(key){let a=App.$("#dr-"+key+"-from").value,b=App.$("#dr-"+key+"-to").value;if(!a||!b){App.toast("Unreadable date – default period restored");a=a||DR.range[key][0];b=b||DR.range[key][1]}if(a>b){[a,b]=[b,a];App.toast("From was later than To – dates swapped")}DR.range[key]=[a,b];this.re();App.toast("Period "+this.fd(a)+" – "+this.fd(b))},
  fd(iso){const d=new Date(iso+"T12:00:00");return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})},
  tiles(list){return `<div class="grid g4">${list.map(t=>`<div class="kpi-card ${t.cls||""}" ${t.title?`title="${DR_ESC(t.title)}"`:""}><span class="caps">${t.l}</span><span class="kpi-s tnum">${t.v}</span>${t.sub?`<span class="delta">${t.sub}</span>`:""}</div>`).join("")}</div>`},
  empty(ic,t,sub,btn){return `<div class="empty">${App.icon(ic)}<div class="h3">${t}</div>${sub?`<div class="sm">${sub}</div>`:""}${btn||""}</div>`},

  /* ===================== FREELANCE BOARD ===================== */
  flTab(t){DR.fl.tab=t;this.re()},
  flGo(params){DR.fl.tab=params.tab||DR.fl.tab;if(params.courier){DR.fl.tab="couriers";DR.fl.open=params.courier;DR.fl.linked=params.courier}if(params.week)DR.fl.week=params.week},
  rtwLbl:{not_checked:"Not checked",verified:"Verified",expired:"Expired",rejected:"Rejected"},
  appSt:{pending:"Pending",confirmed:"Confirmed",declined:"Declined",withdrawn:"Withdrawn",lost:"Lost"},
  jobSt:{open:"Open",assigned:"Assigned",picked_up:"Picked up",returned:"Returned",cancelled:"Cancelled"},
  flJobs(){
    const ic=App.icon,E=DR_ESC,manual=!DR.flags.autoConfirm;
    const jobs=DR.flags.empty?[]:DR_JOBS.filter(j=>["open","assigned","picked_up"].includes(j.status));
    if(!jobs.length)return this.empty("truck","No open or assigned freelance jobs right now","Jobs are published by the 15-minute cron once a delivery is ready for the board");
    /* ids: DLRS-016 DLRS-017 DLRS-018 DLRS-019 DLRS-020 DLRS-021 DLRS-022 DLRS-023 DLRS-024 */
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:150px">Order</th><th style="width:110px">Slot</th><th style="width:140px">Area</th><th class="num" style="width:80px">Distance</th><th class="num" style="width:70px">Pay</th><th style="width:170px">Status</th><th>Applications</th><th style="width:220px">Actions</th></tr></thead><tbody>
    ${jobs.map(j=>{const o=App.order(j.order);const pending=j.apps.filter(a=>a.s==="pending");
      const apps=j.apps.length?`<div class="dr-apps">${j.apps.map(a=>`<span class="ap"><span>${E(DR_CN(a.c))}</span><span class="tag ${a.s==="confirmed"?"--okl":a.s==="pending"?"--warn":a.s==="lost"||a.s==="declined"?"--acc":""}">${this.appSt[a.s]}</span>${a.s==="pending"&&manual?`<button class="textbtn" onclick="DRX.flConfirm('${j.id}','${a.c}')">Confirm</button><button class="textbtn --accent" onclick="DRX.flDecline('${j.id}','${a.c}')">Decline</button>`:""}</span>`).join("")}</div>`:`<span class="muted sm">No applications yet</span>`;
      const acts=j.status==="open"?`<button class="btn --ghost --sm" onclick="DRX.flUnpublish('${j.id}')">Take off the board</button>`:`<span class="btn-row"><button class="btn --ghost --sm" onclick="DRX.flRemove('${j.id}')">Remove courier</button><button class="btn --ghost --sm" onclick="DRX.flReturned('${j.id}')">Returned to studio</button></span>`;
      return `<tr class="r"><td class="wrap"><b class="tnum" style="cursor:pointer" onclick="App.openOrder(${j.order})">#${j.order}</b>${j.alcohol?` <span class="tag --line" title="Contains alcohol – courier must be trained, ID check at the door">${ic("alert")} alcohol</span>`:""}<span class="sub">${o?App.fmtDay(o.date):"today"} · ${E(j.id)}</span></td><td class="tnum">${j.slot}</td><td>${E(j.area)}</td><td class="num">${j.km.toFixed(1)} km</td><td class="num">${App.fmt(j.pay)}</td>
      <td class="wrap"><span class="pill --${j.status==="open"?"queue":j.status==="picked_up"?"out":"making"}">${this.jobSt[j.status]}</span>${j.courier?`<span class="sub">${E(DR_CN(j.courier))}</span>`:""}${j.gaveUp?`<span class="sub accent">Courier can't continue – bringing it back (50 % of the fee)</span>`:""}${j.ageRefused?`<span class="sub accent">Refused at the door – age check</span>`:""}</td>
      <td class="wrap">${apps}</td><td>${acts}</td></tr>`}).join("")}</tbody></table></div>
    ${manual?"":`<div class="dr-method">Auto-confirm is on – the first courier to apply gets the job; Confirm / Decline are hidden.</div>`}`;
  },
  flConfirm(j,c){const job=DR_JOBS.find(x=>x.id===j);const a=job.apps.find(x=>x.c===c);if(!a||a.s!=="pending"){App.toast("This application is no longer waiting for a decision");return}
    App.confirm("Give "+j+" to "+DR_CN(c)+"?","The other waiting couriers get “went to another courier this time”. The order's delivery moves Ready → Assigned; alcohol hours are checked.","Confirm",()=>{a.s="confirmed";job.apps.forEach(x=>{if(x!==a&&x.s==="pending")x.s="lost"});job.status="assigned";job.courier=c;App.assignCourier(job.order,c==="omar"?"omar":DR_CN(c));this.re();App.push("Telegram + app push · "+DR_CN(c),"Confirmed – job "+j+" is yours. Pick up at 80 Willow Walk.",{icon:"send"});App.toast("Confirmed · "+DR_CN(c)+" takes "+j)})},
  flDecline(j,c){const job=DR_JOBS.find(x=>x.id===j);const a=job.apps.find(x=>x.c===c);if(!a||a.s!=="pending"){App.toast("This application is no longer waiting for a decision");return}a.s="declined";this.re();App.toast("Declined · "+DR_CN(c)+" gets “Job "+j+" was not confirmed for you this time”")},
  flUnpublish(j){const job=DR_JOBS.find(x=>x.id===j);App.confirm("Take "+j+" off the board?","Couriers are not notified. The delivery stays with the order for your own couriers.","Take off",()=>{job.status="cancelled";this.re();App.toast(j+" taken off the board")})},
  flRemove(j){const job=DR_JOBS.find(x=>x.id===j);if(job.status==="picked_up"){App.toast("Already picked up – nothing changes (was a silent success before; now says so)");return}
    App.confirm("Remove "+DR_CN(job.courier)+" from "+j+"?","Their application becomes Withdrawn, the delivery goes back to Ready and the job returns to the board. Ops chat gets a Telegram line.","Remove",()=>{job.apps.forEach(a=>{if(a.c===job.courier)a.s="withdrawn"});job.courier=null;job.status="open";this.re();App.toast(j+" is back on the board · ops chat notified")},{danger:true})},
  flReturned(j){const job=DR_JOBS.find(x=>x.id===j);const gaveUp=!!job.gaveUp;
    App.confirm("Returned to studio · "+j,gaveUp?"The courier gave up on the way: they get only the 50 % return fee ("+App.fmt(job.pay/2)+").":"The courier brought the order back: full pay "+App.fmt(job.pay)+" plus 50 % return fee ("+App.fmt(job.pay/2)+"). The order and its delivery status are not changed here.","Mark returned",()=>{job.status="returned";this.re();App.push("Telegram + push · "+DR_CN(job.courier),"Job "+j+" marked returned · "+(gaveUp?App.fmt(job.pay/2):App.fmt(job.pay*1.5)),{icon:"pound"});App.toast(j+" · returned, fee recorded")})},

  flCouriers(){
    const ic=App.icon,E=DR_ESC,owner=this.isOwner();
    const list=DR.flags.empty?[]:DR_COURIERS;
    if(!list.length)return this.empty("user","No freelance couriers registered yet","They register in the Telegram bot or the Floritta Team app");
    /* ids: DLRS-026 DLRS-027 DLRS-028 DLRS-029 DLRS-030 DLRS-031 DLRS-032 DLRS-033 DLRS-034 DLRS-035 DLRS-036 DLRS-037 DLRS-038 DLRS-039 DLRS-015 DLRS-156 */
    const rows=list.map(c=>{const open=DR.fl.open===c.id;const i=c.issues;const iss=[i.late?`${i.late} late`:"",i.withdrawn?`${i.withdrawn} withdrawn after confirm`:"",i.problems?`${i.problems} problem${i.problems>1?"s":""} reported`:"",i.pin?`${i.pin} PIN lockout${i.pin>1?"s":""}`:""].filter(Boolean);
      const rtwDone=c.rtw==="verified";
      const acts=[];
      if(!rtwDone&&c.rtwSubmitted)acts.push(`<span class="sm">Sent from the app ${c.rtwSubmitted} · <button class="textbtn" onclick="App.toast('Opens the document in a new tab · the view is written to the audit log')">open document</button></span>`);
      if(!rtwDone&&c.shareCode)acts.push(`<span class="sm">Share code <b class="tnum">${c.shareCode}</b> · DoB <b class="tnum">${c.dob}</b> · <button class="textbtn" onclick="App.toast('gov.uk/view-right-to-work opens in a new tab')">Run the check on gov.uk</button></span>`);
      if(!rtwDone)acts.push(`<button class="btn --ghost --sm" onclick="DRX.flVerifyForm('${c.id}')">${ic("upload")} Verify right to work</button>`);
      if(c.transport==="car")acts.push(`<button class="btn --ghost --sm" onclick="DRX.flInsForm('${c.id}')">${ic("card")} Insurance verified</button>`);
      if(DR.flags.app&&!c.app)acts.push(c.invite?`<span class="sm muted">Invite sent to ${E(c.invite.email)} – code works until ${c.invite.until} · <button class="textbtn" onclick="DRX.flInviteForm('${c.id}')">Send a new code</button></span>`:`<button class="btn --ghost --sm" onclick="DRX.flInviteForm('${c.id}')">${ic("mail")} Invite to app</button>`);
      return `<tr class="r ${DR.fl.linked===c.id?"--linked":""} ${open?"on":""}" id="dr-cr-${c.id}"><td class="wrap c-name"><b style="cursor:pointer" onclick="DRX.flOpen('${c.id}')">${E(c.n)}</b> ${c.app?`<span class="tag --ink" title="${E(c.appEmail||"")}">App</span>`:""}<span class="sub tnum">${c.phone} · ${c.transport} · ${c.home} · ${c.source}</span><span class="sub">${open?"click to collapse":"click for rating & notes"}</span></td>
        <td class="num">${c.jobs}${c.newcomer?` <span class="tag --line" title="Newcomer – order value limit applies">new</span>`:""}</td>
        <td title="Internal rating over the last 60 days – never shown to the courier"><span class="tag ${c.rating==="Reliable"?"--okl":c.rating==="Watch"?"--acc":""}">${c.rating}</span></td>
        <td class="num">${c.onTime===null?"–":c.onTime+" %"}</td><td class="wrap sm ${iss.length?"accent":"muted"}">${iss.length?iss.join(" · "):"–"}</td>
        <td class="wrap"><span class="${c.rtw==="verified"?"ok":c.rtw==="not_checked"?"":"accent"}">${this.rtwLbl[c.rtw]}</span>${c.rtwExp?`<span class="sub">Expires ${c.rtwExp}</span>`:""}</td>
        <td class="wrap">${c.transport!=="car"?"–":c.ins&&c.ins.ok?`<span class="ok">Insurance verified</span><span class="sub">until ${c.ins.exp}</span>`:`<span class="accent">Insurance not verified</span>`}</td>
        <td class="wrap">${c.alcohol?`Trained until ${c.alcohol}<span class="sub"><button class="textbtn --accent" onclick="DRX.flRevoke('${c.id}')">Revoke</button></span>`:"–"}</td>
        <td class="wrap"><div class="col" style="gap:6px;align-items:flex-start">${acts.join("")||"<span class='muted sm'>–</span>"}</div></td></tr>
        ${open?`<tr class="drawer"><td colspan="9">${this.flDrawer(c)}</td></tr>`:""}`}).join("");
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c-name">Name · phone · transport · home · source</th><th class="num">Jobs done</th><th title="New / Watch / Reliable – internal 60-day rating">Rating</th><th class="num">On time</th><th>Issues</th><th>Right to work</th><th>Insurance</th><th>Alcohol</th><th class="c-acts">Actions</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="dr-method">Share code, date of birth, RTW documents and bank digits are personal data – shown only here, only to managers; every document view is audited. Rating and notes are internal and never reach the courier.</div>`;
  },
  flOpen(id){DR.fl.open=DR.fl.open===id?null:id;this.re();if(DR.fl.open){setTimeout(()=>{const r=document.getElementById("dr-cr-"+id);if(r)r.scrollIntoView({block:"center",behavior:"smooth"})},60)}},
  /* ids: DLRS-040 DLRS-041 DLRS-042 DLRS-043 DLRS-044 DLRS-154 DLRS-155 */
  flDrawer(c){const E=DR_ESC,i=c.issues,owner=this.isOwner();const pos=c.notes.filter(n=>n.k==="pos").length,neg=c.notes.length-pos;
    const kv=[["Completed jobs",c.jobs],["On-time %",c.onTime===null?"Not enough jobs yet":c.onTime+" %"],["Late",i.late],["Withdrawn after confirm",i.withdrawn],["Problems reported",i.problems],["PIN lockouts",i.pin],["Alcohol refusals (neutral)",i.refusals],["Manager notes (+/−)",`+${pos} / −${neg}`]];
    const reasons=["Late","No-show","Damaged bouquet","Complaint","Rude","Great service","Other"];
    return `<div class="dr-cols"><div><div class="caps mb8">Numbers (last 60 days)</div><dl class="kv">${kv.map(k=>`<dt>${k[0]}</dt><dd class="tnum">${k[1]}</dd>`).join("")}</dl><div class="dr-method">“Watch” is set when on-time drops under 80 %, or after a withdrawal, two problems or a PIN lockout in 60 days. Notes older than 12 months are pruned automatically (GDPR) and leave the counter.</div></div>
    <div><div class="caps mb8">Manager notes</div><div style="max-height:180px;overflow:auto">${c.notes.length?c.notes.map((n,k)=>`<div class="dr-note"><span class="tag ${n.k==="pos"?"--okl":"--acc"}">${E(n.r)}</span><span>${n.t?E(n.t):"<span class='muted'>no text</span>"}<br><small>${E(App.user(n.who)?App.user(n.who).n:n.who)} · ${n.at}</small></span>${(owner||n.who===App.me().id)?`<button class="textbtn --accent" onclick="DRX.flDelNote('${c.id}',${k})">Delete</button>`:"<span></span>"}</div>`).join(""):`<div class="muted sm">No notes yet.</div>`}</div>
    <div class="dr-form mt16"><div class="seg-ctl"><button class="${DR.fl.noteKind==="pos"?"on":""}" onclick="DR.fl.noteKind='pos';DRX.re()">Positive</button><button class="${DR.fl.noteKind==="neg"?"on":""}" onclick="DR.fl.noteKind='neg';DRX.re()">Negative</button></div>
    <div class="field"><label>Reason</label><select class="select" id="dr-note-reason">${reasons.map(r=>`<option ${r===DR.fl.noteReason?"selected":""}>${r}</option>`).join("")}</select></div>
    <div class="field" style="flex:1;min-width:180px"><label>Text (optional, 300)</label><input class="input" id="dr-note-text" maxlength="300" placeholder="What happened"></div><button class="btn --secondary --sm" onclick="DRX.flAddNote('${c.id}')">Add note</button></div></div></div>`},
  flAddNote(id){const c=DR_C(id);const r=App.$("#dr-note-reason").value,t=App.$("#dr-note-text").value.trim();DR.fl.noteReason=r;c.notes.unshift({k:DR.fl.noteKind,r,t,who:App.me().id,at:"today"});this.re();App.toast("Note added · internal only, the courier is not notified")},
  flDelNote(id,k){App.confirm("Delete this note?","It leaves the counter “Manager notes (+/−)” too.","Delete",()=>{DR_C(id).notes.splice(k,1);this.re();App.toast("Note deleted")},{danger:true})},
  flRevoke(id){const c=DR_C(id);App.confirm("Revoke alcohol training for "+c.n+"?","Alcohol jobs close for them immediately. They get a Telegram and app push: “Your alcohol-delivery training was revoked…”.","Revoke",()=>{c.alcohol=null;this.re();App.toast("Training revoked · courier notified")},{danger:true})},
  /* ids: DLRS-036 DLRS-152 – RTW verification form with inline validation */
  flVerifyForm(id){const c=DR_C(id);App.modal({title:"Verify right to work · "+c.n,body:`<div class="col" style="gap:12px"><div class="field"><label>Document (jpg, png, webp, pdf · up to 16 MB)</label><div class="row"><button class="btn --ghost --sm" onclick="DR._file='rtw.pdf';App.$('#dr-vf-file').textContent='rtw-${id}.pdf · 1.2 MB';DRX.err('dr-vf-err','')">${App.icon("upload")} Choose file</button><span class="sm" id="dr-vf-file">no file chosen</span></div><div class="err" id="dr-vf-err" style="display:none"></div></div>
    <div class="field"><label>Expires (optional)</label><input class="input" type="date" id="dr-vf-exp"><div class="err" id="dr-vf-err2" style="display:none"></div></div>
    <div class="note-box">Share code and date of birth are wiped on verify (DoB stays only if an expiry is set). The courier gets “You're verified…”${c.transport==="car"?" plus a reminder about insurance":""}.</div></div>`,
    foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="DRX.flVerify('${id}')">Verify</button>`});DR._file=null},
  flVerify(id){const c=DR_C(id);if(!DR._file){this.err("dr-vf-err","A document is required (jpg, png, webp or pdf, up to 16 MB)");return}const exp=App.$("#dr-vf-exp").value;if(exp&&exp<="2026-10-20"){this.err("dr-vf-err2","Expiry must be after today");return}
    c.rtw="verified";c.rtwExp=exp?this.fd(exp)+" "+exp.slice(0,4):null;c.shareCode=null;c.rtwSubmitted=null;if(!exp)c.dob=null;App.closeModal();this.re();App.push("Telegram + push · "+c.n,"You're verified – jobs are open for you."+(c.transport==="car"?" Don't forget Hire & Reward insurance.":""),{icon:"check"});App.toast("Right to work verified · document stored privately, audited")},
  /* ids: DLRS-037 */
  flInsForm(id){const c=DR_C(id);App.modal({title:"Hire & Reward insurance · "+c.n,body:`<div class="col" style="gap:12px"><div class="field"><label>Policy expires</label><input class="input" type="date" id="dr-if-exp" value="${c.ins&&c.ins.ok?"2027-01-14":""}"><div class="err" id="dr-if-err" style="display:none"></div></div><div class="field"><label>Certificate (optional)</label><button class="btn --ghost --sm" style="align-self:flex-start" onclick="App.$('#dr-if-file').textContent='certificate.pdf · 0.4 MB'">${App.icon("upload")} Choose file</button><span class="sm" id="dr-if-file">no file</span></div></div>`,
    foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="DRX.flIns('${id}')">Insurance verified</button>`})},
  flIns(id){const c=DR_C(id);const exp=App.$("#dr-if-exp").value;if(!exp){this.err("dr-if-err","Expiry date is required");return}if(exp<="2026-10-20"){this.err("dr-if-err","Expiry must be after today");return}c.ins={ok:true,exp:this.fd(exp)+" "+exp.slice(0,4)};App.closeModal();this.re();App.push("Telegram + push · "+c.n,"Insurance verified – car jobs are open for you."+(c.rtw!=="verified"?" Right-to-work check still pending.":""),{icon:"check"});App.toast("Insurance verified until "+c.ins.exp)},
  /* ids: DLRS-038 DLRS-152 */
  flInviteForm(id){const c=DR_C(id);App.modal({title:(c.invite?"Send a new code · ":"Invite to app · ")+c.n,body:`<div class="col" style="gap:10px"><div class="field"><label>E-mail for the app</label><input class="input" type="email" id="dr-inv-mail" value="${c.invite?DR_ESC(c.invite.email):""}" placeholder="name@example.com"><div class="err" id="dr-inv-err" style="display:none"></div></div><div class="note-box">An 8-digit code goes by e-mail and works for 14 days. It is stored hashed.</div></div>`,
    foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="DRX.flInvite('${id}')">Send code</button>`})},
  flInvite(id){const c=DR_C(id);const m=App.$("#dr-inv-mail").value.trim();if(!m||!m.includes("@")){this.err("dr-inv-err","Enter a valid e-mail");return}if(m==="omar@example.com"){this.err("dr-inv-err","This e-mail is already used by another courier");return}c.invite={email:m,until:"3 Nov"};App.closeModal();this.re();App.toast("Invite sent to "+m+" · code works until 3 Nov")},

  /* ids: DLRS-045 DLRS-157 */
  flReport(){const d=DR.flags.empty?[0,0,0,0,0,0,DR_COURIERS.length,1,0]:[6,11,4,3,1,1,DR_COURIERS.length,1,3];const l=["Published today","Applications today","Assigned today","Delivered today","Expired today","Withdrawn today","Couriers registered","Couriers verified","Active last 7 days"];
    return `<div class="dr-tiles">${l.map((x,i)=>`<div class="t"><span class="caps">${x}</span><span class="kpi-s tnum">${d[i]}</span></div>`).join("")}</div><div class="dr-method">Same nine numbers go to the ops Telegram chat every evening at 21:30 (digest cron). Today, Europe/London.</div>`},

  /* ids: DLRS-046 DLRS-047 DLRS-048 DLRS-049 DLRS-050 DLRS-051 DLRS-052 DLRS-053 DLRS-054 DLRS-055 DLRS-155 DLRS-160 */
  flPayouts(){const E=DR_ESC,ic=App.icon,owner=this.isOwner();const wk=DR.fl.week;const from=new Date(wk+"T12:00:00"),to=new Date(from);to.setDate(to.getDate()+6);
    const st=DR.flags.empty||wk!=="2026-10-12"?[]:DR_STMTS;const missing=st.filter(s=>s.status==="issued"&&!s.bank);
    const head=`<div class="dr-form mb16"><div class="field"><label>Week</label><input class="input" type="date" id="dr-fl-week" value="${wk}" onchange="DRX.flWeek(this.value)"></div><span class="sm muted">Mon ${from.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – Sun ${to.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} · default: last week</span><span class="sp"></span>${owner?`<button class="btn --ghost --sm" onclick="App.toast('bank-'+'${wk}'+'.csv · Name, Sort code, Account number, Amount, Reference – issued statements with bank details only · audited')">${ic("download")} Download bank CSV</button>`:`<span class="dr-flag">${ic("lock")} Bank CSV – owner only</span>`}</div>`;
    if(!st.length)return head+this.empty("pound","No statements for this week yet","Drafts are created by the Monday 08:00 cron from last week's jobs");
    const cards=st.map(s=>{const c=DR_C(s.courier);const canPay=["issued","queried"].includes(s.status);
      return `<div class="dr-stmt"><div class="s-top"><span class="h4">${E(c.n)}</span><span class="tnum muted">${s.id}</span><span class="pill --${s.status==="paid"?"paid":s.status==="issued"?"ready":s.status==="queried"?"photo":"queue"}">${s.status[0].toUpperCase()+s.status.slice(1)}</span><span class="sm">${s.jobs} jobs</span><b class="tnum">${App.fmt(s.amount)}</b></div>
      <div class="sm ${s.bank?"":"accent"}">${s.bank?`Bank details on file (…${s.bank})`:"No bank details yet"}${s.paidAt?` · paid ${s.paidAt} (${s.ref})`:""}${s.confirmed?" · courier confirmed":""}${s.query?` · <span class="warn">queried: ${E(s.query)}</span>`:""}</div>

  /* ===================== FREELANCE ANALYTICS ===================== */
  /* ids: DLRS-056 DLRS-158 – period select */
  periodBar(){const P=[["today","Today"],["7d","7 days"],["30d","30 days"],["month","This month"],["lastmonth","Last month"],["quarter","Quarter"]];const p=DR.fa.period;

  hmBody(){const pts=DR.flags.empty?[]:DR_HM;const plotted=pts.reduce((s,p)=>s+p[2],0);const geo=DR.flags.geoPartial?[412,468]:[468,468];

    <div class="dr-method">Each circle groups drops within ~100 m; the size follows the number of deliveries, hover for the count. The map auto-fits to the points; with no points it centres on the shop.</div>`},
  hmTip(ev,n){const t=document.getElementById("dr-hm-tip");if(!t)return;if(!ev){t.style.display="none";return}const m=document.getElementById("dr-hm-map").getBoundingClientRect();const sc=m.width/document.getElementById("dr-hm-map").offsetWidth;t.style.display="block";t.textContent=n+" drop"+(n>1?"s":"");t.style.left=((ev.clientX-m.left)/sc+12)+"px";t.style.top=((ev.clientY-m.top)/sc-10)+"px"},

  coBody(){const rows=DR.flags.empty?[]:DR_CO2;const drops=rows.reduce((s,r)=>s+r[1],0),km=rows.reduce((s,r)=>s+r[2],0),kg=rows.reduce((s,r)=>s+r[3],0),zero=rows.filter(r=>r[3]===0&&r[0]!=="Courier not recorded").reduce((s,r)=>s+r[1],0);

    this.tiles([{l:"Drops",v:drops},{l:"Distance (km)",v:km.toFixed(1)},{l:"CO₂",v:kg.toFixed(1)+" kg",cls:kg>0?"--warn":""},{l:"Zero-emission",v:zero+" ("+(drops?Math.round(100*zero/drops):0)+" %)"}])+

    `<div class="dr-method">Method: distance is the straight-line shop → drop ×1.3 for roads; factors per vehicle (car / van 130 g/km, scooter 70 g/km, bicycle and on foot 0). Drops without a courier's transport are listed as “Courier not recorded” and excluded from zero-emission.</div>`},

  /* ===================== RELAY (Uber Direct) ===================== */
  rlTab(t){DR.rl.tab=t;this.re()},
  rlBody(){const E=DR_ESC,ic=App.icon,T=DR.rl.tab,empty=DR.flags.empty;

/* ---- mounts ---- */
window.mount_delivery_freelance=function(params){
  const A=App,$=A.$,ic=A.icon;if(params&&(params.tab||params.courier||params.week))DRX.flGo(params);
  DRX.nav($("#dr-fl-nav"),"freelance");
  if(!DR.flags.freelance){$("#dr-fl-head").innerHTML="";$("#dr-fl-body").innerHTML=DRX.empty("lock","Freelance board is off","DELIVERY_FREELANCE_ENABLED=false – the tab is hidden and the URL answers 404",`<button class="btn --ghost --sm" onclick="DR.flags.freelance=true;DRX.re()">Turn the flag on (demo)</button>`);return}
  const open=DR_JOBS.filter(j=>j.status==="open").length,apps=DR_JOBS.reduce((s,j)=>s+j.apps.filter(a=>a.s==="pending").length,0);const rtwQ=DR_COURIERS.filter(c=>c.app&&c.rtwSubmitted&&c.rtw!=="verified").length;
  const T=DR.fl.tab;
  $("#dr-fl-head").innerHTML=`<div class="dr-badges"><span class="tag ${open?"--ink":""}">Freelance: ${open} open / ${apps} applications</span>${!DR.flags.autoConfirm?`<span class="tag --warn">Manual confirm is on – applications wait for you</span>`:""}${rtwQ?`<span class="tag --warn">RTW queue: ${rtwQ}</span>`:""}</div><span class="sp"></span>
    <div class="views" style="margin:0;border:0">${[["jobs","Jobs"],["couriers","Couriers"],["report","Report"],["payouts","Payouts"]].map(t=>`<button class="${T===t[0]?"on":""}" onclick="DRX.flTab('${t[0]}')">${t[1]}</button>`).join("")}<button onclick="App.go('delivery-freelance-analytics')">${ic("growth")} Analytics</button></div>`;
  $("#dr-fl-body").innerHTML=T==="jobs"?DRX.flJobs():T==="couriers"?DRX.flCouriers():T==="report"?DRX.flReport():DRX.flPayouts();
  if(DR.fl.linked){const id=DR.fl.linked;setTimeout(()=>{const r=document.getElementById("dr-cr-"+id);if(r)r.scrollIntoView({block:"center"})},80);DR.fl.linked=null;A.state.params={}}
  A.registerCommands([{g:"Delivery",t:"Freelance board · jobs",ic:"truck",fn:()=>{DR.fl.tab="jobs";A.go("delivery-freelance")}},{g:"Delivery",t:"Freelance payouts · this week",ic:"pound",fn:()=>{DR.fl.tab="payouts";A.go("delivery-freelance")}}]);
};
window.mount_delivery_freelance_analytics=function(){const $=App.$;DRX.nav($("#dr-fa-nav"),"freelance");
  if(!DR.flags.freelance){$("#dr-fa-head").innerHTML="";$("#dr-fa-body").innerHTML=DRX.empty("lock","Freelance analytics is off","DELIVERY_FREELANCE_ENABLED=false");return}
  $("#dr-fa-head").innerHTML=`<button class="btn --ghost --sm" onclick="App.go('delivery-freelance')">${App.icon("back")} Freelance board</button>${DRX.periodBar()}`;
  $("#dr-fa-body").innerHTML=DRX.faBody()};
window.mount_delivery_heatmap=function(){const $=App.$;DRX.nav($("#dr-hm-nav"),"heatmap");$("#dr-hm-head").innerHTML=`<span class="h3">Where we really deliver</span><span class="sp"></span>${DRX.rangeBar("heatmap","Show")}`;$("#dr-hm-body").innerHTML=DRX.hmBody()};
window.mount_delivery_co2=function(){const $=App.$;DRX.nav($("#dr-co-nav"),"co2");$("#dr-co-head").innerHTML=`<span class="h3">Carbon footprint of completed deliveries</span><span class="sp"></span>${DRX.rangeBar("co2","Show")}`;$("#dr-co-body").innerHTML=DRX.coBody()};
window.mount_delivery_relay=function(params){const $=App.$;if(params&&params.tab)DR.rl.tab=params.tab;DRX.nav($("#dr-rl-nav"),DR.rl.tab);
  $("#dr-rl-head").innerHTML=`<div class="seg-ctl"><button class="${DR.rl.tab==="carriers"?"on":""}" onclick="DRX.rlTab('carriers')">Courier partners</button><button class="${DR.rl.tab==="tracking"?"on":""}" onclick="DRX.rlTab('tracking')">Courier statuses</button><button class="${DR.rl.tab==="reliability"?"on":""}" onclick="DRX.rlTab('reliability')">Reliability</button></div><span class="sm muted">Uber Direct · native screens replace the old Relay iframe</span>`;
  $("#dr-rl-body").innerHTML=DRX.rlBody()};
["delivery-freelance","delivery-freelance-analytics","delivery-heatmap","delivery-co2","delivery-relay"].forEach(id=>document.addEventListener("orders",()=>{if(App.state.current===id)window["mount_"+id.replace(/-/g,"_")](App.state.params)}));
</script>
