<script>
(function(){
/* 21-catalog-2 sorts before 21-catalog in the build – reach C21 lazily */
const A=window.App,esc=A.esc,fmt=A.fmt,ic=A.icon,$=A.$;
const lazy=g=>new Proxy({},{get:(_,k)=>g()[k],set:(_,k,v)=>{g()[k]=v;return true}});
const C=lazy(()=>window.C21),F=lazy(()=>window.C21.F),can=lazy(()=>window.C21.can);
const X=p=>window.C21.X(p),num=v=>window.C21.num(v);
const IM=["red-roses","peony-basket","pink-garden","white-spray","lilac-dream","peach-posy","belgravia","charmingly","daydream-basket","hero-basket","hero-white","pink-manifesto","poem-petals","powdered-rose","veronica"];
const img=i=>"img/"+IM[((i%IM.length)+IM.length)%IM.length]+".webp";
const inv=()=>A.data.inventory;
const isStem=i=>i.unit==="stems"||i.unit==="bunches";
const variants=()=>{const out=[];A.data.products.forEach(p=>X(p).vars.forEach(v=>{if(v.active&&X(p).status==="active")out.push({id:v.id,p,v,label:p.name+" · "+v.name.split(" (")[0]})}));return out};
const vlabel=id=>{const x=variants().find(v=>v.id===id);return x?x.label:"–"};
const notFound=(body,title,text)=>{body.innerHTML=`<div class="c22-404">${ic("lock")}<div class="h2 mt8">404 · ${title}</div><p class="sm soft">${text}</p><button class="btn --ghost --sm" onclick="C21.demoMenu(event)">${ic("columns")} Demo – switch the flag</button></div>`};
const PLAT={ubereats:"Uber Eats",deliveroo:"Deliveroo",justeat:"Just Eat",udora:"Udora"};

/* ================= MARKETPLACE NAMES ================= */
const TITLES=[["ubereats","Red Roses Bouquet (12)",48,2860,0,[1011,.92],[1041,.41]],["deliveroo","Peony Basket Deluxe",31,2635,1,[1012,.88]],["ubereats","Pink Garden Mix",27,2565,0,[1021,.86],[1121,.55]],["justeat","White Spray Large",19,2090,0,[1031,.9]],["deliveroo","Birthday Balloon Set",22,264,0,[2001,.5]],["udora","Lilac Dream",14,1680,0,[1041,.95]],["ubereats","Chocolate Strawberries",17,306,-1],["deliveroo","Charmingly Pink",12,2100,0,[1071,.83]],["ubereats","Peach Posy Small",11,1485,0,[1052,.79],[1051,.7]],["justeat","Vase Glass",9,252,0,[2061,.6]],["deliveroo","Hero Basket XL",8,1760,1,[1093,.81]],["ubereats","Bespoke Autumn Mix",6,780,-1],["udora","Veronica Classic",5,700,0,[1161,.9]],["deliveroo","Teddy Bear Addon",4,88,0,[2011,.7]]].map((r,i)=>({id:6001+i,platform:r[0],title:r[1],lines:r[2],revenue:r[3],last:A.T(10,0,-(i%6)),variant:r[4]===1?(r[5]?r[5][0]:null):null,ignored:r[4]===-1,sug:(r.slice(5)||[]).map(s=>({vid:s[0],pct:Math.round(s[1]*100)}))}));
const mn={show:"unmapped",editing:null,pick:{}};
window.mount_catalog_mp_names=function(){const head=$("#c22-mn-head"),body=$("#c22-mn-body");if(!can.manage()){head.innerHTML="";C.deny(body);return}
 const all=F.quiet?[]:TITLES;const grp={unmapped:all.filter(t=>!t.variant&&!t.ignored),mapped:all.filter(t=>t.variant),ignored:all.filter(t=>t.ignored)};grp.all=all;
 const sum=l=>fmt(l.reduce((s,t)=>s+t.revenue,0));
 head.innerHTML=`${C.subnav("catalog-mp-names")}<div class="row" style="width:100%"><div class="views" style="margin:0;border:0">${[["unmapped","To decide"],["mapped","Mapped"],["ignored","Ignored"],["all","All"]].map(([k,l])=>`<button class="${mn.show===k?"on":""}" onclick="C22.mnShow('${k}')">${l}<span class="n">${grp[k].length}</span></button>`).join("")}</div><span class="sp"></span>${C.demoBtn()}</div>`;
 const list=grp[mn.show].slice().sort((a,b)=>b.revenue-a.revenue).slice(0,300);
 body.innerHTML=`<div class="c22-kpis"><div class="kpi-card ${grp.unmapped.length?"--warn":""}"><span class="caps">Waiting for a decision</span><span class="kpi-s">${grp.unmapped.length}</span><span class="xs muted tnum">${sum(grp.unmapped)} of revenue</span></div><div class="kpi-card"><span class="caps">Mapped</span><span class="kpi-s">${grp.mapped.length}</span><span class="xs muted tnum">${sum(grp.mapped)}</span></div><div class="kpi-card"><span class="caps">Not a catalogue product</span><span class="kpi-s">${grp.ignored.length}</span><span class="xs muted tnum">${sum(grp.ignored)}</span></div></div>
 <div class="note-box mb16">${ic("info")} Ranked by money: the names that bring the most revenue on Uber Eats, Deliveroo, Just Eat and Udora come first. Map each to a catalogue variant – future marketplace order lines then follow it (revenue, Size ladder, recipes).</div>
