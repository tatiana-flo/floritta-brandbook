/* ================= TEAM GOAL ================= */
function mountGoal(){
  A.$("#t10-tg-head").innerHTML=nav("team-goal","active")+`<div class="row" style="width:100%"><span class="sp"></span>${MGR()?`<button class="btn --sm" onclick="T10.goalModal()">${I("plus")} New goal</button>`:""}${demoEmpty("tg")}</div>`;
  const list=st.empty.tg?[]:GOALS.slice().sort((a,b)=>b.month.localeCompare(a.month));
  const mon=m=>new Date(m+"-01").toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  A.$("#t10-tg-body").innerHTML=list.length?list.map(g=>{const pct=Math.round(g.current/g.target*100);const mp=MPTS[g.month]||{};const sum=Object.values(mp).reduce((a,x)=>a+Math.max(0,x[0]),0);
   return `<div class="goal"><div class="g-head"><div class="h3" style="flex:1">${E(g.t)}</div>${A.pill(g.status==="open"?"doing":g.status==="achieved"?"done":"todo",g.status[0].toUpperCase()+g.status.slice(1))}${MGR()?`<button class="textbtn" onclick="T10.goalModal(${g.id})">Edit</button>`:""}${MGR()&&g.status!=="closed"?`<button class="textbtn --accent" onclick="T10.goalClose(${g.id})">Close</button>`:""}</div>
    <div class="hint mt8">${mon(g.month)} · ${E(g.metric)} · Fund ${A.fmt(g.fund)}</div><div class="row mt8" style="gap:12px"><span class="kpi-s">${g.current} / ${g.target}</span><span class="muted sm">${pct}%</span></div><div class="progress mt8 ${g.status==="achieved"?"--ok":""}"><i style="width:${Math.min(100,pct)}%"></i></div>
    ${g.status!=="open"&&g.fund>0&&sum?`<div class="sec-head"><div class="h4">Fund split</div><span class="hint">Preview – payout is manual</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Employee</th><th class="num">Points</th><th class="num">Share</th></tr></thead><tbody>${Object.entries(mp).filter(x=>x[1][0]>0).sort((a,b)=>b[1][0]-a[1][0]).map(x=>`<tr><td>${E(NM(x[0]))}</td><td class="num">${x[1][0]}</td><td class="num">${A.fmt(Math.round(g.fund*x[1][0]/sum))}</td></tr>`).join("")}</tbody></table></div>`:""}</div>`}).join(""):emptyBox("flag","No team goals yet.","",MGR()?`<button class="btn --ghost --sm" onclick="T10.goalModal()">New goal</button>`:"");
}
function goalModal(id){const g=id?GOALS.find(x=>x.id===id):{t:"",month:"2026-11",metric:"",target:100,current:0,fund:0};
  A.modal({title:id?"Edit goal":"New goal",body:`<div class="field"><label>Title</label><input class="input" id="t10-gt" value="${E(g.t)}"></div><div class="grid g2 mt16"><div class="field"><label>Month</label><input class="input" type="month" id="t10-gm" value="${g.month}"></div><div class="field"><label>Metric</label><input class="input" id="t10-gme" value="${E(g.metric)}" placeholder="What we count"></div><div class="field"><label>Target</label><input class="input" type="number" id="t10-gta" value="${g.target}"></div><div class="field"><label>Current</label><input class="input" type="number" id="t10-gc" value="${g.current}"></div><div class="field"><label>Fund (£)</label><input class="input" type="number" id="t10-gf" value="${g.fund}"></div></div><div class="hint mt8">Status is worked out automatically: Achieved when Current ≥ Target, otherwise Open. Progress is entered by hand.</div>`,
   foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="T10._goalSave(${id||0})">Save</button>`})}
function _goalSave(id){const d={t:v("t10-gt").trim(),month:v("t10-gm"),metric:v("t10-gme"),target:Number(v("t10-gta"))||0,current:Number(v("t10-gc"))||0,fund:Number(v("t10-gf"))||0};if(!d.t){tt("Give the goal a title");return}const g=id?GOALS.find(x=>x.id===id):null;if(g){Object.assign(g,d);if(g.status!=="closed")g.status=d.current>=d.target?"achieved":"open"}else GOALS.push(Object.assign({id:GOALS.length+1,status:d.current>=d.target?"achieved":"open"},d));A.closeModal();tt(id?"Goal saved":"Goal created");mountGoal()}
function goalClose(id){const g=GOALS.find(x=>x.id===id);A.confirm("Close this goal?","Closed for good – editing will not reopen it. The fund split stays as a preview.","Close goal",()=>{g.status="closed";tt("Goal closed");mountGoal()},{danger:true})}
/* ================= REWARDS ================= */
function mountRewards(){
  if(!MGR())st.rwTab="shop";const me=MEID();const q=REDEMP.filter(r=>["requested","approved"].includes(r.status)).sort((a,b)=>new Date(a.at)-new Date(b.at));
  A.$("#t10-rw-head").innerHTML=nav("rewards","active")+`<div class="row" style="width:100%;gap:12px;flex-wrap:wrap"><span class="kpi-s">${BAL[me]||0} <span class="muted" style="font-size:14px">pts</span></span>${MGR()?`<div class="seg-ctl"><button class="${st.rwTab==="shop"?"on":""}" onclick="T10.rwTab('shop')">Shop</button><button class="${st.rwTab==="queue"?"on":""}" onclick="T10.rwTab('queue')">Queue <span class="n">${q.length}</span></button></div>`:""}<span class="sp"></span>${MGR()?`<button class="btn --sm" onclick="T10.rewardModal()">${I("plus")} New reward</button>`:""}${demoEmpty("rw")}</div>`;
  const B=A.$("#t10-rw-body");
  if(st.rwTab==="queue"){B.innerHTML=q.length&&!st.empty.rw?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Status</th><th>Employee</th><th>Reward</th><th>Note</th><th class="num">Cost</th><th></th></tr></thead><tbody>${q.map(r=>`<tr><td>${A.pill(r.status==="requested"?"todo":"doing",r.status[0].toUpperCase()+r.status.slice(1))}</td><td>${E(NM(r.who))}</td><td>${r.reward?E(REWARDS.find(x=>x.id===r.reward).t):E(r.custom)+" "+tag("custom")}</td><td class="wrap">${E(r.note||"")}</td><td class="num">${r.cost||"–"}</td><td style="text-align:right">${r.status==="requested"?`<button class="textbtn" onclick="T10.rwApprove(${r.id})">Approve</button> `:`<button class="textbtn" onclick="T10.rwFulfil(${r.id})">Fulfil</button> `}<button class="textbtn --accent" onclick="T10.rwReject(${r.id})">Reject</button></td></tr>`).join("")}</tbody></table></div>`:emptyBox("gift","Nothing to review.","");return}
  const list=st.empty.rw?[]:REWARDS.filter(r=>r.active||MGR());const mineR=REDEMP.filter(r=>r.who===me).slice(0,50);
  B.innerHTML=`<div class="rw-grid">${list.map(r=>{const can=(BAL[me]||0)>=r.pts;return `<div class="rw ${r.active?"":"--off"}"><div class="row" style="gap:8px"><span class="pts">${r.pts} <span class="muted" style="font-size:13px">pts</span></span><span class="sp"></span>${tag(RTYPE[r.type]+(r.type==="money"?" "+r.gbp:""))}</div><div>${E(r.t)}</div><div class="hint">${E(r.ds)}</div><div class="btn-row mt8"><button class="btn --sm ${can?"":"is-disabled"}" onclick="T10.redeem(${r.id})">${can?"Redeem":"Not enough points"}</button>${MGR()?`<button class="textbtn" onclick="T10.rewardModal(${r.id})">Edit</button><button class="textbtn" onclick="T10.rwToggle(${r.id})">${r.active?"Retire":"Restore"}</button>`:""}</div></div>`}).join("")}</div>${list.length?"":`<div class="hint">The shop is empty${MGR()?" – add a reward.":"."}</div>`}
   <div class="sec-head"><div class="h3">My requests</div><button class="textbtn" onclick="T10.proposeModal()">Propose your own</button></div>${mineR.length?`<div class="list" style="border:1px solid var(--hair)">${mineR.map(r=>`<div class="li" style="cursor:default">${A.pill({requested:"todo",approved:"doing",fulfilled:"done",rejected:"cancelled"}[r.status],r.status[0].toUpperCase()+r.status.slice(1))}<div class="t"><b>${r.reward?E(REWARDS.find(x=>x.id===r.reward).t):E(r.custom)}</b><small>${A.fmtDay(r.at)}${r.custom?" · custom":""}</small></div><span class="tnum">${r.cost||"–"}</span></div>`).join("")}</div>`:`<div class="hint">No requests yet.</div>`}`;
}
function rwTab(t){st.rwTab=t;mountRewards()}
function redeem(id){const r=REWARDS.find(x=>x.id===id);const me=MEID();if(!r.active){tt("This reward is not available.");return}if((BAL[me]||0)<r.pts){tt("Not enough points");return}A.confirm("Redeem “"+E(r.t)+"”?",`${r.pts} points are taken from your balance now; a manager approves the request.`,"Redeem",()=>{BAL[me]-=r.pts;REDEMP.unshift({id:++RID,who:me,reward:id,status:"requested",at:NOW.toISOString(),cost:r.pts});tt("Requested · "+r.t);mountRewards()})}
function proposeModal(){A.modal({title:"Propose a reward",body:`<div class="field"><label>Title</label><input class="input" id="t10-pt" placeholder="What would you like?"><div class="accent xs" id="t10-pte" style="display:none">Title is required.</div></div><div class="field mt16"><label>What would you like?</label><textarea class="textarea" id="t10-pn"></textarea></div><div class="hint mt8">No points are taken until a manager sets a price.</div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="T10._proposeGo()">Send</button>`})}
function _proposeGo(){const t=v("t10-pt").trim();if(!t){A.$("#t10-pte").style.display="";return}REDEMP.unshift({id:++RID,who:MEID(),reward:null,custom:t,note:v("t10-pn"),status:"requested",at:NOW.toISOString(),cost:0});A.closeModal();tt("Proposal sent");mountRewards()}
function rwToggle(id){const r=REWARDS.find(x=>x.id===id);r.active=!r.active;tt((r.active?"Restored · ":"Retired · ")+r.t);mountRewards()}
function rewardModal(id){const r=id?REWARDS.find(x=>x.id===id):{t:"",ds:"",pts:100,type:"money",gbp:0};
  A.modal({title:id?"Edit reward":"New reward",body:`<div class="field"><label>Title</label><input class="input" id="t10-rt" value="${E(r.t)}"></div><div class="field mt16"><label>Description</label><textarea class="textarea" id="t10-rd">${E(r.ds)}</textarea></div><div class="grid g3 mt16"><div class="field"><label>Cost (points)</label><input class="input" type="number" id="t10-rp" value="${r.pts}"></div><div class="field"><label>Type</label>${sel("t10-rty",Object.entries(RTYPE),r.type,`onchange="document.getElementById('t10-rgb').style.display=this.value==='money'?'':'none'"`)}</div><div class="field" id="t10-rgb" style="${r.type==="money"?"":"display:none"}"><label>£ value</label><input class="input" type="number" id="t10-rg" value="${r.gbp||0}"></div></div>`,
   foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="T10._rewardSave(${id||0})">Save</button>`})}
function _rewardSave(id){const d={t:v("t10-rt").trim(),ds:v("t10-rd"),pts:Number(v("t10-rp"))||0,type:v("t10-rty")};d.gbp=d.type==="money"?Number(v("t10-rg"))||0:0;if(!d.t){tt("Give the reward a title");return}if(id)Object.assign(REWARDS.find(x=>x.id===id),d);else REWARDS.push(Object.assign({id:REWARDS.length+1,active:true},d));A.closeModal();tt(id?"Reward saved":"Reward created");mountRewards()}
function rwApprove(id){const r=REDEMP.find(x=>x.id===id);A.modal({title:"Approve for "+E(NM(r.who)),body:`<div class="sm">${r.reward?E(REWARDS.find(x=>x.id===r.reward).t):E(r.custom)+" (own proposal)"}</div>${r.reward?"":`<div class="field mt16"><label>Cost in points</label><input class="input" type="number" id="t10-rc" value="150"><div class="hint">Taken from the balance now – ${E(NM(r.who))} has ${BAL[r.who]} pts.</div></div>`}`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="T10._rwApproveGo(${id})">Approve</button>`})}
function _rwApproveGo(id){const r=REDEMP.find(x=>x.id===id);if(!r.reward){const c=Number(v("t10-rc"))||0;if(BAL[r.who]<c){tt("Employee does not have enough points");return}BAL[r.who]-=c;r.cost=c}r.status="approved";r.decided={by:MEID(),at:NOW.toISOString()};A.closeModal();tt("Approved for "+NM(r.who));mountRewards()}
function rwFulfil(id){const r=REDEMP.find(x=>x.id===id);A.confirm("Mark as fulfilled?",(r.reward&&REWARDS.find(x=>x.id===r.reward).type==="money"?"Money rewards go to Bonuses for this month.":"The request is closed as done."),"Fulfil",()=>{r.status="fulfilled";r.decided={by:MEID(),at:NOW.toISOString()};const rw=r.reward&&REWARDS.find(x=>x.id===r.reward);if(rw&&rw.type==="money"){MONEY["2026-10"][r.who]=(MONEY["2026-10"][r.who]||0)+rw.gbp}tt("Fulfilled");mountRewards()})}
function rwReject(id){const r=REDEMP.find(x=>x.id===id);A.confirm("Reject this request?",`${r.cost?r.cost+" points go back to "+NM(r.who)+".":"Nothing was charged."}`,"Reject",()=>{if(r.cost&&!r.refunded){BAL[r.who]+=r.cost;r.refunded=true}r.status="rejected";r.decided={by:MEID(),at:NOW.toISOString()};tt("Rejected");mountRewards()},{danger:true})}
/* ================= LEADERBOARD ================= */
function mountLeaderboard(){
  A.$("#t10-lb-head").innerHTML=nav("leaderboard","active")+`<div class="row" style="width:100%;gap:12px;flex-wrap:wrap"><div class="seg-ctl"><button class="${st.lbTab==="month"?"on":""}" onclick="T10.lbTab('month')">Month</button><button class="${st.lbTab==="year"?"on":""}" onclick="T10.lbTab('year')">Year</button></div><span class="hint">Points ranking – ${st.lbTab==="month"?"October 2026":"2026"}</span>${st.lbTab==="year"?`<div class="g row" style="gap:6px"><span class="hint">Sort by</span><div class="seg-ctl"><button class="${st.lbSort==="pm"?"on":""}" onclick="T10.lbSort('pm')">Points/month</button><button class="${st.lbSort==="total"?"on":""}" onclick="T10.lbSort('total')">Total</button></div></div>`:""}<span class="sp"></span><span class="note-box" style="padding:6px 10px">${KUDOS_LEFT} thank-you points left this week</span>${demoEmpty("lb")}</div>`;
  const rows=st.empty.lb?[]:Object.keys(PTS).filter(k=>k!=="tatiana").map(k=>({id:k,m:PTS[k][0],y:PTS[k][1],pm:Math.round(PTS[k][1]/MONTHS_IN[k]),since:PTS[k][2]}));
  const key=st.lbTab==="month"?"m":st.lbSort==="pm"?"pm":"y";rows.sort((a,b)=>b[key]-a[key]);
  A.$("#t10-lb-body").innerHTML=rows.length?`<div style="border:1px solid var(--hair)">${rows.map((r,i)=>{const lv=level(r.y);const top=i<3&&r[key]>0;return `<div class="lb ${top?"--top":""}"><span class="rk">${top?["1st","2nd","3rd"][i]:i+1}</span>${AV(r.id,"--l")}<div class="who"><b>${E(NM(r.id))} <span class="hint">${I(LV_IC[lv[0]])} ${lv[0]}</span></b><small>${HELD[r.id].map(b=>`<span class="bdg">${I("award")}${E(BADGES.find(x=>x[0]===b)[1])}</span>`).join("")}<span>With us since ${r.since}</span><span>${KUDOS.filter(k=>k.to===r.id&&days(k.at)<30).length} this month</span></small></div>
    <div class="m ${st.lbTab==="year"&&st.lbSort!=="pm"?"dim":""}">${st.lbTab==="month"?r.m:r.pm}<small>${st.lbTab==="month"?"This month":"Pts/month"}</small></div><div class="m ${st.lbTab==="month"||st.lbSort==="pm"?"dim":""}">${r.y}<small>Year total</small></div>
    <div class="lbacts">${r.id!==MEID()&&KUDOS_LEFT>0?`<button class="btn --ghost --sm" onclick="T10.thankModal('${r.id}','Say thanks to ${E(NM(r.id))}')">Say thanks</button>`:""}${r.id!==MEID()?`<button class="btn --ghost --sm" onclick="T10.recogModal('${r.id}')">+ recognition</button>`:""}<button class="btn --ghost --sm" onclick="T10.badgeModal('${r.id}')">Award badge</button></div></div>`}).join("")}</div>`:emptyBox("cup","No points awarded yet.","");
}
function lbTab(t){st.lbTab=t;mountLeaderboard()}function lbSort(s){st.lbSort=s;mountLeaderboard()}
function recogModal(w){A.modal({title:"Recognise "+E(NM(w)),body:`<div class="field"><label>Points (1–3)</label>${sel("t10-rcp",[[1,"1"],[2,"2"],[3,"3"]],1)}</div><div class="field mt16"><label>Reason</label><input class="input" id="t10-rcr" placeholder="Required"><div class="accent xs mt8" id="t10-rce" style="display:none">A reason is required.</div></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="T10._recogGo('${w}')">Give</button>`})}
function _recogGo(w){const r=v("t10-rcr").trim();if(!r){A.$("#t10-rce").style.display="";return}const p=Number(v("t10-rcp"));PTS[w][0]+=p;PTS[w][1]+=p;BAL[w]+=p;A.closeModal();tt("Recognition · "+NM(w)+" +"+p);mountLeaderboard()}
function badgeModal(w){A.modal({title:"Award a badge to "+E(NM(w)),body:`<div class="field"><label>Badge</label>${sel("t10-bg",BADGES.map(b=>[b[0],b[1]+" · +"+b[2]+" pts – "+b[3]]),BADGES[0][0])}</div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="T10._badgeGo('${w}')">Award</button>`})}
function _badgeGo(w){const b=v("t10-bg");A.closeModal();if(HELD[w].includes(b)){tt("Badge already held");return}HELD[w].push(b);const x=BADGES.find(y=>y[0]===b);BAL[w]+=x[2];PTS[w][0]+=x[2];PTS[w][1]+=x[2];tt("Badge granted · "+x[1]);mountLeaderboard()}
/* ================= PAYROLL · BONUSES ================= */
function mountPayroll(p={}){
  if(p.month)st.month=/^\d{4}-\d{2}$/.test(p.month)?p.month:"2026-10";
  A.$("#t10-pr-head").innerHTML=nav("payroll","active")+`<div class="row" style="width:100%;gap:12px;flex-wrap:wrap"><div class="field" style="width:180px"><label>Month</label><input class="input" type="month" value="${st.month}" onchange="T10.month(this.value)"></div><span class="sp"></span><button class="btn --ghost --sm" onclick="App.toast('floritta-bonuses-${st.month}.csv · downloading (demo)')">${I("download")} Download CSV</button>${demoEmpty("pr")}</div>`;
  const mp=MPTS[st.month];const mo=MONEY[st.month]||{};
  if(!mp||st.empty.pr){A.$("#t10-pr-body").innerHTML=emptyBox("pound","No data for this month.","");return}
  const rows=S.filter(s=>s.role!=="owner");
  A.$("#t10-pr-body").innerHTML=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Employee</th><th class="num">Points earned</th><th class="num">Money rewards</th><th class="num">Redemptions</th></tr></thead><tbody>${rows.map(s=>{const red=REDEMP.filter(r=>r.who===s.id&&r.at.slice(0,7)===st.month).length;return `<tr><td>${E(s.n)}<span class="sub">${E(s.id)}@floritta.uk</span></td><td class="num">${mp[s.id]?mp[s.id][0]:0}</td><td class="num">${mo[s.id]?A.fmt(mo[s.id]):"–"}</td><td class="num">${red||"–"}</td></tr>`}).join("")}</tbody><tfoot><tr><td>Positive ledger entries without redemptions · money rewards fulfilled in the month</td><td class="num">${rows.reduce((a,s)=>a+(mp[s.id]?mp[s.id][0]:0),0)}</td><td class="num">${A.fmt(Object.values(mo).reduce((a,x)=>a+x,0))}</td><td></td></tr></tfoot></table></div>`;
}
function month(m){st.month=m;mountPayroll()}
function toggleEmpty(k){st.empty[k]=!st.empty[k];re()}
/* ---------- exports & mounts ---------- */
window.T10={re,open,sheetMenu,menu,form,catalog,catFilter,catFail,catRetry,catTake,catAssignOpen,catAssign,setKind,setView,setScope,setStage,flag,more,reset,setF,page,sel:selOne,selAll,clearSel,thread,bulk,csv,claim,claimQuiet,start,undone,release,dismissReq,del,doneModal,approveModal,reopenModal,cancelModal,askCancelModal,attach,unattach,cmtState,comment,lightbox,lightboxImg,stepToggle,stepDel,stepAdd,stepWho,stepDue,
 zoneChip,moveMenu,reorder,circle,assignOne,_assignGo,hudView,expand,collapse,ibGroup,ibOpen,ibPick,ibSel,ibSelAll,ibClear,ibDismiss,ibOpt,ibFocus,ibAnswer,ibPutBack,bulkConfirm,_bulkGo,
 hand,handMenu,laneGo,laneToggle,zoneModal,_zoneSync,_zoneSave,tplToggle,tplModal,_tplRec,_tplSave,thankModal,_thankGo,goalModal,_goalSave,goalClose,rwTab,redeem,proposeModal,_proposeGo,rwToggle,rewardModal,_rewardSave,rwApprove,_rwApproveGo,rwFulfil,rwReject,lbTab,lbSort,recogModal,_recogGo,badgeModal,_badgeGo,month,toggleEmpty};
window.mount_tasks=mountList;window.mount_tasks_board=mountBoard;window.mount_tasks_huddle=mountHuddle;window.mount_tasks_inbox=mountInbox;window.mount_tasks_people=mountPeople;window.mount_tasks_health=mountHealth;window.mount_tasks_zones=mountZones;window.mount_tasks_catalog=mountCatalog;window.mount_tasks_my_week=mountMyWeek;window.mount_team_goal=mountGoal;window.mount_rewards=mountRewards;window.mount_leaderboard=mountLeaderboard;window.mount_payroll=mountPayroll;
document.addEventListener("t10",()=>{});
})();
</script>
