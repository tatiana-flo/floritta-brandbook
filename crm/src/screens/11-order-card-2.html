#s-order-create .money .tot{font-family:var(--f-display);font-size:28px;font-weight:300;text-align:right}

#s-order-create .ph .x svg{width:13px;height:13px}
#s-order-create .drop{border:1px dashed var(--light);padding:14px;text-align:center;color:var(--grey);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}

[data-size="ipad"] #s-order-create .nc-wrap{grid-template-columns:minmax(0,1fr)}

N11.f=N11_blank();

window.mount_order_create=function(params){

};

 if(e.key==="Escape"&&N11.modal&&!document.getElementById("modal").classList.contains("on")&&!document.getElementById("palette").classList.contains("on"))N11.modalClose()});

Object.assign(N11,{
 E:s=>App.esc(s),mgr(){return App.isMgr()},
 cust(){return N11.f.customer?App.customer(N11.f.customer):null},
 dirty(){const f=N11.f,b=N11_blank();return JSON.stringify({...f,hidden:0,date:0})!==JSON.stringify({...b,hidden:0,date:0})},
 setCtx(ctx,silent){N11.ctx=ctx;N11.d.ctx=ctx;N11.f=N11_blank();N11.chat={state:"idle"};N11.created=null;const f=N11.f,c=App.data.customers[0],cv=App.data.convos[0];
  if(["chat","chatDraft","flora","payOrder","payAmount"].includes(ctx)){f.hidden.conversation_id=cv.id;f.custMode="new";f.newCust.name=c.n;f.newCust.phone=c.phone;f.source="whatsapp"}

  if(ctx==="payOrder"){f.hidden.pay_order_id="PL-7731";f.custMode="existing";f.customer=c.id;N11.prefillPrev();f.items=[{id:1,name:"Bouquet",qty:1,price:95,variant:null,alcohol:false,built:false}]}
  if(ctx==="payAmount"){f.hidden.pay_link_amount=95;f.custMode="existing";f.customer=c.id;N11.prefillPrev();f.items=[{id:1,name:"Bouquet",qty:1,price:95,variant:null,alcohol:false,built:false}]}
  if(ctx==="constructor"){f.items=[{id:1,name:"Custom bouquet",qty:1,price:0,variant:null,alcohol:false,built:true,recipe:"12 × Rose Red Naomi · 5 × Eucalyptus · 3 × Ruscus · wrap ivory"}];f.subPref="closest_match"}
  if(ctx==="chatDraft"){N11.render();setTimeout(()=>N11.fillFromChat(),300);return}
  if(!silent)N11.render()},
 prefillPrev(){const f=N11.f;f.rec={name:"Mum",phone:"+44 7700 900412",email:""};f.addr={q:"14 Tanner Street, London SE1 3LE",l1:"14 Tanner Street",l2:"Flat 3",city:"London",pc:"SE1 3LE",notes:"Bell marked 3"};f.occasion="Birthday";f.prevCode="#118422"},
 demoMenu(ev){App.pop(ev,["Context (query string from Inbox / constructor)",...N11_CTX.map(x=>({t:(N11.ctx===x[0]?"✓ ":"   ")+x[1],fn:()=>N11.setCtx(x[0])})),"-",{t:(N11.modal?"✓ ":"   ")+"Board modal variant (manager, from /orders)",fn:()=>{N11.modal=!N11.modal;N11.refsLoaded=false;N11.render();if(N11.modal)setTimeout(()=>{N11.refsLoaded=true;N11.refsCache=true;N11.render()},900)}},{t:(N11.d.trainee?"✓ ":"   ")+"Trainee florist (Save → 403)",fn:()=>{N11.d.trainee=!N11.d.trainee;N11.render()}},{t:(N11.d.noRule?"✓ ":"   ")+"No website delivery rule",fn:()=>{N11.d.noRule=!N11.d.noRule;N11.f.delChoice=N11.d.noRule?"other":"site";N11.f.fee=N11.d.noRule?0:N11_RULE.fee;N11.render()}},"-",{t:"Pick corporate customer (PO field)",fn:()=>{N11.f.custMode="existing";N11.f.customer=5002;N11.applyCustomer();N11.render()}},{t:"Pick partner customer",fn:()=>{N11.f.custMode="existing";N11.f.customer=5006;N11.applyCustomer();N11.render()}},{t:"Add an alcohol line (Champagne)",fn:()=>{N11.f.items.push({id:Date.now(),name:"Champagne · Moët 75cl",qty:1,price:48,variant:900,alcohol:true,built:false});N11.render()}},{t:"Add lilies for a recipient with allergy",fn:()=>{N11.f.items.push({id:Date.now(),name:"White Spray · lilies",qty:1,price:110,variant:103,alcohol:false,built:false,lilies:true});N11.f.rec.name="Mum";N11.render()}},{t:"Source = In-store (points hint)",fn:()=>{N11.f.source="in_store";N11.render()}}])},

 /* ---- head: ORDN-001 ORDN-002 ORDN-003 ORDN-068 ---- */

 /* ---- banners: ORDN-004..022 ---- */
 renderBanners(){const A=App,ic=A.icon,E=N11.E,f=N11.f,ctx=N11.ctx,c=A.data.customers[0];let h="";const B=(cls,icn,t)=>`<div class="banner ${cls}">${ic(icn)}<div style="flex:1;min-width:0">${t}</div></div>`;
  if(N11.modal&&!N11.refsLoaded){h+=`<div class="hint mb8">Loading reference data (occasions, products, channels, payment methods, delivery rule) – GET /api/orders/create-ref</div>`}

  if(N11.created&&N11.created.fail)h+=B("--accent","alert",`<b>Order created, but the chat's link could not be moved:</b> another order already took it or it was removed. Create a new link from the order card.`);
  if(N11.modal){document.getElementById("nc-banners").innerHTML=h;return}
  if(["chat","chatDraft","payOrder","payAmount"].includes(ctx)){h+=B("","chat",`Linked to chat with <b>${E(c.n)}</b> · WhatsApp. Buyer opened as New customer with the contact's name and phone; Source = WhatsApp. On save the order is attached to the chat (conversations.order_id).`)
   if(ctx!=="flora")h+=N11.chatPanel()}
  if(ctx==="flora")h+=B("","sparkle",`<b>Filled in from the order Flora collected in the chat.</b> Filled: buyer, recipient, address, date, 1 line, card message, occasion, substitution preference. Ask the customer: <i>удобное окно доставки</i>. <div class="hint mt8">Check every field and the delivery fee; the payment link is sent by you, not by Flora. Saving closes Flora's draft (audit comms.order_draft.created) and records chat_draft_applied_at as if the copilot filled it.</div>`);
  if(ctx==="payOrder")h+=B("--warn","card",`<b>A payment link for £95 is already in the chat</b> (placeholder #PL-7731). Save the order – the link and its payment move onto it (Stripe lock, like the webhook). <div class="mt8">✓ The customer has already paid £95 → the order saves as Paid; other pending links are cancelled.</div>`);
  if(ctx==="payAmount")h+=B("--warn","card",`A payment link for <b>£95</b> will be created when the order is saved and added to the chat draft (deposit if less than the order, otherwise balance). Needs Stripe enabled and ≥ £0.50.`);
  if(ctx==="payOrder"||ctx==="payAmount"){h+=B("","refresh",`Taken from the previous order <b>${E(f.prevCode||"#118422")}</b>: recipient, address, occasion (never date, slot or note). The link amount became the price of the only unpriced line (“Bouquet” £95).`);
   const tot=N11.total();if(tot!==95&&f.items.some(i=>i.price))h+=B("--accent","alert",tot>95?`The order total ${A.fmt(tot)} is more than the link's £95: once paid, the order stays part-paid. Send another link for the difference.`:`The order total ${A.fmt(tot)} is less than the link's £95: the customer would pay more than the order costs.`);

 chatPanel(){const s=N11.chat,ic=App.icon;
  const btn=s.state==="idle"?`<button class="btn --sm" onclick="N11.fillFromChat()">${ic("sparkle")} Fill from the chat</button>`:s.state==="loading"?`<button class="btn --sm" disabled>Reading the chat…</button>`:`<button class="btn --ghost --sm" onclick="N11.fillFromChat()">${ic("refresh")} Fill again</button>`;
  const res=s.state==="done"?`<div class="mt8 sm"><b>Filled:</b> type, method, recipient, phone, address, date, slot, 1 line, card message, delivery · <span class="tag --line">medium confidence</span></div><div class="hint mt8">Ask the customer: <i>нужна ли открытка; точное время</i> (the copilot writes this list in Russian – worth fixing in the redesign)</div><div class="hint">The customer only named a budget – about £80; the single unpriced line got it as its price. Internal note: “Customer budget: about £80”.</div>${N11.ctx==="chatDraft"?`<div class="hint">Ran automatically (?draft=1).</div>`:""}`:s.state==="error"?`<div class="err mt8">Could not read the chat (copilot timeout)</div>`:s.state==="empty"?`<div class="hint mt8">Nothing in the chat to build an order from yet</div>`:"";
  return `<div class="banner"><div>${ic("sparkle")}</div><div style="flex:1"><div class="row" style="gap:10px;flex-wrap:wrap">${btn}<span class="hint">The copilot reads the chat and fills in the fields. Empty values do not overwrite what you typed – but Type and Method are always overwritten, and product lines and the card message replace what you entered.</span></div>${res}</div></div>`},
 fillFromChat(){const f=N11.f;N11.chat.state="loading";N11.renderBanners();setTimeout(()=>{N11.chat.state="done";f.type="gift";f.method="delivery";f.rec={name:"Mum",phone:"+44 7700 900412",email:""};f.addr={q:"14 Tanner Street, London SE1 3LE",l1:"14 Tanner Street",l2:"Flat 3",city:"London",pc:"SE1 3LE",notes:""};f.from="10:00";f.to="12:00";f.occasion="Birthday";f.items=[{id:1,name:"Bouquet",qty:1,price:80,variant:null,alcohol:false,built:false}];f.cards=[{t:"Happy birthday Mum x",for:0}];f.note="Customer budget: about £80";f.delChoice="free";f.delTouched=true;f.fee=0;f.hidden.chat_draft_applied_at=App.NOW.toISOString();N11.render();App.toast("Filled from the chat · delivery named in the chat wins over the website rule")},700)},

 /* ---- form ---- */
 sec(t,b,o={}){return `<div class="sec"><div class="sh"><div class="h4">${t}</div>${o.head||""}</div><div class="sb">${b}</div></div>`},
 fld(k,label,inner,hint){const e=N11.errs[k];return `<div class="field ${e?"--err":""}"><label>${label}</label>${inner}${e?`<div class="err" role="alert">${N11.E(e)}</div>`:hint?`<div class="hint">${hint}</div>`:""}</div>`},
 renderForm(){const A=App,f=N11.f,E=N11.E,ic=A.icon;const mgr=N11.mgr();const ro=N11.d.trainee?"ro":"";
  if(N11.modal&&!N11.refsLoaded){document.getElementById("nc-form").innerHTML=`<div class="modalf"><div class="mh"><div class="h3">New order</div><span class="sp"></span><button class="ib" onclick="N11.modalClose()">${ic("close")}</button></div><div class="mb">${Array.from({length:8},()=>`<div class="skel"></div>`).join("")}<div class="row mt16" style="gap:8px"><span class="hint">If the reference request fails: an error state with “Retry”.</span><button class="textbtn" onclick="App.toast('Retry → GET /api/orders/create-ref')">Retry</button></div></div></div>`;return}
  const left=N11.secBuyer()+N11.secRecipient()+N11.secFulfil()+N11.secAddress();
  const right=N11.secProducts()+N11.secCards()+N11.secAttach()+N11.secTotals()+N11.secMeta();
  const body=`<div class="nc-wrap ${ro}"><div class="nc-col">${left}</div><div class="nc-col">${right}</div></div>`;
  document.getElementById("nc-form").innerHTML=N11.modal?`<div class="modalf"><div class="mh"><div class="h3">New order</div><span class="hint">xl modal · board auto-refresh paused while open · Esc, backdrop, ✕ and Cancel ask “Discard this order?” when something is typed · no chat / pay-link / Flora / constructor prefill here${N11.refsCache?" · refs from cache, refreshed quietly":""}</span><span class="sp"></span><button class="ib" title="Close" onclick="N11.modalClose()">${ic("close")}</button></div><div class="mb">${body}</div></div>`:body},

 /* ---- Buyer: ORDN-023..029 ORDN-036 ORDN-063 ORDN-025 ---- */
 secBuyer(){const A=App,f=N11.f,E=N11.E,ic=A.icon;const c=N11.cust();
  let who="";
  if(!f.anonBuyer){
   who=`<div class="chips mb8"><button class="chip ${f.custMode==="existing"?"on":""}" onclick="N11.f.custMode='existing';N11.render()">Existing customer</button><button class="chip ${f.custMode==="new"?"on":""}" onclick="N11.f.custMode='new';N11.render()">New customer</button></div>`;
   if(f.custMode==="existing"){
    who+=c?`<div class="note-box"><div class="row" style="gap:8px;flex-wrap:wrap"><b>Selected: ${E(c.n)}</b> <span class="tnum muted">${E(c.phone)}</span>${c.tags.map(t=>`<span class="tag ${t==="VIP"?"--ink":""}">${t}</span>`).join("")}${c.corporate?`<span class="tag --line">Corporate</span>`:""}${c.partner?`<span class="tag --line">Partner</span>`:""}<span class="sp"></span><button class="textbtn" onclick="N11.f.customer=null;N11.render();App.toast('Cleared – the ticks taken from the card stay set (as on prod)')">Clear</button></div><div class="hint mt8">From the card: Anonymous sender and “Do not send the bouquet photo” were set automatically${c.partner?" · partner → Source switched to Email (Partners tab)":""}.</div></div>`
    :`<div class="sug">${N11.fld("customer","Customer",`<input class="input" placeholder="Search by name, phone or wallet code FLC…" value="${E(f.custQ)}" oninput="N11.f.custQ=this.value;N11.sug='cust';N11.render();this.focus();this.setSelectionRange(99,99)" onfocus="N11.sug='cust';N11.renderSug()">`,"Suggestions from 2 characters (server from 3), 250 ms delay · recent buyers first · searches name, phone and FLC… wallet code – not email (prod's placeholder promises email)")}<div id="nc-sug-cust"></div></div>`;
    if(c&&c.partner)who+=`<div class="hint --ok mt8">This customer is tagged as a partner – the order goes to the Partners tab.</div>`;
   }else{
    who+=`<div class="fg --2">${N11.fld("newName","Name *",`<input class="input" value="${E(f.newCust.name)}" oninput="N11.f.newCust.name=this.value">`)}${N11.fld("newPhone","Phone",`<input class="input tnum" value="${E(f.newCust.phone)}" placeholder="+44 7700 900…" oninput="N11.f.newCust.phone=this.value">`,"Phone or email is required · same phone / email reuses the existing customer")}${N11.fld("newEmail","Email",`<input class="input" value="${E(f.newCust.email)}" oninput="N11.f.newCust.email=this.value">`)}${N11.fld("ig","Instagram handle",`<input class="input" value="${E(f.newCust.ig)}" placeholder="@" oninput="N11.f.newCust.ig=this.value">`)}</div><div class="field mt8"><label>Customer notes</label><input class="input" value="${E(f.newCust.notes)}" oninput="N11.f.newCust.notes=this.value"></div><label class="check mt8"><input type="checkbox" ${f.newCust.consent?"checked":""} onchange="N11.f.newCust.consent=this.checked"> Marketing consent</label>`;
   }
  }
  const po=c&&c.corporate?`<div class="field mt8" style="max-width:300px"><label>Customer order number (PO)</label><input class="input" maxlength="64" value="${E(f.po)}" oninput="N11.f.po=this.value"><div class="hint">Shown for corporate / partner customers only (not for New customer).</div></div>`:"";
  return N11.sec("Buyer",`<div class="fg --2"><div class="field"><label>Type</label><div class="chips"><button class="chip ${f.type==="gift"?"on":""}" onclick="N11.setType('gift')">Gift</button><button class="chip ${f.type==="self"?"on":""}" onclick="N11.setType('self')">Self</button></div><div class="hint">Self copies the buyer's name and phone into the recipient once (email only for New customer); Gift clears the recipient.</div></div><div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" ${f.anonBuyer?"checked":""} onchange="N11.f.anonBuyer=this.checked;N11.render()"> The buyer left no contacts</label><div class="hint">Only the recipient is then required. The order is filed under the recipient.</div></div></div><div class="mt16">${who}</div>${po}${f.source==="in_store"?`<div class="note-box mt8">${ic("gift")} Order in the shop: offer points – with the buyer's phone, cashback is credited by itself once paid.</div>`:""}`)},
 setType(t){const f=N11.f;f.type=t;if(t==="self"){const c=N11.cust();if(f.anonBuyer){}else if(c){f.rec={name:c.n,phone:c.phone,email:""}}else{f.rec={name:f.newCust.name,phone:f.newCust.phone,email:f.newCust.email}}}else f.rec={name:"",phone:"",email:""};N11.render()},
 renderSug(){const A=App,f=N11.f,E=N11.E;const el=document.getElementById("nc-sug-cust");if(!el)return;const q=f.custQ.trim().toLowerCase();if(q.length<2){el.innerHTML="";return}
  const digits=q.replace(/\D/g,"");const list=A.data.customers.filter(c=>c.n.toLowerCase().includes(q)||(digits.length>=4&&c.phone.replace(/\D/g,"").includes(digits))||("flc"+c.id).includes(q)).slice(0,20);
  el.innerHTML=`<div class="sl">${q.length<3?`<div class="hd">Loading</div>`:list.length?`<div class="hd">Recent buyers first</div>`+list.map(c=>`<button onmousedown="event.preventDefault()" onclick="N11.pick(${c.id})"><span>${E(c.n)}</span><span class="r tnum">${digits.length>=4||/[a-z]/.test(q)?E(c.phone):""}</span></button>`).join(""):`<div class="hd">No matches</div>`}</div>`},
 pick(id){const f=N11.f;f.customer=id;f.custQ="";N11.sug=null;N11.applyCustomer();N11.render();App.toast("Customer selected · card ticks applied")},
 applyCustomer(){const f=N11.f,c=N11.cust();if(!c)return;c.corporate=c.tags.includes("Corporate")||c.id===5002;c.partner=c.id===5006;f.anonSender=true;f.photoOptOut=true;if(c.partner)f.source="email";if(f.type==="self")f.rec={name:c.n,phone:c.phone,email:""}},

 /* ---- Recipient: ORDN-030..034 ORDN-082 ---- */
 secRecipient(){const A=App,f=N11.f,E=N11.E;const c=N11.cust();
  const recs=c&&f.type==="gift"&&f.custMode==="existing"?N11_RECIPS.default:[];
  const chips=recs.length?`<div class="field mb8"><label>From the customer card</label><div class="chips">${recs.map((r,i)=>`<button class="chip ${f.rec.name.trim().toLowerCase()===r.name.toLowerCase()?"on":""}" aria-pressed="${f.rec.name.trim().toLowerCase()===r.name.toLowerCase()}" onclick="N11.pickRec(${i})">${E(r.name)} · ${E(r.rel)} · ${E(r.area)}${r.no?` <span class="accent">⚠ no ${E(r.no)}</span>`:""}</button>`).join("")}</div><div class="hint">Tap fills name, phone and the last gift address (editable). Prod overwrites an entered phone with an empty one when the card has none – fixed here: keeps what you typed.</div></div>`:"";
  const lil=f.items.some(i=>i.lilies)&&f.rec.name.toLowerCase()==="mum"?`<div class="note-box --accent mt8"><b>Lilies in the order – the card says the recipient must not get them.</b><label class="check mt8"><input type="checkbox" ${f.lilyOk?"checked":""} onchange="N11.f.lilyOk=this.checked"> The customer allowed lilies – save anyway</label><div class="hint --accent mt8">Kept on the order with your name and the time. Block mode (flag COMMS_FACTS_BLOCK_LILIES): without the tick the order does not save. Default mode: it saves and a red toast warns.</div></div>`:"";
  return N11.sec("Recipient",`<div class="field mb8"><label>Method</label><div class="chips"><button class="chip ${f.method==="delivery"?"on":""}" onclick="N11.setMethod('delivery')">Delivery</button><button class="chip ${f.method==="collection"?"on":""}" onclick="N11.setMethod('collection')">Collection</button><button class="chip ${f.method==="confirm"?"on":""}" onclick="N11.setMethod('confirm')">Confirm address</button></div><div class="hint">Confirm address = delivery without an address yet; the board shows a dash and “Confirm address” until it is added.</div></div>${chips}
   <div class="fg --3">${N11.fld("recName","Recipient name"+(f.type==="gift"||f.anonBuyer?" *":""),`<input class="input" value="${E(f.rec.name)}" oninput="N11.f.rec.name=this.value">`)}${N11.fld("recPhone","Recipient phone"+(f.method!=="collection"?" *":""),`<input class="input tnum" value="${E(f.rec.phone)}" oninput="N11.f.rec.phone=this.value">`,"required for delivery")}${N11.fld("recEmail","Recipient email",`<input class="input" value="${E(f.rec.email)}" oninput="N11.f.rec.email=this.value">`,"needed for “Recipient” notification options")}</div>${lil}`)},
 pickRec(i){const r=N11_RECIPS.default[i],f=N11.f;f.rec.name=r.name;if(r.phone)f.rec.phone=r.phone;if(f.method==="delivery"){f.addr={q:r.l1+", "+r.city+" "+r.pc,l1:r.l1,l2:r.l2,city:r.city,pc:r.pc,notes:r.notes||f.addr.notes}}N11.render()},
 setMethod(m){const f=N11.f;f.method=m;if(m==="collection"){f.fee=0;f.delChoice="other";f.delTouched=false}else if(!f.delTouched){f.delChoice=N11.d.noRule?"other":"site";f.fee=N11.d.noRule?0:N11_RULE.fee}N11.render()},

 /* ---- Fulfilment: ORDN-035 ORDN-037..039 ORDN-041 ORDN-042 ---- */
 secFulfil(){const f=N11.f,E=N11.E;
  const sw=(k,lbl,hint)=>`<div class="row" style="gap:10px;align-items:flex-start"><span class="switch ${f[k]?"on":""}" onclick="N11.f.${k}=!N11.f.${k};N11.render()"></span><div><div class="sm">${lbl}</div><div class="hint">${hint}</div></div></div>`;
  return N11.sec("Fulfilment",`<div class="fg --3">${N11.fld("date","Fulfilment date *",`<input class="input" type="date" value="${f.date}" onchange="N11.f.date=this.value">`,"backdating allowed")}<div class="field"><label>Slot</label><select class="select" onchange="N11.f.slotType=this.value;N11.render()">${[["none","No slot"],["between","Between"],["before","Before"],["after","After"]].map(x=>`<option value="${x[0]}" ${f.slotType===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div>${f.slotType==="none"?"<div></div>":N11.fld("slot",f.slotType==="before"?"To":f.slotType==="after"?"From":"From / To",`<div class="row" style="gap:8px">${f.slotType!=="before"?`<input class="input tnum" value="${E(f.from)}" oninput="N11.f.from=this.value">`:""}${f.slotType!=="after"?`<input class="input tnum" value="${E(f.to)}" oninput="N11.f.to=this.value">`:""}</div>`,"server checks the minimum window width")}
   <div class="field"><label>Email notifications</label><select class="select" onchange="N11.f.notify=this.value">${[["sender","Sender only"],["recipient","Recipient only"],["both","Sender and recipient"],["none","Do not send"]].map(x=>`<option value="${x[0]}" ${f.notify===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div></div>
   <div class="fg --2 mt16">${sw("photoOptOut","Do not send the bouquet photo to the buyer","Mutes the automatic finished-bouquet photo when the order goes Ready.")}${f.method!=="collection"?sw("anonAddr","Anonymous recipient – hide the address from the buyer","No address, map, tracking, door photo – in email, SMS, WhatsApp or DPD notices."):""}${f.method!=="collection"?sw("anonSender","Anonymous sender – never tell the recipient who sent it","Default comes from the customer card."):""}</div>`)},

 /* ---- Address: ORDN-040 ORDN-043 ORDN-044 ORDN-045 ORDN-081 · Delivery fee: ORDN-046 ORDN-047 ORDN-048 ORDN-085 ORDN-009 ---- */
 secAddress(){const A=App,f=N11.f,E=N11.E;if(f.method==="collection")return N11.sec("Collection",`<div class="sm">80 Willow Walk, Bermondsey SE1 5SY · 8:00–22:00</div><div class="hint mt8">Collection zeroes the delivery fee and clears Free; switching back to Delivery offers the website rule again.</div>`);
  let addr;
  if(f.method==="confirm")addr=`<div class="note-box">A delivery whose address the customer has not given yet – the fields appear once you switch to Delivery. The board shows “Confirm address”.</div>`;
  else{const q=f.addr.q.trim();const sugg=N11.sug==="addr"&&q.length>=3?`<div class="sl">${q.length<4?`<div class="hd">Loading…</div>`:""}${N11_PLACES.map((p,i)=>`<button onmousedown="event.preventDefault()" onclick="N11.pickPlace(${i})">${E(p[0])}</button>`).join("")}</div>`:"";
   addr=`<div class="sug mb8">${N11.fld("addrQ","Address lookup",`<input class="input" placeholder="Start typing a postcode or address…" value="${E(f.addr.q)}" oninput="N11.f.addr.q=this.value;N11.sug='addr';N11.render();this.focus();this.setSelectionRange(99,99)" onblur="setTimeout(()=>{if(N11.sug==='addr'){N11.sug=null;N11.render()}},150)">`,"Google Places from 3 characters (280 ms, one session per search) · pick with the mouse – arrows do not move; a lookup failure silently leaves manual entry")}${sugg}</div>
    <div class="fg --2">${N11.fld("l1","Address line 1 *",`<input class="input" value="${E(f.addr.l1)}" oninput="N11.f.addr.l1=this.value">`)}${N11.fld("l2","Address line 2",`<input class="input" value="${E(f.addr.l2)}" oninput="N11.f.addr.l2=this.value">`)}${N11.fld("city","City",`<input class="input" value="${E(f.addr.city)}" oninput="N11.f.addr.city=this.value">`)}${N11.fld("pc","Postcode *",`<input class="input" value="${E(f.addr.pc)}" oninput="N11.f.addr.pc=this.value.toUpperCase()">`)}</div><div class="field mt8"><label>Delivery notes</label><input class="input" value="${E(f.addr.notes)}" oninput="N11.f.addr.notes=this.value"></div>`}
  const sub=N11.subtotal();const rule=!N11.d.noRule;const autoFree=rule&&sub>=N11_RULE.from;
  const fee=`<div class="hr"></div><div class="field"><label>Delivery</label><div class="chips">${rule?`<button class="chip ${f.delChoice==="site"?"on":""}" onclick="N11.delPick('site')">£${N11_RULE.fee} – as on the website</button>`:""}<button class="chip ${f.delChoice==="free"?"on":""}" onclick="N11.delPick('free')">Free</button><button class="chip ${f.delChoice==="other"?"on":""}" onclick="N11.delPick('other')">Other amount</button>${f.delChoice==="other"?`<input class="input num" style="width:100px" value="${f.fee}" oninput="N11.f.fee=+this.value||0;N11.f.delTouched=true;N11.renderTotals()">`:""}</div>
   ${N11.errs.fee?`<div class="err">${E(N11.errs.fee)}</div>`:rule?`<div class="hint">Website rule: £${N11_RULE.fee}, free from £${N11_RULE.from}. Agreed something else with the customer – change it.${!f.delTouched?` Until you choose, the suggestion follows the subtotal: ${autoFree?"<b>free</b> (over the threshold)":"<b>£"+N11_RULE.fee+"</b>"}.`:""}</div>`:`<div class="hint --accent">No website delivery rule – no “as on the website” chip, form starts at Other amount £0; without a fee or Free the server refuses to save.</div>`}</div>`;
  return N11.sec("Fulfilment address",addr+fee)},
 pickPlace(i){const p=N11_PLACES[i],f=N11.f;f.addr.q=p[0];f.addr.l1=p[1];f.addr.l2=p[2];f.addr.city=p[3];f.addr.pc=p[4];N11.sug=null;N11.render();App.toast("Lines 1 / 2, City and Postcode overwritten from Google – empty if Google had none")},
 delPick(c){const f=N11.f;f.delChoice=c;f.delTouched=true;if(c==="site")f.fee=N11_RULE.fee;if(c==="free")f.fee=0;N11.render()},
 effFee(){const f=N11.f;if(f.method==="collection")return 0;if(!f.delTouched&&!N11.d.noRule)return N11.subtotal()>=N11_RULE.from?0:N11_RULE.fee;return f.delChoice==="free"?0:f.fee},

 /* ---- Products: ORDN-049 ORDN-050 ORDN-051 ORDN-080 ORDN-021 ORDN-022 ---- */
 secProducts(){const A=App,f=N11.f,E=N11.E,ic=A.icon;
  const rows=f.items.map((it,i)=>{const q=(it.name||"").trim().toLowerCase();const open=N11.sug==="prod"+i&&q.length>=2&&!it.variant;
   const cat=A.data.products.filter(p=>p.name.toLowerCase().includes(q)||q.includes(p.name.toLowerCase().split(" ")[0])).slice(0,8);const cus=N11_CUSTOM.filter(x=>x[0].toLowerCase().includes(q));
   const sl=open?`<div class="sl">${cat.length?`<div class="hd">Catalog</div>`+cat.map(p=>`<button onmousedown="event.preventDefault()" onclick="N11.pickProd(${i},${p.id})"><span>${E(p.name)}</span><span class="r">${A.fmt(p.price)}</span></button>`).join(""):""}${cus.length?`<div class="hd">Remembered custom names</div>`+cus.map(x=>`<button onmousedown="event.preventDefault()" onclick="N11.pickCustom(${i},'${E(x[0])}',${x[1]})"><span>${E(x[0])}</span><span class="r">typical ${A.fmt(x[1])}</span></button>`).join(""):""}${!cat.length&&!cus.length?`<div class="hd">No catalog match – saved as a custom item</div>`:""}</div>`:"";
   if(it.built)return `<tr><td colspan="4"><b>Custom bouquet</b><div class="hint">Built bouquet: ${E(it.recipe)} – priced by the server from live stock (min. £30)${N11.errs["item"+i]?`<div class="err">${E(N11.errs["item"+i])}</div>`:""}</div></td><td>${f.items.length>1?`<button class="textbtn --accent" onclick="N11.f.items.splice(${i},1);N11.render()">Remove</button>`:""}</td></tr>`;
   return `<tr><td><div class="sug"><input class="input" placeholder="Type a product name…" value="${E(it.name)}" oninput="N11.prodType(${i},this.value)" onfocus="N11.sug='prod${i}';N11.render();const el=this;setTimeout(()=>{const x=document.querySelectorAll('#s-order-create .items .sug input')[${i}];if(x){x.focus();x.setSelectionRange(99,99)}},0)" onblur="setTimeout(()=>{if(N11.sug==='prod${i}'){N11.sug=null;N11.render()}},120)">${sl}</div><div class="hint">${it.variant?"✓ From catalog":it.name?"No catalog match – saved as a custom item":""}${it.alcohol?` · <span class="accent">alcohol</span>`:""}${it.lilies?` · <span class="accent">contains lilies</span>`:""}${N11.errs["item"+i]?`<div class="err">${E(N11.errs["item"+i])}</div>`:""}</div></td><td style="width:60px"><input class="input num" type="number" min="1" value="${it.qty}" oninput="N11.f.items[${i}].qty=+this.value||1;N11.renderTotals()"></td><td style="width:90px"><input class="input num" value="${it.price}" oninput="N11.f.items[${i}].price=+this.value||0;N11.renderTotals()"></td><td class="num tnum" style="width:70px">${A.fmt(it.qty*it.price)}</td><td style="width:70px">${f.items.length>1?`<button class="textbtn --accent" onclick="N11.f.items.splice(${i},1);N11.render();App.toast('Line removed – card messages bound by line number shift (prod does not re-point them)')">Remove</button>`:""}</td></tr>`}).join("");
  const alc=f.items.some(i=>i.alcohol)?`<div class="note-box --accent mt8"><label class="check"><input type="checkbox" ${f.alcoholOk?"checked":""} onchange="N11.f.alcoholOk=this.checked"> Alcohol in this order: the buyer confirmed they and the recipient are 18+ and will show ID on delivery</label><div class="hint --accent mt8">Licence condition 340 – Challenge 25, sealed container, card payment only. Saving stamps age_confirmed_at and audit order.alcohol.age_confirmed_manual.</div></div>`:"";
  return N11.sec("Products",`<div class="tbl-wrap --flush"><table class="tbl items"><thead><tr><th>Product</th><th>Qty</th><th>Unit price</th><th class="num">Line</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${N11.errs.items?`<div class="err mt8" role="alert">${E(N11.errs.items)}</div>`:""}<div class="row mt8" style="gap:8px"><button class="btn --ghost --sm" onclick="N11.f.items.push({id:Date.now(),name:'',qty:1,price:0,variant:null,alcohol:false,built:false});N11.render()">${ic("plus")} Add product</button><span class="hint">Up to 8 catalog matches + remembered custom names; editing a picked name unlinks it (price stays). Substitution preference has no field – it comes hidden from the constructor, Flora or the copilot${f.subPref?`: <b>${f.subPref.replace("_"," ")}</b>`:""}.</span></div>${alc}`)},
 prodType(i,v){const it=N11.f.items[i];it.name=v;if(it.variant){it.variant=null}N11.sug="prod"+i;N11.render();const x=document.querySelectorAll("#s-order-create .items .sug input")[i];if(x){x.focus();x.setSelectionRange(99,99)}},
 pickProd(i,id){const p=App.product(id),it=N11.f.items[i];it.name=p.name;it.price=p.price;it.variant=id;it.alcohol=false;N11.sug=null;N11.render()},
 pickCustom(i,n,price){const it=N11.f.items[i];it.name=n;it.price=price;it.variant=null;N11.sug=null;N11.render()},

 /* ---- Card messages & notes: ORDN-052 ORDN-053 ORDN-054 ORDN-083 ---- */
 secCards(){const f=N11.f,E=N11.E,ic=App.icon;
  const cards=f.cards.length?f.cards.map((c,i)=>`<div class="row mb8" style="gap:8px;align-items:flex-start"><div class="field" style="flex:1"><label>Card message ${i+1}</label><textarea class="textarea" style="min-height:52px" oninput="N11.f.cards[${i}].t=this.value">${E(c.t)}</textarea></div><div class="field" style="width:160px;flex:none"><label>For bouquet</label><select class="select" onchange="N11.f.cards[${i}].for=+this.value"><option value="0">Whole order</option>${f.items.map((it,k)=>`<option value="${k+1}" ${c.for===k+1?"selected":""}>${E(it.name||"Line "+(k+1))}</option>`).join("")}</select></div><button class="ib" style="margin-top:22px" title="Remove" onclick="N11.f.cards.splice(${i},1);N11.render()">${ic("close")}</button></div>`).join(""):`<div class="hint mb8">No card messages. Add one per bouquet – the first one mirrors to the gift message; empty ones are dropped.</div>`;
  return N11.sec("Card messages &amp; notes",`${cards}<button class="btn --ghost --sm" onclick="N11.f.cards.push({t:'',for:0});N11.render()">${ic("plus")} Add card message</button>
   <div class="fg --2 mt16"><div class="field"><label>Internal note</label><textarea class="textarea" oninput="N11.f.note=this.value">${E(f.note)}</textarea><div class="hint">Translated to Russian for the mobile app after saving.</div></div><div class="field"><label>Courier / delivery instructions</label><textarea class="textarea" oninput="N11.f.courierNote=this.value;document.getElementById('nc-chint').innerHTML=this.value.length>280?'<span class=accent>An external courier (Uber) only sees the first 280 characters – put what matters first.</span>':'Shared with the courier app and Uber.'">${E(f.courierNote)}</textarea><div class="hint" id="nc-chint">${f.courierNote.length>280?`<span class="accent">An external courier (Uber) only sees the first 280 characters – put what matters first.</span>`:"Shared with the courier app and Uber."}</div></div></div>`)},

 /* ---- Attachments: ORDN-055..059 ---- */
 secAttach(){const f=N11.f,E=N11.E,ic=App.icon;
  if(!N11.mgr())return N11.sec("Reference &amp; documents",`<div class="hint">You can attach files after saving the order.</div>`);
  const grid=f.photos.map((p,i)=>`<div class="ph"><div class="photo --4x5"><img src="${p.url}" alt=""></div><button class="x" onclick="N11.f.photos.splice(${i},1);N11.render()">${ic("close")}</button><input class="input mt8" placeholder="Caption (price, note)…" value="${E(p.cap)}" oninput="N11.f.photos[${i}].cap=this.value"></div>`).join("");
  return N11.sec("Reference &amp; documents",`<div class="ph-grid mb8">${grid}<div class="drop" onclick="N11.addPhoto()">${ic("photo")}<b>Add photos</b><span>or drop anywhere on the form · Cmd/Ctrl+V pastes a screenshot</span></div></div>${N11.errs.photos?`<div class="err" role="alert">${E(N11.errs.photos)}</div>`:`<div class="hint">Up to 8 photos, 15 MB each, 40 MB in total. Only JPEG, PNG and WebP. Uploaded with the order; a photo error never fails the order.</div>`}`)},
 addPhoto(name){const f=N11.f;if(!N11.mgr()){App.toast("Florists attach files after saving");return}if(f.photos.length>=8){N11.errs.photos="Up to 8 photos, 15 MB each, 40 MB in total.";N11.render();return}f.photos.push({url:App.product(100+f.photos.length).img,cap:"",name:name||"photo.jpg"});delete N11.errs.photos;N11.created=null;N11.render();App.toast(name?"Screenshot pasted into attachments":"Photo added")},
 dropFiles(ev){const fs=ev.dataTransfer&&ev.dataTransfer.files;if(fs&&fs.length&&![...fs].every(x=>/jpeg|png|webp/.test(x.type))){N11.errs.photos="Only JPEG, PNG and WebP are supported.";N11.render();return}N11.addPhoto("dropped.jpg")},

 /* ---- Totals: ORDN-060 ORDN-061 ORDN-079 ORDN-017 ---- */
 subtotal(){return N11.f.items.reduce((s,i)=>s+(i.built?0:i.qty*i.price),0)},
 total(){return Math.max(0,N11.subtotal()+N11.effFee()+N11.f.tip)},
 secTotals(){const A=App,f=N11.f,E=N11.E;const fee=N11.effFee();
  return N11.sec("Totals",`<div id="nc-totals">${N11.totalsHtml()}</div><div class="hr"></div><div class="fg --2"><div class="field"><label>Tip</label><input class="input num" value="${f.tip}" oninput="N11.f.tip=+this.value||0;N11.renderTotals()"></div>${N11.fld("promo","Promo code",`<input class="input" value="${E(f.promo)}" placeholder="NEW15" oninput="N11.f.promo=this.value.toUpperCase();N11.renderTotals()">`,"Checked on save: window, limit, used_count")}</div>`)},
 totalsHtml(){const A=App,f=N11.f;const fee=N11.effFee();const disc=f.promo?Math.round(N11.subtotal()*.15):0;
  return `<div class="money"><span>Subtotal</span><span class="num" style="text-align:right">${A.fmt(N11.subtotal())}</span><span>Delivery charge</span><span class="num" style="text-align:right">${fee?A.fmt(fee):"Free"}</span><span>Tip</span><span class="num" style="text-align:right">${A.fmt(f.tip)}</span>${f.promo?`<span>Discount <span class="hint">${f.promo} – applied by the server on save</span></span><span class="num" style="text-align:right">− ${A.fmt(disc)}</span>`:""}<span class="h4">Total</span><span class="tot">${A.fmt(N11.total()-disc)}</span></div><div class="hint mt8">This must match the Stripe link the customer pays.${f.promo?" Prod shows the total without the promo discount (server subtracts it on save) – the redesign shows the expected discount so the link amount is right.":""}</div>`},
 renderTotals(){const el=document.getElementById("nc-totals");if(el)el.innerHTML=N11.totalsHtml();N11.created=null;if(["payOrder","payAmount"].includes(N11.ctx))N11.renderBanners()},

 /* ---- Source, occasion, payment: ORDN-062 ORDN-063 ORDN-064 ORDN-065 ORDN-066 ---- */
 secMeta(){const f=N11.f,E=N11.E;const mgr=N11.mgr();const c=N11.cust();const alc=f.items.some(i=>i.alcohol);
  return N11.sec("Source, occasion &amp; payment",`<div class="fg --2"><div class="field"><label>Source</label><select class="select" onchange="N11.f.source=this.value;N11.render()">${N11_CHANNELS.map(x=>`<option value="${x[0]}" ${f.source===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select>${!f.source?`<div class="hint --accent">No source. The order will save, but it stays red on the board until a source is chosen.</div>`:["ubereats","deliveroo","justeat","udora"].includes(f.source)?`<div class="hint">Marketplace – the platform commission is deducted.</div>`:c&&c.partner&&f.source==="email"?`<div class="hint --ok">Partner → Partners tab (server forces Email for partners, except marketplaces).</div>`:""}</div>
   <div class="field"><label>Occasion</label><select class="select" onchange="N11.f.occasion=this.value;if(this.value!=='Other')N11.f.occCustom='';N11.render()">${N11_OCC.map(x=>`<option ${f.occasion===x?"selected":""}>${x}</option>`).join("")}</select>${f.occasion==="Other"?`<input class="input mt8" placeholder="Custom occasion" value="${E(f.occCustom)}" oninput="N11.f.occCustom=this.value">`:""}</div>
   <div class="field"><label>Payment *</label><select class="select" onchange="N11.f.payment=this.value">${(mgr?["unpaid","paid","partial","refunded"]:["unpaid"]).map(x=>`<option value="${x}" ${f.payment===x?"selected":""}>${x.charAt(0).toUpperCase()+x.slice(1)}</option>`).join("")}</select>${mgr?`<div class="hint">Paid sets date_paid.</div>`:`<div class="hint">Florist: the server drops the payment method and turns paid / refunded into unpaid – so only Unpaid is offered here.</div>`}</div>
   <div class="field"><label>Payment method</label>${mgr?`<select class="select" onchange="N11.f.payMethod=this.value">${(alc?[["","None"],["card","Card"]]:[["","None"],["card","Card"],["cash","Cash"],["other","Other"]]).map(x=>`<option value="${x[0]}" ${f.payMethod===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select>${alc?`<div class="hint --accent">Alcohol is card-payment only.</div>`:""}`:`<div class="hint">Set by a manager.</div>`}</div></div>`)},

 /* ---- foot: ORDN-067 ORDN-069 ORDN-070 ORDN-078 ORDN-084 ---- */
 renderFoot(){const ic=App.icon;const n=Object.keys(N11.errs).length;
  document.getElementById("nc-foot").innerHTML=`<span class="hint">${n?`<span class="accent">${n} field${n>1?"s":""} need attention – see the red lines.</span>`:"Enter in a field does not submit (prod submits the whole form on Enter in any single-line field). Drop files anywhere on the form."}</span><span class="sp"></span>${N11.modal?`<button class="btn --secondary --sm" onclick="N11.modalClose()">Cancel</button>`:`<button class="btn --secondary --sm" onclick="N11.discard()">Discard</button>`}<button class="btn --sm" id="nc-save" onclick="N11.save()">${N11.saving?"Saving…":"Save changes"}</button>`},
 validate(){const f=N11.f,e={};const c=N11.cust();
  if(!f.anonBuyer&&f.custMode==="existing"&&!c)e.customer="Pick a customer or switch to New customer";
  if(!f.anonBuyer&&f.custMode==="new"){if(!f.newCust.name.trim())e.newName="Name is required";if(!f.newCust.phone.trim()&&!f.newCust.email.trim())e.newPhone="Phone or email is required"}
  if((f.type==="gift"||f.anonBuyer)&&!f.rec.name.trim())e.recName="Recipient name is required";
  if(f.method!=="collection"&&!f.rec.phone.trim())e.recPhone="Recipient phone is required for delivery";
  if(f.method==="delivery"){if(!f.addr.l1.trim())e.l1="Address line 1 is required";if(!f.addr.pc.trim())e.pc="Postcode is required";if(f.delTouched&&f.delChoice==="other"&&f.fee===0)e.fee="Enter the delivery fee, or mark the delivery as free.";if(N11.d.noRule&&!f.delTouched)e.fee="Enter the delivery fee, or mark the delivery as free."}
  if(!f.date)e.date="Fulfilment date is required";
  f.items.forEach((it,i)=>{if(it.built)return;if(!it.name.trim())e["item"+i]="Product name is required";});
  if(f.items.some(it=>it.built)&&N11.subtotal()>0&&N11.subtotal()<30)e.items="A built bouquet must come to at least £30";
  if(f.items.some(i=>i.alcohol)&&!f.alcoholOk)e.items="Alcohol in the order – tick the 18+ confirmation";
  if(f.items.some(i=>i.alcohol)&&f.payMethod&&f.payMethod!=="card")e.items="Alcohol is card-payment only";
  if(f.items.some(i=>i.lilies)&&f.rec.name.toLowerCase()==="mum"&&!f.lilyOk)e.recName="Lilies for a recipient who must not get them – tick “The customer allowed lilies” (block mode)";
  return e},
 save(){const A=App,f=N11.f;if(N11.saving)return;
  if(N11.d.trainee){A.toast("403 · Trainees can view the board but not change it.");return}
  N11.errs=N11.validate();if(Object.keys(N11.errs).length){N11.render();A.toast("Fix the highlighted fields");return}
  N11.saving=true;N11.renderFoot();
  setTimeout(()=>{const c=N11.cust()||A.data.customers[3];const first=f.items.find(i=>!i.built)||f.items[0];const prod=first.variant?A.product(first.variant):A.data.products[0];
   const o=A.addOrder({customer:c.id,product:prod.id,size:"Standard",total:N11.total()-(f.promo?Math.round(N11.subtotal()*.15):0),chan:(N11_CHANNELS.find(x=>x[0]===f.source)||[,"Phone"])[1],slot:f.slotType==="none"?"No slot":f.from+"–"+f.to,type:f.method==="collection"?"collection":"delivery",addr:f.method==="delivery"?[f.addr.l1,f.addr.l2,f.addr.city+" "+f.addr.pc].filter(Boolean).join(", "):f.method==="confirm"?"Confirm address":"Collection · 80 Willow Walk",recipient:f.rec.name||c.n,card:f.cards[0]?f.cards[0].t:"",notes:f.note,paid:N11.ctx==="payOrder"?"paid":f.payment,delivery:N11.effFee()});
   if(f.photos.length)o.log.push({at:A.NOW.toISOString(),who:A.me().id,t:f.photos.length+" reference photo(s) attached"});
   if(f.hidden.conversation_id)o.log.push({at:A.NOW.toISOString(),who:"system",t:"Linked to chat #"+f.hidden.conversation_id+(f.hidden.comms_order_draft_id?" · Flora draft closed":"")});
   N11.saving=false;N11.created={id:o.id,code:"#"+o.id,pay:N11.ctx==="payOrder"?"adopted":N11.ctx==="payAmount"?"draft":null,fail:false};
   A.push("New order #"+o.id,prod.name+" · "+(f.slotType==="none"?"no slot":f.from+"–"+f.to),{icon:"orders",type:"order",go:["order-card",{id:o.id}]});
   if(N11.modal){N11.f=N11_blank();N11.render();A.toast("Order #"+o.id+" created – you stay on the board")}
   else{const keepCtx=N11.ctx;N11.ctx="none";N11.f=N11_blank();N11.render();A.toast("Order #"+o.id+" created"+(keepCtx!=="none"?" · redirected to a clean /orders/create":""))}},600)}
});
</script>
