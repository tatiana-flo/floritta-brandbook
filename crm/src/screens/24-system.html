function filterTeam(q){q=q.toLowerCase();$$("#s24-team-tbl tbody tr").forEach(tr=>{const u=user(tr.dataset.u);tr.style.display=!q||u.n.toLowerCase().includes(q)||u.email.includes(q)?"":"none"})}

function role(id,v,sel){const u=user(id);const me=A.me().id;

    return `<tr class="r ${v.status==="cancelled"?"muted":""}"><td><b style="font-weight:400">${v.no}</b><span class="sub">${E(a.name)}</span></td><td>${A.fmtDate(v.from)} – ${A.fmtDate(to.toISOString())}<span class="sub">${v.weeks} weeks · due ${A.fmtDate(v.from)}</span></td><td class="num tnum">${v.lines}</td><td class="num"><b class="tnum" style="font-weight:400">${A.fmt(net)}</b><span class="sub tnum">${A.fmt(v.gross)} −${v.disc} %</span></td><td>${A.pill({draft:"todo",sent:"doing",paid:"paid",cancelled:"cancelled"}[v.status],v.status)}${v.at?`<span class="sub">${A.fmtDate(v.at)}${v.ref?" · "+E(v.ref):""}</span>`:""}</td>
    <td><!-- ids: SYST-071 SYST-072 SYST-073 SYST-074 SYST-075 --><div class="rowlinks">${S.flagInvoices?`<button class="textbtn" onclick="S24.printInv(${v.id})">print</button>`:""}${v.status==="draft"?`<button class="textbtn" onclick="S24.invAction(${v.id},'send')">mark sent</button>`:""}${v.status==="draft"||v.status==="sent"?`<button class="textbtn" onclick="S24.markPaid(${v.id})">mark paid</button>`:""}${v.status!=="cancelled"&&v.status!=="paid"?`<button class="textbtn --accent" onclick="S24.cancelInv(${v.id})">cancel</button>`:""}${v.status==="cancelled"||v.status==="paid"?`<button class="textbtn" onclick="S24.invAction(${v.id},'reopen')">back to draft</button>`:""}</div></td></tr>`}).join(""):`<tr><td colspan="6"><div class="empty">${I("pound")}<div class="h3">No invoices yet</div></div></td></tr>`}
  </tbody></table></div></div>
  <!-- ids: SYST-180 --><div class="xs muted mt16">Row actions answer with a toast on success and show the server reason on refusal (wrong date, wrong status transition) – nothing fails silently.</div>`;
}
function newAccount(c){const cust=c||null;A.modal({title:"New account",body:`<!-- ids: SYST-059 --><div class="grid g2"><div class="field"><label>Account *</label><input class="input" id="s24-na-n" value="${cust?E(cust.n.split(" ")[1])+" & Co":""}" placeholder="Company name"></div><div class="field"><label>Contact</label><input class="input" value="${cust?E(cust.n):""}"></div><div class="field"><label>Terms</label><select class="select"><option>Net 14</option><option>Net 30</option><option>Prepaid quarter</option></select></div><div class="field"><label>Customer ID</label><input class="input tnum" value="${cust?cust.id:""}" placeholder="from the customer card"></div><div class="field"><label>Settlement</label><select class="select"><option value="current">Current</option><option value="due">Due</option><option value="overdue">Overdue</option><option value="settled">Settled</option><option value="not_applicable">Not applicable</option></select></div><div class="field"><label>Settlement due</label><input class="input" type="date"></div></div><div class="err" id="s24-na-err"></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="S24.saveAccount(${cust?cust.id:0})">Save account</button>`})}
function saveAccount(custId){const n=$("#s24-na-n").value.trim();if(!n){$("#s24-na-err").textContent="Account name is required";return}const a={id:Date.now(),name:n,contact:custId?A.customer(custId).n:"",terms:"Net 30",settle:"current",due:null,active:true,customer:custId||0};B2B.accounts.push(a);A.closeModal();mountB2b();tt("Account created · audit b2b_account.create");if(custId)setTimeout(()=>newSchedule(a.id,{weekday:1,amount:65}),400)}
function account(id){const a=acc(id);A.sheet({eyebrow:"B2B account",title:E(a.name),body:`<dl class="kv"><dt>Contact</dt><dd>${E(a.contact)}</dd><dt>Terms</dt><dd>${E(a.terms)}</dd><dt>Settlement</dt><dd>${a.settle}${a.due?" · due "+A.fmtDate(a.due):""}</dd><dt>Customer</dt><dd>${a.customer?`<button class="link" onclick="App.openCustomer(${a.customer})">#${a.customer}</button>`:"–"}</dd><dt>Schedules</dt><dd>${B2B.schedules.filter(s=>s.acc===id).length}</dd><dt>Invoices</dt><dd>${B2B.invoices.filter(v=>v.acc===id).length}</dd></dl><div class="note-box mt16">Editing and disabling an account is new in this design – the live CRM only creates accounts.</div>`,foot:`<button class="btn --ghost --sm" onclick="App.closeSheet();S24.newSchedule(${id})">New schedule</button><span class="sp"></span><button class="btn --sm" onclick="App.closeSheet();App.toast('Account saved')">Save</button>`})}
function accToggle(id){const a=acc(id);a.active=!a.active;mountB2b();tt(a.name+" · "+(a.active?"enabled":"disabled"))}
function newSchedule(accId,pre={}){if(!B2B.accounts.length){tt("Create an account first");return}const a=acc(accId)||B2B.accounts[0];
  A.modal({title:"New schedule",wide:true,body:`<!-- ids: SYST-061 --><div class="grid g2">
   <div class="field"><label>Account</label><select class="select" id="s24-ns-acc" onchange="S24.schedAddr(this.value)">${B2B.accounts.map(x=>`<option value="${x.id}" ${x.id===a.id?"selected":""}>${E(x.name)}</option>`).join("")}</select></div>
   <div class="field"><label>Name *</label><input class="input" id="s24-ns-name" placeholder="e.g. Monday reception"></div>
   <div class="field"><label>Weekday</label><select class="select">${DOW.slice(1).concat(DOW[0]).map((d,i)=>`<option ${((i+1)%7)===(pre.weekday??1)?"selected":""}>${d}</option>`).join("")}</select></div>
   <div class="field"><label>Every N weeks</label><select class="select"><option>1</option><option>2</option><option>4</option></select></div>
   <div class="field"><label>Create (days before)</label><input class="input tnum" type="number" min="0" max="14" value="1"></div>
   <div class="field"><label>Delivery address</label><select class="select" id="s24-ns-addr">${a.customer?`<option>${E(A.customer(a.customer)?.addr||"Main address")}</option>`:`<option>No addresses – add one in the customer card first</option>`}</select></div>
   <div class="field"><label>Window</label><select class="select" onchange="S24.schedWin(this.value)"><option value="none">no window</option><option value="between">between</option><option value="before">before</option><option value="after">after</option></select></div>
   <div class="row" style="gap:8px"><div class="field"><label>From</label><input class="input" type="time" id="s24-ns-from" disabled></div><div class="field"><label>To</label><input class="input" type="time" id="s24-ns-to" disabled></div></div>
   <div class="field"><label>Amount per change £ *</label><input class="input tnum" type="number" id="s24-ns-amt" value="${pre.amount||""}" placeholder="65"></div>
   <div class="field"><label>First delivery not before</label><input class="input" type="date"></div>
   <div class="field" style="grid-column:1/-1"><label>What we deliver</label><input class="input" placeholder="Seasonal desk arrangement"></div>
   <div class="field"><label>Order note</label><input class="input" placeholder="for the florist"></div><div class="field"><label>For the courier</label><input class="input" placeholder="Reception desk, ask for …"></div>
  </div><div class="err" id="s24-ns-err"></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="S24.saveSchedule()">Save schedule</button>`})}
function schedAddr(v){const a=acc(+v);$("#s24-ns-addr").innerHTML=a.customer?`<option>${E(A.customer(a.customer)?.addr||"Main address")}</option>`:`<option>No addresses – add one in the customer card first</option>`}
function schedWin(v){$("#s24-ns-from").disabled=!(v==="between"||v==="after");$("#s24-ns-to").disabled=!(v==="between"||v==="before")}
function saveSchedule(){const n=$("#s24-ns-name").value.trim(),amt=+$("#s24-ns-amt").value;if(!n||!amt){$("#s24-ns-err").textContent="Name and amount are required";return}const a=acc(+$("#s24-ns-acc").value);
  B2B.schedules.push({id:Date.now(),acc:a.id,name:n,weekday:1,every:1,lead:1,addr:a.customer?A.customer(a.customer).addr:"",win:"none",from:"",to:"",amount:amt,what:"",note:"",courier:"",next:A.T(9,0,6),last:"",active:true,paused:null});A.closeModal();mountB2b();tt("Schedule saved · next run "+A.fmtDate(A.T(9,0,6)))}
const sch=id=>B2B.schedules.find(s=>s.id===id);
function skip(id){const s=sch(id);A.confirm("Skip the delivery on "+A.fmtDate(s.next)+"?","The one after stays on schedule.","Skip",()=>{const d=new Date(s.next);d.setDate(d.getDate()+7*s.every);s.next=d.toISOString();mountB2b();tt("Skipped · next "+A.fmtDate(s.next))})}
function pause(id){const s=sch(id);A.modal({title:"Pause «"+E(s.name)+"»",body:`<div class="field"><label>Pause until</label><input class="input" type="date" id="s24-pause" value="${s.next?s.next.slice(0,10):""}"></div><div class="err" id="s24-pause-err"></div><div class="xs muted mt8">No orders are created until this date; the schedule resumes by itself.</div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="S24.pauseSave(${id})">Pause</button>`})}
function pauseSave(id){const v=$("#s24-pause").value;if(!v){$("#s24-pause-err").textContent="Pick a date – the server rejects an empty paused_until";return}if(new Date(v)<=A.NOW){$("#s24-pause-err").textContent="The date must be in the future";return}sch(id).paused=new Date(v).toISOString();A.closeModal();mountB2b();tt("Standing order paused until "+A.fmtDate(v))}
function resume(id){sch(id).paused=null;mountB2b();tt("Standing order resumed")}
function schedToggle(id){const s=sch(id);if(s.active){A.confirm("Switch off «"+E(s.name)+"»?","No more orders are created. Orders already created stay.","Switch off",()=>{s.active=false;mountB2b();tt("Standing order switched off")})}else{s.active=true;s.next=A.T(9,0,6);mountB2b();tt("Standing order switched on")}}
function schedDelete(id){const s=sch(id);A.confirm("Remove the schedule «"+E(s.name)+"»?","Orders already created stay.","Remove",()=>{B2B.schedules=B2B.schedules.filter(x=>x.id!==id);mountB2b();tt("Schedule removed")},{danger:true})}
function draftInvoice(){if(!S.flagInvoices||!B2B.accounts.length)return;A.modal({title:"Draft next quarter",body:`<!-- ids: SYST-069 --><div class="grid g2"><div class="field" style="grid-column:1/-1"><label>Account</label><select class="select" id="s24-di-acc">${B2B.accounts.map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join("")}</select></div><div class="field"><label>Period from *</label><input class="input" type="date" id="s24-di-from" oninput="document.getElementById('s24-di-btn').classList.toggle('is-disabled',!this.value)"></div><div class="field"><label>Weeks</label><input class="input tnum" type="number" min="4" max="26" value="13"></div><div class="field"><label>Prepayment discount, %</label><input class="input tnum" type="number" min="0" max="50" value="10"></div></div><div class="xs muted mt8">Lines come from the account's active schedules in the period.</div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm is-disabled" id="s24-di-btn" onclick="S24.saveInvoice()">Save</button>`})}
function saveInvoice(){const a=acc(+$("#s24-di-acc").value);const from=$("#s24-di-from").value;const lines=B2B.schedules.filter(s=>s.acc===a.id&&s.active).length*13;if(!lines){A.closeModal();tt(a.name+": no standing orders in the period");return}const no="B2B-2026-00"+(22+B2B.invoices.length);B2B.invoices.unshift({id:Date.now(),no,acc:a.id,from:new Date(from).toISOString(),weeks:13,disc:10,lines,gross:lines*65,status:"draft",at:null,ref:""});A.closeModal();mountB2b();tt("Invoice "+no+" drafted")}
const inv=id=>B2B.invoices.find(v=>v.id===id);
function invAction(id,act){const v=inv(id);if(act==="send"){v.status="sent";v.at=A.NOW.toISOString();tt("Invoice "+v.no+": marked sent – the email is not sent automatically")}else if(act==="reopen"){v.status="draft";v.at=null;v.ref="";tt("Invoice "+v.no+": back to draft")}mountB2b()}
function printInv(id){const v=inv(id);A.modal({title:"Print · "+v.no,wide:true,body:`<div class="card" style="font-family:var(--f-display)"><div class="h2">Floritta</div><div class="sm" style="font-family:var(--f-body)">80 Willow Walk, Bermondsey SE1 5SY</div><div class="hr"></div><div class="h3">Invoice ${v.no} · ${E(acc(v.acc).name)}</div><div class="sm mt8" style="font-family:var(--f-body)">${v.lines} deliveries · ${A.fmt(v.gross)} − ${v.disc} % = <b>${A.fmt(Math.round(v.gross*(100-v.disc)/100))}</b></div></div><div class="xs muted mt8">Opens in a new tab for the browser's Print → PDF.</div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Close</button><button class="btn --sm" onclick="App.closeModal();App.toast('Sent to printer')">${I("printer")} Print</button>`})}
function markPaid(id){const v=inv(id);A.modal({title:"Mark "+v.no+" as paid",body:`<div class="sm soft mb16">A paid invoice covers its period – orders in those weeks are created already paid.</div><div class="field"><label>Payment reference</label><input class="input" id="s24-ref" placeholder="BACS, number – may be empty"></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="S24.paidSave(${id})">Mark paid</button>`})}
function paidSave(id){const v=inv(id);v.status="paid";v.at=A.NOW.toISOString();v.ref=$("#s24-ref").value.trim();A.closeModal();mountB2b();tt("Invoice "+v.no+": paid"+(v.ref?" · "+v.ref:""))}
function cancelInv(id){const v=inv(id);A.confirm("Cancel invoice "+v.no+"?","The account is not notified. You can bring it back to draft later.","Cancel invoice",()=>{v.status="cancelled";v.at=A.NOW.toISOString();mountB2b();tt("Invoice "+v.no+": cancelled")},{danger:true})}
/* ======================= ASK CRM ======================= */
function mountAsk(){
  $("#s24-ask-head").innerHTML=`<span class="sm soft">Ask in plain words – the CRM writes a read-only query and answers with a table.</span><span class="sp"></span><span class="flag">ASK_CRM_ENABLED ${sw(S.askEnabled,"S24.S.askEnabled=!S24.S.askEnabled;S24.S.askResult=null;S24.S.askErr=null;S24.mountAsk()")}</span>`;
  if(!S.askEnabled){$("#s24-ask-body").innerHTML=`<!-- ids: SYST-077 --><div class="empty">${I("sparkle")}<div class="h3">Ask the CRM is not enabled on this server yet.</div><div class="sm">Set ASK_CRM_ENABLED and the Anthropic key for Ask CRM in the server environment.</div><button class="btn --ghost --sm" onclick="App.go('system-integrations')">Open Integrations</button></div>`;return}
  const r=S.askResult;
  $("#s24-ask-body").innerHTML=`<div class="ask-wrap">
   <!-- ids: SYST-078 -->
   <div class="ask-in"><input class="input" id="s24-ask-q" value="${E(S.askQ)}" placeholder="e.g. unpaid orders over £100" maxlength="500" onkeydown="if(event.key==='Enter')S24.ask()" ${S.askLoading?"disabled":""}><button class="btn ${S.askLoading?"is-disabled":""}" onclick="S24.ask()">${S.askLoading?"Looking through your data…":"Ask"}</button></div>
   <div class="row mt8" style="justify-content:space-between"><span class="xs muted" id="s24-ask-cnt">${S.askQ.length} / 500 · 3 to 500 characters · 20 questions a minute</span><span class="xs muted">Read-only · allowed tables only · every question and query is logged</span></div>
   <!-- ids: SYST-079 -->
   <div class="chips mt16">${ASK.map((x,i)=>`<button class="chip ${S.askLoading?"is-disabled":""}" onclick="S24.askTry(${i})">${I("sparkle")} ${E(x.q)}</button>`).join("")}</div>
   <!-- ids: SYST-085 SYST-181 -->
   ${S.askErr?`<div class="forbid mt24">${I("alert")}<div><b>${E(S.askErr.t)}</b><div class="sm">${E(S.askErr.d)}</div></div></div>`:""}
   <!-- ids: SYST-080 -->
   ${S.askLoading?`<div class="card mt24"><div class="skel --w"></div><div class="skel"></div><div class="skel"></div><div class="skel --w"></div></div>`:""}
   ${r?`<!-- ids: SYST-081 --><div class="card mt24"><span class="caps">Answer</span><div class="ask-ans">${E(r.ans)}</div></div>
   <!-- ids: SYST-082 SYST-083 SYST-084 -->
   <div class="panel mt16"><div class="p-head"><div class="h4">${E(r.q)}</div><span class="xs muted">${r.rows.length} rows</span><button class="textbtn" onclick="S24.S.askSql=!S24.S.askSql;S24.mountAsk()">${S.askSql?"Hide query":"Show query"}</button></div>
   ${S.askSql?`<pre class="sql">${E(r.sql)}</pre>`:""}
   ${r.rows.length?`<div class="tbl-wrap --flush"><table class="tbl"><thead><tr>${r.cols.map(c=>`<th>${c.replace(/_/g," ")}</th>`).join("")}</tr></thead><tbody>${r.rows.map(row=>`<tr>${row.map(v=>`<td class="${typeof v==="number"?"num":""}">${v===true?"✓":v===false?"–":v===null||v===""?"–":E(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:`<div class="empty"><div class="sm">No rows matched.</div></div>`}
   ${r.trunc?`<div class="xs muted" style="padding:8px 14px">Showing the first rows only – narrow the question for more.</div>`:""}</div>`:""}
  </div>`;
  const inp=$("#s24-ask-q");if(inp)inp.oninput=()=>{S.askQ=inp.value;$("#s24-ask-cnt").textContent=inp.value.length+" / 500 · 3 to 500 characters · 20 questions a minute"};
}
function askTry(i){S.askQ=ASK[i].q;ask()}
function ask(){if(S.askLoading)return;const q=S.askQ.trim();S.askErr=null;S.askResult=null;S.askSql=false;
  if(q.length<3){S.askErr={t:"The question is too short.",d:"Write at least 3 characters."};mountAsk();return}
  if(q.length>500){S.askErr={t:"The question is too long.",d:"Keep it under 500 characters."};mountAsk();return}
  S.askLoading=true;mountAsk();
  setTimeout(()=>{S.askLoading=false;const hit=ASK.find(x=>q.toLowerCase().includes(x.q.split(" ")[0])||x.q.includes(q.toLowerCase()));
    if(/delete|drop|update|password|token/i.test(q)){S.askErr={t:"I can't answer that.",d:"Ask the CRM only reads orders, customers, products, deliveries and payments. Passwords, tokens and writes are off limits."}}
    else if(/staff|salary|wage|users/i.test(q)){S.askErr={t:"That table is not available.",d:"Staff and payroll data are not exposed to Ask the CRM."}}
    else if(hit){S.askResult={q:hit.q,ans:hit.ans,cols:hit.cols,rows:hit.rows(),sql:hit.sql,trunc:hit.trunc}}
    else{S.askResult={q,ans:"I looked through orders for «"+q+"» and found nothing matching in the last 90 days.",cols:["order","customer","total"],rows:[],sql:"SELECT o.id AS \"order\", c.name AS customer, o.total FROM orders o JOIN customers c ON c.id=o.customer_id WHERE o.placed_at >= NOW() - INTERVAL '90 days' AND … LIMIT 50;",trunc:false}}
    mountAsk()},900)}
/* ---------- commands & mounts ---------- */
A.registerCommands([{g:"Go to",t:"System · Settings",ic:"settings",fn:()=>A.go("system-settings")},{g:"Go to",t:"System · Team",ic:"user",fn:()=>A.go("system-users")},{g:"Go to",t:"System · Integrations",ic:"zap",fn:()=>A.go("system-integrations")},{g:"Go to",t:"System · Audit log",ic:"list",fn:()=>A.go("system-logs")},{g:"Actions",t:"Ask the CRM",ic:"sparkle",fn:()=>A.go("ask-crm")},{g:"Actions",t:"Add staff",ic:"plus",fn:()=>{A.go("system-users");setTimeout(addStaff,200)}}]);
window.S24={S,SET,user,nav,set,save,mountSettings,mountTeam,filterTeam,role,field,tg,tgClear,toggleActive,flag,perms,avatar,pickPhoto,removePhoto,setPin,savePin,clearPin,resetPw,savePw,addStaff,saveStaff,member,permSet,mountInt,aiDemo,aiSave,testGw,mountApi,newClient,saveClient,revoke,mountLogs,logsTab,logsPage,logRow,mountBackup,backupNow,mountIE,exportAll,exportOne,importOne,dryRun,mountB2b,b2bPrefill,newAccount,saveAccount,account,accToggle,newSchedule,schedAddr,schedWin,saveSchedule,skip,pause,pauseSave,resume,schedToggle,schedDelete,draftInvoice,saveInvoice,invAction,printInv,markPaid,paidSave,cancelInv,mountAsk,askTry,ask};
window.mount_system_settings=mountSettings;window.mount_system_users=mountTeam;window.mount_system_integrations=mountInt;window.mount_system_api=mountApi;window.mount_system_logs=mountLogs;window.mount_system_backup=mountBackup;window.mount_system_import_export=mountIE;window.mount_system_b2b=mountB2b;window.mount_ask_crm=mountAsk;
})();
</script>
