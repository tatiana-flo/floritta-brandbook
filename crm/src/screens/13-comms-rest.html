const T13=(()=>{

  const canApprove=()=>App.role()==="owner"||T13S.approve;
  const TABS=[
    {k:"inbox",t:"Inbox",go:"inbox",cnt:()=>App.data.convos.filter(c=>c.unread).length},
    {k:"scripts",t:"Scripts",go:"comms-scripts"},
    {k:"facts",t:"Flora facts",go:"flora-facts",cnt:()=>T13_FACTS.filter(f=>f.status==="proposed").length},
    {k:"autonomy",t:"Flora autonomy",go:"flora-autonomy",cond:canApprove,lock:true},
    {k:"review",t:"Facts review",go:"facts-review"},
    {k:"customers",t:"Customers",go:"customers"},

    {k:"occasions",t:"Occasions",go:"occasions",cnt:()=>T13S.occCandidates?T13_CANDS.length:0},
    {k:"subscriptions",t:"Subscriptions",go:"subscriptions"},
    {k:"subscribers",t:"Subscribers",go:"subscribers"},
    {k:"images",t:"Images",go:"sub-images"},
    {k:"emailtemplates",t:"Email templates",go:"email-templates"},
    {k:"emailslog",t:"Email log",go:"emails-log"},
    {k:"broadcasts",t:"Broadcasts",go:"broadcasts"},
    {k:"forms",t:"Forms",go:"forms"},
    {k:"submissions",t:"Submissions",go:"forms",p:{tab:"submissions"}},
    {k:"feedback",t:"Feedback",go:"feedback"},
    {k:"nps",t:"NPS",go:"nps"}
  ];
  function nav(active,sub,actions,demo){
    const tabs=TABS.filter(t=>!t.cond||t.cond()).map(t=>`<button class="${t.k===active?"on":""}" onclick="T13.goTab('${t.k}')" title="${esc(t.t)}">${t.lock?ic("lock","lk"):""}${esc(t.t)}${t.cnt&&t.cnt()?`<span class="n">${t.cnt()}</span>`:""}</button>`).join("");
    return `<div class="c13-nav">${tabs}</div><div class="c13-bar"><div class="sub">${sub||""}</div><span class="sp"></span>${actions||""}${demo?`<button class="btn --ghost --sm" onclick="${demo}">${ic("columns")} Demo</button>`:""}</div>`;
  }
  function goTab(k){const t=TABS.find(x=>x.k===k);if(!t)return;App.go(t.go,t.p||{})}
  function reasonModal(o){ // o:{title,text,label,cta,danger,min,optional,fn,extra}
    App.modal({title:o.title,body:`${o.text?`<div class="sm soft mb16">${o.text}</div>`:""}${o.extra||""}<div class="field"><label>${o.label||"Reason"}${o.optional?" (optional)":""}</label><textarea class="textarea" id="t13-reason" placeholder="${o.ph||"Why – goes to the audit log"}" maxlength="${o.max||500}"></textarea><div class="hint">${o.optional?"Up to "+(o.max||500)+" characters":"Required · "+(o.min||3)+"–"+(o.max||500)+" characters"} · <span class="kbd">esc</span> closes without saving</div><div class="err" id="t13-reason-err"></div></div>`,
      foot:`<button class="btn --secondary --sm" onclick="T13.closeDirty()">Cancel</button><button class="btn --sm ${o.danger?"--accent":""}" onclick="T13._reasonGo()">${o.cta||"Save"}</button>`,onMount:b=>{setTimeout(()=>b.querySelector("#t13-reason")?.focus(),50)}});
    T13._reasonOpts=o;
  }
  function _reasonGo(){const o=T13._reasonOpts;const v=(document.getElementById("t13-reason")?.value||"").trim();if(!o.optional&&v.length<(o.min||3)){document.getElementById("t13-reason-err").textContent="Say why – at least "+(o.min||3)+" characters.";return}App.closeModal();o.fn(v)}
  function closeDirty(){const ta=document.querySelector("#m-box textarea, #m-box input.input");const dirty=[...document.querySelectorAll("#m-box textarea, #m-box input.input")].some(x=>x.value&&x.value.trim()&&!x.dataset.initial);if(dirty){App.confirm("Discard what you typed?","The text is not saved.","Discard",()=>App.closeModal(),{danger:true});return}App.closeModal()}
  const who=id=>id==="review"?"the weekly review":id==="comms:facts-guard"?"comms:facts-guard (night audit)":(App.user(id)?.n||id);
  const flash=(msg)=>App.toast(msg);
  return {nav,goTab,canApprove,reasonModal,_reasonGo,closeDirty,who,flash,TABS};
})();

const T13SC={
  re(){if(App.state.current==="comms-scripts")window.mount_comms_scripts(App.state.params)},
  toggle(id){T13S.openScript=T13S.openScript===id?null:id;this.re()},
  auto(id,v){T13S.dirty[id]=Object.assign({},T13S.dirty[id]||{},{auto:v});this.re()},
  variant(id,k,lang,v){const d=T13S.dirty[id]=T13S.dirty[id]||{};d.v=d.v||{};d.v[k]=d.v[k]||{};d.v[k][lang]=v;const b=document.getElementById("sc-unsaved-"+id);if(b)b.style.display=""},
  save(id){const s=T13_SCRIPTS.find(x=>x.id===id);const d=T13S.dirty[id]||{};if(d.auto!==undefined)s.auto=d.auto;if(d.v)s.variants.forEach(v=>{if(d.v[v.k])Object.assign(v,d.v[v.k])});if(!s.variants.some(v=>(v.en||"").trim())){App.toast("At least one variant needs a text");return}delete T13S.dirty[id];T13S.saved[id]=true;this.re();App.toast("Script saved · audit comms.script.update"+(s.auto?" · auto-send ON – the engine may send it to customers":""));setTimeout(()=>{delete T13S.saved[id];this.re()},2500)},
  demo(ev){App.pop(ev,["Demo data",{t:(T13S.scriptsEmpty?"":"· ")+"5 scripts",ic:"list",fn:()=>{T13S.scriptsEmpty=false;this.re()}},{t:(T13S.scriptsEmpty?"· ":"")+"No scripts yet",ic:"moon",fn:()=>{T13S.scriptsEmpty=true;this.re()}}])}
};
window.mount_comms_scripts=function(){
  const esc=App.esc,ic=App.icon;
  document.getElementById("c13-scripts-head").innerHTML=T13.nav("scripts",`<b>${T13_SCRIPTS.length}</b> message scripts · Tati persona · <span class="hint">global auto-send is <b>on</b> in Settings</span>`,"","T13SC.demo(event)");
  let h=`<div class="c13-intro">${ic("info")}<div>Scripts are the messages Flora and the team send at fixed moments. Edit each language separately – Ukrainian falls back to Russian when empty. <b>Auto-send</b> lets the engine send that script to customers by itself; saving a script never sends anything.</div></div>`;
  if(T13S.scriptsEmpty){h+=`<div class="empty">${ic("chat")}<div class="h3">No scripts yet.</div><div class="sm">Scripts are seeded by the server on first use.</div><button class="btn --sm" onclick="T13S.scriptsEmpty=false;T13SC.re()">Load defaults</button></div>`}
  else h+=T13_SCRIPTS.map(s=>{const d=T13S.dirty[s.id]||{};const auto=d.auto!==undefined?d.auto:s.auto;const open=T13S.openScript===s.id;const unsaved=d.auto!==undefined&&d.auto!==s.auto;
    return `<div class="sc-card"><div class="sc-head" onclick="T13SC.toggle(${s.id})"><span class="ib">${ic(open?"down":"chev")}</span><div class="t"><b>${esc(s.name)}</b><small>${esc(s.trigger)}</small></div>${unsaved?`<span class="tag --line" title="Changed, not saved – open the card and press Save">Unsaved</span>`:""}<span class="pill ${auto?"--paid":"--queue"} --plain">Auto ${auto?"ON":"OFF"}</span><label class="check" onclick="event.stopPropagation()"><input type="checkbox" ${auto?"checked":""} onchange="T13SC.auto(${s.id},this.checked)"><span class="sm">Auto-send</span></label></div>
    ${open?`<div class="sc-body">${s.ph.length?`<div class="caps mb8">Placeholders</div><div class="ph">${s.ph.map(p=>`<code>${esc(p)}</code>`).join("")}</div>`:""}
    ${s.guard.length?`<details><summary>What not to say</summary><ul>${s.guard.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></details>`:""}
    ${s.variants.map(v=>`<div class="sc-key"><span class="tag --ink">${esc(v.k)}</span><span class="sm soft">${esc(v.lbl)}</span></div><div class="sc-vars">${["en","ru","uk"].map(l=>`<div class="sc-var"><label class="lbl">${l==="en"?"English":l==="ru"?"Russian":"Ukrainian <span style='text-transform:none;letter-spacing:0'>(optional – falls back to Russian)</span>"}</label><textarea class="textarea" rows="4" oninput="T13SC.variant(${s.id},'${v.k}','${l}',this.value)">${esc((d.v?.[v.k]?.[l])??v[l])}</textarea></div>`).join("")}</div>`).join("")}
    <div class="row mt16"><span class="hint" id="sc-unsaved-${s.id}" style="display:${Object.keys(d).length?"":"none"}">Changes not saved yet</span><span class="sp"></span>${T13S.saved[s.id]?`<span class="ok sm">${ic("check")} Saved</span>`:""}<button class="btn --sm" onclick="T13SC.save(${s.id})">Save</button></div></div>`:""}</div>`}).join("");
  document.getElementById("c13-scripts-body").innerHTML=h;
};

/* ===== Flora facts ===== */
const T13F={
  REQ:2,
  re(){if(App.state.current==="flora-facts")window.mount_flora_facts(App.state.params)},
  status(s){T13S.fStatus=s;T13S.fPage=1;this.re()},topic(t){T13S.fTopic=t;T13S.fPage=1;this.re()},
  search(){T13S.fQ=(document.getElementById("ff-q")?.value||"").slice(0,100);T13S.fPage=1;this.re()},
  page(d){T13S.fPage=Math.max(1,T13S.fPage+d);this.re()},
  propose(){T13S.proposing=!T13S.proposing;this.re()},
  fields(f,changed){f=f||{};return `<div class="grid g2"><div class="field"><label>Topic</label><select class="select" id="ff-topic">${T13_TOPICS_KB.map(t=>`<option ${(f.topic||"Other")===t?"selected":""}>${t}</option>`).join("")}</select></div><div></div></div>
    <div class="field mt8"><label>Customer question</label><input class="input" id="ff-q2" maxlength="500" placeholder="As a customer would ask it" value="${App.esc(f.q||"")}" oninput="T13F.check()"></div>
    <div class="field mt8"><label>Answer – English</label><textarea class="textarea" id="ff-en" maxlength="600" placeholder="Required · up to 600 characters (comms.agent.reply_max_chars)" oninput="T13F.check()">${App.esc(f.en||"")}</textarea></div>
    <div class="grid g2 mt8"><div class="field"><label>Answer – Russian</label><textarea class="textarea" id="ff-ru">${App.esc(f.ru||"")}</textarea></div><div class="field"><label>Answer – Ukrainian</label><textarea class="textarea" id="ff-uk">${App.esc(f.uk||"")}</textarea></div></div>
    ${changed?`<div class="field mt8"><label>What changed (optional)</label><input class="input" id="ff-changed" placeholder="One line for the history"></div>`:""}<div class="err" id="ff-err"></div>`},
  check(){const ok=(document.getElementById("ff-q2")?.value||"").trim()&&(document.getElementById("ff-en")?.value||"").trim();const b=document.getElementById("ff-propose");if(b)b.classList.toggle("is-disabled",!ok)},
  read(){const g=id=>(document.getElementById(id)?.value||"").trim();return {topic:g("ff-topic"),q:g("ff-q2"),en:g("ff-en"),ru:g("ff-ru"),uk:g("ff-uk"),changed:g("ff-changed")}},
  submit(){const v=this.read();if(!v.q||!v.en){document.getElementById("ff-err").textContent="A fact needs a question and an answer.";return}const id=Math.max(...T13_FACTS.map(f=>f.id))+1;T13_FACTS.unshift({id,topic:v.topic,q:v.q,en:v.en,ru:v.ru,uk:v.uk,status:"proposed",src:"team",by:App.me().id,at:"Today "+App.fmtTime(App.NOW.toISOString()),confirms:[],used:0,since:null,hist:[["Today "+App.fmtTime(App.NOW.toISOString()),App.me().id,"proposed",""]]});T13S.proposing=false;T13S.fStatus="proposed";this.re();App.toast("Fact proposed – it reaches customers after "+this.REQ+" confirmations")},
  canConfirm(f){const me=App.me().id;if(f.status!=="proposed"||!f.en)return {ok:false,hint:""};if(f.by===me)return {ok:false,hint:"You wrote this fact – a teammate has to confirm it"};if(f.confirms.includes(me))return {ok:false,hint:"You have already confirmed it"};return {ok:true,hint:""}},
  confirm(id){const f=T13_FACTS.find(x=>x.id===id);const me=App.me().id;const c=this.canConfirm(f);if(!c.ok){App.toast(c.hint||"Cannot confirm");return}f.confirms.push(me);f.hist.push(["Today "+App.fmtTime(App.NOW.toISOString()),me,"confirmed",""]);if(T13.canApprove()||f.confirms.length>=this.REQ){f.status="confirmed";f.since="Today";App.toast("Confirmed – Flora now gives this answer to customers")}else App.toast(`Confirmed · ${f.confirms.length}/${this.REQ} – one more teammate needed`);this.re()},
  dispute(id){const f=T13_FACTS.find(x=>x.id===id);T13.reasonModal({title:"What is wrong with this fact?",text:`“${App.esc(f.q)}” goes back to review: confirmations start from zero and Flora stops using it.`,ph:"Say what is wrong with this fact",max:1000,cta:"Send back for review",danger:true,fn:r=>{f.status="proposed";f.confirms=[];f.since=null;f.hist.push(["Today "+App.fmtTime(App.NOW.toISOString()),App.me().id,"disputed",r]);this.re();App.toast("Sent back for review · audit comms.facts.dispute")}})},
  edit(id){const f=T13_FACTS.find(x=>x.id===id);App.modal({title:"Edit fact",wide:true,body:`<div class="note-box mb16">Editing resets confirmations – the fact goes back to <b>proposed</b> and you become its author.</div>${this.fields(f,true)}`,foot:`<button class="btn --secondary --sm" onclick="T13.closeDirty()">Cancel</button><button class="btn --sm" onclick="T13F.saveEdit(${id})">Save</button>`})},
  saveEdit(id){const f=T13_FACTS.find(x=>x.id===id);const v=this.read();if(!v.q||!v.en&&!v.ru){document.getElementById("ff-err").textContent="A fact needs a question and an answer.";return}if(v.q===f.q&&v.en===f.en&&v.ru===f.ru&&v.uk===f.uk&&v.topic===f.topic){App.closeModal();App.toast("Nothing changed");return}Object.assign(f,{topic:v.topic,q:v.q,en:v.en,ru:v.ru,uk:v.uk,status:"proposed",confirms:[],since:null,by:App.me().id});f.hist.push(["Today "+App.fmtTime(App.NOW.toISOString()),App.me().id,"edited",v.changed]);App.closeModal();this.re();App.toast("Saved · back to proposed · audit comms.facts.edit")},
  retire(id){const f=T13_FACTS.find(x=>x.id===id);if(!T13.canApprove()){App.toast("403 · comms.facts.approve needed");return}T13.reasonModal({title:"Retire this fact?",text:"Retired facts never come back – Flora stops using it for good.",optional:true,max:500,cta:"Retire",danger:true,fn:r=>{f.status="retired";f.retired=[App.me().id,"Today "+App.fmtTime(App.NOW.toISOString()),r];f.hist.push(["Today "+App.fmtTime(App.NOW.toISOString()),App.me().id,"retired",r]);this.re();App.toast("Retired · audit comms.facts.retire")}})},
  hist(id){T13S.hist[id]=!T13S.hist[id];this.re()},
  how(){App.modal({title:"How Flora facts work",body:`<ol style="padding-left:18px;margin:0;line-height:1.6"><li>Anyone proposes a fact – a question as a customer would ask it and an English answer.</li><li>Two different people confirm it (or one holder of <code>comms.facts.approve</code>).</li><li>From then on Flora may give this answer to customers; you see «Handed to Flora N×».</li><li>Dispute or Edit sends it back to proposed; Retire removes it for good.</li></ol>`})}
};
window.mount_flora_facts=function(p){
  const esc=App.esc,ic=App.icon,mgr=App.isMgr();
  const counts={active:T13_FACTS.filter(f=>f.status!=="retired").length,proposed:T13_FACTS.filter(f=>f.status==="proposed").length,confirmed:T13_FACTS.filter(f=>f.status==="confirmed").length,retired:T13_FACTS.filter(f=>f.status==="retired").length};
  const q=T13S.fQ.toLowerCase();
  let list=T13_FACTS.filter(f=>T13S.fStatus==="active"?f.status!=="retired":f.status===T13S.fStatus).filter(f=>!T13S.fTopic||f.topic===T13S.fTopic).filter(f=>!q||[f.q,f.en,f.ru,f.uk].join(" ").toLowerCase().includes(q));
  const PER=30,pages=Math.max(1,Math.ceil(list.length/PER));if(T13S.fPage>pages)T13S.fPage=pages;list=list.slice((T13S.fPage-1)*PER,T13S.fPage*PER);
  const sub=`Facts reach customers only after <b>${T13F.REQ} confirmations</b> by different people. <button class="textbtn" onclick="T13F.how()">How it works</button>`;
  const actions=`<button class="btn --sm ${T13S.proposing?"--secondary":""}" aria-expanded="${T13S.proposing}" onclick="T13F.propose()">${ic(T13S.proposing?"close":"plus")} Propose a fact</button>`;
  document.getElementById("c13-facts-head").innerHTML=mgr?T13.nav("facts",sub,actions):`<div class="c13-bar"><div class="sub">${sub}</div><span class="sp"></span>${actions}</div>`;
  let h=`<div class="toolbar"><div class="seg-ctl">${[["active","Active",counts.active],["proposed","Waiting for confirmation",counts.proposed],["confirmed","Confirmed",counts.confirmed],["retired","Retired",counts.retired]].map(s=>`<button class="${T13S.fStatus===s[0]?"on":""}" onclick="T13F.status('${s[0]}')">${s[1]} <span class="n">${s[2]}</span></button>`).join("")}</div>
    <select class="select" style="width:170px" onchange="T13F.topic(this.value)"><option value="">All topics</option>${T13_TOPICS_KB.map(t=>`<option ${T13S.fTopic===t?"selected":""}>${t}</option>`).join("")}</select>
    <div class="search">${ic("search")}<input id="ff-q" placeholder="Question or answer" maxlength="100" value="${esc(T13S.fQ)}" onkeydown="if(event.key==='Enter')T13F.search()"></div><button class="btn --ghost --sm" onclick="T13F.search()">Search</button><span class="hint"><span class="kbd">↵</span> searches question and all three answers</span></div>`;
  if(T13S.proposing)h+=`<div class="card mb16"><div class="h3 mb16">New fact</div>${T13F.fields({})}<div class="row mt16"><span class="hint">Proposed facts are audited (comms.facts.propose) · 30 per minute</span><span class="sp"></span><button class="btn --secondary --sm" onclick="T13F.propose()">Cancel</button><button class="btn --sm is-disabled" id="ff-propose" onclick="T13F.submit()">Propose</button></div></div>`;
  if(!list.length)h+=`<div class="empty">${ic("book")}<div class="h3">${counts.active+counts.retired===0?"No facts yet – propose the first one.":"No facts match these filters."}</div>${counts.active+counts.retired?`<button class="btn --ghost --sm" onclick="T13S.fTopic='';T13S.fQ='';T13S.fStatus='active';T13F.re()">Clear filters</button>`:""}</div>`;
  else h+=list.map(f=>{const ret=f.status==="retired";const c=T13F.canConfirm(f);const needsEn=!f.en;
    const src=f.src==="inbox"?"From the inbox":f.src==="review"?"Weekly review":"";
    return `<div class="fact ${ret?"--retired":""}"><div class="f-head">${App.pill(f.status==="proposed"?"review":f.status==="confirmed"?"done":"cancelled",f.status==="proposed"?"Waiting for confirmation":f.status==="confirmed"?"Confirmed":"Retired")}<span class="tag">${esc(f.topic)}</span>${src?`<span class="tag --line">${src}</span>`:""}${ret?"":`<span class="conf" title="Confirmations">${Array.from({length:T13F.REQ},(_,i)=>`<i class="${i<f.confirms.length?"on":""}"></i>`).join("")} ${f.confirms.length}/${T13F.REQ}</span>`}<span class="id">#${f.id}</span></div>
    <div class="f-q">${esc(f.q)}</div><div class="f-a">${[["en","EN"],["ru","RU"],["uk","UK"]].filter(l=>f[l[0]]).map(l=>`<b>${l[1]}</b><span>${esc(f[l[0]])}</span>`).join("")}</div>
    ${needsEn&&!ret?`<div class="note-box --warn mt8">${ic("alert")} No English answer yet – add it (Edit) before this fact can be confirmed.</div>`:""}
    <div class="f-stamp">Proposed by ${f.by?esc(T13.who(f.by)):"the weekly review"}, ${esc(f.at)}${f.confirms.length?` · Confirmed by ${f.confirms.map(x=>esc(T13.who(x))).join(", ")}`:""}${f.since?` · In use since ${esc(f.since)}`:""}${f.retired?` · Retired by ${esc(T13.who(f.retired[0]))}, ${esc(f.retired[1])}`:""}${f.used?` · Handed to Flora ${f.used}×`:""}</div>

  confirm(id){const i=T13_CANDS.findIndex(x=>x.id===id);const c=T13_CANDS.splice(i,1)[0];const d=new Date(c.date);T13_REMINDERS.push({id:Date.now(),cust:c.cust,occ:c.occ,date:c.date,note:"from "+c.src,days:Math.round((d-App.NOW)/864e5)});T13_REMINDERS.sort((a,b)=>a.days-b.days);this.re();App.toast("Confirmed – reminders may now go out · audit reminder.confirm")},
  dismiss(id){const i=T13_CANDS.findIndex(x=>x.id===id);const c=T13_CANDS.splice(i,1)[0];this.re();App.toast("Dismissed","Undo",()=>{T13_CANDS.splice(i,0,c);this.re()})},
  del(id){const i=T13_REMINDERS.findIndex(x=>x.id===id);const r=T13_REMINDERS.splice(i,1)[0];this.re();App.toast("Reminder deleted · audit reminder.delete","Undo",()=>{T13_REMINDERS.splice(i,0,r);this.re()})},
  demo(ev){App.pop(ev,["Demo data",{t:"Proposed candidates · "+(T13S.occCandidates?"3":"none"),ic:"sparkle",fn:()=>{T13S.occCandidates=!T13S.occCandidates;this.re()}},{t:"No reminders (empty state)",ic:"moon",fn:()=>{T13_REMINDERS.length=0;this.re()}}])}
};
window.mount_occasions=function(){
  const esc=App.esc,ic=App.icon;
  document.getElementById("c13-occ-head").innerHTML=T13.nav("occasions",`<b>${T13_REMINDERS.length}</b> confirmed reminders · WhatsApp 5 days before, with consent`,`<button class="btn --sm" onclick="T13O.add()">${ic("plus")} Add reminder</button>`,"T13O.demo(event)");
  const cands=T13S.occCandidates?T13_CANDS:[];
  let h="";
  if(cands.length)h+=`<div class="cand"><div class="p-head" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--hair)"><div class="h4">Proposed from past orders and email replies (${cands.length})</div><span class="hint">found by the Monday 07:30 cron, email replies and Flora – confirm before anything is sent</span></div><div class="list">${cands.map(c=>`<div class="li"><div class="t"><b>${esc(App.customer(c.cust).n)} · ${esc(c.occ)}</b><small>${esc(c.date)} · ${esc(c.src)}</small></div><button class="btn --ghost --sm" onclick="T13O.dismiss(${c.id})">Dismiss</button><button class="btn --sm" onclick="T13O.confirm(${c.id})">Confirm</button></div>`).join("")}</div></div>`;
  if(!T13_REMINDERS.length)h+=`<div class="empty">${ic("calendar")}<div class="h3">No reminders</div><button class="btn --sm" onclick="T13O.add()">Add reminder</button></div>`;
  else h+=`<div class="tbl-wrap"><table class="tbl --cards"><thead><tr><th>Customer</th><th>Occasion</th><th>Date</th><th>Note</th><th class="num">Days away</th><th></th></tr></thead><tbody>${T13_REMINDERS.map(r=>{const c=App.customer(r.cust);return `<tr class="r" onclick="App.openCustomer(${c.id})"><td>${esc(c.n)}<span class="sub">${esc(c.phone)}</span></td><td>${esc(r.occ)}</td><td>${esc(r.date)}</td><td class="wrap">${esc(r.note)||"<span class='muted'>–</span>"}</td><td class="num ${r.days<=14?"days-soon":""}">${r.days<0?r.days+" (past)":r.days}</td><td><span class="acts"><button class="ib" title="Delete" onclick="event.stopPropagation();T13O.del(${r.id})">${ic("trash")}</button></span></td></tr>`}).join("")}</tbody><tfoot><tr><td colspan="6">Past reminders stay in the list with negative days · Delete has no confirmation – Undo in the toast instead</td></tr></tfoot></table></div>`;
  document.getElementById("c13-occ-body").innerHTML=h;
};
</script>
