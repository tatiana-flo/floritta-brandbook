/* ---------- actions shared by the three screens ---------- */
window.S17X={

  heliumForm(){const h=I.helium;A.modal({title:"Helium price",body:`<div class="grid g2"><div class="field"><label>Helium price, £</label><input class="input" id="he-p" value="${h.price}"></div><div class="field"><label>Unit</label><select class="select" id="he-u" onchange="S17X.heUnit(this.value)"><option value="litre" selected>litre</option><option value="m3">cubic metre</option><option value="cuft">cubic foot</option></select></div><div class="field"><label>Markup on balloon</label><input class="input" id="he-mb" value="${h.markupBalloon}"></div><div class="field"><label>Markup on helium</label><input class="input" id="he-mh" value="${h.markupHelium}"></div><div class="field"><label>Gas lost, %</label><input class="input" id="he-l" value="${h.lost}"></div><div class="field"><label>Balloons spoiled, %</label><input class="input" id="he-s" value="${h.spoiled}"></div></div><p class="xs muted">Changing the unit converts the typed amount – it never reinterprets the number. Every balloon price with helium is recalculated on next open.</p>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="S17X.heSave()">Save</button>`})},
  heUnit(u){const p=$("#he-p");const cur=p.dataset.u||"litre";const toL={litre:1,m3:1/1000,cuft:1/28.317};const v=+p.value*toL[cur];p.value=(v/toL[u]).toPrecision(4);p.dataset.u=u},
  heSave(){const p=$("#he-p"),u=p.dataset.u||"litre";const toL={litre:1,m3:1/1000,cuft:1/28.317};const v=+p.value*toL[u];if(!(v>0)){A.toast("Save is disabled – check the values");return}Object.assign(I.helium,{price:v,markupBalloon:+$("#he-mb").value,markupHelium:+$("#he-mh").value,lost:+$("#he-l").value,spoiled:+$("#he-s").value,savedAt:A.NOW.toISOString()});A.closeModal();A.toast("Helium price saved · balloon prices recalculated");A.remount()},
  createItem(){const n=$("#ni-name").value.trim();if(!n){A.toast("Name (EN) is required");return}const it=Object.assign({},I.items[12],{id:420+I.items.length,name:n,ru:"",sku:"M-"+(400200+I.items.length),qty:0,reserved:0,min:0,fresh:null,shelf:null,counted:null,groupA:false,batches:[],movements:[],constructor:false,color:null,pack:1,packAsking:false,balloon:null,cat:"Vases"});I.items.push(it);S17.adding=false;A.toast("Item created · stock 0");A.go("inventory-item",{id:it.id})},

    if(kind==="builder"){ids.forEach(x=>I.item(x).constructor=v);A.toast(`${v?"Opened":"Closed"} ${ids.length} in the builder`)}

  editItem(id){const i=I.item(id),c=I.can();const isB=i.cat.includes("balloon");A.modal({title:"Edit item",wide:true,body:`<div class="form-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="field"><label>Name (EN) *</label><input class="input" id="ei-n" value="${esc(i.name)}"></div><div class="field"><label>Name (RU)</label><input class="input" value="${esc(i.ru)}"></div><div class="field"><label>Name on the site (EN) · ≤120</label><input class="input" value="${esc(i.displayName)}" maxlength="120"></div><div class="field"><label>Search keywords</label><input class="input" value="${esc(i.keywords)}" placeholder="RU / UA / KZ synonyms, jargon"></div><div class="field"><label>SKU *</label><input class="input" value="${i.sku}"></div><div class="field"><label>Category</label><select class="select"><option>${i.cat}</option><option>Roses</option><option>Greenery</option><option>Foil balloons</option><option>Latex balloons</option></select></div><div class="field"><label>Unit</label><input class="input" value="${i.unit}"></div><div class="field"><label>Min level</label><input class="input" value="${i.min}"></div>${c.cost?`<div class="field"><label>Purchase price, excluding VAT</label><input class="input" value="${i.cost}"></div>`:`<div class="field"><label>Purchase price</label><div class="role-note" style="height:36px">${ic("lock")} admin only – the server drops ‘cost’ from your request so it cannot zero the price</div></div>`}<div class="field"><label>Retail price (incl. VAT)</label><input class="input" id="ei-r" value="${i.retail}" placeholder="empty or 0 = no price → derived from cost"></div><div class="field"><label>Fresh until</label><input class="input" value="${i.fresh?I.fd(i.fresh):""}" placeholder="empty = none"></div><div class="field"><label>Stands, days (1–365)</label><input class="input" value="${i.shelf??""}" placeholder="empty = no shelf life (null, not 0)"></div>${I.demo.colors?`<div class="field"><label>Colour</label><select class="select"><option>Not classified</option>${I.COLORS.map(x=>`<option ${i.color===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div>`:""}<div class="field"><label>Sell by the stem in the builder</label><label class="check"><span class="switch ${i.constructor?"on":""}" onclick="this.classList.toggle('on')"></span> opens the item in the bouquet builder on the site</label></div>${isB?`<div class="field"><label>Inflated size, inches</label><input class="input" value="${i.balloon.size}"></div><div class="field"><label>Shape factor</label><input class="input" value="${i.balloon.shape}"></div><div class="field"><label>Balloons in the card</label><input class="input" value="${i.balloon.inCard}"></div><div class="field"><label>Helium litres (by hand)</label><input class="input" value="${i.balloon.litres}"></div><div class="field"><label>Estimate ±30 %</label><label class="check"><span class="switch ${i.balloon.estimate?"on":""}" onclick="this.classList.toggle('on')"></span> when the size is unknown</label></div>`:""}</div><p class="xs muted mt8">Retail price feeds the stem price in the site builder and order lines. SKU prefix filters the wholesale list and prints on labels. <span class="kbd">esc</span> closes.</p>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="(function(){const it=INV.item(${id});it.name=document.getElementById('ei-n').value||it.name;const r=document.getElementById('ei-r').value;it.retail=r&&+r>0?+r:Math.round(it.cost*3.2*100)/100;App.closeModal();App.toast('Item saved'+(r&&+r>0?'':' · retail price empty → derived from cost'));App.remount()})()">Save</button>`})},
  packModal(id){const i=I.item(id);A.modal({title:"Stems in one supplier pack",body:`<div class="field"><label>Stems (1–1000)</label><input class="input" id="pk" value="${i.pack||1}" oninput="S17X.packPrev(${id})"></div><div class="sm mt8" id="pk-prev"></div><p class="xs muted">The on-hand count and prices are converted to single stems; an adjustment is written to the movement log. Idempotent. <span class="kbd">esc</span> closes.</p>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="S17X.packSave(${id})">Save</button>`});S17X.packPrev(id)},

<script>
/* ===== 17 · Count today · Stocktakes · Group A · Suggestions · Movements ===== */
(()=>{
const A=App,I=INV,esc=A.esc,ic=A.icon,$=A.$;
const S=window.S17;S.gA=null;S.onlyDiff=false;S.stLines={};

/* ---------- COUNT TODAY ---------- */
window.mount_inventory_count=function(){
  const c=I.can();const g=I.demo.empty?[]:I.items.filter(i=>i.groupA);const done=g.filter(i=>i.counted&&I.days(i.counted.at)===0).length;

  I.body("inventory-count").innerHTML=!I.demo.groupA?`<!-- ids: INVT-099 -->${I.empty("lock","Group A is not saved yet – an admin marks it on Inventory → Group A.",`<button class="btn --sm" onclick="App.go('inventory-group-a')">Open Group A</button>`)}`:!g.length?I.empty("check","Nothing to count today – come back tomorrow"):`
  <!-- ids: INVT-100 INVT-101 INVT-102 INVT-103 INVT-104 INVT-324 -->
  <div class="card --pad0">${g.map(i=>{const today=i.counted&&I.days(i.counted.at)===0;const h=S.hints[i.id];return `<div class="count-row" data-id="${i.id}">

    <input class="input" placeholder="On shelf" inputmode="numeric" title="The system count is deliberately not shown – type what is on the shelf" value="${h&&h.val!=null?h.val:""}" oninput="S17.hints[${i.id}]=Object.assign(S17.hints[${i.id}]||{},{val:this.value});this.closest('.count-row').querySelector('.save').disabled=!this.value||INV.demo.busy">
    <button class="ib cam" title="From photo – rear camera on the phone; Claude estimates the stems" onclick="S17Y.photo(${i.id})">${ic("photo")}</button>
    <button class="btn --sm save" ${(!h||h.val==null||h.val==="")||I.demo.busy?"disabled":""} onclick="S17Y.count(${i.id})">${I.demo.busy?"Saving…":"Save"}</button>
    ${h&&h.text?`<div class="hint ${h.err?"accent":""}">${h.text}</div>`:""}</div>`}).join("")}</div>
  <p class="xs muted mt8">${I.roleNote("Saving one row locks Save on every row until the request returns ("+(I.demo.busy?"on":"off")+" in Demo state). The photo hint stays after saving.")}</p>`;
};
window.S17Y={
  count(id){const i=I.item(id);const v=+S.hints[id].val;const diff=v-i.qty;i.qty=v;i.counted={who:A.me().id,at:A.NOW.toISOString()};I.addMovement(i,"adjustment",0,"CycleCount","Cycle count");i.qty=v;S.hints[id].val="";A.toast(`Counted ${i.name}: ${v} (difference ${diff>=0?"+":""}${diff})`);A.remount()},
  photo(id){if(!I.demo.photoCount){S.hints[id]={text:"Could not read the photo – count by hand. (503 – photo counting is not configured)",err:true};A.remount();return}S.hints[id]={text:"Reading…"};A.remount();setTimeout(()=>{const i=I.item(id);const est=Math.max(0,i.qty+(id%3)-1);S.hints[id]={val:est,text:`From the photo – ${["sure","estimate","rough guess"][id%3]}: ${["stems clearly visible","bucket half hidden","stems overlap at the back"][id%3]}. Check it, then Save.`};A.remount()},900)}
};

/* ---------- STOCKTAKES LIST ---------- */
window.mount_inventory_stocktakes=function(){
  const c=I.can();const list=I.demo.empty?[]:I.stocktakes;
  /* ids: INVT-105 INVT-041 */
  I.head("inventory-stocktakes","Stocktakes",`${list.length} sheets · the sheet snapshots stock when it opens`,`<button class="btn --sm" onclick="S17Z.newSheet()">${ic("plus")} <span class="t">New stocktake</span></button>`);
  const varCount=s=>s.lines.filter(l=>l.counted!=null&&l.counted!==l.sys).length;
  const varVal=s=>s.lines.reduce((t,l)=>t+(l.counted!=null?(l.counted-l.sys)*I.item(l.item).cost:0),0);
  I.body("inventory-stocktakes").innerHTML=`<!-- ids: INVT-107 INVT-108 INVT-109 --><div class="tbl-wrap"><table class="tbl"><thead><tr><th>No.</th><th>Date</th><th>Scope</th><th>Owner</th><th class="num">Items</th><th class="num">Counted</th><th class="num">Variances</th><th class="num">Δ value</th><th>Status</th></tr></thead><tbody>
  ${list.length?list.map(s=>`<tr class="r" onclick="App.go('inventory-stocktake-sheet',{id:${s.id}})"><td><b>${s.code}</b></td><td>${I.fdt(s.at)}</td><td>${I.ST_SCOPE[s.scope]}${s.cat?" · "+s.cat:""}</td><td>${s.owner?A.avatar(s.owner,"--s")+" "+A.user(s.owner).n:"Pool (anyone on shift)"}</td><td class="num">${s.lines.length}</td><td class="num">${s.lines.filter(l=>l.counted!=null).length} / ${s.lines.length}</td><td class="num">${varCount(s)}</td><td class="num ${varVal(s)<0?"accent":""}">${c.cost?I.money(varVal(s)):"–"}</td><td>${A.pill(s.st==="in_progress"?"doing":s.st==="done"?"done":"cancelled",I.ST_ST[s.st])}</td></tr>`).join(""):`<tr><td colspan="9">${I.empty("check","No stocktakes",`<button class="btn --sm" onclick="S17Z.newSheet()">New stocktake</button>`)}</td></tr>`}</tbody></table></div>`;
};
window.S17Z={
  newSheet(){const g=I.items.filter(i=>i.groupA);A.modal({title:"New stocktake",body:`<!-- ids: INVT-106 INVT-110 --><div class="field"><label>Scope</label><div class="col">${I.demo.groupA?`<label class="check"><input type="radio" name="sc" value="groupA" checked> Group A – ${g.length} items, counted often</label>`:""}<label class="check"><input type="radio" name="sc" value="full" ${I.demo.groupA?"":"checked"}> Full</label><label class="check"><input type="radio" name="sc" value="category" onchange="document.getElementById('sc-cat').style.display='';document.getElementById('sc-start').disabled=!document.getElementById('sc-cat').value"> Category</label><label class="check"><input type="radio" name="sc" value="sample"> Sample (weighted)</label></div></div><div class="field mt8" id="sc-cat-w"><select class="select" id="sc-cat" style="display:none" onchange="document.getElementById('sc-start').disabled=!this.value"><option value="">Pick a category…</option>${[...new Set(I.items.map(i=>i.cat))].map(x=>`<option>${x}</option>`).join("")}</select></div><p class="xs muted">The sheet snapshots today's stock and opens right away. <span class="kbd">esc</span> closes. Server needs inventory.count.</p>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" id="sc-start" onclick="S17Z.create()">Start</button>`});
    document.querySelectorAll('input[name=sc]').forEach(r=>r.addEventListener('change',()=>{const cat=$("#sc-cat");if(r.value!=="category"){cat.style.display="none";$("#sc-start").disabled=false}}))},
  create(){const sc=document.querySelector('input[name=sc]:checked').value;const cat=$("#sc-cat").value;const src=sc==="groupA"?I.items.filter(i=>i.groupA):sc==="category"?I.items.filter(i=>i.cat===cat):sc==="sample"?I.items.filter((i,k)=>k%4===0):I.items;const s={id:I.stocktakes[0].id+1,code:"ST-00"+(I.stocktakes[0].id+1),at:A.NOW.toISOString(),scope:sc,cat:sc==="category"?cat:null,owner:sc==="sample"?null:A.me().id,st:"in_progress",lines:src.map(i=>({item:i.id,sys:i.qty,counted:null}))};I.stocktakes.unshift(s);A.closeModal();A.toast(s.code+" created · "+s.lines.length+" lines");A.go("inventory-stocktake-sheet",{id:s.id})}
};

/* ---------- STOCKTAKE SHEET ---------- */
window.mount_inventory_stocktake_sheet=function(params){

  </div></div>
  <!-- ids: INVT-214 -->
  ${c.cost?`<div class="stack"><div class="panel"><div class="p-head"><div class="h4">Losses, last 4 weeks</div><span class="kpi-s tnum accent">${I.money(tot)}</span></div><div class="p-body" style="padding:12px 14px">${wk.length?`<div class="caps">By reason</div>${byReason.sort((a,b)=>b.v-a.v).map(x=>`<div class="share sm"><span style="width:70px">${x.r[1]}</span><span class="muted xs" style="width:84px">${x.n} · ${I.money(x.v)}</span><span class="progress"><i style="width:${tot?x.v/tot*100:0}%"></i></span><span class="xs tnum" style="width:36px;text-align:right">${Math.round(tot?x.v/tot*100:0)}%</span></div>`).join("")}
    <div class="caps mt16">Week by week</div><div class="bar" style="height:40px">${weeks.reverse().map((v,k)=>`<i class="${k===3?"on":""}" style="height:${Math.max(4,v/Math.max(...weeks,1)*40)}px" title="${I.money(v)}"></i>`).join("")}</div>
    <div class="caps mt16">Worst items</div>${Object.entries(worst).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,v])=>`<div class="mv"><span>${esc(I.item(id).name)}</span><span class="q --accent">${I.money(v)}</span></div>`).join("")}`:I.empty("check","No write-offs booked in this window")}</div></div></div>`:`<div class="stack"><div class="note-box --info">${I.roleNote("Losses panel – admin only (purchase-cost money)")}</div></div>`}
  </div>`;
};
window.S17T={book(){const w=S.wo;const lines=w.lines.map(l=>({it:I.item(l.item),q:+l.qty}));const wo={id:I.writeoffs[0].id+1,at:A.NOW.toISOString(),reason:w.reason,by:A.me().id,photo:null,note:w.comment,lines:lines.map(l=>({item:l.it.id,qty:l.q})),checked:null,rejected:null};I.writeoffs.unshift(wo);lines.forEach(l=>I.addMovement(l.it,"writeoff",-l.q,"Writeoff#"+wo.id,w.reason));S.wo={reason:"wilted",lines:[{item:"",qty:""}],date:"",comment:"",confirm:false};A.toast(`Written off · ${lines.length} line${lines.length>1?"s":""} · goes to Write-off review`);A.remount()}};

/* ---------- WRITE-OFF REVIEW ---------- */
window.mount_inventory_writeoff_review=function(params){
  const c=I.can();if(params&&params.status&&!params._used){S.woTab=params.status;params._used=true}
  const all=(I.demo.empty?[]:I.writeoffs).filter(w=>w.reason!=="supplier_claim"&&I.days(w.at)>=-14);
  const list=all.filter(w=>S.woTab==="todo"?!w.checked&&!w.rejected:S.woTab==="rejected"?w.rejected:true);
  /* ids: INVT-225 INVT-226 */
  I.head("inventory-writeoff-review","Write-off review","Last 14 days · supplier-claim write-offs are checked inside the claim, not here");
  I.body("inventory-writeoff-review").innerHTML=`<div class="views">${[["todo","To check",all.filter(w=>!w.checked&&!w.rejected).length],["rejected","Rejected",all.filter(w=>w.rejected).length],["all","All",all.length]].map(t=>`<button class="${S.woTab===t[0]?"on":""}" onclick="S17.woTab='${t[0]}';S17.rejecting=null;App.remount()">${t[1]}<span class="n">${t[2]}</span></button>`).join("")}<span class="sp"></span><span class="xs muted" style="align-self:center">?status=${S.woTab}</span></div>
  <!-- ids: INVT-227 INVT-228 INVT-229 INVT-230 INVT-231 INVT-334 -->
  ${list.length?`<div class="grid g2">${list.map(w=>{const open=!w.checked&&!w.rejected;const busy=I.demo.busy&&S.busyId===w.id;return `<div class="wo-card ${w.rejected?"--rejected":""}"><div class="ph" onclick="${w.photo?`App.modal({title:'Photo · full size',wide:true,body:'<div class=\\'photo --4x5\\' style=\\'max-width:360px;margin:0 auto\\'><img src=\\'img/${w.photo}.webp\\'></div>'})`:"App.toast('No photo – web write-offs have none')"}">${w.photo?`<img src="img/${w.photo}.webp" alt="">`:"no photo"}</div>
    <div style="flex:1;min-width:0"><div class="row" style="gap:8px;flex-wrap:wrap"><b>${I.fdt(w.at)}</b><span class="tag">${I.WO_REASONS.find(r=>r[0]===w.reason)[1]}</span><span class="muted sm">by ${A.user(w.by).n}</span>${w.rejected?`<span class="tag --accent">taken back</span>`:""}${c.cost?`<span class="sm tnum" style="margin-left:auto">${I.money(I.woValue(w))}</span>`:""}</div>
    <div class="sm mt8">${w.lines.map(l=>`${esc(I.item(l.item).name)} – ${l.qty} ${I.item(l.item).unit}`).join("<br>")}</div>${w.note?`<div class="xs muted mt8">«${esc(w.note)}»</div>`:""}
    ${w.checked?`<div class="xs ok mt8">checked by ${A.user(w.checked.who).n} · ${I.fdt(w.checked.at)}</div>`:""}${w.rejected?`<div class="xs accent mt8">rejected by ${A.user(w.rejected.who).n}: ${esc(w.rejected.why)}</div>`:""}
    ${S.rejecting===w.id?`<div class="mt8"><div class="field"><label>Why (the author sees it in the log)</label><textarea class="textarea" id="rj-${w.id}" oninput="document.getElementById('rjb-${w.id}').disabled=!this.value.trim()"></textarea></div><div class="btn-row mt8"><button class="btn --sm --accent" id="rjb-${w.id}" disabled onclick="S17R.reject(${w.id})">Reject and return the stock</button><button class="btn --ghost --sm" onclick="S17.rejecting=null;App.remount()">Cancel</button></div></div>`:""}</div>
    ${open?`<div class="acts"><button class="btn --sm" ${busy?"disabled":""} onclick="S17R.check(${w.id})">${busy?"…":"Checked"}</button><button class="btn --ghost --sm" onclick="S17.rejecting=${w.id};App.remount()">Reject</button></div>`:""}</div>`}).join("")}</div><p class="xs muted mt8">Buttons lock while the request runs; each card keeps its own reason text (old CRM shared one field and allowed double clicks).</p>`:I.empty("check","Nothing to check")}`;
};
window.S17R={
  check(id){const w=I.writeoffs.find(x=>x.id===id);S.busyId=id;w.checked={who:A.me().id,at:A.NOW.toISOString()};A.toast("Checked");A.remount()},
  reject(id){const w=I.writeoffs.find(x=>x.id===id);const why=$("#rj-"+id).value.trim();w.rejected={who:A.me().id,at:A.NOW.toISOString(),why};w.lines.forEach(l=>I.addMovement(I.item(l.item),"adjustment",l.qty,"Writeoff#"+id,"Rejected write-off returned"));S.rejecting=null;A.toast("Rejected · stock returned · out of the losses");A.remount()}
};

/* ---------- WRITE-OFF REPORT ---------- */
window.mount_inventory_writeoff_report=function(){
  const c=I.can();
  I.head("inventory-writeoff-report","Write-off report","Shrinkage: reason × item × week, written off as a share of what was received, against the target corridors");
  const B=I.body("inventory-writeoff-report");
  /* ids: INVT-216 */
  if(!c.cost){B.innerHTML=I.empty("lock","Purchase-cost money is admin-only – ask an admin to open this report.",`<button class="btn --ghost --sm" onclick="App.toast('Ask Tatiana – inventory.cost can be granted per person in Settings → Team')">Ask an admin</button>`);return}
  const has=I.demo.shrink&&!I.demo.empty;
  const rec=has?I.receipts.filter(r=>I.days(r.at)>=-28):[];const recV=rec.reduce((s,r)=>s+I.rcptClock(r),0);
  const wo=has?I.writeoffs.filter(w=>I.days(w.at)>=-28&&!w.rejected&&w.reason!=="supplier_claim"):[];const woV=wo.reduce((s,w)=>s+I.woValue(w),0);
  const claimMinor=has?I.claims.filter(cl=>cl.st!=="draft"&&cl.lines.some(l=>["writeoff","markdown"].includes(l.disp))).reduce((s,cl)=>s+cl.lines.filter(l=>["writeoff","markdown"].includes(l.disp)).reduce((t,l)=>t+l.qty*l.cost,0),0):0;
  const sh=recV?woV/recV*100:null;const light=p=>p==null?"":p<=10?"":p<=15?"--watch":"--alarm";const lbl=p=>p==null?"–":p<=10?"Normal":p<=15?"Watch":"Alarm";
  const w7=I.writeoffs.filter(w=>I.days(w.at)>=-7&&!w.rejected&&w.reason!=="supplier_claim").reduce((s,w)=>s+I.woValue(w),0),r7=I.receipts.filter(r=>I.days(r.at)>=-7).reduce((s,r)=>s+I.rcptClock(r),0);
  const byItem={};wo.forEach(w=>w.lines.forEach(l=>{const k=l.item;byItem[k]=byItem[k]||{q:0,v:0,reasons:{}};byItem[k].q+=l.qty;byItem[k].v+=l.qty*I.item(k).cost;byItem[k].reasons[w.reason]=(byItem[k].reasons[w.reason]||0)+l.qty*I.item(k).cost}));
  const worst=Object.entries(byItem).sort((a,b)=>b[1].v-a[1].v);const topShare=worst.length&&woV?worst[0][1].v/woV*100:0;
  const card=(t,p,r,w)=>`<div class="kpi-card" style="cursor:default"><span class="caps">${t}</span><span class="kpi-s tnum ${p==null?"muted":p<=10?"ok":p<=15?"warn":"accent"}">${p==null?"–":I.pct(p)}</span><span class="delta">Received, at cost ${I.money(r)} · Written off, at cost ${I.money(w)}${p!=null&&topShare>50&&t.startsWith("Rolling")?`<br><span class="warn">One item alone is ${Math.round(topShare)}% of this</span>`:""}</span></div>`;
  const cats=[...new Set(I.items.map(i=>i.cat))].filter(x=>x!=="Helium");
  B.innerHTML=`${!has?`<!-- ids: INVT-217 --><div class="note-box --warn mb16">No real write-offs booked yet – this report fills in on its own as the shift books write-offs and deliveries.</div>`:""}
  <!-- ids: INVT-218 INVT-219 --><div class="grid g2">${card("Rolling 4 weeks",has?sh:null,recV,woV)}${card("Last 7 days",has&&r7?w7/r7*100:null,r7,w7)}</div>
  <p class="xs muted mt8">Target corridors: overall 5–10 %, Greenery 2–5 %. ${claimMinor?`Plus ${I.money(claimMinor)} from supplier-claim dispositions (write off / markdown) – counted in the claim, not here.`:""} ${!rec.length?"No receipts in this window – shares cannot be computed.":""}</p>
  <div class="grid g2 mt16">
    <!-- ids: INVT-220 INVT-224 --><div class="panel"><div class="p-head"><div class="h4">By reason (rolling 4 weeks)</div></div><div class="p-body">${wo.length?`<table class="tbl"><thead><tr><th>Reason</th><th class="num">Qty</th><th class="num">At cost</th><th class="num">Share</th></tr></thead><tbody>${I.WO_REASONS.map(r=>{const ws=wo.filter(w=>w.reason===r[0]);if(!ws.length)return"";const v=ws.reduce((s,w)=>s+I.woValue(w),0),q=ws.reduce((s,w)=>s+w.lines.reduce((t,l)=>t+l.qty,0),0);return `<tr><td>${r[1]}</td><td class="num">${q}</td><td class="num">${I.money(v)}</td><td class="num">${I.pct(v/woV*100)}</td></tr>`}).join("")}</tbody></table>`:I.empty("list","No write-offs in the window")}</div></div>
    <!-- ids: INVT-221 --><div class="panel"><div class="p-head"><div class="h4">By week</div><span class="xs muted">8 weeks</span></div><div class="p-body">${has?`<table class="tbl"><thead><tr><th>Week</th><th class="num">Received</th><th class="num">Written off</th><th class="num">Shrinkage</th><th>Light</th></tr></thead><tbody>${[0,1,2,3,4,5,6,7].map(k=>{const r=I.receipts.filter(x=>I.days(x.at)<=-k*7&&I.days(x.at)>-(k+1)*7).reduce((s,x)=>s+I.rcptClock(x),0);const w=I.writeoffs.filter(x=>I.days(x.at)<=-k*7&&I.days(x.at)>-(k+1)*7&&!x.rejected&&x.reason!=="supplier_claim").reduce((s,x)=>s+I.woValue(x),0);const p=r?w/r*100:null;return `<tr><td>${I.fd(I.D(-k*7-6))} – ${I.fd(I.D(-k*7))}</td><td class="num">${I.money(r)}</td><td class="num">${I.money(w)}</td><td class="num" title="${p==null?"no receipts this week":""}">${p==null?"–":I.pct(p)}</td><td><span class="light ${light(p)}">${lbl(p)}</span></td></tr>`}).join("")}</tbody></table>`:I.empty("list","No weeks with data")}</div></div>
    <!-- ids: INVT-222 --><div class="panel"><div class="p-head"><div class="h4">By category</div></div><div class="p-body">${has?`<table class="tbl"><thead><tr><th>Category</th><th class="num">Received</th><th class="num">Written off</th><th class="num">Shrinkage</th><th>Target</th><th>Light</th></tr></thead><tbody>${cats.map(ct=>{const r=rec.reduce((s,x)=>s+x.lines.filter(l=>I.item(l.item).cat===ct).reduce((t,l)=>t+l.qty*l.cost,0),0);const w=wo.reduce((s,x)=>s+x.lines.filter(l=>I.item(l.item).cat===ct).reduce((t,l)=>t+l.qty*I.item(l.item).cost,0),0);if(!r&&!w)return"";const p=r?w/r*100:null;const tg=ct==="Greenery"?"2–5 %":["Roses","Peonies","Garden roses","Hydrangea","Lisianthus","Ranunculus","Tulips"].includes(ct)?"5–10 %":"no target set";return `<tr><td>${ct}</td><td class="num">${I.money(r)}</td><td class="num">${I.money(w)}</td><td class="num">${p==null?"–":I.pct(p)}</td><td class="muted">${tg}</td><td><span class="light ${light(p)}">${lbl(p)}</span></td></tr>`}).join("")}</tbody></table>`:I.empty("list","No categories with data")}</div></div>
    <!-- ids: INVT-223 --><div class="panel"><div class="p-head"><div class="h4">Worst items</div></div><div class="p-body">${worst.length?`<table class="tbl"><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">At cost</th><th class="num">Received</th><th class="num">Own %</th><th>Reasons</th></tr></thead><tbody>${worst.slice(0,6).map(([id,x])=>{const i=I.item(id);const r=rec.reduce((s,rc)=>s+rc.lines.filter(l=>l.item===i.id).reduce((t,l)=>t+l.qty*l.cost,0),0);return `<tr class="r" onclick="App.go('inventory-item',{id:${i.id}})">${I.itemCell(i,`${i.sku} · ${i.cat}`)}<td class="num">${x.q}</td><td class="num">${I.money(x.v)}</td><td class="num">${I.money(r)}</td><td class="num">${r?I.pct(x.v/r*100):"–"}</td><td class="xs muted">${Object.entries(x.reasons).map(([k,v])=>`${I.WO_REASONS.find(rr=>rr[0]===k)?.[1]||k} (${I.money(v)})`).join(", ")}</td></tr>`}).join("")}</tbody></table>`:I.empty("list","No items written off")}</div></div>
  </div>`;
};
document.addEventListener("inv",()=>{const c=A.state.current;if(["inventory-writeoff","inventory-writeoff-review","inventory-writeoff-report"].includes(c))A.remount()});
})();
</script>
