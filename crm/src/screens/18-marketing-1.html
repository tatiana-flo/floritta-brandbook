    ${o?`<div class="l-meta"><span class="pill --ready --plain" style="cursor:pointer" onclick="App.openOrder(${o.id})">Became order #${o.id} · ${fmt(o.total)}</span></div>`:""}
    ${l.wa?`<div class="l-meta"><button class="chip" onclick="App.go('inbox',{customer:${l.c}})">${ic("chat")} WhatsApp ${l.wa.count} msgs · ${ago(l.wa.last)} →</button></div>${l.wa.inbound?`<div class="l-wa"><i>“${esc(l.wa.inbound)}”</i></div>`:""}`:(l.phone?`<div class="l-meta"><button class="chip" ${wa==="busy"?"disabled":""} onclick="MK.leadWa(${l.id})">${ic("chat")} ${wa==="busy"?"Opening chat…":"Message on WhatsApp"}</button>${wa==="fail"?`<span class="l-err">Call failed</span>`:""}</div>`:"")}
    ${notes.length?`<div class="l-note"><b>${esc(A.user(notes[0].who).n)}</b> · ${ago(notes[0].at)} · ${esc(notes[0].t)}</div>`:""}
    ${open&&notes.length>1?notes.slice(1).map(n=>`<div class="l-note"><b>${esc(A.user(n.who).n)}</b> · ${ago(n.at)} · ${esc(n.t)}</div>`).join(""):""}

function leadsBoard(waiting,reached,isA){
  const all=waiting.concat(reached);
  if(!all.length)return `<div class="empty">${ic("inbox")}<div class="h3">No site leads on the board</div><div class="sm">The block is hidden on the orders board when there are no leads at all. Leads arrive from the Bespoke order, Quick order, B2B and waitlist forms on floritta.uk; the first one (not a re-send) also posts a card to managers in Telegram.</div><button class="btn --ghost --sm" onclick="MK.st.leadsEmpty=false;App.remount()">Show demo leads</button></div>`;
  return `<div class="row mb16" style="gap:12px"><div class="h3">Site leads <span class="muted sm">· ${waiting.length} waiting for a call</span></div><button class="textbtn" onclick="MK.st.leadsTab='archive';App.remount()">All leads →</button><span class="sp"></span>${isA&&all.length?`<button class="btn --ghost --sm" onclick="MK.leadsClear()">${ic("trash")} Clear all</button>`:""}</div>
   <div class="note mb16">${ic("info")} New leads post a card to managers in Telegram (NotifySiteLeadJob) · the board re-reads every 60 s, so the 30-min stripe and colleagues' notes update without a reload.</div>
   ${waiting.length?waiting.map(l=>leadRow(l,isA)).join(""):`<div class="empty" style="border:1px solid var(--hair)">${ic("check")}<div class="h3">No callback requests waiting.</div></div>`}
   ${reached.length?`<button class="fold ${st.leadsFold?"open":""}" onclick="MK.st.leadsFold=!MK.st.leadsFold;App.remount()">${ic("chev")} Reached in the last 7 days (${reached.length})</button>${st.leadsFold?`<div class="mt8">${reached.map(l=>leadRow(l,isA)).join("")}</div>`:""}`:""}`;
}
function leadsArchive(isA){
  const rows=st.leadsEmpty?[]:LEADS.filter(l=>st.leadsStatus==="all"||l.status===st.leadsStatus);
  const cnt=s=>LEADS.filter(l=>s==="all"||l.status===s).length;

  return `<div class="views">${[["all","All"],["new","New"],["no_answer","No answer"],["contacted","Contacted"],["closed","Closed"]].map(([v,l])=>`<button class="${st.leadsStatus===v?"on":""}" onclick="MK.st.leadsStatus='${v}';App.remount()">${l}<span class="n">${cnt(v)}</span></button>`).join("")}<span class="sp"></span><span class="note" style="align-self:center">?status= · Overview «Needs attention» counts New + No answer and opens ?status=new – here the count and the tab match</span></div>
  ${rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Form</th><th>Name</th><th>Phone</th><th>Social</th><th class="ph-hide">Message</th><th class="ph-hide">Product</th><th>Status</th></tr></thead><tbody>
  ${rows.map(l=>`<tr class="r"><td class="tnum">${dt(l.at)}</td><td><div>${esc(l.form)}</div><a class="sub" title="${esc(l.path)}" onclick="App.toast('Opens floritta.uk${esc(l.path)} in a new tab')">${esc(l.path)}</a></td><td><b>${esc(l.name)}</b></td><td class="tnum"><a href="tel:" onclick="App.toast('Calling ${esc(l.phone)}')">${esc(l.phone)}</a></td><td>${esc(l.social)||"–"}</td><td class="wrap ph-hide" style="max-width:300px;font-size:12.5px">${esc(l.msg)}${l.voice?`<div class="row mt8"><span class="audio"><button class="ib" style="width:22px;height:22px" onclick="App.toast('Playing voice message')">${ic("play")}</button><span class="tnum">0:14</span><span class="xs muted">voice · loads on play</span></span></div>`:""}</td><td class="ph-hide">${l.product?`<a class="link" style="text-transform:none;letter-spacing:0" onclick="App.toast('Opens the product on floritta.uk')">${esc(l.product)}</a>`:"–"}</td><td><div class="row" style="gap:6px">${leadPill(l.status)}${sel(l)}</div></td></tr>`).join("")}
  </tbody></table></div>${pager(LEADS.length+(st.leadsStatus==="all"?40:0))}
  <div class="note mt8">${ic("info")} Status rules are server-side: Contacted stamps who/when · No answer adds a try and the 3rd try closes the lead by itself (NO_ANSWER_LIMIT=3) · New resets tries and the “reached by” stamp. No audit, no notifications. ${isA?"":"Managers can change status but not delete."}</div>`
  :`<div class="empty">${ic("inbox")}<div class="h3">No leads yet</div><div class="sm">They arrive from the Bespoke order and Quick order forms on floritta.uk.</div></div>`}`;
}
function leadStatus(id,s){const l=LEADS.find(x=>x.id===id);st.leadsBusy[id]=true;re();setTimeout(()=>{st.leadsBusy[id]=false;const me=A.me().id;
  if(s==="contacted"){l.status="contacted";l.contactedAt=NOW.toISOString();l.contactedBy=me;A.toast(`${l.name} · Reached – kept in the 7-day fold`)}
  else if(s==="no_answer"){l.attempts++;l.lastTry=NOW.toISOString();if(l.attempts>=3){l.status="closed";A.toast(`${l.name} · 3rd try – closed and moved to the archive`)}else{l.status="no_answer";A.toast(`${l.name} · No answer ×${l.attempts}`)}}
  else if(s==="new"){l.status="new";l.attempts=0;l.contactedAt=null;l.contactedBy=null;A.toast(`${l.name} · Back to queue – tries reset`)}
  else{l.status=s;A.toast(`${l.name} · ${LEAD_ST[s]}`)}
  re()},350)}
function leadCall(id){const l=LEADS.find(x=>x.id===id);st.leadsCall[id]=Math.random()<.8?"ring":"fail";st.leadsBusy[id]=true;re();setTimeout(()=>{st.leadsBusy[id]=false;re()},900);A.toast(st.leadsCall[id]==="ring"?"Ringover: your phone rings first, then "+l.name:"Call failed: gateway refused")}
function leadWa(id){const l=LEADS.find(x=>x.id===id);st.leadsWa[id]="busy";re();setTimeout(()=>{if(Math.random()<.85){st.leadsWa[id]=null;l.wa={count:1,last:NOW.toISOString(),inbound:""};A.toast("Sent: “Hello! You left a callback request on floritta.uk – how can we help?” · opening chat");A.go("inbox",{customer:l.c})}else{st.leadsWa[id]="fail";re()}},900)}
function leadNoteSave(id,v){if(!v.trim()){st.leadsNote=null;re();return}const l=LEADS.find(x=>x.id===id);l.notes.push({who:A.me().id,at:NOW.toISOString(),t:v.trim()});st.leadsNote=null;re();A.toast("Note added to the journal – nothing overwritten")}
function leadDel(id){const l=LEADS.find(x=>x.id===id);A.confirm("Delete this lead?","It leaves the board; the record is kept in the database – but in the old CRM it also vanished from the archive (soft delete, index without trashed). Admin only.","Delete",()=>{LEADS.splice(LEADS.indexOf(l),1);re();A.toast(l.name+" removed from the board")},{danger:true})}
function leadsClear(){const n=LEADS.filter(l=>l.status!=="closed").length;A.confirm(`Delete all ${n} leads from the board?`,"The records are kept. Admin only · soft-deletes every row on the board (waiting + reached in 7 days). Note: in the old CRM they also disappeared from the archive.",`Clear all (${n})`,()=>{st.leadsEmpty=true;re();A.toast(n+" leads cleared from the board")},{danger:true})}
function leadsMenu(ev){A.pop(ev,["Demo data",{t:(st.leadsEmpty?"":"· ")+"7 leads on the board",ic:"list",fn:()=>{st.leadsEmpty=false;re()}},{t:(st.leadsEmpty?"· ":"")+"Empty board (block hidden)",ic:"moon",fn:()=>{st.leadsEmpty=true;re()}},"-",{t:"60-s poll · "+(st.leadsPoll?"running":"paused (new-order form open)"),ic:"refresh",fn:()=>{st.leadsPoll=!st.leadsPoll;re()}}])}

   ${ps.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Partner</th><th class="ph-hide">Segment</th><th class="num">Rate</th><th class="num">Orders</th><th class="num ph-hide">Goods ex VAT</th><th class="num ph-hide">Accrued</th><th class="num ph-hide">On hold</th><th class="num">Payable</th><th class="num ph-hide">Paid</th><th>Status</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr class="r"><td><b>${esc(p.name)}</b>${p.company?` <span class="muted">· ${esc(p.company)}</span>`:""}<span class="sub"><span class="code" title="https://floritta.uk/?utm_source=partner&utm_medium=referral&utm_campaign=${p.slug}">referral/${p.slug}</span> <button class="textbtn" onclick="MK.copy('partner link')">copy</button></span></td><td class="ph-hide">${esc(p.seg)}</td><td class="num">${p.rate}%</td><td class="num">${p.orders}</td><td class="num ph-hide">${fmt(p.goods)}</td><td class="num ph-hide">${fmt(p.accrued)}</td><td class="num ph-hide">${fmt(p.hold)}</td><td class="num"><b>${fmt(p.payable)}</b></td><td class="num ph-hide">${fmt(p.paid)}</td><td>${p.status==="active"?A.pill("ready","Active"):p.status==="paused"?A.pill("review","Paused"):A.pill("todo","Ended")}</td><td style="text-align:right"><span class="acts">${p.payable>0?`<button class="btn --ghost --sm" onclick="MK.payout(${p.id})">Mark payout</button>`:""}<button class="ib" title="Edit" onclick="MK.partnerForm(${p.id})">${ic("edit")}</button></span></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty" style="border:1px solid var(--hair)">${ic("award")}<div class="h3">No partners yet</div><button class="btn --sm" onclick="MK.partnerForm()">New partner</button></div>`}
   <div class="sec-head"><div class="h3">Accruals this month</div><span class="auto"><i></i> 04:45 cron moves accruals older than 45 days from On hold to Payable</span></div>
   ${accr.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Order</th><th>Partner</th><th>Date</th><th class="num">Goods ex VAT</th><th class="num">Rate</th><th class="num">Commission</th><th>Status</th><th>Hold until / paid</th></tr></thead><tbody>${accr.map(([oid,pid,d,g,r,c,s,h])=>`<tr class="r"><td><button class="link" style="text-transform:none;letter-spacing:0" onclick="App.openOrder(${oid})">#${oid}</button></td><td>${esc(PARTNERS.find(p=>p.id===pid).name)}</td><td class="tnum">${A.fmtDate(d)}</td><td class="num">${fmt(g)}</td><td class="num">${r}%</td><td class="num">${fmt(c)}</td><td>${s==="hold"?A.pill("review","On hold"):s==="payable"?A.pill("ready","Payable"):s==="paid"?A.pill("done","Paid"):A.pill("cancelled","Void")}</td><td>${h}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty" style="border:1px solid var(--hair)"><div class="sm">No accruals this month</div></div>`}
   <div class="note mt8">An accrual is created when a paid order carries the partner's code or link; it stays On hold for 45 days (refund window), then becomes Payable. Mark payout only records the payment – no money moves.</div>`;
};
const refLbl=()=>new Date(st.refMonth+"-01T12:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"});
function refMonth(d){const [y,m]=st.refMonth.split("-").map(Number);const x=new Date(y,m-1+d,1);st.refMonth=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");re();A.toast("?month="+st.refMonth)}
function payout(id){const p=PARTNERS.find(x=>x.id===id);A.confirm("Mark payout",`Mark this month's payable accruals for ${p.name} (${fmt(p.payable)}) as paid? Every accrual is audited. This records the payment only – transfer the money from the bank yourself.`,"Mark as paid",()=>{p.paid+=p.payable;p.payable=0;re();A.toast(p.name+" · payout recorded")})}
function partnerForm(id){const p=id?PARTNERS.find(x=>x.id===id):{name:"",company:"",email:"",phone:"",seg:"Wedding planner",rate:10,status:"active",notes:""};
  A.modal({title:id?"Edit partner":"New partner",wide:true,body:`<div class="grid g2"><div class="field"><label>Name</label><input class="input" id="mk-pn" value="${esc(p.name)}" required></div><div class="field"><label>Company</label><input class="input" value="${esc(p.company)}"></div><div class="field"><label>Email</label><input class="input" value="${esc(p.email)}"></div><div class="field"><label>Phone</label><input class="input" value="${esc(p.phone)}" placeholder="+44 7700 900000"></div><div class="field"><label>Segment</label><select class="select">${["Wedding planner","Venue","Corporate","Influencer","Photographer / stylist","Other"].map(s=>`<option ${p.seg===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="field"><label>Rate %</label><input class="input" type="number" min="0" max="100" step="0.5" value="${p.rate}"></div><div class="field"><label>Status</label><select class="select">${["active","paused","ended"].map(s=>`<option value="${s}" ${p.status===s?"selected":""}>${s[0].toUpperCase()+s.slice(1)}</option>`).join("")}</select></div><div class="field"><label>Notes</label><input class="input" value="${esc(p.notes)}"></div></div>${id?`<div class="note mt8">Partner link: <span class="code">https://floritta.uk/?utm_source=partner&utm_medium=referral&utm_campaign=${p.slug}</span> – the slug does not change on rename, so live links keep working.</div>`:`<div class="note mt8">A slug is created from the name for the partner link.</div>`}`,
   foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="(()=>{const n=App.$('#mk-pn').value.trim();if(!n){App.toast('Name is required');return}${id?`MK.PARTNERS.find(x=>x.id===${id}).name=n;`:`MK.PARTNERS.push({id:Date.now(),name:n,company:'',slug:n.toLowerCase().replace(/[^a-z0-9]+/g,'-'),seg:'Other',rate:10,status:'active',email:'',phone:'',orders:0,goods:0,accrued:0,hold:0,payable:0,paid:0,notes:''});`}App.closeModal();MK.st.refEmpty=false;App.remount();App.toast('Partner saved – audited')})()">Save</button>`})}
function refMenu(ev){A.pop(ev,["Demo data",{t:(st.refEmpty?"· ":"")+"No partners / no accruals",ic:"moon",fn:()=>{st.refEmpty=!st.refEmpty;re()}}])}

/* ===== MARKETING · PLACEMENTS (MKTG-272…286) ===== */
window.mount_mk_placements=function(){
  head("mk-plc-head",`<div class="h2">Marketing</div><span class="sp"></span>${demoBtn("MK.plcMenu(event)")}<button class="btn --sm" onclick="MK.plcForm()">${ic("plus")} New placement</button>`);
  const k=st.plcPeriod==="7d"?.25:st.plcPeriod==="30d"?1:st.plcPeriod==="90d"?2.4:4;
  let rows=(st.plcEmpty?[]:PLC).filter(p=>st.plcStatus==="all"||p.status===st.plcStatus).filter(p=>st.plcPlat==="all"||p.platform===st.plcPlat);
  const [sk,sd]=st.plcSort;const val=p=>sk==="platform"?p.platform:sk==="visits"?(p.visits??-1):sk==="orders"?(p.orders??-1):sk==="status"?PLC_ST[p.status]:(p.checked?new Date(p.checked).getTime():0);
  rows.sort((a,b)=>(val(a)>val(b)?1:val(a)<val(b)?-1:0)*sd);
  const th=(key,l,cls="")=>`<th class="sort ${cls}" onclick="MK.plcSort('${key}')">${l}${sk===key?`<span class="ar">${sd>0?"↑":"↓"}</span>`:""}</th>`;
  const urlCell=u=>`<span class="code" title="${esc(u)}" style="display:inline-block;max-width:180px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;cursor:pointer" onclick="App.toast('Opens in a new tab')">${esc(u.replace(/^https?:\/\//,""))}</span>`;
  const num=(p,k2)=>p[k2]===null?`<span class="muted" title="No UTM in the link – nothing to count">–</span>`:`${p.shared?`<span title="This UTM is shared by several placements – the number is approximate">≈</span>`:""}${k2==="revenue"?fmt(Math.round(p[k2]*k)):Math.round(p[k2]*k)}`;
  $("#mk-plc-body").innerHTML=`${nav("m","mk-placements")}
   <div class="note mb8">A register of where Floritta is listed – directories, profiles, blog mentions – and what each brings. Visits and orders are matched by the source / medium / campaign triple in the placement's link.</div>
   ${st.plcGa4?"":`<div class="banner --warn">${ic("alert")} Visits come from Google Analytics 4, which is not connected: ADC credentials missing on the server. Orders still count.</div>`}
   <div class="toolbar"><div class="chips">${[["all","All statuses"],["active","Active"],["broken","Broken"],["nout","No UTM"],["pending","Pending"]].map(([v,l])=>`<button class="chip ${st.plcStatus===v?"on":""}" onclick="MK.st.plcStatus='${v}';App.remount()">${l}</button>`).join("")}</div><span class="sp"></span>${periodChips("plcPeriod",[["7d","7 days"],["30d","30 days"],["90d","90 days"],["all","All time"]])}<select class="select" style="width:auto;height:30px" onchange="MK.st.plcPlat=this.value;App.remount()"><option value="all">All platforms</option>${[...new Set(PLC.map(p=>p.platform))].map(p=>`<option ${st.plcPlat===p?"selected":""}>${esc(p)}</option>`).join("")}</select></div>
   ${rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr>${th("platform","Platform")}<th>Page URL</th><th class="ph-hide">Link to our site</th>${th("visits","Visits","num")}${th("orders","Orders","num")}<th class="num ph-hide">Revenue</th>${th("status","Status")}${th("checked","Last checked","ph-hide")}<th class="ph-hide">Notes</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr class="r"><td><b>${esc(p.platform)}</b> ${p.access?`<span class="tag --line" title="We can edit this listing">Access</span>`:""}</td><td>${urlCell(p.url)}</td><td class="ph-hide">${urlCell(p.link)}</td><td class="num">${num(p,"visits")}</td><td class="num">${num(p,"orders")}</td><td class="num ph-hide">${num(p,"revenue")}</td><td>${p.status==="active"?A.pill("ready","Active"):p.status==="broken"?A.pill("late","Broken"):p.status==="nout"?A.pill("review","No UTM"):A.pill("queue","Pending")}</td><td class="tnum ph-hide">${p.checked?A.fmtDate(p.checked):"Never"}</td><td class="ph-hide xs" style="max-width:160px">${esc(p.notes)||"–"}</td><td style="text-align:right"><span class="acts"><button class="btn --ghost --sm" onclick="MK.plcCheck(${p.id})">Mark checked</button><button class="ib" title="Edit" onclick="MK.plcForm(${p.id})">${ic("edit")}</button><button class="ib" title="Delete" onclick="MK.plcDel(${p.id})">${ic("trash")}</button></span></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty" style="border:1px solid var(--hair)">${ic("map")}<div class="h3">No placements yet</div><button class="btn --sm" onclick="MK.plcForm()">New placement</button></div>`}
   <div class="note mt8">Filters, platform and sort are client-side (not in the URL); only ?period= is.</div>`;
};
function plcSort(k){st.plcSort=st.plcSort[0]===k?[k,-st.plcSort[1]]:[k,1];re()}
function plcCheck(id){const p=PLC.find(x=>x.id===id);p.checked=NOW.toISOString();re();A.toast(p.platform+" · checked now – audited")}
function plcDel(id){const p=PLC.find(x=>x.id===id);confirmDel(()=>{PLC.splice(PLC.indexOf(p),1);re();A.toast(p.platform+" deleted (soft) – audited")},"Soft delete, audited.")}
function plcForm(id){const p=id?PLC.find(x=>x.id===id):{platform:"",url:"",link:"https://floritta.uk/",status:"pending",access:false,notes:""};window.MK._p=Object.assign({},p);
  A.modal({title:id?"Edit placement":"New placement",wide:true,body:`<div class="grid g2"><div class="field"><label>Platform</label><input class="input" id="mk-plp" list="mk-plats" value="${esc(p.platform)}" oninput="MK._p.platform=this.value;App.$('#mk-gen').disabled=!this.value.trim()"><datalist id="mk-plats">${[...new Set(PLC.map(x=>x.platform))].map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div><div class="field"><label>Page URL</label><input class="input" value="${esc(p.url)}" oninput="MK._p.url=this.value" placeholder="https://…"></div></div>
   <div class="field mt8"><label>Link to our site</label><div class="row"><input class="input" id="mk-pll" value="${esc(p.link)}" oninput="MK._p.link=this.value"><button class="btn --ghost --sm" id="mk-gen" ${p.platform?"":"disabled"} onclick="MK.plcUtm()">Generate UTM</button></div><div class="note" id="mk-plu">${p.link.includes("utm_")?"UTM: "+p.link.split("?")[1].split("&").map(x=>x.split("=")[1]).join(" / "):"Generate UTM builds a floritta.uk link tagged from the platform name (overwrites the field)"}</div></div>
   <div class="grid g2 mt8"><div class="field"><label>Status</label><select class="select" onchange="MK._p.status=this.value">${Object.entries(PLC_ST).map(([v,l])=>`<option value="${v}" ${p.status===v?"selected":""}>${l}</option>`).join("")}</select></div><div class="field" style="justify-content:flex-end"><label class="check"><input type="checkbox" ${p.access?"checked":""} onchange="MK._p.access=this.checked"> We can edit it</label></div></div>
   <div class="field mt8"><label>Notes</label><input class="input" value="${esc(p.notes)}" oninput="MK._p.notes=this.value"></div>`,
   foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="MK.plcSave(${id||0})">Save</button>`})}
function plcUtm(){const n=(MK._p.platform||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");const link=`https://floritta.uk/?utm_source=${n}&utm_medium=listing&utm_campaign=profile`;MK._p.link=link;$("#mk-pll").value=link;$("#mk-plu").textContent="UTM: "+n+" / listing / profile";A.toast("UTM generated · usage counted (feature-events)")}
function plcSave(id){const p=MK._p;if(!p.platform.trim()||!p.url.trim()){A.toast("Platform and Page URL are required");return}if(id)Object.assign(PLC.find(x=>x.id===id),p);else PLC.push(Object.assign({id:Date.now(),checked:null,visits:p.link.includes("utm_")?0:null,orders:p.link.includes("utm_")?0:null,revenue:p.link.includes("utm_")?0:null,shared:false},p,{status:p.link.includes("utm_")?p.status:"nout"}));A.closeModal();st.plcEmpty=false;re();A.toast("Placement saved – audited")}
function plcMenu(ev){A.pop(ev,["Demo data",{t:"GA4 · "+(st.plcGa4?"connected":"not connected"),ic:"growth",fn:()=>{st.plcGa4=!st.plcGa4;re()}},{t:(st.plcEmpty?"· ":"")+"No placements",ic:"moon",fn:()=>{st.plcEmpty=!st.plcEmpty;re()}}])}

return {st,nav,head,demoBtn,re,roleNote,confirmDel,copy,ago,dt,mins,admin,periodCtl,periodCheck,periodChips,
  DEMO,LEADS,ADDONS,BUNDLES,AUTOS,PARTNERS,PROMO,BATCHES,UTM,SPEND,PLC,
  demoStatus,demoOpen,demoMenu,leadStatus,leadCall,leadWa,leadNoteSave,leadDel,leadsClear,leadsMenu,
  addonToggle,skuSearch,siteId,newBundle,bundlePick,upMenu,autoToggle,newAuto,autoSave,autoMenu,uberConnect,uberDisconnect,uberMenu,
  promoHistory,promoForm,promoSave,promoDel,promoSrcSave,newBatch,promoMenu,utmForm,utmSave,utmQr,utmDel,utmMenu,spendAdd,spendDel,utmaMenu,attrMenu,
  refMonth,payout,partnerForm,refMenu,plcSort,plcCheck,plcDel,plcForm,plcUtm,plcSave,plcMenu};
})();
["marketing","mk-demo","mk-leads","mk-upsell","mk-reviews","mk-retention","mk-automations","mk-uberads","mk-promo","mk-utm","mk-utm-analytics","mk-attribution","mk-referrals","mk-placements"].forEach(id=>document.addEventListener("orders",()=>{if(App.state.current===id)App.remount()}));
</script>
