  if(stage==="ready"&&!j.photo&&!c){App.toast("Photo of the bouquet first – «Ready» needs the photo","Add photo",()=>P3_addPhoto(id,0));return}
  if(c){const cj=T23_CARRY.find(x=>x.order===id);cj.stage=stage==="to_make"?"queue":stage==="ready"?"ready":"making";if(stage==="in_progress"&&!cj.florist)cj.florist=App.me().id;App.toast("Job moved");p3Mount(P3.lastParams);return}

  else {App.setOrderStatus(id,"queue",{silent:true});App.toast("Job moved")}
}

const P23K={date:p23key(App.NOW),rate:3};
window.mount_production_peak_day=function(params){params=params||{};if(params.date)P23K.date=params.date;P23_nav("production-peak-day");p23PeakRender()};
function P23_peakGo(date,rate){if(date)P23K.date=date;if(rate!==undefined)P23K.rate=Math.max(1,Math.min(20,Number(rate)||1));p23PeakRender()}
function p23PeakModel(){
  const key=P23K.date,today=p23key(App.NOW),tom=p23key(p23addDays(App.NOW.toISOString(),1));
  const hours=Array.from({length:14},(_,i)=>8+i);const due=Object.fromEntries(hours.map(h=>[h,0])),made=Object.fromEntries(hours.map(h=>[h,0]));let orders=0,unslotted=0,madeN=0;
  const sl=o=>{const [h]=o.slot.split("–")[0].split(":").map(Number);return (o.id%6===0)?Math.min(21,h+2):h};
  if(key===today||key===tom){App.data.orders.filter(o=>o.n===(key===today?0:1)&&o.status!=="cancelled").forEach(o=>{orders++;const h=sl(o);due[h]++;if(["ready","out","delivered"].includes(o.status)){made[h]++;madeN++}})}
  else{const d=T23_PRE.find(x=>p23key(x.date)===key);if(d){orders=d.orders;unslotted=Math.round(d.orders*0.12);let seed=d.days;const r=()=>{seed=(seed*9301+49297)%233280;return seed/233280};const w=hours.map(h=>h<9?0.3:h<13?1.4:h<17?1:h<20?.6:.2);const tw=w.reduce((a,b)=>a+b,0);let left=orders-unslotted;hours.forEach((h,i)=>{const n=i===hours.length-1?left:Math.min(left,Math.round(orders*w[i]/tw*(0.8+r()*0.4)));due[h]+=n;left-=n});due[12]+=unslotted}}
  let carried=0,firstB=null,worst=0,cap=0;const rows=hours.map(h=>{const fl=(key===today||key===tom||T23_SHIFTS.some(s=>p23key(s.date)===key))?p23floristsAt(key,h):(h>=8&&h<17?3:h>=13&&h<22?2:0)+(h>=13&&h<17?2:0);const capacity=fl*P23K.rate;cap+=capacity;const load=due[h]+carried;const remaining=Math.max(0,load-made[h]);const overflow=Math.max(0,remaining-capacity);if(overflow&&firstB===null)firstB=h;worst=Math.max(worst,overflow);const row={h,due:due[h],made:made[h],remaining,carriedIn:carried,florists:fl,capacity,overflow,bottleneck:overflow>0};carried=overflow;return row});
  return{rows,orders,unslotted,made:madeN,capacity:cap,remaining:orders-madeN,firstB,worst,max:Math.max(1,...rows.map(r=>Math.max(r.due+r.carriedIn,r.capacity)))};
}

    <div class="sec-head"><div class="h3">Bookings</div><span class="p23-hint">Paid first, then held</span></div>
    <div class="tbl-wrap mb16"><table class="tbl"><thead><tr><th>Booking</th><th>Customer</th><th class="num">Seats</th><th class="num">Paid</th><th>Status</th>${mgr?"<th></th>":""}</tr></thead><tbody>
    ${bks.length?bks.map(b=>`<tr class="r" onclick="P23_bookingNote('${b.ref}')"><td><b class="tnum" style="font-weight:500">${b.ref}</b><span class="sub">${b.source==="website"?"website":"by hand"}${b.movedFrom?" · moved from "+p23esc(b.movedFrom):""}${b.note?" · "+p23ic("info")+" note":""}</span></td><td>${p23esc(b.name)}<span class="sub">${b.phone?`<a href="tel:${b.phone.replace(/\s/g,"")}" onclick="event.stopPropagation()" class="tnum">${b.phone}</a>`:""}${b.phone&&b.email?" · ":""}${b.email?`<a href="mailto:${b.email}" onclick="event.stopPropagation()">${b.email}</a>`:""}</span></td><td class="num">${b.seats}</td><td class="num">${App.fmt(b.amount)}${b.promo?`<span class="sub">${b.promo} −${App.fmt(b.discount)}</span>`:""}${b.refund?`<span class="sub accent">refunded ${App.fmt(b.refund)}</span>`:""}</td><td>${stRow(b)}</td>${mgr?`<td style="text-align:right;white-space:nowrap">${b.status==="paid"?`<button class="textbtn" onclick="event.stopPropagation();P23_moveBooking('${b.ref}')">Move</button> `:""}${b.status==="paid"||b.status==="held"?`<button class="textbtn --accent" onclick="event.stopPropagation();P23_cancelBooking('${b.ref}')">Cancel booking</button>`:""}</td>`:""}</tr>`).join(""):`<tr><td colspan="6"><div class="empty">${p23ic("customers")}<div class="h3">No bookings yet</div></div></td></tr>`}
    </tbody></table></div>
    <!-- ids: PWDR-113 — purchase list from BOM × seats sold vs stock -->
    <div class="sec-head"><div class="h3">Purchase list</div><button class="textbtn" onclick="App.go('workshops-type',{id:${t.id}})">Materials per seat →</button></div>
    <div class="tbl-wrap mb16"><table class="tbl"><thead><tr><th>Item</th><th class="num">Per seat</th><th class="num">Need</th><th class="num">On hand</th><th class="num">Available</th></tr></thead><tbody>
    ${pl.length?pl.map(r=>`<tr class="${r.short?"--red":""}"><td><button class="link" onclick="App.go('stock',{open:${r.item.id}})">${p23esc(r.item.name)}</button>${r.short?`<span class="sub accent">short by ${r.short} ${r.item.unit}</span>`:""}</td><td class="num">${r.per}</td><td class="num">${r.need} ${r.item.unit}</td><td class="num">${r.item.qty}</td><td class="num ${r.short?"accent":""}">${r.available}</td></tr>`).join(""):`<tr><td colspan="5" class="muted">BOM not set – <button class="link" onclick="App.go('workshops-type',{id:${t.id}})">add the materials per seat</button></td></tr>`}
    </tbody></table></div>
    <!-- ids: PWDR-117 — waitlist -->
    <div class="sec-head"><div class="h3">Waitlist</div><span class="p23-hint">from floritta.uk · e-mailed when seats free up</span></div>
    ${s.waitlist.length?`<div class="list" style="border:1px solid var(--hair)">${s.waitlist.map(w=>`<div class="li" style="cursor:default"><div class="t"><b>${p23esc(w.name)} · seats: ${w.seats}</b><small>${p23esc(w.email)}${w.phone?" · "+w.phone:""}${w.told?" · told "+App.timeAgo(w.told)+" ago":""}</small></div>${w.told?`<span class="pill --ready">told</span>`:`<button class="btn --ghost --sm" onclick="App.toast('E-mail sent · seats available');T23_WSESS.find(x=>x.id===${s.id}).waitlist.find(x=>x.name==='${p23esc(w.name)}').told=App.NOW.toISOString();p23WssRender()">Tell them now</button>`}</div>`).join("")}</div>`:`<div class="muted sm">Nobody is waiting</div>`}
   </div>
   <div class="col" style="gap:16px">
    <!-- ids: PWDR-114 — prep checklist (switches for everyone with workshops.view) -->
    <div><div class="sec-head"><div class="h3">Prep checklist</div></div><div class="p23-prep ${lvl?"--"+lvl:""}">${prepRow("ordered","Materials ordered")}${prepRow("received","Materials received")}${prepRow("benches","Benches ready")}</div></div>
    <!-- ids: PWDR-115 — host select writes «Workshop HH:MM–HH:MM» into the Florists schedule -->
    <div id="p23-host"><div class="sec-head"><div class="h3">Host</div></div>${mgr?`<div class="field"><select class="select" onchange="P23X.host=this.value;p23WssRender();document.getElementById('p23-host').scrollIntoView()"><option value="">Not set</option>${App.data.staff.filter(x=>x.role==="florist").map(x=>`<option value="${x.id}" ${(P23X.host??s.host)===x.id?"selected":""}>${p23esc(x.n)}</option>`).join("")}</select><span class="p23-hint">Writes «Workshop ${s.start}–${p23endTime(s)}» into the florist's schedule for that day.</span><div><button class="btn --sm" ${P23X.host!==null&&P23X.host!==(s.host||"")?"":"disabled"} onclick="P23_hostSave()">Save</button></div></div>`:`<div class="sm">Host: ${s.host?p23esc(App.user(s.host).n):"not set"}</div>`}</div>
    <!-- ids: PWDR-116 PWDR-189 — complete & write off (confirm); in the new design disabled before the session day -->
    <div><div class="sec-head"><div class="h3">Stock</div></div>${s.stockWrittenOffAt?`<div class="note-box --ok">${p23ic("check")} Completed, stock written off ${p23day(s.stockWrittenOffAt)}</div>`:mgr?`<button class="btn --secondary --block" ${s.status==="cancelled"||days>0?"disabled":""} onclick="P23_complete()">${p23ic("box")} Complete &amp; write off stock</button><div class="p23-hint mt8">${s.status==="cancelled"?"Cancelled session – nothing to write off.":days>0?`Available from the session day (${p23day(s.date)}).`:`Writes BOM × ${sold} seats off the stock and marks the session completed.`}</div>`:`<div class="sm muted">Not written off yet</div>`}</div>
   </div>
  </div>`;
}
function p23purchaseList(s){const t=p23wtype(s.typeId),sold=p23seatsSold(s);return t.bom.map(([iid,per])=>{const item=App.data.inventory.find(i=>i.id===iid);const need=Math.ceil(per*sold);const others=T23_WSESS.filter(x=>x.id!==s.id&&x.status==="scheduled"&&p23daysTo(x.date)>=0&&p23wtype(x.typeId).bom.some(b=>b[0]===iid)).reduce((a,x)=>a+Math.ceil((p23wtype(x.typeId).bom.find(b=>b[0]===iid)[1])*p23seatsSold(x)),0);const available=item.qty-others;return{item,per,need,available,short:Math.max(0,need-available)}})}
function P23_prep(k){const s=p23wsess(P23X.id);s.prep[k]=s.prep[k]?null:{by:App.me().id,at:App.NOW.toISOString()};p23WssRender()}
function P23_hostSave(){const s=p23wsess(P23X.id);s.host=P23X.host||null;P23X.host=null;App.toast("Host saved – schedule updated");p23WssRender()}
function P23_complete(){const s=p23wsess(P23X.id);const n=p23seatsSold(s);App.confirm("Complete the session?",`Write the materials for ${n} seat${n===1?"":"s"} off the stock and mark the session completed?`,"Complete & write off",()=>{if(s.stockWrittenOffAt){App.toast("Stock was already written off");return}s.stockWrittenOffAt=App.NOW.toISOString();s.status="completed";p23purchaseList(s).forEach(r=>{r.item.qty=Math.max(0,r.item.qty-r.need)});App.toast("Workshop completed, stock written off");p23WssRender()})}
function P23_bookingNote(ref){const s=p23wsess(P23X.id),b=s.bookings.find(x=>x.ref===ref);App.sheet({eyebrow:"Booking "+b.ref,title:p23esc(b.name),narrow:true,body:`<dl class="kv"><dt>Source</dt><dd>${b.source==="website"?"Website":"By hand"}</dd><dt>Seats</dt><dd>${b.seats}</dd><dt>Paid</dt><dd>${App.fmt(b.amount)}${b.paidAt?" · "+p23day(b.paidAt):""}</dd><dt>Status</dt><dd>${b.status}</dd>${b.refund?`<dt>Refund</dt><dd class="accent">${App.fmt(b.refund)} · recorded, made by hand in Stripe</dd>`:""}<dt>Note</dt><dd>${b.note?p23esc(b.note).replace(/\n/g,"<br>"):"<span class='muted'>–</span>"}</dd></dl>`})}
/* ids: PWDR-100 PWDR-188 — manual booking: confirmed + paid at once, no e-mail, no Stripe; amount = price × seats for open, flat for private (fix) */
function P23_addBooking(){const s=p23wsess(P23X.id);const left=s.places-p23seatsSold(s)-p23seatsHeld(s);const amt=n=>s.kind==="private"?s.price:s.price*n;
  App.modal({title:"Add booking",body:`<div class="grid g2"><div class="field"><label>Name *</label><input class="input" id="ab-name" placeholder="Full name"></div><div class="field"><label>Phone</label><input class="input" id="ab-phone" placeholder="+44 7700 900…"></div><div class="field"><label>E-mail</label><input class="input" id="ab-email"></div><div class="field"><label>Seats</label><input class="input tnum" id="ab-seats" type="number" min="1" max="50" value="1" oninput="document.getElementById('ab-amt').value=(${s.kind==="private"?s.price:s.price}*(${s.kind==="private"?1:"Number(this.value)||1"}))"></div><div class="field"><label>Amount paid</label><input class="input tnum" id="ab-amt" type="number" value="${amt(1)}"><span class="p23-hint">${s.kind==="private"?"Flat price for the whole session":"price × seats"}</span></div><div class="field"><label>Note</label><input class="input" id="ab-note" placeholder="e.g. booked on WhatsApp, paid by bank transfer"></div></div><div class="note-box mt16">Manual bookings are confirmed and marked paid right away – no e-mail, no Stripe. Seats left: ${left}.</div><div class="p23-err mt8" id="ab-err"></div>`,
    foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="P23_addBookingGo(${left})">Add booking</button>`,onMount:b=>setTimeout(()=>b.querySelector("#ab-name")?.focus(),60)})}
function P23_addBookingGo(left){const g=id=>document.getElementById(id).value;const s=p23wsess(P23X.id);const seats=Number(g("ab-seats"))||1;if(!g("ab-name").trim()){document.getElementById("ab-err").textContent="Name is required";return}if(s.status!=="scheduled"){document.getElementById("ab-err").textContent="This session is not open for bookings";return}if(seats>left){document.getElementById("ab-err").textContent=`Only ${left} seat${left===1?"":"s"} left`;return}const ref="WS-"+(2060+s.bookings.length+Math.floor(Math.random()*9));s.bookings.push({ref,source:"manual",name:g("ab-name").trim(),phone:g("ab-phone"),email:g("ab-email"),seats,amount:Number(g("ab-amt"))||0,status:"paid",promo:"",discount:0,refund:0,stripe:false,movedFrom:"",note:g("ab-note"),paidAt:App.NOW.toISOString()});App.closeModal();App.toast("Booking "+ref+" added");p23WssRender()}
/* ids: PWDR-111 — move a paid booking to another scheduled session with enough seats; waitlist e-mailed; empty private session auto-cancelled */
function P23_moveBooking(ref){const s=p23wsess(P23X.id),b=s.bookings.find(x=>x.ref===ref);const targets=T23_WSESS.filter(x=>x.id!==s.id&&x.status==="scheduled"&&p23daysTo(x.date)>=0&&x.places-p23seatsSold(x)-p23seatsHeld(x)>=b.seats);
  App.modal({title:"Move booking "+ref,body:targets.length?`<div class="field"><label>Move to</label><select class="select" id="mv-to">${targets.map(x=>`<option value="${x.id}">${p23esc(p23wtype(x.typeId).name)} · ${p23day(x.date)} ${x.start} – Seats left: ${x.places-p23seatsSold(x)-p23seatsHeld(x)}</option>`).join("")}</select></div><div class="note-box mt16">Freed seats are offered to the waitlist by e-mail. An empty private session is cancelled automatically.</div>`:`<div class="empty">${p23ic("calendar")}<div class="sm">No upcoming session has ${b.seats} free seat${b.seats===1?"":"s"}</div></div>`,
    foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button>${targets.length?`<button class="btn --sm" onclick="P23_moveGo('${ref}',Number(document.getElementById('mv-to').value))">Move</button>`:""}`})}
function P23_moveGo(ref,to){const s=p23wsess(P23X.id),t=p23wsess(to);const i=s.bookings.findIndex(x=>x.ref===ref);const [b]=s.bookings.splice(i,1);b.movedFrom=p23day(s.date);t.bookings.push(b);App.closeModal();if(s.waitlist.length)App.toast("Waitlist e-mailed · seats available");if(s.kind==="private"&&!p23seatsSold(s))s.status="cancelled";App.go("workshops-session",{id:to});App.toast("Booking "+ref+" moved")}
/* ids: PWDR-112 PWDR-190 — cancel booking: refund policy, refund recorded only (made by hand in Stripe), note, waitlist e-mails */
function P23_cancelBooking(ref){const s=p23wsess(P23X.id),b=s.bookings.find(x=>x.ref===ref);const d=p23daysTo(s.date);const full=d>=7;const def=full?b.amount:0;
  App.modal({title:"Cancel booking "+ref,body:`<div class="note-box ${full?"--ok":"--warn"} mb16">${full?"7+ days before the session – full refund.":"Less than 7 days before – offer to move to another session; refund at your discretion."}</div><div class="grid g2"><div class="field"><label>Refund</label><input class="input tnum" id="cb-ref" type="number" min="0" max="${b.amount}" value="${def}"><span class="p23-hint">Make the refund in Stripe by hand – this only records it (max ${App.fmt(b.amount)}).</span></div><div class="field"><label>Note</label><input class="input" id="cb-note" placeholder="Why"></div></div>${b.stripe?`<div class="mt8"><button class="textbtn" onclick="App.toast('Opens the payment in Stripe (new tab)')">Open the payment in Stripe ↗</button></div>`:""}`,
    foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Keep booking</button><button class="btn --accent --sm" onclick="P23_cancelGo('${ref}')">Cancel booking</button>`})}
function P23_cancelGo(ref){const s=p23wsess(P23X.id),b=s.bookings.find(x=>x.ref===ref);if(b.status!=="paid"&&b.status!=="held"){App.closeModal();App.toast("This booking is not active");return}b.refund=Math.min(b.amount,Number(document.getElementById("cb-ref").value)||0);const n=document.getElementById("cb-note").value;b.note=(b.note?b.note+"\n":"")+"Cancelled "+p23day(App.NOW.toISOString())+(n?" – "+n:"");b.status="cancelled";if(b.promo)App.toast("Promo code use returned");App.closeModal();if(s.waitlist.length)App.push("Waitlist e-mailed",p23esc(p23wtype(s.typeId).name)+" · "+b.seats+" seat(s) free",{icon:"mail"});if(s.kind==="private"&&!p23seatsSold(s))s.status="cancelled";App.toast("Booking "+ref+" cancelled");p23WssRender()}

/* ===================== 23 · WORKSHOPS · TYPE ===================== */
const P23T={id:1,f:null,q:"",err:null};
window.mount_workshops_type=function(params){params=params||{};const t=p23wtype(params.id||P23T.id);P23T.id=t.id;P23T.f={name:t.name,price:t.price,flat:t.flat,places:t.places,len:t.len,active:t.active,bom:t.bom.map(b=>b.slice())};P23T.q="";P23T.err=null;p23WtRender()};
function p23WtRender(){
  const t=p23wtype(P23T.id),f=P23T.f,mgr=p23wsMgr();const dis=mgr?"":"disabled";
  App.$("#p23-wt-head").innerHTML=`<button class="btn --ghost --sm" onclick="App.go('workshops')">${p23ic("back")} Workshops</button><div><div class="h3">${p23esc(t.name)}</div><div class="p23-hint">Defaults for new sessions and the materials one seat uses${mgr?"":" · read-only for your role"}</div></div>`;
  const q=P23T.q.trim().toLowerCase();const hits=q.length>=2?App.data.inventory.filter(i=>i.name.toLowerCase().includes(q)&&!f.bom.some(b=>b[0]===i.id)).slice(0,8):[];
  const lineErr=f.bom.map(b=>b[1]>0?"":"Quantity per seat must be above 0");
  App.$("#p23-wt-body").innerHTML=`<fieldset ${dis} style="border:0;padding:0;margin:0;min-width:0">
  <div class="sec-head"><div class="h3">Defaults</div></div>
  <div class="p23-wform mb16">
    <div class="field"><label>Name</label><input class="input" value="${p23esc(f.name)}" onchange="P23T.f.name=this.value"></div>
    <div class="field"><label>Places</label><input class="input tnum" type="number" min="1" max="100" value="${f.places}" onchange="P23T.f.places=Number(this.value)"></div>
    <div class="field"><label>Price per seat</label><input class="input tnum" type="number" value="${f.price}" onchange="P23T.f.price=Number(this.value)"></div>
    <div class="field"><label>Private session price (flat)</label><input class="input tnum" type="number" value="${f.flat}" onchange="P23T.f.flat=Number(this.value)"></div>
    <div class="field"><label>Length, minutes</label><input class="input tnum" type="number" min="15" max="720" value="${f.len}" onchange="P23T.f.len=Number(this.value)"></div>
    <div class="field"><label>Private sessions bookable online</label><div class="row"><span class="switch ${f.active?"on":""}" onclick="${mgr?"P23T.f.active=!P23T.f.active;p23WtRender()":""}"></span><span class="sm">${f.active?"Shown on floritta.uk":"Hidden from the site"}</span></div></div>
  </div>
  <!-- ids: PWDR-122 PWDR-123 PWDR-124 — BOM lines, Add material search, Save rewrites the BOM -->
  <div class="sec-head"><div class="h3">Materials per seat</div><span class="p23-hint">What ONE seat uses – the purchase list and the write-off multiply it by seats sold</span></div>
  <div class="tbl-wrap p23-bom mb16"><table class="tbl"><thead><tr><th>Material</th><th class="num">Per seat</th><th>Unit</th>${mgr?"<th></th>":""}</tr></thead><tbody>
  ${f.bom.length?f.bom.map((b,i)=>{const it=App.data.inventory.find(x=>x.id===b[0]);return `<tr><td>${p23esc(it.name)}${lineErr[i]?`<span class="sub accent">${lineErr[i]}</span>`:""}</td><td class="num"><input class="input tnum" type="number" step="0.001" min="0" value="${b[1]}" ${dis} onchange="P23T.f.bom[${i}][1]=Number(this.value);p23WtRender()"></td><td class="muted">${it.unit} / seat</td>${mgr?`<td style="text-align:right"><button class="ib" title="Remove" onclick="P23T.f.bom.splice(${i},1);p23WtRender()">${p23ic("close")}</button></td>`:""}</tr>`}).join(""):`<tr><td colspan="4" class="muted">BOM not set – add the materials per seat</td></tr>`}
  </tbody></table></div>
  ${mgr?`<div class="p23-dd" style="max-width:420px"><div class="field"><label>Add material</label><input class="input" placeholder="Type 2+ letters of a stock item…" value="${p23esc(P23T.q)}" oninput="P23T.q=this.value;p23WtRender();this.focus();this.setSelectionRange(this.value.length,this.value.length)"></div>${hits.length?`<div class="dd">${hits.map(i=>`<button onclick="P23T.f.bom.push([${i.id},1]);P23T.q='';p23WtRender()"><span>${p23esc(i.name)}</span><small>${i.unit} · ${i.qty} on hand</small></button>`).join("")}</div>`:q.length>=2?`<div class="dd"><button disabled><span class="muted">Nothing matches</span></button></div>`:""}</div>`:""}
  </fieldset>
  ${P23T.err?`<div class="p23-err mt16">${P23T.err}</div>`:""}
  ${mgr?`<div class="btn-row mt24"><button class="btn" onclick="P23_wtSave()">${p23ic("check")} Save</button><span class="p23-hint">Rewrites the materials list – changes the purchase list and future write-offs of every session of this type.</span></div>`:""}`;
}
function P23_wtSave(){const f=P23T.f;if(f.bom.some(b=>!(b[1]>0))){P23T.err="Fix the quantities per seat first (must be above 0).";p23WtRender();return}if(!f.name.trim()){P23T.err="Name is required";p23WtRender();return}const t=p23wtype(P23T.id);Object.assign(t,{name:f.name,price:f.price,flat:f.flat,places:f.places,len:f.len,active:f.active,bom:f.bom.map(b=>b.slice())});P23T.err=null;App.toast("Workshop type saved");p23WtRender()}
</script>
