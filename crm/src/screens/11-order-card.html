<style>
/* ===== 11 · Order card (scoped #s-order-card) ===== */
#s-order-card .oc-wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
#s-order-card .oc-main,#s-order-card .oc-side{min-width:0;display:flex;flex-direction:column;gap:16px}
#s-order-card .sec{border:1px solid var(--hair);background:var(--paper);min-width:0}
#s-order-card .sec.--accent{border-color:var(--accent)}
#s-order-card .sec.--ok{border-color:var(--ok)}
#s-order-card .sec.--warn{border-color:var(--warn)}
#s-order-card .sec>.sh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--hair);min-height:44px;flex-wrap:wrap}
#s-order-card .sec>.sh .h4{flex:1;min-width:0}
#s-order-card .sec>.sb{padding:14px}
#s-order-card .sec>.sb.--flush{padding:0}
#s-order-card .fg{display:grid;gap:12px}
#s-order-card .fg.--2{grid-template-columns:repeat(2,minmax(0,1fr))}
#s-order-card .fg.--3{grid-template-columns:repeat(3,minmax(0,1fr))}
#s-order-card .hint{font-size:12px;color:var(--grey);line-height:1.4}
#s-order-card .hint.--accent{color:var(--accent)}
#s-order-card .hint.--ok{color:var(--ok)}
#s-order-card .sticker{background:var(--warn-bg);padding:10px 12px;font-size:13.5px;color:var(--ink);line-height:1.4}
#s-order-card .ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
#s-order-card .ph{position:relative;min-width:0}
#s-order-card .ph .photo{cursor:zoom-in}
#s-order-card .ph .x{position:absolute;top:6px;right:6px;width:28px;height:28px;background:var(--paper);display:grid;place-items:center;border:1px solid var(--hair)}
#s-order-card .ph .x svg{width:14px;height:14px}
#s-order-card .ph .cap{margin-top:6px}
#s-order-card .drop{border:1px dashed var(--light);padding:16px;text-align:center;color:var(--grey);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
#s-order-card .drop:hover,#s-order-card .drop.--on{border-color:var(--sel);color:var(--ink);background:var(--silver)}
#s-order-card .chat{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
#s-order-card .bubble{max-width:82%;padding:8px 12px;font-size:13.5px;background:var(--silver);align-self:flex-start}
#s-order-card .bubble.--me{align-self:flex-end;background:var(--sel-bg)}
#s-order-card .bubble small{display:block;font-size:11px;color:var(--grey);margin-top:3px}
#s-order-card .ro .input,#s-order-card .ro .select,#s-order-card .ro .textarea{background:var(--silver);border-color:transparent;pointer-events:none}
#s-order-card .ro .chip,#s-order-card .ro .switch,#s-order-card .ro .check{pointer-events:none;opacity:.7}
#s-order-card .flagbtn{border:1px dashed var(--accent);color:var(--accent);padding:10px 14px;width:100%;display:flex;gap:8px;align-items:center;font-size:13px;text-align:left}
#s-order-card .flagbtn:hover{background:var(--accent-bg)}
#s-order-card .money{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px 12px;align-items:center;font-size:13.5px}
#s-order-card .money .input{text-align:right}
#s-order-card .money .tot{font-family:var(--f-display);font-size:28px;font-weight:300;text-align:right}
#s-order-card .money .lbl2{display:flex;align-items:center;gap:8px}
#s-order-card .sticky-foot{z-index:5;margin-top:0}
#s-order-card .oc-tabs{position:sticky;top:calc(var(--pad)*-1);z-index:4;background:var(--paper);margin:0 calc(var(--pad)*-1) 16px;padding:0 var(--pad)}
#s-order-card .oc-tabs .views{margin-bottom:0}
#s-order-card .items td{white-space:normal}
#s-order-card .items .input{height:30px;padding:0 6px}
#s-order-card .items input[type=number]{-moz-appearance:textfield}
#s-order-card .items input::-webkit-inner-spin-button{display:none}
#s-order-card .steps .tl{padding:8px 0 12px}
#s-order-card .kv{grid-template-columns:120px minmax(0,1fr)}
#s-order-card .kv dd.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#s-order-card .cl .li{cursor:default}
#s-order-card .cl .li:hover{background:transparent}
#s-order-card .ver{display:inline-flex;align-items:center;gap:6px}
#s-order-card .poll{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
#s-order-card .poll .dot{width:6px;height:6px}
#s-order-card .link.--n{text-transform:none;letter-spacing:0;font-size:13px}
#s-order-card .banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--hair);font-size:13px;line-height:1.4;margin-bottom:10px}
#s-order-card .banner.--accent{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
#s-order-card .banner.--warn{border-color:transparent;background:var(--warn-bg);color:var(--warn)}
#s-order-card .banner.--ok{border-color:transparent;background:var(--ok-bg);color:var(--ok)}
#s-order-card .banner svg{flex:none;margin-top:1px}
#s-order-card .banner b{font-weight:500}
#s-order-card .h-sub{font-size:12px;color:var(--grey)}
#s-order-card .field label.check{font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink)}
[data-size="ipad"] #s-order-card .oc-wrap{grid-template-columns:minmax(0,1fr) 300px}
[data-size="ipad"] #s-order-card .fg.--3{grid-template-columns:repeat(2,minmax(0,1fr))}
[data-size="phone"] #s-order-card .oc-wrap{grid-template-columns:minmax(0,1fr)}
[data-size="phone"] #s-order-card .fg.--2,[data-size="phone"] #s-order-card .fg.--3{grid-template-columns:minmax(0,1fr)}
[data-size="phone"] #s-order-card .oc-tabs{top:-14px;margin:0 -14px 12px;padding:0 14px;overflow-x:auto}
[data-size="phone"] #s-order-card .scr-head .h-sub{display:none}
</style>

 clearInterval(O11.pollT);O11.pollLeft=60;O11.pollT=setInterval(()=>{if(!document.getElementById("s-order-card").classList.contains("on"))return;if(O11.dirty||O11.saving||document.getElementById("modal").classList.contains("on"))return;O11.pollLeft--;if(O11.pollLeft<=0){O11.pollLeft=60;O11.renderSide();O11.renderBanners()}const el=document.getElementById("oc-poll");if(el)el.textContent="Auto-refresh · "+O11.pollLeft+" s"},1000);

 menu(ev){const o=O11.o();App.pop(ev,[{t:"Open as board sheet",ic:"orders",fn:()=>App.openOrder(o.id)},{t:"Open customer",ic:"user",fn:()=>O11.mgr()?App.openCustomer(o.customer):App.toast("Customer card · manager only")},{t:"Print work card",ic:"printer",fn:()=>App.toast("Work card opened in a new tab")},{t:"Duplicate order",ic:"copy",fn:()=>{const n=App.addOrder({customer:o.customer,product:o.product,size:o.size,total:o.total,chan:"Phone"});App.toast("#"+n.id+" created");App.go("order-card",{id:n.id})}},"-",{t:"Delete order",ic:"trash",cls:"--accent",fn:()=>O11.del()}])},

 /* ---- banners: ORDC-005..009 ORDC-012 ORDC-013 ORDC-030 ORDC-091 ---- */
 renderBanners(){const A=App,d=O11.d,s=O11_st(),ic=A.icon,E=O11.E;let h="";
  const B=(cls,icn,t)=>`<div class="banner ${cls}">${ic(icn)}<div>${t}</div></div>`;
  if(d.alcohol){h+=B("--accent","alert",`<b>ALCOHOL – Challenge 25, sealed container.</b> Card payment only. ${d.hold?`<div class="mt8"><b>Assembly from 08:00</b> – assembly and dispatch are blocked between 22:00 and 08:00 London time (licence hours). <button class="textbtn --accent" onclick="O11.alcoholModal()">what happens if I try</button></div>`:""}`);
   h+=B("","check",`Buyer confirmed 18+ at checkout: <b>Mon 19 Oct · 21:14</b>`);
   h+=d.cardMismatch?B("--accent","card",`<b>Name on the card did not match the buyer:</b> card “J. Barrington”, order “Oliver Barrington”. Licence condition 340 – check ID at the door and note who received it.`):B("","card",`Name on the payment card matches the buyer.`)}
  if(d.pets)h+=B("--accent","alert",`<b>The recipient has pets at home.</b> This order contains flowers toxic to cats and dogs: <b>Lilies · Eucalyptus</b>. Offer a swap before it goes out – <button class="textbtn --accent" onclick="O11.swapModal()">swap a stem</button>.`);
  if(d.noMethod)h+=B("--accent","truck",`<b>This order has no delivery or collection method.</b> The board keeps it in Ready until a method is chosen below.`);
  if(d.overpaid)h+=B("--warn","pound",`<b>Overpayment / Переплата: ${A.fmt(18)}</b> – paid more than the order total. Record it to refund in Money → Refunds, or adjust the total and Save.`);
  document.getElementById("oc-banners").innerHTML=h},
 alcoholModal(){App.modal({title:"Alcohol: outside licensed hours",body:`This order contains alcohol. Assembly and dispatch are only allowed <b>08:00–22:00</b> London time (Licensing Act). The status change was refused by the server – there is no override.`,foot:`<button class="btn --sm" onclick="App.closeModal()">OK</button>`})},

 /* ---- tabs ---- */
 renderTabs(){const s=O11_st(),d=O11.d;const n={photos:(s.approval.some(e=>e.k==="reply"&&!e.ack)&&d.approval?1:0),money:(s.payment!=="paid"?1:0)+(d.refundReq?s.refundReqs.filter(r=>r.outcome==="open").length:0),issues:(d.complaint?s.issues.length:0)+(d.bproblem?s.bproblems.length:0),delivery:(d.marketplace?1:0)+(d.uber?1:0)+(d.dpd?1:0)};
  const T=[["order","Order"],["photos","Photos"],["money","Money"],["issues","Issues"],["delivery","Delivery"],["activity","Activity"]];
  document.getElementById("oc-tabs").innerHTML=`<div class="views">${T.map(t=>`<button class="${O11.tab===t[0]?"on":""}" onclick="O11.go('${t[0]}')">${t[1]}${n[t[0]]?`<span class="n ${t[0]==="issues"||t[0]==="photos"?"accent":""}">${n[t[0]]}</span>`:""}</button>`).join("")}<span class="sp"></span><span class="hint" style="align-self:center">Esc closes dialogs · Enter in a caption saves it · N new order</span></div>`},
 go(t){O11.tab=t;O11.renderTabs();O11.renderMain();document.querySelector("#s-order-card .scr-body").scrollTop=0},

 sec(title,body,o={}){const tag=o.mode==="auto"?`<span class="tag --line" title="This panel saves on its own – the Save bar does not touch it">Saves itself</span>`:o.mode==="form"?`<span class="tag" title="Saved by “Save changes” at the bottom">With form</span>`:"";
  return `<div class="sec ${o.cls||""}" id="${o.id||""}"><div class="sh"><div class="h4">${title}${o.sub?` <span class="muted sm" style="font-weight:300">${o.sub}</span>`:""}</div>${tag}${o.head||""}</div><div class="sb ${o.flush?"--flush":""}">${body}</div></div>`},

 renderMain(){const m=document.getElementById("oc-main");const t=O11.tab;const ro=O11.mgr()?"":"ro";
  if(t==="order")m.innerHTML=`<div class="${ro}">${O11.secOrder()}${O11.secProducts()}${O11.secBuyer()}${O11.secFulfil()}${O11.secNotes()}</div>`;
  else if(t==="photos")m.innerHTML=O11.secApproval()+O11.secFinished()+O11.secRefs();
  else if(t==="money")m.innerHTML=`<div class="${ro}">${O11.secPayments()}</div>${O11.secRefunds()}${O11.secRefundReq()}`;
  else if(t==="issues")m.innerHTML=O11.secComplaint()+O11.secBProblem()+O11.secShowcase()+O11.secSurvey();
  else if(t==="delivery")m.innerHTML=O11.secMarket()+O11.secUber()+O11.secDpd()+O11.secAddrNotes()+(!O11.d.marketplace&&!O11.d.uber&&!O11.d.dpd&&!O11.d.addrNotes?`<div class="empty">${App.icon("truck")}<div class="h3">${O11_st().method==="collection"?"Collection – nothing to dispatch":"Nothing external on this delivery"}</div><div class="sm">Marketplace, Uber courier, DPD and address notes appear here when they apply (delivery only) · turn them on in Demo states</div></div>`:"");
  else m.innerHTML=O11.secAttribution()+O11.secChat()+O11.secTimeline()+O11.secDelete();
  if(!O11.mgr()&&(t==="order"||t==="money"))m.insertAdjacentHTML("afterbegin",`<div class="note-box mb16">${App.icon("lock")} Read-only for florists: the form is shown but only a manager can save it (server requires orders.manage). Stem swaps, photos, flags and complaints still work.</div>`)},

 /* ---- Order details: ORDC-014..018 ---- */
 secOrder(){const s=O11_st(),E=O11.E;
  return O11.sec("Order details",`<div class="fg --3">
   <div class="field"><label>Type</label><div class="chips"><button class="chip ${s.type==="gift"?"on":""}" onclick="O11.set('type','gift');O11.renderMain()">Gift</button><button class="chip ${s.type==="self"?"on":""}" onclick="O11.set('type','self');O11.renderMain()">Self</button></div></div>

   <div class="field"><label>Occasion</label><select class="select" onchange="O11.set('occasion',this.value);if(this.value!=='Other')O11_st().occCustom='';O11.renderMain()">${O11_OCC.map(c=>`<option ${c===s.occasion?"selected":""}>${c}</option>`).join("")}</select>${s.occasion==="Other"?`<input class="input mt8" maxlength="120" placeholder="Custom occasion" value="${E(s.occCustom)}" oninput="O11.set('occCustom',this.value)">`:""}${s.occasion==="None"?`<div class="hint">${App.icon("sparkle")} From the card: <b>Birthday</b> (mum) – read by AI from the card text. <button class="textbtn" onclick="O11.set('occasion','Birthday');O11.renderMain()">use it</button></div>`:""}</div>

 /* ---- Products: ORDC-019..028 ---- */
 secProducts(){const s=O11_st(),E=O11.E,A=App,d=O11.d,ic=A.icon;const mgr=O11.mgr();
  const rows=s.items.map((it,i)=>{const built=d.built&&i===0;
   return `<tr><td style="width:52px"><div class="thumb --s" style="cursor:zoom-in" onclick="O11.lightbox('${it.img}','${E(s.note)}')">${it.img?`<img src="${it.img}" alt="">`:""}</div></td>
   <td>${built?`<b>Built bouquet</b><span class="sub">Built in the constructor: 12 × Rose Red Naomi · 5 × Eucalyptus · 3 × Ruscus · wrap ivory – composition is read-only, Qty and price hidden</span>`:`<input class="input" list="oc-prod" value="${E(it.name)}" placeholder="Type a product name…" oninput="O11.itemName(${i},this.value)"><span class="sub">${it.variant?"✓ From catalog":"No catalog match – saved as a custom item"}</span>`}</td>
   ${built?`<td colspan="3" class="muted">priced by live stock</td>`:`<td style="width:64px"><input class="input num" type="number" min="1" value="${it.qty}" oninput="O11.item(${i},'qty',+this.value)"></td><td style="width:100px"><input class="input num" value="${it.price}" oninput="O11.item(${i},'price',+this.value||0)"></td><td class="num tnum" style="width:80px">${A.fmt(it.qty*it.price)}</td>`}
   <td style="width:80px">${s.items.length>1&&mgr?`<button class="textbtn --accent" onclick="O11.removeItem(${i})">Remove</button>`:""}</td></tr>`}).join("");
  const pref=!d.built?`<div class="hint mb8">Customer's choice if a flower is unavailable on the day: closest match / <b>contact me</b></div>`:"";
  const log=d.subs||d.built?`<div class="mt16"><div class="caps mb8">Substitution log</div><div class="list" style="border:1px solid var(--hair)">${s.subs.map(x=>`<div class="li" style="cursor:default"><div class="t"><b>${E(x.stem)} → ${x.to?E(x.to):"left out"} ×${x.n}</b><small>${E(A.user(x.who).n)} · ${x.at} · ${E(x.why)}</small></div></div>`).join("")||`<div class="li" style="cursor:default"><div class="t"><small>No swaps yet</small></div></div>`}</div></div>`:"";
  const may=["queue","making","photo","ready","out"].includes(O11.o().status);
  return O11.sec("Products",`${pref}<datalist id="oc-prod">${A.data.products.slice(0,12).map(p=>`<option value="${E(p.name)}">${A.fmt(p.price)}</option>`).join("")}</datalist>
   <div class="tbl-wrap --flush"><table class="tbl items"><thead><tr><th></th><th>Product</th><th>Qty</th><th>Unit price</th><th class="num">Line</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="row mt8" style="gap:8px;flex-wrap:wrap">${mgr?`<button class="btn --ghost --sm" onclick="O11.addItem()">${ic("plus")} Add product</button>`:""}${may?`<button class="btn --ghost --sm" onclick="O11.swapModal()">${ic("refresh")} Swap a stem</button>`:`<span class="hint">Stem swaps are closed once the order is delivered or cancelled</span>`}<span class="hint">Remove is only offered while more than one line is left; removal goes with Save.</span></div>${log}`,{mode:"form",sub:"lines go with Save · swaps save themselves"})},
 itemName(i,v){const s=O11_st();s.items[i].name=v;s.items[i].variant=!!App.data.products.find(p=>p.name===v);O11.mark();const sub=document.querySelectorAll("#s-order-card .items .sub")[i];if(sub)sub.textContent=s.items[i].variant?"✓ From catalog":"No catalog match – saved as a custom item"},
 item(i,k,v){O11_st().items[i][k]=v;O11.mark();O11.renderMain()},
 addItem(){O11_st().items.push({id:Date.now(),name:"",qty:1,price:0,variant:false,img:""});O11.mark();O11.renderMain()},
 removeItem(i){O11_st().items.splice(i,1);O11.mark();O11.renderMain()},
 swapModal(){const s=O11_st(),E=O11.E;const pref=O11.d.pets?"contact_me":"closest_match";
  App.modal({title:"Swap a stem",wide:true,body:`<div class="note-box mb16">Customer's choice: <b>${pref==="contact_me"?"Contact me before swapping":"Closest match is fine"}</b> – ${pref==="contact_me"?"the customer must agree before the swap is recorded.":"you may swap without asking; the customer is told by this log."}</div>
   <div class="fg --2"><div class="field"><label>Stem in the bouquet</label><select class="select" id="sw-stem">${O11_STEMS.map(x=>`<option>${x}</option>`).join("")}</select></div>
   <div class="field"><label>Replace with</label><select class="select" id="sw-to"><option value="">Leave out – nothing in its place</option>${O11_STEMS.map(x=>`<option>${x}</option>`).join("")}</select><div class="hint">Refund-stem preference: no replacement field, the stem is only removed.</div></div>
   <div class="field"><label>Stems</label><input class="input" id="sw-n" type="number" min="1" max="12" value="2"><div class="hint">Not more than in the line (12)</div></div>
   <div class="field"><label>Why (the customer will be told)</label><input class="input" id="sw-why" placeholder="Peonies out of season"></div></div>
   ${pref==="contact_me"?`<label class="check mt16"><input type="checkbox" id="sw-agree"> The customer has agreed to this swap</label>`:""}`,
   foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="O11.swapSave('${pref}')">Record swap</button>`})},
 swapSave(pref){const g=document.getElementById("sw-agree");if(pref==="contact_me"&&g&&!g.checked){App.toast("Server refused: tick “The customer has agreed to this swap”");return}
  const why=document.getElementById("sw-why").value.trim();if(!why){App.toast("Why is required – the customer will be told");return}
  const s=O11_st();s.subs.push({stem:document.getElementById("sw-stem").value,to:document.getElementById("sw-to").value,n:+document.getElementById("sw-n").value||1,who:App.me().id,at:"Today "+App.fmtTime(App.NOW.toISOString()),why});O11.d.subs=true;App.closeModal();App.toast("Swap recorded · stock reservation re-synced · customer will be told");O11.renderMain()},

 /* ---- Buyer: ORDC-029 ---- */
 secBuyer(){const A=App,o=O11.o(),c=A.customer(o.customer),E=O11.E;
  return O11.sec("Buyer",`<dl class="kv"><dt>Name</dt><dd>${O11.mgr()?`<button class="link --n" onclick="App.openCustomer(${c.id})">${E(c.n)}</button>`:E(c.n)}${c.tags.map(t=>` <span class="tag ${t==="VIP"?"--ink":""}">${t}</span>`).join("")}</dd><dt>Phone</dt><dd><a class="tnum" href="#" onclick="event.preventDefault();App.toast('Calling via Ringover · ${E(c.phone)}')">${E(c.phone)}</a></dd><dt>Email</dt><dd><a href="#" onclick="event.preventDefault();App.toast('mailto: ${E(c.email)}')">${E(c.email)}</a></dd></dl><div class="hint mt8">Read-only – edited in Customers.${O11.mgr()?"":" Customer card link is for managers."}</div>`,{sub:"read-only"})},

 /* ---- Fulfilment: ORDC-030..042 ---- */
 secFulfil(){const s=O11_st(),E=O11.E,d=O11.d,A=App;
  const sw=(k,lbl,hint)=>`<div class="row" style="gap:10px;align-items:flex-start"><span class="switch ${s[k]?"on":""}" onclick="O11.set('${k}',!O11_st().${k});O11.renderMain()"></span><div><div class="sm">${lbl}</div><div class="hint">${hint}</div></div></div>`;
  return O11.sec("Fulfilment",`${d.noMethod?`<div class="note-box --accent mb16">This order has no delivery or collection method – choose one. The board keeps it in Ready until then.</div>`:""}
  <div class="fg --3">
   <div class="field"><label>Method</label><div class="chips"><button class="chip ${s.method==="delivery"&&!d.noMethod?"on":""}" onclick="O11.d.noMethod=false;O11.set('method','delivery');O11.render()">Delivery</button><button class="chip ${s.method==="collection"&&!d.noMethod?"on":""}" onclick="O11.d.noMethod=false;O11.set('method','collection');O11.render()">Collection</button></div></div>
   <div class="field"><label>Recipient name</label><input class="input" value="${E(s.recName)}" oninput="O11.set('recName',this.value)"><div class="hint">Changing the name pulls the recipient's “must not get” and address notes into the order notes on save.</div></div>
   <div class="field"><label>Recipient phone</label><input class="input tnum" value="${E(s.recPhone)}" oninput="O11.set('recPhone',this.value)"></div>
   <div class="field"><label>Recipient email</label><input class="input" value="${E(s.recEmail)}" placeholder="optional" oninput="O11.set('recEmail',this.value)"></div>
   <div class="field"><label>Email notifications</label><select class="select" onchange="O11.set('notify',this.value)">${[["sender","Sender only"],["recipient","Recipient only"],["both","Sender and recipient"],["none","Do not send"]].map(x=>`<option value="${x[0]}" ${s.notify===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div>
   <div class="field"><label>Fulfilment date</label><input class="input" type="date" value="${s.date}" onchange="O11.set('date',this.value);App.toast('Date change re-syncs the stock reservation on save')"></div>
   <div class="field"><label>Ship date</label><input class="input" type="date" value="${s.ship}" onchange="O11.set('ship',this.value)"><div class="hint">For parcels (DPD / Royal Mail / Evri) sent ahead of the fulfilment date. DPD sets it itself when booked.</div></div>
   <div class="field"><label>Slot</label><select class="select" onchange="O11.set('slotType',this.value);O11.renderMain()">${[["none","No slot"],["between","Between"],["before","Before"],["after","After"]].map(x=>`<option value="${x[0]}" ${s.slotType===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div>
   ${s.slotType==="none"?"":`<div class="field"><label>${s.slotType==="before"?"To":s.slotType==="after"?"From":"From / To"}</label><div class="row" style="gap:8px">${s.slotType!=="before"?`<input class="input tnum" value="${E(s.from)}" oninput="O11.set('from',this.value)">`:""}${s.slotType!=="after"?`<input class="input tnum" value="${E(s.to)}" oninput="O11.set('to',this.value)">`:""}</div><div class="hint">Server checks the minimum window width (delivery.slot.min_window_minutes).</div></div>`}
  </div>
  <div class="fg --2 mt16">
   ${sw("suppress","Do not send SMS &amp; email","Known gap: on an existing order this switch does nothing (UpdateOrder ignores it) – works only at creation. Decide in redesign.")}
   ${sw("anonAddr","Anonymous recipient – hide the address from the buyer","No address, map, tracking link or door photo goes to the buyer; Uber / DPD tracking links are hidden below.")}
   ${sw("anonSender","Anonymous sender – never tell the recipient who sent it","No buyer name in emails, WhatsApp or on the card.")}
   ${sw("photoOptOut","Do not send the bouquet photo to the buyer","Mutes the automatic finished-bouquet photo when the order goes Ready.")}
  </div>
  ${d.po?`<div class="field mt16" style="max-width:320px"><label>Customer order number (PO)</label><input class="input" value="${E(s.po)}" maxlength="64" oninput="O11.set('po',this.value)"><div class="hint">Shown only when the order already has a PO (corporate). Empty → cleared.</div></div>`:""}
  ${d.lilies?`<div class="note-box --accent mt16"><b>Lilies in the order – the card says the recipient must not get them.</b><label class="check mt8"><input type="checkbox" onchange="O11.set('allergyOverride',this.checked)"> The customer allowed lilies – save anyway</label><div class="hint --accent mt8">Kept on the order with your name and the time. Without the tick the server refuses to save (block mode); in default mode the order saves and a red warning toast appears.</div></div>`:""}`,{mode:"form"})},

 /* ---- Notes: ORDC-043..046 ---- */
 secNotes(){const s=O11_st(),E=O11.E,A=App,ic=A.icon;
  const cards=s.cards.length?s.cards.map((c,i)=>`<div class="row mb8" style="gap:8px;align-items:flex-start"><textarea class="textarea" style="min-height:56px;flex:1" oninput="O11_st().cards[${i}].t=this.value;O11.mark()">${E(c.t)}</textarea><div class="field" style="width:170px;flex:none"><label>For bouquet</label><select class="select" onchange="O11_st().cards[${i}].for=+this.value;O11.mark()"><option value="0">Whole order</option>${s.items.map((it,k)=>`<option value="${k+1}" ${c.for===k+1?"selected":""}>${E(it.name||"Line "+(k+1))}</option>`).join("")}</select></div>${O11.mgr()?`<button class="ib" title="Remove" onclick="O11_st().cards.splice(${i},1);O11.mark();O11.renderMain()">${ic("close")}</button>`:""}</div>`).join(""):`<div class="hint mb8">No card messages. Add one per bouquet – the first card mirrors to the gift message.</div>`;
  return O11.sec("Notes",`<div class="caps mb8">Card messages</div>${cards}${O11.mgr()?`<button class="btn --ghost --sm" onclick="O11_st().cards.push({t:'',for:0});O11.mark();O11.renderMain()">${ic("plus")} Add card message</button>`:""}<div class="hint mt8">Changing a card text queues occasion detection (AI).</div>
  <div class="fg --2 mt16"><div class="field"><label>Internal note</label>${s.note?`<div class="sticker"><textarea class="textarea" style="background:transparent;border:0;padding:0;min-height:48px" oninput="O11.set('note',this.value);O11.noteRuHide()">${E(s.note)}</textarea></div><div class="hint mt8" id="oc-noteru">Translation (RU): ${E(s.noteRu||"перевод готовится…")}</div>`:`<textarea class="textarea" placeholder="Becomes a yellow sticker once filled" oninput="O11.set('note',this.value)"></textarea>`}<div class="hint">Saved note is translated to Russian for the mobile app (TranslateOrderNoteJob).</div></div>
  <div class="field"><label>Courier / delivery instructions</label><textarea class="textarea" oninput="O11.set('courierNote',this.value);O11.courierHint(this.value)">${E(s.courierNote)}</textarea><div class="hint" id="oc-chint">${s.courierNote.length>280?`<span class="accent">An external courier (Uber) only sees the first 280 characters – put what matters first.</span>`:"Shared with the courier app and Uber (first 280 characters)."}</div></div></div>`,{mode:"form"})},
 noteRuHide(){const el=document.getElementById("oc-noteru");if(el)el.textContent="Translation hidden while the note is being edited – it refreshes after Save."},
 courierHint(v){const el=document.getElementById("oc-chint");if(el)el.innerHTML=v.length>280?`<span class="accent">An external courier (Uber) only sees the first 280 characters – put what matters first.</span>`:"Shared with the courier app and Uber (first 280 characters)."},

 /* ---- Client approval: ORDC-047..053 ORDC-156 ---- */
 secApproval(){const s=O11_st(),E=O11.E,A=App,ic=A.icon,d=O11.d;if(!d.approval)return O11.sec("Client approval",`<div class="hint">Appears once the florist sends a “photo before wrapping” from the app. Turn on in Demo states.</div>`,{mode:"auto"});
  const last=s.approval.filter(e=>e.k==="reply").slice(-1)[0];const pending=s.approval.some(e=>e.k==="reply"&&!e.ack);const approved=last&&last.verdict==="approved";
  const V={approved:["Approved","--done"],changes:["Changes requested","--late"],unclear:["Unclear","--review"]};
  const steps=s.approval.map((e,i)=>e.k==="photo"?`<div class="tl --on"><div class="row" style="gap:10px;align-items:flex-start"><div class="thumb --l" style="cursor:zoom-in" onclick="O11.gallery()"><img src="${e.img}" alt=""></div><div><b>${e.stage==="finished"?"Finished bouquet":"Photo before wrapping"}</b><small>${e.sent?"Sent to the customer via "+e.sent:"Saved on the order – the customer could not be reached"} · ${E(A.user(e.by).n)} · ${e.at}</small></div></div></div>`
   :`<div class="tl ${e.ack?"":"--accent"}"><div class="sticker"><div class="row" style="gap:8px;flex-wrap:wrap"><b>${E(e.who)} replied</b>${A.pill(V[e.verdict][1].slice(2),V[e.verdict][0])}</div>${e.img?`<div class="thumb --l mt8"><img src="${e.img}" alt=""></div>`:""}<div class="mt8">${e.text?E(e.text):"<i class='muted'>No text – see the picture</i>"}</div><div class="hint">${E(e.ru)}</div>
    ${e.edited?`<div class="hint mt8">edited by ${E(e.edited)} · <button class="textbtn" onclick="App.toast('Original: ${E(e.orig)}')">show original</button></div>`:""}

  const sub=s.items.reduce((x,i)=>x+i.qty*i.price,0);const disc=s.promo?Math.round(sub*.1):s.discount;const total=Math.max(0,sub+(s.free?0:s.delivery)+s.tip-disc);

   <span>Discount ${s.promo?`<span class="hint">computed from the promo code on save</span>`:""}</span>${mgr&&!s.promo?`<input class="input num" value="${s.discount}" oninput="O11.set('discount',+this.value||0)">`:`<span class="num" style="text-align:right">− ${A.fmt(disc)}</span>`}
   <span class="h4">Total</span><span class="tot">${A.fmt(total)}</span></div>
   <div class="hint mt8">Total = subtotal + delivery + tip − discount (not below 0). The server recomputes and ignores the client figure. Delivery at £0 without “Free delivery” is refused: “Enter the delivery fee on the order page, or mark the delivery as free.”</div>`;
  const links=mgr?`<div class="hr"></div><div class="caps mb8">Payment links</div><div class="row" style="gap:8px;flex-wrap:wrap"><input class="input num" style="width:120px" value="${s.linkAmount}" oninput="O11_st().linkAmount=+this.value||0;document.getElementById('oc-mklink').disabled=O11_st().linkAmount<0.5"><button class="btn --sm" id="oc-mklink" ${s.linkAmount<0.5?"disabled":""} onclick="O11.makeLink()">${ic("link")} Create link</button><span class="hint">Deposit if less than Total, otherwise full order. Amount is the Total at page open – it does not follow edits.</span></div>

  const assign=`<div class="hr"></div><div class="fg --2">
   <div class="field"><label>Payment</label>${mgr?`<select class="select" onchange="O11.set('payment',this.value)">${["paid","unpaid","refunded","partial"].map(x=>`<option value="${x}" ${s.payment===x?"selected":""}>${x.charAt(0).toUpperCase()+x.slice(1)}</option>`).join("")}</select><div class="hint">Moving to Paid sends “confirmed” to the customer's channel and credits the referral – once.</div>`:A.pill(s.payment)}</div>
   <div class="field"><label>Payment method</label>${mgr?`<select class="select" onchange="O11.set('payMethod',this.value)">${(d.alcohol?["card"]:["card","cash","bank transfer","other"]).map(x=>`<option value="${x}" ${s.payMethod===x?"selected":""}>${x.charAt(0).toUpperCase()+x.slice(1)}</option>`).join("")}</select>${d.alcohol?`<div class="hint --accent">Alcohol is card-payment only.</div>`:""}`:`<span class="sm">${E(s.payMethod)}</span>`}</div>
   <div class="field"><label>Assigned florist</label>${mgr?`<select class="select" onchange="O11.set('florist',this.value)"><option value="">Unassigned</option>${A.data.staff.filter(x=>x.role==="florist").map(x=>`<option value="${x.id}" ${s.florist===x.id?"selected":""}>${x.n}${x.on?"":" · off shift"}</option>`).join("")}</select>`:`<span class="sm">${s.florist?E(A.user(s.florist).n):"Unassigned"}</span>`}</div>

 makeLink(){const s=O11_st();const sub=s.items.reduce((x,i)=>x+i.qty*i.price,0)+s.delivery+s.tip;s.links.unshift({id:Date.now(),amount:s.linkAmount,status:"pending",url:"pay.floritta.uk/"+O11.id+"-"+s.links.length,purpose:s.linkAmount<sub?"deposit":"order"});O11.renderMain();App.toast("Stripe Checkout created · "+(s.linkAmount<sub?"deposit":"full order")+" · amount capped at the balance due")},
 extAssign(){const s=O11_st();const el=document.getElementById("oc-courier");if(s.courierTouched){App.toast("You changed the courier yourself – external assignment does not override it");return}s.courier="george";if(el)el.value="george";App.toast("Courier assigned elsewhere · select updated to George")},

 /* ---- Refunds (Stripe): ORDC-093..099 ORDC-158 ---- */
 secRefunds(){const s=O11_st(),A=App,ic=A.icon,E=O11.E;if(!O11.mgr())return "";const admin=O11.admin();
  const msg=s.refundMsg?`<div class="note-box ${s.refundMsg[0]} mb8">${E(s.refundMsg[1])}</div>`:"";

   form=v?`<div class="note-box mt8 ${v.status==="verified"||v.status==="admin_approved"?"--ok":v.status==="pending_admin"?"--warn":""}"><div class="caps mb8">Verdict</div><div class="sm"><b>${v.status==="verified"?"Confirmed":v.status==="pending_admin"?"Waiting on an admin's decision.":v.status==="admin_approved"?"Approved by Tatiana":"Not confirmed"}</b> · Confidence ${v.conf}% · Amount requested ${A.fmt(v.amount)}</div><div class="hint mt8">${E(v.summary)}</div><div class="hint mt8">“${E(v.quote)}” – WhatsApp, Mon 19 Oct</div>
    <div class="row mt8" style="gap:8px;flex-wrap:wrap">${v.status==="verified"||v.status==="admin_approved"?`<input class="input num" style="width:100px" id="rf-a" value="${Math.min(100,v.amount)}"><input class="input" style="width:120px" id="rf-pin" type="password" placeholder="your PIN"><button class="btn --sm" onclick="O11.refundGo(true)">Confirm refund</button><span class="hint">cap £100 or the approved amount · Tatiana gets a Telegram</span>`:v.status==="pending_admin"?"":`<button class="btn --sm" onclick="O11_st().verif.status='pending_admin';O11.renderMain();App.toast('Sent to admin · Telegram to admins')">Send to admin</button><span class="hint">The check does not let you refund yourself – an admin decides in Finance → Refund verifications.</span>`}</div></div>`
   :`<div class="note-box mt8"><div class="caps mb8">Refund with reason check · manager</div><div class="hint mb8">You may refund up to £100 yourself once the reason is confirmed in the chat history.</div><div class="field"><label>Reason</label><input class="input" id="rv-r" placeholder="Bouquet arrived damaged"></div><div class="field mt8"><label>What happened (min. 80 characters)</label><textarea class="textarea" id="rv-t"></textarea></div><div class="row mt8" style="gap:8px"><button class="btn --sm" onclick="O11.verify()">Check</button><button class="btn --secondary --sm" onclick="O11_st().refundOpen=false;O11.renderMain()">Cancel</button></div></div>`}

 stripeCheck(i){const p=O11_st().payments[i];p.mirror="Stripe holds: £"+p.amount+" charged Mon 19 Oct · re_3Qx…a1 £0 refunded · "+(p.checking?"recorded in the CRM (refund #12)":"Stripe holds no refunds for this payment.");O11.renderMain();App.toast("Live read from Stripe · throttle 20/min")},
 refundGo(self){const s=O11_st();const a=+document.getElementById("rf-a").value||0,pin=document.getElementById("rf-pin").value,r=self?"verified":(document.getElementById("rf-r")||{}).value;

 /* ---- Customer chat: ORDC-149 ORDC-150 ---- */
 secChat(){const A=App,E=O11.E,o=O11.o(),c=A.customer(o.customer);if(!O11.mgr())return O11.sec("Customer chat",`<div class="hint">No linked chat for this order.</div><div class="hint">(comms.view is needed – florists see this line on prod.)</div>`);

  return O11.sec("Customer chat",cv?`<div class="chat">${cv.msgs.map(m=>`<div class="bubble ${m.me?"--me":""}">${E(m.t)}<small>${A.fmtTime(m.at)}${m.me?" · Valeria":""}</small></div>`).join("")}<div class="bubble">${A.icon("photo")} <span class="muted xs">image</span> <span class="tag --line">reply to story</span><small>09:58 · ❤</small></div></div><div class="hint mt8">Read-only here; drafts are not shown. Voice / video / file / story-reply markers and reactions are kept.</div>`:`<div class="hint">No messages yet.</div>`,{head:cv?`<button class="link" onclick="App.go('inbox',{id:${cv.id}})">Open in inbox →</button>`:""})},

 /* ---- Timeline: ORDC-151 ---- */
 secTimeline(){const A=App,E=O11.E,o=O11.o();

 /* ---- Delete: ORDC-152 ---- */
 secDelete(){if(!O11.mgr())return "";return `<div class="row" style="justify-content:flex-end"><button class="btn --ghost --sm" onclick="O11.del()">${App.icon("trash")} Delete order</button></div>`},
 del(){const o=O11.o();if(O11.d.alcohol){App.toast("Refused: alcohol orders are kept for 6 months (licence)");return}App.confirm("Delete order #"+o.id+"?","It moves to the trash and can be restored. Stock reservation is released; a live Uber booking is cancelled first.","Delete",()=>{App.toast("Order #"+o.id+" moved to the trash");App.go("orders")},{danger:true})},

 /* ---- side: status ORDC-123..131 · attention ORDC-071..077 ORDC-157 · stock ORDC-078 ---- */
 renderSide(){const A=App,o=O11.o(),s=O11_st(),d=O11.d,E=O11.E,ic=A.icon;const mgr=O11.mgr();
  const allowed={queue:["making","cancelled"],making:["photo","ready","cancelled"].concat(mgr?["queue"]:[]),photo:["ready","making"],ready:["out"].concat(mgr?["making"]:[]),out:["delivered","ready"],delivered:mgr?["out"]:[],cancelled:mgr?["queue"]:[]}[o.status]||[];
  const status=O11.sec("Order details",`${d.revenueExcluded?`<div class="note-box --warn mb8">Revenue: <b>not in revenue</b> – test order (reason from the exclusion list)</div>`:""}
   <dl class="kv"><dt>Status</dt><dd>${A.orderPill(o)}</dd><dt>Payment</dt><dd>${A.pill(s.payment)}</dd>${d.pets?`<dt>Pets at home</dt><dd><span class="tag --accent">Lilies</span> <span class="tag --accent">Eucalyptus</span> <span class="tag">Roses</span></dd>`:""}<dt>Order date</dt><dd>${A.fmtDay(o.placed)} ${A.fmtTime(o.placed)} · ${E(o.chan)}</dd>${d.marketplace?`<dt>CRM no.</dt><dd class="tnum">#${o.id}</dd>`:""}${d.gift?`<dt>Gift sale</dt><dd><button class="link --n" onclick="App.go('order-card',{id:${A.data.orders[5].id}})">#${A.data.orders[5].id} · GIFT-7Q2</button></dd>`:""}${d.giftSub?`<dt>Gift subscription</dt><dd>3 months · 1 of 3 deliveries in the CRM</dd>`:""}${d.subscription?`<dt>Subscription</dt><dd><span class="tag --ink">Recurring delivery</span></dd>`:""}</dl>
   ${d.giftSub?`<div class="hint mt8">A gift-subscription sale has no statuses.</div>`:`<div class="hr"></div><div class="caps mb8">Change status</div><div class="row" style="gap:8px"><select class="select" id="oc-st" onchange="O11.stPick(this.value)"><option value="">Choose…</option>${allowed.map(x=>`<option value="${x}">${A.STATUS_LBL[x]}${x==="queue"&&o.status!=="cancelled"?" (return to prep)":x==="queue"?" (reopen)":""}</option>`).join("")}</select><button class="btn --sm" id="oc-apply" onclick="O11.applyStatus()">Apply</button></div><div id="oc-cancel"></div>
   <div class="hint mt8">${allowed.length?"Server filters the list: no “return to prep” / reopen for non-managers; cancelled is refused for florists (403).":"No transitions from this status for your role."}</div>`}`,{mode:"auto"});
  const att=s.attention;let attBody;
  if(att.on&&!s.attEdit)attBody=`<div class="sm">${E(att.note)}</div><div class="row mt8" style="gap:6px;flex-wrap:wrap">${att.who.map(w=>`<span class="chip" style="height:26px">${A.avatar(w,"--s")} ${E(A.user(w).n)}</span>`).join("")}</div><div class="hint mt8">Flagged by ${E(A.user(att.by).n)} · ${att.at}</div><div class="row mt8" style="gap:8px"><button class="btn --ghost --sm" type="button" onclick="O11_st().attEdit=true;O11.renderSide()">Edit</button>${mgr?`<button class="textbtn --accent" type="button" onclick="App.confirm('Remove the special-attention flag?','The responsible list is cleared; the checklist stays.','Remove flag',()=>{O11_st().attention.on=false;O11.d.attention=false;O11.renderSide();App.toast('Flag removed · audit order.attention.off')},{danger:true})">Remove flag</button>`:""}</div>`;
  else if(att.on||s.attEdit)attBody=`<div class="field"><label>Why is it special</label><textarea class="textarea" onblur="O11_st().attention.note=this.value;O11.attSaved()">${E(att.note)}</textarea></div><div class="field mt8"><label>Responsible *</label><div class="chips">${A.data.staff.filter(x=>x.role!=="courier").map(x=>`<button class="chip ${att.who.includes(x.id)?"on":""}" type="button" onclick="O11.attWho('${x.id}')">${E(x.n)}</button>`).join("")}</div>${att.who.length?"":`<div class="hint --accent mt8">Pick at least one responsible person</div>`}</div><div class="row mt8" style="gap:8px"><span class="hint" id="oc-attsaved">Saves on every click and when you leave the field – no Save button on purpose</span><span class="sp"></span><button class="btn --sm" type="button" onclick="O11_st().attEdit=false;if(!O11_st().attention.who.length)O11_st().attention.on=false;O11.renderSide()">Close</button></div>`;
  else attBody=`<button class="flagbtn" type="button" onclick="O11_st().attEdit=true;O11_st().attention.on=true;O11.d.attention=true;O11.renderSide()">${ic("alert")} Flag for special attention</button><div class="hint mt8">Weddings, arches, early deliveries – names the responsible people and opens a checklist; the order appears in the board's Special tab.</div>`;
  const cl=att.on?`<div class="hr"></div><div class="row mb8"><span class="caps">Checklist · ${s.checklist.filter(t=>t.done).length}/${s.checklist.length}</span><span class="sp"></span><button class="textbtn" type="button" onclick="O11.taskModal()">+ Add item</button></div><div class="list cl" style="border:1px solid var(--hair)">${s.checklist.map((t,i)=>`<div class="li"><label class="check"><input type="checkbox" ${t.done?"checked":""} ${(!t.done&&(mgr||A.me().id===t.who))||(t.done&&mgr)?"":"disabled"} onchange="O11_st().checklist[${i}].done=this.checked;O11.renderSide();App.toast(this.checked?'Task done · visible in /tasks':'Back in progress')"></label><div class="t"><b style="${t.done?"text-decoration:line-through;color:var(--grey)":""}">${E(t.t)}</b><small>${A.avatar(t.who,"--s")} ${E(A.user(t.who).n)} · <span class="${t.late&&!t.done?"accent":""}">${E(t.due)}</span></small></div></div>`).join("")||`<div class="li"><div class="t"><small>No items yet – add the first one with “+ Add item”.</small></div></div>`}</div><div class="hint mt8">Ticking goes through the usual task flow (points after approval); only a manager can untick.</div>`:"";
  const attention=O11.sec("Special attention",attBody+cl,{mode:"auto",cls:att.on?"--accent":"",sub:"saves itself"});
  const stock=O11.sec("Stock",mgr?`<div class="row" style="gap:10px;align-items:flex-start"><span class="switch ${s.reserve?"on":""}" onclick="O11_st().reserve=!O11_st().reserve;O11.renderSide();App.toast(O11_st().reserve?'Stock reserved for this order':'Reservation follows the window again')"></span><div><div class="sm">Reserve stock for this order</div><div class="hint">Saves at once. Holds the stems outside the “today + tomorrow” window; otherwise the reservation follows the window.</div></div></div>`:`<div class="sm">${s.reserve?"Stock is reserved for this order":"Stock follows the reservation window"}</div><div class="hint">Only a manager can change this.</div>`,{mode:"auto"});
  document.getElementById("oc-side").innerHTML=status+attention+stock;
  if(s.courierTouched===undefined&&mgr)s.courierTouched=false},
 attWho(id){const a=O11_st().attention;const i=a.who.indexOf(id);if(i>=0)a.who.splice(i,1);else a.who.push(id);O11.renderSide();O11.attSaved()},
 attSaved(){const el=document.getElementById("oc-attsaved");if(el){el.textContent="✓ Saved";el.className="hint --ok"}App.push("Special attention · #"+O11.id,"You were named responsible",{icon:"alert",type:"task"})},
 taskModal(){const o=O11.o(),A=App,ic=A.icon;let dirty=false;
  A.modal({title:"New task",wide:true,body:`<div class="hint mb8">Linked order: #${o.id}</div><div class="fg --2"><div class="field"><label>Title *</label><input class="input" id="tk-t" oninput="O11._tkDirty=true"></div><div class="field"><label>Category</label><select class="select"><option>Workshop</option><option>Delivery</option><option>Purchasing</option><option>Customer</option></select></div><div class="field" style="grid-column:1/-1"><label>Description</label><textarea class="textarea" oninput="O11._tkDirty=true"></textarea></div>${O11.mgr()?`<div class="field"><label>Priority</label><div class="chips"><button class="chip on" onclick="this.classList.add('on');this.nextElementSibling.classList.remove('on')">Normal</button><button class="chip" onclick="this.classList.add('on');this.previousElementSibling.classList.remove('on')">Urgent</button></div></div><div class="field"><label>Points</label><input class="input num" value="5"></div>`:`<div class="hint" style="grid-column:1/-1">Priority and points are set by a manager; your task is filed as an initiative (0 points).</div>`}<div class="field"><label>Deadline</label><input class="input" type="datetime-local"></div><div class="field"><label>Assignees</label><div class="chips">${A.data.staff.filter(x=>x.role!=="courier").slice(0,6).map(x=>`<button class="chip" onclick="this.classList.toggle('on')">${x.n}</button>`).join("")}</div><div class="hint">Empty = the shift pool</div></div><div class="field" style="grid-column:1/-1"><label>Photos</label><div class="row" style="gap:8px"><button class="btn --ghost --sm" onclick="App.toast('Photo added')">${ic("photo")} Add</button></div></div></div>`,
   foot:`<button class="btn --secondary --sm" onclick="O11.tkClose()">Cancel</button><button class="btn --sm" onclick="const t=document.getElementById('tk-t').value.trim();if(!t){App.toast('Title is required');return}O11_st().checklist.push({id:Date.now(),t,who:App.me().id,due:'Today',done:false});O11._tkDirty=false;App.closeModal();O11.renderSide();App.toast('Task created · linked to #${o.id}')">Save</button>`});O11._tkDirty=false},
 tkClose(){if(O11._tkDirty){App.confirm("Close without saving?","The task you started will be lost.","Close",()=>{O11._tkDirty=false;App.closeModal()});return}App.closeModal()},
 stPick(v){const el=document.getElementById("oc-cancel");if(!el)return;el.innerHTML=v==="cancelled"?`<div class="field mt8"><label>Cancellation reason</label><select class="select" id="oc-cr" onchange="document.getElementById('oc-crn').style.display=this.value==='Other'?'':'none';document.getElementById('oc-apply').disabled=!this.value"><option value="">Choose a reason…</option>${O11_CANCEL.map(x=>`<option>${x}</option>`).join("")}</select><input class="input mt8" id="oc-crn" style="display:none" placeholder="What happened – one sentence (10+ characters)"></div>`:"";document.getElementById("oc-apply").disabled=v==="cancelled"},
 applyStatus(){const A=App,o=O11.o(),s=O11_st(),v=(document.getElementById("oc-st")||{}).value;if(!v){A.toast("Choose a status first");return}
  if(O11.d.hold&&O11.d.alcohol&&["making","ready","out"].includes(v)){O11.alcoholModal();return}
  if(v==="cancelled"){if(!O11.mgr()){A.toast("403 · cancelling is for managers (prod lists it anyway)");return}const r=document.getElementById("oc-cr").value,n=document.getElementById("oc-crn").value;if(!r){A.toast("Cancellation reason is required");return}if(r==="Other"&&n.length<10){A.toast("Describe what happened – at least 10 characters");return}A.cancelOrder(o.id,r+(n?" · "+n:""));return}
  if(v==="ready"&&!s.finished.length&&!o.photo){A.toast("Refused: no photo of the finished bouquet – add it in Photos, or use “Ready without photo” on the board","Go to Photos",()=>O11.go("photos"));return}
  if(v==="delivered"){if(!O11.mgr()){A.toast("403 · delivered for deliveries is confirmed by a manager");return}O11.podModal();return}
  A.setOrderStatus(o.id,v);O11.render()},
 podModal(){const A=App,o=O11.o();A.modal({title:"Confirm delivery · proof",body:`<div class="hint mb8">A delivery cannot be fulfilled without a proof-of-delivery photo. Upload the courier's photo or close without one with a reason.</div><div class="drop" onclick="O11._pod=true;this.innerHTML='<b>door-photo.jpg</b><span>attached · click Confirm</span>'">${A.icon("photo")}<b>Upload POD photo</b><span>JPEG / PNG / WebP</span></div><label class="check mt16"><input type="checkbox" id="pod-miss"> The courier didn't take a photo</label><input class="input mt8" id="pod-why" placeholder="Why (recorded with your name)">`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="if(!O11._pod&&!document.getElementById('pod-miss').checked){App.toast('Add the photo or tick “no photo” with a reason');return}if(document.getElementById('pod-miss').checked&&!document.getElementById('pod-why').value){App.toast('A reason is required without a photo');return}App.closeModal();O11._pod=false;App.setOrderStatus(${o.id},'delivered');O11.render()">Confirm delivery</button>`});O11._pod=false},
 statusModal(){O11.go("order");setTimeout(()=>document.getElementById("oc-st")?.focus(),100)},

 /* ---- foot: ORDC-153 ORDC-154 ---- */
 renderFoot(){const f=document.getElementById("oc-foot");if(!O11.dirty){f.style.display="none";return}f.style.display="";
  f.innerHTML=`<span class="sm">${App.icon("alert")} You have unsaved changes.</span><span class="hint">Panels marked “Saves itself” are already saved – this bar saves the form only.</span><span class="sp"></span><button class="btn --secondary --sm" onclick="O11.discard()">Discard</button><button class="btn --sm" onclick="O11.save()">${O11.saving?"Saving…":"Save changes"}</button>`},
 discard(){delete O11.s[O11.id];O11.dirty=false;O11.render();App.toast("Changes discarded")},
 save(){const A=App,s=O11_st(),o=O11.o();if(!O11.mgr()){A.toast("403 · Only a manager can save the order (orders.manage) – florists get a read-only card in the redesign");return}
  if(O11.d.lilies&&!s.allergyOverride){A.toast("Refused: lilies for a recipient who must not get them – tick “The customer allowed lilies” to save");return}
  const sub=s.items.reduce((x,i)=>x+i.qty*i.price,0);const total=Math.max(0,sub+(s.free?0:s.delivery)+s.tip-(s.promo?Math.round(sub*.1):s.discount));
  const paid=s.payment==="paid"?o.total:s.payment==="partial"?Math.round(o.total/2):0;
  const go=()=>{if(s.courier&&s.courier!=="daniel"&&s.courier!==o.courier&&s.method==="delivery"&&!s._adviceOk){A.confirm("The advisor suggested Daniel","Run 12:30 · leaves 12:10. Assign "+(A.user(s.courier)?A.user(s.courier).n:s.courier)+" anyway?","Assign",()=>{s._adviceOk=true;go()});return}
   O11.saving=true;O11.renderFoot();setTimeout(()=>{o.total=total;o.paid=s.payment;o.recipient=s.recName;o.notes=s.note;o.card=s.cards[0]?s.cards[0].t:"";o.type=s.method;o.delivery=s.free?0:s.delivery;if(s.florist)o.florist=s.florist;if(s.courier&&A.user(s.courier))o.courier=s.courier;o.log.push({at:A.NOW.toISOString(),who:A.me().id,t:"Order edited · saved"});O11.saving=false;O11.dirty=false;s._adviceOk=false;A.emit("orders");A.toast("Saved");O11.render()},500)};
  if(paid>total&&O11.mgr()){A.confirm("Total is now below what was paid","Record the overpayment ("+A.fmt(paid-total)+") to refund later? OK records it (needs reconciliation); Cancel does not save.","OK",()=>{O11.d.overpaid=true;go()});return}
  go()}
});
const A11fmt=n=>App.fmt(n);
</script>
