function pcTr(k,v){const x=X(findP(pc.id)),t=x.tr[pc.lang];t[k]=v;if(k!=="reviewed"){t.reviewed=true;t.status="reviewed";const c=$("#s-product .views button.on .tag");if(c){c.textContent="reviewed";c.className="tag --ok"}const cb=$("#s-product .check input[type=checkbox]:last-of-type");}}
function pcSaveTr(){const x=X(findP(pc.id));LANGS.forEach(([k])=>{const t=x.tr[k];if(!t.name&&!t.desc)t.status="machine"});A.toast("Translations saved · empty cells removed · site synced");renderPC(findP(pc.id))}
function pcReview(vid){const x=X(findP(pc.id));const v=x.vars.find(w=>w.id===vid);if(!v.recipe){A.toast("Add recipe lines first");return}v.recipe.reviewed=!v.recipe.reviewed;v.recipe.by=A.me().id;v.recipe.at=A.NOW.toISOString();renderPC(findP(pc.id));A.toast(v.recipe.reviewed?"Recipe reviewed · no page reload":"Review removed")}
function pcRecLine(vid,i,k,v){const x=X(findP(pc.id));const w=x.vars.find(q=>q.id===vid);if(!w.recipe)w.recipe={lines:[],reviewed:false};w.recipe.lines[i][k]=k==="qty"?Math.max(1,num(v)||1):v}
function pcRecRm(vid,i){const x=X(findP(pc.id));const w=x.vars.find(q=>q.id===vid);w.recipe.lines.splice(i,1);renderPC(findP(pc.id))}
function pcRecAdd(vid){const x=X(findP(pc.id));const w=x.vars.find(q=>q.id===vid);if(!w.recipe)w.recipe={lines:[],reviewed:false,by:"vanessa",at:A.NOW.toISOString()};w.recipe.lines.push({item:"",qty:1});renderPC(findP(pc.id))}
function pcRecSave(vid){const x=X(findP(pc.id));const w=x.vars.find(q=>q.id===vid);if(!w.recipe)return;w.recipe.lines=w.recipe.lines.filter(l=>l.item);renderPC(findP(pc.id));A.toast("Recipe saved · cost and buildable recalculated")}

 d.price=num(st.price);d.c21.catId=Number(st.cat);d.c21.status="active";d.c21.intake=null;if(!d.c21.vars.length)d.c21.vars=[{id:id*10+1,name:"Standard",colour:"",price:d.price,old:null,active:true,soldOut:false,recipe:null,saved:true}];

function renderFlorList(fl){const b=$("#c21-in-body");b.innerHTML=fl.length?`<div class="note-box mb16">${ic("photo")} Photos florists took on finished orders. Switch to <b>Photos for the site</b> to sort them one by one: → to the product gallery, ← not for the site, ↑ for Instagram, Z undo.</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:56px"></th><th>Order</th><th>Product</th><th>Florist</th><th class="c21-hp">Taken</th><th>Type</th><th></th></tr></thead><tbody>${fl.map(f=>`<tr class="r"><td><span class="thumb --s" onclick="C21.lightbox('${f.img}')"><img src="${f.img}" alt=""></span></td><td><button class="link tnum" onclick="App.openOrder(${f.order.id})">#${f.order.id}</button></td><td>${esc(A.product(f.product).name)}</td><td>${A.avatar(f.florist,"--s")} ${esc(A.user(f.florist).n)}</td><td class="c21-hp muted">${A.fmtDay(f.at)} ${A.fmtTime(f.at)}</td><td><span class="tag --line">${f.kind==="finished"?"Finished bouquet":"Before wrapping"}</span></td><td><span class="acts"><button class="ib" title="To the product gallery" onclick="C21.swDecide('r','${f.order.id}-${f.img}')">${ic("catalog")}</button><button class="ib" title="For Instagram" onclick="C21.swDecide('u','${f.order.id}-${f.img}')">${ic("star")}</button><button class="ib" title="Not for the site" onclick="C21.swDecide('l','${f.order.id}-${f.img}')">${ic("close")}</button></span></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">${ic("check")}<div class="h3">All florist photos sorted</div><button class="btn --ghost --sm" onclick="C21.swUndo()">Undo last</button></div>`}
function renderSwipe(fl){const b=$("#c21-in-body");const cur=fl[0],nxt=fl[1];const log=ins.swipe.log;const LBL={r:"To gallery",l:"Not for site",u:"Instagram"};

 </div><div class="panel"><div class="p-head"><div class="h4">Decisions <span class="muted xs">${log.length}</span></div>${log.length?`<button class="textbtn" onclick="C21.swUndo()">undo last</button>`:""}</div><div class="p-body c21-log">${log.length?log.slice().reverse().slice(0,12).map(l=>`<div class="li --static" style="cursor:default"><span class="thumb --s"><img src="${l.img}" alt=""></span><div class="t"><b>${esc(l.pname)}</b><small>${l.d==="r"?"→ gallery of "+esc(l.pname):l.d==="u"?"↑ marked for Instagram":"← not for the site"}</small></div><span class="tag ${l.d==="r"?"--ok":l.d==="u"?"--ink":"--line"}">${LBL[l.d]}</span></div>`).join(""):`<div class="empty" style="padding:20px"><div class="sm">Nothing decided yet</div></div>`}</div><div class="p-foot" style="padding:8px 14px;border-top:1px solid var(--hair);font-size:12px;color:var(--grey)">→ adds the photo to the product's gallery and syncs the site · ↑ marks it like ★ on Bouquet photos · ← hides it from the picker</div></div></div>`;
 const ph=$("#c21-dk-ph");if(ph)attachDrag(ph);const dk=$("#c21-deck");if(dk)setTimeout(()=>dk.focus(),50);

function attachDrag(el){let sx=0,sy=0,on=false;const card=$("#c21-dk-cur"),stamp=$("#c21-stamp");
 el.onpointerdown=e=>{on=true;sx=e.clientX;sy=e.clientY;card.style.transition="none";el.setPointerCapture(e.pointerId)};
 el.onpointermove=e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/20}deg)`;const d=Math.abs(dx)>60?(dx>0?"r":"l"):dy<-60?"u":"";stamp.textContent={r:"To gallery",l:"Not for site",u:"Instagram"}[d]||"";stamp.classList.toggle("on",!!d)};
 el.onpointerup=e=>{if(!on)return;on=false;const dx=e.clientX-sx,dy=e.clientY-sy;card.style.transition="";const d=Math.abs(dx)>90?(dx>0?"r":"l"):dy<-90?"u":"";if(d)swDecide(d);else{card.style.transform="";stamp.classList.remove("on")}};
}
function swDecide(d,key){const fl=florPhotos().filter(f=>!ins.swipe.log.find(l=>l.key===f.order.id+"-"+f.img));const f=key?fl.find(x=>x.order.id+"-"+x.img===key):fl[0];if(!f){A.toast("Nothing left to sort");return}
 const go=()=>{ins.swipe.log.push({key:f.order.id+"-"+f.img,d,img:f.img,pname:A.product(f.product).name,pid:f.product});if(d==="r"){const x=X(A.product(f.product));if(!x.photos.includes(f.img))x.photos.push(f.img)}A.toast(d==="r"?"Added to the gallery of "+A.product(f.product).name+" · site synced":d==="u"?"Marked for Instagram":"Not for the site");mount_catalog_intake({})};
 const card=$("#c21-dk-cur");if(card&&ins.mode==="swipe"&&!key){card.style.transform="";card.classList.add("--go-"+d);setTimeout(go,220)}else go()}
function swUndo(){const l=ins.swipe.log.pop();if(!l){A.toast("Nothing to undo");return}if(l.d==="r"){const x=X(A.product(l.pid));const i=x.photos.indexOf(l.img);if(i>0)x.photos.splice(i,1)}A.toast("Undone · "+l.pname);mount_catalog_intake({})}
document.addEventListener("keydown",e=>{if(A.state.current!=="catalog-intake"||ins.src!=="florists"||ins.mode!=="swipe")return;const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea"||tag==="select")return;const m={ArrowRight:"r",ArrowLeft:"l",ArrowUp:"u"}[e.key];if(m){e.preventDefault();swDecide(m)}else if(e.key.toLowerCase()==="z"){e.preventDefault();swUndo()}});

function cgSave(id){const n=$("#c21-cg-n").value.trim();if(!n){A.toast("Name is required");return}const parent=$("#c21-cg-p").value?Number($("#c21-cg-p").value):null,active=$("#c21-cg-a").checked;

 body.innerHTML=list.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Type</th><th>Options</th><th class="c21-hp">On the card</th><th></th></tr></thead><tbody>${list.map(p=>`<tr class="r" onclick="C21.pmEdit(${p.id})"><td>${esc(p.n)}</td><td>${p.type}</td><td class="wrap">${p.opts.length?esc(p.opts.join(", ")):"<span class='muted'>–</span>"}</td><td class="c21-hp xs muted">${p.type==="Select"?(p.multi?"choose several":"choose one"):p.type+" input (empty block in the live CRM)"}</td><td onclick="event.stopPropagation()"><span class="acts"><button class="ib" onclick="C21.pmEdit(${p.id})">${ic("edit")}</button><button class="ib" onclick="C21.pmDelete(${p.id})">${ic("trash")}</button></span></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">${ic("list")}<div class="h3">No parameters</div><button class="btn --ghost --sm" onclick="C21.pmEdit(null)">Add parameter</button></div>`}
function pmEdit(id){const p=id?PARAMS.find(x=>x.id===id):{n:"",type:"Select",opts:[],multi:false};
 A.modal({title:id?"Edit parameter":"Add parameter",body:`<div class="col" style="gap:12px"><div class="field"><label>Name *</label><input class="input" id="c21-pm-n" value="${esc(p.n)}"></div><div class="field"><label>Type</label><select class="select" id="c21-pm-t" onchange="document.getElementById('c21-pm-o').style.display=this.value==='Select'?'':'none'">${["Select","Text","Number","Yes/No"].map(t=>`<option ${p.type===t?"selected":""}>${t}</option>`).join("")}</select></div><div class="field" id="c21-pm-o" style="${p.type==="Select"?"":"display:none"}"><label>Options <span class="muted">· comma-separated</span></label><input class="input" id="c21-pm-ov" value="${esc(p.opts.join(", "))}"><label class="check mt8"><input type="checkbox" id="c21-pm-m" ${p.multi?"checked":""}> Several options per product <span class="xs muted">(new – the live form always makes «choose one»)</span></label></div></div>`,
  foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="C21.pmSave(${id||"null"})">Save</button>`})}
function pmSave(id){const n=$("#c21-pm-n").value.trim();if(!n){A.toast("Name is required");return}const type=$("#c21-pm-t").value,opts=type==="Select"?$("#c21-pm-ov").value.split(",").map(s=>s.trim()).filter(Boolean):[],multi=type==="Select"&&$("#c21-pm-m").checked;
 if(id){Object.assign(PARAMS.find(x=>x.id===id),{n,type,opts,multi})}else PARAMS.push({id:paramSeq++,n,type,opts,multi});A.closeModal();mount_catalog_parameters();A.toast(id?"Parameter updated · audit":"Parameter created · audit")}
function pmDelete(id){const p=PARAMS.find(x=>x.id===id);A.confirm("Delete this item?",`«${esc(p.n)}» disappears from every product card.`,"Delete",()=>{PARAMS.splice(PARAMS.indexOf(p),1);mount_catalog_parameters();A.toast("Parameter deleted")},{danger:true})}

/* ================= BADGES ================= */
window.mount_catalog_badges=function(){const head=$("#c21-bg-head"),body=$("#c21-bg-body");if(!can.manage()){deny(body);head.innerHTML="";return}
 head.innerHTML=`${subnav("catalog-badges")}<div class="row" style="width:100%"><span class="xs muted">Manual badges first, then automatic</span><span class="sp"></span>${demoBtn()}<button class="btn --sm" onclick="C21.bgEdit(null)">${ic("plus")} Add badge</button></div>`;
 const list=F.quiet?[]:BADGES.slice().sort((a,b)=>a.auto-b.auto);
 body.innerHTML=list.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Label (EN)</th><th>Key</th><th class="c21-hp">Label (RU)</th><th>Colour</th><th>Kind</th><th></th></tr></thead><tbody>${list.map(b=>`<tr class="r" onclick="C21.bgEdit(${b.id})"><td>${badgeHtml(b.key)}</td><td class="muted">${esc(b.key)}</td><td class="c21-hp">${esc(b.ru)}</td><td><span class="dot" style="background:var(--${{rose:"accent",amber:"warn",green:"ok",slate:"grey",violet:"sel"}[b.colour]})"></span> ${b.colour}</td><td>${b.auto?`<span class="tag --line">Auto</span>`:`<span class="tag">Manual</span>`}</td><td onclick="event.stopPropagation()"><span class="acts"><button class="ib" onclick="C21.bgEdit(${b.id})">${ic("edit")}</button>${b.auto?"":`<button class="ib" onclick="C21.bgDelete(${b.id})">${ic("trash")}</button>`}</span></td></tr>`).join("")}</tbody></table></div><div class="xs muted mt8">Badges are set per product in the catalogue grid only – the card has no badge picker yet (data field exists).</div>`:`<div class="empty">${ic("award")}<div class="h3">No badges</div><button class="btn --ghost --sm" onclick="C21.bgEdit(null)">Add badge</button></div>`}
function bgEdit(id){const b=id?BADGES.find(x=>x.id===id):{key:"",en:"",ru:"",colour:"rose",auto:false};
 A.modal({title:id?"Edit badge":"Add badge",body:`<div class="col" style="gap:12px"><div class="field"><label>Key ${b.auto?"<span class='muted'>· locked for automatic badges</span>":"<span class='muted'>· becomes snake_case</span>"}</label><input class="input" id="c21-bg-k" value="${esc(b.key)}" ${b.auto?"disabled":""}></div><div class="c21-f2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="field"><label>Label (EN)</label><input class="input" id="c21-bg-en" value="${esc(b.en)}"></div><div class="field"><label>Label (RU)</label><input class="input" id="c21-bg-ru" value="${esc(b.ru)}"></div></div><div class="field"><label>Colour</label><div class="chips">${["rose","amber","green","slate","violet"].map(c=>`<button class="chip ${b.colour===c?"on":""}" data-c="${c}" onclick="[...this.parentNode.children].forEach(x=>x.classList.remove('on'));this.classList.add('on')">${c}</button>`).join("")}</div></div></div>`,
  foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="C21.bgSave(${id||"null"})">Save</button>`})}
function bgSave(id){const en=$("#c21-bg-en").value.trim();if(!en){A.toast("Label (EN) is required");return}const key=$("#c21-bg-k").value.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,""),ru=$("#c21-bg-ru").value.trim(),colour=$("#m-box .chip.on")?.dataset.c||"rose";
 if(id){const b=BADGES.find(x=>x.id===id);Object.assign(b,{en,ru,colour});if(!b.auto)b.key=key||b.key}else BADGES.push({id:badgeSeq++,key:key||slug(en).replace(/-/g,"_"),en,ru,colour,auto:false});A.closeModal();mount_catalog_badges();A.toast(id?"Badge updated":"Badge created · manual")}
function bgDelete(id){const b=BADGES.find(x=>x.id===id);if(b.auto){A.toast("Automatic badges cannot be deleted");return}A.confirm("Delete this item?",`Badge «${esc(b.en)}» is removed from every product.`,"Delete",()=>{BADGES.splice(BADGES.indexOf(b),1);mount_catalog_badges();A.toast("Badge deleted")},{danger:true})}

/* ================= REVIEWS ================= */
const RV=[["Hannah W.",5,"Arrived on time and looked exactly like the photo. My mum was thrilled.","floritta.uk","published"],["Oliver B.",4,"Beautiful, fresh and still going strong a week later.","Google","published"],["",3,"Lovely bouquet, slightly smaller than I expected for the price.","floritta.uk","pending"],["James T.",5,"Ordered at 2pm, delivered by 6 – brilliant for a last-minute birthday.","Trustpilot","published"],["Chloe M.",5,"Gorgeous colours. The handwritten card was a nice touch.","floritta.uk","pending"],["Daniel K.",2,"Nice flowers but the courier left them with a neighbour without telling me.","Google","hidden"],["Sophie R.",5,"Second time ordering – consistent quality, will be back.","floritta.uk","published"],["",1,"<b>Click here</b> <a href=x>spam link</a> – HTML must not render.","floritta.uk","hidden"],["Tom H.",4,"Stunning. Office was impressed.","Trustpilot","pending"],["Amelia F.",5,"Peonies were perfect for the wedding table.","floritta.uk","published"],["Lucas P.",3,"Good but delivery slot was missed by 40 minutes.","Google","pending"],["Priya S.",5,"Exactly as pictured, lovely fragrance.","floritta.uk","published"]].map((r,i)=>({id:801+i,product:A.data.products[(i*3)%17].id,who:r[0],rating:r[1],txt:r[2],source:r[3],status:r[4],at:A.T(9+i,10,-(i*2))}));
const rv={status:"",source:"",rating:"",page:1};
window.mount_catalog_reviews=function(){const head=$("#c21-rv-head"),body=$("#c21-rv-body");if(!can.manage()){deny(body);head.innerHTML="";return}
 const all=F.quiet?[]:RV;const srcs=[...new Set(RV.map(r=>r.source))];
 head.innerHTML=`${subnav("catalog-reviews")}<div class="toolbar" style="margin:0;width:100%"><select class="select" style="width:150px" onchange="C21.rvF('status',this.value)"><option value="">Status · all</option>${["pending","published","hidden"].map(s=>`<option value="${s}" ${rv.status===s?"selected":""}>${s[0].toUpperCase()+s.slice(1)}</option>`).join("")}</select><select class="select" style="width:150px" onchange="C21.rvF('source',this.value)"><option value="">Source · all</option>${srcs.map(s=>`<option ${rv.source===s?"selected":""}>${s}</option>`).join("")}</select><select class="select" style="width:130px" onchange="C21.rvF('rating',this.value)"><option value="">Rating · all</option>${[5,4,3,2,1].map(n=>`<option value="${n}" ${String(rv.rating)===String(n)?"selected":""}>${"★".repeat(n)}</option>`).join("")}</select><span class="xs muted">applied at once</span><span class="sp"></span>${demoBtn()}</div>`;
 const cnt=s=>all.filter(r=>r.status===s).length;const list=all.filter(r=>(!rv.status||r.status===rv.status)&&(!rv.source||r.source===rv.source)&&(!rv.rating||String(r.rating)===String(rv.rating)));const PER=30,pages=Math.max(1,Math.ceil(list.length/PER));
 body.innerHTML=`<div class="c21-kpis"><div class="kpi-card ${cnt("pending")?"--warn":""}"><span class="caps">Pending</span><span class="kpi-s">${cnt("pending")}</span></div><div class="kpi-card"><span class="caps">Published</span><span class="kpi-s">${cnt("published")}</span></div><div class="kpi-card"><span class="caps">Hidden</span><span class="kpi-s">${cnt("hidden")}</span></div></div>
 ${list.length?`<div class="tbl-wrap"><table class="tbl c21-tbl"><thead><tr><th>Product</th><th>Author</th><th>Rating</th><th style="width:40%">Review</th><th class="c21-hp">Source</th><th>Status</th><th></th></tr></thead><tbody>${list.slice((rv.page-1)*PER,rv.page*PER).map(r=>`<tr class="r"><td>${esc(A.product(r.product).name)}</td><td>${r.who?esc(r.who):"<span class='muted'>Anonymous</span>"}</td><td class="c21-stars">${"★".repeat(r.rating)}<span class="muted">${"★".repeat(5-r.rating)}</span></td><td class="wrap c21-rvtxt">${esc(r.txt)}</td><td class="c21-hp muted">${esc(r.source)}</td><td>${A.pill(r.status==="published"?"ready":r.status==="hidden"?"cancelled":"photo",r.status[0].toUpperCase()+r.status.slice(1))}</td><td><span class="acts">${r.status!=="published"?`<button class="btn --sm --ghost" onclick="C21.rvMod(${r.id},'published')">Publish</button>`:""}${r.status!=="hidden"?`<button class="btn --sm --ghost" onclick="C21.rvMod(${r.id},'hidden')">Hide</button>`:""}${can.del()?`<button class="ib" title="Delete (admin)" onclick="C21.rvDel(${r.id})">${ic("trash")}</button>`:""}</span></td></tr>`).join("")}</tbody><tfoot><tr><td colspan="7">${list.length} reviews · 30 per page · text is shown as plain text (no HTML)${!can.del()?" · delete is admin-only (data.delete)":""}</td></tr></tfoot></table></div>${pages>1?`<div class="c21-pg">${Array.from({length:pages},(_,i)=>`<button class="${rv.page===i+1?"on":""}" onclick="C21.rvPage(${i+1})">${i+1}</button>`).join("")}</div>`:""}`:`<div class="empty">${ic("star")}<div class="h3">No reviews</div><button class="btn --ghost --sm" onclick="C21.rvReset()">Clear filters</button></div>`}`}
function rvMod(id,s){const r=RV.find(x=>x.id===id);r.status=s;mount_catalog_reviews();A.toast(s==="published"?"Review published · CRM status only":"Review hidden")}
function rvDel(id){const r=RV.find(x=>x.id===id);A.confirm("Delete this item?","The review is removed for good (admin, data.delete).","Delete",()=>{RV.splice(RV.indexOf(r),1);mount_catalog_reviews();A.toast("Review deleted")},{danger:true})}

/* ================= FEED ================= */
window.mount_catalog_feed=function(){const head=$("#c21-fd-head"),body=$("#c21-fd-body");if(!can.manage()){deny(body);head.innerHTML="";return}
 head.innerHTML=`${subnav("catalog-feed")}<div class="row" style="width:100%"><span class="xs muted">Snapshot of active products × variants</span><span class="sp"></span>${demoBtn()}<button class="btn --ghost --sm" onclick="C21.syncFeed()">${ic("refresh")} Sync feed</button></div>`;
 const rows=[];if(!F.quiet)A.data.products.forEach(p=>{const x=X(p);if(x.status!=="active")return;x.vars.forEach(v=>rows.push({p,v,valid:!v.soldOut&&!x.soldOut}))});const inv=rows.filter(r=>!r.valid).length;
 body.innerHTML=`<div class="c21-kpis" style="grid-template-columns:200px 200px minmax(0,1fr)"><div class="kpi-card"><span class="caps">Total items</span><span class="kpi-s">${rows.length}</span></div><div class="kpi-card ${inv?"--warn":""}"><span class="caps">Invalid</span><span class="kpi-s">${inv}</span></div><div class="note-box" style="display:flex;align-items:center">Out-of-stock items are excluded from the generated feed.</div></div>
 ${rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th class="c21-hp">SKU</th><th class="num">Price</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr class="r" onclick="App.go('product',{id:${r.p.id}})"><td>${esc(r.p.name)} – ${esc(r.v.name)}</td><td class="c21-hp muted">${esc(r.p.sku)}-${r.v.id%10}</td><td class="num">${fmt(r.v.price)}</td><td>${r.valid?A.pill("ready","Valid"):A.pill("cancelled","Invalid · out of stock")}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">${ic("list")}<div class="h3">Feed is empty</div><div class="sm">No active products with variants.</div></div>`}`}

 catFilter:(k,v)=>{cs[k]=v},catApply:()=>{cs.applied={q:cs.q,cat:cs.cat,rec:cs.rec};cs.page=1;renderCat();A.toast("Filters applied")},catCols:n=>{cs.cols=n;try{localStorage.setItem("catalog.cols",n)}catch(e){}mount_catalog({})},catPage:n=>{cs.page=n;renderCat();$("#c21-cat-body").scrollTop=0},catReset:()=>{cs.q="";cs.cat="all";cs.rec="all";cs.applied={q:"",cat:"all",rec:"all"};cs.page=1;mount_catalog({})},addProduct,syncFeed,

 inSrc:s=>{ins.src=s;mount_catalog_intake({})},inMode:m=>{ins.mode=m;mount_catalog_intake({})},inPrice:(id,v)=>{ins["d"+id].price=v;const d=DRAFTS.find(x=>x.id===id);const btn=event&&event.target.closest(".c21-draft")?.querySelector(".btn:not(.--ghost)");if(btn)btn.disabled=!(num(v)>=1&&!!d.c21.desc)},inCat:(id,v)=>{ins["d"+id].cat=v},inPublish,inDelete,swDecide,swUndo,
 cgEdit,cgSave,cgDelete,pmEdit,pmSave,pmDelete,bgEdit,bgSave,bgDelete,rvF:(k,v)=>{rv[k]=v;rv.page=1;mount_catalog_reviews()},rvPage:n=>{rv.page=n;mount_catalog_reviews()},rvReset:()=>{rv.status="";rv.source="";rv.rating="";rv.page=1;mount_catalog_reviews()},rvMod,rvDel};
