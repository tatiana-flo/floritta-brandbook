  etRun(t){const E=DR_ESC,ic=App.icon,consent=DR2_CONSENTS.find(c=>c.c===t.courier);const gpsOk=consent&&consent.st==="Active";const pts=t.stops.map((s,i)=>[20+i*22,30+(i%2?30:0)]);const R=t.review;

    <div class="note-box">Fee, minimum order and free-from rules of this zone are kept as they are – saving no longer wipes them.</div><button type="submit" class="sr">Save</button></form>`,
    foot:`${id?`<button class="btn --ghost --sm" style="margin-right:auto;color:var(--accent);border-color:var(--accent)" onclick="DRX.znRemove(${id})">Remove</button>`:""}<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="DRX.znSave(${id||0})">Save</button>`})},
  znSave(id){const name=App.$("#dr-zn-name").value.trim(),cut=App.$("#dr-zn-cut").value.trim();if(!name){this.err("dr-zn-err","Name is required");return}if(cut&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(cut)){this.err("dr-zn-err2","Use HH:MM, e.g. 14:00");return}const eco=App.$("#dr-zn-eco").checked,act=App.$("#dr-zn-act").checked;
    if(id){const z=DR.zones.find(x=>x.id===id);Object.assign(z,{name,cutoff:cut,eco,active:act,col:DR._zc})}else DR.zones.push({id:Date.now(),name,cutoff:cut,eco,active:act,col:DR._zc,poly:false});DR.zones.sort((a,b)=>a.name.localeCompare(b.name));App.closeModal();this.re();App.toast(id?"Zone saved":"Zone created · draw its polygon in the map editor to use it in the site quote")},
  znRemove(id){const z=DR.zones.find(x=>x.id===id);const n=z.active?14:0;App.confirm("Remove zone “"+z.name+"”?",n?n+" deliveries this month reference this zone – they would keep a dangling zone id. Deactivate instead if unsure.":"No deliveries reference this zone.","Remove",()=>{DR.zones=DR.zones.filter(x=>x.id!==id);App.closeModal();this.re();App.toast("Zone removed")},{danger:true})},

  /* ===================== CONSENTS ===================== */
  csBody(){const E=DR_ESC,ic=App.icon;const rows=DR.flags.empty?[]:DR2_CONSENTS;
    /* ids: DLRS-132 DLRS-133 DLRS-134 DLRS-135 */
    return `<div class="note-box mb16">Signed courier consent to location tracking (GDPR). Current wording version: <b>v3</b>. Read-only – couriers sign in the app or bot; a courier's objection is shown here and reviewed from the courier card.</div>
    ${rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Courier</th><th>Signed as</th><th>Signed at</th><th>Version</th><th>Status</th><th>Drive</th><th>PDF</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="wrap"><b>${E(DR_CN(r.c))}</b>${r.objection?`<span class="sub warn">Objection: ${E(r.objection)} · <button class="textbtn" onclick="App.toast('Review the objection on the courier card (driver.consent.review)')">review</button></span>`:""}</td><td>${E(r.as)}</td><td class="tnum">${r.at}</td><td>${r.v}${r.v!=="v3"?` <span class="tag --warn">old wording</span>`:""}</td><td><span class="pill --plain ${r.st==="Active"?"--ready":r.st==="Withdrawn"?"--cancelled":"--photo"}">${r.st}</span></td><td>${r.drive?"✓":"–"}</td><td>${r.pdf?`<button class="textbtn" onclick="App.toast('Signed PDF opens via a signed URL · rebuilt if the file is missing')">${ic("download")} PDF</button>`:"–"}</td></tr>`).join("")}</tbody></table></div>`:this.empty("lock","No consents signed yet")}`},

  /* ===================== EXPORTS ===================== */
  exBody(){const E=DR_ESC,ic=App.icon;const r=DR.range.exports;const empty=DR.flags.empty;const P=empty?[]:DR2_PUNCT;const S=empty?[]:DR2_SLOT;const tot=S.filter(x=>x[2]!==null).reduce((s,x)=>s+x[1],0),inslot=S.filter(x=>x[2]!==null).reduce((s,x)=>s+x[2],0),noslot=S.find(x=>x[2]===null)?.[1]||0;
    /* ids: DLRS-137 DLRS-138 DLRS-139 DLRS-140 DLRS-141 DLRS-142 DLRS-143 DLRS-167 */
    const dl=(what,file)=>`App.toast('${file} · for the applied period ${this.fd(r[0])} – ${this.fd(r[1])} · written to the audit log')`;
    return `<div class="card mb16"><span class="caps">Downloads · applied period ${this.fd(r[0])} – ${this.fd(r[1])}</span><div class="btn-row"><button class="btn --secondary --sm" onclick="DRX.exZip()">${ic("photo")} Download POD photos (ZIP)</button><button class="btn --ghost --sm" onclick="${dl("punct","punctuality.csv")}">${ic("download")} Punctuality (CSV)</button><button class="btn --ghost --sm" onclick="${dl("slot","promised-window.csv")}">${ic("download")} Promised window (CSV)</button></div><div class="dr-method">Files use the applied period (the one shown above), not whatever sits in the date fields – press Apply first. The ZIP includes manifest.csv; photos that cannot be fetched are marked UNAVAILABLE.</div></div>
    <div class="dr-cols"><div><div class="sec-head"><span class="h3">Punctuality</span><span class="sm muted">late ≥ 10 min · very late ≥ 30 min</span></div>${P.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Driver</th><th class="num">Deliveries</th><th class="num">On time</th><th class="num">Late</th><th class="num">Very late</th><th class="num">On-time %</th><th class="num">Avg late</th></tr></thead><tbody>${P.map(p=>`<tr><td>${E(DR_CN(p.c))}</td><td class="num">${p.del}</td><td class="num">${p.on}</td><td class="num">${p.late}</td><td class="num ${p.very?"accent":""}">${p.very}</td><td class="num">${Math.round(100*p.on/p.del)} %</td><td class="num">${p.avg}</td></tr>`).join("")}</tbody></table></div>`:this.empty("clock","No delivered runs in this range.")}</div>
    <div><div class="sec-head"><span class="h3">Promised window</span></div>${S.length?this.tiles([{l:"In slot",v:Math.round(100*inslot/tot)+" %",sub:`of ${tot} deliveries · ${noslot} with no slot`},{l:"Late",v:tot-inslot-3},{l:"Very late",v:3,cls:"--hot"},{l:"Avg late",v:"14 min"}])+`<div class="tbl-wrap mt16"><table class="tbl"><thead><tr><th>Zone</th><th class="num">Deliveries</th><th class="num">In slot</th><th class="num">In slot %</th></tr></thead><tbody>${S.map(x=>`<tr><td>${x[0]}</td><td class="num">${x[1]}</td><td class="num">${x[2]===null?"–":x[2]}</td><td class="num">${x[2]===null?"–":Math.round(100*x[2]/x[1])+" %"}</td></tr>`).join("")}</tbody></table></div>`:this.empty("calendar","No delivery in this range carried a promised window.")}</div></div>`},
  exZip(){const r=DR.range.exports;const days=(new Date(r[1])-new Date(r[0]))/864e5;if(days>31){App.confirm("Long period – ZIP of "+Math.round(days)+" days?","Photos are fetched one by one from storage while you wait; long periods can time out. Split the period or confirm.","Download anyway",()=>App.toast("pod-photos.zip is being built · manifest.csv included · audited"));return}App.toast("pod-photos.zip · "+this.fd(r[0])+" – "+this.fd(r[1])+" · manifest.csv included · audited")},

  /* ===================== SHIPPING ===================== */
  shBody(){const E=DR_ESC,ic=App.icon,S=DR.ship,mgr=App.isMgr();
    /* ids: DLRS-144 */
    if(!DR.flags.shipping)return `<div class="card"><span class="caps">Shipping</span><p style="margin:0">Multi-carrier shipping is off. Set <b>SHIPPING_PROVIDERS_ENABLED=true</b> to quote and book parcels with Shiptheory, DPD or Royal Mail.</p><button class="btn --ghost --sm mt16" onclick="DR.flags.shipping=true;DRX.re()">Turn the flag on (demo)</button></div>`;
    const prov=DR2_PROVIDERS.find(p=>p.id===S.provider);const svc=S.service?prov.services.find(s=>s[0]===S.service):null;
    const eligible=App.data.orders.filter(o=>o.type==="delivery"&&!["cancelled","delivered"].includes(o.status)&&o.paid==="paid"&&!o.courier).slice(0,25);
    /* ids: DLRS-145 DLRS-146 DLRS-147 DLRS-148 DLRS-149 DLRS-150 DLRS-151 DLRS-168 DLRS-169 DLRS-170 */
    return `<div class="dr2-wide"><div><div class="note-box mb16">Parcels by carrier – not the Uber path and not the DPD board. Quote first, then book; the order gets a delivery with the carrier's reference and cost.</div>
    <div class="dr-inline mb16"><span><span class="caps">Preferred services</span> <span class="chipgrp">${prov.chosen!=="provider default"?`<span class="tag --line">${E(prov.chosen)}</span>`:`<span class="muted">none set – provider default</span>`}</span></span><span><span class="caps">Saturday</span> ${DR.flags.saturday?"On":"Off"}</span></div>
    <div class="tbl-wrap mb16"><table class="tbl"><thead><tr><th>Provider</th><th>Chosen service</th><th class="num">Services</th></tr></thead><tbody>${DR2_PROVIDERS.map(p=>`<tr class="${p.id===S.provider?"r on":"r"}" onclick="DRX.shProv('${p.id}')"><td>${E(p.n)}${p.id==="shiptheory"?` <span class="tag --line">default</span>`:""}</td><td>${E(p.chosen)}</td><td class="num">${p.services.length}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="card"><span class="caps">Book a shipment</span><div class="col" style="gap:12px">
      <div class="field"><label>Order · ${eligible.length} paid, open, no courier yet</label><select class="select" onchange="DR.ship.order=this.value;DR.ship.quote=null;DRX.re()"><option value="">Choose an order</option>${eligible.map(o=>{const c=App.customer(o.customer);return `<option value="${o.id}" ${String(S.order)===String(o.id)?"selected":""}>#${o.id} · ${E(o.recipient||c.n)} · ${E((o.addr||"").split(",").pop().trim()||"SE1")}</option>`}).join("")}</select><span class="xs muted">Cancelled, delivered, unpaid and already-couriered orders are excluded (they used to slip in).</span></div>
      <div class="field"><label>Provider</label><select class="select" onchange="DRX.shProv(this.value)">${DR2_PROVIDERS.map(p=>`<option value="${p.id}" ${p.id===S.provider?"selected":""}>${E(p.n)}</option>`).join("")}</select></div>
      <div class="field dr2-sv"><label>Service</label>${svc?`<div class="row"><span class="tag --ink">${E(svc[1])}</span>${svc[2]?`<span class="tag --line">Saturday</span>`:""}<span class="tnum muted xs">${svc[0]}</span><span class="sp"></span><button class="textbtn" onclick="DR.ship.service=null;DRX.re()">Clear</button></div>`:`<input class="input" id="dr-sh-q" placeholder="Search by name or code" oninput="DRX.shSearch(this.value)" onfocus="DRX.shSearch(this.value)"><div class="dr2-svl" id="dr-sh-list" style="display:none"></div><span class="xs muted">No service chosen → ${E(prov.n)}'s default is used (and only this provider's – never another provider's).</span>`}</div>
      ${DR.flags.saturday?`<label class="check"><span class="switch ${S.saturday?"on":""}" onclick="DR.ship.saturday=!DR.ship.saturday;DRX.re()"></span> Saturday delivery</label>`:""}
      ${S.quote?`<div class="note-box --ok"><b>Quote:</b> ${E(S.quote.svc)} · ${App.fmt(S.quote.price)} · collection ${S.quote.when}</div>`:""}
      <div class="btn-row">${mgr?`<button class="btn --secondary --sm" ${S.order?"":"disabled"} onclick="DRX.shQuote()">Quote</button><button class="btn --sm" ${S.order?"":"disabled"} onclick="DRX.shShip()">Ship now</button>`:`<span class="dr-flag">${ic("lock")} Quote and booking – managers only</span>`}</div></div></div></div>`},
  shProv(id){DR.ship.provider=id;DR.ship.service=null;DR.ship.quote=null;this.re()},
  shSearch(q){const prov=DR2_PROVIDERS.find(p=>p.id===DR.ship.provider);const l=App.$("#dr-sh-list");const qq=(q||"").toLowerCase();const m=prov.services.filter(s=>!qq||s[1].toLowerCase().includes(qq)||s[0].toLowerCase().includes(qq));l.style.display="block";l.innerHTML=m.length?m.map(s=>`<button onclick="DR.ship.service='${s[0]}';DR.ship.quote=null;DRX.re()"><span>${DR_ESC(s[1])}</span>${s[2]?`<span class="tag --line">Saturday</span>`:""}<span class="sp"></span><span class="xs muted tnum">${s[0]}</span></button>`).join(""):`<button disabled class="muted">No service matches</button>`},
  shQuote(){const S=DR.ship;const prov=DR2_PROVIDERS.find(p=>p.id===S.provider);const svc=S.service?prov.services.find(s=>s[0]===S.service):prov.services[0];S.quote={svc:prov.n+" · "+svc[1]+(S.saturday?" (Saturday)":""),price:S.saturday?12.4:7.9,when:"tomorrow 10:00–12:00"};this.re();App.toast("Quote received from "+prov.n+" – shown above, nothing booked")},
  shShip(){const S=DR.ship;const prov=DR2_PROVIDERS.find(p=>p.id===S.provider);const svc=S.service?prov.services.find(s=>s[0]===S.service):prov.services[0];const o=App.order(S.order);
    App.confirm("Book #"+S.order+" with "+prov.n+"?",svc[1]+(S.saturday?" · Saturday":"")+" · "+(S.quote?App.fmt(S.quote.price):"price on booking")+". The provider's answer is checked: an error or a timeout shows here as an error, not as “Shipment booked”.","Ship now",()=>{if(prov.id==="fake"){App.toast("Provider error: Fake provider is not configured – nothing booked");return}App.assignCourier(o.id,prov.n);App.setOrderStatus(o.id,"ready",{silent:true});S.order=null;S.quote=null;this.re();App.toast("Shipment booked · "+prov.n+" ref SHP-"+o.id+" · delivery created, cost recorded")})}
});

};
if(window.DRX)window.__dr2init();

window.mount_delivery_courier_pay=function(){const $=App.$,ic=App.icon;DRX.nav($("#dr-cp-nav"),"pay");
  $("#dr-cp-head").innerHTML=`${DRX.rangeBar("pay","Show")}<span class="sp"></span><button class="btn --ghost --sm" onclick="App.toast('courier-pay.csv · Courier, Hours, Hourly pay, Deliveries, Per-delivery pay, Total, Paid, Unpaid · applied period '+DRX.fd(DR.range.pay[0])+' – '+DRX.fd(DR.range.pay[1])+' · audited')">${ic("download")} Export CSV</button>`;
  $("#dr-cp-body").innerHTML=DRX.cpBody()};
window.mount_delivery_eta=function(){const $=App.$;DRX.nav($("#dr-et-nav"),"eta");const cs=[...new Set(DR2_TRIPS.map(t=>t.courier))];
  $("#dr-et-head").innerHTML=`<div><div class="h3">ETA accuracy</div><div class="sm muted">arrival radius 120 m · 6 min per stop · ${DRX.fd(DR.range.eta[0])} – ${DRX.fd(DR.range.eta[1])}</div></div><span class="sp"></span><div class="dr-form"><div class="field"><label>From</label><input class="input" type="date" value="${DR.range.eta[0]}" onchange="App.$('#dr-eta-to').value>=this.value?(DR.range.eta[0]=this.value,DRX.re()):(App.toast('From is later than To – swapped'),DR.range.eta=[App.$('#dr-eta-to').value,this.value],DRX.re())"></div><div class="field"><label>To</label><input class="input" type="date" id="dr-eta-to" value="${DR.range.eta[1]}" onchange="DR.range.eta[1]=this.value;DRX.re()"></div><div class="field"><label>Courier</label><select class="select" style="width:160px" onchange="DRX.etCourier(this.value)"><option value="all">All couriers</option>${cs.map(c=>`<option value="${c}" ${DR.eta.courier===c?"selected":""}>${DR_ESC(DR_CN(c))}</option>`).join("")}</select></div></div>`;
  $("#dr-et-body").innerHTML=DRX.etBody()};
window.mount_delivery_zones=function(){const $=App.$;if(!DR.zones)DR.zones=DR2_ZONES_INIT.map(z=>({...z}));DRX.nav($("#dr-zn-nav"),"zones");
  $("#dr-zn-head").innerHTML=`<div><div class="h3">Zones & rules</div><div class="sm muted">colour, cutoff, eco-only, active · polygons live in the map editor</div></div><span class="sp"></span><button class="btn --sm" onclick="DRX.znEdit()">${App.icon("plus")} Add zone</button>`;
  $("#dr-zn-body").innerHTML=DRX.znBody()};
window.mount_delivery_consents=function(){const $=App.$;DRX.nav($("#dr-cs-nav"),"consents");
  if(!DR.flags.consent){$("#dr-cs-head").innerHTML="";$("#dr-cs-body").innerHTML=DRX.empty("lock","Geo-consents are off","DELIVERY_CONSENT_ENABLED=false – the tab used to stay visible and answer 404; now it says so",`<button class="btn --ghost --sm" onclick="DR.flags.consent=true;DRX.re()">Turn the flag on (demo)</button>`);return}
  $("#dr-cs-head").innerHTML=`<div><div class="h3">Geo-consents</div><div class="sm muted">journal of signed location-tracking consents</div></div>`;$("#dr-cs-body").innerHTML=DRX.csBody()};
window.mount_delivery_exports=function(){const $=App.$;DRX.nav($("#dr-ex-nav"),"exports");$("#dr-ex-head").innerHTML=`<div class="h3">Exports</div><span class="sp"></span>${DRX.rangeBar("exports","Apply")}`;$("#dr-ex-body").innerHTML=DRX.exBody()};
window.mount_delivery_shipping=function(){const $=App.$;DRX.nav($("#dr-sh-nav"),"shipping");$("#dr-sh-head").innerHTML=`<div><div class="h3">Shipping</div><div class="sm muted">multi-carrier parcels · ${DR.flags.shipping?"enabled":"off"}</div></div>`;$("#dr-sh-body").innerHTML=DRX.shBody()};
["delivery-courier-pay","delivery-eta","delivery-zones","delivery-consents","delivery-exports","delivery-shipping"].forEach(id=>document.addEventListener("orders",()=>{if(App.state.current===id)window["mount_"+id.replace(/-/g,"_")](App.state.params)}));
document.addEventListener("click",e=>{const l=document.getElementById("dr-sh-list");if(l&&!e.target.closest(".dr2-sv"))l.style.display="none"});
</script>
