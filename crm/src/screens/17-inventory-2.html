.inv-scr .diff{font-size:12px}.inv-scr .diff.--short{color:var(--accent)}.inv-scr .diff.--over{color:var(--warn)}.inv-scr .diff.--ok{color:var(--ok)}

<script>
/* ===== 17-2 · Expected · Receive · Deliveries · Suppliers · Scorecard · Reorder ===== */
(()=>{
const A=App,I=INV,esc=A.esc,ic=A.icon,$=A.$;
const S=window.S17;Object.assign(S,{poSt:"",poSup:"",rcv:null,preview:null,ovEdit:null,reorderSel:null,reorderQty:{},scSup:"",scFrom:"",scTo:""});
const poPill=st=>`<span class="pill ${({draft:"--queue",ordered:"--making",transit:"--out",partial:"--photo",received:"--ready",cancelled:"--cancelled"})[st]}">${I.PO_ST[st]}</span>`;
const supSelect=(v,on,all)=>`<select class="select" onchange="${on}"><option value="">${all||"All suppliers"}</option>${I.suppliers.filter(s=>s.active).map(s=>`<option value="${s.id}" ${Number(v)===s.id?"selected":""}>${esc(s.n)}</option>`).join("")}</select>`;

/* ---------- EXPECTED list ---------- */
window.mount_purchasing_expected=function(){
  const c=I.can();let list=(I.demo.empty?[]:I.pos).filter(p=>(!S.poSt||p.st===S.poSt)&&(!S.poSup||p.sup===+S.poSup)).sort((a,b)=>new Date(a.expected)-new Date(b.expected));
  /* ids: INVT-142 INVT-143 INVT-144 INVT-326 */
  I.head("purchasing-expected","Expected deliveries",`${list.length} purchase orders · sorted by expected date, all time (old received and cancelled first – no default status filter)`,c.manage?`<button class="btn --sm" onclick="App.go('purchasing-expected-form',{})">${ic("plus")} <span class="t">New expected delivery</span></button>`:"");
  I.body("purchasing-expected").innerHTML=`<div class="toolbar"><select class="select" style="width:180px" onchange="S17.poSt=this.value;App.remount()"><option value="">All statuses</option>${Object.entries(I.PO_ST).map(([k,v])=>`<option value="${k}" ${S.poSt===k?"selected":""}>${v}</option>`).join("")}</select><div style="width:200px">${supSelect(S.poSup,"S17.poSup=this.value;App.remount()")}</div><span class="muted xs">?status=${S.poSt||"all"}&supplier_id=${S.poSup||"all"}</span></div>
  <!-- ids: INVT-145 INVT-146 INVT-147 --><div class="tbl-wrap"><table class="tbl"><thead><tr><th>No.</th><th>Supplier</th><th>Expected</th><th>Note</th><th>Status</th><th class="num">Lines</th>${c.cost?`<th class="num">Total</th>`:""}</tr></thead><tbody>
  ${list.length?list.map(p=>`<tr class="r ${["ordered","transit"].includes(p.st)&&I.days(p.expected)<0?"--accent":""}" onclick="App.go('purchasing-expected-show',{id:${p.id}})"><td><b>${p.code}</b></td><td>${esc(I.supplier(p.sup).n)}</td><td>${A.fmtDay(p.expected)} · ${A.fmtTime(p.expected)}</td><td class="muted">${esc(p.note)||"–"}</td><td>${poPill(p.st)}</td><td class="num">${p.lines.length}</td>${c.cost?`<td class="num">${I.money(I.poTotal(p))}${p.cur!=="GBP"?` <span class="xs muted">${p.cur}</span>`:""}</td>`:""}</tr>`).join(""):`<tr><td colspan="7">${I.empty("box","Nothing expected")}</td></tr>`}</tbody></table></div>`;
};

/* ---------- EXPECTED show ---------- */
window.mount_purchasing_expected_show=function(params){
  const c=I.can();const p=I.po(params&&params.id)||I.pos[3];S.po=p.id;const receivable=!["draft","cancelled"].includes(p.st);const left=p.lines.filter(l=>l.rcv<l.qty);
  /* ids: INVT-148 INVT-149 INVT-150 INVT-151 INVT-152 INVT-153 */
  I.head("purchasing-expected-show",`${p.code} · ${esc(I.supplier(p.sup).n)}`,`${poPill(p.st)} &nbsp; Expected ${A.fmtDay(p.expected)} · ${A.fmtTime(p.expected)}${p.note?" · "+esc(p.note):""}${p.ref?` · Supplier's order no. ${esc(p.ref)}`:""}${c.cost?` · <b>Total expected ${I.money(I.poTotal(p))}${p.cur!=="GBP"?" "+p.cur:""}</b>`:""}`,
    `<button class="btn --ghost --sm" onclick="App.go('purchasing-expected')">${ic("back")} <span class="t">Back to Expected</span></button>${c.manage?`<button class="btn --ghost --sm" onclick="App.go('purchasing-expected-form',{id:${p.id}})">${ic("edit")} <span class="t">Edit</span></button>${receivable?`<button class="btn --ghost --sm" onclick="App.go('inventory-receive',{po:${p.id}})">${ic("edit")} <span class="t">Receive with changes</span></button><button class="btn --sm" onclick="S17P.acceptAll(${p.id})">${ic("check")} <span class="t">Accepted as ordered</span></button>`:""}`:""}`);
  I.body("purchasing-expected-show").innerHTML=`<!-- ids: INVT-154 -->${!c.manage?`<div class="note-box --info mb16">${I.roleNote("Manager+ only – opens the receiving form or books everything as ordered.")}</div>`:receivable?`<div class="note-box --info mb16">«Accepted as ordered» books everything not yet received at the ordered quantity and price in one click: receipt, movements, on hand, average cost, order status; open restock requests for these items close as Arrived. The redesign asks once before.</div>`:""}
  <!-- ids: INVT-155 INVT-156 INVT-157 --><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th class="num">Expected</th><th class="num">Received</th><th>Difference</th>${c.cost?`<th class="num">Cost/unit</th>`:""}</tr></thead><tbody>
  ${p.lines.length?p.lines.map(l=>{const it=l.item?I.item(l.item):null;const d=l.rcv-l.qty;return `<tr>${it?I.itemCell(it,it.unit):`<td class="it"><span class="thumb --s"></span><div class="t"><b>${esc(l.name)}</b><small class="warn">no stock item yet – «Accepted as ordered» sends you to the receiving form</small></div></td>`}<td class="num">${l.qty}</td><td class="num">${l.rcv}</td><td><span class="diff ${l.rcv===0?"":d<0?"--short":d>0?"--over":"--ok"}">${l.rcv===0?"Not received yet":d===0?"Matches":d<0?`${-d} short`:`+${d} over`}</span></td>${c.cost?`<td class="num">${I.money(l.cost)}</td>`:""}</tr>`}).join(""):`<tr><td colspan="5">${I.empty("box","No lines")}</td></tr>`}</tbody></table></div>
  ${left.length===0&&receivable?`<p class="xs muted mt8">Nothing left to receive against this order.</p>`:""}`;
};
window.S17P={
  acceptAll(id){const p=I.po(id);const left=p.lines.filter(l=>l.rcv<l.qty);if(!left.length){A.toast("Nothing left to receive against this order");return}if(left.some(l=>!l.item)){A.toast("A line has no stock item – opening the receiving form");A.go("inventory-receive",{po:id,err:"Pick a stock item or type what was ordered."});return}
    A.confirm("Accept as ordered?",`${left.length} line${left.length>1?"s":""} at the ordered quantity and price. Receipt, movements and average cost are booked now.`,"Accept",()=>{const r={id:I.receipts[0].id+1,code:"RCPT-"+(I.receipts[0].id+1),sup:p.sup,inv:"",at:A.NOW.toISOString(),po:p.id,cur:p.cur,rate:p.cur==="EUR"?.853:null,freight:0,levies:0,packaging:0,fees:0,freightEst:false,lines:left.map(l=>({item:l.item,qty:l.qty-l.rcv,cost:l.cost,fresh:null}))};I.receipts.unshift(r);left.forEach(l=>{I.addMovement(I.item(l.item),"receipt",l.qty-l.rcv,r.code,"Accepted as ordered");l.rcv=l.qty;I.requests.filter(q=>q.item===l.item&&["new","ordered"].includes(q.st)).forEach(q=>{q.st="arrived";q.stNote="Arrived with "+p.code})});p.st="received";p.locked=true;A.toast("Goods received · "+r.code);A.remount()})}
};

/* ---------- EXPECTED form ---------- */
window.mount_purchasing_expected_form=function(params){
  const c=I.can();const p=params&&params.id?I.po(params.id):null;
  if(!S.pf||S.pf.id!==(p?p.id:0))S.pf={id:p?p.id:0,sup:p?p.sup:"",ref:p?p.ref:"",ordered:p?p.ordered:"",expected:p?p.expected:"",note:p?p.note:"",st:p?p.st:"ordered",cur:p?p.cur:"GBP",memo:"",lines:p?p.lines.map(l=>({item:l.item||"",name:l.name||"",qty:l.qty,cost:l.cost})):[{item:"",name:"",qty:"",cost:""}]};
  const f=S.pf;const total=f.lines.reduce((s,l)=>s+(+l.qty||0)*(+l.cost||0),0);
  /* ids: INVT-158 INVT-159 */
  I.head("purchasing-expected-form",p?`Edit ${p.code}`:"New expected delivery",p?esc(I.supplier(p.sup).n):"Header + lines · the code is generated on save",`<button class="btn --ghost --sm" onclick="App.go(${p?`'purchasing-expected-show',{id:${p.id}}`:"'purchasing-expected'"})">${ic("back")} <span class="t">Back</span></button><button class="btn --sm" onclick="S17F.save()">Save</button>`);
  I.body("purchasing-expected-form").innerHTML=`${p&&p.locked?`<div class="note-box --warn mb16">A delivery has already been received against this order – the lines can no longer be changed.</div>`:""}
  <!-- ids: INVT-160 INVT-327 --><div class="card"><div class="caps">Header</div><div class="form-grid"><div class="field"><label>Supplier</label>${supSelect(f.sup,"S17.pf.sup=this.value","Pick a supplier…")}</div><div class="field"><label>Supplier's order no.</label><input class="input" value="${esc(f.ref)}" onchange="S17.pf.ref=this.value"></div><div class="field"><label>Ordered on</label><input class="input" value="${f.ordered?I.fd(f.ordered):""}" placeholder="20 Oct" onchange="S17.pf.ordered=this.value"></div><div class="field"><label>Expected on *</label><input class="input" value="${f.expected?I.fd(f.expected):""}" placeholder="22 Oct" onchange="S17.pf.expected=this.value"></div><div class="field"><label>Note</label><input class="input" value="${esc(f.note)}" placeholder="morning · before 12:00" onchange="S17.pf.note=this.value"></div><div class="field"><label>Status</label><select class="select" onchange="S17.pf.st=this.value">${Object.entries(I.PO_ST).map(([k,v])=>`<option value="${k}" ${f.st===k?"selected":""}>${v}</option>`).join("")}</select></div><div class="field"><label>Currency</label><select class="select" onchange="S17.pf.cur=this.value">${["GBP","EUR","USD"].map(x=>`<option ${f.cur===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field --4"><label>Note (long)</label><textarea class="textarea" onchange="S17.pf.memo=this.value">${esc(f.memo)}</textarea></div></div><p class="xs muted mt8">Status set by hand (even Received without a receipt) is recomputed at the next receipt – the manual value is overwritten.</p></div>
  ${p&&p.locked?"":`<!-- ids: INVT-161 INVT-162 INVT-163 INVT-164 INVT-319 --><div class="card mt16 lines"><div class="caps">Lines</div><div class="tbl-wrap --flush"><table class="tbl"><thead><tr><th style="width:40%">Item</th><th class="num">Qty</th><th class="num">Cost/unit ex VAT</th><th class="num">Line sum</th><th></th></tr></thead><tbody>
  ${f.lines.map((l,k)=>`<tr><td>${I.picker("pl"+k,l.item,`onchange="S17F.pick(${k},this.value)"`)}${!l.item?`<input class="input mt8" placeholder="Pick a stock item, or type a name…" value="${esc(l.name)}" onchange="S17.pf.lines[${k}].name=this.value">`:""}</td><td class="num"><input class="input" style="text-align:right" value="${esc(l.qty)}" onchange="S17.pf.lines[${k}].qty=this.value;App.remount()"></td><td class="num">${c.cost?`<input class="input" style="text-align:right" value="${esc(l.cost)}" onchange="S17.pf.lines[${k}].cost=this.value;App.remount()">`:`<input class="input" style="text-align:right" placeholder="admins only" title="Purchase prices are visible to admins only – an empty price keeps the existing one" onchange="S17.pf.lines[${k}].cost=this.value;App.remount()">`}</td><td class="num">${c.cost?I.money((+l.qty||0)*(+l.cost||0)):"–"}</td><td><button class="ib" ${f.lines.length>1?"":"disabled"} onclick="S17.pf.lines.splice(${k},1);App.remount()">${ic("close")}</button></td></tr>`).join("")}
  </tbody>${c.cost?`<tfoot><tr><td colspan="3" class="num">Total expected</td><td class="num"><b>${I.money(total)}</b></td><td></td></tr></tfoot>`:""}</table></div><div class="row mt8"><button class="btn --ghost --sm" onclick="S17.pf.lines.push({item:'',name:'',qty:'',cost:''});App.remount()">${ic("plus")} Add row</button>${c.cost?`<span class="xs muted">picking an item fills its last cost</span>`:`<span class="xs muted">${ic("lock")} Purchase prices are visible to admins only</span>`}</div></div>`}`;
};
window.S17F={

  <!-- ids: INVT-286 INVT-287 INVT-288 INVT-289 INVT-291 INVT-336 --><div class="sec-head"><div class="h3">What to reorder</div><span class="xs muted">${I.roleNote("Reorder point, qty and preferred supplier come from reorder_rules – no web editor yet (seeded in the DB)")}</span></div>

<script>

(()=>{

window.mount_inventory_claim_form=function(params){

  if(!S.cf||S.cf.key!==JSON.stringify(params||{}))S.cf={key:JSON.stringify(params||{}),line:params&&params.line!=null?params.line:0,qty:1,photos:0,reason:late?"late":"damaged",text:"",disp:"markdown",md:"",comment:"",amount:"",filing:false};

  const blocked=edible&&f.disp==="markdown"&&f.reason!=="damaged";
  const ok=late?f.amount!==""&&+f.amount>=0:(ln&&f.qty>=1&&!(f.reason==="other"&&!f.text.trim())&&!blocked);
  /* ids: INVT-194 INVT-195 INVT-008 */
  I.head("inventory-claim-form",late?"Report a late delivery":"Report a defect",`${esc(I.supplier(r.sup).n)} · Delivery: ${r.code}${r.inv?" · "+esc(r.inv):""} · no tab strip on this page – back only by the button`,`<button class="btn --ghost --sm" onclick="App.go('purchasing-receipt',{id:${r.id}})">${ic("back")} <span class="t">Back to delivery</span></button>`);
  I.body("inventory-claim-form").innerHTML=`<div class="two"><div class="stack"><div class="card">
  ${late?"":`<!-- ids: INVT-196 INVT-197 --><div class="grid g2"><div class="field"><label>Position</label><select class="select" onchange="S17.cf.line=+this.value;S17.cf.qty=1;App.remount()">${r.lines.map((l,k)=>`<option value="${k}" ${f.line===k?"selected":""}>${esc(I.item(l.item).name)} (${l.qty})</option>`).join("")}</select></div><div class="field"><label>Bad quantity · of ${ln?ln.qty:0} received</label><input class="input" inputmode="numeric" value="${f.qty}" onchange="S17.cf.qty=Math.max(1,Math.min(${ln?ln.qty:1},+this.value||1));App.remount()"></div></div>`}
  <!-- ids: INVT-198 --><div class="field mt16"><label>Photo</label><div class="photos">${Array.from({length:f.photos},(_,k)=>`<span class="thumb" title="photo ${k+1}"><img src="img/${["peach-posy","white-spray","lilac-dream"][k%3]}.webp" alt=""></span>`).join("")}<button class="btn --ghost --sm" onclick="S17.cf.photos=Math.min(8,S17.cf.photos+1);App.remount()">${ic("photo")} ${f.photos?"Add another":"Take a photo"}</button><span class="xs muted">rear camera on the phone · up to 8 · jpeg / png / webp ≤ 15 MB – the limit is shown here, not swallowed</span></div></div>
  <!-- ids: INVT-199 INVT-200 INVT-333 --><div class="field mt16"><label>Reason</label><div class="chips">${late?`<button class="chip on">Late</button>`:REASONS.map(x=>`<button class="chip ${f.reason===x[0]?"on":""}" onclick="S17.cf.reason='${x[0]}';S17.cf.disp='${DEF[x[0]]}';App.remount()">${x[1]}</button>`).join("")}</div>${!late?`<span class="xs muted">changing the reason resets «What happens to the goods» to its default</span>`:""}</div>
  <div class="field mt16"><label>${f.reason==="other"?"Describe the reason *":"Note (optional)"}</label><textarea class="textarea" onchange="S17.cf.text=this.value;App.remount()">${esc(f.text)}</textarea></div>
  ${late?`<!-- ids: INVT-205 --><div class="field mt16"><label>Amount claimed, £</label><input class="input" value="${esc(f.amount)}" placeholder="from the supplier's late-penalty terms · 0 is fine" onchange="S17.cf.amount=this.value;App.remount()"><span class="xs muted">${esc(I.supplier(r.sup).late||"no penalty terms on file")}</span></div>`:`<!-- ids: INVT-201 INVT-202 INVT-203 INVT-204 --><div class="field mt16"><label>What happens to the goods</label><div class="chips">${DISP.map(x=>`<button class="chip ${f.disp===x[0]?"on":""}" onclick="S17.cf.disp='${x[0]}';App.remount()">${x[1]}</button>`).join("")}</div></div>

  <!-- ids: INVT-206 INVT-332 --><div class="row mt16"><button class="btn" ${ok&&!f.filing?"":"disabled"} onclick="S17C.file(${r.id},${late})">${f.filing?"Filing…":"File claim"}</button><span class="xs muted">queued with a 5-minute cancel window, then e-mailed to the supplier (${I.supplier(r.sup).email?I.supplier(r.sup).lang+" · "+esc(I.supplier(r.sup).email):I.supplier(r.sup).portal?"portal only – will be marked send failed":"no claims e-mail – will be marked send failed"})</span></div>
  </div></div>
  <div class="stack"><div class="card --flat"><span class="caps">Three taps</span><div class="sm">Position → reason → file. Write off / Use internally book a write-off with reason supplier_claim; Markdown moves the quantity to a markdown card; Return / Hold change nothing on the shelf.</div></div>${it?`<div class="card"><span class="caps">Line</span><dl class="kv"><dt>Item</dt><dd>${esc(it.name)}</dd><dt>Category</dt><dd>${it.cat}${edible?" · edible":""}</dd><dt>Received</dt><dd>${ln.qty} ${it.unit} · ${I.money(ln.cost)}/${it.unit}</dd><dt>Fresh until</dt><dd>${ln.fresh?I.fd(ln.fresh):"–"}</dd></dl></div>`:""}</div></div>`;

window.S17C={

  const steps=[["sent","Sent"],["acknowledged","Supplier replied"],["accepted","Recognised"],["refunded","Money received"],["closed","Closed"]];const order=["draft","queued","sent","acknowledged","accepted","partially_accepted","rejected","refunded","closed","expired"];const pos=order.indexOf(x.st);

  <!-- ids: INVT-250 INVT-251 INVT-252 INVT-242 INVT-243 --><div class="card mb16"><div class="row" style="gap:16px;flex-wrap:wrap"><div><span class="caps">Delivery</span>${x.st==="queued"?`<div class="countdown" id="cl-cd">Sends in –:––</div><div class="xs muted">live countdown · 4 s after zero the card reloads to show sent / send failed</div>`:x.st==="send_failed"?`<div class="accent sm">Delivery failed: ${esc(x.events.slice().reverse().find(e=>e.t==="Delivery failed")?.note||"supplier missing")}</div>`:x.st==="draft"?`<div class="sm muted">Not sent – draft</div>`:`<div class="sm">Sent ${I.fdt((x.events.find(e=>e.t==="Sent to supplier")||x.events[0]).at)}${ds!=null?` · <span class="${ds>=3?"warn":"muted"}">${ds} days silent</span>`:""}</div>`}</div><span class="sp"></span>
    ${x.st==="queued"&&own?`<button class="btn --ghost --sm" title="The e-mail hasn't gone out yet – cancelling returns this claim to draft." onclick="S17K.cancel(${x.id})">${ic("close")} Cancel sending</button>`:""}${x.st==="send_failed"&&own?`<button class="btn --sm" onclick="S17K.retry(${x.id})">${ic("refresh")} Retry</button>`:""}
    ${c.manage?`${x.st==="sent"?`<button class="btn --ghost --sm" onclick="S17K.ack(${x.id})">Supplier replied</button>`:""}${["sent","acknowledged"].includes(x.st)?`<button class="btn --sm" onclick="S17K.acceptModal(${x.id})">Record what was recognised</button>`:""}${["accepted","partially_accepted"].includes(x.st)?`<button class="btn --sm" onclick="S17K.refundModal(${x.id})">Money received</button>`:""}${!["closed","expired"].includes(x.st)?`<button class="btn --ghost --sm" onclick="S17K.close(${x.id})">Close claim</button>`:""}`:["sent","acknowledged","accepted","partially_accepted"].includes(x.st)?`<!-- ids: INVT-248 -->${I.roleNote("Only a manager can log the supplier's answer, recognised amount or refund.")}`:""}</div>
    <div class="steps mt16">${steps.map((st,k)=>{const idx=order.indexOf(st[0]);const done=pos>idx||(st[0]==="accepted"&&["partially_accepted","refunded","closed"].includes(x.st))||x.st===st[0];const now=x.st===st[0]||(st[0]==="accepted"&&x.st==="partially_accepted");return `<div class="${done?"--done":""} ${now?"--now":""}"><b>${st[1]}</b><span>${st[0]==="sent"?(x.st==="queued"?"queued":x.st==="send_failed"?"failed":"e-mail"):st[0]==="acknowledged"?"no form":st[0]==="accepted"?"amount + note":st[0]==="refunded"?"amount + date":"any status"}</span></div>`}).join("")}</div></div>

   </div>

window.S17K={
  startTick(x){const el=()=>$("#cl-cd");const f=()=>{const e=el();if(!e){clearInterval(S.tick);return}const left=Math.round((new Date(x.sendAfter)-Date.now())/1000);if(left>0){e.textContent=`Sends in ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`}else{e.textContent="Sending now…";clearInterval(S.tick);setTimeout(()=>{const s=I.supplier(x.sup);if(x.st!=="queued")return;if(!s.email||s.portal||!s.autoSend){x.st="send_failed";x.events.push({at:A.NOW.toISOString(),t:"Delivery failed",who:"system",note:s.portal?"Portal only – file through the supplier portal":!s.email?"No claims e-mail":"Auto-send switched off"})}else{x.st="sent";x.events.push({at:A.NOW.toISOString(),t:"Sent to supplier",who:"system",note:s.email+" · "+s.lang})}if(A.state.current==="inventory-claim")A.remount()},4000)}};f();S.tick=setInterval(f,1000)},
  cancel(id){const x=I.claim(id);x.st="draft";x.events.push({at:A.NOW.toISOString(),t:"Sending cancelled",who:A.me().id,note:""});A.toast("Back to draft – the e-mail will not go out");A.remount()},
  retry(id){const x=I.claim(id);x.st="queued";x.sendAfter=new Date(Date.now()+5*60*1000).toISOString();x.events.push({at:A.NOW.toISOString(),t:"Retry",who:A.me().id,note:"new 5-minute window"});A.toast("Queued again · sends in 5 min");A.remount()},
  ack(id){const x=I.claim(id);x.st="acknowledged";x.events.push({at:A.NOW.toISOString(),t:"Supplier replied",who:A.me().id,note:""});A.toast("Supplier reply logged");A.remount()},
  acceptModal(id){const x=I.claim(id);A.modal({title:"Record what was recognised",body:`<div class="field"><label>Amount recognised, £</label><input class="input" id="ac-a" value="${(x.claimed-x.accepted).toFixed(2)}"></div><div class="field mt8"><label>Note</label><input class="input" id="ac-n"></div><p class="xs muted mt8">Status becomes Accepted / Partially accepted / Rejected by the amount. Save locks while it runs. <span class="kbd">esc</span> closes.</p>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" id="ac-ok" onclick="this.disabled=true;S17K.accept(${id})">Save</button>`})},
  accept(id){const x=I.claim(id);const a=+$("#ac-a").value||0;if(a<0||a>x.claimed){$("#ac-ok").disabled=false;A.toast("Amount must be between 0 and the claimed sum");return}x.accepted+=a;x.st=x.accepted>=x.claimed?"accepted":x.accepted>0?"partially_accepted":"rejected";x.events.push({at:A.NOW.toISOString(),t:x.st==="rejected"?"Rejected":"Amount recognised",who:A.me().id,note:I.money(a)+($("#ac-n").value?" – "+$("#ac-n").value:"")});A.closeModal();A.toast(I.CL_ST[x.st]);A.remount()},
  refundModal(id){const x=I.claim(id);A.modal({title:"Money received",body:`<div class="field"><label>Amount received, £</label><input class="input" id="rf-a" value="${(x.accepted-x.refunded).toFixed(2)}"></div><div class="grid g2 mt8"><div class="field"><label>Date received</label><input class="input" id="rf-d" value="${I.fd(A.NOW.toISOString())}"></div><div class="field"><label>Note</label><input class="input" id="rf-n" placeholder="credit note no."></div></div><p class="xs muted mt8"><span class="kbd">esc</span> closes</p>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="this.disabled=true;S17K.refund(${id})">Save</button>`})},
  refund(id){const x=I.claim(id);const a=+$("#rf-a").value||0;x.refunded+=a;x.st="refunded";x.events.push({at:A.NOW.toISOString(),t:"Money received",who:A.me().id,note:I.money(a)+($("#rf-n").value?" · "+$("#rf-n").value:"")});A.closeModal();A.toast("Refund logged");A.remount()},
  close(id){const x=I.claim(id);A.confirm("Close "+x.code+"?","Closes the claim at its current amounts. The old CRM did this without asking.","Close claim",()=>{x.st="closed";x.events.push({at:A.NOW.toISOString(),t:"Closed",who:A.me().id,note:""});A.toast("Claim closed");A.remount()})}

<script>
/* ===== 17-2 · Recipes · Recipe deviations · Photo corrections ===== */
(()=>{
const A=App,I=INV,esc=A.esc,ic=A.icon,$=A.$;
const S=window.S17;Object.assign(S,{rcQ:"",rcRev:"",rcSel:null,rcDraft:null,dvFrom:"",dvTo:"",pcFrom:"",pcTo:""});

/* ---------- RECIPES ---------- */
window.mount_recipes=function(params){
  const c=I.can();

  let sel=list.find(r=>r.id===S.rcSel)||list[0];if(sel&&S.rcSel!==sel.id){S.rcSel=sel.id;S.rcDraft=null}

  const margins=all.map(I.rcMargin).filter(m=>m!=null);const avg=margins.length?margins.reduce((a,b)=>a+b,0)/margins.length:0;
  /* ids: INVT-292 INVT-293 INVT-294 INVT-295 INVT-296 INVT-297 */
  I.head("recipes","Recipes",`BOM per variant · cost, margin, how many you can build now · ?q=${encodeURIComponent(S.rcQ)}&variant=${S.rcSel||""}&reviewed=${S.rcRev} (replaceState, shareable)`,`<div class="seg-ctl">${[["","All"],["0","Not reviewed"],["1","Reviewed"]].map(x=>`<button class="${S.rcRev===x[0]?"on":""}" onclick="S17.rcRev='${x[0]}';App.remount()">${x[1]}</button>`).join("")}</div>`);
  const kp=(t,v,cls)=>`<div class="kpi-card" style="cursor:default"><span class="caps">${t}</span><span class="kpi-s tnum ${cls||""}">${v}</span></div>`;
  I.body("recipes").innerHTML=`<div class="grid ${c.cost?"g4":"g3"} mb16">${kp("Recipes",all.length)}${kp("At risk to build",risk,risk?"accent":"")}${kp("Reviewed",`${rev} / ${all.length}`,rev<all.length?"warn":"")}${c.cost?kp("Avg margin",I.pct(avg),avg<45?"warn":""):""}</div>
  <div class="rc-split"><div>
    <div class="toolbar"><div class="search" style="width:100%">${ic("search")}<input placeholder="Product, variant, SKU or item…" value="${esc(S.rcQ)}" oninput="S17.rcQ=this.value;App.remount()"></div></div>
    <!-- ids: INVT-298 INVT-299 INVT-301 --><div class="rc-list">${list.length?list.map(r=>{const m=I.rcMargin(r);return `<button class="${sel&&sel.id===r.id?"on":""}" onclick="S17J.pick(${r.id})"><span class="${r.reviewed?"ok":"muted"}">${r.reviewed?"✓":"·"}</span><span class="nm">${esc(r.name)} · ${r.variant}</span>${buildTag(r)}<span class="pr">${c.cost&&r.lines.length?`${I.money(I.rcCost(r))} → `:""}${I.money(r.price)}</span>${c.cost&&m!=null?`<span class="mb"><span class="progress ${m>=55?"--ok":m>=40?"--warn":"--accent"}"><i style="width:${Math.max(0,Math.min(100,m))}%"></i></span><span class="${mClass(m)}">${Math.round(m)}%</span></span>`:""}</button>`}).join(""):I.empty("search","Nothing matches the search")}</div></div>
    <div>${sel?S17J.editor(sel):`<div class="card --flat sm muted">The editor shows only a variant visible in the filtered list – nothing to edit.</div>`}</div></div>`;
};
window.S17J={
  pick(id){if(S.rcDraft&&S.rcDraft.dirty){A.confirm("Discard unsaved recipe lines?","Switching the variant rebuilds the editor – the old CRM lost edits silently.","Discard",()=>{S.rcDraft=null;S.rcSel=id;A.remount()});return}S.rcSel=id;S.rcDraft=null;A.remount()},
  editor(r){const c=I.can();if(!S.rcDraft||S.rcDraft.id!==r.id)S.rcDraft={id:r.id,lines:r.lines.map(l=>({...l})),dirty:false};const d=S.rcDraft;const tmp={price:r.price,lines:d.lines.filter(l=>l.item&&+l.qty>0).map(l=>({item:+l.item,qty:+l.qty}))};const m=I.rcMargin(tmp);
    /* ids: INVT-300 INVT-302 INVT-303 INVT-304 INVT-305 INVT-306 INVT-337 INVT-338 INVT-339 INVT-319 */
    return `<div class="card"><div class="row" style="flex-wrap:wrap;gap:16px"><div style="min-width:0"><div class="h3">${esc(r.name)} · ${r.variant}</div><div class="xs muted">${r.reviewed?`reviewed by ${A.user(r.reviewed.who).n} on ${I.fd(r.reviewed.at)}`:"not reviewed yet"}</div></div><span class="sp"></span><label class="check"><span class="switch ${r.reviewed?"on":""}" onclick="S17J.review(${r.id})"></span> Reviewed</label></div>
    <div class="grid ${c.cost?"g4":"g2"} mt16"><div class="kpi-card" style="cursor:default"><span class="caps">Price</span><span class="kpi-s tnum">${I.money(r.price)}</span></div>${c.cost?`<div class="kpi-card" style="cursor:default"><span class="caps">Cost</span><span class="kpi-s tnum">${I.money(I.rcCost(tmp))}</span></div><div class="kpi-card" style="cursor:default"><span class="caps">Margin</span><span class="kpi-s tnum ${mClass(m)}">${m==null?"–":I.pct(m)}</span></div>`:""}<div class="kpi-card" style="cursor:default"><span class="caps">Buildable now</span><span class="kpi-s tnum">${I.rcBuild(tmp)??"–"}</span></div></div>

    <p class="xs muted mt8">Saving replaces the lines (empty items dropped) and does not set Reviewed; pet toxicity is recomputed and the pet_toxic flag written to the live storefront – a storefront error never blocks the save. The same editor serves the catalog product card and the marketplace menu.</p></div>`},
  review(id){const r=I.recipe(id);if(r.reviewed){A.confirm("Un-review this recipe?","Clears who reviewed it and when. The old CRM did this without asking.","Un-review",()=>{r.reviewed=null;A.toast("Review cleared");A.remount()});return}r.reviewed={who:A.me().id,at:A.NOW.toISOString()};A.toast("Marked reviewed · saved at once");A.remount()},

  <!-- ids: INVT-311 --><div class="panel"><div class="p-head"><div class="h4">Sold without a recipe</div></div><div class="p-body"><div class="note-box ${I.demo.writeoffLive?"--warn":"--info"} xs" style="margin:10px 14px">${I.demo.writeoffLive?"Live write-off on «ready» is ON – these bouquets took nothing off the shelf. Add a recipe or the stock drifts.":"Shadow mode – stock is not written off on «ready» yet; these would be the gaps once it goes live."} Not limited by the period.</div>${gaps.length?`<table class="tbl"><thead><tr><th>Bouquet</th><th class="num">Orders</th><th class="num">Marked ready</th><th>Last time</th></tr></thead><tbody>${gaps.map(g=>`<tr class="r" onclick="App.go('recipes',{})"><td>${esc(g.name)}</td><td class="num">${g.orders}</td><td class="num">${g.ready}</td><td>${I.fdt(g.last)}</td></tr>`).join("")}</tbody></table>`:I.empty("check","Everything sold has a recipe")}</div></div></div>`;
};
