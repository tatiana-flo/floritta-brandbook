    <p class="sm soft" style="margin:0 0 12px;max-width:820px">Who answered what on “${esc(l.texts.en.title)}”. The last signed attempt counts; “Not signed” means no answer yet. All active staff are listed, including those who have not signed.</p>

/* ---------- Skills matrix ---------- */

        <div class="field mt16"><label>Notes (optional)</label><textarea class="textarea" id="l19-ob-note" placeholder="What to practise, what went well"></textarea></div>
        ${A.role()==="owner"?`<div class="mt16"><button class="textbtn" onclick="L19M_X.trainer('${uid}',${sid})">${cur&&cur[0]==="trainer"?"Remove trainer status":"Make trainer at this station"}</button> <span class="xs muted">admin only</span></div>`:""}`,
        foot:`<button class="btn --secondary --sm" onclick="App.closeSheet();App.go('skills-matrix')">← Skills matrix</button><span class="sp"></span><span class="xs muted">${!list.length?"Checklist is empty":self?"Not allowed for yourself":all?"":"Tick every step…"}</span><button class="btn --sm ${allOk?"":"--ghost"}" ${all&&!self?"":"disabled"} onclick="L19M_X.obSave('${uid}',${sid},${allOk})">${ic(allOk?"award":"flag")} ${allOk||!all?"Certify":"Record observation"}</button>`,_replace:true})};
    L19M_X.obRender=render;render()},
  obSave(uid,sid,ok){const u=App.user(uid);const note=(document.getElementById("l19-ob-note")||{}).value;L19_MX[uid]=L19_MX[uid]||{};L19_MX[uid][sid]=ok?["admitted","2027-04-20"]:["learning"];if(!L19_ASSIGN.some(a=>a.lesson===sid)&&uid===App.me().id)L19_ASSIGN.push({id:960+sid,lesson:sid,status:"assigned",due:null,reason:"observation"});App.closeSheet();this.mx();App.toast(ok?`${u.n} admitted until 20 Apr 2027 · ${L19_LESSON(sid).min} min to the timesheet`:`Observation recorded · ${u.n} repeats in 14 days`+(note?" · note saved":""))},
  trainer(uid,sid){const m=L19_MX[uid]=L19_MX[uid]||{};const c=m[sid];if(c&&c[0]==="trainer")m[sid]=["admitted",c[1]];else m[sid]=["trainer",c&&c[1]||"2027-10-20"];this.observe(uid,sid);this.mx();App.toast(m[sid][0]==="trainer"?App.user(uid).n+" is a trainer here now":"Trainer status removed")},
  assign(){const A=App,esc=A.esc,ic=A.icon;const S=L19M.assign;const render=()=>{const lessons=L19_LESSONS.filter(l=>l.status==="published");const n=Object.values(S.lessons).filter(Boolean).length;
      A.sheet({eyebrow:"Learning · mentor",title:"Assign to a person",narrow:true,body:`<div class="sm soft">Per person only – no cohorts. Lessons are assigned regardless of role.</div><div class="field mt16"><label>Person</label><select class="select" onchange="L19M.assign.user=this.value">${L19_STAFF_ACTIVE().map(u=>`<option value="${u.id}" ${S.user===u.id?"selected":""}>${esc(u.n)} · ${esc(u.title)}</option>`).join("")}</select></div>
        <div class="mt16"><div class="lbl mb8">What to assign</div><label class="l19-opt"><input type="radio" name="asm" ${S.mode==="lessons"?"checked":""} onchange="L19M.assign.mode='lessons';L19M_X.asRender()"> Individual lessons</label><label class="l19-opt"><input type="radio" name="asm" ${S.mode==="branch"?"checked":""} onchange="L19M.assign.mode='branch';L19M_X.asRender()"> A whole branch</label></div>
        ${S.mode==="branch"?`<div class="field mt16"><label>Branch</label><select class="select" onchange="L19M.assign.branch=this.value">${L19_CATS.map(c=>`<option value="${c.slug}" ${S.branch===c.slug?"selected":""}>${esc(c.en)}</option>`).join("")}<option value="floristry/wrapping">Floristry / Wrapping</option></select></div>`
        :`<div class="mt16"><div class="lbl mb8">Lessons</div><div style="max-height:260px;overflow:auto;border:1px solid var(--hair);padding:6px 10px">${lessons.length?lessons.map(l=>`<label class="check" style="display:flex;margin:6px 0"><input type="checkbox" ${S.lessons[l.id]?"checked":""} onchange="L19M.assign.lessons[${l.id}]=this.checked;L19M_X.asRender()"> <span>${esc(l.texts.en.title)} <span class="xs muted">· ${esc(L19_CAT(l.cat).en)}</span></span></label>`).join(""):`<div class="l-dash">No published lessons yet.</div>`}</div></div>`}`,
        foot:`<span class="xs muted">${S.mode==="lessons"?n+" selected":"whole branch"}</span><span class="sp"></span><button class="btn --sm" ${S.mode==="lessons"&&!n?"disabled":""} onclick="L19M_X.asGo()">Assign</button>`,_replace:true})};
    L19M_X.asRender=render;render()},
  asGo(){const S=L19M.assign;const u=App.user(S.user);const ids=S.mode==="branch"?L19_LESSONS.filter(l=>l.status==="published"&&l.cat===S.branch.split("/")[0]).map(l=>l.id):Object.keys(S.lessons).filter(k=>S.lessons[k]).map(Number);const already=ids.filter(id=>u.id===App.me().id&&L19_ASSIGN.some(a=>a.lesson===id)).length;ids.forEach(id=>{if(u.id===App.me().id&&!L19_ASSIGN.some(a=>a.lesson===id))L19_ASSIGN.push({id:970+id,lesson:id,status:"assigned",due:"2026-10-27",reason:"manual"})});S.lessons={};App.closeSheet();App.toast(`Assigned ${ids.length-already} lesson(s) to ${u.n}; ${already} already assigned.`)},
  budAssign(){const B=L19M.bud;const n=App.user(B.newcomer),b=App.user(B.buddy);if(n.role!==b.role){L19M.budErr="The buddy must have the same role as the newcomer.";this.bud();return}L19M.budErr=null;const st=B.started||"2026-10-20";const d=(k)=>{const x=new Date(st+"T12:00:00");x.setDate(x.getDate()+k);return x.toISOString().slice(0,10)};
    L19_PAIRS.unshift({id:Date.now(),newcomer:n.id,buddy:b.id,started:st,days:[{d:1,t:"Workplace, keys, where everything is",due:d(1),done:null},{d:3,t:"First station",due:d(3),done:null},{d:7,t:"First solo shift",due:d(7),done:null},{d:14,t:"A conversation: how is it going",due:d(14),done:null}]});B.buddy="";B.newcomer="";this.bud();App.toast("Buddy assigned.")},
  budMark(pid){const p=L19_PAIRS.find(x=>x.id===pid);const n=p.days.find(d=>!d.done);App.confirm(`Mark Day ${n.d} done for ${App.user(p.newcomer).n}?`,`“${n.t}” · recorded as marked by ${App.me().n}.`,"Mark done",()=>{window.L19X.buddyDone(pid);this.bud()})}
};
</script>
