<style>
/* ===== 05 · Inbox & Customers (scoped #s-inbox / #s-customers) ===== */
#s-inbox .scr-body{display:flex;flex-direction:column}
#s-inbox .split{flex:1;height:auto;min-height:0}
#s-inbox .split>*{overflow:hidden;display:flex;flex-direction:column}
#s-inbox .ib-top{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--hair);flex:none;min-height:52px}
#s-inbox .ib-search{display:flex;align-items:center;gap:8px;height:var(--btn-h-s);padding:0 10px;border:1px solid var(--light);flex:1;font-size:13px;background:var(--paper);min-width:0}
#s-inbox .ib-search input{border:0;background:none;outline:none;width:100%;font-size:13px;min-width:0}
#s-inbox .ib-search svg{width:15px;height:15px;stroke:var(--grey);fill:none;stroke-width:1.5;flex:none}
#s-inbox .ib-filters{display:flex;border-bottom:1px solid var(--hair);flex:none;padding:0 6px;overflow-x:auto;scrollbar-width:none}
#s-inbox .ib-filters button{height:36px;padding:0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#s-inbox .ib-filters button.on{color:var(--ink);border-bottom-color:var(--sel)}
#s-inbox .ib-filters button .n{font-size:11px;color:var(--grey);font-variant-numeric:tabular-nums}
#s-inbox .ib-filters button.on .n{color:var(--ink)}
#s-inbox .ib-list{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin}
#s-inbox .cv{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--hair);cursor:pointer;min-height:68px;align-items:flex-start;transition:background var(--m-fast)}
#s-inbox .cv:hover{background:var(--silver)}
#s-inbox .cv.on{background:var(--silver);box-shadow:inset 3px 0 0 var(--sel)}
#s-inbox .cv .ch{width:28px;height:28px;display:grid;place-items:center;background:var(--silver);color:var(--graphite);flex:none;position:relative;margin-top:2px}
#s-inbox .cv.on .ch{background:var(--paper)}
#s-inbox .cv .ch svg{width:15px;height:15px}
#s-inbox .cv .ch .ud{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
#s-inbox .cv .t{flex:1;min-width:0}
#s-inbox .cv .l1{display:flex;align-items:baseline;gap:8px}
#s-inbox .cv .l1 b{flex:1;font-weight:400;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#s-inbox .cv.unread .l1 b{font-weight:500}
#s-inbox .cv .l1 small{font-size:11px;color:var(--grey);font-variant-numeric:tabular-nums;flex:none}
#s-inbox .cv .l2{font-size:12.5px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#s-inbox .cv.unread .l2{color:var(--graphite)}
#s-inbox .cv .l3{display:flex;align-items:center;gap:6px;margin-top:5px;min-height:20px}
#s-inbox .ib-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--hair);flex:none;min-height:56px}
#s-inbox .ib-head .who{flex:1;min-width:0}
#s-inbox .ib-head .who b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#s-inbox .ib-head .who small{display:block;font-size:12px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#s-inbox .ib-msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;min-height:0;scrollbar-width:thin}
#s-inbox .msg{max-width:72%;padding:9px 12px;font-size:13.5px;line-height:1.4;background:var(--silver);align-self:flex-start}
#s-inbox .msg.me{align-self:flex-end;background:var(--sel);color:var(--paper)}
#s-inbox .msg.note{align-self:center;background:var(--warn-bg);color:var(--warn);font-size:12.5px;max-width:85%}
#s-inbox .msg .at{display:block;font-size:11px;opacity:.6;margin-top:4px;font-variant-numeric:tabular-nums}
#s-inbox .msg .ph{width:150px;aspect-ratio:4/5;background:var(--silver);margin-bottom:6px;overflow:hidden}
#s-inbox .msg .ph img{width:100%;height:100%;object-fit:cover}
#s-inbox .ib-day{align-self:center;font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);padding:4px 0}
#s-inbox .flora{margin:12px 16px 0;border:1px solid var(--hair);background:var(--paper-2);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;flex:none}
#s-inbox .flora .fl-i{width:28px;height:28px;background:var(--sel);color:var(--paper);display:grid;place-items:center;flex:none}
#s-inbox .flora .fl-i svg{width:15px;height:15px}
#s-inbox .flora .fl-t{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
#s-inbox .flora .fl-t .caps{display:block;margin-bottom:3px}
#s-inbox .flora .fl-a{display:flex;gap:6px;flex:none;align-items:center}
#s-inbox .composer{padding:12px 16px 14px;flex:none}
#s-inbox .composer .textarea{min-height:48px;max-height:140px}
#s-inbox .composer .c-row{display:flex;align-items:center;gap:2px;margin-top:8px}
#s-inbox .composer .c-row .xs{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#s-inbox .ctx{padding:16px;overflow-y:auto!important;display:block!important;scrollbar-width:thin}
#s-inbox .ctx .sec-head{margin:18px 0 8px}
#s-inbox .ctx .sec-head:first-child{margin-top:0}
#s-inbox .qa{display:grid;gap:6px}
#s-inbox .qa .btn{justify-content:flex-start}
#s-inbox .ocard{border:1px solid var(--hair);padding:12px;cursor:pointer;transition:border-color var(--m-fast)}
#s-inbox .ocard:hover{border-color:var(--grey)}
#s-inbox .ib-back,#s-inbox .ib-info{display:none}
#s-inbox .ib-empty{margin:auto}
[data-size="ipad"] #s-inbox .split.--3{grid-template-columns:300px minmax(0,1fr)}
[data-size="ipad"] #s-inbox .ctx{display:none!important}
[data-size="ipad"] #s-inbox .ib-info{display:inline-flex}
[data-size="phone"] #s-inbox .ib-info,[data-size="phone"] #s-inbox .ib-back{display:inline-flex}
[data-size="phone"] #s-inbox .split>*:not(.ph-on){display:none}
[data-size="phone"] #s-inbox .split>*.ph-on{display:flex}
[data-size="phone"] #s-inbox .ctx{display:none!important}
[data-size="phone"] #s-inbox .msg{max-width:88%}
[data-size="phone"] #s-inbox .ib-head .as-l{display:none}
[data-size="phone"] #s-inbox .ib-head .btn{padding:0 8px}
[data-size="phone"] #s-inbox .ib-msgs{padding:12px 14px}
[data-size="phone"] #s-inbox .flora{flex-wrap:wrap}
[data-size="phone"] #s-inbox .composer .c-row .xs{display:none}
[data-density="compact"] #s-inbox .cv{min-height:56px;padding:7px 12px}
[data-density="compact"] #s-inbox .msg{padding:7px 10px;font-size:13px}
#s-customers .tbl td .tag{margin-right:4px}
#s-customers .tbl td.nm b{font-weight:400}
#s-customers .toolbar .seg-ctl{margin-left:auto}
[data-size="phone"] #s-customers .ph-hide{display:none}
[data-size="phone"] #s-customers .toolbar .search{width:100%}
[data-size="phone"] #s-customers .views{overflow-x:auto;scrollbar-width:none}
</style>

<section class="scr" id="s-inbox" data-nav="Inbox" data-group="Inbox &amp; Customers" data-title="Inbox" data-roles="owner manager">
  <div class="scr-body flush"><div class="split --3" id="ib-split"><div id="ib-list-col"></div><div id="ib-chat-col"></div><div class="ctx" id="ib-ctx-col"></div></div></div>
</section>

<section class="scr" id="s-customers" data-nav="Customers" data-group="Inbox &amp; Customers" data-title="Customers" data-roles="owner manager">
  <div class="scr-head"><div class="caps" id="cu-count"></div><span class="sp"></span><button class="btn --ghost --sm" onclick="T5.exportCsv()">Export CSV</button><button class="btn --sm" onclick="T5.addCustomer()">Add customer</button></div>
  <div class="scr-body" id="cu-body"></div>
</section>

<script>
window.T5=(()=>{
const A=()=>window.App;
const st={filter:"all",cur:null,q:"",dismissed:{},drafts:{},ph:"list",ids:[],cuView:"all",cuQ:"",cuSort:"name",cuDir:1};
const CHAN_IC={"WhatsApp":"chat","Instagram":"photo","Email":"mail","Website chat":"globe","Phone":"phone","SMS":"chat"};
const OUTCOME={ok:"Won",warn:"Pending",accent:"Lost"};
const T5_TEMPLATES=[
 {t:"Photo before it leaves",m:"Hi {first}, your bouquet is being made now – I'll send a photo before it leaves the studio."},
 {t:"Same-day cut-off",m:"We deliver same-day across London until 22:00 – order by 19:00 for the last slot."},
 {t:"Address check",m:"Could you confirm the full delivery address, including the flat number and postcode?"},
 {t:"Out of season",m:"Those stems are out of season at the moment – may I suggest a garden-rose version? It looks very similar."},
 {t:"Thank you",m:"Thank you so much, {first} – it was a pleasure. See you next time."}
];
const T5_NOEMAIL=new Set([5003,5008,5012,5017,5021,5024]);
const convos=()=>A().data.convos;
const cv=id=>convos().find(c=>c.id===Number(id));
const lastMsg=c=>c.msgs[c.msgs.length-1];
const needsReply=c=>{const m=lastMsg(c);return !!m&&!m.me&&!c.resolved};
const initials=cu=>cu.first[0]+(cu.n.split(" ")[1]||"")[0];
const managers=()=>A().data.staff.filter(s=>s.role==="owner"||s.role==="manager");

/* ---------- INBOX ---------- */
function sorted(){
 const A_=A(),me=A_.me();const all=convos();
 let list=all.filter(c=>st.filter==="all"||(st.filter==="unread"?c.unread:st.filter==="mine"?c.assigned===me.id:!c.assigned));
 if(st.q){const q=st.q.toLowerCase();list=list.filter(c=>{const cu=A_.customer(c.customer);return cu.n.toLowerCase().includes(q)||cu.phone.replace(/\s/g,"").includes(q.replace(/\s/g,""))||c.msgs.some(m=>m.t.toLowerCase().includes(q))})}
 list.sort((a,b)=>(b.unread-a.unread)||(needsReply(b)-needsReply(a))||(new Date(b.last)-new Date(a.last)));
 return list;
}
function renderList(){
 const A_=A(),me=A_.me();const all=convos();
 const cnt={all:all.length,unread:all.filter(c=>c.unread).length,mine:all.filter(c=>c.assigned===me.id).length,unassigned:all.filter(c=>!c.assigned).length};
 const list=sorted();st.ids=list.map(c=>c.id);
 const rows=list.map(c=>{const cu=A_.customer(c.customer),m=lastMsg(c);
  return `<div class="cv ${c.unread?"unread":""} ${st.cur===c.id?"on":""}" onclick="T5.open(${c.id})"><span class="ch" title="${A_.esc(c.chan)}">${A_.icon(CHAN_IC[c.chan]||"chat")}${c.unread?'<i class="ud"></i>':""}</span><div class="t"><div class="l1"><b>${A_.esc(cu.n)}</b><small>${A_.timeAgo(c.last)}</small></div><div class="l2">${m?(m.me?"You: ":"")+A_.esc(m.t):'<span class="muted">No messages yet</span>'}</div><div class="l3">${c.order?`<span class="tag --line">#${c.order}</span>`:""}${c.resolved?'<span class="tag --ok">Done</span>':needsReply(c)?'<span class="tag">Needs reply</span>':""}${c.outcome?`<span class="dot --${c.outcome}" title="${OUTCOME[c.outcome]}"></span>`:""}<span class="sp"></span>${c.assigned?A_.avatar(c.assigned,"--s"):'<span class="xs muted">Unassigned</span>'}</div></div></div>`}).join("");
 document.getElementById("ib-list-col").innerHTML=`<div class="ib-top"><div class="ib-search">${A_.icon("search")}<input placeholder="Search name, phone or text" value="${A_.esc(st.q)}" oninput="T5.search(this.value)"></div><button class="ib" title="New message" onclick="T5.newMsg(event)">${A_.icon("edit")}</button></div>
 <div class="ib-filters">${["all","unread","mine","unassigned"].map(f=>`<button class="${st.filter===f?"on":""}" onclick="T5.filter('${f}')">${f}<span class="n">${cnt[f]||""}</span></button>`).join("")}</div>
 <div class="ib-list">${rows||`<div class="empty">${A_.icon("inbox")}<div class="h3">Nothing here</div><div class="sm">${st.filter==="unread"?"Every message has been answered.":"No conversations match."}</div><button class="textbtn" onclick="T5.filter('all');T5.search('')">Show all</button></div>`}</div>`;
}
function renderChat(){
 const A_=A();const c=cv(st.cur);const col=document.getElementById("ib-chat-col");
 if(!c){col.innerHTML=`<div class="empty ib-empty">${A_.icon("chat")}<div class="h3">Pick a conversation</div><div class="sm">Unread first, then whoever has waited longest.</div></div>`;return}
 const cu=A_.customer(c.customer);let day=null;
 const msgs=c.msgs.map(m=>{let h="";const d=A_.fmtDay(m.at);if(d!==day){day=d;h+=`<div class="ib-day">${d}</div>`}
  return h+`<div class="msg ${m.me?"me":""} ${m.note?"note":""}">${m.img?`<div class="ph"><img src="${m.img}" alt=""></div>`:""}${m.note?A_.icon("lock")+" ":""}${A_.esc(m.t)}<span class="at">${A_.fmtTime(m.at)}${m.me?" · "+A_.esc(A_.user(m.who)?.n||"Floritta"):""}${m.note?" · internal note":""}</span></div>`}).join("");
 const flora=c.flora&&!st.dismissed[c.id]&&needsReply(c);
 const draft=st.drafts[c.id]||"";
 col.innerHTML=`<div class="ib-head"><button class="ib ib-back" title="Back to list" onclick="T5.phone('list')">${A_.icon("back")}</button><span class="avatar">${A_.esc(initials(cu))}</span><div class="who"><b>${A_.esc(cu.n)}</b><small>${A_.esc(c.chan)} · <span class="tnum">${A_.esc(cu.phone)}</span>${c.assigned?" · "+A_.esc(A_.user(c.assigned).n):" · unassigned"}${c.resolved?" · done":""}</small></div>
  <button class="btn --ghost --sm" onclick="T5.assign(event)">${c.assigned?A_.avatar(c.assigned,"--s"):A_.icon("user")}<span class="as-l">Assign</span></button>
  <button class="ib ib-info" title="Customer and order" onclick="T5.ctxSheet()">${A_.icon("info")}</button>
  <button class="ib" title="More" onclick="T5.menu(event)">${A_.icon("dots")}</button></div>
 <div class="ib-msgs" id="ib-msgs">${msgs||`<div class="empty">${A_.icon("chat")}<div class="sm">No messages with ${A_.esc(cu.first)} yet – say hello.</div></div>`}</div>
 ${flora?`<div class="flora"><span class="fl-i">${A_.icon("sparkle")}</span><div class="fl-t"><span class="caps">Flora suggests</span>${A_.esc(c.flora)}</div><div class="fl-a"><button class="btn --sm" onclick="T5.floraSend()">${A_.icon("send")} Send</button><button class="btn --ghost --sm" onclick="T5.floraEdit()">Edit</button><button class="ib" title="Dismiss" onclick="T5.floraDismiss()">${A_.icon("close")}</button></div></div>`:""}
 <div class="composer"><textarea class="textarea" id="ib-in" placeholder="Reply on ${A_.esc(c.chan)}… (⌘↵ to send)" oninput="T5.draft(this.value)" onkeydown="if((event.metaKey||event.ctrlKey)&&event.key==='Enter'){event.preventDefault();T5.send()}">${A_.esc(draft)}</textarea>
  <div class="c-row"><button class="ib" title="Templates" onclick="T5.templates(event)">${A_.icon("book")}</button><button class="ib" title="Attach photo" onclick="T5.attach(event)">${A_.icon("photo")}</button><button class="ib" title="Payment link" onclick="T5.payLink(event)">${A_.icon("link")}</button><button class="ib" title="Internal note" onclick="T5.note()">${A_.icon("lock")}</button><span class="xs muted">${c.chan==="Email"?"Sends from info@floritta.uk":"Sends as Floritta on "+A_.esc(c.chan)}</span><button class="btn --sm" style="margin-left:8px" onclick="T5.send()">${A_.icon("send")} Send</button></div></div>`;
 const ms=document.getElementById("ib-msgs");ms.scrollTop=ms.scrollHeight;
}
function ctxHtml(){
 const A_=A();const c=cv(st.cur);if(!c)return `<div class="empty">${A_.icon("user")}<div class="sm">Customer and order appear here.</div></div>`;
 const cu=A_.customer(c.customer);const o=c.order?A_.order(c.order):null;const os=A_.data.orders.filter(x=>x.customer===cu.id);
 return `<div class="sec-head"><div class="h3">Customer</div><button class="textbtn" onclick="App.openCustomer(${cu.id})">open</button></div>
 <div class="row" style="gap:10px;align-items:flex-start"><span class="avatar --l --ink">${A_.esc(initials(cu))}</span><div style="flex:1;min-width:0"><div style="font-weight:500">${A_.esc(cu.n)}</div><div class="xs muted tnum">${A_.esc(cu.phone)}</div><div class="xs muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${T5_NOEMAIL.has(cu.id)?'<span class="accent">no email on file</span>':A_.esc(cu.email)}</div><div class="row mt8" style="gap:4px;flex-wrap:wrap">${cu.tags.map(t=>`<span class="tag ${t==="VIP"?"--ink":""}">${t}</span>`).join("")}<span class="tag --line">${A_.esc(cu.channel)}</span></div></div></div>
 <div class="grid g3 mt16" style="gap:8px"><div class="card --flat" style="padding:10px"><span class="caps" style="margin:0 0 2px">Orders</span><div class="kpi-s">${cu.orders}</div></div><div class="card --flat" style="padding:10px"><span class="caps" style="margin:0 0 2px">Spent</span><div class="kpi-s">${A_.fmt(cu.spent)}</div></div><div class="card --flat" style="padding:10px"><span class="caps" style="margin:0 0 2px">Since</span><div class="kpi-s">${cu.since}</div></div></div>
 ${cu.note?`<div class="note-box mt8">${A_.icon("sparkle")} <b>Flora fact:</b> ${A_.esc(cu.note)}</div>`:""}
 <div class="sec-head"><div class="h3">Linked order</div><button class="textbtn" onclick="T5.linkOrder(event)">${o?"change":"link"}</button></div>
 ${o?`<div class="ocard" onclick="App.openOrder(${o.id})"><div class="row" style="gap:10px"><span class="thumb">${o.photo?`<img src="${A_.product(o.product).img}" alt="">`:""}</span><div style="flex:1;min-width:0"><div class="sm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><b>#${o.id}</b> · ${A_.esc(A_.product(o.product).name)}</div><div class="xs muted">${A_.fmtDay(o.date)} · ${A_.esc(o.slot)} · ${A_.fmt(o.total)}</div></div></div><div class="row mt8" style="gap:6px;flex-wrap:wrap">${A_.orderPill(o)}${A_.pill(o.paid)}${o.courier?`<span class="xs muted">${A_.esc(A_.user(o.courier)?.n||o.courier)}</span>`:""}</div></div>`:`<div class="muted sm">No order linked to this chat${os.length?" · "+os.length+" past order"+(os.length>1?"s":"")+" below":""}.</div>`}
 <div class="sec-head"><div class="h3">Quick actions</div></div>
 <div class="qa"><button class="btn --ghost --sm" onclick="T5.payLink(event)">${A_.icon("link")} Send payment link</button><button class="btn --ghost --sm" onclick="App.go('order-new',{customer:${cu.id}})">${A_.icon("plus")} New order from chat</button><button class="btn --ghost --sm" onclick="T5.assign(event)">${A_.icon("user")} Assign to…</button><button class="btn --ghost --sm" onclick="T5.outcome(event)">${A_.icon("flag")} Outcome${c.outcome?" · "+OUTCOME[c.outcome]:""}</button></div>
 ${os.length?`<div class="sec-head"><div class="h3">Recent orders</div><button class="textbtn" onclick="App.openCustomer(${cu.id})">all</button></div><div class="list" style="border:1px solid var(--hair)">${os.slice(0,3).map(x=>`<div class="li" onclick="App.openOrder(${x.id})"><div class="t"><b>#${x.id} · ${A_.esc(A_.product(x.product).name)}</b><small>${A_.fmtDay(x.date)} · ${A_.fmt(x.total)}</small></div>${A_.orderPill(x)}</div>`).join("")}</div>`:""}`;
}
function renderCtx(){document.getElementById("ib-ctx-col").innerHTML=ctxHtml()}
function applyPhone(){const l=document.getElementById("ib-list-col"),c=document.getElementById("ib-chat-col");l.classList.toggle("ph-on",st.ph==="list");c.classList.toggle("ph-on",st.ph==="chat")}
function renderAll(){renderList();renderChat();renderCtx();applyPhone()}
function touch(c){c.last=A().NOW.toISOString()}

const api={
 open(id){st.cur=Number(id);st.ph="chat";renderAll()},
 phone(v){st.ph=v;applyPhone()},
 filter(f){st.filter=f;renderList()},
 search(q){st.q=q;renderList()},
 draft(v){if(st.cur)st.drafts[st.cur]=v},
 send(text,opts={}){const A_=A();const c=cv(st.cur);if(!c)return;const t=(text!==undefined?text:(st.drafts[c.id]||"")).trim();if(!t&&!opts.img){A_.toast("Nothing to send");return}
  c.msgs.push({at:A_.NOW.toISOString(),me:true,who:A_.me().id,t:t||"Photo",img:opts.img||null});touch(c);c.unread=false;c.resolved=false;st.drafts[c.id]="";
  A_.toast("Sent · "+c.chan);A_.renderSidebar();renderAll()},
 floraSend(){const c=cv(st.cur);if(!c)return;st.dismissed[c.id]=true;api.send(c.flora)},
 floraEdit(){const c=cv(st.cur);if(!c)return;st.drafts[c.id]=c.flora;st.dismissed[c.id]=true;renderChat();const i=document.getElementById("ib-in");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},
 floraDismiss(){const c=cv(st.cur);if(!c)return;st.dismissed[c.id]=true;renderChat();A().toast("Dismissed – Flora learns from this")},
 templates(ev){const A_=A();const c=cv(st.cur);if(!c)return;const cu=A_.customer(c.customer);
  A_.pop(ev,["Templates",...T5_TEMPLATES.map(t=>({t:t.t,ic:"book",fn:()=>{st.drafts[c.id]=t.m.replace("{first}",cu.first);renderChat();document.getElementById("ib-in")?.focus()}})),"-",{t:"Manage templates",ic:"settings",fn:()=>A_.toast("Templates live in Settings – not in this prototype yet")}])},
 attach(ev){const A_=A();const c=cv(st.cur);if(!c)return;const o=c.order?A_.order(c.order):null;const items=["Attach photo"];
  if(o&&o.photo)items.push({t:"Bouquet photo · #"+o.id,ic:"photo",fn:()=>api.send("Here is your bouquet before it leaves the studio.",{img:A_.product(o.product).img})});
  items.push({t:"From catalogue…",ic:"catalog",fn:()=>{const p=A_.data.products.filter(x=>!x.addon).slice(0,3);A_.modal({title:"Pick a photo",body:`<div class="grid g3">${p.map(x=>`<div class="photo --4x5" style="cursor:pointer" onclick="App.closeModal();T5.send('${A_.esc(x.name)} – ${A_.fmt(x.price)}, available today.',{img:'${x.img}'})"><img src="${x.img}" alt=""></div>`).join("")}</div>`})}},{t:"Upload from device",ic:"upload",fn:()=>A_.toast("File picker (demo)")});
  A_.pop(ev,items)},
 payLink(ev){const A_=A();const c=cv(st.cur);if(!c)return;if(c.order){A_.paymentLink(c.order);return}
  const cu=A_.customer(c.customer);const os=A_.data.orders.filter(x=>x.customer===cu.id&&x.status!=="cancelled");
  if(!os.length){A_.toast("No order for "+cu.first+" yet","New order",()=>A_.go("order-new",{customer:cu.id}));return}
  A_.pop(ev,["Link an order first",...os.slice(0,6).map(x=>({t:`#${x.id} · ${A_.product(x.product).name} · ${A_.fmt(x.total)}${x.paid!=="paid"?" · unpaid":""}`,ic:"orders",fn:()=>{c.order=x.id;renderAll();A_.paymentLink(x.id)}})),"-",{t:"New order from chat",ic:"plus",fn:()=>A_.go("order-new",{customer:cu.id})}])},
 linkOrder(ev){const A_=A();const c=cv(st.cur);if(!c)return;const cu=A_.customer(c.customer);const os=A_.data.orders.filter(x=>x.customer===cu.id);
  const items=["Link order",...os.slice(0,6).map(x=>({t:`#${x.id} · ${A_.product(x.product).name} · ${A_.fmtDay(x.date)}`,ic:"orders",fn:()=>{c.order=x.id;renderAll();A_.toast("Linked #"+x.id)}}))];
  if(!os.length)items.push({t:"No orders yet – create one",ic:"plus",fn:()=>A_.go("order-new",{customer:cu.id})});
  if(c.order)items.push("-",{t:"Unlink #"+c.order,ic:"close",cls:"--accent",fn:()=>{c.order=null;renderAll();A_.toast("Order unlinked")}});
  A_.pop(ev,items)},
 assign(ev){const A_=A();const c=cv(st.cur);if(!c)return;const me=A_.me();
  A_.pop(ev,["Assign to",{t:"Me · "+me.n,ic:"user",fn:()=>{c.assigned=me.id;renderAll();A_.toast("Assigned to you")}},...managers().filter(s=>s.id!==me.id).map(s=>({t:s.n+" · "+s.title+(s.on?"":" · off"),ic:"user",fn:()=>{c.assigned=s.id;renderAll();A_.push("Chat assigned to you",A_.customer(c.customer).n+" · "+c.chan,{icon:"chat",go:["inbox",{id:c.id}],type:"inbox"});A_.toast("Assigned to "+s.n)}})),"-",{t:"Unassign",ic:"close",fn:()=>{c.assigned=null;renderAll();A_.toast("Unassigned")}}])},
 outcome(ev){const A_=A();const c=cv(st.cur);if(!c)return;A_.pop(ev,["Outcome",...Object.keys(OUTCOME).map(k=>({t:OUTCOME[k],ic:k==="ok"?"check":k==="warn"?"clock":"close",fn:()=>{c.outcome=k;renderAll();A_.toast("Outcome · "+OUTCOME[k])}})),"-",{t:"Clear",ic:"undo",fn:()=>{c.outcome=null;renderAll()}}])},
 menu(ev){const A_=A();const c=cv(st.cur);if(!c)return;const cu=A_.customer(c.customer);
  A_.pop(ev,[{t:c.unread?"Mark as read":"Mark as unread",ic:"eye",fn:()=>{c.unread=!c.unread;A_.renderSidebar();renderAll()}},{t:c.resolved?"Reopen":"Mark done",ic:"check",fn:()=>{c.resolved=!c.resolved;if(c.resolved)c.unread=false;A_.renderSidebar();renderAll();A_.toast(c.resolved?"Done":"Reopened")}},{t:"Snooze until tomorrow",ic:"clock",fn:()=>A_.toast("Snoozed · back tomorrow 08:00")},"-",{t:"Open customer",ic:"user",fn:()=>A_.openCustomer(cu.id)},{t:c.order?"Open order #"+c.order:"Link an order",ic:"orders",fn:()=>c.order?A_.openOrder(c.order):api.linkOrder(ev)},{t:"Call "+cu.first,ic:"phone",fn:()=>A_.toast("Calling "+cu.phone+" · Ringover")},{t:"Copy phone",ic:"copy",fn:()=>A_.toast("Copied "+cu.phone)},"-",{t:"Report as spam",ic:"alert",cls:"--accent",fn:()=>A_.confirm("Report as spam?","The conversation will be hidden and the number flagged.","Report",()=>{c.resolved=true;c.unread=false;A_.renderSidebar();renderAll();A_.toast("Reported")},{danger:true})}])},
 note(){const A_=A();const c=cv(st.cur);if(!c)return;A_.modal({title:"Internal note",body:`<div class="field"><label>Visible to the team only</label><textarea class="textarea" id="t5-note" placeholder="e.g. Customer prefers no lilies…"></textarea></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="T5.noteSave()">Add note</button>`,onMount:()=>setTimeout(()=>document.getElementById("t5-note")?.focus(),40)})},
 noteSave(){const A_=A();const c=cv(st.cur);const t=(document.getElementById("t5-note")?.value||"").trim();A_.closeModal();if(!t||!c)return;c.msgs.push({at:A_.NOW.toISOString(),me:true,who:A_.me().id,t,note:true});renderChat();A_.toast("Note added")},
 ctxSheet(){const A_=A();const c=cv(st.cur);if(!c)return;A_.sheet({eyebrow:"Conversation · "+c.chan,title:A_.esc(A_.customer(c.customer).n),narrow:true,body:ctxHtml()})},
 newMsg(ev){const A_=A();const have=new Set(convos().map(c=>c.customer));const list=A_.data.customers.filter(c=>!have.has(c.id)).slice(0,6);
  A_.pop(ev,["New message to",...list.map(cu=>({t:cu.n+" · "+cu.phone,ic:"user",fn:()=>api.openFor(cu.id)})),"-",{t:"Find in Customers",ic:"search",fn:()=>A_.go("customers")}])},
 openFor(customerId){const A_=A();let c=convos().find(x=>x.customer===Number(customerId));
  if(!c){const cu=A_.customer(customerId);if(!cu){A_.toast("Customer not found");return}c={id:7100+convos().length,customer:cu.id,chan:cu.channel==="Instagram"?"Instagram":"WhatsApp",unread:false,order:null,assigned:A_.me().id,msgs:[],last:A_.NOW.toISOString(),flora:null};convos().push(c);A_.toast("New conversation · "+c.chan)}
  st.filter="all";st.q="";api.open(c.id)},
 move(d){if(!st.ids.length)return;let i=st.ids.indexOf(st.cur);i=Math.max(0,Math.min(st.ids.length-1,i+d));api.open(st.ids[i])},

 /* ---------- CUSTOMERS ---------- */
 cuView(v){st.cuView=v;cuRender()},
 cuSearch(q){st.cuQ=q;cuRender()},
 cuSort(k){if(st.cuSort===k)st.cuDir=-st.cuDir;else{st.cuSort=k;st.cuDir=k==="name"?1:-1}cuRender()},
 exportCsv(){const A_=A();A_.toast("CSV export · "+A_.data.customers.length+" customers – emailed to you","Undo",()=>A_.toast("Export cancelled"))},
 addCustomer(){const A_=A();A_.modal({title:"Add customer",body:`<div class="col" style="gap:12px"><div class="field"><label>Name</label><input class="input" id="t5-cn" placeholder="First and last name"></div><div class="grid g2" style="gap:12px"><div class="field"><label>Phone</label><input class="input tnum" id="t5-cp" placeholder="+44 7…"></div><div class="field"><label>Email</label><input class="input" id="t5-ce" placeholder="optional"></div></div><div class="grid g2" style="gap:12px"><div class="field"><label>Tag</label><select class="select" id="t5-ct"><option value="">None</option><option>VIP</option><option>Corporate</option><option>Subscriber</option><option>Repeat</option></select></div><div class="field"><label>Source</label><select class="select" id="t5-cs"><option>Phone</option><option>WhatsApp</option><option>Walk-in</option><option>Instagram</option><option>Website</option></select></div></div><div class="field"><label>Note for the team</label><input class="input" id="t5-cno" placeholder="Allergies, preferences, concierge…"></div></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="T5.addCustomerSave()">Save customer</button>`,onMount:()=>setTimeout(()=>document.getElementById("t5-cn")?.focus(),40)})},
 addCustomerSave(){const A_=A();const g=id=>(document.getElementById(id)?.value||"").trim();const n=g("t5-cn"),p=g("t5-cp");
  if(!n||!p){A_.toast("Name and phone are required");return}
  const id=5100+A_.data.customers.filter(c=>c.id>=5100).length;const tag=g("t5-ct");const email=g("t5-ce");
  A_.data.customers.push({id,n,first:n.split(" ")[0],phone:p,email:email||"",addr:"",tags:tag?[tag]:[],occasion:"—",orders:0,spent:0,since:"2026",channel:g("t5-cs")||"Phone",note:g("t5-cno")});
  if(!email)T5_NOEMAIL.add(id);A_.closeModal();A_.toast(n+" added");cuRender();A_.openCustomer(id)}
};

function cuRender(){
 const A_=A();const all=A_.data.customers;
 const lastOrder=c=>{const os=A_.data.orders.filter(o=>o.customer===c.id);if(!os.length)return null;return os.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0]};
 const VIEWS=[["all","All",c=>true],["vip","VIP",c=>c.tags.includes("VIP")],["corporate","Corporate",c=>c.tags.includes("Corporate")],["subs","Subscribers",c=>c.tags.includes("Subscriber")],["bday","Birthdays this month",c=>/Birthday · \d+ Oct/.test(c.occasion)],["noemail","No email",c=>T5_NOEMAIL.has(c.id)||!c.email]];
 let list=all.filter(VIEWS.find(v=>v[0]===st.cuView)[2]);
 if(st.cuQ){const q=st.cuQ.toLowerCase();list=list.filter(c=>c.n.toLowerCase().includes(q)||c.phone.replace(/\s/g,"").includes(q.replace(/\s/g,""))||(c.email||"").toLowerCase().includes(q)||c.tags.join(" ").toLowerCase().includes(q))}
 const key={name:c=>c.n,orders:c=>c.orders,spent:c=>c.spent,last:c=>{const o=lastOrder(c);return o?o.date:""},occasion:c=>c.occasion}[st.cuSort];
 list.sort((a,b)=>{const x=key(a),y=key(b);return (x>y?1:x<y?-1:0)*st.cuDir});
 const th=(k,l,cls="")=>`<th class="sort ${cls}" onclick="T5.cuSort('${k}')">${l}${st.cuSort===k?(st.cuDir>0?" ↑":" ↓"):""}</th>`;
 document.getElementById("cu-count").textContent=list.length+" of "+all.length+" customers";
 document.getElementById("cu-body").innerHTML=`<div class="toolbar"><div class="search">${A_.icon("search")}<input placeholder="Search name, phone, email or tag" value="${A_.esc(st.cuQ)}" oninput="T5.cuSearch(this.value)"></div><div class="chips"><button class="chip" onclick="App.toast('Filter by area (demo) – SE1, SE16, SE17')">${A_.icon("pin")} Area</button><button class="chip" onclick="App.toast('Filter by channel (demo)')">${A_.icon("filter")} Channel</button></div></div>
 <div class="views">${VIEWS.map(v=>`<button class="${st.cuView===v[0]?"on":""}" onclick="T5.cuView('${v[0]}')">${v[1]}<span class="n">${all.filter(v[2]).length}</span></button>`).join("")}</div>
 <div class="tbl-wrap"><table class="tbl"><thead><tr>${th("name","Customer")}<th class="ph-hide">Phone</th><th class="ph-hide">Tags</th>${th("orders","Orders","num")}${th("spent","Spent","num")}${th("last","Last order","ph-hide")}${th("occasion","Next occasion","ph-hide")}<th class="ph-hide"></th></tr></thead><tbody>
 ${list.map(c=>{const o=lastOrder(c);const noEmail=T5_NOEMAIL.has(c.id)||!c.email;return `<tr class="r" onclick="App.openCustomer(${c.id})"><td class="nm"><b>${A_.esc(c.n)}</b><span class="sub">${noEmail?'<span class="accent">no email</span>':A_.esc(c.email)}</span></td><td class="tnum ph-hide">${A_.esc(c.phone)}</td><td class="ph-hide">${c.tags.map(t=>`<span class="tag ${t==="VIP"?"--ink":""}">${t}</span>`).join("")||'<span class="muted">—</span>'}</td><td class="num">${c.orders}</td><td class="num">${A_.fmt(c.spent)}</td><td class="ph-hide">${o?`${A_.fmtDay(o.date)} <span class="sub">#${o.id} · ${A_.esc(A_.product(o.product).name)}</span>`:'<span class="muted">—</span>'}</td><td class="ph-hide">${A_.esc(c.occasion)}</td><td class="ph-hide"><span class="acts"><button class="ib" title="Message" onclick="event.stopPropagation();App.go('inbox',{customer:${c.id}})">${A_.icon("chat")}</button><button class="ib" title="New order" onclick="event.stopPropagation();App.go('order-new',{customer:${c.id}})">${A_.icon("plus")}</button></span></td></tr>`}).join("")||`<tr><td colspan="8"><div class="empty">${A_.icon("customers")}<div class="h3">No customers here</div><button class="textbtn" onclick="T5.cuView('all');T5.cuSearch('')">Show all</button></div></td></tr>`}
 </tbody><tfoot><tr><td colspan="8">${list.length} shown · spent ${A_.fmt(list.reduce((s,c)=>s+c.spent,0))} · click a row to open the card</td></tr></tfoot></table></div>`;
}

/* ---------- MOUNTS ---------- */
window.mount_inbox=function(p){
 p=p||{};const A_=A();
 if(p.id&&cv(p.id)){st.cur=Number(p.id);st.ph="chat"}
 else if(p.customer){api.openFor(p.customer);return}
 else if(!st.cur||!cv(st.cur)){const f=sorted()[0];st.cur=f?f.id:null}
 renderAll();
 A_.registerCommands([{g:"Actions",t:"Inbox · show unread",ic:"inbox",fn:()=>{A_.go("inbox");api.filter("unread")}},{g:"Actions",t:"Inbox · assign this chat to me",ic:"user",fn:()=>{const c=cv(st.cur);if(c){c.assigned=A_.me().id;A_.go("inbox",{id:c.id});A_.toast("Assigned to you")}}},{g:"Actions",t:"Add customer",ic:"plus",fn:()=>{A_.go("customers");api.addCustomer()}}]);
};
window.mount_customers=function(p){p=p||{};if(p.view)st.cuView=p.view;cuRender();if(p.new)api.addCustomer()};
document.addEventListener("orders",()=>{const c=A().state.current;if(c==="inbox")renderCtx();else if(c==="customers")cuRender()});
document.addEventListener("keydown",e=>{if(A().state.current!=="inbox")return;const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea"||tag==="select")return;if(e.metaKey||e.ctrlKey)return;
 if(e.key==="j"){api.move(1)}else if(e.key==="k"){api.move(-1)}else if(e.key==="r"){document.getElementById("ib-in")?.focus();e.preventDefault()}else if(e.key==="e"){const c=cv(st.cur);if(c){c.resolved=!c.resolved;if(c.resolved)c.unread=false;A().renderSidebar();renderAll();A().toast(c.resolved?"Done":"Reopened")}}});
return api;
})();
</script>
