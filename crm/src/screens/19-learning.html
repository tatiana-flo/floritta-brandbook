  texts:{en:{title:"Selling alcohol responsibly",body:"<p>Floritta sells wine and champagne as part of gift sets under Premises Licence 889934. Every sale must be made by a person who has passed this lesson and been countersigned by the DPS.</p><h5>Challenge 25</h5><p>If the customer looks under 25, ask for photo ID: passport, driving licence or PASS card. No ID – no sale, however friendly the customer is.</p><h5>When to refuse</h5><ul><li>No acceptable ID</li><li>The customer appears drunk</li><li>Buying for someone who has already been refused</li><li>Outside licensed hours (10:00–22:00)</li></ul><p>Write every refusal in the refusals log at the till.</p>",idea:"Alcohol is sold only by countersigned staff, with Challenge 25 and a written refusals log.",decl:"I confirm that I have read and understood the conditions of Premises Licence 889934 as they apply to the sale of alcohol by retail at 80 Willow Walk, that I will apply Challenge 25 on every sale, refuse a sale whenever I am in doubt and record every refusal in the refusals log, and that I understand that selling alcohol to a person under 18 is a criminal offence for which I may be personally liable."},
    ru:{title:"Продажа алкоголя ответственно",body:"<p>Floritta продаёт вино и шампанское в составе подарочных наборов по лицензии помещения 889934. Каждую продажу делает человек, прошедший этот урок и подписанный DPS.</p><h5>Challenge 25</h5><p>Если покупатель выглядит моложе 25, попросите документ с фото: паспорт, права или карту PASS. Нет документа – нет продажи.</p><h5>Когда отказать</h5><ul><li>Нет подходящего документа</li><li>Покупатель пьян</li><li>Покупает для того, кому уже отказали</li><li>Вне лицензированных часов (10:00–22:00)</li></ul><p>Каждый отказ записывайте в журнал отказов у кассы.</p>",idea:"Алкоголь продают только подписанные сотрудники, с Challenge 25 и письменным журналом отказов.",decl:"Я подтверждаю, что прочитал(а) и понял(а) условия лицензии помещения 889934 применительно к розничной продаже алкоголя по адресу 80 Willow Walk, что буду применять Challenge 25 при каждой продаже, отказывать при любом сомнении и записывать каждый отказ в журнал, и что понимаю: продажа алкоголя лицу младше 18 лет – уголовное преступление, за которое могу отвечать лично."}},

  const idea=attempt&&t.idea?`<div class="card mt16"><span class="caps">How we would put it</span><div class="sm">${esc(t.idea)}</div><span class="caps mt8">How you put it</span><div class="sm soft">${esc(L19.idea||"Only sell to people with ID and log refusals.")}</div></div>`:"";

  const media=l.media&&l.media.length?`<div class="sec-head"><div class="h3">Photos and video</div></div><div class="l-media">${l.media.map(m=>`<div class="m"><div class="photo --4x5"><img src="${m.img}" alt="">${m.kind==="video"?`<div class="play"><button class="btn --sm" onclick="App.toast('Opens ${m.url} in a new tab')">${ic("play")} Watch</button></div>`:""}</div><div class="cap">${esc(m.cap)}</div></div>`).join("")}</div>`:"";
  const signedSummary=passed&&hasDecl?`<div class="card mt16"><span class="caps">Signed</span><div class="sm">Signed as <b>${esc(L19.sigName||A.me().n+" Demo")}</b> on ${L19.fmtDY(asg.finished||"2026-10-20")}</div>${l.choices?`<dl class="kv mt8">${l.choices.map(c=>`<dt>${esc(c[lang]||c.en)}</dt><dd>${L19.consent[c.key]===false?"No":"Yes"}</dd>`).join("")}</dl>`:""}</div>`:"";
  const qs=l.questions&&l.questions.length&&!isConsentOnly?`<div class="sec-head"><div class="h3">${l.type==="flashcards"?"Flashcards":"Test"}</div><span class="xs muted">pass mark ${l.pass||80}%</span></div>${l.questions.map((q,i)=>{const w=wrong.includes(i);const prev=L19.answers[i];
      return `<div class="l-q ${w?"--wrong":""}"><div class="qt"><b>${i+1}. ${esc(q.q[lang]||q.q.en)}</b>${w?`<span class="pill --late">Wrong</span>`:attempt&&prev!==undefined?`<span class="pill --done">Correct</span>`:""}</div>${(q.opts[lang]||q.opts.en).map((o,k)=>`<label class="l-opt ${w&&prev===k?"--struck":""}"><input type="radio" name="q${i}" ${prev===k?"checked":""} onchange="L19.answers[${i}]=${k};L19X.lessonCheck()"><span>${esc(o)}</span></label>`).join("")}</div>`}).join("")}`:"";
  const link=l.type==="photo"||l.type==="link_proof"?`<div class="field mt16"><label>${l.type==="photo"?"Link to your photo":"Link to your work"}</label><input class="input" placeholder="https://…" value="${esc(L19.link)}" oninput="L19.link=this.value;L19X.lessonCheck()"><div class="xs muted">${l.hosts?"Allowed hosts: "+l.hosts.join(", ")+" · ":""}Only a link – no file upload on the web.</div></div>`:"";

  const choices=l.choices?`<div class="sec-head"><div class="h3">Your choices</div></div>${l.choices.map(c=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--hair)"><span class="sm" style="flex:1">${esc(c[lang]||c.en)}</span><div class="l-yn"><button class="${L19.consent[c.key]===true?"on":""}" onclick="L19.consent['${c.key}']=true;L19X.lesson()">Yes</button><button class="${L19.consent[c.key]===false?"on":""}" onclick="L19.consent['${c.key}']=false;L19X.lesson()">No</button></div></div>`).join("")}`:"";

  const form=hideForm?"":`<div class="card mt16" id="l19-form">${qs}${link}${ideaField}${choices}${decl}${errs}<div class="row mt16"><button class="btn" id="l19-submit" onclick="L19X.lessonSubmit()">Submit</button><span class="xs muted" id="l19-submit-hint"></span></div></div>`;

  const passedNote=passed&&!isStation?`<div class="note-box --ok mt16">Lesson passed${asg.finished?" on "+L19.fmtDY(asg.finished):""}. ${l.choices?"To change your choices, ask a manager.":""}</div>`:"";

      <div class="l-body mt16">${t.body||l.texts.en.body}</div>${media}${idea}${checklist}${station}${passedNote}${form}</div>
    <div class="l-side"><div class="card"><span class="caps">Status</span><div class="row" style="flex-wrap:wrap;gap:6px">${passed?A.pill("done","Passed"):awaiting?A.pill("review","Awaiting countersign"):st==="review"?A.pill("review","To review"):asg.overdue?A.pill("overdue"):A.pill("todo","Assigned")}${l.countersign?`<span class="tag --line">Licence 889934</span>`:""}</div>

  if(!hideForm){L19X.sigInit();L19X.lessonCheck();if(!L19.timerStart)L19.timerStart=Date.now();clearInterval(L19.timerT);L19.timerT=setInterval(()=>{if(App.state.current!=="lesson"){clearInterval(L19.timerT);return}const s=Math.min(4*3600,Math.floor((Date.now()-L19.timerStart)/1000));const el=document.getElementById("l19-timer");if(el)el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")},1000)}

/* ---------- Quiz of the day ---------- */
window.mount_quiz_day=function(){
  const A=App,$=A.$,esc=A.esc,ic=A.icon;
  $("#l19-quiz-head").innerHTML=L19.nav("quiz-day",`<div class="sp"></div><button class="btn --ghost --sm" onclick="L19.quiz.noQuiz=!L19.quiz.noQuiz;L19X.quiz()">${ic("columns")} ${L19.quiz.noQuiz?"Demo: quiz ready":"Demo: no quiz today"}</button>`);
  const items=L19.quiz.noQuiz?[]:L19_QUIZ;const ans=L19.quiz.answered;const cur=items.find(q=>ans[q.id]===undefined);
  const nAns=items.filter(q=>ans[q.id]!==undefined).length,nOk=items.filter(q=>ans[q.id]===q.a).length;
  const stats=`<div class="panel"><div class="p-head"><div class="h4">Your last 30 days</div></div><div class="p-body">${L19_QUIZ_STATS.length?`<div class="list">${L19_QUIZ_STATS.map(s=>`<div class="li --static"><div class="t"><b>${s[0]}</b></div><div class="l-bar" style="width:180px"><div class="progress ${s[1]/s[2]<.7?"--accent":""}"><i style="width:${Math.round(s[1]/s[2]*100)}%"></i></div><span class="v">${Math.round(s[1]/s[2]*100)}%</span></div><span class="xs muted tnum" style="width:44px;text-align:right">${s[1]}/${s[2]}</span></div>`).join("")}</div>`:`<div class="l-dash" style="margin:14px">Answer a few questions to see this.</div>`}</div></div>`;
  let card;
  if(!items.length)card=`<div class="l-qcard">${L19.panelEmpty("No quiz today – check back tomorrow.","moon")}<div class="xs muted" style="text-align:center">The daily set is built at 10:00 by the scheduler, not by this page.</div></div>`;
  else if(cur){const l=L19_LESSON(cur.lesson);card=`<div class="l-qcard"><div class="row mb16"><span class="tag ${cur.kind==="Your weak spot"?"--accent":cur.kind==="What's new"?"--ink":""}">${cur.kind}</span><span class="sp"></span><span class="xs muted tnum">${nAns+1} of ${items.length}</span></div><div class="l-steps mb16">${items.map(q=>`<i class="${ans[q.id]===undefined?(q===cur?"on":""):ans[q.id]===q.a?"ok":"bad"}"></i>`).join("")}</div><div class="h3" style="margin-bottom:14px">${esc(cur.q)}</div>${cur.opts.map((o,i)=>`<label class="l-opt" onclick="L19X.quizAnswer(${cur.id},${i})"><input type="radio" name="qz"><span>${esc(o)}</span></label>`).join("")}<div class="xs muted mt8">Tap an answer – it counts at once, no confirm button. A wrong answer brings the question back tomorrow.</div></div>`}
  else{const last=items[items.length-1];card=`<div class="l-qcard"><div class="h2">Done for today</div><div class="row mt8" style="gap:16px"><span class="kpi-s tnum">${nOk}<span class="xs muted"> of ${items.length} correct</span></span><span class="pill --done">6-day streak</span></div><div class="hr"></div>${L19X.quizReview(last)}</div>`}
  const lastAns=items.filter(q=>ans[q.id]!==undefined).slice(-1)[0];

  const team=A.isMgr()?`<div class="panel mt16"><div class="p-head"><div class="h4">Team, last 30 days</div><span class="xs muted">no ranking on purpose</span></div><div class="p-body"><table class="tbl"><thead><tr><th>Person</th><th class="num">Answered</th><th class="num">Correct</th><th>Weakest topic</th></tr></thead><tbody>${L19_QUIZ_TEAM.map(r=>`<tr class="r" onclick="App.toast('${esc(A.user(r[0]).n)} · opens their learning')"><td>${A.avatar(r[0],"--s")} ${esc(A.user(r[0]).n)}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td>${r[3]==="—"?"<span class='muted'>—</span>":esc(r[3])}</td></tr>`).join("")}</tbody></table></div></div>`:"";
  $("#l19-quiz-body").innerHTML=`<div class="l-cols"><div class="l-stack"><div class="l-quiz" style="max-width:none">${card}${review}</div>${team}</div><div class="l-stack">${stats}</div></div>`;
};

      <div class="row mt8"><button class="btn" ${allQ&&allR?"":"disabled"} onclick="L19X.skillFinish()">Finish</button><span class="xs muted">${allQ&&allR?"Scores and the breakdown by category are counted on Finish.":"Answer every question and rate every category first."}</span></div></div>`;

/* ---------- My development plan ---------- */
window.mount_development=function(){
  const A=App,$=A.$,esc=A.esc,ic=A.icon,me=A.me().id;const D=L19.dev;

  const sugg=L19.devNoSugg?null:L19_SUGGESTION;
  const canTake=f.goals.length<3;
  const left=`${D.agreed?`<div class="note-box --ok mb16">${ic("check")} Plan agreed · Next conversation: ${L19.fmtDY(f.next)}${plan&&plan.agreedBy?` · by ${esc(A.user(plan.agreedBy).n)}`:""}</div>`:""}
    ${plan&&plan.mentorNote?`<div class="card --flat mb16"><span class="caps">Note from your mentor</span><div class="sm">${esc(plan.mentorNote)}</div></div>`:""}
    <div class="card"><div class="field"><label>What I am good at</label><textarea class="textarea" oninput="L19.dev.form.strengths=this.value;L19X.devDirty()">${esc(f.strengths)}</textarea></div><div class="field mt16"><label>What I want to get better at</label><textarea class="textarea" oninput="L19.dev.form.growth=this.value;L19X.devDirty()">${esc(f.growth)}</textarea></div></div>
    <div class="sec-head"><div class="h3">Goals ${f.goals.length}/3</div>${f.goals.length<3?`<button class="textbtn" onclick="L19X.devAddGoal()">+ Goal</button>`:`<span class="xs muted">Three is the limit on purpose – fewer goals, more done.</span>`}</div>
    <div class="col" style="gap:12px">${f.goals.map((g,i)=>`<div class="l-goal"><div class="g-head"><span class="caps" style="margin:0">Goal ${i+1}</span><span class="sp"></span><div class="seg-ctl">${["In progress","Done","Dropped"].map(s=>`<button class="${g.status===s?"on":""}" onclick="L19.dev.form.goals[${i}].status='${s}';L19X.devDirty();L19X.dev()">${s}</button>`).join("")}</div>${f.goals.length>1?`<button class="ib" title="Remove goal" onclick="L19X.devRemoveGoal(${i})">${ic("close")}</button>`:""}</div>
      <div class="field"><label>Goal</label><input class="input" value="${esc(g.t)}" oninput="L19.dev.form.goals[${i}].t=this.value;L19X.devDirty()"></div><div class="field"><label>How we will both know it happened</label><input class="input" value="${esc(g.how)}" oninput="L19.dev.form.goals[${i}].how=this.value;L19X.devDirty()"></div><div class="grid g2"><div class="field"><label>What the company gives for this</label><input class="input" value="${esc(g.give)}" oninput="L19.dev.form.goals[${i}].give=this.value;L19X.devDirty()"></div><div class="field"><label>By when</label><input class="input" type="date" value="${esc(g.by)}" oninput="L19.dev.form.goals[${i}].by=this.value;L19X.devDirty()"></div></div></div>`).join("")}</div>
    <div class="card mt16"><div class="field"><label>Next conversation</label><input class="input" type="date" value="${esc(f.next||"")}" style="max-width:220px" oninput="L19.dev.form.next=this.value;L19X.devDirty()"><div class="xs muted">When you and your mentor sit down next – the plan is agreed in that conversation.</div></div></div>
    ${L19.devErr?`<div class="l-err mt16" role="alert">${esc(L19.devErr)}</div>`:""}
    <div class="sticky-foot mt16"><span class="xs muted">${D.dirty?"Unsaved changes":D.exists?"Saved · "+plan.period:"Not created yet – Save makes the "+L19_SUGGESTION.period+" draft"}</span><span class="sp"></span>${D.agreed&&D.dirty?`<span class="xs warn">Saving an agreed plan sends it back to your mentor to re-agree</span>`:""}<button class="btn --sm" onclick="L19X.devSave()">${ic("check")} Save</button></div>`;
  const right=`${sugg?`<div class="panel"><div class="p-head"><div class="h4">The system's plan for you</div><span class="xs muted">${sugg.period}</span></div><div class="p-body">${sugg.items.map((s,i)=>`<div style="padding:12px 14px;border-bottom:1px solid var(--hair)"><b style="font-weight:400">${esc(s.goal)}</b><div class="sm soft" style="margin-top:2px">${esc(s.why)}</div><div class="xs muted mt8">${s.proof.map(p=>`${L19.fmtD(p[0])} · ${esc(p[1])}`).join("<br>")}</div><div class="mt8">${f.goals.some(g=>g.t===s.goal)?`<span class="pill --done">In my plan</span>`:`<button class="btn --sm --ghost" ${canTake?"":"disabled"} onclick="L19X.devTake(${i})">Take into my plan</button>${canTake?"":`<span class="xs accent" style="margin-left:8px">Three goals is the limit</span>`}`}</div></div>`).join("")}</div></div>`:""}
    <div class="panel"><div class="p-head"><div class="h4">What we have noticed</div><span class="xs muted">up to 20 signals</span></div><div class="p-body">${L19_SIGNALS.map(s=>`<div class="l-sig-row" style="padding:8px 14px"><span class="s ${s[0]==="+"?"--ok":""}">${s[0]}</span><span style="flex:1">${esc(s[1])}</span><span class="xs muted tnum">${L19.fmtD(s[2])}</span></div>`).join("")}</div></div>
    <div class="panel"><div class="p-head"><div class="h4">Conversations</div></div><div class="p-body">${plan&&plan.checkIns.length?plan.checkIns.map(c=>`<div style="padding:10px 14px;border-bottom:1px solid var(--hair)"><div class="xs muted">${L19.fmtDY(c.at)} · ${esc(A.user(c.by).n)}</div><div class="sm">${esc(c.note)}</div></div>`).join(""):`<div class="l-dash" style="margin:14px">No conversations yet.</div>`}</div></div>`;
  $("#l19-dev-body").innerHTML=`<div class="row mb16" style="align-items:baseline"><div class="h2">My development plan</div><span class="muted sm">${plan?plan.period:L19_SUGGESTION.period}</span>${plan?A.pill(plan.status==="agreed"?"done":plan.status==="closed"?"todo":"doing",plan.status==="agreed"?"Agreed":plan.status==="closed"?"Closed":"Draft"):""}</div><div class="l-cols"><div class="l-stack">${left}</div><div class="l-stack">${right}</div></div>`;
};

  lessonCheck(){const l=L19_LESSON(L19.lessonId);const b=document.getElementById("l19-submit"),h=document.getElementById("l19-submit-hint"),w=document.getElementById("l19-words");if(!b)return;

  sigInit(){const c=document.getElementById("l19-sigc");if(!c)return;const box=c.parentElement;c.width=box.clientWidth*2;c.height=box.clientHeight*2;const ctx=c.getContext("2d");ctx.lineWidth=3;ctx.lineCap="round";ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--ink")||"#1e1a17";let on=false,pts=0;const P=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return [(t.clientX-r.left)/r.width*c.width,(t.clientY-r.top)/r.height*c.height]};
    const dn=e=>{on=true;const [x,y]=P(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()},mv=e=>{if(!on)return;const [x,y]=P(e);ctx.lineTo(x,y);ctx.stroke();pts++;e.preventDefault()},up=()=>{if(!on)return;on=false;L19.sigPts=(L19.sigPts||0)+pts;pts=0;L19.sigDrawn=L19.sigPts>=12;L19.sigErr=!L19.sigDrawn;const er=document.getElementById("l19-sig-err");if(er)er.style.display=L19.sigDrawn?"none":"";L19X.lessonCheck()};
