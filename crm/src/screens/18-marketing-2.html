    <div><div class="row" style="gap:8px;flex-wrap:wrap"><span class="tag --line">${t.type}</span>${t.acc?`<button class="link" style="text-transform:none;letter-spacing:0" onclick="App.toast('Opens instagram.com/${esc(t.acc.slice(1))}')">${esc(t.acc)}</button>`:`<span class="muted">Added by hand</span>`}<span class="muted">${A.fmtDate(t.at)}</span>${t.acc?`<button class="textbtn" onclick="App.toast('Opens the post on Instagram')">Open in Instagram</button>`:""}</div>
     <div class="row mt8 tnum" style="gap:14px"><span>${fmtN(t.views)} views</span><span>${fmtN(t.likes)} likes</span><span>${t.comments} comments</span></div>
     <div class="h3 mt16">Caption</div><div class="sm">${esc(t.cap)}</div>
     <div class="field mt16"><label>Transcript</label><textarea class="textarea" id="mk-tr" oninput="MK2.st.tdirty=this.value!==MK2.trCur;App.$('#mk-trsave').disabled=!MK2.st.tdirty">${esc(t.transcript||"")}</textarea><div class="row"><button class="btn --ghost --sm" id="mk-trsave" disabled onclick="MK2.trSave(${t.id})">Save transcript</button></div></div>
     <div class="row mt16" style="gap:12px;flex-wrap:wrap"><button class="btn --sm" ${st.tai&&!st.tanBusy?"":"disabled"} onclick="MK2.analyse(${t.id})">${ic("sparkle")} ${st.tanBusy?"Analysing…":t.analysed?"Analyse again":"Analyse the video"}</button>${t.analysed?`<span class="note">Analysed ${t.analysedAt?ago(t.analysedAt):"2 d ago"} · post is in the idea bank</span>`:""}${st.tai?"":`<span class="note accent">AI is off for this module (TRENDS_AI_ENABLED).</span>`}${st.tprofile?"":`<span class="note">Fill in the brand profile first – <button class="textbtn" onclick="App.go('mk-trend-accounts')">Accounts &amp; profile</button></span>`}</div></div></div>
   ${t.analysed?`<div class="tabs-an">${tabs.map(([v,l])=>`<button class="${tab===v?"on":""}" onclick="MK2.st.tanTab='${v}';App.remount()">${l}</button>`).join("")}</div><div class="card"><ul class="sm" style="margin:0;padding-left:18px">${BREAK[tab].map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="note mt8">${tab==="ideas"?"Pick one and generate content below.":tab==="summary"?"What the post is about and why it travelled.":"Part of the AI breakdown built with the brand profile."}</div></div>`:`<div class="note mt16">Run the analysis to see Summary · Hook · Core · Call to action · Success patterns · Ideas for us.</div>`}
   <div class="sec-head"><div class="h3">Generate content from this trend</div></div>
   <div class="card"><div class="grid g3"><div class="field"><label>Format</label><select class="select" id="mk-gf" ${st.tai?"":"disabled"}><option>Reels script</option><option>Carousel</option><option>Telegram post</option></select><div class="note">Reels: scenes with timing · Carousel: slides · Telegram: one text</div></div><div class="field" style="grid-column:span 2"><label>Extra instructions</label><input class="input" ${st.tai?"":"disabled"} placeholder="e.g. mention the Thursday market, no prices"></div></div><div class="row mt8"><button class="btn --sm" ${st.tai?"":"disabled"} onclick="MK2.generate(${t.id})">${ic("sparkle")} Generate</button></div></div>
   <div class="sec-head"><div class="h3">Generated pieces</div><span class="note">${pieces.length}</span></div>
   ${pieces.length?pieces.map(piece).join(""):`<div class="empty" style="border:1px solid var(--hair)"><div class="sm">Nothing generated yet.</div></div>`}`;
  MK2.trCur=t.transcript||"";
};
function trSave(id){const t=TRENDS.find(x=>x.id===id);t.transcript=$("#mk-tr").value;st.tdirty=false;re();A.toast("Transcript saved · audited")}
function analyse(id){const t=TRENDS.find(x=>x.id===id);st.tanBusy=true;re();setTimeout(()=>{st.tanBusy=false;t.analysed=true;t.bank=true;t.analysedAt=NOW.toISOString();re();A.toast("Analysed with the brand profile · post added to the idea bank · audited")},1300)}
function generate(id){const t=TRENDS.find(x=>x.id===id);const f=$("#mk-gf").value;A.toast("Generating "+f+"…");setTimeout(()=>{PIECES.unshift(f==="Telegram post"?{id:Date.now(),post:id,fmt:f,at:NOW.toISOString(),title:"Market morning, our version",text:"5:10 at the market, 7:00 fridge full, 7:50 van out. Your early slot flowers were picked today.",cta:"Same-day until 22:00",caption:"",tags:[],planned:false}:f==="Carousel"?{id:Date.now(),post:id,fmt:f,at:NOW.toISOString(),title:"Our 4 stations",slides:["Stems","Wrap","Ribbon & card","Photo before it leaves"],cta:"Save this",caption:"Four stations.",tags:["#florist"],planned:false}:{id:Date.now(),post:id,fmt:f,at:NOW.toISOString(),title:"Thursday market in 30 seconds",scenes:[["0–3 s","Alarm 4:40, text on screen"],["3–12 s","Trolley through the market"],["12–25 s","Fridge filling up"],["25–30 s","Van out at 7:50"]],cta:"Order before 19:00",caption:"Thursday is market day.",tags:["#londonflorist"],planned:false});t.bank=true;t.pieces++;re();A.toast(f+" generated · post in the idea bank · audited")},1200)}
function toPlanner(id){const p=PIECES.find(x=>x.id===id);p.planned=true;POSTS.push({id:Date.now(),ch:p.fmt==="Telegram post"?"Telegram":"Instagram",date:null,status:"draft",text:p.text||p.caption||p.title,photo:null});re();A.toast("Draft created in the social planner · audit social.create")}
function pieceDel(id){M.confirmDel(()=>{PIECES.splice(PIECES.findIndex(p=>p.id===id),1);const t=TRENDS.find(x=>x.id===st.tcur);if(t&&t.pieces)t.pieces--;re();A.toast("Piece deleted · audited")},"Audited.")}
function trendDel(id){A.confirm("Delete this post with its breakdown and generated pieces?","Audited. You return to the feed.","Delete",()=>{TRENDS.splice(TRENDS.findIndex(t=>t.id===id),1);A.go("mk-trends");A.toast("Post deleted")},{danger:true})}

/* ===== TREND ACCOUNTS (MKTG-221…228) ===== */
window.mount_mk_trend_accounts=function(){
  const limit=5,used=TACC.length;
  head("mk-tacc-head",`<div class="h2">Marketing</div><span class="sp"></span><span class="note">Limit: ${used}/${limit} accounts</span>`);
  $("#mk-tacc-body").innerHTML=`${nav("m","mk-trends")}${tnav("acc")}
   <div class="two"><div class="stack"><div class="card"><div class="row"><input class="input" id="mk-au" placeholder="Username or profile link" onkeydown="if(event.key==='Enter')MK2.accAdd()"><button class="btn --sm" ${used>=limit?"disabled":""} onclick="MK2.accAdd()">Add account</button></div><div class="note mt8">The handle is normalised, the limit checked, then the account syncs from Instagram at once. ${used>=limit?"Limit reached – remove an account first.":""}</div></div>
    ${TACC.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Username</th><th>Status</th><th class="num">Followers</th><th class="num">Posts</th><th class="num ph-hide">Median</th><th>Last sync</th><th></th></tr></thead><tbody>${TACC.map(a=>`<tr class="r"><td><button class="link" style="text-transform:none;letter-spacing:0" onclick="App.toast('Opens instagram.com/${a.user}')">@${a.user}</button><span class="sub">${esc(a.name)}</span></td><td>${a.status==="active"?A.pill("ready","Active"):A.pill("todo","Paused")}${a.err?` <span class="pill --late --plain" title="${esc(a.err)}">Sync error</span>`:""}</td><td class="num">${fmtN(a.followers)}</td><td class="num">${a.posts}</td><td class="num ph-hide">${fmtN(a.median)}</td><td class="tnum">${a.sync?dt(a.sync):"never"}</td><td style="text-align:right;white-space:nowrap"><span class="acts"><button class="btn --ghost --sm" onclick="MK2.accSync(${a.id})">Sync</button><button class="btn --ghost --sm" onclick="MK2.accPause(${a.id})">${a.status==="active"?"Pause":"Resume"}</button><button class="ib" title="Delete" onclick="MK2.accDel(${a.id})">${ic("trash")}</button></span></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty" style="border:1px solid var(--hair)">${ic("user")}<div class="h3">No tracked accounts yet.</div></div>`}</div>
   <div class="card"><div class="h3">Brand profile for the AI</div><div class="note mb8">Used by every breakdown and generation.</div><div class="grid g2"><div class="field"><label>Brand name</label><input class="input" value="Floritta"></div><div class="field"><label>Content language</label><select class="select"><option>English</option><option>Russian</option></select></div></div><div class="field mt8"><label>Niche</label><input class="input" value="${st.tprofile?"Luxury same-day flower delivery, London SE1":""}"></div><div class="field mt8"><label>Preferred call to action</label><input class="input" value="${st.tprofile?"Order before 19:00 for same-day":""}"></div><div class="field mt8"><label>Audience</label><input class="input" value="${st.tprofile?"Londoners 25–45 sending gifts; offices; wedding planners":""}"></div><div class="field mt8"><label>Products / offer</label><input class="input" value="${st.tprofile?"Hand-tied bouquets £65–320, baskets, weekly office flowers, workshops":""}"></div><div class="field mt8"><label>Tone of voice</label><textarea class="textarea">${st.tprofile?"Warm, dry, specific. No exclamation marks, no discounts, no “stunning”.":""}</textarea></div><div class="row mt16" style="justify-content:flex-end"><button class="btn --sm" onclick="MK2.st.tprofile=true;App.toast('Profile saved – affects all breakdowns and generations')">Save profile</button></div></div></div>`;
};
function accAdd(){let v=($("#mk-au").value||"").trim();if(!v)return;v=v.replace(/^https?:\/\/(www\.)?instagram\.com\//,"").replace(/[@\/].*$/,"").replace(/^@/,"").toLowerCase();if(TACC.length>=5){A.toast("Limit reached");return}TACC.push({id:Date.now(),user:v,name:v,status:"active",followers:0,posts:0,median:0,sync:NOW.toISOString(),err:""});re();A.toast("@"+v+": 24 posts synced")}
function accSync(id){const a=TACC.find(x=>x.id===id);A.toast("Syncing @"+a.user+"…");setTimeout(()=>{a.sync=NOW.toISOString();a.err=a.user==="floral.fix.ldn"?a.err:"";re();A.toast(a.err?"@"+a.user+": "+a.err:"@"+a.user+": 6 new posts")},800)}
function accPause(id){const a=TACC.find(x=>x.id===id);a.status=a.status==="active"?"paused":"active";re();A.toast("@"+a.user+" · "+a.status+" · audited")}
function accDel(id){const a=TACC.find(x=>x.id===id);A.confirm("Remove the account and all its synced posts?","@"+a.user+" and its posts leave the feed; posts already in the idea bank stay. Audited.","Remove",()=>{TACC.splice(TACC.indexOf(a),1);re();A.toast("@"+a.user+" removed")},{danger:true})}

window.mount_mk_emails=function(){
  head("mk-emails-head",`<div class="h2">Marketing</div><span class="sp"></span>${demoBtn("MK2.emailsMenu(event)")}${st.emailsAvail?`<button class="btn --sm" id="mk-esave" ${st.emailsDirty?"":"disabled"} onclick="MK2.emailsSave()">Save</button>`:""}`);
  if(!st.emailsAvail){$("#mk-emails-body").innerHTML=`${nav("m","mk-emails")}<div class="empty" style="border:1px solid var(--hair)">${ic("mail")}<div class="h3">The storefront is not updated yet</div><div class="sm">The email_translations table does not exist on floritta.uk – deploy the storefront release first.</div></div>`;return}
  const l=st.locale,m=st.mailer;const rows=EMAIL_ROWS[m]||[];const stm=EMAIL_ST[l][m];const uploaded=l==="en"||Object.values(stm).some(v=>v);
  const stTag=s=>s==="reviewed"?A.pill("ready","Reviewed"):s==="machine"?A.pill("review","Machine"):A.pill("todo","Draft");
  $("#mk-emails-body").innerHTML=`${nav("m","mk-emails")}
   <div class="note mb8">en = the originals the site sends (editable too). Other languages are machine translations until a person marks them Reviewed. Save writes straight into the site database – customers get the new text at once.</div>
   <div class="emails"><div class="tpl"><div class="list">${MAILERS.map(([k,n])=>{const u=Object.values(EMAIL_ST[l][k]).filter(v=>v==="draft"||v==="machine").length;return `<div class="li ${m===k?"on":""}" onclick="MK2.switchTo('mailer','${k}')"><div class="t"><b>${n}</b><small>${k}</small></div>${u?`<span class="cnt" title="${u} lines not reviewed for ${l}">${u}</span>`:""}</div>`}).join("")}</div></div>
    <div class="ed"><div class="locales">${LOCS.map(x=>`<button class="${l===x?"on":""}" title="${unreviewed(x)} unreviewed" onclick="MK2.switchTo('locale','${x}')">${x}</button>`).join("")}</div>
     ${!uploaded?`<div class="empty">${ic("globe")}<div class="h3">This translation is not uploaded yet</div><div class="sm">Upload the ${l} strings to the site first; en stays the fallback.</div></div>`:rows.map(([k,v])=>`<div class="erow"><span class="k" title="${k}">${k}</span><span id="mk-est-${k}">${stTag(stm[k]||"draft")}</span><textarea class="textarea ${l==="ar"?"rtl":""}" oninput="MK2.emailEdit('${k}')">${l==="en"?esc(v):esc(l==="ar"?"ترجمة · "+v.slice(0,40):l.toUpperCase()+" · "+v)}</textarea><label class="check xs"><input type="checkbox" ${stm[k]==="reviewed"?"checked":""} onchange="MK2.emailReviewed('${k}',this.checked)"> Reviewed</label></div>`).join("")}
     <div class="note mt8">${st.emailsDirty?`<span class="accent">Unsaved changes – switching the email or language asks first (the old page lost them silently).</span>`:"Typing in a field marks the line Reviewed; the checkbox does the same without editing."}</div></div></div>`;
};
function emailEdit(k){EMAIL_ST[st.locale][st.mailer][k]="reviewed";st.emailsDirty=true;$("#mk-est-"+k).innerHTML=A.pill("ready","Reviewed");$("#mk-esave").disabled=false;const cb=$("#mk-est-"+k).parentElement.querySelector("input[type=checkbox]");if(cb)cb.checked=true}
function emailReviewed(k,v){const s=EMAIL_ST[st.locale][st.mailer];if(v){s["_prev_"+k]=s[k];s[k]="reviewed"}else s[k]=s["_prev_"+k]||"machine";st.emailsDirty=true;$("#mk-est-"+k).innerHTML=s[k]==="reviewed"?A.pill("ready","Reviewed"):s[k]==="machine"?A.pill("review","Machine"):A.pill("todo","Draft");$("#mk-esave").disabled=false}
function switchTo(k,v){const go=()=>{st[k]=v;st.emailsDirty=false;re()};if(st.emailsDirty)A.confirm("Discard unsaved changes?","You edited this email and did not press Save.","Discard",go,{danger:true});else go()}
function emailsSave(){const b=$("#mk-esave");b.textContent="Saving…";b.disabled=true;setTimeout(()=>{st.emailsDirty=false;re();const b2=$("#mk-esave");if(b2){b2.textContent="Saved";setTimeout(()=>{if($("#mk-esave"))$("#mk-esave").textContent="Save"},1500)}A.toast("Written to the site database (email_translations) – empty values skipped · audited")},600)}
function emailsMenu(ev){A.pop(ev,["Demo state",{t:"Storefront table · "+(st.emailsAvail?"present":"missing"),fn:()=>{st.emailsAvail=!st.emailsAvail;re()}}])}
