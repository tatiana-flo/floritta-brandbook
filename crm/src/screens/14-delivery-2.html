<style>
/* ===== 14-2 · Delivery – Exceptions · DPD · Tracking · Couriers · Idle · POD · Routes · Run · Presence ===== */
.d14b-grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
[data-size="ipad"] .d14b-grid5{grid-template-columns:repeat(3,minmax(0,1fr))}
[data-size="phone"] .d14b-grid5{grid-template-columns:repeat(2,minmax(0,1fr))}
.d14b-kpi{display:flex;flex-direction:column;gap:6px;border:1px solid var(--hair);padding:14px 16px;cursor:pointer}
.d14b-kpi.--hot{box-shadow:inset 0 3px 0 var(--accent)}
.d14b-kpi .row{gap:8px}
.d14b-ex{border:1px solid var(--hair);margin-bottom:10px}
.d14b-ex .xh{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;flex-wrap:wrap}
.d14b-ex .xh:hover{background:var(--silver)}
.d14b-ex .xh .t{flex:1;min-width:0}
.d14b-ex .xh .t b{font-weight:400}
.d14b-ex .xh .t small{display:block;color:var(--grey);font-size:12px}
.d14b-ex .xh .due{font-size:12px;color:var(--grey);white-space:nowrap}
.d14b-ex .xh .due.--late{color:var(--accent)}
.d14b-ex .xb{border-top:1px solid var(--hair);padding:12px 14px;font-size:13px}
.d14b-ex .xb .why{color:var(--accent);margin-bottom:8px}
.d14b-ex .xb .blk{border:1px solid var(--hair);padding:10px 12px;margin-top:10px}
.d14b-ex .xb .blk .caps{display:block;margin-bottom:6px}
.d14b-ex .xb .btn-row{margin-top:10px}
.d14b-flash{display:flex;align-items:center;gap:10px;border:1px solid var(--ok);background:var(--ok-bg);color:var(--ok);padding:8px 12px;font-size:13px;margin-top:10px}
.d14b-flash code{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d14b-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--hair)}
.d14b-pick>div{padding:10px 14px;border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);font-size:13px}
.d14b-pick>div b{font-weight:400;display:block}
.d14b-pick>div small{color:var(--grey);display:block;font-size:12px}
.d14b-form{display:grid;grid-template-columns:2fr 1.2fr .7fr .8fr 1fr auto;gap:10px;align-items:end;border:1px solid var(--hair);padding:14px}
[data-size="ipad"] .d14b-form,[data-size="phone"] .d14b-form{grid-template-columns:repeat(2,minmax(0,1fr))}
.d14b-trk{position:relative;height:320px;margin-bottom:16px;border:1px solid var(--hair)}
.d14b-trk .cp{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;cursor:pointer;z-index:3}
.d14b-trk .cp small{font-size:11px;background:var(--sel);color:var(--on-sel);padding:1px 6px;white-space:nowrap}
.d14b-trk .cp .avatar{box-shadow:0 0 0 2px var(--paper)}
.d14b-trk .ovl{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-size:13px;color:var(--grey)}
.d14b-trk .note{position:absolute;left:0;right:0;bottom:0;padding:6px 12px;font-size:11.5px;color:var(--grey);background:var(--paper);border-top:1px solid var(--hair);z-index:4}
.d14b-pod{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
[data-size="ipad"] .d14b-pod{grid-template-columns:repeat(3,minmax(0,1fr))}
[data-size="phone"] .d14b-pod{grid-template-columns:repeat(2,minmax(0,1fr))}
.d14b-pod .card{display:flex;flex-direction:column;gap:8px}
.d14b-pod .ev{font-size:12px;color:var(--grey)}
.d14b-run .bn{margin-bottom:10px}
.d14b-run .stop{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13px}
.d14b-run .stop .no{width:24px;height:24px;border:1px solid var(--light);display:grid;place-items:center;font-size:11px;flex:none;font-variant-numeric:tabular-nums}
.d14b-run .stop .t{flex:1;min-width:0}
.d14b-run .stop .t b{font-weight:400}
.d14b-run .stop .t small{display:block;color:var(--grey);font-size:12px}
.d14b-run .stop .ib{width:26px;height:26px}
.d14b-run .dm{border:1px solid var(--hair);background:var(--silver);height:180px;position:relative}
.d14b-run .dm svg{width:100%;height:100%}
.d14b-run .dm svg circle{stroke:var(--paper);stroke-width:1.5}
.d14b-run .dm .lg{position:absolute;right:8px;bottom:6px;font-size:11px;color:var(--grey);display:flex;gap:10px}
.d14b-run .dm .lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.d14b-pres{border:1px solid var(--hair);background:var(--silver);height:200px;position:relative;margin-bottom:16px}
.d14b-pres svg{width:100%;height:100%}
.d14b-pres text{font-family:var(--f-body);font-size:11px;fill:var(--ink)}
.d14b-pres circle{fill:var(--sel)}
.d14b-pres .ovl{position:absolute;inset:0;display:grid;place-items:center;color:var(--grey);font-size:13px}
.d14b-idle td .sub{white-space:normal}
.d14b-dayrow{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--hair);font-size:13px;flex-wrap:wrap}
.d14b-dayrow:last-child{border-bottom:0}
.d14b-dayrow .d{width:90px;flex:none}
.d14b-dayrow .m{color:var(--grey);font-size:12px}
.d14b-dayrow .sp{flex:1}
</style>

<script>
/* ===== 14-2 · state & demo data (file-local) ===== */
const D14B={ex:{empty:false,notHome:true,drafts:true,open:{},link:null,drafts:{}},dpd:{enabled:true,sandbox:true,tab:"active",q:"",order:"",svc:"",parcels:1,kg:2,date:"2026-10-20",booked:{}},trk:{state:"ok"},cr:{list:[{id:1,n:"Daniel",type:"in_house",phone:"+44 7700 900110",veh:"Van · Transit Connect",rate:14.5,ini:"DA",on:true},{id:2,n:"George",type:"in_house",phone:"+44 7700 900111",veh:"Cargo bike",rate:13,ini:"GE",on:true},{id:3,n:"Omar",type:"in_house",phone:"+44 7700 900112",veh:"Scooter",rate:"",ini:"OM",on:true},{id:4,n:"Stuart (gateway)",type:"gateway",gw:"stuart",on:false},{id:5,n:"Uber Direct (gateway)",type:"gateway",gw:"relay",on:true},{id:6,n:"Pedal Me",type:"",on:false}],form:null},idle:{date:"2026-10-20",enabled:true,empty:false,rev:{}},pod:{block:{},empty:false},rt:{runs:[{id:41,name:"Run 20 Oct · Morning",date:"20 Oct",courier:"Daniel",wave:"Morning · 08–12",stops:5,status:"done"},{id:42,name:"Run 20 Oct · Midday",date:"20 Oct",courier:"Daniel",wave:"Midday · 12–16",stops:6,status:"active"},{id:43,name:"Run 20 Oct · Evening",date:"20 Oct",courier:"George",wave:"Evening · 16–22",stops:3,status:"planned"},{id:38,name:"Run 19 Oct · Midday",date:"19 Oct",courier:"Omar",wave:"Midday · 12–16",stops:7,status:"done"}],empty:false},run:{id:42,locked:false,closed:false,started:"12:05",sched:"2026-10-20T12:00",ts:{}},pr:{enabled:true,geo:true,empty:false}};
const D14B_EX=()=>{const D14=window.D14;D14.ensure();const t=D14.todays();const pick=i=>t[i%t.length];const s=D14B.ex;
  return s.empty?[]:[
   {id:"e1",type:"courier_booking",o:pick(3),reason:"dispatch_outcome_unknown",due:"10:30",late:true},
   {id:"e2",type:"courier_booking",o:pick(7),reason:"no_coverage",due:"11:00",late:false},
   {id:"e3",type:"not_home",o:pick(1),since:"10:28",stage:"customer replied",proposal:{intent:"leave",place:"concierge",when:"",note:"Front desk is open until 18:00"},due:"11:15",late:false},
   {id:"e4",type:"not_home",o:pick(11),since:"09:50",stage:"no reply – your call",proposal:null,due:"10:40",late:true},
   {id:"e5",type:"failed",o:pick(5),due:"12:00",late:false},
   {id:"e6",type:"redelivery",o:pick(9),since:"08:15",stage:"sender asked too, waiting",proposal:{intent:"redeliver",when:"tomorrow morning",note:""},due:"Tomorrow 10:00",late:false},
   {id:"e7",type:"overdue",o:pick(13),due:"Yesterday 18:00",late:true}]};
const D14B_TYPE={courier_booking:["Courier booking – needs attention","alert"],failed:["Failed","close"],not_home:["Nobody home","user"],redelivery:["Redelivery requested","refresh"],overdue:["Overdue","clock"]};
const D14B_REASON={dispatch_outcome_unknown:"Booking result unknown – Uber did not answer whether the courier was booked",no_coverage:"Outside both Uber accounts' range (4 and 10 miles)",no_courier_tip2:"Nobody took it even with a £2 tip",rebook_failed:"Repeat booking with a tip did not go through"};

/* ===== Exceptions ===== */
window.mount_delivery_exceptions=function(){const D14=window.D14,S=D14B.ex,esc=App.esc,ic=App.icon,can=D14.manage();
  document.getElementById("d14-nav-ex").innerHTML=D14.nav("exceptions");
  App.$("#d14-ex-head").innerHTML=`<span class="caps">Exceptions · −14…+7 days · most urgent first</span><span class="tag --accent" title="DLOP-100: the CRM has no menu item or inbound link – only the direct URL /delivery/exceptions">no menu entry in the CRM</span><span class="sp"></span><span class="muted xs">no auto-refresh</span><button class="btn --ghost --sm" onclick="EX.demo(event)">${ic("sparkle")} Demo state</button>`;
  const list=D14B_EX();const cnt=k=>list.filter(x=>x.type===k).length;
  // <!-- ids: DLOP-101 -->
  let h=`<div class="d14b-grid5">${Object.keys(D14B_TYPE).map(k=>`<div class="d14b-kpi ${cnt(k)?"--hot":""}" onclick="EX.jump('${k}')"><span class="row">${ic(D14B_TYPE[k][1])}<span class="caps" style="margin:0">${D14B_TYPE[k][0]}</span></span><span class="kpi-s ${cnt(k)?"accent":""}">${cnt(k)}</span></div>`).join("")}</div>`;
  if(!list.length)h+=`<div class="empty mt24">${ic("check")}<div class="h3">All clear – no delivery exceptions right now.</div></div>`;
  else{
    // <!-- ids: DLOP-102 DLOP-103 DLOP-104 DLOP-105 DLOP-106 DLOP-107 DLOP-108 DLOP-109 DLOP-110 DLOP-111 DLOP-112 DLOP-113 DLOP-114 DLOP-115 DLOP-116 -->
    h+=`<div class="sec-head mt24"><div class="h2">Deliveries</div><span class="muted xs">excluding delivered and cancelled · severity, then the most overdue deadline</span></div>`;
    list.forEach(x=>{const o=x.o;const open=S.open[x.id];const nh=x.type==="not_home"||x.type==="redelivery";const draft=S.drafts[x.id];
      h+=`<div class="d14b-ex" id="ex-${x.type}"><div class="xh" onclick="D14B.ex.open['${x.id}']=!D14B.ex.open['${x.id}'];App.remount()"><span class="tag ${x.type==="courier_booking"||x.type==="overdue"?"--accent":""}">${D14B_TYPE[x.type][0]}</span><div class="t"><b><button class="link" onclick="event.stopPropagation();App.openOrder(${o.id})">#${o.id}</button> · ${esc(o.recipient)}</b><small>${D14.pcOf(o)} · ${esc(o.slot)} · ${o.courier?(o.courier==="Uber Direct"?"Uber Direct":esc(App.user(o.courier).n)):"Unassigned"}</small></div><span class="due ${x.late?"--late":""}">Due by ${x.due}</span>${ic(open?"down":"chev")}</div>`;
      if(open){h+=`<div class="xb">`;
        if(x.type==="courier_booking"){h+=`<div class="why">${esc(D14B_REASON[x.reason]||x.reason)}</div>`;
          if(x.reason==="dispatch_outcome_unknown")h+=`<div class="blk"><span class="caps">Booking result unknown</span><div class="sm">«Call courier» is blocked for this order everywhere in the CRM until you check the Uber dashboard and tell us what happened – otherwise a second booking could be charged twice.</div>
            <div class="grid g3 mt16"><div class="field"><label>Uber delivery ID from the Uber dashboard</label><input class="input" id="ex-uid-${x.id}" placeholder="del_…"></div><div class="field"><label>Uber account</label><select class="select"><option>10-mile account (uber_direct_2)</option><option>UK account (uber_direct)</option></select></div><div class="field"><label>&nbsp;</label><button class="btn --sm" ${can?"":"disabled"} onclick="EX.link('${x.id}')">Uber has it · Link</button></div></div>
            <div class="btn-row"><button class="btn --ghost --sm" ${can?"":"disabled"} onclick="EX.release('${x.id}')">Uber doesn't have it</button><span class="xs muted">Account defaults to the last attempt's</span></div></div>`;
          else h+=`<div class="btn-row"><button class="btn --sm" onclick="App.go('delivery',{open:${o.id}})">Open on Dispatch</button><button class="btn --ghost --sm" onclick="D14.assignDpd(${o.id});App.remount()">Assign DPD</button></div>`}
        if(nh){if(S.notHome){h+=`<div class="blk"><span class="caps">Nobody home</span><div class="sm"><b>${esc(x.stage)}</b> · since ${x.since}${x.proposal?`<br>Proposal: ${x.proposal.place?"leave with "+x.proposal.place:""}${x.proposal.when?"deliver "+x.proposal.when:""}${x.proposal.note?" · "+esc(x.proposal.note):""}`:""}</div>
            <div class="btn-row">${x.proposal&&x.proposal.place?`<button class="btn --sm" onclick="EX.resolve('${x.id}','leave','${x.proposal.place}')">Leave with: ${esc(x.proposal.place)}</button>`:`<button class="btn --ghost --sm" onclick="EX.resolve('${x.id}','concierge')">Leave with concierge</button><button class="btn --ghost --sm" onclick="EX.resolve('${x.id}','neighbour')">Leave with neighbour</button>`}<button class="btn ${x.proposal&&x.proposal.intent==="redeliver"?"":"--ghost"} --sm" onclick="EX.resolve('${x.id}','redeliver')">Redeliver tomorrow morning</button><button class="btn --ghost --sm" onclick="EX.resolve('${x.id}','returned')">Returned to studio</button>${x.proposal&&x.proposal.intent==="cancel"?`<button class="btn --ghost --sm" onclick="EX.resolve('${x.id}','cancelled')">Cancelled</button>`:""}</div>
            <div class="btn-row">${x.type==="not_home"?`<button class="textbtn" onclick="EX.copyLink('${x.id}')">Copy link</button>`:""}</div>${S.link===x.id?`<div class="d14b-flash">${ic("link")}<code>floritta.uk/track/t_${o.id}9f3a</code><button class="textbtn" onclick="App.toast('Copied – paste it into WhatsApp')">Copy</button></div>`:""}</div>`}
          else h+=`<div class="note-box">Nobody-home resolver is off (DELIVERY_NOT_HOME_RESOLVER_ENABLED) – the case block is hidden.</div>`}
        if(x.type==="failed")h+=`<div class="sm soft">Courier marked it failed · reason: recipient not answering. Re-plan on Dispatch or redeliver.</div><div class="btn-row"><button class="btn --sm" onclick="App.go('delivery',{open:${o.id}})">Open on Dispatch</button></div>`;
        if(x.type==="overdue")h+=`<div class="sm soft">Due ${x.due} and still not delivered.</div><div class="btn-row"><button class="btn --sm" onclick="App.go('delivery',{open:${o.id}})">Open on Dispatch</button></div>`;
        if(S.drafts)h+=`<div class="btn-row">${draft?`<button class="btn --ghost --sm" onclick="App.go('inbox',{customer:${o.customer}})">${ic("edit")} Open draft in inbox</button>`:""}<button class="btn --ghost --sm" ${can?"":"disabled"} onclick="EX.draft('${x.id}')">${ic("sparkle")} ${draft?"Draft again":"Draft a message"}</button><span class="xs muted">AI writes to the customer under this exception type – nothing is sent</span></div>`;
        h+=`</div>`}
      h+=`</div>`})}
  App.$("#d14-ex-body").innerHTML=h};
window.EX={
  demo(ev){const S=D14B.ex;const t=(k,l)=>({t:l,ic:S[k]?"check":undefined,fn:()=>{S[k]=!S[k];App.remount()}});App.pop(ev,["Demo state",t("empty","All clear (no exceptions)"),t("notHome","Nobody-home resolver flag"),t("drafts","AI drafts flag")])},
  jump(k){const el=document.getElementById("ex-"+k);if(el)el.scrollIntoView({block:"start"});else App.toast("No exceptions of this type")},
  link(id){const v=(App.$("#ex-uid-"+id)||{}).value;if(!v){App.toast("Enter the Uber delivery ID first");return}App.toast("Linked · Uber webhooks update the order from here; «Call courier» stays blocked for this order")},
  release(id){App.confirm("Uber doesn't have it?","You checked the Uber dashboard and there is no booking for this order. The hold is removed, stuck attempts are closed and «Call courier» works again.","Release",()=>{App.toast("Hold removed · Call courier works again")})},
  resolve(id,r,place){const lbl={leave:"Leave with "+place,concierge:"Leave with concierge",neighbour:"Leave with neighbour",redeliver:"Redeliver tomorrow morning",returned:"Returned to studio",cancelled:"Cancelled"}[r];App.confirm("Record this decision?",lbl+". The instruction is written into the order; if the trip was closed as failed, a redelivery goes to the same courier. The case closes.",lbl,()=>{App.toast("Recorded · "+lbl+(r==="cancelled"?" (the order itself is not cancelled)":""))})},
  copyLink(id){D14B.ex.link=id;App.remount();App.toast("Tracking link created – the recipient can choose a new delivery there")},
  draft(id){D14B.ex.drafts[id]=true;App.remount();App.toast("AI draft written · opens the thread in Comms – not sent","Open inbox",()=>App.go("inbox"))}
};
document.addEventListener('orders',()=>{if(App.state.current==='delivery-exceptions')window.mount_delivery_exceptions()});

/* ===== DPD ===== */
const D14B_SHIP=()=>{const D14=window.D14;D14.ensure();const t=App.data.orders.filter(o=>o.type==="delivery").slice(0,9);
  return t.map((o,i)=>({id:"15501"+i,o,svc:i%3===0?"Next day · by 12":"Next day",parcels:1+(i%2),kg:1.5+(i%3),ship:i<3?"20 Oct":i<6?"19 Oct":"17 Oct",status:i===0?"exception":i<3?"in transit":i<6?"delivered":i===6?"voided":"collected",event:i===0?"Attempted – no access · 09:41":i<3?"Out for delivery · 08:12":i<6?"Delivered · 11:0"+i:i===6?"Voided locally":"Collected from shop · 16:30",hidden:i===2}))};
window.mount_delivery_dpd=function(){const D14=window.D14,S=D14B.dpd,esc=App.esc,ic=App.icon;
  document.getElementById("d14-nav-dpd").innerHTML=D14.nav("delivery-dpd");

/* ===== Routes (runs list) ===== */
window.mount_delivery_routes=function(){const D14=window.D14,S=D14B.rt,esc=App.esc,ic=App.icon;
  document.getElementById("d14-nav-rt").innerHTML=D14.nav("delivery-routes");
  App.$("#d14-rt-head").innerHTML=`<div class="field" style="flex-direction:row;align-items:center;gap:8px"><label>Date *</label><input class="input" type="date" value="2026-10-20" id="rt-date" style="width:160px;height:32px"></div><div class="field" style="flex-direction:row;align-items:center;gap:8px"><label>Courier</label><select class="select" id="rt-c" style="width:200px;height:32px">${D14B.cr.list.filter(c=>c.on).map(c=>`<option>${esc(c.n)}</option>`).join("")}</select></div><div class="field" style="flex-direction:row;align-items:center;gap:8px"><label>Wave</label><select class="select" id="rt-w" style="width:190px;height:32px"><option>Morning · 08–12</option><option>Midday · 12–16</option><option>Evening · 16–22</option></select></div><button class="btn --sm" onclick="RT.create()">${ic("plus")} New run</button><span class="sp"></span><label class="check xs"><input type="checkbox" ${S.empty?"checked":""} onchange="D14B.rt.empty=this.checked;App.remount()"> Demo: no runs</label>`;
  // <!-- ids: DLOP-159 DLOP-160 DLOP-161 DLOP-195 -->
  App.$("#d14-rt-body").innerHTML=`<div class="note-box mb16">Old run planner – all runs ever, newest date first, no paging, search or filters. The live picture is on Couriers today.</div>`+(S.empty?`<div class="empty">${ic("route")}<div class="h3">No runs yet</div></div>`:`<div class="tbl-wrap"><table class="tbl"><tr><th>Route planner</th><th>Date</th><th>Courier</th><th>Wave</th><th class="num">Stops</th><th>Status</th><th></th></tr>${S.runs.map(r=>`<tr class="r" onclick="RT.open(${r.id})"><td>${esc(r.name)}</td><td>${r.date}</td><td>${esc(r.courier)}</td><td>${r.wave}</td><td class="num">${r.stops}</td><td><code class="xs">${r.status}</code></td><td><button class="textbtn" onclick="event.stopPropagation();RT.open(${r.id})">Open</button></td></tr>`).join("")}</table></div>`)};
window.RT={create(){const d=App.$("#rt-date").value,c=App.$("#rt-c").value,w=App.$("#rt-w").value;const id=44+D14B.rt.runs.length;D14B.rt.runs.unshift({id,name:"Run "+new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" · "+w.split(" ·")[0],date:new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"}),courier:c,wave:w,stops:0,status:"planned"});App.toast("Run created · planned");RT.open(id)},
  open(id){D14B.run.id=id;App.go("delivery-route",{id})}};

/* ===== Route (one run) ===== */
window.mount_delivery_route=function(params){const D14=window.D14,S=D14B.run,esc=App.esc,ic=App.icon;D14.ensure();
  if(params&&params.id)S.id=params.id;const r=D14B.rt.runs.find(x=>x.id===S.id)||D14B.rt.runs[1];
  document.getElementById("d14-nav-run").innerHTML=D14.nav("delivery-routes");
  const cid=r.courier.toLowerCase().split(" ")[0];const t=D14.T[cid]||D14.T.daniel;const stops=S.stops||(S.stops=t.stops.slice(0,r.stops||t.stops.length).map(s=>s.id));
  const started=S.started&&!S.closed;
  App.$("#d14-run-head").innerHTML=`<button class="ib" title="← Routes" onclick="App.go('delivery-routes')">${ic("back")}</button><div><div class="h3">${esc(r.name)} · ${r.date}</div><div class="xs muted">${esc(r.courier)}</div></div><span class="sp"></span>
    ${S.closed?"":`<button class="btn --sm" onclick="RUN.start()">${started?"Restart from now":"Delivery Start"}</button>`}
    ${S.locked||S.closed?"":`<button class="btn --ghost --sm" onclick="RUN.auto()">Auto-assign</button><button class="btn --ghost --sm" onclick="RUN.optimize()">Optimize route</button>`}
    <button class="btn --ghost --sm" onclick="RUN.lock()">${ic("lock")} ${S.locked?"Unlock":"Lock"}</button>
    <button class="btn --ghost --sm" onclick="App.toast('Run sheet opens in a new tab · position, ETA, code, recipient, phone, address, slot, instructions')">${ic("printer")} Print run sheet</button>
    ${S.closed?"":`<button class="btn --ghost --sm" onclick="RUN.close()">Close run</button>`}`;
  let h=`<div class="d14b-run">`;
  // <!-- ids: DLOP-169 DLOP-170 DLOP-171 DLOP-172 -->
  if(S.locked)h+=`<div class="note-box --warn bn">${ic("lock")} This run is locked – order, start time, optimisation and auto-assign are frozen · locked by ${App.me().n}</div>`;
  if(S.closed)h+=`<div class="note-box --ok bn">✓ This run is closed · undelivered stops stay incomplete – there is no «open again»</div>`;
  const unpaid=stops.map(id=>App.order(id)).filter(o=>o&&o.paid!=="paid").length;if(unpaid)h+=`<div class="note-box --accent bn">${ic("alert")} ${unpaid} unpaid order(s) in this run</div>`;
  h+=`<div class="grid g3 mb16"><div class="card"><span class="caps">Scheduled start · London time</span><div class="row"><input class="input" type="datetime-local" value="${S.sched}" ${S.locked?"disabled":""} onchange="D14B.run.sched=this.value"><button class="btn --sm" ${S.locked?"disabled":""} onclick="App.toast('Scheduled start saved')">Save</button></div>${started?`<div class="sm mt8">▸ Started ${S.started} · on the road – ${D14.hm(D14.NOWM-D14.mins(S.started)+120).slice(0,5).replace(":","h ")}m</div>`:`<div class="sm muted mt8">Working time – not started</div>`}</div>
    <div class="card"><span class="caps">Punctuality</span><div class="kpi-s">On-time 67%</div><div class="sm">2 late · 1 very late</div></div><div class="card"><span class="caps">Return</span><div class="kpi-s">~ ${t.back||"12:10"}</div><div class="sm">projected, from the last stop</div></div></div>`;
  // <!-- ids: DLOP-173 -->
  const pts=stops.map(id=>App.order(id)).filter(Boolean).map((o,i)=>({o,p:D14.pos(o),k:i%3===0?"ok":i%3===1?"warn":"accent"}));
  h+=pts.length>=2?`<div class="dm mb16"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${pts.map(x=>`<circle cx="${x.p.x}" cy="${x.p.y}" r="2.2" fill="var(--${x.k})"><title>#${x.o.id} · ${x.k==="ok"?"on time":x.k==="warn"?"late":"very late"}</title></circle>`).join("")}<circle cx="${D14.SHOP.x}" cy="${D14.SHOP.y}" r="2.6" fill="var(--ink)"></circle></svg><div class="lg"><span><i style="background:var(--ok)"></i>On time</span><span><i style="background:var(--warn)"></i>Late</span><span><i style="background:var(--accent)"></i>Very late</span></div></div>`:``;
  // <!-- ids: DLOP-174 DLOP-175 DLOP-176 DLOP-177 -->
  h+=`<div class="sec-head"><div class="h3">Stops</div><span class="muted xs">${stops.length} · arrows save immediately</span></div>`;
  h+=stops.length?stops.map((id,i)=>{const o=App.order(id);if(!o)return"";const ts=S.ts[id]||{};const tag=i%3===0?App.pill("done","On time"):i%3===1?App.pill("review","Late"):i===stops.length-1?App.pill("queue","Pending"):App.pill("late","Very late");const p=App.product(o.product);
    return`<div class="stop"><span class="no">${i+1}</span><span class="thumb --s">${o.status==="delivered"?`<img src="${p.img}" alt="">`:""}</span><div class="t"><b>#${o.id} · ${D14.pcOf(o)}</b> ${tag}${o.paid!=="paid"?` <span class="tag --accent">Unpaid</span>`:""}<small>${esc(o.recipient)} · ETA ${D14.hm(12*60+5+i*20)} · +${(i*4)%13} m${ts.arr?" · arr "+ts.arr:""}${ts.dep?" · dep "+ts.dep:""}</small></div>${S.closed?"":`<button class="btn --ghost --sm" onclick="RUN.ts(${id},'arr')">Mark arrived</button><button class="btn --ghost --sm" onclick="RUN.ts(${id},'dep')">Mark departed</button>`}<button class="ib" ${S.locked||i===0?"disabled":""} onclick="RUN.move(${id},-1)">${ic("down").replace('viewBox','style="transform:rotate(180deg)" viewBox')}</button><button class="ib" ${S.locked||i===stops.length-1?"disabled":""} onclick="RUN.move(${id},1)">${ic("down")}</button></div>`}).join(""):`<div class="empty">${ic("route")}<div class="h3">No stops</div><div class="sm">Auto-assign adds every unplaced delivery of the day</div></div>`;
  h+=`</div>`;App.$("#d14-run-body").innerHTML=h};
window.RUN={
  start(){const S=D14B.run;S.started=window.D14.hm(window.D14.NOWM);App.remount();App.toast("Started · order and ETAs recomputed from now (Google / postcode) · no confirmation in the CRM")},
  auto(){const S=D14B.run,D14=window.D14;const add=D14.unassigned().map(o=>o.id).filter(id=>!S.stops.includes(id));S.stops=S.stops.concat(add);App.remount();App.toast("Assigned "+add.length+" orders · appended to the end, no confirmation")},
  optimize(){const S=D14B.run;S.stops=S.stops.slice().sort((a,b)=>window.D14.pos(App.order(a)).x-window.D14.pos(App.order(b)).x);App.remount();App.toast("Optimised · order and ETAs by Google Routes")},
  lock(){const S=D14B.run;S.locked=!S.locked;App.remount();App.toast(S.locked?"Run locked":"Run unlocked")},
  close(){const S=D14B.run;S.closed=true;App.remount();App.toast("Run closed · status done · no confirmation in the CRM")},
  ts(id,k){const S=D14B.run;(S.ts[id]=S.ts[id]||{})[k]=window.D14.hm(window.D14.NOWM);App.remount();App.toast((k==="arr"?"Arrived":"Departed")+" · #"+id+(S.locked?" (allowed on a locked run)":""))},
  move(id,d){const S=D14B.run;const i=S.stops.indexOf(id),j=i+d;if(j<0||j>=S.stops.length)return;S.stops.splice(i,1);S.stops.splice(j,0,id);App.remount();App.toast("Order saved")}
};

  h+=rows.length?`<div class="tbl-wrap"><table class="tbl"><tr><th>Courier</th><th>Status</th><th>Last seen</th><th>Battery</th><th class="num">Open deliveries</th><th>Alerts</th><th></th></tr>${rows.map(r=>`<tr><td>${App.avatar(r.c,"--s")} ${App.user(r.c).n}</td><td>${App.pill(r.st==="On a run"?"out":r.st==="Available"?"ready":r.st==="On break"?"review":"queue",r.st)}</td><td>${r.seen}</td><td class="tnum ${r.bat<20?"accent":""}">${r.bat}%</td><td class="num">${r.open}</td><td>${r.alerts.map(a=>`<span class="tag --accent">${a}</span>`).join(" ")}</td><td><button class="btn --ghost --sm" onclick="PR.force('${r.c}')">Force check-out</button></td></tr>`).join("")}</table></div><div class="xs muted mt8">The button is visible to everyone – the server's forceCheckout policy decides.</div>`:`<div class="empty">${ic("user")}<div class="h3">No couriers on shift right now.</div></div>`;
  App.$("#d14-pr-body").innerHTML=h};
window.PR={demo(ev){const S=D14B.pr;const t=(k,l)=>({t:l,ic:S[k]?"check":undefined,fn:()=>{S[k]=!S[k];App.remount()}});App.pop(ev,["Demo state",t("enabled","Presence flag"),t("geo","Geo flag (live positions)"),t("empty","Nobody on shift")])},
