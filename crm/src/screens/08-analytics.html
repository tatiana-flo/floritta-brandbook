<style>
#s-analytics .an{display:grid;grid-template-columns:184px minmax(0,1fr);gap:24px;align-items:start}
#s-analytics .an-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
#s-analytics .an-nav button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;font-size:13.5px;color:var(--graphite);white-space:nowrap}
#s-analytics .an-nav button.on{background:var(--ink);color:var(--paper)}
#s-analytics .an-nav button:hover:not(.on){background:var(--silver)}
#s-analytics .an-nav .grp{font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);padding:12px 10px 4px}
#s-analytics .an-body{min-width:0}
#s-analytics .kpi{font-size:32px}
#s-analytics .chart{position:relative;min-width:0}
#s-analytics .chart svg{width:100%;height:140px;display:block}
#s-analytics .chart .ax{display:flex;justify-content:space-between;font-size:11px;color:var(--grey);margin-top:4px}
#s-analytics .bar{height:80px}
#s-analytics .bar i{cursor:pointer;transition:background var(--m-fast)}
#s-analytics .bar i:hover{background:var(--grey)}
#s-analytics .hrow{display:grid;grid-template-columns:150px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px;min-height:28px}
#s-analytics .hrow .progress{height:8px}
#s-analytics .hrow.--go{cursor:pointer}#s-analytics .hrow.--go:hover span:first-child{text-decoration:underline}
#s-analytics .fun{display:grid;gap:8px}
#s-analytics .fun .st{display:grid;grid-template-columns:150px minmax(0,1fr) 80px 56px;gap:10px;align-items:center;font-size:13px}
#s-analytics .fun .st .progress{height:14px}
#s-analytics .hm{display:grid;grid-template-columns:70px repeat(7,minmax(0,1fr));gap:2px;font-size:11px;color:var(--grey);align-items:center}
#s-analytics .hm i{display:block;height:22px;background:var(--ink);cursor:pointer}
#s-analytics .hm i:hover{outline:1px solid var(--accent)}
#s-analytics .leg{display:flex;gap:14px;font-size:12px;color:var(--grey);flex-wrap:wrap;margin-top:8px}
#s-analytics .leg i{display:inline-block;width:10px;height:10px;background:var(--ink);margin-right:5px;vertical-align:-1px}
#s-analytics .leg i.--prev{background:var(--light)}#s-analytics .leg i.--accent{background:var(--accent)}#s-analytics .leg i.--ok{background:var(--ok)}#s-analytics .leg i.--warn{background:var(--warn)}
#s-analytics .spark{height:20px}
#s-analytics .rfm{display:grid;grid-template-columns:90px repeat(3,minmax(0,1fr));gap:4px;font-size:12px}
#s-analytics .rfm .c{padding:8px 10px;background:var(--silver);min-height:56px;cursor:pointer}
#s-analytics .rfm .c b{display:block;font-size:20px;font-family:var(--f-display);font-weight:300}
#s-analytics .rfm .c:hover{outline:1px solid var(--ink)}
#s-analytics .rfm .c.--hot{background:var(--accent-bg)}#s-analytics .rfm .c.--ok{background:var(--ok-bg)}
#s-analytics .pl td.ind{padding-left:28px;color:var(--graphite)}
#s-analytics .pl tr.tot td{font-weight:500;border-top:1px solid var(--light)}
#s-analytics .tbl td{max-width:none}
#s-analytics .hd-note{font-size:12px;color:var(--grey);width:100%}
#s-analytics .seg-ctl button.ic{padding:0 8px}
[data-size="ipad"] #s-analytics .an,[data-size="phone"] #s-analytics .an{grid-template-columns:1fr;gap:16px}
[data-size="ipad"] #s-analytics .an-nav,[data-size="phone"] #s-analytics .an-nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;position:static;border-bottom:1px solid var(--hair);padding-bottom:6px;margin:0 calc(var(--pad)*-1);padding-left:var(--pad);padding-right:var(--pad)}
[data-size="ipad"] #s-analytics .an-nav .grp,[data-size="phone"] #s-analytics .an-nav .grp{display:none}
[data-size="phone"] #s-analytics .kpi{font-size:26px}
[data-size="phone"] #s-analytics .grid.g2,[data-size="phone"] #s-analytics .grid.g3{grid-template-columns:1fr}
[data-size="phone"] #s-analytics .hrow{grid-template-columns:100px minmax(0,1fr) 60px}
[data-size="phone"] #s-analytics .fun .st{grid-template-columns:100px minmax(0,1fr) 60px 44px}
[data-size="phone"] #s-analytics .scr-head{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:8px}
[data-size="phone"] #s-analytics .scr-head .check{white-space:nowrap}
[data-size="phone"] #s-analytics .scr-head .btn{flex:none}
</style>
<section class="scr" id="s-analytics" data-nav="Analytics" data-group="Analytics" data-title="Analytics" data-roles="owner manager">
  <div class="scr-head" id="a8-head"></div>
  <div class="scr-body"><div class="an"><div class="an-nav" id="a8-nav"></div><div class="an-body" id="a8-body"></div></div></div>
</section>
<script>
(()=>{
const A=App,E=A.esc,I=A.icon,F=A.fmt,$=A.$,$$=A.$$,D=A.data;
const st={tab:"overview",period:"30d",cmp:true,basis:"paid",sort:{},cat:"All",pages:"all",salesBy:"day",utm:null,mk:"both",custom:["1 Oct","14 Oct"]};
const PER={today:1,"7d":7,"30d":30,quarter:91,year:365,custom:14};
const PL={today:"today","7d":"7 d","30d":"30 d",quarter:"quarter",year:"year",custom:"custom"};
const TABS=[["Business"],["overview","Overview","today"],["sales","Sales","orders"],["channels","Channels & UTM","link"],["products","Products","catalog"],["site","Site & Blog","globe"],["customers","Customers","customers"],["Operations"],["production","Production","production"],["delivery","Delivery","truck"],["comms","Comms & Flora","chat"],["team","Team","team"],["stock","Stock & Purchasing","warehouse"],["Money"],["finance","Finance","pound"],["marketplaces","Marketplaces","box"],["health","Data health","info"]];
const days=()=>PER[st.period],k=()=>days()/30,bf=()=>st.basis==="paid"?1:.965;
const hash=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))%1e6;return h};
const dv=key=>((hash(key)%29)-10)/100;
const sum=a=>a.reduce((s,x)=>s+x,0),avg=a=>a.length?sum(a)/a.length:0;
const n=(x,d=0)=>Number(x||0).toLocaleString("en-GB",{maximumFractionDigits:d,minimumFractionDigits:d});
const pct=(x,d=1)=>n(x,d)+"%";
const PR=D.products.filter(p=>!p.addon),AD=D.products.filter(p=>p.addon),FL=D.staff.filter(s=>s.role==="florist"),CU=D.customers;
const O30=sum(PR.map(p=>p.stats.orders30)),R30=sum(PR.map(p=>p.stats.revenue30)),S=D.siteDaily,SR30=sum(S.map(x=>x.revenue));
const orders=()=>Math.round(O30*k()),revenue=()=>Math.round(R30*k()*bf()),aov=()=>revenue()/Math.max(1,orders());
const CH=["Website","WhatsApp","Phone","Instagram","Deliveroo","Uber Eats","Walk-in"];
const CHW={Website:1,WhatsApp:1.7,Phone:1.1,Instagram:.8,Deliveroo:1.5,"Uber Eats":1.2,"Walk-in":.6};
const chanShare=()=>{const w=CH.map(c=>D.orders.filter(o=>o.chan===c).length*CHW[c]);const t=sum(w);return CH.map((c,i)=>{const os=D.orders.filter(o=>o.chan===c);return{c,share:w[i]/t,aov:os.length?avg(os.map(o=>o.total)):0}})};
const HW=[.02,.04,.07,.09,.1,.11,.1,.09,.08,.08,.07,.06,.05,.03,.01];
function series(key,fn){const g=x=>fn?fn(x):x[key];const d=days();
 if(d===1){const t=S[29];return{v:HW.map(w=>Math.round(g(t)*w)),l:HW.map((_,i)=>(8+i)+":00")}}
 if(d<=30){const a=S.slice(30-d);return{v:a.map(g),l:a.map(x=>A.fmtDate(x.date))}}
 if(d===91)return{v:Array.from({length:13},(_,i)=>sum(S.slice((i*5)%23,(i*5)%23+7).map(g))),l:Array.from({length:13},(_,i)=>"W"+(31+i))};
 return{v:Array.from({length:12},(_,i)=>Math.round(sum(S.map(g))*(.7+((i*7)%6)/10))),l:["Nov","Dec","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct"]}}
const scale=(sv,f)=>({v:sv.v.map(x=>Math.round(x*f)),l:sv.l});
const siteSum=key=>{const d=days();if(d<=30)return sum(S.slice(30-d).map(x=>x[key]));return Math.round(sum(S.map(x=>x[key]))*k())};
const siteAvg=key=>{const d=days();return avg(S.slice(30-Math.min(30,d)).map(x=>x[key]))};
/* ---- building blocks ---- */
const delta=(key,inv)=>{if(!st.cmp)return"";const v=dv(key);const up=inv?v<0:v>=0;return`<span class="delta ${up?"up":"down"}">${v>=0?"+":""}${pct(v*100)} vs previous ${PL[st.period]}</span>`};
const kpi=(lbl,val,key,go,inv,sub)=>`<div class="kpi-card" onclick="${go||"A8.tab('health')"}"><span class="caps">${lbl}</span><span class="kpi">${val}</span>${delta(key||lbl,inv)}${sub?`<span class="xs muted">${sub}</span>`:""}</div>`;
function line(sv,o={}){const v=sv.v,l=sv.l,W=600,H=140,p=6;const mx=Math.max(...v,1);const X=i=>p+i*(W-2*p)/Math.max(1,v.length-1),Y=x=>H-p-(x/mx)*(H-2*p-10);const pts=v.map((x,i)=>X(i)+","+Y(x)).join(" ");const pv=st.cmp&&o.key?v.map((x,i)=>X(i)+","+Y(x*(1-dv(o.key))*(.88+((i*3)%5)/20))).join(" "):"";
 return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${[.33,.66].map(g=>`<line x1="${p}" x2="${W-p}" y1="${Y(mx*g)}" y2="${Y(mx*g)}" stroke="var(--hair)" vector-effect="non-scaling-stroke"/>`).join("")}<polygon points="${X(0)},${H-p} ${pts} ${X(v.length-1)},${H-p}" fill="var(--silver)"/>${pv?`<polyline points="${pv}" fill="none" stroke="var(--grey)" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>`:""}<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><div class="ax"><span>${E(l[0])}</span><span>${E(l[Math.floor(l.length/2)])}</span><span>${E(l[l.length-1])}</span></div>${o.leg!==false?`<div class="leg"><span><i></i>${o.lbl||"This period"}</span>${pv?`<span><i class="--prev"></i>Previous ${PL[st.period]}</span>`:""}</div>`:""}</div>`}
function bars(sv,o={}){const mx=Math.max(...sv.v,1);return`<div class="chart"><div class="bar" style="height:${o.h||80}px">${sv.v.map((x,i)=>`<i class="${o.on&&o.on(i,x)?"on":""}${o.accent&&o.accent(i,x)?" --accent":""}" style="height:${Math.max(2,x/mx*100)}%" title="${E(sv.l[i])} · ${o.fmt?o.fmt(x):n(x)}" onclick="${o.go?o.go(i):`App.toast('${E(sv.l[i])} · ${o.fmt?o.fmt(x):n(x)}')`}"></i>`).join("")}</div><div class="ax"><span>${E(sv.l[0])}</span><span>${E(sv.l[sv.l.length-1])}</span></div></div>`}
const hrows=(rows,fv)=>{const mx=Math.max(...rows.map(r=>r[1]),1);return rows.map(r=>`<div class="hrow ${r[2]?"--go":""}" ${r[2]?`onclick="${r[2]}"`:""}><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${E(r[0])}</span><div class="progress ${r[3]||""}"><i style="width:${r[1]/mx*100}%"></i></div><span class="tnum" style="text-align:right">${fv?fv(r[1]):n(r[1])}</span></div>`).join("")};
const funnel=steps=>{const mx=steps[0][1]||1;return`<div class="fun">${steps.map((s,i)=>`<div class="st" ${s[2]?`style="cursor:pointer" onclick="${s[2]}"`:""}><span>${E(s[0])}</span><div class="progress"><i style="width:${s[1]/mx*100}%"></i></div><span class="tnum" style="text-align:right">${n(s[1])}</span><span class="muted tnum xs" style="text-align:right">${i?pct(s[1]/Math.max(1,steps[i-1][1])*100,0):"100%"}</span></div>`).join("")}</div>`};
const spark=a=>{const mx=Math.max(...a,1);return`<span class="spark">${a.map((x,i)=>`<i class="${i===a.length-1?"on":""}" style="height:${Math.max(8,x/mx*100)}%"></i>`).join("")}</span>`};
function tbl(id,cols,rows,o={}){const s=st.sort[id];if(s)rows=rows.slice().sort((a,b)=>{const x=a[s.k],y=b[s.k];const r=typeof x==="number"?x-y:String(x??"").localeCompare(String(y??""));return s.d?-r:r});
 return`<div class="tbl-wrap ${o.flush?"--flush":""}" ${o.h?`style="max-height:${o.h}px"`:""}><table class="tbl"><thead><tr>${cols.map(c=>`<th class="${c.k?"sort":""} ${c.num?"num":""}" ${c.k?`onclick="A8.sort('${id}','${c.k}')"`:""}>${c.t}${s&&s.k===c.k?(s.d?" ↓":" ↑"):""}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr class="r ${r._cls||""}" ${r._go?`onclick="${r._go}"`:""}>${cols.map(c=>`<td class="${c.num?"num":""} ${c.wrap?"wrap":""}">${c.f?c.f(r):E(r[c.k])}</td>`).join("")}</tr>`).join("")}</tbody>${o.foot?`<tfoot><tr><td colspan="${cols.length}">${o.foot}</td></tr></tfoot>`:""}</table></div>`}
const sec=(t,right)=>`<div class="sec-head"><div class="h3">${t}</div>${right||""}</div>`;
const card=(t,body,right)=>`<div class="card">${t?`<div class="row mb8"><span class="caps" style="margin:0;flex:1">${t}</span>${right||""}</div>`:""}${body}</div>`;
const segc=(items,cur,fn)=>`<div class="seg-ctl">${items.map(x=>`<button class="${cur===x[0]?"on":""}" onclick="${fn}('${x[0]}')">${x[1]}</button>`).join("")}</div>`;
const chips=(items,cur,fn)=>`<div class="chips">${items.map(x=>`<button class="chip ${cur===x?"on":""}" onclick="${fn}('${E(x)}')">${E(x)}</button>`).join("")}</div>`;
const note=t=>`<div class="note-box mt16">${I("info")} ${t}</div>`;
/* ================= 1. OVERVIEW ================= */
function overview(){const o=orders(),r=revenue();const rev=scale(series("revenue"),R30/SR30*bf());const ord=scale(series("orders"),O30/sum(S.map(x=>x.orders)));
 const conv=siteSum("orders")/Math.max(1,siteSum("sessions"))*100;
 const changes=[["Revenue","sales",dv("Revenue"),"Google Ads · Brand and WhatsApp broadcast carry the growth"],["Orders","sales",dv("Orders"),"Weekend slots 12–16 fill first"],["Average order","sales",dv("Average order"),"Deluxe share up; Grand flat"],["Site conversion","site",dv("Site conversion"),"Checkout errors on postcode fell after the fix"],["Repeat customers","customers",dv("Repeat customers"),"Birthday reminders sent 5 days before"],["On-time delivery","delivery",dv("On-time delivery"),"Two late 08–10 runs on Thursday"],["Gross margin","finance",dv("Gross margin"),"RFH prices up on Thursday roses"],["Marketplace rating","marketplaces",dv("Marketplace rating"),"Deliveroo 4.7 · Uber Eats 4.5"]].sort((a,b)=>Math.abs(b[2])-Math.abs(a[2]));
 return`<div class="grid g4">${kpi("Revenue",F(r),"Revenue","A8.tab('sales')")}${kpi("Orders",n(o),"Orders","A8.tab('sales')")}${kpi("Average order",F(Math.round(aov())),"Average order","A8.tab('sales')")}${kpi("Gross margin",pct(58.4),"Gross margin","A8.tab('finance')")}${kpi("Site conversion",pct(conv,2),"Site conversion","A8.tab('site')")}${kpi("Repeat customers",pct(11.2),"Repeat customers","A8.tab('customers')")}${kpi("On-time delivery",pct(94.1),"On-time delivery","A8.tab('delivery')")}${kpi("Open problems",n(D.orders.filter(x=>x.problem).length+D.orders.filter(x=>A.isLate(x)&&x.status!=="delivered").length),"Open problems","App.go('today')",true,"late + delivery issues · live")}</div>
 <div class="grid g2 mt24"><div>${sec("Revenue")}${line(rev,{key:"Revenue",lbl:"Revenue · "+(st.basis==="paid"?"paid, order date":"confirmed, delivery date")})}</div><div>${sec("Orders")}${bars(ord,{go:i=>`A8.tab('sales')`})}</div></div>
 ${sec("What changed",`<button class="textbtn" onclick="A8.schedule()">weekly digest</button>`)}<div class="list" style="border:1px solid var(--hair)">${changes.map(c=>`<div class="li" onclick="A8.tab('${c[1]}')"><span class="dot ${c[2]>=0?"--ok":"--accent"}"></span><div class="t"><b>${c[0]} ${c[2]>=0?"+":""}${pct(c[2]*100)}</b><small>${c[3]}</small></div>${I("chev")}</div>`).join("")}</div>`}
/* ================= 2. SALES ================= */
function sales(){const o=orders(),r=revenue();const by=st.salesBy;let ch="";
 if(by==="day")ch=bars(scale(series("orders"),O30/sum(S.map(x=>x.orders))),{on:(i,x)=>false});
 else if(by==="week"){const w=["W40","W41","W42","W43"].map((l,i)=>[l,Math.round(o/4*(.85+(hash(l)%30)/100))]);ch=bars({v:w.map(x=>x[1]),l:w.map(x=>x[0])})}
 else if(by==="slot"){const v=A.SLOTS.map(s=>D.orders.filter(x=>x.n===0&&x.slot===s).length);const t=sum(v);ch=bars({v:v.map(x=>Math.round(o*x/t)),l:A.SLOTS},{go:i=>`App.go('orders',{slot:'${A.SLOTS[i]}'})`})}
 else{const wd=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];ch=bars({v:wd.map(d=>Math.round(o/7*(.7+(hash(d)%60)/100))),l:wd},{on:i=>i>=4})}
 const sizes=["Standard","Deluxe","Grand"].map(s=>[s,D.orders.filter(x=>x.size===s).length]);const col=D.orders.filter(x=>x.type==="collection").length;
 const att=D.orders.filter(x=>x.addons.length).length/D.orders.length*100;
 const canc=[["Customer changed mind",9,0],["Address not found · returned",4,1],["Quality complaint · replaced",3,1],["Duplicate order",2,0],["Marketplace rejected · out of stock",5,0]].map(x=>[x[0],Math.round(x[1]*k()),x[2]]);
 const hm=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
 return`<div class="grid g4">${kpi("Revenue",F(r),"Revenue","A8.go('orders')")}${kpi("Orders",n(o),"Orders","A8.go('orders')")}${kpi("Average order",F(Math.round(aov())),"Average order","A8.salesBy('day')")}${kpi("Add-on attach rate",pct(att),"attach","A8.tab('products')")}${kpi("Collection share",pct(col/D.orders.length*100),"collection","App.go('orders',{view:'today'})")}${kpi("Cancelled",n(sum(canc.map(c=>c[1]))),"Cancelled","App.go('orders',{view:'problems'})",true)}${kpi("Refunded",F(Math.round(sum(canc.filter(c=>c[2]).map(c=>c[1]))*aov()*.9)),"Refunded","App.go('orders',{view:'problems'})",true)}${kpi("£0 orders",n(Math.round(o*.012)),"zero","App.go('orders',{view:'unpaid'})",true,"gift cards, replacements")}</div>
 ${sec("Orders by",segc([["day","Day"],["week","Week"],["slot","Slot"],["weekday","Weekday"]],by,"A8.salesBy"))}${ch}
 <div class="grid g3 mt24"><div>${sec("Sizes")}${hrows(sizes.map(s=>[s[0],Math.round(o*s[1]/D.orders.length),`A8.tab('products')`]))}<div class="xs muted mt8">Deluxe = ×1.3, Grand = ×1.7 of Standard price</div></div><div>${sec("Delivery vs collection")}${hrows([["Delivery",o-Math.round(o*col/D.orders.length)],["Collection · Willow Walk",Math.round(o*col/D.orders.length)]])}<div class="xs muted mt8">Delivery fee taken ${F(Math.round(o*.8*12))} · ${pct(80,0)} of delivered orders pay £12</div></div><div>${sec("Add-ons")}${hrows(AD.map(a=>[a.name.split(" ·")[0],Math.round(a.stats.orders30*k()),`App.go('catalog',{open:${a.id}})`]).sort((a,b)=>b[1]-a[1]))}</div></div>
 <div class="grid g2 mt24"><div>${sec("Order pipeline")}${funnel([["Placed",o,"App.go('orders')"],["Confirmed · paid",Math.round(o*.96),"App.go('orders',{view:'unpaid'})"],["In production",Math.round(o*.94),"App.go('production')"],["Fulfilled",Math.round(o*.92),"App.go('orders')"]])}<div class="xs muted mt8">Drop between steps = unpaid links that expired, cancellations and marketplace rejections.</div></div><div>${sec("Cancellations & refunds")}${tbl("canc",[{t:"Reason",k:"r"},{t:"Orders",k:"c",num:true},{t:"Refund",k:"f",num:true,f:x=>x.f?F(Math.round(x.c*aov()*.9)):"–"}],canc.map(c=>({r:c[0],c:c[1],f:c[2],_go:"App.go('orders',{view:'problems'})"})))}</div></div>
 ${sec("Peaks · weekday × slot",`<span class="xs muted">by delivery slot</span>`)}<div class="hm"><span></span>${hm.map(d=>`<span style="text-align:center">${d}</span>`).join("")}${A.SLOTS.map((s,si)=>`<span>${s.split("–")[0]}</span>${hm.map((d,di)=>{const v=(.15+((hash(d+s)%70)/100)*(si>1&&si<5?1:.6)*(di>=4?1.1:.9));return`<i style="opacity:${Math.min(1,v).toFixed(2)}" title="${d} ${s} · ${Math.round(v*14)} orders" onclick="App.go('orders',{slot:'${s}'})"></i>`}).join("")}`).join("")}</div>`}
/* ================= 3. CHANNELS & UTM ================= */

 const tr=D.tracking.map(t=>{const cpc=t.source==="google"?.62:t.source==="instagram"&&t.medium!=="bio"?.38:t.source==="tiktok"?.21:0;const cost=Math.round(t.clicks*cpc);return Object.assign({},t,{cr:t.orders/Math.max(1,t.visits)*100,cost,cpo:cost?Math.round(cost/Math.max(1,t.orders)):null,_go:`A8.utm(${t.id})`,_cls:st.utm===t.id?"on":""})});

 ${sec("Orders by day",`<div class="leg" style="margin:0"><span><i></i>Deliveroo + Uber Eats</span></div>`)}${bars(sv,{on:(i,x)=>x>=12})}
 ${sec("By platform")}${tbl("mk",[{t:"Platform",k:"n",f:x=>A.chanTag(x.n)},{t:"Orders",k:"o",num:true},{t:"Payout",k:"r",num:true,f:x=>F(x.r)},{t:"Gross",num:true,f:x=>F(Math.round(x.r/(1-com)))},{t:"Commission",num:true,f:x=>F(Math.round(x.r/(1-com)*com))},{t:"Avg order",k:"aov",num:true,f:x=>F(Math.round(x.aov))},{t:"On time",k:"ot",num:true,f:x=>`<span class="${x.ot<90?"accent":""}">${pct(x.ot,0)}</span>`},{t:"Rejected",k:"rej",num:true,f:x=>x.rej?`<span class="accent">${x.rej}</span>`:"0"},{t:"Rating",k:"rt",num:true,f:x=>n(x.rt,1)+" ★"},{t:"Net / order",num:true,f:x=>`<span class="${netPer(x)<8?"warn":"ok"}">${F(Math.round(netPer(x)))}</span>`}],rows,{foot:"Payout = what the platform transfers · commission is charged on the list price before discounts · marketplace orders are a separate stream (channel), not website orders"})}
 <div class="grid g2 mt24"><div>${sec("Menu margin · red & amber",`<button class="textbtn" onclick="App.go('catalog')">menu</button>`)}<div class="list" style="border:1px solid var(--hair)">${PR.filter(p=>p.price<=120).slice(0,5).map(p=>{const mp=p.price*1.25;const m=(mp*(1-com)-p.price*(1-p.stats.margin/100)-1.8)/mp*100;return`<div class="li" onclick="App.go('catalog',{open:${p.id}})"><span class="dot ${m<15?"--accent":m<25?"--warn":"--ok"}"></span><div class="t"><b>${E(p.name)}</b><small>menu ${F(mp)} · site ${F(p.price)} · net margin ${pct(m,0)}</small></div></div>`}).join("")}</div></div><div>${sec("Service")}${hrows([["Accepted within 2 min",91],["Ready by pickup time",87],["Courier waited > 5 min",14],["Paused · out of hours",3]].map(x=>[x[0],x[1],"App.toast('"+x[0]+"')",x[1]<90&&x[1]>50?"--warn":""]),v=>pct(v,0))}<div class="xs muted mt8">SLA alerts this period: ${n(Math.round(6*k()))} · auto-pause triggered ${n(Math.round(2*k()))}×</div></div></div>`}
/* ================= 14. DATA HEALTH ================= */
function health(){const o=orders();const items=[["Attribution coverage",97.4,99,"orders with a known source","App.go('orders',{view:'all',source:'none'})"],["Orders with a channel",99.6,100,"channel set on every order","App.go('orders')"],["Customers with email",38,60,"needed for receipts & reviews","App.go('customers',{view:'noemail'})"],["Customers with address",61,80,"needed for delivery analytics","App.go('customers')"],["Products with a recipe",93,100,"needed for COGS & margin","App.go('catalog')"],["Deliveries with proof",88,95,"photo or signature","App.go('delivery')"]];

 return`<div class="grid g4">${kpi("Attribution",pct(97.4),"coverage","App.go('orders',{view:'all',source:'none'})",false,"goal 99 %")}${kpi("Orders without source",n(Math.round(o*.026)),"nosrc","App.go('orders',{view:'all',source:'none'})",true)}${kpi("Customers without email",n(Math.round(CU.length*.62)),"noemail","App.go('customers',{view:'noemail'})",true)}${kpi("Revenue definition","1 of 2","def","A8.basisInfo()",false,st.basis==="paid"?"paid · order date":"confirmed · delivery date")}</div>
 <div class="grid g2 mt24"><div>${sec("Coverage vs goal")}${items.map(x=>`<div class="hrow --go" onclick="${x[4]}" style="grid-template-columns:150px minmax(0,1fr) 110px"><span>${E(x[0])}</span><div class="progress ${x[1]>=x[2]?"--ok":x[1]<x[2]*.7?"--accent":"--warn"}"><i style="width:${x[1]}%"></i></div><span class="tnum xs" style="text-align:right">${pct(x[1],x[1]%1?1:0)} <span class="muted">/ ${x[2]} %</span></span></div><div class="xs muted" style="margin:-4px 0 8px">${E(x[3])}</div>`).join("")}</div><div>${sec("Data freshness")}<div class="list" style="border:1px solid var(--hair)">${fresh.map(f=>`<div class="li" onclick="App.toast('${E(f[0])} · sync requested')"><span class="dot ${f[2]}"></span><div class="t"><b>${E(f[0])}</b><small>${E(f[1])}</small></div><button class="textbtn">sync</button></div>`).join("")}</div></div></div>
 ${sec("One revenue, one day")}<div class="card"><div class="sm">Every number on these screens uses the switch in the header: <b>${st.basis==="paid"?"Paid · order date":"Confirmed · delivery date"}</b>. The old CRM had five definitions (CEO, bonus, finance, site funnel, dashboard) and they disagreed by up to 4 %. Marketplace revenue = platform payout; VAT shown separately in Finance.</div><div class="btn-row mt16"><button class="btn --ghost --sm" onclick="A8.basisInfo()">${I("info")} Definitions</button><button class="btn --ghost --sm" onclick="App.toast('Reconciliation report · CRM vs storefront vs Stripe · sent to Telegram 07:20')">Run reconciliation</button></div></div>`}

const R={overview,sales,channels,products,site,customers,production,delivery,comms,team,stock,finance,marketplaces,health};
function head(){$("#a8-head").innerHTML=`<div class="seg-ctl">${Object.keys(PER).map(p=>`<button class="${st.period===p?"on":""}" onclick="A8.per('${p}')">${p==="custom"?I("calendar")+(st.period==="custom"?E(st.custom[0]+" – "+st.custom[1]):"Custom"):PL[p].replace(" d"," d").replace("today","Today").replace("quarter","Quarter").replace("year","Year")}</button>`).join("")}</div><label class="check sm"><input type="checkbox" ${st.cmp?"checked":""} onchange="A8.cmp(this.checked)"> Compare</label><div class="seg-ctl"><button class="${st.basis==="paid"?"on":""}" onclick="A8.basis('paid')">Paid · ordered</button><button class="${st.basis==="fulfil"?"on":""}" onclick="A8.basis('fulfil')">Confirmed · delivered</button><button class="ic" title="What does this change?" onclick="A8.basisInfo()">${I("info")}</button></div><span class="sp"></span><button class="btn --ghost --sm" onclick="A8.export()">${I("download")} Export CSV</button><button class="btn --sm" onclick="A8.schedule()">${I("calendar")} Schedule report</button>`}
function nav(){$("#a8-nav").innerHTML=TABS.map(t=>t.length===1?`<div class="grp">${t[0]}</div>`:`<button class="${st.tab===t[0]?"on":""}" onclick="A8.tab('${t[0]}')">${I(t[2])}<span>${t[1]}</span></button>`).join("")}
function body(){const fn=R[st.tab]||overview;$("#a8-body").innerHTML=fn();const b=$("#s-analytics .scr-body");if(b)b.scrollTop=0;const t=TABS.find(x=>x[0]===st.tab);$("#tb-title").innerHTML="Analytics"+(t?`<small>${E(t[1])} · ${PL[st.period]}</small>`:"")}
function mount(p){p=p||{};if(p.tab&&R[p.tab])st.tab=p.tab;if(p.period&&PER[p.period])st.period=p.period;head();nav();body();
 A.registerCommands([{g:"Analytics",t:"Analytics · UTM links",ic:"link",fn:()=>A.go("analytics",{tab:"channels"})},{g:"Analytics",t:"Analytics · products",ic:"catalog",fn:()=>A.go("analytics",{tab:"products"})},{g:"Analytics",t:"Analytics · site & blog",ic:"globe",fn:()=>A.go("analytics",{tab:"site"})},{g:"Analytics",t:"Analytics · finance P&L",ic:"pound",fn:()=>A.go("analytics",{tab:"finance"})},{g:"Analytics",t:"Schedule a report",ic:"calendar",fn:()=>{A.go("analytics",{tab:"overview"});A8.schedule()}}])}
window.A8={
 tab:t=>{st.tab=t;nav();body()},
 per:p=>{if(p==="custom"){A8.custom();return}st.period=p;head();body();A.toast("Period · "+PL[p])},

 custom:()=>A.modal({title:"Custom period",body:`<div class="grid g2"><div class="field"><label>From</label><input class="input" id="a8-from" value="1 Oct 2026"></div><div class="field"><label>To</label><input class="input" id="a8-to" value="14 Oct 2026"></div></div><div class="chips mt16">${[["Last month","1 Sep – 30 Sep"],["Valentine's week","10 Feb – 16 Feb"],["Mother's Day week","2 Mar – 8 Mar"],["Christmas 2025","15 Dec – 24 Dec"]].map(x=>`<button class="chip" onclick="document.getElementById('a8-from').value='${x[1].split(" – ")[0]}';document.getElementById('a8-to').value='${x[1].split(" – ")[1]}'">${x[0]}</button>`).join("")}</div><div class="xs muted mt8">Up to 366 days · compared with the same length before</div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="A8.applyCustom()">Apply</button>`}),
 applyCustom:()=>{st.custom=[$("#a8-from").value.replace(" 2026",""),$("#a8-to").value.replace(" 2026","")];st.period="custom";A.closeModal();head();body();A.toast("Period · "+st.custom.join(" – "))},
 basisInfo:()=>A.modal({title:"One definition of revenue",body:`<p class="sm">The switch in the header applies to every tab, export and scheduled report.</p><dl class="kv"><dt>Paid · order date</dt><dd>Orders with <b>payment received</b>, counted on the day they were placed. Cash view: bonuses, pace alerts, site funnel.</dd><dt>Confirmed · delivery date</dt><dd>Orders that are <b>not cancelled or incomplete</b>, counted on the delivery day. Operations view: production, delivery, seasonality.</dd><dt>Marketplaces</dt><dd>Revenue = platform payout; commission shown as a cost in Finance.</dd><dt>VAT</dt><dd>Headline figures are gross; Finance shows net and VAT separately.</dd></dl><div class="note-box mt16">Replaces five definitions in the classic CRM (CEO, Bonus, Finance, Website funnel, Dashboard) that differed by up to 4 %.</div>`}),
 newLink:()=>A.modal({title:"New tracking link",body:`<div class="col" style="gap:12px"><div class="field"><label>Name</label><input class="input" id="a8-ln" placeholder="Instagram stories · Christmas wreaths"></div><div class="grid g3"><div class="field"><label>Source</label><select class="select" id="a8-ls"><option>instagram</option><option>google</option><option>whatsapp</option><option>email</option><option>tiktok</option><option>partner</option><option>qr</option></select></div><div class="field"><label>Medium</label><select class="select" id="a8-lm"><option>story</option><option>bio</option><option>cpc</option><option>broadcast</option><option>newsletter</option><option>print</option></select></div><div class="field"><label>Campaign</label><input class="input" id="a8-lc" placeholder="xmas-wreaths"></div></div><div class="field"><label>Lands on</label><input class="input" value="floritta.uk/christmas-wreaths"></div><div class="note-box">Short link <code>floritta.uk/r/&lt;code&gt;</code> · each click is stored with time, device and referrer</div></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="A8.addLink()">Create & copy</button>`}),

 schedule:()=>A.modal({title:"Schedule report",body:`<div class="col" style="gap:12px"><div class="grid g2"><div class="field"><label>Every</label><select class="select" id="a8-sf"><option>Week · Monday 07:45</option><option>Day · 08:00</option><option>Month · 1st 08:00</option></select></div><div class="field"><label>Send to</label><select class="select" id="a8-st"><option>Telegram · Floritta Team</option><option>Email · tatiana@floritta.uk</option><option>Email · managers</option></select></div></div><div class="field"><label>Sections</label><div class="chips">${TABS.filter(t=>t.length>1).map((t,i)=>`<button class="chip ${i<6?"on":""}" onclick="this.classList.toggle('on')">${t[1]}</button>`).join("")}</div></div><div class="field"><label>Format</label><div class="seg-ctl"><button class="on">Summary + CSV</button><button onclick="App.toast('PDF (not in this prototype yet)')">PDF</button></div></div><div class="note-box">Uses the period and revenue definition selected now: <b>${PL[st.period]}</b>, <b>${st.basis==="paid"?"paid · order date":"confirmed · delivery date"}</b>${st.cmp?", with comparison":""}.</div></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm" onclick="A8.saveSchedule()">Schedule</button>`}),
 saveSchedule:()=>{const f=$("#a8-sf").value,t=$("#a8-st").value;A.closeModal();A.toast("Report scheduled · "+f.split(" ·")[0].toLowerCase()+" · "+t.split(" · ")[0]);A.push("Report scheduled",f+" → "+t,{icon:"calendar",type:"info"})}
};
window.mount_analytics=mount;
document.addEventListener("orders",()=>{if(A.state.current==="analytics")body()});
