<script>
(()=>{
const A=App,E=s=>A.esc(s),I=n=>A.icon(n),$=A.$,$$=A.$$,fmt=A.fmt;
const st={flash:null,period:"30d",plStatus:"pending",plQ:"",plPage:1,gcOff:false,poStatus:"open",poCat:"",poMonth:"",poOpen:null,poForm:false,alFrom:"2026-09-20",alTo:"2026-10-20",alEmpty:false,dcWindow:true,dcBusy:false,limited:()=>window.TH&&TH.st.limited&&A.role()==="florist"};
function flash(t,x){st.flash={t,x}}
const flashHtml=()=>st.flash?`<div class="flash --${st.flash.t}">${I(st.flash.t==="err"?"alert":"info")}<span>${E(st.flash.x)}</span><span class="x" onclick="FN.clearFlash()">${I("close")}</span></div>`:"";
const ORD=A.data.orders,cust=A.customer,prod=A.product;
const oc=o=>"#"+o.id;

/* ---------- FinanceNav ---------- */
const FNAV=[["finance","P&L & margins"],["finance-cashflow","Cash flow"],["finance-payment-links","Payment links"],["finance-gift-cards","Gift cards"],["finance-refunds","Refunds to make"],["finance-problems","Problem orders"],["finance-alcohol","Alcohol log"],["finance-refund-checks","Refund checks"]];
function paintNav(cur){$$(".fn-nav").forEach(el=>{const n={"finance-refunds":REFUNDS.filter(r=>!r.done).length,"finance-problems":ISSUES.filter(i=>i.status==="open").length,"finance-refund-checks":RV.filter(r=>r.status==="pending").length};el.innerHTML=FNAV.map(f=>`<button class="${el.dataset.navFor===f[0]?"on":""}" onclick="App.go('${f[0]}')">${f[1]}${n[f[0]]?`<span class="n ${f[0]!=="finance-refund-checks"?"hot":""}">${n[f[0]]}</span>`:""}</button>`).join("")})}

/* ---------- DAY CLOSE ---------- */
const DC={flowers:false,shortage:true,packaging:false,photo:null,rubbish:null,rubbishPhoto:null,emailAt:null,photoEmailAt:null};
function mountDC(){
  if(st.limited()){$("#fn-dc-head").innerHTML=`<div class="h3">Closing the day</div>`;$("#fn-dc-body").innerHTML=`<div class="empty">${I("lock")}<div class="h3">Not available for seasonal and trainee florists</div><div class="sm">The closing checklist is done by the shift lead. The server refuses this page for limited roles too.</div></div>`;return}
  const complete=DC.flowers&&DC.shortage&&DC.packaging&&DC.photo;
  $("#fn-dc-head").innerHTML=`<div><div class="h3">Closing the day</div><div class="xs muted">Business day · Tue 20 Oct 2026 · Europe/London</div></div><span class="sp"></span><label class="check xs muted" title="Demo: config floritta.rubbish_check.windows – Thu 21:00–23:59, Fri 09:00–21:00"><input type="checkbox" ${st.dcWindow?"checked":""} onchange="FN.toggle('dcWindow')">Demo: rubbish window open</label>`;
  const chk=(k,lbl)=>`<label class="dc-check ${DC[k]?"done":""} ${st.dcBusy?"busy":""}"><input type="checkbox" ${DC[k]?"checked":""} onchange="FN.dcMark('${k}',this.checked)"><span>${lbl}</span>${DC[k]?`<span class="pill --done" style="margin-left:auto">saved</span>`:`<span class="xs muted" style="margin-left:auto">saves on tick</span>`}</label>`;
  $("#fn-dc-body").innerHTML=`${flashHtml()}<div style="max-width:720px">
   ${complete?`<div class="flash --ok">${I("check")}<span>Done – all three ticked and the photo is in. This counts as 4 of 4 for the premium fund.</span></div>`:`<div class="flash --info">${I("info")}<span>${[DC.flowers,DC.shortage,DC.packaging,!!DC.photo].filter(Boolean).length} of 4 done · the premium fund needs all four before midnight</span></div>`}
   ${st.dcWindow?`<div class="rub mb16"><div class="h4" style="color:inherit">Was the rubbish collected?</div><div class="xs" style="margin:4px 0 12px">Asked on Thursday from 21:00 and on Friday from 09:00 to 21:00 (from the config). The first «No» of the window emails the managing agents.</div><div class="btn-row"><button class="btn --sm ${DC.rubbish===true?"pick":"--ghost"}" ${st.dcBusy?"disabled":""} onclick="FN.rubbish(true)">Yes</button><button class="btn --sm ${DC.rubbish===false?"pick":"--ghost"}" ${st.dcBusy?"disabled":""} onclick="FN.rubbish(false)">No</button>${DC.emailAt?`<span class="xs">Email sent to the managing agents at ${DC.emailAt}${DC.photoEmailAt?" · photo sent at "+DC.photoEmailAt:""}</span>`:""}</div>
     ${DC.rubbish===false?`<div class="mt16"><div class="caps" style="color:inherit">Photo of the rubbish</div><div class="photo-box mt8" style="border-color:var(--warn)"><div class="thumb --l">${DC.rubbishPhoto?`<img src="${DC.rubbishPhoto}">`:""}</div><div class="col" style="flex:1"><div class="btn-row"><button class="btn --ghost --sm" onclick="FN.pickFile('rubbish')">${I("photo")} Choose / take photo</button><button class="btn --sm" ${st.dcBusy?"disabled":""} onclick="FN.upload('rubbish')">${I("upload")} Upload photo</button></div><div class="ferr" id="dc-e-rubbish"></div><span class="xs">Camera opens on the phone. The photo goes to the agents once, as a second email.</span></div></div></div>`:""}</div>`:""}
   <div class="sec-head"><div class="h3">Checklist</div><span class="xs muted">one record per business day · same as the app</span></div>
   ${chk("flowers","Flowers for tomorrow processed")}${chk("shortage","No shortage on tomorrow's orders")}${chk("packaging","Packaging prepped")}
   <div class="sec-head"><div class="h3">Photo</div><span class="xs muted">last photo of the day · shop floor at close</span></div>
   <div class="photo-box"><div class="photo --4x5" style="width:96px;flex:none">${DC.photo?`<img src="${DC.photo}">`:""}</div><div class="col" style="flex:1"><div class="btn-row"><button class="btn --ghost --sm" onclick="FN.pickFile('photo')">${I("photo")} Choose / take photo</button><button class="btn --sm" ${st.dcBusy?"disabled":""} onclick="FN.upload('photo')">${I("upload")} Upload photo</button></div><div class="ferr" id="dc-e-photo"></div><span class="xs muted">Up to 16 MB · JPEG / HEIC · stored with the order photos</span></div></div></div>`}
let picked={};
function dcMark(k,v){st.dcBusy=true;mountDC();setTimeout(()=>{DC[k]=v;st.dcBusy=false;mountDC();A.toast("Closing checklist updated.")},350)}
function rubbish(v){if(!st.dcWindow){flash("err","Outside the rubbish window – the answer was not saved (422).");mountDC();return}st.dcBusy=true;mountDC();setTimeout(()=>{const first=DC.rubbish===null;DC.rubbish=v;if(v===false&&!DC.emailAt){DC.emailAt="21:48";A.push("Rubbish not collected","Email sent to the managing agents · 21:48",{icon:"mail"})}st.dcBusy=false;mountDC();A.toast(v?"Thanks – rubbish collected.":DC.emailAt?"Noted · managing agents emailed":"Closing checklist updated.")},350)}
function pickFile(k){const opts=k==="rubbish"?["img/addon-vase.webp","img/hero-basket.webp"]:["img/hero-white.webp","img/pink-garden.webp","img/belgravia.webp"];A.modal({title:k==="rubbish"?"Photo of the rubbish":"Photo of the shop at close",body:`<div class="sm mb16">Demo file picker – on the phone the camera opens (capture=environment).</div><div class="row" style="gap:10px">${opts.map(o=>`<div class="thumb --l" style="cursor:pointer" onclick="FN.picked('${k}','${o}')"><img src="${o}"></div>`).join("")}<div class="thumb --l" style="cursor:pointer;display:grid;place-items:center;font-size:10px;text-align:center" onclick="FN.picked('${k}','big')">22 MB file</div></div>`})}
function pickedFn(k,f){picked[k]=f;A.closeModal();A.toast(f==="big"?"Selected · 22 MB":"Selected – press Upload photo")}
function upload(k){const e=$("#dc-e-"+k);if(!e)return;e.textContent="";if(!picked[k]){e.textContent="Choose a photo first – nothing was uploaded";return}if(picked[k]==="big"){e.textContent="The photo is larger than 16 MB – take it again or compress";picked[k]=null;return}st.dcBusy=true;mountDC();setTimeout(()=>{if(k==="rubbish"){DC.rubbishPhoto=picked[k];if(DC.emailAt&&!DC.photoEmailAt)DC.photoEmailAt="21:52"}else DC.photo=picked[k];picked[k]=null;st.dcBusy=false;mountDC();A.toast("Closing checklist updated.")},500)}

/* ---------- P&L ---------- */
const PERIODS={"30d":"30 days",month:"This month",quarter:"This quarter"};
const MULT={"30d":1,month:0.66,quarter:3};
function mountPL(){paintNav("finance");const k=MULT[st.period];const rev=Math.round(38420*k),cogs=Math.round(rev*0.42),deliv=Math.round(2640*k),fees=Math.round(3110*k),exp=Math.round(14800*k),gp=rev-cogs,np=gp+deliv-fees-exp,ar=1265,stock=4820;
  $("#url").textContent="app.floritta.ai/finance?period="+st.period;
  $("#fn-pl-head").innerHTML=`<select class="select" style="width:160px" onchange="FN.period(this.value)">${Object.keys(PERIODS).map(p=>`<option value="${p}" ${st.period===p?"selected":""}>${PERIODS[p]}</option>`).join("")}</select><span class="pill --done" title="config floritta.xero_connected">Xero connected</span><span class="xs muted">last sync today 06:10</span><span class="sp"></span><button class="btn --ghost --sm" onclick="App.toast('CSV of expenses for the period · downloaded')">${I("download")} Export</button>`;
  const card=(lbl,v,cls,sub)=>`<div class="kpi-card ${cls||""}" style="cursor:default"><span class="caps">${lbl}</span><span class="kpi-s ${cls==="--neg"?"accent":cls==="--warn"?"warn":""}">${v}</span>${sub?`<span class="delta">${sub}</span>`:""}</div>`;
  const line=(l,v,cls)=>`<tr class="${cls||""}"><td class="${cls==="tot"?"":"sub"}">${l}</td><td class="num ${v<0?"accent":""}">${v<0?"–"+fmt(-v):fmt(v)}</td></tr>`;
  const top=A.data.products.filter(p=>!p.addon).sort((a,b)=>b.stats.revenue30-a.stats.revenue30).slice(0,8);const max=top[0].stats.revenue30;
  $("#fn-pl-body").innerHTML=`<div class="grid g6 mb16">${card("Revenue",fmt(rev),"","paid orders, excl. delivery")}${card("Gross margin",Math.round(gp/rev*100)+"%","",fmt(gp))}${card("Net profit",fmt(np),np<0?"--neg":"","after fees and expenses")}${card("Platform fees",fmt(fees),"","Deliveroo · Uber Eats · Stripe")}${card("Unpaid (AR)",fmt(ar),ar>0?"--warn":"","3 invoices")}${card("Stock value",fmt(stock),"","at cost")}</div>
   <div class="two"><div><div class="sec-head"><div class="h3">Profit &amp; Loss · ${PERIODS[st.period]}</div><span class="xs muted">COGS from stock write-offs, else 42 %</span></div><div class="tbl-wrap"><table class="tbl pnl"><tbody>${line("Revenue",rev)}${line("Cost of flowers / materials",-cogs)}${line("Gross profit",gp,"tot")}${line("Delivery income",deliv)}${line("Platform fees",-fees)}${line("Expenses (incl. recurring, pro rata)",-exp)}${line("Net profit",np,"tot")}</tbody></table></div><div class="xs muted mt8">Expenses come from Expense and RecurringExpense; there is no entry form in the CRM – they are added through Xero.</div></div>
   <div><div class="sec-head"><div class="h3">Margin by product</div><span class="xs muted">top 8 by sales</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Product</th><th class="num">Sales</th><th class="num">Margin</th><th style="width:40%"></th></tr></thead><tbody>${top.map(p=>`<tr class="r" onclick="App.go('catalog',{open:${p.id}})"><td>${E(p.name)}</td><td class="num">${fmt(p.stats.revenue30)}</td><td class="num">${p.stats.margin}%</td><td><div class="mbar"><div class="progress"><i style="width:${Math.round(p.stats.revenue30/max*100)}%"></i></div></div></td></tr>`).join("")}</tbody></table></div></div></div>`}
function period(p){st.period=p;mountPL()}

/* ---------- CASH FLOW ---------- */
const BUFFER=5000;
function mountCF(){paintNav("finance-cashflow");let bal=6420;const weeks=Array.from({length:8},(_,i)=>{const d=new Date(2026,9,19+7*i);const inn=[8900,9400,7200,8100,12800,9900,8600,8300][i],out=[9100,8700,9800,7600,16400,9200,8800,8100][i];const open=bal;bal=open+inn-out;return{d,inn,out,open,close:bal,vat:i===4}});

   <div class="sec-head"><div class="h3">Recently decided</div><span class="xs muted">last 30</span></div>${RV_DONE.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Order</th><th class="num">Amount</th><th>Decision</th><th>Comment</th><th>Decided by</th></tr></thead><tbody>${RV_DONE.map(d=>`<tr><td><button class="link" onclick="App.openOrder(${d.order})">${oc({id:d.order})}</button></td><td class="num">${fmt(d.amount)}${d.amount!==d.requested?`<span class="sub">of ${fmt(d.requested)} requested</span>`:""}</td><td>${A.pill(d.decision==="approve"?"done":"cancelled",d.decision==="approve"?"Approved":"Declined")}</td><td class="wrap">${E(d.comment)||"–"}</td><td>${E(A.user(d.by).n)}<span class="sub">${d.at}</span></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty"><div class="h3">Nothing is waiting on a decision.</div></div>`}`}
function rvCheck(id){const r=RV.find(x=>x.id===id);const v=parseFloat($("#rv-amt-"+id).value);const c=$("#rv-c-"+id).value.trim();const e=$("#rv-e-"+id);e.textContent="";let ok=true;if(isNaN(v)||v<1){e.textContent="At least £1";ok=false}else if(v>r.amount){e.textContent="Cannot exceed the requested "+fmt(r.amount);ok=false}$("#rv-ok-"+id).disabled=!ok;$("#rv-no-"+id).disabled=!c}
function rvDecide(id,d){const r=RV.find(x=>x.id===id);const v=parseFloat($("#rv-amt-"+id).value);const c=$("#rv-c-"+id).value.trim();if(d==="decline"&&!c){$("#rv-e-"+id).textContent="A comment is required when declining.";return}r.status=d;RV_DONE.unshift({order:r.order,amount:d==="approve"?v:r.amount,requested:r.amount,decision:d,by:A.me().id,at:"Tue 20 Oct",comment:c});flash("ok",d==="approve"?`Approved up to ${fmt(v)} · push «Refund approved» to ${A.user(r.by).n} – they refund with their PIN`:`Declined · push «Refund declined» to ${A.user(r.by).n}`);A.push(d==="approve"?"Refund approved":"Refund declined",oc({id:r.order})+" · "+fmt(d==="approve"?v:r.amount),{icon:"pound"});mountRV()}

const M={"day-close":mountDC,finance:mountPL,"finance-cashflow":mountCF,"finance-payment-links":mountPL2,"finance-gift-cards":mountGC,"finance-refunds":mountRF,"finance-problems":mountPO,"finance-alcohol":mountAL,"finance-refund-checks":mountRV};
Object.keys(M).forEach(k=>{window["mount_"+k.replace(/-/g,"_")]=p=>{if(st._last!==k)st.flash=null;st._last=k;M[k](p||{})}});
A.registerCommands([{g:"Go to",t:"Closing the day",ic:"moon",fn:()=>A.go("day-close")},{g:"Go to",t:"Finance · P&L",ic:"pound",fn:()=>A.go("finance")},{g:"Go to",t:"Finance · refunds to make",ic:"undo",fn:()=>A.go("finance-refunds")},{g:"Go to",t:"Finance · problem orders",ic:"alert",fn:()=>A.go("finance-problems")},{g:"Actions",t:"Add a complaint",ic:"alert",fn:()=>{A.go("finance-problems");if(!st.poForm)poForm()}}]);
