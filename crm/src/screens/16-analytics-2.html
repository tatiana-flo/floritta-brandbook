/* ===== 16-2 · Analytics reports 17–31 (demo data fictional) ===== */

/* ===== Calls ===== */
window.mount_an_calls=function(){
  const A=App,X=A16,$=A.$,ic=A.icon,D=X.D;const id="an-calls";
  X.st(id,{period:"30d"});
  X.head(id,{period:["today","7d","30d","month","prevMonth","quarter"],back:true,fresh:"Alert queue · calls:sync-alerts every 5 min"});
  X.url(id);if(!X.gate(id))return;
  const E=D.empty;const missed=E?0:Math.round(X.len(id)*1.3),night=Math.round(missed*0.3),back=Math.round(missed*0.78),waiting=E?0:3;
  let h=`<div class="grid g4">${X.kpi("Missed calls",missed,`night ${night} · daytime ${missed-night}`,missed?"--warn":"")}${X.kpi("Called back",missed?Math.round(back/missed*100)+"%":"–",`${back} of ${missed}`)}${X.kpi("Still waiting",waiting,`never returned: ${E?0:5}`,waiting?"--alert":"")}${X.kpi("Median time to call back",E?"–":"14 min",`measured ${back} of ${missed}`)}</div>`;
  h+=X.note(`${ic("info")} Only the CRM alert queue is counted (calls:sync-alerts). Call volume, recordings and the live panel live in Ringover. The Overview widget links here with «Full report» (owner only on the current page).`,"mt16");
  h+=X.sec("Missed by day");
  h+=X.daily(id,X.series(id,21).map(d=>({label:d.label,m:E?0:X.ri(d.i,61,0,4),b:E?0:X.ri(d.i,62,0,3)})),[{k:"m",l:"Missed"},{k:"b",l:"Called back"}]);
  $("#b-"+id).innerHTML=h;
};

/* ===== Comms / Managers ===== */
window.mount_an_comms=function(){
  const A=App,X=A16,$=A.$,esc=A.esc,ic=A.icon,fmt=A.fmt,D=X.D;const id="an-comms";
  X.st(id,{period:"30d"});
  X.head(id,{period:["today","7d","30d","month","prevMonth","quarter"],pnote:"current page: only via ?period= in the URL"});
  X.url(id);if(!X.gate(id))return;
  const E=D.empty;const mg=E?[]:[["valeria","Morning"],["kamila","Evening"],["eliza","All"],[null,"All"]].map(([u,sh],i)=>{const chats=X.ri(i,71,60,220);const sales=Math.round(chats*(0.25+X.hsh(i,72)*0.2));return {u,sh,chats,sales,missed:X.ri(i,73,0,9),um:X.ri(i,74,2,18),ux:X.ri(i,75,0,8)}});
  const T=k=>X.sum(mg,r=>r[k]);
  let h=`<div class="grid g6">${X.kpi("Chats handled",X.n(T("chats")))}${X.kpi("Sales via chat",X.n(T("sales")))}${X.kpi("Missed chats",T("missed"),"",T("missed")?"--warn":"")}${X.kpi("Upsells made",T("um"))}${X.kpi("Upsells missed",T("ux"))}${X.kpi("Conversion rate",T("chats")?Math.round(T("sales")/T("chats")*100)+"%":"–")}</div>`;
  h+=X.sec("By manager and shift");
  h+=X.tbl([{l:"Manager",r:r=>r.u?`${A.avatar(r.u,"--s")} ${esc(A.user(r.u).n)}`:'<span class="muted">Unassigned</span>'},{l:"Shift",k:"sh"},{l:"Chats",num:true,k:"chats"},{l:"Sales",num:true,k:"sales"},{l:"Missed",num:true,k:"missed",cls:r=>r.missed>5?"neg":""},{l:"Upsells made",num:true,k:"um"},{l:"Upsells missed",num:true,k:"ux"}],mg,{empty:"No comms data yet"});
  h+=X.note(`${ic("info")} A sale or a loss is decided by the order linked to the chat; a chat is marked green by hand only when an upsell was made. Shift window is «All» until shift matching ships.`,"mt16");
  $("#b-"+id).innerHTML=h;
};

/* ===== Funnel ===== */
window.mount_an_funnel=function(){
  const A=App,X=A16,$=A.$,ic=A.icon,fmt=A.fmt,D=X.D;const id="an-funnel";
  X.st(id,{period:"all"});
  X.head(id,{period:["today","7d","14d","30d","90d","180d","year","all"],demo:[["incomplete","Counters out of order"]]});
  X.url(id);if(!X.gate(id))return;
  const E=D.empty;const N=X.len(id);const sd=A.data.siteDaily;const k=N>=30?N/30:N/30;
  const pv=E?0:Math.round(X.sum(sd,d=>d.pageviews)*k*0.42),cart=E?0:Math.round(X.sum(sd,d=>d.carts)*k),chk=E?0:Math.round(X.sum(sd,d=>d.checkouts)*k),paid=E?0:Math.round(X.sum(sd,d=>d.orders)*k),rev=E?0:Math.round(X.sum(sd,d=>d.revenue)*k);
  const st=[["Product page",pv],["Add to cart",D.incomplete?pv+200:cart],["Checkout started",chk],["Paid",paid]];
  const ratio=(a,b)=>b&&a<=b?(a/b*100).toFixed(1)+"%":"–";
  let h=`<div class="grid g4">${X.kpi("Conversion",ratio(paid,pv),"paid ÷ product views")}${X.kpi("Cart abandonment",cart&&paid<=cart?Math.round((1-paid/cart)*100)+"%":"–","1 − paid ÷ add to cart")}${X.kpi("Checkout completion",ratio(paid,chk),"paid ÷ checkout started")}${X.kpi("Revenue / product view",pv?fmt(+(rev/pv).toFixed(2)):"–","revenue ÷ product views")}</div>`;
  if(D.incomplete)h+=X.note(`${ic("alert")} A later step is larger than an earlier one – not every storefront event is firing; ratios above 100 % are shown as «–».`,"--warn mt16");
  h+=X.sec("Funnel stages");
  h+=E?X.empty("No storefront counters in this period"):`<div class="an-funnel">${st.map((x,i)=>{const p=i?st[i-1][1]:0;return `<div class="st"><span>${x[0]}</span><div class="progress"><i style="width:${X.pct(x[1],st[0][1])}%"></i></div><b class="tnum">${X.n(x[1])}</b><span class="xs ${i&&p&&x[1]<=p?"neg":"muted"}">${i?(p&&x[1]<=p?"−"+Math.round((1-x[1]/p)*100)+"%":"–"):""}</span></div>`}).join("")}</div>`;
  h+=X.sec("Drop-off reasons",`<span class="an-hint">${ic("info")} static shares from funnel_reasons – not tied to the period</span>`);
  const reasons=E?[]:[["Delivery fee shown late","Show the fee on the product page",31,"Delivery"],["No same-day slot left","Open the 20:00–22:00 slot on peak days",24,"Delivery"],["Card declined / 3-D Secure","Offer Apple Pay first",18,"Payments"],["Wanted to add a message, no field","Card message field in the basket",15,"Storefront"],["Price above budget","Show Standard size first",12,"Catalog"]].map(r=>({r:r[0],a:r[1],s:r[2],m:r[3]}));
  h+=X.tbl([{l:"Reason",k:"r",cls:()=>"w"},{l:"Recommended action",k:"a",wrap:true},{l:"Module",r:r=>`<button class="link" onclick="App.toast('module_link → ${r.m} (not shown on the current page)')">${r.m}</button>`},{l:"Share",num:true,r:r=>r.s+"%"}],reasons,{empty:"No reasons configured",emptySub:"Reasons come from funnel_reasons – no editor in the CRM yet"});
  $("#b-"+id).innerHTML=h;
};

/* ===== Payments ===== */
window.mount_an_payments=function(){
  const A=App,X=A16,$=A.$,fmt=A.fmt,D=X.D;const id="an-payments";
  X.st(id,{});X.head(id,{fresh:"Payment ledger · all time"});X.url(id,false);if(!X.gate(id))return;
  const E=D.empty;const paid=E?0:412680,ref=E?0:9120;
  let h=`<div class="grid g4">${X.kpi("Paid",fmt(paid))}${X.kpi("Refunds",fmt(ref))}${X.kpi("Net",fmt(paid-ref))}${X.kpi("Transactions",X.n(E?0:5214))}</div>`;
  const byS=E?[]:[["paid","Paid",4830,paid],["refunded","Refunded",96,ref*0.8],["partially_refunded","Partially refunded",41,ref*0.2],["failed","Failed",188,0],["pending","Pending",59,0]];
  h+=`<div class="an-cols2 mt24"><div>${X.sec("By status")}${X.tbl([{l:"Status",r:r=>`${r[1]} <span class="muted xs">(${r[0]})</span>`},{l:"Count",num:true,r:r=>X.n(r[2])},{l:"Amount",num:true,r:r=>fmt(Math.round(r[3]))}],byS,{empty:"No payments yet"})}<div class="xs muted mt8">Raw statuses (paid, partially_refunded…) are labelled here.</div></div>`;
  const months=E?[]:Array.from({length:24},(_,i)=>{const d=new Date(2024,9+i,1);return {m:d.toLocaleDateString("en-GB",{month:"short",year:"numeric"}),v:Math.round(9000+X.hsh(i,81)*14000*[1.4,1.9,1.6,.9,1.05,.85,.8,.75,.9,1.15,.95,1.3][d.getMonth()])}});
  h+=`<div>${X.sec("Paid by month",`<span class="muted xs">24 months · oldest first</span>`)}${X.tbl([{l:"Month",k:"m"},{l:"Paid",num:true,r:r=>fmt(r.v)}],months,{empty:"No payments yet",h:420})}</div></div>`;
  $("#b-"+id).innerHTML=h;

/* ===== Loyalty ===== */

  h+=X.sec("By month",`<span class="muted xs">oldest first</span>`);
  h+=X.tbl([{l:"Month",k:"m"},{l:"Earned",num:true,r:r=>fmt(r.e)},{l:"Spent",num:true,r:r=>fmt(r.s)},{l:"Net",num:true,r:r=>X.money(r.e-r.s),cls:r=>r.e-r.s<0?"neg":""}],Array.from({length:12},(_,i)=>{const d=new Date(2025,10+i,1);const e=X.ri(i,91,900,2400),s=X.ri(i,92,600,2200);return {m:d.toLocaleDateString("en-GB",{month:"short",year:"numeric"}),e,s}}),{h:320});

    h+=`<div class="an-cols2 mt16">${flow("Taken → ready, by florist",FL.map((f,i)=>({n:f.n,o:X.ri(i,131,20,70),m:[38,44,52,47,66][i],p75:[60,70,80,72,98][i],p90:[90,101,120,110,140][i]})))}${flow("Taken → ready, by order type",[{n:"Marketplaces",o:84,m:31,p75:48,p90:70},{n:"Website",o:160,m:44,p75:70,p90:108},{n:"Phone, messengers, shop",o:74,m:49,p75:76,p90:112}])}</div>`;
    const bands=["< £60","£60–100","£100–160","£160–250","XXL £250+"];
    h+=X.sec("Taken → ready, by florist and bouquet value");
    h+=X.tbl([{l:"Florist",r:r=>esc(r.f.n)},{l:"Bouquets",num:true,k:"b"},...bands.map((b,bi)=>({l:b,num:true,hm:bi===4,r:r=>r.v[bi]?`${r.v[bi][0]} min<span class="sub">${r.v[bi][1]} bouquets · P75 ${r.v[bi][2]}</span>`:'<span class="muted">–</span>'})),{l:"Taken, not made",num:true,r:r=>`<span class="${r.nm?"neg":""}">${r.nm}</span>`}],FL.map((f,i)=>({f,b:X.ri(i,141,20,70),nm:X.ri(i,142,0,3),v:bands.map((_,bi)=>bi===4&&i%2?null:[X.ri(i,150+bi,22,80),X.ri(i,160+bi,1,20),X.ri(i,170+bi,40,120)])})));
    h+=`<div class="an-cols2 mt16">${flow("Taken → ready, by bouquet value",bands.map((b,bi)=>({n:b,o:X.ri(bi,181,10,90),m:28+bi*11,p75:45+bi*14,p90:70+bi*18})))}<div>${X.sec("Finished by hour")}${X.tbl([{l:"Hour",k:"h"},{l:"Finished",num:true,k:"f"},{l:"Taken with the button",num:true,r:r=>r.t+"%"},{l:"Median",num:true,r:r=>r.m+" min"}],[9,10,11,12,13,14,15,16,17].map(hh=>({h:hh+":00",f:X.ri(hh,191,8,48),t:X.ri(hh,192,55,90),m:X.ri(hh,193,30,60)})),{h:300})}<div class="xs muted mt8">Hour = when the bouquet became Ready, London time.</div></div></div>`;
  }else h+=`<div class="mt24">${X.sec("Where an order waits")}${X.note("Appears once the period has orders that reached Ready.")}</div>`;

  /* Time on accounting */
  h+=X.sec("Time on accounting",`<span class="an-hint">${ic("warehouse")} write-offs, counts, receipts, corrections</span>`);
  const acts=E?0:Math.round(N*4.6);
  if(!acts)h+=X.note(`No accounting action in this period (${Math.round(N*2.4)} shifts).`);
  else{
    h+=`<div class="grid g4">${X.kpi("Accounting actions",acts,`${Math.round(acts*0.5)} write-offs · ${Math.round(acts*0.1)} counts · ${Math.round(acts*0.3)} receipts · ${Math.round(acts*0.1)} corrections`)}${X.kpi("Shifts with an action",`${Math.round(N*1.3)} / ${Math.round(N*2.4)}`)}${X.kpi("Estimated accounting minutes",X.n(acts*7),"7 min per action · team median*")}${X.kpi("Activity in the Inventory section",X.n(acts*3),"page opens and clicks")}</div>`;
    h+=X.note(`${ic("info")} ${Math.round(acts*0.04)} action(s) landed outside any completed shift and are not attributed. Cells show «not enough data yet» below 5 actions; * = estimate from the team median rather than the person's own.`,"mt8");
    const pp=[["valeria",14,4],["svetlana",22,19],["marina",9,8],["lina",4,4],["daniel",6,1]].map(([u,sh,a],i)=>({u,sh,a,wo:Math.round(a*0.5),c:Math.round(a*0.1),rc:Math.round(a*0.3),cr:a-Math.round(a*0.5)-Math.round(a*0.1)-Math.round(a*0.3),inv:a*3,est:a<5?"not enough data yet":(a*7)+" min"+(i%2?"*":""),share:a<5?"–":Math.round(a*7/(sh*480)*100)+"%"}));
    h+=`<div class="an-cols2 mt16"><div>${X.sec("By person")}${X.tbl([{l:"Employee",r:r=>`${A.avatar(r.u,"--s")} ${esc(A.user(r.u).n)}`},{l:"Role",hm:true,r:r=>A.user(r.u).title},{l:"Shifts",num:true,r:r=>`${r.a?Math.min(r.sh,r.a):0} / ${r.sh}`},{l:"Write-offs",num:true,hm:true,k:"wo"},{l:"Counts",num:true,hm:true,k:"c"},{l:"Receipts",num:true,hm:true,k:"rc"},{l:"Corrections",num:true,hm:true,k:"cr"},{l:"Actions",num:true,k:"a"},{l:"Inventory activity",num:true,k:"inv"},{l:"Estimate",num:true,k:"est"},{l:"Share of shift",num:true,k:"share"}],pp)}</div>
    <div>${X.sec("By shift",`<span class="muted xs">Showing the most recent 6 of ${Math.round(N*1.3)} shifts</span>`)}${X.tbl([{l:"Date",k:"d"},{l:"Employee",r:r=>esc(A.user(r.u).n)},{l:"Shift",k:"s"},{l:"Actions",num:true,k:"a"},{l:"Inventory activity",num:true,r:r=>r.a*3},{l:"Estimate",num:true,r:r=>r.a?r.a*7+" min":"no actions"},{l:"Share of shift",num:true,r:r=>r.a?Math.round(r.a*7/540*100)+"%":"–"}],[["20 Oct","svetlana","08:00–17:00",3],["20 Oct","valeria","08:00–17:00",1],["19 Oct","marina","08:00–17:00",2],["19 Oct","lina","10:00–19:00",0],["18 Oct","svetlana","08:00–17:00",4],["18 Oct","olesya","13:00–22:00",1]].map(r=>({d:r[0],u:r[1],s:r[2],a:r[3]})))}</div></div>`;
  }
  $("#b-"+id).innerHTML=h;
};
A16B.staffMark=(fid,v)=>{A16.S["an-staff"].marks[fid]=v;App.remount();App.toast(`${App.user(fid).n} · mark saved · ${v==="excluded"?"removed from the boards":"points recalculated"}`)};

/* ===== Florist bonus ===== */
window.mount_florist_bonus=function(){
  const A=App,X=A16,$=A.$,esc=A.esc,ic=A.icon,fmt=A.fmt,D=X.D;const id="florist-bonus";
  const s=X.st(id,{period:"week",anchor:new Date(2026,9,20),why:null});
  if(!s.metrics)s.metrics={stars:14,google:4.8,mkt:4.6};
  const fl=X.florist();const me=A.me();
  /* London-safe window arithmetic: shift by whole days / months on a local Date, never via toISOString (old BST bug) */
  const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
  const start=s.period==="week"?monday(s.anchor):new Date(s.anchor.getFullYear(),s.anchor.getMonth(),1);
  const end=s.period==="week"?new Date(start.getFullYear(),start.getMonth(),start.getDate()+6):new Date(start.getFullYear(),start.getMonth()+1,0);
  const f=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  X.head(id,{fresh:"Counts only – pays nothing",demo:[["overdue","Overdue lesson"],["warnShowcase","Suspicious showcase write-offs"],["tiers","Pay ladder set"]],controls:`<div class="seg-ctl"><button class="${s.period==="week"?"on":""}" onclick="A16.S['florist-bonus'].period='week';App.remount()">Week</button><button class="${s.period==="month"?"on":""}" onclick="A16.S['florist-bonus'].period='month';App.remount()">Month</button></div><button class="ib" title="Previous" onclick="A16B.fbShift(-1)">${ic("back")}</button><span class="sm tnum">${f(start)} – ${f(end)}</span><button class="ib" title="Next" onclick="A16B.fbShift(1)">${ic("chev")}</button><span class="an-hint" title="Arrows shift the anchor by 7 days or 1 calendar month in London time – no BST drift, no setMonth overflow">${ic("info")} ?date=${iso(s.anchor)}</span>`});
  X.url(id,`period=${s.period}&date=${iso(s.anchor)}`);
  const month=s.period==="month";const E=D.empty;const FL=A.data.staff.filter(x=>x.role==="florist"&&!x.staff_type);
  const seed=s.anchor.getDate()+(month?100:0);
  let rows=E?[]:FL.map((u,i)=>{const k=month?4.3:1;const b=Math.round(X.ri(seed,i+1,14,38)*k),nb=X.ri(seed,i+11,0,4),hours=Math.round(X.ri(seed,i+21,24,42)*k);const scale=b*1.5,dbl=X.ri(seed,i+31,0,3)*6,walk=X.ri(seed,i+41,8,30),err=X.ri(seed,i+51,0,2);const ov=D.overdue&&i===1;const pot=ov?0:Math.round(18*k);return {u,hours,b,nb,scale,dbl,walk,walkP:Math.round(b*walk/100*0.5),err,errP:err*5,tier:["T2","T3","T1","T2"][i],star:i===1,rate:[12.5,13.5,11.8,12.5][i],ov,pot,mpot:month?Math.round(26):0,osh:[`${b} / ${X.ri(seed,i+61,2,8)} / ${X.ri(seed,i+71,0,4)}`],warn:D.warnShowcase&&i===2,total:0}}).map(r=>{r.total=r.scale+r.dbl+r.walkP-r.errP+r.pot+r.mpot;return r});
  if(fl)rows=rows.filter(r=>r.u.id===me.id);
  const mine=rows[0];
  let h="";
  if(fl)h+=`<div class="grid g3">${X.kpi("My bouquets",mine?mine.b:0,"this "+s.period)}${X.kpi("My bonus",mine?fmt(mine.scale+mine.dbl+mine.walkP-mine.errP):"–","without the weekly and monthly pot share – Total in the row includes it")}${X.kpi("Team pot",fmt(E?0:72),(E?0:3)+"/4 conditions met")}</div>`;
  else h+=`<div class="grid g4">${X.kpi("Bouquets ready",X.n(X.sum(rows,r=>r.b)))}${X.kpi("Ready before slot",E?"–":"96%","target ≥ 95%")}${X.kpi("Reworks",E?"–":"1.4%","target ≤ 2%")}${X.kpi("Team pot",fmt(E?0:72),"payable this "+s.period)}</div>`;
  h+=X.sec(fl?"My line":"Florists");
  h+=X.tbl([{l:"Florist",r:r=>`${A.avatar(r.u.id,"--s")} ${esc(r.u.n)}`},{l:"Hours",num:true,k:"hours"},{l:"Tier",hm:true,r:r=>D.tiers?`<span class="an-tip" title="${r.tier} · ${fmt(r.rate)}/h this month · ${r.hours} h × ${fmt(r.rate)} = ${fmt(r.hours*r.rate)}">${r.tier}${r.star?" ★":""}</span><span class="sub">${fmt(r.rate)}/h · ${fmt(r.hours*r.rate)}</span>`:"–"},{l:"Bouquets (bonus)",num:true,k:"b"},{l:"No bonus",num:true,r:r=>r.nb?`${r.nb} <button class="textbtn" onclick="A16.S['florist-bonus'].why=A16.S['florist-bonus'].why==='${r.u.id}'?null:'${r.u.id}';App.remount()">${s.why===r.u.id?"Hide":"Why not?"}</button>`:"0"},{l:"Scale",num:true,r:r=>fmt(r.scale)},{l:"Double / peak",num:true,r:r=>r.dbl?"+"+fmt(r.dbl):"–"},{l:"Walk-in %",num:true,hm:true,r:r=>`${r.walk}% · +${fmt(r.walkP)}`},{l:"Errors",num:true,r:r=>r.err?`<span class="neg">${r.err} (−${fmt(r.errP)})</span>`:"0"},{l:"Lessons",hm:true,r:r=>r.ov?'<span class="neg">overdue: 1</span>':"ok"},{l:"Order / showcase / handed out",hm:true,r:r=>`<span class="an-tip" title="orders / showcase bouquets / handed out from the showcase">${r.osh}</span>${r.warn?` <span class="accent" title="suspicious showcase write-offs">${ic("alert")}</span>`:""}`},{l:"Pot share",num:true,r:r=>r.ov?'<span class="neg xs">no pot share: overdue lesson</span>':fmt(r.pot)},...(month?[{l:"Monthly pot share",num:true,r:r=>fmt(r.mpot)}]:[]),{l:"Total",num:true,r:r=>`<b>${fmt(r.total)}</b>`}],rows,{empty:"No bouquets taken in this period yet."});
  if(s.why){const r=rows.find(x=>x.u.id===s.why);if(r)h+=`<div class="card mt8"><span class="caps">Why ${esc(r.u.n)} earned nothing on some orders</span>${r.nb?`<div class="an-mini">${A.data.orders.slice(0,r.nb).map((o,i)=>`<div class="r"><span><button class="link" onclick="App.openOrder(${o.id})">#${o.id}</button> · ${esc(A.product(o.product).name)} ×1/1</span><b class="muted">${["ready after the slot opened","photo missing","rework after a complaint","below the minimum price"][i%4]}</b></div>`).join("")}</div>`:`<div class="sm muted">Every bouquet earned a bonus.</div>`}</div>`}
  h+=`<div class="an-cols2 mt24"><div class="card"><span class="caps">Weekly team pot · 13–19 Oct</span><div class="row mb8"><div class="h3">${E?"–":"75%"} of the pot</div><span class="sp"></span><span class="sm">Payable this week <b>${fmt(E?0:72)}</b></span></div>${[["≥ 95% ready before the slot",true],["Reworks ≤ 2%",true],["No bouquet order without a photo",false],["Day-close checklist",null]].map(c=>`<div class="an-cond"><span class="mark ${c[1]===false?"no":"ok"}">${c[1]===false?ic("close"):ic("check")}</span><span style="flex:1">${c[0]}</span>${c[1]===null?'<span class="xs muted">not tracked yet, counted as met</span>':""}</div>`).join("")}<div class="xs muted mt8">Carried in from last week £24 · carried out to next week £0</div></div>
  <div class="card"><span class="caps">Monthly team pot · October</span>${month?`${[["New 5-star Google reviews ≥ 12",s.metrics.stars>=12,"£40"],["Google average ≥ 4.7",s.metrics.google>=4.7,"£30"],["Marketplace rating ≥ 4.5",s.metrics.mkt>=4.5,"£30"],["On-time ≥ 95%",true,"£40"],["Order growth vs last year",true,"£40"],["No confirmed errors",false,"£40"]].map(c=>`<div class="an-cond"><span class="mark ${c[1]?"ok":"no"}">${c[1]?ic("check"):ic("close")}</span><span style="flex:1">${c[0]}</span><b class="tnum ${c[1]?"":"muted"}">${c[2]}</b></div>`).join("")}<div class="row mt8"><span class="sm">Monthly pot total</span><span class="sp"></span><b>${fmt(180)}</b></div>`:`<div class="sm muted">Switch to the <button class="textbtn" onclick="A16.S['florist-bonus'].period='month';App.remount()">Month</button> view for the six studio KPIs and the monthly pot.</div>`}</div></div>`;
  if(month&&X.admin())h+=`<div class="card mt16"><span class="caps">Month metrics · October 2026</span><div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-end"><div class="field"><label>New 5-star reviews</label><input class="input" id="fb-stars" type="number" value="${s.metrics.stars}" style="width:120px"></div><div class="field"><label>Google average</label><input class="input" id="fb-google" type="number" step="0.1" value="${s.metrics.google}" style="width:120px"></div><div class="field"><label>Marketplace rating</label><input class="input" id="fb-mkt" type="number" step="0.1" value="${s.metrics.mkt}" style="width:120px"></div><button class="btn --sm" onclick="A16B.fbSaveMetrics()">${ic("check")} Save</button><span class="an-hint">${ic("info")} prefilled – the old form opened empty and saving blank fields wiped earlier values</span></div></div>`;
  else if(month)h+=`<div class="xs muted mt8">Month metrics (reviews, Google average, marketplace rating) are entered by the owner.</div>`;
  h+=X.note(`<b>Rules:</b> bonus counts from 1 Sep 2026 · double rate from the 25th bouquet in a shift · peak day = 40+ orders · lessons overdue → no pot share · walk-in bouquets add 50% of the scale.`,"mt16");
  $("#b-"+id).innerHTML=h;
};
A16B.fbShift=dir=>{const s=A16.S["florist-bonus"];const d=new Date(s.anchor);if(s.period==="week")d.setDate(d.getDate()+7*dir);else{d.setDate(1);d.setMonth(d.getMonth()+dir)}s.anchor=d;s.why=null;App.remount()};
A16B.fbSaveMetrics=()=>{const s=A16.S["florist-bonus"];const v=k=>document.getElementById("fb-"+k).value;if(v("stars")===""||v("google")===""||v("mkt")===""){App.toast("Fill every field – blanks would wipe the saved values");return}App.confirm("Save October metrics?",`5-star reviews ${v("stars")}, Google ${v("google")}, marketplace ${v("mkt")}. Overwrites this month's MonthlyStudioMetric · audit monthly_studio_metric.set.`,"Save",()=>{s.metrics={stars:+v("stars"),google:+v("google"),mkt:+v("mkt")};App.remount();App.toast("Month metrics saved")})};
</script>
