  save(id){const g=k=>(document.getElementById(k)?.value||"").trim();const name=g("et-name"),subj=g("et-subj"),body=g("et-body"),vars=g("et-vars").split(",").map(s=>s.trim()).filter(Boolean);if(!name){document.getElementById("et-err").textContent="Name is required.";return}

  translations(kind,id){ // kind: tpl | sms | frag

/* ===== Broadcasts ===== */
const T13BC={
  re(){if(App.state.current==="broadcasts")window.mount_broadcasts(App.state.params)},
  aud:{WhatsApp:318,Email:412,SMS:296},
  add(){App.modal({title:"New broadcast",wide:true,body:`<div class="field"><label>Title</label><input class="input" id="bc-title" maxlength="140" placeholder="Required"></div><div class="grid g2 mt8"><div class="field"><label>Channel</label><select class="select" id="bc-chan">${Object.keys(this.aud).map(c=>`<option>${c} (${this.aud[c]})</option>`).join("")}</select></div><div class="field"><label>Schedule (London time)</label><input class="input" id="bc-sched" type="datetime-local"><div class="hint">Saved as scheduled_at – no cron sends it yet</div></div></div><div class="grid g2 mt8"><div class="field"><label>Body (EN)</label><textarea class="textarea" id="bc-en" rows="5"></textarea></div><div class="field"><label>Body (RU)</label><textarea class="textarea" id="bc-ru" rows="5"></textarea></div></div><div class="err" id="bc-err"></div>`,foot:`<button class="btn --secondary --sm" onclick="T13.closeDirty()">Cancel</button><button class="btn --sm" onclick="T13BC.save()">Save draft</button>`})},
  save(){const g=k=>(document.getElementById(k)?.value||"").trim();if(!g("bc-title")){document.getElementById("bc-err").textContent="Title is required.";return}const chan=g("bc-chan").split(" (")[0];const sched=g("bc-sched");T13_BC.unshift({id:Date.now(),title:g("bc-title"),chan,rec:0,status:sched?"scheduled":"draft",sched:sched?new Date(sched).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"",sent:null,en:g("bc-en"),ru:g("bc-ru")});App.closeModal();this.re();App.toast("Draft saved · audit broadcast.create")},
  send(id){const b=T13_BC.find(x=>x.id===id);const n=this.aud[b.chan];App.confirm(`Send to ${n} (${b.chan}) recipients?`,"This cannot be undone. Note: on the current server this only marks the broadcast as Sent – messages do not go out yet.","Send now",()=>{b.status="sent";b.rec=n;b.sent="Today "+App.fmtTime(App.NOW.toISOString());this.re();App.toast("Marked Sent · recipients "+n+" · audit comms.broadcast.send")},{danger:true})},
  open(id){const b=T13_BC.find(x=>x.id===id);App.sheet({eyebrow:"Broadcast · "+b.chan,title:App.esc(b.title),body:`<dl class="kv"><dt>Status</dt><dd>${App.pill(b.status==="sent"?"paid":b.status==="scheduled"?"partial":"queue",b.status[0].toUpperCase()+b.status.slice(1))}</dd><dt>Audience</dt><dd>${this.aud[b.chan]} with consent</dd>${b.sched?`<dt>Scheduled</dt><dd>${App.esc(b.sched)}</dd>`:""}${b.sent?`<dt>Sent</dt><dd>${App.esc(b.sent)} · ${b.rec} recipients</dd>`:""}</dl><div class="hr"></div><div class="caps mb8">Body (EN)</div><div class="sm">${App.esc(b.en)||"<span class='muted'>empty</span>"}</div><div class="caps mt16 mb8">Body (RU)</div><div class="sm">${App.esc(b.ru)||"<span class='muted'>empty</span>"}</div>`,foot:`<span class="sp"></span>${b.status!=="sent"?`<button class="btn --sm" onclick="App.closeSheet();T13BC.send(${b.id})">Send</button>`:""}`})},
  demo(ev){App.pop(ev,["Demo data",{t:"No broadcasts",ic:"moon",fn:()=>{T13_BC=[];this.re()}}])}
};
window.mount_broadcasts=function(p){
  const esc=App.esc,ic=App.icon;
  document.getElementById("c13-bc-head").innerHTML=T13.nav("broadcasts",`Mass sends to customers · WhatsApp / Email / SMS`,`<button class="btn --sm" onclick="T13BC.add()">${ic("plus")} New broadcast</button>`,"T13BC.demo(event)");
  let h=`<div class="stub">${ic("alert")}<div><b>Not wired to sending yet.</b> «Send now» only marks a broadcast as Sent and records the recipient count; no message leaves the CRM and scheduled sends have no cron. Audience sizes are estimates from consent counts.</div></div>`;

/* ===== NPS ===== */
const T13N={re(){if(App.state.current==="nps")window.mount_nps(App.state.params)},days(d){T13S2.npsDays=d;this.re()},done(i){T13_NPS.detr[i].st="done";this.re();App.toast("Follow-up closed")},
  demo(ev){App.pop(ev,["Demo data",{t:"comms.manage · "+(T13S2.manage?"granted":"missing (403)"),ic:"lock",fn:()=>{T13S2.manage=!T13S2.manage;this.re()}}])}};
window.mount_nps=function(){
  const esc=App.esc,ic=App.icon,d=T13S2.npsDays;
  document.getElementById("c13-nps-head").innerHTML=T13.nav("nps",`Net Promoter Score · last <b>${d} days</b>`,`<div class="seg-ctl">${[30,90,180,365].map(x=>`<button class="${d===x?"on":""}" onclick="T13N.days(${x})">${x}d</button>`).join("")}</div>`,"T13N.demo(event)");
  const b=document.getElementById("c13-nps-body");
  if(!T13S2.manage){b.innerHTML=`<div class="empty">${ic("lock")}<div class="h3">403 · comms.manage needed</div></div>`;return}
  const R=T13_NPS.responses[d],P=T13_NPS.prom[d],S=T13_NPS.pass[d],D=T13_NPS.det[d];const pp=Math.round(100*P/R),sp=Math.round(100*S/R),dp=100-pp-sp;const nps=pp-dp;const open=T13_NPS.detr.filter(x=>x.st==="open").length;
  const months=d<=90?T13_NPS.trend.slice(-3):d<=180?T13_NPS.trend:T13_NPS.trend;const max=Math.max(...months.map(m=>Math.abs(m[1])),1);
  b.innerHTML=`<div class="grid g4 mb16"><div class="kpi-card" style="cursor:default"><span class="caps">NPS</span><span class="kpi">${nps>0?"+":""}${nps}</span></div><div class="kpi-card" style="cursor:default"><span class="caps">Responses</span><span class="kpi">${R}</span></div><div class="kpi-card ${open?"--hot":""}" style="cursor:default"><span class="caps">Detractors open</span><span class="kpi ${open?"accent":""}">${open}</span></div><div class="kpi-card" style="cursor:default" title="Front-end constant – not calculated"><span class="caps">Repeat rate</span><span class="kpi">2.3×</span><span class="delta">constant · not calculated yet</span></div></div>
  <div class="grid g2"><div class="card"><div class="h3">Score split</div><div class="nps-bar"><i class="p" style="width:${pp}%" title="Promoters ${pp}%"></i><i class="s" style="width:${sp}%" title="Passives ${sp}%"></i><i class="d" style="width:${dp}%" title="Detractors ${dp}%"></i></div><div class="nps-leg"><span><i style="background:var(--ok)"></i>Promoters ${pp}% (${P})</span><span><i style="background:var(--light)"></i>Passives ${sp}% (${S})</span><span><i style="background:var(--accent)"></i>Detractors ${dp}% (${D})</span></div><div class="hint mt8">NPS = % promoters (9–10) − % detractors (0–6)</div></div>
  <div class="card"><div class="h3">Trend by month</div>${months.length?`<div class="trend">${months.map(m=>`<div class="c" title="${m[0]}: ${m[1]>0?"+":""}${m[1]}"><b>${m[1]>0?"+":""}${m[1]}</b><span class="bar2 ${m[1]<0?"--neg":""}" style="height:${Math.round(50*Math.abs(m[1])/max)}%;${m[1]<0?"order:3":""}"></span><small>${m[0]}</small></div>`).join("")}</div><div class="hint mt8">Europe/London months · negative months drawn in accent below the axis</div>`:`<div class="empty"><div class="sm">No data</div></div>`}</div></div>
  <div class="sec-head"><div class="h3">Detractor follow-up</div><span class="hint">score ≤ 6</span></div>
  ${T13_NPS.detr.length?`<div class="list" style="border:1px solid var(--hair)">${T13_NPS.detr.map((x,i)=>{const c=App.customer(x.cust);return `<div class="li" onclick="App.openCustomer(${c.id})"><div class="t"><b>${esc(c.n)}</b><small>${esc(x.t)}</small></div>${App.pill(x.st==="open"?"unpaid":"done",x.st==="open"?"Open":"Done")}${x.st==="open"?`<button class="btn --ghost --sm" onclick="event.stopPropagation();T13N.done(${i})">Mark done</button>`:""}<button class="ib" title="Message" onclick="event.stopPropagation();App.go('inbox',{customer:${c.id}})">${ic("chat")}</button></div>`}).join("")}</div>`:`<div class="empty">${ic("star")}<div class="h3">No detractors</div></div>`}`;
};
