<style>
/* ===== 24-2 · Auth · Public (tracking, redelivery) · Floritta One (tenant pages + admin.floritta.ai) ===== */
/* bare screens: no sidebar / topbar while a [data-bare] screen is on (CSS only, shell untouched) */
.app:has(> .screens > .scr[data-bare].on){grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.app:has(> .screens > .scr[data-bare].on) > .sidebar,.app:has(> .screens > .scr[data-bare].on) > .topbar,.app:has(> .screens > .scr[data-bare].on) > .drawer-bg{display:none}
.s25 .demo-bar{display:flex;align-items:center;gap:10px;padding:8px var(--pad);border-bottom:1px dashed var(--light);background:var(--silver);font-size:12px;color:var(--grey);flex:none;flex-wrap:wrap}
.s25 .demo-bar .seg-ctl{height:26px}.s25 .demo-bar .seg-ctl button{padding:0 8px;font-size:11px}
.s25 .auth{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:32px 16px;background:var(--silver)}
.s25 .auth-box{width:400px;max-width:100%;background:var(--paper);border:1px solid var(--hair);padding:32px 32px 28px}
.s25 .auth-box .logo{height:18px;margin-bottom:28px}
.s25 .auth-box .h2{margin-bottom:18px}
.s25 .auth-box .field{margin-bottom:14px}
.s25 .auth-box .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;font-size:12px;color:var(--grey);flex-wrap:wrap}
.s25 .flash{padding:10px 12px;font-size:13px;margin-bottom:14px;border:1px solid transparent}
.s25 .flash.--ok{background:var(--ok-bg);color:var(--ok)}.s25 .flash.--err{background:var(--accent-bg);color:var(--accent)}.s25 .flash.--warn{background:var(--warn-bg);color:var(--warn)}
.s25 .err{font-size:12px;color:var(--accent);margin-top:4px}
/* public tracking (lux) */
.s25 .pub{flex:1;min-height:0;overflow:auto;background:var(--paper)}
.s25 .pub-in{max-width:720px;margin:0 auto;padding:36px 24px 48px}
.s25 .pub-logo{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--hair);padding-bottom:16px;margin-bottom:28px}
.s25 .pub-logo .wm{font-family:var(--f-display);font-weight:300;font-size:28px;letter-spacing:.14em;text-transform:uppercase}
.s25 .pub-hero .h-display{font-size:40px}
.s25 .live{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}
.s25 .live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:s25pulse 1.6s infinite}
@keyframes s25pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.s25 .steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:28px 0 8px}
.s25 .steps div{position:relative;padding:12px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);border-top:2px solid var(--hair)}
.s25 .steps div.on{color:var(--ink);border-top-color:var(--ink)}
.s25 .steps div.--fail{color:var(--accent);border-top-color:var(--accent)}
.s25 .pub-map{height:260px;margin:24px 0 10px}
.s25 .pub-map .stop{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--grey);transform:translate(-50%,-50%)}
.s25 .pub-map .stop.--done{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--grey)}
.s25 .pub-map .route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.s25 .pub-map .route path{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 5}
.s25 .pub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}
.s25 .pub-card{border:1px solid var(--hair);padding:18px}
.s25 .pub-card .caps{display:block;margin-bottom:6px}
.s25 .pub-card .big{font-family:var(--f-display);font-weight:300;font-size:36px;line-height:1}
.s25 .care{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:12px}
.s25 .care div{border-top:1px solid var(--hair);padding-top:10px;font-size:13px;color:var(--graphite)}
.s25 .promo{border:1px solid var(--ink);padding:24px;margin-top:32px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.s25 .promo code{font-size:18px;letter-spacing:.14em;border:1px dashed var(--ink);padding:6px 12px}
.s25 .links2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.s25 .review{text-align:center;margin:40px 0 24px;font-family:var(--f-display);font-size:22px;font-weight:300;line-height:1.3}
.s25 .stars{letter-spacing:.2em;font-size:12px;color:var(--ink);margin-bottom:8px}
.s25 .pub-foot{border-top:1px solid var(--hair);padding-top:16px;font-size:12px;color:var(--grey);line-height:1.5}
.s25 .slots{display:flex;gap:8px;flex-wrap:wrap}
.s25 .slots .chip{height:40px;padding:0 18px}
/* One: impersonation banner, central layout */
.s25 .imp{background:var(--accent);color:#fff;display:flex;align-items:center;gap:12px;padding:8px var(--pad);font-size:13px;flex:none}
.s25 .imp .btn{--btn-h:28px;height:28px;border-color:#fff;background:transparent;color:#fff;font-size:11px;padding:0 10px}
.s25 .c-head{display:flex;align-items:center;gap:20px;padding:0 var(--pad);height:56px;border-bottom:1px solid var(--hair);flex:none;background:var(--paper)}
.s25 .c-head .wm{font-family:var(--f-display);font-weight:300;font-size:22px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.s25 .c-head .wm small{font-family:var(--f-body);font-size:10px;letter-spacing:.14em;color:var(--grey);margin-left:8px}
.s25 .c-head nav{display:flex;gap:4px}
.s25 .c-head nav button{height:36px;padding:0 12px;font-size:13.5px;color:var(--graphite);border-bottom:2px solid transparent}
.s25 .c-head nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.s25 .c-warn{background:var(--warn-bg);color:var(--warn);display:flex;align-items:center;gap:12px;padding:8px var(--pad);font-size:13px;flex:none}
.s25 .c-body{flex:1;min-height:0;overflow:auto;padding:var(--pad)}
.s25 .codes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.s25 .codes code{display:block;border:1px solid var(--hair);padding:8px 10px;font-size:13px;text-align:center;letter-spacing:.06em}
.s25 .secret{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.14em;border:1px solid var(--hair);padding:14px;text-align:center;word-break:break-all}
.s25 .uri{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--graphite);word-break:break-all;background:var(--silver);padding:10px}
.s25 .tl-json{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--grey);white-space:pre-wrap}
.s25 .ops{display:flex;gap:8px;flex-wrap:wrap}
.s25 .t-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
[data-size="ipad"] .s25 .t-grid{grid-template-columns:minmax(0,1fr)}
[data-size="ipad"] .s25 .codes{grid-template-columns:repeat(2,minmax(0,1fr))}
[data-size="phone"] .s25 .pub-grid,[data-size="phone"] .s25 .links2,[data-size="phone"] .s25 .care,[data-size="phone"] .s25 .t-grid,[data-size="phone"] .s25 .codes{grid-template-columns:1fr}

[data-size="phone"] .s25 .c-head nav button{padding:0 8px}
[data-size="phone"] .s25 .pub-hero .h-display{font-size:30px}
</style>

<script>
(()=>{
const A=App,E=s=>A.esc(s),I=n=>A.icon(n),$=(s,r)=>A.$(s,r),$$=(s,r)=>A.$$(s,r);
const tt=m=>A.toast(m);
const url=u=>{const el=$("#url");if(el)el.textContent=u};
const LOGO=`<img class="logo" src="logo.svg" alt="Floritta">`;
const S={login:"plain",pc:"forced",trk:"transit",trkPrivate:false,trkPromo:true,trkLost:false,trkTick:20,trkTimer:null,wel:"fresh",cl:"2fa",clRecovery:false,fa:"enrol",faShown:true,faOld:true,tenStatus:"all",tenSort:"created",tenDir:"desc",tenPage:1,tenant:"bloom-leeds",ldStatus:"all",imp:true,redelDone:false,fresh:false};
const ME=()=>A.me();
/* ------------------------------------------------------------------ AUTH */
function landing(){const r=A.role();const to=r==="florist"?"production":"orders";A.go(to);tt(`Signed in as ${ME().n} · landed on ${r==="florist"?"the board":"Orders"} · last_login_at written`)}
function mountLogin(){url("app.floritta.ai/login");
  $("#s25-login-demo").innerHTML=`<span>Demo state</span><div class="seg-ctl">${[["plain","Plain"],["error","Wrong password"],["inactive","Inactive account"],["flash","After password reset"]].map(x=>`<button class="${S.login===x[0]?"on":""}" onclick="S25.S.login='${x[0]}';S25.mountLogin()">${x[1]}</button>`).join("")}</div><span class="sp"></span><span>Shown without sidebar – guest page (AuthLayout)</span>`;
  $("#s25-login").innerHTML=`<form class="auth-box" onsubmit="event.preventDefault();S25.login(this)">${LOGO}<div class="h2">Sign in to Floritta Admin</div>
   ${S.login==="flash"?`<div class="flash --ok">Password updated. Sign in with your new password.</div>`:""}
   ${S.login==="error"||S.login==="inactive"?`<div class="flash --err">These credentials do not match our records.</div>`:""}
   <div class="field"><label>Email</label><input class="input" name="email" type="email" autocomplete="username" value="${S.login==="inactive"?"omar@floritta.example":S.login==="error"?"valeria@floritta.example":""}" placeholder="name@floritta.uk"></div>
   <div class="field"><label>Password</label><input class="input" name="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
   <button class="btn --block" type="submit">Sign in</button>
   <div class="foot"><button type="button" class="textbtn" onclick="App.go('auth-forgot')">Forgot your password?</button><span title="Values are read from the form at submit – works with password managers and autofill">${I("lock")} autofill-safe</span></div>
   ${S.login==="inactive"?`<div class="xs muted mt16">Inactive, service (automation) and freelance-only accounts get the same generic error as a wrong password – on purpose.</div>`:""}
   <div class="xs muted mt16">5 attempts a minute. After sign-in: courier → deliveries app, florist → board, manager / admin → the page you came from or Orders.</div></form>`;
}
function login(f){const fd=new FormData(f);if(!fd.get("email")||!fd.get("password")){S.login="error";mountLogin();return}landing()}
function mountForgot(){url("app.floritta.ai/forgot-password");
  $("#s25-forgot").innerHTML=`<form class="auth-box" onsubmit="event.preventDefault();S25.forgot()">${LOGO}<div class="h2">Forgot your password?</div><div id="s25-forgot-body"><div class="sm soft mb16">Enter the email you use for Floritta Admin – we will send a link to set a new password.</div><div class="field"><label>Email</label><input class="input" id="s25-fg-e" type="email" autofocus placeholder="name@floritta.uk"></div><button class="btn --block" type="submit">Send reset link</button></div><div class="foot"><button type="button" class="textbtn" onclick="App.go('auth-login')">Back to sign in</button><span>5 a minute</span></div></form>`;
}
function forgot(){$("#s25-forgot-body").innerHTML=`<div class="flash --ok">If that email belongs to a Floritta account, a reset link is on its way. Check your inbox and spam.</div><div class="xs muted">The same message for any address – the link is only sent to an active user.</div>`}
function mountReset(){url("app.floritta.ai/reset-password/…?email=valeria@…");
  $("#s25-reset").innerHTML=`<form class="auth-box" onsubmit="event.preventDefault();S25.reset()">${LOGO}<div class="h2">Set a new password</div>
   <div class="field"><label>Email</label><input class="input" value="valeria@floritta.example" readonly></div>
   <div class="field"><label>New password</label><input class="input" type="password" id="s25-rs-p" autocomplete="new-password"><div class="xs muted mt8">At least 8 characters with letters and digits.</div></div>
   <div class="field"><label>Confirm new password</label><input class="input" type="password" id="s25-rs-c" autocomplete="new-password"><div class="err" id="s25-rs-err"></div></div>
   <button class="btn --block" type="submit">Set new password</button>
   <div class="foot"><button type="button" class="textbtn" onclick="App.go('auth-login')">Back to sign in</button><span>link valid 60 min</span></div>
   <div class="xs muted mt16">On success: forced change is cleared, all mobile and API tokens are deleted, other sessions are signed out, you are signed in and land by role.</div></form>`;
}
function reset(){const p=$("#s25-rs-p").value,c=$("#s25-rs-c").value;if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(p)){$("#s25-rs-err").textContent="At least 8 characters, letters and digits";return}if(p!==c){$("#s25-rs-err").textContent="Passwords do not match";return}landing()}
function mountPC(){url("app.floritta.ai/password/change");
  $("#s25-pc-demo").innerHTML=`<span>Demo state</span><div class="seg-ctl"><button class="${S.pc==="forced"?"on":""}" onclick="S25.S.pc='forced';S25.mountPC()">Forced (temporary password)</button><button class="${S.pc==="voluntary"?"on":""}" onclick="S25.S.pc='voluntary';S25.mountPC()">Voluntary</button></div><span class="sp"></span><span>Forced: every CRM page redirects here until the password is changed (only this page and Sign out are allowed)</span>`;
  $("#s25-pc").innerHTML=`<form class="auth-box" onsubmit="event.preventDefault();S25.pcSave()">${LOGO}<div class="h2">Change password</div>
   ${S.pc==="forced"?`<div class="flash --warn">Set your own password to continue.</div>`:`<div class="sm soft mb16">Opened from the account menu → «Change password».</div>`}
   <div class="field"><label>Current password</label><input class="input" type="password" id="s25-pc-cur" autocomplete="current-password" placeholder="${S.pc==="forced"?"the temporary password you were given":""}"></div>
   <div class="field"><label>New password</label><input class="input" type="password" id="s25-pc-p" autocomplete="new-password"><div class="xs muted mt8">At least 8 characters with letters and digits; not the same as the current one.</div></div>
   <div class="field"><label>Confirm new password</label><input class="input" type="password" id="s25-pc-c"><div class="err" id="s25-pc-err"></div></div>
   <button class="btn --block" type="submit">Change password</button>
   <div class="foot"><button type="button" class="textbtn" onclick="App.toast('Signed out (demo)');App.go('auth-login')">Sign out</button>${S.pc==="voluntary"?`<button type="button" class="textbtn" onclick="App.back()">Back</button>`:`<span>can't remember the temporary password? Sign out and ask an admin</span>`}</div>
   <div class="xs muted mt16">After the change every other session is signed out and all mobile / API tokens are deleted – phones sign in again.</div></form>`;
}
function pcSave(){const cur=$("#s25-pc-cur").value,p=$("#s25-pc-p").value,c=$("#s25-pc-c").value;if(!cur){$("#s25-pc-err").textContent="Enter the current password";return}if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(p)){$("#s25-pc-err").textContent="At least 8 characters, letters and digits";return}if(p===cur){$("#s25-pc-err").textContent="The new password must differ from the current one";return}if(p!==c){$("#s25-pc-err").textContent="Passwords do not match";return}tt("Password changed · other sessions signed out");landing()}
/* ------------------------------------------------------------------ PUBLIC TRACKING */
const TRK={recipient:"Charlotte",courier:"Daniel",stopsBefore:2,stopsTotal:4};
function stage(){return{preparing:"preparing",transit:"in_transit",arriving:"in_transit",delivered:"delivered",failed:"failed"}[S.trk]}

function approveGo(id){const s=$("#s25-ap-s").value.trim();if(!/^[a-z0-9-]{3,30}$/.test(s)){$("#s25-ap-err").textContent="Slug: 3–30 lower-case letters, digits, dashes";return}const l=lead(id);l.status="approved";l.tenant=s;TEN.unshift({slug:s,name:l.biz,status:"provisioning",hold:false,plan:"Starter",trial:null,users:0,o24:0,db:"–",last:null,created:A.NOW.toISOString(),domains:[s+".floritta.one"],ai:"unknown"});A.closeModal();mountLeads();cToast("Provisioning queued for "+s+".")}
function reject(id){A.modal({title:"Reject lead",body:`<div class="field"><label>Reason *</label><input class="input" id="s25-rj-r" placeholder="e.g. outside the UK"></div><div class="err" id="s25-rj-err"></div>`,foot:`<button class="btn --secondary --sm" onclick="App.closeModal()">Cancel</button><button class="btn --sm --accent" onclick="S25.rejectGo(${id})">Reject</button>`})}
function rejectGo(id){const r=$("#s25-rj-r").value.trim();if(!r){$("#s25-rj-err").textContent="A reason is required";return}const l=lead(id);l.status="rejected";l.reason=r;A.closeModal();mountLeads();cToast("Done.")}
/* ---------- commands & mounts ---------- */
A.registerCommands([{g:"Go to",t:"Public tracking page (recipient view)",ic:"map",fn:()=>A.go("public-tracking")},{g:"Go to",t:"Floritta One · admin tenants",ic:"globe",fn:()=>A.go("one-admin-tenants")},{g:"Actions",t:"Change my password",ic:"lock",fn:()=>{S.pc="voluntary";A.go("auth-password-change")}}]);
window.S25={S,mountLogin,login,mountForgot,forgot,mountReset,reset,mountPC,pcSave,mountTracking,mountRedel,slot,redelSend,mountWelcome,welSave,mountSusp,mountImp,impWrite,impExit,mountCL,clSubmit,mount2fa,faConfirm,copyCodes,regen,mountTenants,tenFilter,tenSort,openTenant,newTenant,provision,mountTenant,aiBtn,aiSave,op,opGo,mountLeads,ldFilter,lead:leadRow,contact,approve,approveGo,reject,rejectGo};
window.mount_auth_login=mountLogin;window.mount_auth_forgot=mountForgot;window.mount_auth_reset=mountReset;window.mount_auth_password_change=mountPC;window.mount_public_tracking=mountTracking;window.mount_public_redelivery=mountRedel;window.mount_one_welcome=mountWelcome;window.mount_one_suspended=mountSusp;window.mount_one_impersonation=mountImp;window.mount_one_admin_login=mountCL;window.mount_one_admin_2fa=mount2fa;window.mount_one_admin_tenants=mountTenants;window.mount_one_admin_tenant=mountTenant;window.mount_one_admin_leads=mountLeads;
})();
