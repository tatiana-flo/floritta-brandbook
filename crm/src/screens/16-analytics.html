/* ===== CEO (s-analytics) ===== */
window.mount_analytics=function(){
  const A=App,X=A16,$=A.$,esc=A.esc,ic=A.icon,fmt=A.fmt,D=X.D;const id="analytics";
  const s=X.st(id,{period:"30d",basis:"fulfil"});
  A.registerCommands(X.TABS.map(t=>({g:"Analytics",t:"Analytics · "+t[1],ic:"growth",fn:()=>X.open(t[0])})));
  X.head(id,{period:["today","7d","30d","month","prevMonth","quarter"],fresh:"Data as of 10:42 · last order came in 10:31",demo:[["subs","Active subscriptions"],["ratings","Platform ratings synced"],["survey","Survey answers"],["lowCoverage","Recipe coverage < 50 %"]],
    controls:`<span class="an-lbl">Count by</span><div class="seg-ctl"><button class="${s.basis==="placed"?"on":""}" onclick="A16.S.analytics.basis='placed';App.remount()">Order date (paid)</button><button class="${s.basis==="fulfil"?"on":""}" onclick="A16.S.analytics.basis='fulfil';App.remount()">Delivery date</button></div><span class="an-hint">${s.basis==="placed"?"Paid orders by the day the money came in (London)":"Orders by the day they were delivered – the default"}</span>`});
  X.url(id,"basis="+s.basis);
  if(!X.gate(id))return;
  const days=X.series(id,1);const orders=X.sum(days,d=>d.orders),rev=X.sum(days,d=>d.rev);const free=D.empty?0:3;const cust=Math.round(orders*0.82);
  const cov=D.lowCoverage?41:78;
  let h=`<div class="grid g6">${X.kpi("Revenue",fmt(rev),"paid orders, minus delivery, refunds and marketplace commission")}${X.kpi("Average order",orders?fmt(Math.round(rev/orders)):"–","per paid order")}${X.kpi("Orders",X.n(orders),free?`£0 orders not counted: ${free}`:"paid, excluding cancelled")}${X.kpi("Customers",X.n(cust),"unique buyers in the period")}${X.kpi("Subscription MRR",D.subs?fmt(34*45):"–",D.subs?"34 active subscriptions × £45":"no active subscriptions – nothing to estimate")}${X.kpi("LTV : CAC","4.6","CAC is a fixed £17")}</div>`;
  h+=X.sec("The owner's numbers",`<span class="an-hint">${ic("info")} ${s.basis==="placed"?"by the day the order was paid":"by the day the order was delivered"}</span>`);
  h+=`<div class="grid g6">${X.kpi("Gross margin","54%",`recipes cover ${cov}% of sold lines${cov<50?" – treat as a lower bound":""}`,cov<50?"--warn":"")}${X.kpi("Repeat buyers","31%",`${Math.round(cust*0.31)} of ${cust} had bought before`)}${X.kpi("Stock loss",D.empty?"–":"18%",D.empty?"nothing received in this period":"write-offs £1,240 vs received £6,900",D.empty?"":"--alert")}${X.kpi("Cost per delivery",D.empty?"–":"£7.40",D.empty?"in-house runs not costed yet":"34 drops · 6 without a cost",D.empty?"--warn":"--warn")}${D.ratings?X.kpi("Platform ratings","4.6","Google 4.8 (212) · Deliveroo 4.6 (148) · Uber Eats 4.5 (96)"):X.kpi("Platform ratings","–","no ratings synced yet")}${D.survey?X.kpi("Where customers come from","Instagram 38%","Google 27% · friends 19% · passing by 16% · 142 of "+X.n(orders)+" orders answered",orders&&142/orders<0.2?"--warn":""):""}</div>`;
  h+=X.sec("Revenue mix");
  const mix=X.CH.map(c=>{const o=X.sum(days,d=>d.by[c]);const r=o*X.ri(1,c.length,72,130);return {l:c==="Walk-in"?"Walk-in (shop)":c,v:r,sub:`${X.n(o)} orders · avg ${o?fmt(Math.round(r/o)):"–"}`}}).sort((a,b)=>b.v-a.v);
  h+=orders?X.bars(mix,{f:fmt}):X.empty("No orders in this period");
  if(orders){h+=X.sec("Orders by channel & day");h+=X.daily(id,days.map(d=>Object.assign({},d,{web:d.by.Website,msg:d.by.WhatsApp+d.by.Instagram+d.by.Phone,mkt:d.by.Deliveroo+d.by["Uber Eats"],shop:d.by["Walk-in"]})),[{k:"web",l:"Website"},{k:"msg",l:"Messengers & phone"},{k:"mkt",l:"Marketplaces"},{k:"shop",l:"Shop"}],{aov:true})}
  h+=X.sec("By day");
  const cols=[{l:"Date",k:"label"},...X.CH.map(c=>({l:c,num:true,r:r=>X.n(r.by[c])})),{l:"Total",num:true,r:r=>X.n(r.orders)},{l:"Average order",num:true,r:r=>r.orders?fmt(r.aov):"–"}];
  const tot={label:"Total",by:{},orders,aov:orders?Math.round(rev/orders):0};X.CH.forEach(c=>tot.by[c]=X.sum(days,d=>d.by[c]));
  h+=orders?X.tbl(cols,[tot,...days.slice().reverse()],{row:r=>r.label==="Total"?"tot":"",h:360}):X.empty("No orders in this period","Change the period or the counting basis");

};

  X.url(id,`window=${s.window}&basis=${s.basis}`);if(!X.gate(id))return;
  const E=D.empty;const total=E?0:(s.window||60)*118;
  let h=`<div class="row mb8"><div class="h3">${s.basis==="slot"?"Demand by promised delivery slot":"Demand by the time the order came in"}</div><span class="sp"></span><span class="sm muted">${s.window?`${X.fmtD("2026-0"+(8-Math.floor(s.window/5))+"-25")} → 20 Oct`:"All time"} · ${X.n(total)} orders${s.basis==="slot"&&!E?` · 112 delivery orders (${Math.round(112/total*100)}%) carry no promised slot`:""}</span></div>`;
  if(D.peak&&!E)h+=X.note(`${ic("info")} Staff up around the peak day/hour to protect SLA – the peak is <b>Fri 12:00–14:00</b> (outlined below).`,"mb16");
  const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],hours=Array.from({length:15},(_,i)=>8+i);
  const val=(d,hh)=>E?0:Math.round((s.window||60)*(0.3+X.hsh(d*20+hh,s.basis==="slot"?1:2))*(hh>=10&&hh<=15?2:hh<=9||hh>=20?0.5:1)*(d>=4?1.3:1)/4);
  const max=Math.max(1,...days.flatMap((d,di)=>hours.map(hh=>val(di,hh))));
  h+=`<div class="tbl-wrap"><table class="an-heat"><thead><tr><th></th>${hours.map(hh=>`<th>${hh}</th>`).join("")}</tr></thead><tbody>${days.map((d,di)=>`<tr><th>${d}</th>${hours.map(hh=>{const v=val(di,hh);return `<td class="${D.peak&&di===4&&hh===12?"pk":""}" style="background:color-mix(in srgb,var(--sel) ${Math.round(v/max*85)}%,var(--paper));color:${v/max>0.5?"var(--paper)":"var(--ink)"}" title="${d} ${hh}:00 – ${v} orders · avg ${fmt(90+X.ri(di,hh,0,40))}" onclick="document.getElementById('an-pk-detail').innerHTML='<b>${d} ${hh}:00–${hh+1}:00</b> · ${v} orders · average order ${fmt(90+X.ri(di,hh,0,40))}'">${v||""}</td>`}).join("")}</tr>`).join("")}</tbody></table></div><div class="an-detail" id="an-pk-detail">Tap a cell for orders and average order – day labels are Mon–Sun in English on the old page and never translated.</div>`;
  h+=X.sec("Orders by hour of day",`<span class="muted xs">all days together</span>`);
  h+=X.daily(id,hours.map(hh=>({label:hh+":00",v:days.reduce((sum,_,di)=>sum+val(di,hh),0),aov:92+X.ri(hh,7,0,36)})),[{k:"v",l:"Orders"}],{aov:true,unit:"hours"});
  $("#b-"+id).innerHTML=h;
};

/* ===== Seasonality ===== */
window.mount_an_seasonality=function(){
  const A=App,X=A16,$=A.$,ic=A.icon,fmt=A.fmt,D=X.D;const id="an-seasonality";
  const s=X.st(id,{window:24});
  X.head(id,{fresh:"By month · fulfilment date · all channels",controls:`<div class="chips">${[12,24,36].map(w=>`<button class="chip ${s.window===w?"on":""}" onclick="A16.S['an-seasonality'].window=${w};App.remount()">${w} mo</button>`).join("")}</div>`});
  X.url(id,"window="+s.window);if(!X.gate(id))return;
  if(D.empty){$("#b-"+id).innerHTML=X.empty("No orders in this window");return}
  const CHS=["Website","Messengers","Marketplaces","Shop"];
  const rows=Array.from({length:s.window},(_,k)=>{const i=s.window-1-k;const d=new Date(2026,9-i,1);const m=d.getMonth();const seas=[1.4,1.9,1.6,.9,1.05,.85,.8,.75,.9,1.15,.95,1.3][m];const by={};let o=0;CHS.forEach((c,ci)=>{const v=Math.round([120,60,70,40][ci]*seas*(0.85+X.hsh(i,ci+30)*0.3)*(1-i/80));by[c]=v;o+=v});const rev=o*X.ri(i,33,82,118);return {i,d,label:d.toLocaleDateString("en-GB",{month:"short",year:"2-digit"}),key:d.getFullYear()+"-"+String(m+1).padStart(2,"0"),by,o,rev,aov:Math.round(rev/o),running:i===0,imported:i>=s.window-3&&s.window>12}});
  const avg=Math.round(X.sum(rows,r=>r.rev)/rows.length);const best=rows.slice().sort((a,b)=>b.rev-a.rev)[0],worst=rows.slice().sort((a,b)=>a.rev-b.rev)[0];const flagged=rows.filter(r=>r.running||r.imported).length;
  let h=`<div class="grid g4">${X.kpi("Best month",best.label,fmt(best.rev))}${X.kpi("Worst month",worst.label,fmt(worst.rev))}${X.kpi("Average month",fmt(avg),`averaged over ${rows.length} months · ${flagged>1?"imported months included":"live CRM data only"}`)}${X.kpi("Channels","Website · Messengers · Marketplaces","top-3 by revenue")}</div>`;
  h+=X.note(`${ic("info")} Seasonality covers <b>all channels</b>, not only the website.${flagged?` Months marked <b>· running</b> are not finished; <b>· imported</b> came from the old spreadsheet and are shown paler.`:""}`,"mt16");
  h+=X.sec("Revenue by month");
  h+=X.daily(id,rows.map(r=>Object.assign({},r,{v:r.running||r.imported?0:r.rev,pale:r.running||r.imported?r.rev:0,aov:avg})),[{k:"v",l:"Revenue"},{k:"pale",l:"Running / imported"}],{aov:true,aovLabel:"Average month",unit:"months",lineCls:"--ink",h:140});
  h+=X.sec("By month");
  h+=X.tbl([{l:"Month",r:r=>`${r.key}${r.running?' <span class="tag --line">running</span>':""}${r.imported?' <span class="tag --line">imported</span>':""}`},...CHS.map(c=>({l:c,num:true,r:r=>`<span class="an-tip" title="${c} revenue ${fmt(r.by[c]*r.aov)}">${X.n(r.by[c])}</span>`})),{l:"Orders",num:true,r:r=>X.n(r.o)},{l:"Revenue",num:true,r:r=>fmt(r.rev)},{l:"avg",num:true,r:r=>fmt(r.aov)},{l:"Season index",num:true,r:r=>(r.rev/avg).toFixed(2)},{l:"YoY",num:true,r:r=>{const p=rows.find(x=>x.i===r.i+12);return p?`<span class="${r.rev>=p.rev?"pos":"neg"}">${r.rev>=p.rev?"+":"−"}${Math.abs(Math.round((r.rev-p.rev)/p.rev*100))}%</span>`:"–"}}],rows.slice().reverse(),{row:r=>r.running||r.imported?"dim":"",h:380});
  $("#b-"+id).innerHTML=h;
};
