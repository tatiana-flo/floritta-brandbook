   <div class="sf-two mt16"><div><div class="sec-head" style="margin-top:0"><div class="h3">What to fix first</div></div>${tbl([{t:"Check"},{t:"Failing",w:"80px",cls:"num"},{t:"Warnings",w:"90px",cls:"num"},{t:"Passing",w:"80px",cls:"num"}],FIX.map(f=>`<tr><td class="wrap">${esc(f[0])}<span class="sub">${esc(f[1])}</span></td><td class="num accent">${f[2]}</td><td class="num warn">${f[3]}</td><td class="num ok">${f[4]}</td></tr>`),"No pages audited yet")}</div>
   <div><div class="sec-head" style="margin-top:0"><div class="h3">Weakest pages</div></div>${tbl([{t:"Page"},{t:"GEO score",w:"90px",cls:"num"},{t:"Failing",w:"80px",cls:"num"},{t:"Warnings",w:"90px",cls:"num"}],WEAK.map(w=>`<tr><td class="sf-url">${esc(w[0])}</td><td class="num ${w[1]<50?"accent":"warn"}">${w[1]}</td><td class="num">${w[2]}</td><td class="num">${w[3]}</td></tr>`),"No pages audited yet")}</div></div>`
   :`<div class="empty" style="padding:60px">${ic("sparkle")}<div class="h3">No audit yet</div><div class="sm">Run the first audit to see how ChatGPT, Claude, Perplexity and AI Overviews can read floritta.uk: robots for AI bots, llms.txt, schema, answer-first pages.</div><button class="btn --sm" onclick="SF22.S.audited=true;SF22.S.quiet=false;SF22.re();App.toast('Audit finished (demo)')">Run the first audit</button></div>`}`}};

DEFS["seo-brief"]=(p,W)=>{if(p.kw)L2.briefKw=p.kw;const b=L2.brief;

  ${b?`<div class="card mt16 sf-brief"><div class="row mb8"><div class="h3">${esc(b.kw)}</div><span class="tag ${b.ai?"--ink":"--line"}">${b.ai?"AI":"stub"}</span><span class="sp"></span><span class="xs accent">Draft only – review before publishing.</span></div><dl class="kv" style="grid-template-columns:150px 1fr"><dt>Intent</dt><dd>${b.intent}</dd><dt>Title</dt><dd>${esc(b.title)}</dd><dt>Meta</dt><dd>${esc(b.meta)}</dd><dt>Headings</dt><dd>${b.h.map(esc).join("<br>")}</dd><dt>Entities to cover</dt><dd>${b.ent.join(", ")}</dd><dt>Internal links</dt><dd class="sf-url">${b.links.join("<br>")}</dd><dt>FAQ questions</dt><dd>${b.faq.map(esc).join("<br>")}</dd><dt>Schema</dt><dd>${b.schema}</dd></dl><div class="btn-row mt16"><button class="btn --ghost --sm" onclick="App.toast('Copied to clipboard')">${ic("copy")} Copy brief</button><button class="btn --ghost --sm" onclick="App.go('sf-landing')">Create landing page</button></div></div>`:""}`,after(sec){const i=sec.querySelector("#br-kw");if(i){i.oninput=()=>{L2.briefKw=i.value;const g=sec.querySelector("#br-go");if(g)g.disabled=!i.value.trim()};i.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();window.SFX.briefGen()}})}}}};

/* ===== SEO · ROLLOUT ===== */
DEFS["seo-rollout"]=(p,W)=>{const Q=S.quiet;const col=(st,t,empty,extra)=>{const list=Q?[]:TASKS.filter(x=>x.status===st).sort((a,b)=>a.p.localeCompare(b.p)||b.impact-a.impact);
   return `<div class="kcol" style="min-height:260px"><div class="k-head">${t}<span class="n">${list.length}</span></div><div class="k-body">${list.length?list.map(x=>`<div class="sf-task"><div class="row" style="gap:6px"><span class="tag ${x.p==="P1"?"--accent":""}" style="${x.p==="P2"?"background:var(--warn-bg);color:var(--warn)":""}">${x.p}</span><span class="tt">${esc(x.t)}</span></div><div class="meta">${x.area} · impact ${x.impact} · effort ${x.effort}</div><div class="act">${esc(x.why)}</div><div class="act"><b style="font-weight:400">Do:</b> ${esc(x.act)}</div><div class="meta">→ ${esc(x.metric)}</div>${W?`<div class="btn-row">${st==="draft"?`<button class="btn --sm" onclick="SFX.task(${x.id},'accepted')">Accept</button><button class="btn --ghost --sm" onclick="SFX.taskDismiss(${x.id})">Dismiss</button>`:st==="accepted"?`<button class="btn --sm" onclick="SFX.task(${x.id},'done')">Mark done</button>`:""}</div>`:""}</div>`).join(""):`<div class="empty" style="padding:24px">${ic("check")}<div class="sm">${empty}</div>${extra||""}</div>`}</div></div>`};
  return {body:`<div class="sf-cols">${col("draft","Suggested","No suggestions – run the analyst on Machine",`<button class="btn --ghost --sm" onclick="App.go('seo-machine')">Open Machine</button>`)}${col("accepted","Accepted","Nothing accepted yet")}${col("done","Done","Nothing done yet")}</div>
  <div class="sec-head"><div class="h3">Exit criteria</div><span class="xs muted">hard-coded in the controller – not computed</span></div><div class="grid g3"><div class="card"><span class="caps">Avg position</span><span class="kpi-s">25.6 → ≤18</span></div><div class="card"><span class="caps">CTR</span><span class="kpi-s">1.3% → ≥2.5%</span></div><div class="card"><span class="caps">Top-20 keywords</span><span class="kpi-s">4 → 20</span></div></div>`}};

DEFS["seo-gbp"]=(p,W)=>({body:`<div class="note-box mb16">${ic("info")} Read-only plan of Google Business posts (SocialPost channel=gbp). No auto-publish on dev – media converts to WebP. Posts are created and edited in Marketing.</div>${tbl([{t:"Post"},{t:"Date",w:"110px"},{t:"Status",w:"110px"}],(S.quiet?[]:GBP).map(g=>`<tr><td class="wrap">${esc(g[0])}</td><td class="xs">${g[1]}</td><td><span class="tag ${g[2]==="published"?"--ok":"--line"}">${g[2]}</span></td></tr>`),"No posts","calendar")}`});

/* ===== CONTENT (CRM-only CMS) ===== */
const cmsNote=`<div class="note-box mb16">${ic("info")} This CMS lives inside the CRM and is not read by floritta.uk. For the live site use Storefront → <button class="textbtn" onclick="App.go('sf-site-pages')">Site pages</button>, <button class="textbtn" onclick="App.go('sf-news')">News</button>, <button class="textbtn" onclick="App.go('sf-faq')">FAQ</button>.</div>`;
const sanit=(really)=>really?"Rich text is sanitized on save (script / style / on* removed).":"<span class='warn'>Current CRM promises sanitising here but does not sanitise this field – proposed: sanitise everywhere.</span>";
DEFS["content"]=(p,W)=>({actions:`<button class="btn --sm" onclick="SFX.cmsNew('page')">${ic("plus")} New page</button>`,body:cmsNote+tbl([{t:"Title"},{t:"Slug"},{t:"Status",w:"110px"},{t:"Updated",w:"90px"}],(S.quiet?[]:CPAGES).map(r=>`<tr><td>${esc(r[0])}</td><td class="sf-url">${esc(r[1])}</td><td>${H().tag(r[2]==="published","Published","Draft")}</td><td class="xs">${r[3]}</td></tr>`),"No pages")+`<div class="sf-note">Newest first. No edit or delete in the current CRM – create only.</div>`});
DEFS["content-news"]=(p,W)=>({actions:`<button class="btn --sm" onclick="SFX.cmsNew('article')">${ic("plus")} New article</button>`,body:cmsNote+tbl([{t:"Title"},{t:"Author",w:"140px"},{t:"Status",w:"110px"},{t:"Published",w:"100px"}],(S.quiet?[]:CARTS).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${H().tag(r[2]==="published","Published","Draft")}</td><td class="xs">${r[3]||"–"}</td></tr>`),"No articles")});
DEFS["content-faq"]=(p,W)=>({actions:`<button class="btn --sm" onclick="SFX.cmsNew('faq')">${ic("plus")} New FAQ</button>`,body:cmsNote+tbl([{t:"Question"},{t:"Category",w:"120px"},{t:"Status",w:"100px"}],(S.quiet?[]:CFAQ).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${H().tag(r[2]==="active")}</td></tr>`),"No FAQs")+`<div class="sf-note">Ordered by position. Reordering is not in the UI (the reorder route exists but nothing calls it).</div>`});
DEFS["content-authors"]=(p,W)=>({actions:`<button class="btn --sm" onclick="SFX.cmsNew('author')">${ic("plus")} New author</button>`,body:cmsNote+tbl([{t:"Name",w:"200px"},{t:"Bio"}],(S.quiet?[]:CAUTH).map(r=>`<tr><td>${esc(r[0])}</td><td class="wrap">${esc(r[1])}</td></tr>`),"No authors")+`<div class="sf-note">Authors for Content → News only – not the blog authors on the site.</div>`});
DEFS["content-menus"]=(p,W)=>({body:cmsNote+(S.quiet?`<div class="empty">${ic("list")}<div class="h3">No menus</div></div>`:`<div class="sf-menu">${CMENUS.map(m=>`<div class="panel"><div class="p-head"><div class="h4">${esc(m.name)}</div><span class="xs muted">${m.loc}</span></div><div class="p-body">${m.items.length?m.items.map(i=>`<div class="sf-mi"><span class="nm">${esc(i[0])}</span><span class="sf-url">${esc(i[1])}</span></div>`).join(""):`<div class="empty" style="padding:20px">${ic("list")}<div class="sm">No items</div></div>`}</div></div>`).join("")}</div><div class="sf-note">Read-only view of the CRM menu table. The real site menus are in Storefront → Menus (the old subtitle “Storefront navigation menus” was misleading).</div>`)});
DEFS["content-reference"]=(p,W)=>{const q=L2.refQ.toLowerCase();const rows=(S.quiet?[]:CREF).filter(r=>!q||r.some(c=>c.toLowerCase().includes(q)));
  return {actions:`<button class="btn --sm" onclick="SFX.cmsNew('reference')">${ic("plus")} New entry</button>`,body:cmsNote+`<div class="toolbar"><label class="search">${ic("search")}<input id="rf-q" placeholder="Search title, category, text" value="${esc(L2.refQ)}"></label><button class="btn --secondary --sm" onclick="SFX.refApply()">Apply</button><span class="xs muted">server search · the query goes to the URL (?q=) · Enter applies</span></div>${tbl([{t:"Title",w:"220px"},{t:"Category",w:"120px"},{t:"Body"}],rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="wrap xs">${esc(r[2])}</td></tr>`),"No entries")}`,after(sec){const i=sec.querySelector("#rf-q");if(i)i.addEventListener("keydown",e=>{if(e.key==="Enter")window.SFX.refApply()})}}};
DEFS["content-languages"]=(p,W)=>({body:cmsNote+`<div class="note-box --warn mb16">${ic("alert")} Subtitle in the current CRM says “Drives the EN/RU toggle”, but no code reads this table any more.</div>`+tbl([{t:"Language"},{t:"Default",w:"100px"},{t:"Status",w:"100px"},{t:"",w:"110px"}],(S.quiet?[]:LANGS).map(l=>`<tr><td>${esc(l.name)} <span class="muted">(${l.code})</span></td><td>${l.def?`<span class="tag --ink">default</span>`:""}</td><td>${H().tag(l.on)}</td><td class="num">${W&&!l.def?`<button class="textbtn ${l.on?"--accent":""}" onclick="SFX.langToggle('${l.code}')">${l.on?"Deactivate":"Activate"}</button>`:l.def?`<span class="xs muted">cannot be switched off</span>`:""}</td></tr>`),"No languages")});
DEFS["content-report"]=(p,W)=>({body:cmsNote+`<div class="sf-kpis">${[["Pages",CPAGES.length,"content"],["Articles",CARTS.length,"content-news"],["FAQs",CFAQ.length,"content-faq"],["Authors",CAUTH.length,"content-authors"]].map(k=>`<div class="kpi-card" onclick="App.go('${k[2]}')"><span class="caps">${k[0]}</span><span class="kpi">${S.quiet?0:k[1]}</span><span class="delta">CRM-CMS records, not the site</span></div>`).join("")}</div>`});
Object.assign(window.SFX,{
  cmsNew(kind){const f={page:[["Title",true],["Body","ta",true],["SEO title"],["Status","sel",["draft","published"]]],article:[["Title",true],["Author","sel",CAUTH.map(a=>a[0])],["Body","ta",false],["Status","sel",["draft","published"]],["Publish date"]],faq:[["Question",true],["Answer","ta",false],["Category"]],author:[["Name",true],["Bio","ta",false]],reference:[["Title",true],["Category"],["Body","ta",false]]}[kind];const ttl={page:"New page",article:"New article",faq:"New FAQ",author:"New author",reference:"New entry"}[kind];
    App.sheet({eyebrow:"Content · CRM-only CMS",title:ttl,body:`<div class="col" style="gap:14px">${f.map((x,i)=>{const id="cm-"+i;if(x[1]==="ta")return fld(id,x[0],"",{type:"textarea",hint:sanit(kind==="page"&&x[0]==="Body")});if(x[1]==="sel")return fld(id,x[0],x[2][0],{type:"select",opts:x[2]});return fld(id,x[0],"",{req:x[1]===true,hint:x[0]==="Category"&&S.errors?"":""})}).join("")}<div class="xs muted">Slug is made from the title (unique: -2, -3…). Audited as ${kind}.create. ${f.length===1?"Enter saves.":"Several fields – Save with the button."}</div></div>`,foot:saveFoot(`SFX.cmsSave('${kind}')`,"Create")})},
  cmsSave(kind){if(!need(["cm-0"]))return;if(S.errors){err("cm-"+(kind==="faq"?2:1),"The server rejected this field (shown here; current CRM shows nothing)");return}const v=i=>val("cm-"+i);
    if(kind==="page")CPAGES.unshift([v(0),v(0).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),v(3),"Today"]);else if(kind==="article")CARTS.unshift([v(0),v(1),v(3),v(3)==="published"?(v(4)||"Today"):""]);else if(kind==="faq")CFAQ.push([v(0),v(2)||"General","active"]);else if(kind==="author")CAUTH.push([v(0),v(1)]);else CREF.push([v(0),v(1)||"General",v(2)]);App.closeSheet();window.SF22.re();App.toast("Created · audit "+kind+".create")},
  refApply(){const i=document.getElementById("rf-q");L2.refQ=i?i.value:"";window.SF22.re();App.toast("URL: /content/reference?q="+encodeURIComponent(L2.refQ))},
  langToggle(code){const l=LANGS.find(x=>x.code===code);if(l.def){App.toast("The default language cannot be deactivated");return}l.on=!l.on;window.SF22.re();App.toast(`${l.name} ${l.on?"activated":"deactivated"} · audit language.toggle`)}
});
})();
</script>
