<style>
/* ===== 55-orders · prefix ob- (board, new order, not sent, unpaid) – uses o5- helpers from 11-order ===== */
#s-ord-board .scr-body{padding-bottom:calc(var(--tab-h) + var(--safe-b) + 24px)}
.ob-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px var(--gutter) 0}
.ob-tabs::-webkit-scrollbar{display:none}
.ob-tab{flex:none;height:34px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite);border:1px solid var(--light);background:var(--paper);white-space:nowrap}
.ob-tab b{font-weight:400;color:var(--grey);font-variant-numeric:tabular-nums}
.ob-tab.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ob-tab.on b{color:rgba(253,253,253,.7)}
.ob-tab.--alert{background:var(--accent);border-color:var(--accent);color:#fff}
.ob-tab.--alert b{color:rgba(255,255,255,.8)}
.ob-tab.--alert.on{box-shadow:inset 0 0 0 2px var(--ink)}
.ob-search{display:flex;gap:8px;align-items:center;padding:12px var(--gutter) 0}
.ob-search .input-wrap{flex:1}
.ob-search .input{height:44px}
.ob-shift{padding:10px var(--gutter) 0;font-size:12px;color:var(--grey)}
.ob-shift b{font-weight:400;color:var(--graphite)}
.ob-banner{margin:12px var(--gutter) 0;padding:12px 14px;background:var(--warn-bg);font-size:13px;display:flex;align-items:center;gap:10px}
.ob-banner .btn{flex:none}
.ob-banner.--ink{background:var(--silver)}
.ob-row{display:flex;gap:12px;padding:12px var(--gutter);border-bottom:1px solid var(--hair);position:relative;width:100%;text-align:left}
.ob-row.--att{box-shadow:inset 3px 0 0 var(--accent)}
.ob-row.--qchg{box-shadow:inset 3px 0 0 var(--ink)}
.ob-row.--apv-ok{box-shadow:inset 3px 0 0 var(--ok)}
.ob-row.--apv-fb{box-shadow:inset 3px 0 0 var(--warn)}
.ob-th{width:64px;align-self:stretch;min-height:96px;flex:none;position:relative;background:var(--silver);overflow:hidden}
.ob-th img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ob-th .more{position:absolute;right:0;bottom:0;background:var(--ink);color:var(--paper);font-size:10px;padding:2px 5px}
.ob-th .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--grey)}
.ob-th .ph svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.ob-num{position:absolute;left:0;top:0;width:22px;height:22px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:500;z-index:2}
.ob-main{flex:1;min-width:0}
.ob-l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ob-code{font-family:var(--f-display);font-size:18px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.ob-crm{font-size:11px;color:var(--grey)}
.ob-l2{font-size:13px;color:var(--graphite);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ob-items{font-size:13px;color:var(--ink);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.ob-l3{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--grey);flex-wrap:wrap}
.ob-l3 .sp{flex:1}
.ob-l3 .tot{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.ob-l3 svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;vertical-align:-2px}
.ob-chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;background:var(--silver);color:var(--graphite)}
.ob-chip.--ok{background:var(--ok-bg);color:var(--ok)}.ob-chip.--fb{background:var(--warn-bg);color:var(--warn)}.ob-chip.--new{background:var(--ink);color:var(--paper)}.ob-chip.--moved{background:var(--silver);color:var(--ink)}.ob-chip.--removed{background:var(--accent-bg);color:var(--accent)}.ob-chip.--day{border:1px solid var(--light);background:transparent}
.ob-chip svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8}
.ob-act{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ob-act button.o5-plate{cursor:pointer}
.ob-act .sub{font-size:11px;color:var(--grey)}
.ob-act .sub.err{color:var(--accent)}
.ob-act .sm-ed{font-size:12px;color:var(--graphite);border-bottom:1px solid var(--light)}
.ob-sec{display:flex;align-items:baseline;gap:10px;margin:22px var(--gutter) 6px}
.ob-sec .h3{flex:1}
.ob-sec .n{font-size:12px;color:var(--grey)}
.ob-foot{padding:16px var(--gutter);font-size:12px;color:var(--grey);text-align:center}
.ob-redirect{margin:24px var(--gutter) 0}
.ob-day{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ob-day button{height:52px;border:1px solid var(--light);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ob-day button small{font-size:10px;color:var(--grey);letter-spacing:.06em;text-transform:uppercase}
.ob-day button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ob-day button.on small{color:rgba(253,253,253,.7)}
.ob-dc{margin:18px var(--gutter) 0;border:1px solid var(--light);padding:14px}
.ob-dc .hd{display:flex;align-items:center;gap:10px}
.ob-dc .hd .h4{flex:1}
.ob-dc .sw{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair);font-size:14px}
.ob-dc .sw .switch{margin-left:auto}
.ob-dc .ph{width:88px;height:88px;background:var(--silver);overflow:hidden;position:relative}
.ob-dc .ph img{width:100%;height:100%;object-fit:cover}
/* new order */
#s-ord-new .scr-body{padding-bottom:calc(var(--btn-h) + 56px + var(--safe-b))}
.on-lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);margin:26px var(--gutter) 10px}
.on-sug{margin:0 var(--gutter)}
.on-sug button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--hair);font-size:14px}
.on-sug button span:last-child{color:var(--grey);flex:none}
.on-cust{display:flex;align-items:center;gap:10px;margin:0 var(--gutter);padding:10px 12px;border:1px solid var(--ink)}
.on-cust .x{margin-left:auto;width:28px;height:28px;display:grid;place-items:center}
.on-cust .x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
.on-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair);margin:0 var(--gutter);font-size:14px}
.on-item .f1 small{display:block;color:var(--grey);font-size:12px}
.on-err{margin:0 var(--gutter) 8px;font-size:13px;color:var(--accent)}
/* unsent */
.un-row{padding:14px var(--gutter);border-bottom:1px solid var(--hair)}
.un-row .t{font-size:15px}
.un-row .s{font-size:12px;color:var(--grey);margin-top:3px}
.un-row .s.--red{color:var(--accent)}
.un-row .s.--amber{color:var(--warn)}
.un-row .b{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* unpaid */
.up-row{display:block;width:100%;text-align:left;padding:14px var(--gutter);border-bottom:1px solid var(--hair)}
.up-row .l1{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.up-row .l1 b{font-weight:500;font-variant-numeric:tabular-nums}
.up-row .l2{font-size:13px;color:var(--graphite);margin-top:3px}
.up-row .l3{font-size:12px;color:var(--grey);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.up-row .l3 .ok{color:var(--ok)}
</style>

<section class="scr" id="s-ord-board" data-tab="work" data-nav="Orders board" data-group="Work · Orders">

</section>

  <div class="appbar"><button class="ib" aria-label="Back" onclick="App.back('ord-board')"></button><div class="ttl">New order</div></div>

<section class="scr" id="s-ord-unsent" data-nav="Not sent (offline queue)" data-group="Work · Orders">

</section>

<!-- ======================= UNPAID ======================= -->

<section class="scr" id="s-ord-unpaid" data-nav="Unpaid orders" data-group="Work · Orders">
  <div class="appbar"><button class="ib" aria-label="Back" onclick="App.back('ord-board')"></button><div class="ttl">Unpaid</div></div>
  <div class="scr-body" id="up-body"></div>
</section>

<script>
(function(){
const A=window.App, I=A.icon, T=A.T;
const $=id=>document.getElementById(id);
const O5=()=>window.O5;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.querySelectorAll('#s-ord-new .appbar .ib,#s-ord-unsent .appbar .ib,#s-ord-unpaid .appbar .ib').forEach(b=>b.innerHTML=I('back'));
/* ======================= BOARD ======================= */
const OB=window.OB={tab:null,q:'',day:null,ackQueue:false,search:false,dc:{flowers:false,shortage:false,packaging:false,photo:null,rubbish:null,rubbishPhoto:null,open:false}};
let qTimer=null;
const TABS=(first,florist)=>florist?[['todo','Not ready'],['today','Today'],['mine',first],['handover','To hand over'],['tomorrow','Tomorrow'],['attention','Special attention'],['other','Other day'],['closed','Closed']]
  :[['today','Today'],['todo','Not ready'],['mine',first],['handover','To hand over'],['delivering','Delivering'],['tomorrow','Tomorrow'],['attention','Special attention'],['other','Other day'],['closed','Closed']];
const open=o=>o.status!=='fulfilled'&&o.status!=='cancelled';
const closed24=o=>(o.status==='fulfilled'||o.status==='cancelled')&&(O5().now()-new Date(o.fulfilledAt||o.cancelledAt||0))<864e5;
OB.filter=(tab)=>{const O=O5(),me=A.state.me;const all=O.orders;
  if(OB.q){const q=OB.q.toLowerCase();return all.filter(o=>o.code.includes(q)||(o.crmCode||'').toLowerCase().includes(q)||o.customer.name.toLowerCase().includes(q)||(o.recipient||'').toLowerCase().includes(q)||(o.postcode||'').toLowerCase().includes(q)||o.items.some(i=>i.title.toLowerCase().includes(q)))}
  switch(tab){
    case 'today':return all.filter(o=>o.date===O.TODAY&&open(o));
    case 'todo':return all.filter(o=>o.date===O.TODAY&&(o.status==='unconfirmed'||o.status==='in_production'));
    case 'mine':return all.filter(o=>open(o)&&(o.assignedTo===me||(o.queue&&o.queue.florist===me)));
    case 'handover':return all.filter(o=>o.status==='ready');
    case 'delivering':return all.filter(o=>o.status==='out_for_delivery');
    case 'tomorrow':return all.filter(o=>o.date===O.TOMORROW&&open(o));
    case 'attention':return all.filter(o=>o.attention&&o.attention.on&&open(o));
    case 'other':return OB.day?all.filter(o=>o.date===OB.day):[];
    case 'closed':return all.filter(closed24);
  }return []};
OB.counts=tabs=>Object.fromEntries(tabs.map(t=>[t[0],t[0]==='other'?null:OB.filter(t[0]).length]));
const chan=o=>`<span class="o5-channel --${o.channel}">${O5().CH[o.channel]||o.channel}</span>`;
const itemsLine=o=>o.items.map(i=>`${i.qty}× ${esc(i.title)}`).join(', ');
const approvalChip=o=>{const ap=o.approval;if(!ap||ap.acked||!ap.replies.length)return '';return ap.verdict==='approved'?`<span class="ob-chip --ok">${I('check')} Customer approved</span>`:`<span class="ob-chip --fb">${I('chat')} Changes / feedback</span>`};
const queueChip=o=>o.queue&&o.queue.changed&&!OB.ackQueue?`<span class="ob-chip --${o.queue.changed}">${{moved:'Moved',new:'New',removed:'Removed'}[o.queue.changed]}</span>`:'';
/* board status button – one next step, coloured by the current status, labelled by the next */
OB.plateBtn=o=>{const O=O5(),R=O.roles(),s=o.status,c=o.code;const multi=o.unitCount>1,us=O.unitSummary(o);const taken=!!o.assignedTo;
  const btn=(label,fn,opts={})=>`<button class="o5-plate --${opts.neutral?'unconfirmed':s}" onclick="event.stopPropagation();${fn}">${label} ›</button>`;
  if(R.trainee||R.courier)return O.plate(o,null,{static:true});
  if(s==='unconfirmed')return btn('Confirm',`O5.confirm('${c}')`,{neutral:true});
  if(s==='in_production'&&multi&&!us.done)return btn(`Take order · ${us.done}/${us.total}`,`O5.itemFlorists('${c}')`);
  if(s==='in_production'&&!taken)return btn('Take order',`O5.pickFlorist('${c}')`);
  if(s==='in_production')return btn('Ready',`O5.pressReady('${c}')`)+(multi?`<button class="sm-ed" onclick="event.stopPropagation();O5.itemFlorists('${c}')">Take order · ${us.done}/${us.total} ✎</button>`:`<button class="sm-ed" onclick="event.stopPropagation();O5.pickFlorist('${c}')">With ${O.nm(o.assignedTo)} ✎</button>`);
  if((s==='ready'||s==='out_for_delivery')&&O.isCollection(o))return btn('Collected',`O5.complete('${c}')`);
  if(s==='ready'&&!O.noMethod(o))return btn('Hand to courier',`O5.dispatch('${c}')`);
  if(s==='out_for_delivery'&&R.canManage&&!O.noMethod(o))return btn('Confirm delivery',`App.go('order',{code:'${c}'})`);
  return O.plate(o,null,{static:true})};
OB.row=(o,opts={})=>{const O=O5();const first=o.items[0]||{};const cls=o.attention&&o.attention.on?'--att':o.approval&&!o.approval.acked&&o.approval.replies.length?(o.approval.verdict==='approved'?'--apv-ok':'--apv-fb'):o.queue&&o.queue.changed&&!OB.ackQueue?'--qchg':'';
  const closed=opts.closed;const n=opts.num;
  const l2=closed?`<span>${O.dayLabel(o.date)}${o.slot?' · '+esc(o.slot):''}</span>`:`<span>${o.method==='collection'?'Collection':o.slot?esc(o.slot):'no slot'}${o.method==='delivery'&&o.postcode?' · '+esc(o.postcode):''}${O.noMethod(o)?' · <span class="accent">no method</span>':''}</span>`;
  const who=closed?`${I('flower')} ${O.units(o).map(u=>o.itemFlorists[u.key]?O.nm(o.itemFlorists[u.key])+': '+esc(u.title.split(' · ')[0]):null).filter(Boolean).join(' · ')||(o.assignedTo?O.nm(o.assignedTo):'nobody named')}`:(o.assignedTo?`${I('flower')} ${O.nm(o.assignedTo)}`:esc(o.customer.name));
  const tot=closed?'':`<span class="tot">${A.fmt(o.money?o.money.total:o.total)}</span>`;
  const qline=!closed&&o.queue&&OB.tab!=='mine'&&!OB.q?`<span class="xs muted">Queue: ${O.nm(o.queue.florist)} №${o.queue.position}</span>`:'';
  const dayBadge=opts.num&&o.date!==O.TODAY?`<span class="ob-chip --day">For ${O.dayLabel(o.date).toLowerCase()}</span>`:'';
  const notice=o.offlineNotice?`<span class="sub ${o.offlineNotice.err?'err':''}">${o.offlineNotice.err||'Saved on this phone'}</span>`:'';
  return `<div class="ob-row ${cls}" onclick="${closed?`O5.itemFlorists('${o.code}',{closed:true})`:`App.go('order',{code:'${o.code}'})`}"><div class="ob-th">${n?`<span class="ob-num">${n}</span>`:''}${first.img?`<img src="${first.img}" alt="">`:`<span class="ph">${I('flower')}</span>`}${o.items.length>1?`<span class="more">+${o.items.length-1}</span>`:''}</div><div class="ob-main"><div class="ob-l1">${chan(o)}<span class="ob-code">№${o.code}</span>${o.crmCode?`<span class="ob-crm">CRM ${o.crmCode}</span>`:''}${o.attention&&o.attention.on?`<span class="accent">${I('flag').replace('<svg','<svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;vertical-align:-2px"')}</span>`:''}<span style="margin-left:auto">${closed?'':O.sla(o)}</span></div><div class="ob-l2">${l2}${approvalChip(o)}${queueChip(o)}${dayBadge}</div><div class="ob-items">${itemsLine(o)}</div><div class="ob-l3"><span>${who}</span>${qline}<span class="sp"></span>${tot}</div><div class="ob-act">${closed?`<button class="o5-plate --in_production" onclick="event.stopPropagation();O5.itemFlorists('${o.code}',{closed:true})">Who made it ›</button>${O.plate(o,null,{sm:true,static:true})}`:OB.plateBtn(o)}${notice}</div></div></div>`};
OB.setTab=t=>{OB.tab=t;if(t==='other'&&!OB.day){OB.dayPicker();return}OB.render()};
OB.dayPicker=()=>{const O=O5();const days=[];for(let i=-3;i<=16;i++){if(i===0||i===1)continue;days.push(O.addDays(O.TODAY,i))}
  A.sheet(`<!-- ids: TM-CLASSIC-009 --><div class="sh-head"><div class="h3">Which day?</div><button class="ib" onclick="App.closeSheet()">${I('close')}</button></div><div class="sh-body"><div class="xs muted mb12">Three days back and two weeks ahead – today and tomorrow have their own tabs.</div><div class="ob-day">${days.map(d=>{const x=new Date(d+'T12:00:00');return `<button class="${OB.day===d?'on':''}" onclick="OB.pickDay('${d}')"><small>${x.toLocaleDateString('en-GB',{weekday:'short'})}</small>${x.getDate()} ${x.toLocaleDateString('en-GB',{month:'short'})}</button>`}).join('')}</div></div>`,{full:true})};
OB.pickDay=d=>{OB.day=d;OB.tab='other';App.closeSheet();OB.render()};
OB.input=v=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{OB.q=v.trim();OB.render(true)},300)};
OB.toggleSearch=()=>{OB.search=!OB.search;if(!OB.search){OB.q=''}OB.render();if(OB.search){const i=$('ob-q');if(i)i.focus()}};
OB.refresh=()=>{A.toast('Board and dashboard refreshed');OB.render()};
OB.ack=()=>{OB.ackQueue=true;O5().orders.forEach(o=>{if(o.queue&&o.queue.changed==='removed')o.queue=null;else if(o.queue)o.queue.changed=null});A.toast('Queue changes acknowledged');OB.render()};
OB.pushQueue=()=>A.push('Queue changed','Valeria moved #715611 to №2 in your queue',{icon:'list',go:['ord-board',{tab:'mine'}]});
OB.brokenLink=()=>App.go('order',{code:'NaN'});
window.mount_ord_board=function(p){
  const O=O5(),R=O.roles(),me=A.me();
  if(p&&p.tab&&p.tab!==OB.seenTab){OB.seenTab=p.tab;OB.tab=p.tab}
  if(!OB.tab)OB.tab=R.florist?'todo':'today';
  OB.render(false,p)};
OB.render=(keepFocus,p)=>{const O=O5(),R=O.roles(),me=A.me();
  $('ob-bar').innerHTML=`<div class="ttl">Orders</div>${R.courier?'':`<button class="ib" aria-label="Search" onclick="OB.toggleSearch()">${I('search')}</button>`}${!R.trainee&&!R.courier?`<button class="ib" aria-label="New order" onclick="App.go('ord-new')">${I('plus')}</button>`:''}`;
  let h=O.demoBar(R.mgr?['offline','viewAs','tempPass','evening','loadError']:['offline','tempPass','evening','loadError']);
  h+=`<div class="o5-demo" style="padding-top:4px"><span class="lbl">Demo</span><button class="chip" onclick="OB.pushQueue()">Push: queue changed</button><button class="chip" onclick="OB.brokenLink()">Broken link</button><button class="chip" onclick="App.go('ord-unsent')">Not sent</button>${R.mgr?`<button class="chip" onclick="App.go('ord-unpaid')">Unpaid</button><button class="chip" onclick="App.go('ord-due')">Due customers</button><button class="chip" onclick="App.go('ord-leads')">Site leads</button><button class="chip" onclick="App.go('ord-calls')">Missed calls</button>`:''}</div>`;

window.mount_ord_unsent=function(){const O=O5();const q=O.myQueue();
  let h=O.demoBar(['offline'])+O.offlineBanner();
  h+=`<div class="pad mt12"><p class="sm soft" style="margin:0"><!-- ids: TM-CLASSIC-058 -->What the phone did not manage to send to the CRM: statuses, bouquet photos and proof-of-delivery photos. Only records that the CRM accepts twice without harm wait here – money, cancellations and edits never do.</p></div>`;
  if(!q.length)h+=`<div class="o5-empty mt16"><!-- ids: TM-CLASSIC-058 --><b>Everything is sent</b>Nothing is waiting on this phone.</div>`;
  else{h+=`<div class="pad mt12"><button class="btn --block" onclick="O5.syncNow()"><!-- ids: TM-CLASSIC-053 -->${I('send')} Send now</button><div class="xs muted mt8" style="text-align:center">Forces a pass through the queue, ignoring the back-off pauses.</div></div>`;
    h+=q.map(w=>{const red=w.state==='parked'&&w.parkReason!=='blocked';const amber=w.state==='queued'&&w.attempts>0;const o=O.order(w.code);
      return `<div class="un-row"><!-- ids: TM-CLASSIC-052 --><div class="t">${O.describe(w)}</div><div class="s ${red?'--red':amber?'--amber':''}">${O.statusLine(w)} · ${A.fmtDue(w.at)}</div><div class="b">${w.state==='parked'?(w.refusal==='bouquet_photo'?`<button class="btn --sm" onclick="App.go('order',{code:'${w.code}',photo:1})"><!-- ids: TM-CLASSIC-055 -->${I('camera')} Take a photo</button>`:`<button class="btn --sm" onclick="O5.retry(${w.id})"><!-- ids: TM-CLASSIC-054 -->Retry</button>`):''}<button class="btn --sm --ghost" onclick="O5.discard(${w.id})"><!-- ids: TM-CLASSIC-056 -->Discard</button>${o?`<button class="btn --sm --ghost" onclick="App.go('order',{code:'${w.code}'})">Open order</button>`:''}</div></div>`}).join('')}
  h+=`<div class="pad mt16"><div class="xs muted" style="line-height:1.6"><!-- ids: TM-CLASSIC-057 -->Sends by itself: when the queue loads, when the connection returns, when the app comes to the foreground, and every 60 s. Order of sending: strictly per order. 5xx / 408 / 429 retry with growing pauses (5 s → 10 min, parked after 12 failures); any other 4xx parks the record and everything behind it on the same order. Up to 40 records; the queue belongs to your login and lives in a file on this phone.</div></div><div style="height:24px"></div>`;
