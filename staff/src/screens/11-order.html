OD.queueSheet=code=>{const o=O5.order(code);let f=o.queue?o.queue.florist:'kamila',pos=o.queue?o.queue.position:1,day=o.queue?(o.queue.date===O5.TODAY?'today':'delivery'):'today';const future=o.date!==O5.TODAY;
  const draw=()=>`<!-- ids: TM-ORDER-013 --><div class="sh-head"><div class="h3">Production queue · #${code}</div><button class="ib" onclick="App.closeSheet()">${I('close')}</button></div><div class="sh-body"><div class="caps muted mb8">Florist</div><div class="flex g8" style="flex-wrap:wrap">${O5.florists().map(x=>`<button class="chip ${f===x.id?'on':''}" onclick="OD._q('f','${x.id}')">${x.n}</button>`).join('')}</div><div class="caps muted mt16 mb8">Position</div><div class="flex ai-c g8"><button class="chip ${pos===1?'on':''}" onclick="OD._q('pos',1)">First</button><button class="chip ${pos===99?'on':''}" onclick="OD._q('pos',99)">Last</button><span class="o5-stepper"><button onclick="OD._q('pos',${Math.max(1,pos-1)})">${I('minus')}</button><span>${pos}</span><button onclick="OD._q('pos',${Math.min(99,pos+1)})">${I('plus')}</button></span></div>${future?`<div class="caps muted mt16 mb8">When</div><div class="flex g8"><button class="chip ${day==='today'?'on':''}" onclick="OD._q('day','today')">Make today</button><button class="chip ${day==='delivery'?'on':''}" onclick="OD._q('day','delivery')">On the delivery day</button></div>`:''}<button class="textbtn mt16" onclick="OD._qnone('${code}')">Nobody – remove from the queue</button></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Back</button><button class="btn" onclick="OD._qgo('${code}')">Assign</button></div>`;
  OD._q=(k,v)=>{if(k==='f')f=v;if(k==='pos')pos=v;if(k==='day')day=v;A.sheet(draw(),{full:true})};
  OD._qgo=c=>{if(O5.demo.offline){A.toast('No connection – the queue needs the network');return}o.queue={florist:f,position:pos,changed:'new',date:day==='today'?O5.TODAY:o.date};App.closeSheet();A.toast(`№${pos} in ${O5.nm(f)}’s queue`);setTimeout(()=>A.push('Queue changed','#'+c+' is №'+pos+' in your queue',{icon:'list',to:O5.nm(f),go:['ord-board',{tab:'mine'}]}),600);O5.remount()};
  OD._qnone=()=>{o.queue=null;App.closeSheet();A.toast('Removed from the queue');O5.remount()};
  A.sheet(draw(),{full:true})};
OD.courierSheet=code=>{const o=O5.order(code);const adv='andrii';
  A.sheet(`<!-- ids: TM-ORDER-014 --><div class="sh-head"><div class="h3">Courier for #${code}</div><button class="ib" onclick="App.closeSheet()">${I('close')}</button></div><div class="sh-body"><div class="panel mb12"><div class="caps muted">Dispatcher advice</div><div class="sm mt4">Andrii – 2 drops within 1.5 km, back at the shop by 13:40.</div></div>${O5.couriers().map(c=>`<button class="o5-pick ${o.courier===c.id?'on':''}" onclick="OD._csel('${code}','${c.id}','${adv}')">${A.avatar(c,'--shift')}<span class="f1"><span class="h4">${c.n}${c.id===adv?' · suggested':''}</span><span class="xs">${c.title}${c.onShift?' · on shift':' · off today'}</span></span>${o.courier===c.id?I('check'):''}</button>`).join('')}<button class="o5-pick" onclick="OD._csel('${code}',null,'${adv}')"><span class="o5-ph">–</span><span class="f1"><span class="h4">Nobody</span><span class="xs">Leave for dispatch later</span></span></button></div>`,{full:true})};
OD._csel=(code,id,adv)=>{const o=O5.order(code);const go=()=>{o.courier=id;App.closeSheet();A.toast(id?O5.nm(id)+' assigned':'Courier removed');O5.syncShell(o);O5.remount()};if(id&&id!==adv){App.closeSheet();setTimeout(()=>A.confirm('Not the suggested courier',`The advisor suggested ${O5.nm(adv)}. Assign ${O5.nm(id)} anyway?`,'Assign',go),350)}else go()};
OD.priority=(code,p)=>{const o=O5.order(code);o.priority=o.priority===p?null:p;A.toast(o.priority==='first'?'First in the route':o.priority==='free'?'Any free courier or freelancer':'Priority cleared');O5.remount()};
OD.editSheet=code=>{const o=O5.order(code);const slotType=o.slot&&/–/.test(o.slot)?'between':'none';
  A.sheet(`<!-- ids: TM-ORDER-017 --><div class="sh-head"><div class="h3">Edit #${code}</div><button class="ib" onclick="App.closeSheet()">${I('close')}</button></div><div class="sh-body"><div class="field"><label>Recipient</label><input class="input" id="oe-rec" value="${esc(o.recipient||'')}"></div><div class="field"><label>Recipient phone</label><input class="input" id="oe-rph" value="${esc(o.recipientPhone||'')}"></div>${o.method==='delivery'?`<div class="field"><label>Address line 1</label><input class="input" id="oe-a1" value="${esc(o.address||'')}"></div><div class="field"><label>Address line 2</label><input class="input" id="oe-a2" placeholder="Flat, floor, building"></div><div class="o5-row2"><div class="field"><label>City</label><input class="input" id="oe-city" value="London"></div><div class="field"><label>Postcode</label><input class="input" id="oe-pc" value="${esc(o.postcode||'')}"></div></div>`:''}<div class="o5-row2"><div class="field"><label>Date</label><input class="input" id="oe-date" value="${o.date}" placeholder="YYYY-MM-DD"></div><div class="field"><label>Slot</label><select class="input" id="oe-st"><option ${slotType==='none'?'selected':''} value="none">No slot</option><option ${slotType==='between'?'selected':''} value="between">Between</option><option value="before">Before</option><option value="after">After</option></select></div></div><div class="o5-row2"><div class="field"><label>From</label><input class="input" id="oe-t1" value="${esc((o.slot.split('–')[0]||'').trim())}" placeholder="14:00"></div><div class="field"><label>To</label><input class="input" id="oe-t2" value="${esc((o.slot.split('–')[1]||'').trim())}" placeholder="17:00"></div></div>
    <div class="caps muted mb8 mt8">Items</div><div id="oe-items">${o.items.map((it,i)=>`<div class="flex ai-c g8 mb8"><input class="input f1" value="${esc(it.title)}" data-i="${i}" data-k="title" style="height:44px"><input class="input" value="${it.qty}" data-i="${i}" data-k="qty" style="width:56px;height:44px"><input class="input" value="${it.price}" data-i="${i}" data-k="price" style="width:72px;height:44px"><button class="ib" onclick="OD._eiRemove('${code}',${i})">${I('trash')}</button></div>`).join('')}</div><button class="textbtn" onclick="OD._eiAdd('${code}')">+ Add an item</button>
    <div class="field mt16"><label>Card message</label><textarea class="input" id="oe-gift">${esc(o.giftMessage||'')}</textarea></div><div class="field"><label>Delivery instructions</label><textarea class="input" id="oe-ins">${esc(o.deliveryInstructions||'')}</textarea></div><div class="field"><label>Internal note</label><textarea class="input" id="oe-note">${esc(o.note||'')}</textarea></div><div class="o5-vs"><span class="sm">Customer asked for no photo</span><button class="switch ${o.photoOptOut?'on':''}" id="oe-opt" onclick="this.classList.toggle('on')"></button></div><div class="xs muted mt8">Only changed fields are sent · a wrong time, date or price is blocked here · the CRM’s 422 text shows as is · not queued offline.</div><div class="o5-red mt8" id="oe-err"></div></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Back</button><button class="btn" onclick="OD._esave('${code}')">Save</button></div>`,{full:true})};
OD._eiRemove=(code,i)=>{const o=O5.order(code);if(o.items.length<=1){$('oe-err').textContent='An order needs at least one item.';return}o.items.splice(i,1);OD._recalc(o);OD.editSheet(code)};
OD._eiAdd=code=>{const o=O5.order(code);o.items.push({id:Date.now()%100000,title:'New item',qty:1,price:0});OD.editSheet(code)};
OD._recalc=o=>{const sub=o.items.reduce((s,i)=>s+i.qty*i.price,0);o.money=o.money||{delivery:0,tip:0,discount:0};o.money.subtotal=sub;o.money.total=sub+(o.money.delivery||0)+(o.money.tip||0)-(o.money.discount||0);o.total=o.money.total};
OD._esave=code=>{const o=O5.order(code);const v=id=>($(id)||{}).value||'';const err=$('oe-err');
  if(O5.demo.offline){err.textContent='No connection – editing an order is not queued.';return}
  const date=v('oe-date');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){err.textContent='Date must be YYYY-MM-DD.';return}
  const st=v('oe-st');const t1=v('oe-t1'),t2=v('oe-t2');const tm=/^\d{1,2}:\d{2}$/;if(st!=='none'&&((st==='between'&&(!tm.test(t1)||!tm.test(t2)))||(st==='before'&&!tm.test(t2))||(st==='after'&&!tm.test(t1)))){err.textContent='Time must look like 14:00.';return}
  if(o.method==='delivery'&&!v('oe-pc').trim()){err.textContent='CRM: the postcode is required for delivery (422).';return}
  let bad=false;document.querySelectorAll('#oe-items input').forEach(inp=>{const it=o.items[+inp.dataset.i];if(!it)return;if(inp.dataset.k==='title')it.title=inp.value;else{const n=Number(inp.value);if(!(n>=0)||(inp.dataset.k==='qty'&&n<1))bad=true;else it[inp.dataset.k]=n}});if(bad){err.textContent='Quantity must be 1 or more and the price a number.';return}
  o.recipient=v('oe-rec');o.recipientPhone=v('oe-rph');if(o.method==='delivery'){o.address=v('oe-a1')+(v('oe-a2')?', '+v('oe-a2'):'');o.postcode=v('oe-pc')}o.date=date;o.slot=st==='none'?'':st==='between'?t1+'–'+t2:st==='before'?'before '+t2:'after '+t1;o.giftMessage=v('oe-gift');o.deliveryInstructions=v('oe-ins');o.note=v('oe-note');o.photoOptOut=$('oe-opt').classList.contains('on');OD._recalc(o);
  App.closeSheet();A.toast('Order updated');O5.remount()};

OD.addExtraSheet=code=>{const STOCK=[['Eucalyptus cinerea',48],['Eucalyptus populus',12],['Peony · pink',21],['Garden rose · Pink O’Hara',30],['Astilbe',9],['Pistache',40],['Ruscus',60],['Lisianthus · blush',15]];let q='';
  const draw=()=>{const res=q.length>=2?STOCK.filter(s=>s[0].toLowerCase().includes(q.toLowerCase())):[];return `<div class="sh-head"><div class="h3">Add from stock</div><button class="ib" onclick="App.closeSheet()">${I('close')}</button></div><div class="sh-body"><div class="input-wrap">${I('search')}<input class="input" id="od-stq" placeholder="Search · from 2 characters" value="${esc(q)}" oninput="OD._stq(this.value)"></div><div class="mt12">${q.length<2?'<div class="sm muted">Type at least 2 characters.</div>':res.length?res.map(s=>`<div class="o5-comp"><span class="f1">${esc(s[0])}</span><span class="q">${s[1]} left</span><span class="o5-stepper"><button onclick="OD._stn('${esc(s[0]).replace(/'/g,'’')}',-1)">${I('minus')}</button><span>${OD._stock[s[0]]||1}</span><button onclick="OD._stn('${esc(s[0]).replace(/'/g,'’')}',1)">${I('plus')}</button></span><button class="btn --xs" onclick="OD._stadd('${code}','${esc(s[0]).replace(/'/g,'’')}')">Add</button></div>`).join(''):'<div class="sm muted">Nothing in stock matches.</div>'}</div></div>`};
  OD._stq=v=>{q=v;A.sheet(draw(),{full:true});const n=$('od-stq');n.value=q;n.focus();n.setSelectionRange(q.length,q.length)};
  OD._stn=(name,d)=>{OD._stock[name]=Math.max(1,(OD._stock[name]||1)+d);A.sheet(draw(),{full:true});$('od-stq').value=q};
  OD._stadd=(c,name)=>{const o=O5.order(c);o.extras.push({ing:name,qty:OD._stock[name]||1,unit:'stems',by:A.state.me});App.closeSheet();A.toast(name+' added to the composition');O5.remount()};

OD.subSheet=(code)=>{const o=O5.order(code);const comp=o.composition||[];let from=comp[0]?comp[0].ing:'',to='',q='',qty=1,agreed=false,note='';const STOCK=['Eucalyptus cinerea','Peony · white','Garden rose · Pink O’Hara','Spray rose · white','Lisianthus · blush','Ranunculus · pink'];
  const draw=()=>`<!-- ids: TM-ORDER-041 --><div class="sh-head"><div class="h3">Substitute a stem</div><button class="ib" onclick="App.closeSheet()">${I('close')}</button></div><div class="sh-body"><div class="caps muted mb8">From</div><div class="flex g8" style="flex-wrap:wrap">${comp.map(c=>`<button class="chip ${from===c.ing?'on':''}" onclick="OD._ss('from','${esc(c.ing).replace(/'/g,'’')}')">${esc(c.ing)}</button>`).join('')}</div><div class="caps muted mt16 mb8">To · search the stock</div><div class="input-wrap">${I('search')}<input class="input" id="od-subq" value="${esc(q)}" placeholder="From 2 characters" oninput="OD._ss('q',this.value)"></div><div class="flex g8 mt8" style="flex-wrap:wrap">${(q.length>=2?STOCK.filter(s=>s.toLowerCase().includes(q.toLowerCase())):[]).map(s=>`<button class="chip ${to===s?'on':''}" onclick="OD._ss('to','${esc(s).replace(/'/g,'’')}')">${esc(s)} <small>· 12 left</small></button>`).join('')}</div><div class="flex ai-c g12 mt16"><span class="sm">Quantity</span><span class="o5-stepper"><button onclick="OD._ss('qty',${Math.max(1,qty-1)})">${I('minus')}</button><span>${qty}</span><button onclick="OD._ss('qty',${qty+1})">${I('plus')}</button></span></div><div class="field mt12"><label>Note</label><input class="input" id="od-subn" value="${esc(note)}" placeholder="Why"></div><div class="o5-vs"><span class="sm">Agreed with the customer</span><button class="switch ${agreed?'on':''}" onclick="OD._ss('agreed',${!agreed})"></button></div><div class="o5-red mt8" id="od-suberr"></div></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Back</button><button class="btn" onclick="OD._subgo('${code}')">Substitute</button></div>`;
  OD._ss=(k,v)=>{note=($('od-subn')||{}).value||note;if(k==='from')from=v;if(k==='to')to=v;if(k==='q'){q=v;to=''}if(k==='qty')qty=v;if(k==='agreed')agreed=v;A.sheet(draw(),{full:true});if(k==='q'){const n=$('od-subq');n.focus();n.setSelectionRange(q.length,q.length)}};
  OD._subgo=c=>{note=($('od-subn')||{}).value||'';if(!to){$('od-suberr').textContent='Pick what goes in instead.';return}if(o.substitutionPreference==='contact_me'){$('od-suberr').textContent='CRM: the customer asked to be contacted first – substitution refused (422).';return}o.substitutions.push({from,to,qty,agreed,note,by:A.state.me});App.closeSheet();A.toast('Substitution saved');O5.remount()};
  A.sheet(draw(),{full:true})};
OD.mp=(code,act)=>{const o=O5.order(code);if(act==='ready'){o.marketplace.status='Marked ready · courier requested';A.toast('Ready on '+o.marketplace.name);O5.remount();return}
  if(act==='deny'){A.sheet(`<div class="sh-head"><div class="h3">Decline on ${o.marketplace.name}</div></div><div class="sh-body"><div class="field"><label>Reason for the platform</label><input class="input" id="od-mpr" placeholder="e.g. Item out of stock"></div></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Back</button><button class="btn --accent" onclick="OD._mpdeny('${code}')">Decline</button></div>`);return}

OD.unpaidNote=code=>{const v=(($('od-unote')||{}).value||'').trim();if(!v)return;const o=O5.order(code);o.unpaid.notes.push({by:A.state.me,t:v,at:O5.now().toISOString()});A.toast('Note saved');O5.remount()};
OD.outcomeSheet=code=>{const o=O5.order(code);let pick='paid_site';
  const OUT=[['paid_site','Paid · on the website'],['paid_transfer','Paid · bank transfer'],['paid_cash','Paid · cash'],['paid_link','Paid · payment link'],['paid_other','Paid · other'],['not_paid','Did not pay'],['new_order','Made a new order instead']];
  const draw=()=>`<!-- ids: TM-ORDER-049 --><div class="sh-head"><div class="h3">Outcome · #${code}</div></div><div class="sh-body">${OUT.map(x=>`<button class="o5-radio ${pick===x[0]?'on':''}" onclick="OD._op('${x[0]}')"><span class="rd"></span>${x[1]}</button>`).join('')}${pick==='new_order'?`<div class="field mt12"><label>New order code · at least 3 characters</label><input class="input" id="od-oc" placeholder="715"></div>`:''}<div class="xs muted mt12">“Paid” changes the payment and the order status straight away – no extra confirmation.</div><div class="o5-red mt8" id="od-oerr"></div></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Back</button><button class="btn" onclick="OD._ogo('${code}')">Save outcome</button></div>`;

    if(pick.startsWith('paid')){o.paymentStatus='paid';if(o.status==='unconfirmed')O5.setStatus(o,'confirm');A.toast('Paid · order moves on')}else if(pick==='not_paid'){O5.setStatus(o,'cancelled','Did not pay');A.toast('Order archived')}else A.toast('Outcome saved');App.closeSheet();O5.remount()};
  A.sheet(draw(),{full:true})};
OD.podPhoto=code=>{A.sheet(`<div class="sh-head"><div class="h3">Proof of delivery</div><button class="ib" onclick="App.closeSheet()">${I('close')}</button></div><div class="sh-body"><div class="o5-row2"><button class="o5-big" onclick="App.closeSheet();OD._pod('${code}')">${I('camera')}Take a photo</button><button class="o5-big --ghost" onclick="App.closeSheet();OD._pod('${code}')">${I('photo')}Gallery</button></div><div class="xs muted mt8">Fails on the network? It is kept and retried.</div></div>`)};
OD._pod=code=>{const o=O5.order(code);O5.act(o,()=>{const r=O5.submit({code,kind:'podPhoto',img:o.items[0].img});if(r.ok)A.toast('Proof photo saved');return r})};
OD.podMissing=code=>{let pick='nobody_home';const RS=[['nobody_home','Nobody at home – left in a safe place'],['customer_refused','Customer refused a photo'],['phone_failed','Phone failed'],['other','Other']];
  const draw=()=>`<div class="sh-head"><div class="h3">Why is there no photo?</div></div><div class="sh-body">${RS.map(x=>`<button class="o5-radio ${pick===x[0]?'on':''}" onclick="OD._pmp('${x[0]}')"><span class="rd"></span>${x[1]}</button>`).join('')}<div class="field mt12"><label>Note</label><input class="input" id="od-pmn"></div></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Back</button><button class="btn" onclick="OD._pmgo('${code}')">Save</button></div>`;
  OD._pmp=v=>{pick=v;A.sheet(draw())};OD._pmgo=c=>{const lab=RS.find(x=>x[0]===pick)[1];const n=($('od-pmn')||{}).value||'';App.closeSheet();const o=O5.order(c);O5.act(o,()=>{const r=O5.submit({code:c,kind:'podMissing',reason:lab,note:n});if(r.ok)A.toast('Reason saved');return r})};A.sheet(draw())};
OD.podDelete=code=>{A.confirm('Delete the proof photo?','Network only – it cannot wait in the queue.','Delete',()=>{if(O5.demo.offline){A.toast('No connection');return}const o=O5.order(code);o.pod.photo=null;A.toast('Deleted');O5.remount()})};
})();
</script>
