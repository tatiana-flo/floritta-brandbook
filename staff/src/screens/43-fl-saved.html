<section class="scr fl" id="s-fl-saved" data-tab="fl-way" data-nav="My routes and areas" data-group="Freelance · On my way">
  <!-- ids: TM-FL-063 TM-FL-092 -->
  <div class="appbar"><button class="ib" onclick="App.back('fl-way')" aria-label="Back"><svg class="i"><use href="#fl-i-back"/></svg></button><div class="ttl caps">Routes and areas</div><span class="ib"></span></div>
  <div class="scr-body has-tab">
    <div class="pad" style="margin-top:12px"><p class="soft sm" style="margin:0">The studio uses these to tell you about new deliveries on your way and in your areas.</p></div>
    <!-- ids: TM-FL-064 TM-FL-067 -->
    <div class="sec-head" style="margin-top:16px"><div class="h2">My routes</div><span class="caps muted" id="flx-routes-n"></span></div>
    <div id="flx-routes"></div>
    <!-- ids: TM-FL-065 TM-FL-066 -->
    <div class="pad" style="margin-top:12px"><button class="btn --ghost --block" onclick="FLX.routeAdd()"><svg class="i"><use href="#fl-i-plus"/></svg>Add a route</button></div>
    <!-- ids: TM-FL-068 -->
    <div class="sec-head"><div class="h2">My areas</div></div>
    <div class="pad"><p class="soft sm" style="margin:0 0 12px">Get notified about deliveries to these postcode areas. Tap one to remove it.</p>
      <div class="wrap-chips" id="flx-areas"></div>
      <div class="field" style="margin-top:14px"><label for="fl-area-in">Add an area</label><div style="display:flex;gap:8px"><input class="input num" id="fl-area-in" placeholder="e.g. SE16" style="text-transform:uppercase" onkeydown="if(event.key==='Enter')FLX.areaAdd()"><button class="btn --ghost" onclick="FLX.areaAdd()">Add</button></div><span class="hint">An outcode like SE15 – the part before the space. Duplicates are ignored.</span></div>
    </div>
  </div>
</section>
