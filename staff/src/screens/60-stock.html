.stk-blk{margin:18px var(--gutter) 0;border:1px solid var(--hair);padding:14px}

.stk-kv:last-child{border-bottom:0}

.stk-big{display:flex;align-items:baseline;gap:10px}

.stk-lock b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--ink);margin-bottom:6px}
.stk-dev{margin:0 var(--gutter);padding:8px 10px;background:var(--silver);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stk-dev button{border-bottom:1px solid var(--light);color:var(--ink)}
.stk-dev button.on{color:var(--accent);border-bottom-color:var(--accent)}
.stk-sug{padding:10px 0;border-bottom:1px solid var(--hair)}
.stk-sug .t{font-size:15px}
.stk-sug .m{font-size:12px;color:var(--grey);margin-top:2px}
.stk-radio{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair);width:100%;text-align:left}
.stk-radio .rd{width:20px;height:20px;border:1px solid var(--light);flex:none;display:grid;place-items:center;margin-top:2px}
.stk-radio .rd::after{content:"";width:10px;height:10px;background:var(--ink);transform:scale(0);transition:transform var(--m-fast)}
.stk-radio.on .rd{border-color:var(--ink)}.stk-radio.on .rd::after{transform:scale(1)}
.stk-radio .t{font-size:15px}.stk-radio .m{font-size:12px;color:var(--grey);margin-top:2px;line-height:1.45}
.stk-bq{padding:12px 0;border-bottom:1px solid var(--hair)}
.stk-bq .t{font-size:15px;line-height:1.35}
.stk-bq .m{font-size:12px;color:var(--grey);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stk-bq .a{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.stk-bq .na{font-size:12px;color:var(--grey)}
.app:has(.scr.on .stk-cta:not([style*="none"])) .toast{bottom:calc(var(--tab-h) + var(--btn-h) + 44px + var(--safe-b))}
</style>

<script>
(function(){
const A=window.App, I=n=>A.icon(n), $=id=>document.getElementById(id);
const ic=(n,s=18,x='')=>A.icon(n).replace('<svg',`<svg style="width:${s}px;height:${s}px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;${x}"`);
const T=A.T, NOW=A.NOW;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const money=p=>'£'+(p/100).toFixed(2);
const p2=n=>String(n).padStart(2,'0');
const hm=iso=>{const d=new Date(iso);return p2(d.getHours())+':'+p2(d.getMinutes())};
const dayS=iso=>{const d=new Date(iso);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const whenS=iso=>sameDay(iso,NOW)?hm(iso):dayS(iso)+' '+hm(iso);
const nm=id=>{const u=A.user(id);return u?u.n:id};
const youOr=id=>id===A.state.me?'You':nm(id);
const isLimited=()=>{const m=A.me();return m.staff_type==='trainee'||m.staff_type==='seasonal'};
const PERM={owner:['view','count','receive','manage','cost'],manager:['view','count','receive','manage'],florist:['view','count','receive'],courier:[]};

function visibleItems(){

 if(S.uncounted&&!S.today&&S.section!=='showcase')l=l.filter(i=>!(i.countedAt&&sameDay(i.countedAt,NOW)));
 if(S.q){const q=S.q.toLowerCase();l=l.filter(i=>i.en.toLowerCase().includes(q)||i.ru.toLowerCase().includes(q)||i.sku.toLowerCase().includes(q))}
 return l;

window.mount_stk_item=function(p){

 const ph=S.itemPhoto[id]||{};

 const open=REQ.filter(r=>r.itemId===id&&['new','ordered'].includes(r.status));
 const URG={today:'Today',tomorrow:'Tomorrow',week:'This week'};

 const myWo=WOFF.filter(w=>w.itemId===id&&w.by===A.state.me&&sameDay(w.at,NOW));
 const photoTile=`<button class="stk-photo" style="margin:0 var(--gutter)" onclick="STK.photoSheet('item',${id})">${i.img?`<img src="${i.img}" alt="">`:''}${i.img?'':I('camera')}<span class="cap">${i.img?'Tap to change the photo':'Add a photo'}</span></button>

 body.innerHTML=`${photoTile}
  <div class="stk-blk"><div class="stk-kv"><span>Item</span><span>${i.sku} · ${i.cat}</span></div>
   <div class="stk-big mt8"><b>${i.onHand}</b><span>${i.unit} on hand</span></div>
   <div class="stk-small mt4">available ${i.avail} · min ${i.min}</div>
   <div class="stk-small">${countedLine(i)}</div>
   <div class="stk-tags">${i.useFirst?'<span class="tag --ink">Use first</span>':''}${daysBadge(i)}${i.status==='out'?'<span class="tag --sale">Out of stock</span>':i.status==='low'?'<span class="tag --soft">Low</span>':''}</div>
   <div class="mt12">${i.retail?`<div class="stk-kv"><span>Retail (with VAT)</span><span>${money(i.retail)}</span></div>`:''}${can('cost')?`<div class="stk-kv"><span>Cost (ex VAT)</span><span>${money(i.cost)}</span></div>`:''}</div></div>
  ${can('count')?`<div class="stk-blk"><div class="h4">Count</div>
   <div class="field mt12"><label>Counted quantity</label><input class="input" inputmode="numeric" placeholder="How many are there really?" value="${esc(c.v)}" oninput="STK.cnt(${id},'v',this.value)"></div>
   <div class="stk-var">${vline}</div>
   <div class="field"><label>Note (optional)</label><input class="input" placeholder="e.g. 2 bunches in the fridge" value="${esc(c.note)}" oninput="STK.cnt(${id},'note',this.value)"></div>
   <button class="btn --block" id="stk-cnt-save" ${valid?'':'disabled'} onclick="STK.saveCount(${id})">Save count</button>
   <p class="stk-small mt8">Opens empty on purpose: count, do not confirm the system number. A difference needs no reason.</p></div>
  <div class="stk-blk"><div class="h4">Write off</div>
   <div class="stk-wrap mt12">${['Wilted','Faulty','Damaged','Expired','Mis-pick','Other'].map(r=>`<button class="chip ${wo.reason===r?'on':''}" onclick="STK.wo(${id},'reason','${r}')">${r}</button>`).join('')}</div>
   <div class="field mt12"><label>How many</label><input class="input" inputmode="numeric" placeholder="0" value="${esc(wo.qty)}" oninput="STK.wo(${id},'qty',this.value)"></div>
   <button class="btn --block --secondary" ${wo.reason&&/^[1-9]\d*$/.test(wo.qty)?'':'disabled'} onclick="STK.writeOff(${id})">Write off</button>
   ${myWo.map(w=>`<div class="flex ai-c jc-sb mt12 sm"><span>Written off: ${w.qty} · ${w.reason} · ${hm(w.at)}</span><button class="stk-link" style="margin:0" onclick="STK.undoWo(${w.id})">Undo</button></div>`).join('')}
   <p class="stk-small mt8">Three taps: reason, quantity, done. More than on hand → the CRM refuses with its own text.</p></div>
  <div class="stk-blk"><div class="h4">Need to order${open.length?`<span class="caps muted">${open.length} open</span>`:''}</div>
   ${open.length?open.map(r=>`<div class="stk-req"><div class="t">${youOr(r.by)} · ${r.qty==null?'as usual':r.qty+' '+i.unit} · ${URG[r.urg]}</div><div class="m">${whenS(r.at)}${r.note?' · '+esc(r.note):''}</div><span class="stk-rs --${r.status}">${RSL[r.status]}</span>${r.mgrNote?`<div class="m">${esc(r.mgrNote)} · ${nm(r.handledBy)}</div>`:''}</div>`).join('')+'<p class="stk-small mt8">Someone already asked – no need to send a second request.</p>':'<p class="stk-small mt8">No open requests for this item.</p>'}
   ${rs.open?`<div class="field mt12"><label>How many (empty – as usual)</label><input class="input" inputmode="numeric" value="${esc(rs.qty)}" oninput="STK.rs(${id},'qty',this.value)"></div>
    <div class="stk-wrap">${[['today','Today'],['tomorrow','Tomorrow'],['week','This week']].map(u=>`<button class="chip ${rs.urg===u[0]?'on':''}" onclick="STK.rs(${id},'urg','${u[0]}')">${u[1]}</button>`).join('')}</div>
    <div class="field mt12"><label>Note to the buyer</label><input class="input" value="${esc(rs.note)}" oninput="STK.rs(${id},'note',this.value)"></div>
    <button class="btn --block" ${rs.qty===''||/^[1-9]\d*$/.test(rs.qty)?'':'disabled'} onclick="STK.sendRestock(${id})">Send to buyer</button>`:`<button class="btn --block --secondary mt12" onclick="STK.rs(${id},'open',true)">Need to order</button>`}
   <button class="btn --block --accent mt8" onclick="STK.ranOut(${id})">Ran out – order</button>
   <p class="stk-small mt8">One tap: usual quantity, today, note "Ran out". The buyer gets a Telegram message at once.</p></div>`:`<div class="stk-blk"><div class="h4">Count and write-off</div><p class="stk-small mt8">Your account can view the stock but not count it.</p></div>`}
  ${sec('Recent movements',i.movements.length)}<div class="pad">${i.movements.map(m=>`<div class="stk-mv"><span class="d">${sameDay(m.at,NOW)?hm(m.at):dayS(m.at)}</span><span class="f1">${m.type}${m.from!=null?` · was ${m.from}, now ${m.to}`:''} · ${m.by==='system'?'system':nm(m.by)}</span><span class="q ${m.q>0?'plus':'minus'}">${m.q>0?'+':''}${m.q}</span></div>`).join('')}</div>
  ${can('manage')?`<div class="stk-blk"><div class="h4">Item card ${ed.open?'':`<button class="lk" onclick="STK.edit(${id},true)">Edit</button>`}</div>
   ${ed.open?`<div class="mt12">
    <div class="field"><label>Name (EN)</label><input class="input" value="${esc(i.en)}" id="stk-ed-en"></div>
    <div class="field"><label>Name (RU)</label><input class="input" value="${esc(i.ru)}" id="stk-ed-ru"></div>
    <div class="stk-grid"><div class="field"><label>Category</label><select class="input" id="stk-ed-cat">${CATS.map(c=>`<option ${c===i.cat?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Unit</label><input class="input" value="${esc(i.unit)}" id="stk-ed-unit"></div></div>
    <div class="stk-grid"><div class="field"><label>Minimum stock</label><input class="input" inputmode="numeric" value="${i.min}" id="stk-ed-min"></div><div class="field"><label>Retail with VAT, £</label><input class="input" inputmode="decimal" value="${(i.retail/100).toFixed(2)}" id="stk-ed-retail"></div></div>
    ${can('cost')?`<div class="field"><label>Cost ex VAT, £</label><input class="input" inputmode="decimal" value="${(i.cost/100).toFixed(2)}" id="stk-ed-cost"></div>`:`<p class="stk-small" style="margin:-6px 0 12px">Cost price is edited by the account holder only.</p>`}
    <div class="stk-grid"><div class="field"><label>Freshness, days (1–365)</label><input class="input" inputmode="numeric" value="${i.fresh==null?'':i.fresh}" id="stk-ed-fresh"></div><div class="field"><label>Stems per bunch (1–1000)</label><input class="input" inputmode="numeric" value="${i.bunch==null?'':i.bunch}" id="stk-ed-bunch"></div></div>
    <div class="flex g8"><button class="btn --secondary f1" onclick="STK.edit(${id},false)">Cancel</button><button class="btn f1" onclick="STK.saveEdit(${id})">Save card</button></div></div>`:`<div class="mt8"><div class="stk-kv"><span>Names</span><span>${esc(i.en)}<br>${esc(i.ru)}</span></div><div class="stk-kv"><span>Unit · min</span><span>${i.unit} · ${i.min}</span></div><div class="stk-kv"><span>Freshness · bunch</span><span>${i.fresh==null?'—':i.fresh+' d'} · ${i.bunch==null?'—':i.bunch}</span></div></div>`}</div>`:''}`;
};
STK.cnt=(id,k,v)=>{S.cnt[id][k]=v;if(k==='v'){const b=$('stk-item-body');const valid=/^\d+$/.test(v);const i=item(id);b.querySelector('.stk-var').innerHTML=!v?'':!valid?'<span class="accent">Digits only</span>':(+v===i.onHand?`Matches the system (${i.onHand})`:`In the system ${i.onHand} · you entered ${+v} · ${+v-i.onHand>0?'+':''}${+v-i.onHand}`);const sb=$('stk-cnt-save');if(sb)sb.disabled=!valid}};
STK.saveCount=id=>{const i=item(id);const c=S.cnt[id];if(demo.offline){A.toast('Could not save – no connection');return}const v=+c.v;const d=v-i.onHand;i.movements.unshift({at:NOW.toISOString(),type:'Count',by:A.state.me,q:d,from:i.onHand,to:v});i.onHand=v;i.avail=Math.min(i.avail,v);i.status=v===0?'out':v<i.min?'low':'ok';i.countedBy=A.state.me;i.countedAt=NOW.toISOString();c.v='';c.note='';A.haptic();A.confirm('Stock updated',`${v} on hand${d?` · difference ${d>0?'+':''}${d} recorded by the server`:' · matches'}.`,'OK',null);mount_stk_item({id})};
STK.wo=(id,k,v)=>{S.wo[id][k]=v;mount_stk_item({id})};
STK.writeOff=id=>{const i=item(id),w=S.wo[id];const q=+w.qty;if(demo.offline){A.toast('Could not write off – no connection');return}if(q>i.onHand){A.toast(`Only ${i.onHand} on hand – cannot write off ${q}`);return}i.onHand-=q;i.avail=Math.max(0,i.avail-q);i.status=i.onHand===0?'out':i.onHand<i.min?'low':'ok';const rec={id:WOFF.length+1,itemId:id,by:A.state.me,qty:q,reason:w.reason,at:NOW.toISOString()};WOFF.push(rec);i.movements.unshift({at:NOW.toISOString(),type:'Write-off · '+w.reason.toLowerCase(),by:A.state.me,q:-q});w.reason='';w.qty='';A.toast(`Written off: ${q}`);mount_stk_item({id})};
STK.undoWo=wid=>{const k=WOFF.findIndex(w=>w.id===wid);if(k<0)return;const w=WOFF[k];if(w.by!==A.state.me||!sameDay(w.at,NOW)){A.toast('Could not undo – ask a manager');return}const i=item(w.itemId);i.onHand+=w.qty;i.status=i.onHand===0?'out':i.onHand<i.min?'low':'ok';i.movements.unshift({at:NOW.toISOString(),type:'Write-off cancelled',by:A.state.me,q:w.qty});WOFF.splice(k,1);A.toast('Write-off cancelled – stock restored');mount_stk_item({id:w.itemId})};
STK.rs=(id,k,v)=>{S.rs[id][k]=v;mount_stk_item({id})};
function sendRestock(id,qty,urg,note,silent){const i=item(id);if(demo.offline){A.toast('Could not send – no connection');return false}const mine=REQ.find(r=>r.itemId===id&&r.by===A.state.me&&r.status==='new');if(mine){Object.assign(mine,{qty,urg,note,at:NOW.toISOString()});if(!silent)A.toast('Your request was updated')}else{REQ.unshift({id:REQ.length+1,itemId:id,by:A.state.me,qty,urg,status:'new',note,at:NOW.toISOString(),mgrNote:'',handledBy:null});if(!silent)A.toast('Sent to the buyer')}setTimeout(()=>A.push('Buyer · Telegram',`${nm(A.state.me)}: ${i.en} · ${qty==null?'as usual':qty} · ${urg}`,{icon:'send',to:'buyer'}),600);return true}
STK.sendRestock=id=>{const r=S.rs[id];if(sendRestock(id,r.qty===''?null:+r.qty,r.urg,r.note)){r.open=false;r.qty='';r.note='';mount_stk_item({id})}};
STK.ranOut=id=>{if(sendRestock(id,null,'today','Ran out'))mount_stk_item({id})};
STK.edit=(id,on)=>{S.edit[id].open=on;mount_stk_item({id})};
STK.saveEdit=id=>{const i=item(id);const g=x=>($('stk-ed-'+x)||{}).value;const en=(g('en')||'').trim();const num=v=>v===''?null:(/^\d+([.,]\d{1,2})?$/.test(v)?Math.round(parseFloat(v.replace(',','.'))*100):NaN);const retail=num(g('retail')),cost=can('cost')?num(g('cost')):undefined,min=g('min'),fresh=g('fresh'),bunch=g('bunch');
 if(!en||!/^\d+$/.test(min)||Number.isNaN(retail)||Number.isNaN(cost)||(fresh&&!(/^\d+$/.test(fresh)&&+fresh>=1&&+fresh<=365))||(bunch&&!(/^\d+$/.test(bunch)&&+bunch>=1&&+bunch<=1000))){A.toast('Check the name and the numbers');return}
 if(demo.offline){A.toast('Could not save the card');return}
 Object.assign(i,{en,ru:g('ru'),cat:g('cat'),unit:g('unit')||i.unit,min:+min,retail:retail==null?0:retail,fresh:fresh?+fresh:null,bunch:bunch?+bunch:null});if(cost!==undefined&&cost!=null)i.cost=cost;i.status=i.onHand===0?'out':i.onHand<i.min?'low':'ok';S.edit[id].open=false;A.toast('Card updated');mount_stk_item({id})};

STK.photoSheet=function(kind,id,cb){
 const key=kind+':'+id;
 A.sheet(sh('Photo',`<button class="stk-sheetrow" onclick="STK.photoPick('${kind}',${id},'camera')">${I('camera')} Take a photo${I('chev')}</button><button class="stk-sheetrow" onclick="STK.photoPick('${kind}',${id},'library')">${I('photo')} Choose from library${I('chev')}</button><button class="stk-sheetrow" onclick="App.closeSheet()">${I('close')} Cancel</button>`));
 STK._cb=cb;
};
STK.photoPick=function(kind,id,src){
 A.closeSheet();
 if(src==='camera'&&demo.camDenied){setTimeout(()=>A.confirm('Camera is off for Floritta Team','Allow the camera in Settings → Floritta Team, or choose a photo from the library.','OK',null),200);return}
 const key=kind+':'+id;const store=(S.itemPhoto[id]=S.itemPhoto[id]||{});
 if(demo.offline){store.pending=true;setTimeout(()=>A.sheet(`<div class="sh-head"><div class="h3">Photo not sent</div></div><div class="sh-body"><p class="soft" style="margin:0 0 8px">The connection dropped. The compressed photo is kept in memory – send it again or cancel.</p></div><div class="sh-foot"><button class="btn --secondary" onclick="STK.photoCancel('${kind}',${id})">Cancel</button><button class="btn" onclick="STK.photoRetry('${kind}',${id})">Send again</button></div>`),200);document.getElementById('scrim').onclick=null;remount();return}
 store.pending=false;if(STK._cb){const f=STK._cb;STK._cb=null;f(src);return}
 if(kind==='item'){const i=item(id);if(i&&!i.img)i.img='img/peach-posy.webp';A.confirm('Photo updated','The new photo is on the item card.','OK',null);remount()}
};
STK.photoRetry=function(kind,id){A.closeSheet();document.getElementById('scrim').onclick=A.closeSheet;if(demo.offline){A.toast('Still no connection – kept on the phone');return}const store=S.itemPhoto[id]||{};store.pending=false;A.toast('Photo sent');remount()};
STK.photoCancel=function(kind,id){A.closeSheet();document.getElementById('scrim').onclick=A.closeSheet;(S.itemPhoto[id]||{}).pending=false;remount()};

STK.nf=(k,v)=>{S.newForm[k]=v;const cta=$('stk-new-cta').querySelector('.btn');const f=S.newForm;const mgr=can('manage');const costOk=f.cost===''||/^\d+([.,]\d{1,2})?$/.test(f.cost);cta.disabled=!(mgr?(f.name.trim()&&/^\d+$/.test(f.qty)&&costOk):(f.name.trim()&&(f.sqty===''||/^\d+$/.test(f.sqty))));if(k==='cost')mount_stk_new(A.state.params)};
STK.newPhoto=()=>{if(demo.camDenied){S.newForm.err='Camera permission denied – allow it in Settings or pick from the library.';mount_stk_new(A.state.params);return}STK.photoSheet('new',0,()=>{S.newForm.photo=true;S.newForm.err='';mount_stk_new(A.state.params)})};
STK.createItem=()=>{const f=S.newForm;if(demo.offline){A.toast('Could not add the item');return}const id=Math.max(...ITEMS.map(i=>i.id))+1;const cost=f.cost?Math.round(parseFloat(f.cost.replace(',','.'))*100):0;const it={id,en:f.name.trim(),ru:'',sku:'NEW-'+id,cat:'Seasonal',unit:f.unit,onHand:+f.qty,avail:+f.qty,min:0,retail:0,cost,daysLeft:null,countedBy:A.state.me,countedAt:NOW.toISOString(),showcase:false,groupA:false,img:f.photo?'img/peach-posy.webp':'',fresh:null,bunch:null,status:+f.qty?'ok':'out',movements:[{at:NOW.toISOString(),type:'Created',by:A.state.me,q:+f.qty}]};ITEMS.push(it);
 if(f.linkLineId){const line=PO.flatMap(x=>x.lines).find(l=>l.id===f.linkLineId);if(line){S.dlNewItem={lineId:f.linkLineId,itemId:id,orderId:f.orderId};}f.init=false;A.toast(`${it.en} created – link it and receive`);A.go('stk-delivery',{id:f.orderId},{replace:true});return}
 f.init=false;A.toast('Added to stock');A.go('stk-item',{id},{replace:true})};
STK.suggestItem=()=>{const f=S.newForm;if(demo.offline){A.toast('Did not send – try again');return}SUG.unshift({id:SUG.length+1,by:A.state.me,name:f.name.trim(),qty:f.sqty===''?null:+f.sqty,status:'pending',found:'',mgrNote:'',at:NOW.toISOString()});f.init=false;A.toast('Sent to the manager');A.go('stk-requests',{},{replace:true})};

/* ===================== TO ORDER ===================== */
window.mount_stk_requests=function(){
 bar('stk-req-bar','To order',demoIb,'stk-inv');
 const URG={today:'Today',tomorrow:'Tomorrow',week:'This week'};
 const RSL={new:'Waiting for the buyer',ordered:'Ordered',arrived:'Arrived',rejected:'Rejected'};
 const SSL={pending:'Waiting for the manager',added:'Added to stock',found:'Found in stock',rejected:'Rejected'};
 const me=A.state.me;
 const mine=SUG.filter(s=>s.by===me);
 let l=demo.empty?[]:REQ.filter(r=>S.reqScope==='all'||r.by===me);
 const body=$('stk-req-body');
 if(demo.loading){body.innerHTML=spin();return}
 const sug=mine.length&&!demo.empty?`${sec('Suggested items',mine.length)}<div class="pad">${mine.map(s=>`<div class="stk-sug"><div class="t">${esc(s.name)}${s.qty!=null?` · ${s.qty} on the shelf`:''}</div><div class="m">${whenS(s.at)}</div><span class="stk-rs --${s.status==='pending'?'new':s.status==='rejected'?'rejected':'arrived'}">${SSL[s.status]}</span>${s.found?`<div class="m">Found as: ${esc(s.found)}</div>`:''}${s.mgrNote?`<div class="m">${esc(s.mgrNote)}</div>`:''}</div>`).join('')}</div>`:'';
 const list=demo.offline?empty('Could not load the requests','Pull down to try again.','--err'):!l.length?empty(S.reqScope==='all'?'Nothing to order right now':'No requests in the last two weeks'):l.map(r=>{const i=item(r.itemId);const openR=['new'].includes(r.status)||r.status==='ordered';return `<div class="stk-req" style="padding-left:var(--gutter);padding-right:var(--gutter)"><div class="t">${esc(i.en)}</div><div class="m">${youOr(r.by)} · ${r.qty==null?'as usual':r.qty+' '+i.unit} · ${URG[r.urg]} · ${whenS(r.at)}${r.note?' · '+esc(r.note):''}</div><span class="stk-rs --${r.status}">${RSL[r.status]}</span>${r.mgrNote?`<div class="m">${esc(r.mgrNote)} · ${nm(r.handledBy)}</div>`:''}${can('manage')&&openR?`<div class="a">${r.status==='new'?`<button class="btn --xs" onclick="STK.reqStatus(${r.id},'ordered')">Ordered</button>`:''}<button class="btn --xs --secondary" onclick="STK.reqStatus(${r.id},'arrived')">Arrived</button><button class="btn --xs --ghost" onclick="STK.reqStatus(${r.id},'rejected')">Reject</button></div>`:''}</div>`}).join('');
 body.innerHTML=`<div class="stk-sub">Everything the team asked to buy, with the buyer's answers</div>
  <div class="chips stk-chips"><button class="chip ${S.reqScope==='all'?'on':''}" onclick="STK.reqScope('all')">All</button><button class="chip ${S.reqScope==='mine'?'on':''}" onclick="STK.reqScope('mine')">Mine</button></div>
  <div class="stk-dev mt12"><span>Refresh</span><button onclick="STK.refresh()">Pull to refresh</button><span>· requests + suggestions · auto every 60 s</span></div>
  ${sug}${sec(S.reqScope==='all'?'Requests':'My requests',l.length)}${list}`;
};
STK.reqScope=s=>{S.reqScope=s;mount_stk_requests()};
STK.reqStatus=(id,st)=>{const r=REQ.find(x=>x.id===id);const L={ordered:'Ordered',arrived:'Arrived',rejected:'Rejected'};
 const apply=note=>{if(demo.offline){A.confirm('Could not save','No connection – try again.','OK',null);return}r.status=st;r.handledBy=A.state.me;r.mgrNote=note||'';A.closeSheet();A.toast(`${L[st]} · ${nm(r.by)} will see it`);mount_stk_requests()};
 if(demo.android){apply('');return}
 A.sheet(sh(`${L[st]} – note to ${nm(r.by)}`,`<div class="field"><label>Note (optional)</label><input class="input" id="stk-req-note" placeholder="e.g. Rose Farm Kenya · Thursday"></div>`,`<button class="btn --secondary" onclick="App.closeSheet()">Cancel</button><button class="btn" onclick="STK.reqApply(${id},'${st}')">${L[st]}</button>`));STK._apply=apply};
STK.reqApply=()=>{const n=($('stk-req-note')||{}).value;STK._apply(n)};

/* ===================== RAN OUT ===================== */
window.mount_stk_out=function(){
 bar('stk-out-bar','Ran out – needs ordering',demoIb,hasStock()?'stk-inv':'work');
 const q=S.outQ.trim();
 const res=q.length>=2?ITEMS.filter(i=>i.en.toLowerCase().includes(q.toLowerCase())||i.ru.toLowerCase().includes(q.toLowerCase())):[];
 $('stk-out-body').innerHTML=`<div class="stk-sub">Any role · no prices · the buyer gets a Telegram message</div>
  <div class="pad mt12"><div class="input-wrap">${I('search')}<input class="input" placeholder="Search the stock…" value="${esc(S.outQ)}" autofocus autocorrect="off" oninput="STK.outQ(this.value)"></div></div>
  ${q.length<2?`<div class="stk-hint">${I('info')} Type at least 2 characters.</div>`:demo.offline?empty('Could not search','No connection.','--err'):!res.length?empty('Nothing found','Try another spelling – RU names work too.'):`<div class="mt8">${res.map(i=>`<button class="stk-row" id="out-item-${i.id}" ${S.outBusy?'disabled style="opacity:.5"':''} onclick="STK.outAsk(${i.id})"><div class="f1"><div class="nm">${esc(i.en)}</div><div class="mt">${esc(i.ru)}</div>${S.outSent[i.id]?`<div class="mt ok">Sent: ${esc(i.en)} – the buyer will order</div>`:''}</div><div class="qt ${i.onHand===0?'out':''}"><b>${i.onHand}</b><span>${i.unit}</span></div></button>`).join('')}</div>`}`;
};
STK.outQ=v=>{S.outQ=v;const b=$('stk-out-body');mount_stk_out();const inp=b.querySelector('input');if(inp){inp.focus();inp.setSelectionRange(v.length,v.length)}};
STK.outAsk=id=>{const i=item(id);A.confirm(`Mark "${esc(i.en)}" as run out?`,'The buyer gets a request for the usual quantity, for today, with the note "Ran out".','Send',()=>{S.outBusy=true;mount_stk_out();setTimeout(()=>{S.outBusy=false;if(demo.offline){A.toast('Could not send');mount_stk_out();return}sendRestock(id,null,'today','Ran out',true);S.outSent[id]=true;A.toast(`Sent: ${i.en} – the buyer will order`);mount_stk_out()},500)})};

/* ===================== DELIVERIES ===================== */
const POST={ordered:['Ordered','todo'],in_transit:['In transit','doing'],partially_received:['Partly received','review'],received:['Received','done']};
const recLines=p=>p.lines.filter(l=>l.rec>0).length;
function dlvRow(p){return `<button class="stk-row" onclick="App.go('stk-delivery',{id:${p.id}})"><div class="f1"><div class="nm">${supN(p.sup)}</div><div class="mt">${p.code} · ${dayS(p.exp)}${p.note?' · '+esc(p.note):''}</div><div class="mt">${recLines(p)} of ${p.lines.length} lines received</div></div><span class="pill --${POST[p.status][1]}">${POST[p.status][0]}</span></button>`}
window.mount_stk_deliveries=function(){
 bar('stk-dlv-bar','Deliveries',demoIb,'stk-inv');
 const body=$('stk-dlv-body');
 if(!can('receive')||demo.oldCrm){body.innerHTML=unavailable();return}
 if(demo.loading){body.innerHTML=spin();return}
 const head=`<div class="pad mt12 flex g8"><button class="btn --sm --secondary f1" onclick="App.go('stk-receipt-new')">${I('plus')} Receive without order</button><button class="btn --sm --ghost f1" onclick="App.go('stk-claims')">${I('inbox')} My claims</button></div>
  <div class="stk-dev mt12"><span>Refresh</span><button onclick="STK.refresh()">Pull to refresh</button><span>· orders + receipts · auto every 60 s</span></div>`;
 if(demo.offline){body.innerHTML=head+empty('Could not load the deliveries','Pull down to try again.','--err');return}
 const list=demo.empty?[]:PO.slice();
 const openL=list.filter(p=>p.status!=='received').sort((a,b)=>new Date(a.exp)-new Date(b.exp));
 const groups=['Overdue','Today','Tomorrow','Later'].map(g=>{const l=openL.filter(p=>dayLabel(p.exp)===g);return l.length?`<div class="stk-day ${g==='Overdue'?'--acc':''}"><span>${g}</span>${l.length}</div>${l.map(dlvRow).join('')}`:''}).join('');
 const recent=list.filter(p=>p.status==='received').sort((a,b)=>new Date(b.exp)-new Date(a.exp));
 const my=demo.empty?[]:RECEIPTS.filter(r=>r.noOrder&&r.by===A.state.me);
 body.innerHTML=head+(openL.length?groups:empty('No deliveries expected','Orders placed by the buyer appear here by day.'))
  +(recent.length?`<div class="stk-day"><span>Received in the last 7 days</span>${recent.length}</div>${recent.map(dlvRow).join('')}`:'')
  +`${sec('My receipts',my.length)}<div class="pad">${my.length?my.map(r=>`<div class="stk-req"><div class="t">${supN(r.sup)}</div><div class="m">${whenS(r.at)} · ${r.lines} line${r.lines>1?'s':''} · <span class="tag --soft">No order</span></div></div>`).join(''):'<p class="stk-small">Receipts without an order from the last 7 days show here.</p>'}</div>`;
};

/* ===================== DELIVERY & RECEIVING ===================== */
window.mount_stk_delivery=function(p){
 const id=+(p&&p.id);const o=po(id);const body=$('stk-dl-body');const cta=$('stk-dl-cta');cta.style.display='none';body.classList.remove('has-cta');
 bar('stk-dl-bar',o?supN(o.sup):'Delivery',demoIb,'stk-deliveries');
 if(demo.oldCrm){body.innerHTML=unavailable();return}
 if(!o){body.innerHTML=lock('Delivery not found','The order was removed or the link is wrong.');return}
 if(demo.offline){body.innerHTML=empty('Could not load the delivery','Check the connection.','--err');return}
 const d=S.dl[id]||(S.dl[id]={drafts:{},spent:false});
 const out=l=>Math.max(0,l.exp-l.rec);
 const canRec=can('receive')&&['ordered','in_transit','partially_received'].includes(o.status)&&o.lines.some(l=>out(l)>0);
 o.lines.forEach(l=>{if(d.drafts[l.id]==null||d.key!==o.lines.map(x=>x.id+':'+x.rec).join())d.drafts[l.id]=out(l)});d.key=o.lines.map(x=>x.id+':'+x.rec).join();
 const changed=o.lines.some(l=>out(l)>0&&d.drafts[l.id]!==out(l));
 const link=S.dlNewItem&&S.dlNewItem.orderId===id?S.dlNewItem:null;
 const lines=o.lines.map(l=>{const i=l.itemId?item(l.itemId):null;const ot=out(l);const linked=link&&link.lineId===l.id;return `<div class="stk-line">${i?thumb(i):`<span class="th">${I('leaf')}</span>`}<div class="f1"><div class="nm">${esc(l.name)}</div><div class="mt">${i?i.sku:(linked?'linked to new item':'<span class="w">not in stock yet</span>')} · expected ${l.exp} ${i?i.unit:'pcs'} · received ${l.rec}</div>${o.status==='partially_received'&&ot>0&&l.rec>0?`<div class="mt"><span class="w">outstanding ${ot}</span></div>`:''}</div>
  <div class="act">${canRec&&ot>0?`<div class="stk-step"><button onclick="STK.dlStep(${id},${l.id},-1)">−</button><input inputmode="numeric" value="${d.drafts[l.id]}" oninput="STK.dlSet(${id},${l.id},this.value)"><button onclick="STK.dlStep(${id},${l.id},1)">+</button></div>`:''}${can('receive')&&l.rec<l.exp&&o.receipts.length?`<button class="btn --xs --ghost" onclick="STK.claimLine(${id},${l.id})">Not delivered / faulty</button>`:''}</div></div>`}).join('');
 const rec=o.receipts.map(r=>{const mineR=r.by===A.state.me;const until=new Date(new Date(r.at).getTime()+864e5);const editable=mineR&&until>NOW;const closed=mineR&&until<=NOW;return `<div class="stk-req"><div class="t">${whenS(r.at)} · ${r.lines.length} line${r.lines.length>1?'s':''}${mineR?' · by me':' · '+nm(r.by)}</div><div class="m">${r.lines.map(x=>`${esc(x.name)} ${x.qty}`).join(' · ')}</div>${editable?`<div class="m">Edits until ${sameDay(until,NOW)?hm(until):dayS(until)+' '+hm(until)}</div><div class="a"><button class="btn --xs --secondary" onclick="STK.correct(${id},${r.id})">Correct quantities</button></div>`:closed?`<div class="m">Edits closed – ask a manager</div>`:can('manage')?`<div class="a"><button class="btn --xs --secondary" onclick="STK.correct(${id},${r.id})">Correct quantities</button></div>`:''}${!r.lines.length?'<div class="m">Edits need a newer CRM version</div>':''}</div>`}).join('');
 body.innerHTML=`<div class="pad mt8"><div class="stk-kv"><span>Order</span><span>${o.code} · Expected ${dayS(o.exp)}${o.note?' · '+esc(o.note):''}</span></div><div class="stk-kv"><span>Status</span><span><span class="pill --${POST[o.status][1]}">${POST[o.status][0]}</span> · ${recLines(o)} of ${o.lines.length} lines received</span></div></div>
  ${link?`<div class="stk-ban --ok">${esc(item(link.itemId).en)} created – the line is linked and goes with the next receipt.</div>`:''}
  ${sec('Lines',o.lines.length)}${lines}
  ${canRec?`<div class="stk-hint">${I('info')} Counters open on the outstanding quantity ("all arrived") – change only what came differently.</div>`:''}
  ${o.receipts.length?sec('Received',o.receipts.length)+`<div class="pad">${rec}</div>`:''}
  ${!can('receive')?`<div class="stk-ban --soft">Your account can see the order but not receive it.</div>`:''}`;
 if(canRec){cta.style.display='';body.classList.add('has-cta');cta.innerHTML=`<button class="btn --secondary" ${changed?'':'disabled'} onclick="STK.receive(${id},'lines')">With changes</button><button class="btn" onclick="STK.receive(${id},'all')">${I('check')} All arrived</button>`}
};
STK.dlStep=(id,lid,d)=>{const dr=S.dl[id].drafts;dr[lid]=Math.max(0,Math.min(1e6,(+dr[lid]||0)+d));mount_stk_delivery({id})};
STK.dlSet=(id,lid,v)=>{if(!/^\d*$/.test(v))return;S.dl[id].drafts[lid]=Math.max(0,Math.min(1e6,+v||0));const o=po(id);const changed=o.lines.some(l=>Math.max(0,l.exp-l.rec)>0&&S.dl[id].drafts[l.id]!==Math.max(0,l.exp-l.rec));$('stk-dl-cta').querySelector('.--secondary').disabled=!changed};
STK.receive=(id,mode)=>{const o=po(id);const d=S.dl[id];if(demo.offline){A.toast('Could not receive – no connection');return}
 const link=S.dlNewItem&&S.dlNewItem.orderId===id?S.dlNewItem:null;
 const missing=o.lines.find(l=>!l.itemId&&Math.max(0,l.exp-l.rec)>0&&!(link&&link.lineId===l.id));
 if(missing){A.sheet(`<div class="sh-head"><div class="h3">${esc(missing.name)} is not in stock yet</div></div><div class="sh-body"><p class="soft" style="margin:0 0 8px">Create the item, then receive again. The link is kept and goes with the next receipt.</p></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Cancel</button><button class="btn" ${can('manage')?'':'disabled'} onclick="App.closeSheet();App.go('stk-new',{name:'${esc(missing.name)}',linkLineId:${missing.id},orderId:${id}})">Create item</button></div>${can('manage')?'':'<p class="xs muted" style="padding:0 16px 12px;margin:0">Only the stock keeper creates items – ask a manager.</p>'}`);return}
 if(link){const l=o.lines.find(x=>x.id===link.lineId);if(l)l.itemId=link.itemId;S.dlNewItem=null}
 const before=o.lines.map(l=>l.rec);let any=false;const short=[];
 o.lines.forEach(l=>{const out=Math.max(0,l.exp-l.rec);if(!out)return;const q=mode==='all'?out:Math.min(out,+d.drafts[l.id]||0);if(mode==='lines'&&d.drafts[l.id]===out){l.rec+=out;any=true;const it=l.itemId&&item(l.itemId);if(it){it.onHand+=out;it.avail+=out}return}
  if(q>0){l.rec+=q;any=true;const it=l.itemId&&item(l.itemId);if(it){it.onHand+=q;it.avail+=q;it.status=it.onHand===0?'out':it.onHand<it.min?'low':'ok';it.movements.unshift({at:NOW.toISOString(),type:'Delivery '+o.code,by:A.state.me,q})}}
  if(l.rec<l.exp)short.push({line:l,rec:l.rec,exp:l.exp})});
 if(!any){A.toast('Nothing left to receive');return}
 const lines=o.lines.map((l,k)=>({id:k+1,name:l.name,qty:l.rec-before[k],lineId:l.id})).filter(x=>x.qty>0);
 o.receipts.push({id:500+o.receipts.length+20,at:NOW.toISOString(),by:A.state.me,lines});
 o.status=o.lines.every(l=>l.rec>=l.exp)?'received':'partially_received';
 A.haptic();
 if(short.length){A.sheet(`<div class="sh-head"><div class="h3">${short.length} item${short.length>1?'s':''} short</div></div><div class="sh-body">${short.map(s=>`<div class="stk-kv"><span>${esc(s.line.name)}</span><span>${s.rec} / ${s.exp}</span></div>`).join('')}<p class="xs muted" style="margin:12px 0 0">Delivery received. Raise a claim now or later from a line.</p></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet();STK.remount()">Not now</button><button class="btn" onclick="App.closeSheet();STK.openClaim(${id},${JSON.stringify(short.map(s=>s.line.id))})">Raise a claim</button></div>`);return}
 A.toast('Delivery received – stock updated');mount_stk_delivery({id})};
STK.openClaim=(id,lineIds)=>{const o=po(id);const ls=o.lines.filter(l=>lineIds.includes(l.id));const allZero=ls.every(l=>l.rec===0);S.claimForm={po:id,reason:allZero?'not_delivered':'short_delivery',reasonText:'',disp:'',note:'',photos:[],lines:ls.map(l=>({lineId:l.id,name:l.name,bad:String(l.exp-l.rec),dn:''}))};A.go('stk-claim-new',{po:id})};
STK.claimLine=(id,lid)=>STK.openClaim(id,[lid]);
STK.correct=(id,rid)=>{const o=po(id);const r=o.receipts.find(x=>x.id===rid);if(!r.lines.length){A.toast('Edits need a newer CRM version');return}const dr={};r.lines.forEach(l=>dr[l.id]=l.qty);STK._corr=dr;
 A.sheet(sh('Correct quantities',r.lines.map(l=>`<div class="flex ai-c jc-sb" style="padding:10px 0;border-bottom:1px solid var(--hair)"><span class="sm">${esc(l.name)}</span><div class="stk-step"><button onclick="STK.corrStep(${l.id},-1,this)">−</button><input inputmode="numeric" value="${l.qty}" oninput="STK._corr[${l.id}]=Math.max(0,+this.value||0)"><button onclick="STK.corrStep(${l.id},1,this)">+</button></div></div>`).join('')+'<p class="xs muted" style="margin:12px 0 0">Only changed lines are sent. Stock moves by the difference.</p>',`<button class="btn --secondary" onclick="App.closeSheet()">Cancel</button><button class="btn" onclick="STK.corrSave(${id},${rid})">Save edits</button>`))};
STK.corrStep=(lid,d,btn)=>{const inp=btn.parentNode.querySelector('input');const v=Math.max(0,(+inp.value||0)+d);inp.value=v;STK._corr[lid]=v};
STK.corrSave=(id,rid)=>{const o=po(id);const r=o.receipts.find(x=>x.id===rid);let n=0;r.lines.forEach(l=>{const v=STK._corr[l.id];if(v!=null&&v!==l.qty){const line=o.lines.find(x=>x.name===l.name);if(line){line.rec+=v-l.qty;const it=line.itemId&&item(line.itemId);if(it){it.onHand+=v-l.qty}}l.qty=v;n++}});if(demo.offline){A.toast('Could not save the edits');return}A.closeSheet();o.status=o.lines.every(l=>l.rec>=l.exp)?'received':(o.lines.some(l=>l.rec>0)?'partially_received':'ordered');A.toast(n?`${n} line${n>1?'s':''} corrected`:'Nothing changed');mount_stk_delivery({id})};

document.addEventListener('user',()=>{S.cnt={};S.newForm={};remount()});
})();
</script>
