<style>
/* Shell screens (tm-shell): sign in, passwords, workspace, launch & gates, system, push, admin lenses, tab rules, classic view */
.shx .pad{padding:0 var(--gutter)}
.shx .lead{padding:18px var(--gutter) 6px}
.shx .lead .h1{margin:0}
.shx .lead p{margin:8px 0 0;font-size:14px;color:var(--graphite);line-height:1.5}
.shx .logo{display:block;height:16px;width:auto;margin:28px auto 10px}
.shx .slogan{font-family:var(--f-display);font-weight:300;font-size:26px;text-align:center;line-height:1.1;margin:0 var(--gutter) 22px}
.shx .err{margin:0 var(--gutter) 14px;padding:12px 14px;border:1px solid var(--accent);color:var(--accent);font-size:13px;line-height:1.45}
.shx .ok{margin:0 var(--gutter) 14px;padding:14px;background:var(--silver);font-size:14px;line-height:1.5}
.shx .links{display:flex;flex-direction:column;gap:14px;align-items:center;padding:18px var(--gutter) 0}
.shx .links .textbtn{font-size:14px}
.shx .ws{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 var(--gutter) 16px;padding:12px 14px;background:var(--silver);font-size:13px}
.shx .ws .textbtn{font-size:13px}
.shx .rule{display:flex;gap:10px;align-items:center;font-size:13px;padding:6px 0;color:var(--grey)}
.shx .rule i{width:16px;height:16px;display:grid;place-items:center;border:1px solid var(--light);flex:none;font-size:10px}
.shx .rule.ok{color:var(--ink)}
.shx .rule.ok i{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.shx .forced{margin:0 var(--gutter) 16px;padding:14px;border-left:2px solid var(--ink);background:var(--silver);font-size:14px;line-height:1.5}
.shx .step{display:flex;gap:14px;padding:14px var(--gutter);border-bottom:1px solid var(--hair)}
.shx .step .n{width:26px;height:26px;border:1px solid var(--ink);display:grid;place-items:center;font-size:12px;flex:none}
.shx .step .n.on{background:var(--ink);color:var(--paper)}
.shx .step .l{font-size:15px;line-height:1.3}
.shx .step .d{font-size:13px;color:var(--grey);margin-top:3px;line-height:1.45}
.shx .step .btn{margin-top:10px}
.shx .step .f1{min-width:0}
.shx .grp{padding:26px var(--gutter) 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.shx .sw{display:flex;align-items:center;gap:12px;padding:14px var(--gutter);border-bottom:1px solid var(--hair)}
.shx .sw .f1 .l{font-size:15px}
.shx .sw .f1 .d{font-size:13px;color:var(--grey);margin-top:2px;line-height:1.45}
.shx .kv{display:flex;justify-content:space-between;gap:12px;padding:12px var(--gutter);border-bottom:1px solid var(--hair);font-size:14px}
.shx .kv span:last-child{color:var(--graphite);text-align:right}
.shx .kv.mono span:last-child{font-variant-numeric:tabular-nums}
.shx .segw{padding:6px var(--gutter) 10px}
.shx .chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px var(--gutter) 10px}
.shx .card{margin:14px var(--gutter) 0;padding:16px;background:var(--silver)}
.shx .card .h3{margin:0}
.shx .card .d{font-size:13px;color:var(--grey);margin-top:4px;line-height:1.45}
.shx .card .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.shx .lock{padding:40px var(--gutter)}
.shx .row .rt .d{line-height:1.45}
.shx .row.--moved .rt .d b{font-weight:400;color:var(--ink)}
.shx .mx{margin:8px var(--gutter) 0;border:1px solid var(--hair);font-size:12px}
.shx .mx .r{display:grid;grid-template-columns:1.6fr repeat(5,1fr);border-bottom:1px solid var(--hair)}
.shx .mx .r:last-child{border-bottom:0}
.shx .mx .r > span{padding:8px 6px;border-right:1px solid var(--hair);min-width:0;line-height:1.3}
.shx .mx .r > span:last-child{border-right:0}
.shx .mx .r.h span{color:var(--grey);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.shx .mx .r.me{background:var(--silver)}
.shx .mx .y{color:var(--ink)}
.shx .mx .n{color:var(--light)}
.shx .crash{position:absolute;inset:0;background:var(--paper);z-index:60;display:flex;flex-direction:column;justify-content:center;padding:0 var(--gutter)}
.shx .crash .h2{margin:0 0 8px}
.shx .crash p{font-size:14px;color:var(--graphite);line-height:1.5;margin:0 0 18px}
.shx .ptype{display:flex;align-items:center;gap:10px;padding:12px var(--gutter);border-bottom:1px solid var(--hair)}
.shx .ptype .f1 .l{font-size:14px}
.shx .ptype .f1 .d{font-size:12px;color:var(--grey);margin-top:2px;line-height:1.4}
.shx .perm{display:flex;gap:12px;padding:12px var(--gutter);border-bottom:1px solid var(--hair)}
.shx .perm .f1 .l{font-size:14px}
.shx .perm .f1 .d{font-size:12px;color:var(--grey);margin-top:2px;line-height:1.4}
.shx .bigfont .l,.shx .bigfont .d{font-size:1.3em}
.shx .fallback{font-family:Georgia,serif !important}
.shx .fallback *{font-family:Georgia,serif !important}
.shx .note{font-size:12px;color:var(--grey);padding:8px var(--gutter) 0;line-height:1.45}
.shx .cb{display:flex;gap:10px;align-items:center;padding:10px var(--gutter);font-size:13px;border-bottom:1px solid var(--hair)}
</style>

<script>
(function(){
const A=window.App;const $=s=>document.querySelector(s);
const S=()=>window.SH.state;
const ic=(n,s=18,x='')=>A.icon(n).replace('<svg',`<svg style="width:${s}px;height:${s}px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;${x}"`);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const back=(fb)=>`<button class="ib" onclick="App.back('${fb}')" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>`;
const sw=(t,d,on,fn)=>`<div class="sw"><span class="f1"><span class="l" style="display:block">${t}</span>${d?`<span class="d" style="display:block">${d}</span>`:""}</span><button class="switch ${on?"on":""}" aria-label="${esc(t)}" onclick="${fn}"></button></div>`;
const kv=(k,v,mono)=>`<div class="kv ${mono?"mono":""}"><span>${k}</span><span>${v}</span></div>`;
const row=(i,l,d,fn,right)=>`<button class="row" onclick="${fn}">${ic(i,20,"stroke:var(--grey)")}<span class="rt"><span class="l" style="display:block">${l}</span>${d?`<span class="d" style="display:block">${d}</span>`:""}</span>${right||A.icon("chev").replace("<svg",'<svg class="chev"')}</button>`;
const grp=t=>`<div class="grp">${t}</div>`;
const SHX=window.SHX={};

/* ================= SIGN IN ================= */
let L={email:"",pw:"",err:null,busy:false};
SHX.loginState=L;
function rLogin(){const s=S();
  const ws=s.multiTenant&&s.workspace?`<div class="ws"><span>Workspace: <b>${s.workspace}</b></span><button class="textbtn" onclick="App.go('sh-workspace')">Change</button></div>`:"";
  const E={429:"Too many attempts. Try again in a minute.",server:"The email or password is wrong.",ws:"Your account is on another workspace – signing you in there…",other:"Something went wrong. Check the connection and try again."}[L.err];
  const can=L.email.trim()&&L.pw;
  $("#shl-body").innerHTML=`<img class="logo" src="logo.svg" alt="Floritta"><div class="slogan">Flowers, delivered with care.</div>
  ${A.state.params&&A.state.params.reason==="401"?`<div class="ok">Your session ended – the server no longer accepts this phone’s token. Sign in again; the screens were cleared and background location stopped.</div>`:""}
  ${ws}${E?`<div class="err">${E}</div>`:""}
  <div class="pad"><div class="field"><label>Email</label><input class="input" id="shl-email" type="email" autocomplete="email" placeholder="you@floritta.uk" value="${esc(L.email)}" oninput="SHX.lin('email',this.value)"></div>
  <div class="field"><label>Password</label><input class="input" id="shl-pw" type="password" autocomplete="current-password" placeholder="••••••••" value="${esc(L.pw)}" oninput="SHX.lin('pw',this.value)" onkeydown="if(event.key==='Enter')SHX.signIn()"></div>
  <button class="btn --block ${can&&!L.busy?"":"is-disabled"}" id="shl-go" onclick="SHX.signIn()">${L.busy?"Signing in…":"Sign in"}</button></div>
  <div class="links"><button class="textbtn" onclick="App.go('sh-forgot')">Forgot password?</button><button class="textbtn" onclick="SHX.code()">I have a code</button>${!s.multiTenant||!s.workspace?`<button class="textbtn" onclick="App.go('fl-welcome')">Become a courier</button>`:""}</div>
  <div class="note" style="text-align:center;margin-top:22px">The phone name is sent with the sign-in so you can see this device in the CRM. The token stays in the device keychain until the server ends it.</div>
  <div class="chips" style="justify-content:center;margin-top:18px"><span class="xs muted" style="width:100%;text-align:center;margin-bottom:4px">Demo · errors</span><button class="chip" onclick="SHX.lerr(429)">429</button><button class="chip" onclick="SHX.lerr('server')">Wrong password</button><button class="chip" onclick="SHX.lerr('ws')">Other workspace</button><button class="chip" onclick="SHX.lerr('other')">Network</button><button class="chip ${s.multiTenant?"on":""}" onclick="SHX.multi()">Multi-tenant build</button></div>`;
  if(!can)$("#shl-go").style.opacity=.45}
SHX.lin=(k,v)=>{L[k]=v;L.err=null;const go=$("#shl-go");const can=L.email.trim()&&L.pw;go.classList.toggle("is-disabled",!can);go.style.opacity=can?1:.45};
SHX.lerr=e=>{L.err=e;rLogin();if(e==="ws")setTimeout(()=>{A.toast("Workspace remembered: bloom.floritta.ai · signing in there");L.err=null;rLogin()},1800)};
SHX.multi=()=>{const s=S();s.multiTenant=!s.multiTenant;if(s.multiTenant&&!s.workspace){A.toast("Multi-tenant build without a workspace – choose one first");A.go("sh-workspace",{},{replace:true});return}rLogin()};
SHX.signIn=()=>{if(!(L.email.trim()&&L.pw)||L.busy)return;A.haptic();L.busy=true;rLogin();
  setTimeout(()=>{L.busy=false;if(S().offline){L.err="other";rLogin();return}
    const u=STAFF.find(x=>x.id===A.state.me);S().signedIn=true;L.pw="";rLogin();
    A.toast(`Signed in as ${u.n} · asking for notification permission`);
    setTimeout(()=>A.push("Notifications","Allow Floritta Team to send you notifications? · Allow",{icon:"bell",ms:2600}),600);
    setTimeout(()=>{A.state.history=[];
      if(S().mustChangePassword){A.go("sh-password",{forced:true});return}
      if(A.role()==="courier"&&S().needsGeoConsent){SH.goOr("cr-consent",{},"Courier without signed location consent → Consent screen (Courier section)");A.go("home",{});return}
      if(S().classic){A.go("sh-classic",{});return}
      A.go("home",{})},1500)},700)};
SHX.code=()=>{if(document.getElementById("s-rs-code")){A.go("rs-code",{});return}
  A.sheet(`<div class="sh-head"><div class="h3">Enter your code</div><button class="ib" aria-label="Close" onclick="App.closeSheet()">${A.icon("close")}</button></div><div class="sh-body"><p class="sm soft" style="margin:0 0 10px">Invited through “Work with us”? The code from the email signs you in as reserve; then you set your own password.</p><div class="field"><label>Code</label><input class="input" id="shl-code" placeholder="FLO-2748" autocapitalize="characters"></div></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Cancel</button><button class="btn" onclick="App.closeSheet();App.setUser('lola',{silent:true});SH.state.mustChangePassword=true;App.go('sh-password',{forced:true,reserve:true})">Continue</button></div>`)};
window.mount_sh_login=function(){rLogin()};

/* ================= FORGOT ================= */
let F={email:"",sent:false,err:null};
function rForgot(){const E={429:"Too many requests – wait a minute and try again.",422:"That doesn’t look like an email address.",other:"Could not reach the server. Try again."}[F.err];
  $("#shf-body").innerHTML=`<div class="lead"><div class="h1">Reset your password</div><p>We will email you a link. It works for 60 minutes.</p></div>${E?`<div class="err">${E}</div>`:""}
  ${F.sent?`<div class="ok">If an account exists for <b>${esc(F.email)}</b>, we’ve sent a link. Check your inbox and spam. The message is the same whether or not the email is known – it never reveals accounts.</div><div class="pad"><button class="btn --block --secondary" onclick="App.go('sh-login',{},{replace:true})">Back to sign in</button></div>`:
  `<div class="pad"><div class="field"><label>Email</label><input class="input" id="shf-email" type="email" placeholder="you@floritta.uk" value="${esc(F.email)}" oninput="SHX.fin(this.value)" onkeydown="if(event.key==='Enter')SHX.sendLink()"></div><button class="btn --block" onclick="SHX.sendLink()">Send link</button></div>
  <div class="links"><button class="textbtn" onclick="App.go('sh-login',{},{replace:true})">Back to sign in</button></div>
  <div class="chips" style="justify-content:center;margin-top:22px"><span class="xs muted" style="width:100%;text-align:center;margin-bottom:4px">Demo · errors</span><button class="chip" onclick="F.err=429;SHX.rf()">429</button><button class="chip" onclick="F.err=422;SHX.rf()">422</button><button class="chip" onclick="F.err='other';SHX.rf()">Network</button></div>`}`};
SHX.rf=rForgot;SHX.fin=v=>{F.email=v;F.err=null};
SHX.sendLink=()=>{const v=F.email.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){F.err=422;rForgot();return}A.haptic();F.sent=true;F.err=null;rForgot();A.toast("Sent – if the account exists")};
window.mount_sh_forgot=function(){F={email:"",sent:false,err:null};rForgot()};

/* ================= CHANGE PASSWORD ================= */
let Pw={cur:"",nw:"",rep:"",forced:false,reserve:false};
function rPw(){const strong=Pw.nw.length>=8&&/[A-Za-z]/.test(Pw.nw)&&/\d/.test(Pw.nw);const match=Pw.nw&&Pw.nw===Pw.rep;
  const r=(ok,t)=>`<div class="rule ${ok?"ok":""}"><i>${ok?"✓":""}</i>${t}</div>`;
  $("#shp-back").style.visibility=Pw.forced?"hidden":"";
  $("#shp-body").innerHTML=`${Pw.forced?`<div class="forced" style="margin-top:16px"><b>Set your own password to continue.</b><br>${Pw.reserve?"You signed in with the code from your email – it is already in the first field.":"You signed in with a temporary password."} Other screens open after this.</div>`:`<div class="lead"><div class="h1">Change password</div><p>You stay signed in on this phone – no need to sign in again.</p></div>`}
  <div class="pad"><div class="field"><label>Current password${Pw.reserve?" · code from the email":""}</label><input class="input" type="password" value="${esc(Pw.cur)}" oninput="SHX.pin('cur',this.value)" ${Pw.reserve?'style="background:var(--silver)"':""}></div>
  <div class="field"><label>New password</label><input class="input" type="password" value="${esc(Pw.nw)}" oninput="SHX.pin('nw',this.value)"></div>
  <div class="field"><label>Repeat new password</label><input class="input" type="password" value="${esc(Pw.rep)}" oninput="SHX.pin('rep',this.value)"></div>
  <div style="padding:0 0 14px">${r(Pw.nw.length>=8,"At least 8 characters")}${r(/[A-Za-z]/.test(Pw.nw)&&/\d/.test(Pw.nw),"A letter and a digit")}${r(match,"Both new passwords match")}</div>
  <button class="btn --block ${strong&&match&&Pw.cur?"":"is-disabled"}" style="opacity:${strong&&match&&Pw.cur?1:.45}" onclick="SHX.savePw()">Save password</button></div>
  ${Pw.forced?"":`<div class="note">Also from Me → Settings. In the old “More” tab this was “Change password”.</div>`}`};

  const u=window.SH.realUser();
  $("#shz-body").innerHTML=`<div class="card" style="margin-top:16px"><div class="h3">${u.n}</div><div class="d">tatiana@example.com · admin${s.viewAs?` · viewing as ${s.viewAs}`:""} · workspace ${s.workspace||"floritta"}</div></div>
  ${grp("App version · on the server")}
  ${chips([["a","A · one contour"],["b","B · contours on"]],s.variant,"SHX.variant")}
  <div class="note" style="padding-top:0">Everything except an explicit B counts as A: all staff in the employee contour. B turns on worker / self-employed contours and the contour lens. Saved to the CRM for you; the navigator rebuilds without a restart. In a dev build an environment variable can force it; releases ignore it.</div>
  <div class="chips"><button class="chip" onclick="SHX.variantFail()">Demo · server refuses</button></div>
  ${grp("Contour lens · this phone only")}
  ${s.variant==="b"?chips([["","Off"],["employee","Employee"],["worker","Worker"],["self_employed","Self-employed"]],s.contourLens||"","SHX.contour")+`<div class="note" style="padding-top:0">Applies at once, screens re-render in place – the tabs are not remounted, Me stays open. Reserve ignores it. Non-admins ignore it. In this prototype the lens moves the tab bar and the clock strip; the contour panels follow the persona (Zhanna · worker, Mina · self-employed, Lola · reserve).</div>`:`<div class="note">Switch to version B to use the contour lens.</div>`}
  ${grp("View as · role")}
  ${chips([["admin","Admin"],["manager","Manager"],["florist","Florist"],["courier","Courier"]],s.viewAs||"admin","SHX.viewRole")}
  <div class="note" style="padding-top:0">Changes what tabs, cards and buttons you see – not your rights on the server and not background location. Tabs remount for the role. A banner stays on top until “Back”.</div>
  ${s.viewAs==="florist"?row("users","Whose data",`${s.whoseData==="mine"?"Yours":A.user(s.whoseData).n} – bonuses, orders and shelf of that florist`,"SHX.whose()"):""}
  ${s.viewAs?row("lock","Open Timesheet approval as this role","A 403 under the lens shows a notice instead of an error","SHX.forbidDemo()"):""}
  ${s.viewAs?row("send","Mark 715619 ready and send the photo","Messages to the customer ask first under the lens","SH.sendGuard('Photo of 715619 to Anna K.',()=>App.toast('Sent to the customer'))"):""}
  ${grp("Emergency")}
  ${row("swap","Classic view (temporary)","Puts this phone on the old tabs. Managers and admins only. “Back to the new design” is in the old More tab.","SHX.classic(true)")}
  ${row("layers","Tab bar rules","Which tabs each role and contour gets","App.go('sh-tabs')")}`};
SHX.variant=v=>{if(v===S().variant)return;S().variant=v;if(v==="a")S().contourLens=null;A.toast(`Saved · version ${v.toUpperCase()} – navigator and gates rebuilt`);rLenses();window.SH.applyTabs()};
SHX.variantFail=()=>A.confirm("Could not switch","The server did not accept the change. Nothing was changed on this phone.","OK",()=>{});
SHX.contour=v=>{S().contourLens=v||null;A.toast(v?`Contour lens · ${v.replace("_"," ")} – Today re-rendered in place`:"Contour lens off");rLenses();window.SH.applyTabs()};
SHX.viewRole=v=>{if(v==="admin"){if(S().viewAs)window.SH.viewAs(null);else A.toast("You are already the admin");rLenses();return}window.SH.viewAs(v)};
SHX.whose=()=>{const fl=STAFF.filter(x=>x.role==="florist"&&!x.staff_type);A.sheet(`<div class="sh-head"><div class="h3">Whose data</div><button class="ib" aria-label="Close" onclick="App.closeSheet()">${A.icon("close")}</button></div><div class="sh-body">${[{id:"mine",n:"Mine"}].concat(fl).map(x=>`<button class="radio ${S().whoseData===x.id?"on":""}" onclick="SH.state.whoseData='${x.id}';App.closeSheet();SH.banner();App.toast('Showing ${x.n==="Mine"?"your own":x.n+"’s"} data');SHX.rl()"><span class="rd"></span><span>${x.n}</span></button>`).join("")}</div>`)};
SHX.rl=()=>rLenses();
SHX.forbidDemo=()=>window.SH.forbid("Timesheet approval");
window.mount_sh_lenses=function(){rLenses()};

/* ================= TAB BAR RULES ================= */
function rTabs(){const SH_=window.SH;const me=A.me();const c=SH_.contour();const r=SH_.role();
  const rows=[["Employee / worker · florist, manager, admin",1,1,1,1,1,"employee|worker:florist|manager"],["Employee / worker · seasonal, trainee",1,0,1,1,1,"limited"],["Employee / worker · courier",1,0,"Route",1,1,"employee|worker:courier"],["Self-employed · any role",1,0,1,0,1,"self_employed"],["Reserve",1,0,"Offers",0,1,"reserve"]];
  const key=c==="reserve"?"reserve":c==="self_employed"?"self_employed":SH_.limited()?"limited":`${c}:${r==="courier"?"courier":"florist"}`;
  const isMe=k=>k==="limited"?key==="limited":k.includes(":")?k.split(":")[0].split("|").includes(c)&&(k.split(":")[1].split("|").includes(r)||(k.split(":")[1]==="florist|manager"&&["florist","manager"].includes(r))):k===key;
  const cell=v=>v===1?`<span class="y">yes</span>`:v===0?`<span class="n">—</span>`:`<span class="y">${v}</span>`;
  $("#sht-body").innerHTML=`<div class="lead"><div class="h1">Tab bar</div><p>Today · Tasks · Work · Learn · Me. The set depends on the effective role, limited access and the contour.</p></div>
  <div class="mx"><div class="r h"><span>Contour / role</span><span>Today</span><span>Tasks</span><span>Work</span><span>Learn</span><span>Me</span></div>${rows.map(x=>`<div class="r ${isMe(x[6])?"me":""}"><span>${x[0]}</span>${cell(x[1])}${cell(x[2])}${cell(x[3])}${cell(x[4])}${cell(x[5])}</div>`).join("")}</div>
  <div class="note">Highlighted: ${me.n} · ${c.replace("_"," ")} · ${r}${SH_.limited()?" · limited":""}. Version ${S().variant.toUpperCase()}${S().variant==="a"?" – everyone is employee":""}.</div>
  ${grp("Rules")}
  ${kv("Today","always · reserve gets its own checklist Today")}
  ${kv("Tasks","hidden for couriers, seasonal and trainees, self-employed, reserve")}
  ${kv("Work","always · named “Route” for couriers · offers for reserve")}
  ${kv("Learn","hidden on three-tab contours (self-employed, reserve)")}
  ${kv("Me","always")}
  ${kv("Role lens","remounts all tabs for that role")}
  ${kv("Contour lens","re-renders in place, Me stays open")}
  ${kv("Look","caps labels 10.5 px Jost · active ink, inactive grey · hairline on top · no system font scaling · Android height 64")}
  ${grp("Hidden tab by link")}
  ${row("route","Open Tasks as a courier","A hidden tab is still reachable by link or push: Tasks sends a courier back to Today; self-employed and limited can open it.","App.setUser('anton',{silent:true});App.go('tasks')")}
  ${row("route","Open Tasks as self-employed","Opens – only the tab is hidden","App.setUser('mina',{silent:true});App.go('tasks')")}`};
window.mount_sh_tabs=function(){rTabs()};

/* ================= CLASSIC VIEW ================= */
function rClassic(){const s=S();const r=A.role()==="owner"?"admin":A.role();const lim=window.SH.limited();const mgr=r==="manager"||r==="admin";const me=A.me();
  const tab=(name,who,where,fn)=>`<button class="row --moved" onclick="${fn}">${ic("layers",20,"stroke:var(--grey)")}<span class="rt"><span class="l" style="display:block">${name} <span class="xs muted">· ${who}</span></span><span class="d" style="display:block">Now: <b>${where}</b></span></span>${A.icon("chev").replace("<svg",'<svg class="chev"')}</button>`;
  const tabs=[
   r!=="courier"?tab("Home","all but couriers","Today + Work → Orders","App.go('home')"):"",
   (r==="courier"||mgr)&&!lim?tab("Deliveries","couriers, managers","Work → Deliveries / Route","SH.goOr('route')"):"",
   tab("Schedule","everyone","Me → Schedule","SH.goOr('schedule')"),
   r!=="courier"&&!lim?tab("Tasks","florists, managers","Tasks tab","App.go('tasks')"):"",
   r==="courier"||lim?tab("Training","couriers, seasonal, trainees","Learn tab","App.go('learn')"):"",
   tab("Shift","everyone","Today → clock strip · Me → Time sheet","SH.goOr('timeclock')"),
   mgr?tab("Inbox (chats)","managers with comms.view","Work → Chats · Inbox for notifications","App.go('inbox')"):"",
   r!=="courier"&&!lim?tab("Stock","florists, managers","Work → Stock","SH.goOr('work',{view:'stock'})"):"",
   tab("More","everyone","Me","App.tab('me')")].join("");
  const more=(name,where,fn,show=true)=>show?`<button class="row --moved" onclick="${fn}">${ic("chev",20,"stroke:var(--grey)")}<span class="rt"><span class="l" style="display:block">${name}</span><span class="d" style="display:block">Now: <b>${where}</b></span></span></button>`:"";
  $("#shc-body").innerHTML=`<div class="card" style="margin-top:16px"><div class="h3">Classic view (temporary)</div><div class="d">The old tabs on this phone only. The role lens rebuilds them, each opens as that role sees it. Nothing new is designed here – every function has a home in the new design.</div><div class="btns"><button class="btn --sm" onclick="SHX.classic(false)">Back to the new design</button></div></div>
  ${grp("Old tabs → where they live now")}${tabs}
  ${grp("Old “More” → where it lives now")}
  <div class="card"><div class="h3">${me.n}</div><div class="d">${me.n.toLowerCase()}@floritta.uk · ${r}${s.viewAs?` · viewing as ${s.viewAs}`:""} · workspace ${s.workspace||"floritta"}</div><div class="d">Now: Me → profile card</div></div>
  ${more("View as · Admin / Florist / Courier","Me → Admin lenses","App.go('sh-lenses')",r==="admin")}
  ${sw("Notifications on this phone","Now: Me → Notifications",!s.pushMuted,"SHX.mute();SHX.rc()")}
  ${more("Appearance · Light / Dark / System","Me → Settings → System","App.go('sh-system')")}
  ${more("Language · English / Русский / System","Me → Settings → System","App.go('sh-system')")}
  ${more("My week","Me → My week","SH.goOr('schedule')",!lim)}
  ${more("Announcements","Today card + Inbox","App.go('announcement',{id:1})")}
  ${more("My learning (incl. alcohol training)","Learn tab","App.go('learn')")}
  ${more("Floritta Active","Me → Floritta Active","SH.goOr('active',{},'Opens Floritta Active (Me section)')",!lim)}
  ${more("Zones of responsibility","Me → Zones","SH.goOr('zones',{},'Opens Zones (Me section)')",!lim)}
  ${more("Out of stock – order / Needs ordering","Work → Stock → Restock","SH.goOr('work',{view:'stock'})",!lim)}
  ${more("Site leads / Missed calls","Work → Orders → Leads","SH.goOr('work',{view:'orders',tab:'leads'})",mgr)}
  ${more("Not paid","Today → manager row · Me → Not paid","SH.goOr('unpaid',{},'Opens Not paid (Me · Pay section)')",mgr)}
  ${more("Customers due a repeat","Work → Orders → Customers","SH.goOr('work',{view:'orders',tab:'customers'})",mgr)}
  ${more("Florists’ bonus","Me → Bonus (admin, only when the CRM answers)","SH.goOr('bonus')",r==="admin")}
  ${more("Timesheet","Me → Time sheet","SH.goOr('timeclock')",mgr)}
  ${more("Change password","Me → Settings → Change password","App.go('sh-password')")}
  ${row("logout","Sign out","No confirmation in classic – push token removed, caches cleared, tracking stopped","S_signOutClassic()")}`;
  window.S_signOutClassic=()=>{S().signedIn=false;A.toast("Signed out · push unregistered");A.state.history=[];A.go("sh-login",{})}}
SHX.rc=()=>rClassic();
window.mount_sh_classic=function(){S().classic=true;rClassic()};

/* On Me: the shell Me screen is another agent's; links to these screens are offered through the stand list and via goOr. */
})();
</script>
