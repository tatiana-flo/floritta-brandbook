const VL={jobs:'Jobs',orders:'Orders',deliveries:'Deliveries',stock:'Stock',chats:'Chats',manage:'Shifts'};
function views(){
  const r=A.role();const v=[];
  if(isSE())v.push('jobs');
  if(r==='courier')return ['deliveries'];
  if(limited())return v.concat(['orders']);
  if(r==='florist'){v.push('orders','stock');return v}

const chainWork=window.mount_work;
window.mount_work=function(p){
  p=p||{};
  if(isRes()||isFree()){X.workView=null;return chainWork&&chainWork(p)}   /* reserve and freelance courier: their own Work screens (other sections) */
  const vs=views();
  if(p.view&&vs.includes(p.view)&&p.view!==X.seenParam){X.workView=p.view;X.seenParam=p.view}
  if(!X.workView||!vs.includes(X.workView))X.workView=vs[0];
  const v=X.workView;
  const bar=$('#wk-bar'),body=$('#wk-body'),cta=$('#wk-cta');
  const useOrig=(v==='orders'&&!isSE())||(v==='deliveries'&&A.role()==='courier');
  if(useOrig){chainWork(p);const tt=bar.querySelector('.ttl');if(tt)tt.textContent=A.role()==='courier'?'Route':'Work'}
  else{
    bar.innerHTML=`<div class="ttl">${A.role()==='courier'?'Route':'Work'}</div>`;
    body.innerHTML=({jobs:jobsHtml,orders:ordersLiteHtml,deliveries:mgrDeliveriesHtml,stock:stockHtml,chats:chatsHtml,manage:mgrHtml})[v]();

    ${tags?`<div class="tags">${tags}</div>`:''}

function groupHtml(list,withMySteps){
  const g={late:[],steps:[],today:[],later:[],review:[],done:[]};
  list.forEach(t=>{if(t.status==='done'){if(t.doneAt&&sameDay(t.doneAt))g.done.push(t);return}if(t.status==='review'){g.review.push(t);return}if(A.isLate(t)){g.late.push(t);return}if(sameDay(t.due))g.today.push(t);else g.later.push(t)});
  const allDoneToday=g.done.length&&!g.late.length&&!g.today.length&&!g.later.length&&!g.review.length;
  let h='';
  const sec=(l,arr,cls)=>arr.length?`<div class="tk-sh ${cls||''}"><div class="h3">${l}</div><span class="n">${arr.length}</span></div><div class="tlist">${arr.map(t=>A.taskCard(t)).join('')}</div>`:'';
  h+=sec('Overdue',g.late,'--late');
  if(withMySteps)h+=stepsHtml();
  h+=sec('Today',g.today)+sec('Later',g.later)+sec('To check',g.review)+sec(allDoneToday?'Done today':'Done',g.done);

let decorating=false;
function decorateTasks(){
  const el=$('#tk-tin');if(!el||A.state.current!=='tasks'||decorating)return;decorating=true;
  try{
    const act=$('#tk-act');
    if(act&&!act.querySelector('.wx-tact')){
      act.insertAdjacentHTML('afterbegin',`<button class="ib wx-tact" onclick="WX.x('toggleView')" aria-label="List or board">${A.icon(X.view==='board'?'list':'board')}</button><button class="ib wx-tact" onclick="WX.x('tdemoSheet')" aria-label="Demo states">${A.icon('eye')}</button>`);
    }
    if(tasksHidden()){
      el.innerHTML=`<div class="wx-empty" style="padding-top:64px"><div class="h3">${A.role()==='courier'?'Tasks are not for couriers':'This tab is hidden for you'}</div>${A.role()==='courier'?'Opened by a link, this screen sends you straight home and asks the server for nothing.':'Self-employed, reserve and freelance contours do not have the Tasks tab.'}<div class="mt16"><button class="btn --sm" onclick="App.tab('home')">Go home</button></div></div>`;return;
    }
    if(X.tdemo==='failed'){el.innerHTML=failHtml();return}
    const seg=el.querySelector('.seg');
    if(X.scope===null)X.scope='mine';
    if(X.questions){el.innerHTML=questionsHtml();return}
    const wantView=X.scope==='pool'?'pool':X.view==='board'?'board':'mine';
    const cur=seg?(['mine','board','pool'][$$('button',seg).findIndex(b=>b.classList.contains('on'))]):null;
    if((X.scope==='mine'||X.scope==='pool')&&(!seg||cur!==wantView)){decorating=false;window.TSK.setView(wantView);return}
    let top=scopeBar();
    const ann=(window.ANNOUNCEMENTS||[]).find(a=>!a.ack);
    if(ann)top=`<button class="wx-ann ann" onclick="App.go('announcement',{id:${ann.id}})">${ic('megaphone',18)}<div class="f1"><div class="t">${esc(ann.title)}</div><div class="d">${first(ann.by)} · acknowledge</div></div>${chev}</button>`+top;
    const demo=tasksDemoHtml();
    if(demo){el.innerHTML=top+demo;return}
    if(X.scope==='byme'||X.scope==='all'){
      const list=X.scope==='byme'?byMe():TASKS.slice();
      el.innerHTML=top+quickAddHtml()+`<div class="mt8">${X.view==='board'?`<div class="wx-note">Board view of this scope – the same four columns.</div>`:''}${groupHtml(list,false)}</div>`+footHtml();bindMoves(el);return;
    }

      const sb=el.querySelector('.wx-scope').parentElement;

    }

}

/* long-press on a card or a tap on its status pill → «Move to…» */
function bindMoves(el){
  $$('.tcard',el).forEach(card=>{
    const m=/App\.go\('task',\{id:(\d+)\}\)/.exec(card.getAttribute('onclick')||'');if(!m)return;const id=+m[1];
    const pill=card.querySelector('.pill');if(pill){pill.style.cursor='pointer';pill.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();moveSheet(id)})}
    let tm;const dn=()=>{tm=setTimeout(()=>{A.haptic();moveSheet(id);card.dataset.lp='1'},350)};const up=()=>clearTimeout(tm);
    card.addEventListener('pointerdown',dn);card.addEventListener('pointerup',up);card.addEventListener('pointerleave',up);
    card.addEventListener('click',e=>{if(card.dataset.lp){delete card.dataset.lp;e.stopImmediatePropagation();e.preventDefault()}},true);
  });
}
function moveOptions(t){
  const me=meId(),mgr=isMgr(),ass=t.assignee===me||(t.also||[]).includes(me),author=t.by===me;
  const needs=t.photo?'photo':t.proof==='comment'?'comment':null;
  const o=[];
  if(t.status==='todo'&&(ass||mgr))o.push({k:'start',l:'Start',i:'play'});
  if((t.status==='todo'||t.status==='doing')&&(ass||mgr))o.push({k:'finish',l:(t.photo||(t.checklist||[]).length)&&!author?'Finish – to check':'Finish – done',i:'check',need:needs});
  if(t.status==='review'&&(author||mgr))o.push({k:'approve',l:'Accept – done',i:'checksq'});
  if((t.status==='review'||t.status==='done')&&(author||mgr))o.push({k:'reopen',l:'Send back',i:'swap',d:'With a reason'});
  else if(t.status==='done'&&ass)o.push({k:'undo',l:'Undo',i:'repeat',d:'Back to in progress'});
  return o;
}
function moveSheet(id){
  const t=A.task(id);if(!t)return;const o=moveOptions(t);
  if(!o.length){App.go('task',{id});return}
  A.sheet(`${shHead('Move to…')}<div class="sh-body">${o.map(x=>`<button class="wx-mv" onclick="WX.x('move',${id},'${x.k}')">${A.icon(x.i)}<div><div>${x.l}</div>${x.d?`<div class="d">${x.d}</div>`:''}</div>${x.need?`<span class="need">${x.need}</span>`:''}</button>`).join('')}<button class="wx-mv" onclick="App.closeSheet();App.go('task',{id:${id}})">${A.icon('arrow')}<div>Open task ›</div></button></div>`);
}
function reasonSheet(title,hint,fn){

  ofPublish(){const f=X.of;f.err='';
    const tm=/^\d{2}:\d{2}$/;
    if(f.date&&!/^\d{4}-\d{2}-\d{2}$/.test(f.date))f.err='Date must be YYYY-MM-DD.';
    else if(!tm.test(f.start)||!tm.test(f.end))f.err='Starts and Ends must be real times, e.g. 09:00.';
    else if(f.end<=f.start)f.err='The shift must end after it starts, on the same day.';
    else if(hoursUntil(f)<0)f.err='The start is in the past.';
    else if(!f.place.trim())f.err='Place is required.';
    else if(X.serverErr)f.err='CRM: 422 – a shift for this role already exists at this time.';
    if(f.err){renderOfferForm();return}
    if(X.offline){offlineFail();return}
    const hu=hoursUntil(f);const o={id:Date.now(),off:f.date?Math.max(0,Math.round((new Date(f.date)-new Date(2026,9,20))/864e5)):f.off,role:f.role,start:f.start,end:f.end,place:f.place.trim(),spots:f.spots,booked:[],status:'open',note:f.note.trim()};
    X.offers.push(o);X.of={role:f.role,off:1,date:'',start:f.start,end:f.end,place:'',spots:1,note:'',err:''};A.closeSheet();
    setTimeout(()=>alertSheet('Shift published',(hu<48?'Short notice – it starts in under 48 h. ':'')+`Everyone of the role gets a push: ${dlab(o.off)} ${o.start}–${o.end} · ${o.place}.`,'OK'),200);
    setTimeout(()=>A.push('Open shift · '+dlab(o.off),`${o.start}–${o.end} · ${o.place} · ${o.spots} place${o.spots>1?'s':''}`,{icon:'calendar',to:o.role==='courier'?'Max':'Zhadra'}),1300);rerenderJobs()},
  cancelOffer(id){const o=X.offers.find(x=>x.id==id);A.sheet(`${shHead('Cancel this shift?')}<div class="sh-body"><p class="soft" style="margin:0 0 8px">Everyone who took it gets a push. Nothing is paid or deducted.</p></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Keep</button><button class="btn --accent" onclick="WX.x('cancelOfferDo',${id})">Cancel it</button></div>`)},
  cancelOfferDo(id){A.closeSheet();if(X.offline){offlineFail();return}X.inFlight['o'+id]=true;rerenderJobs();setTimeout(()=>{const o=X.offers.find(x=>x.id==id);o.status='cancelled';delete X.inFlight['o'+id];A.toast('Shift cancelled');if(o.booked.length)setTimeout(()=>A.push('Shift cancelled',`${dlab(o.off)} ${o.start}–${o.end} · nothing is paid or deducted`,{icon:'close',to:first(o.booked[0])}),500);rerenderJobs()},800)},
  jobForm(){jobForm()},
  jfSet(k,v){X.jf[k]=v;if(k==='role')renderJobForm()},
  jfPublish(){const f=X.jf;f.err='';
    const FEE=/^\d{1,5}(\.\d{1,2})?$/;
    if(!f.title.trim())f.err='Title is required.';
    else if(!f.brief.trim())f.err='Brief is required – the person needs to know what to do.';
    else if(!FEE.test(f.fee.trim())||+f.fee<=0)f.err='Fee: up to 5 digits and 2 decimals, more than 0.';
    else if(f.date&&!/^\d{4}-\d{2}-\d{2}$/.test(f.date))f.err='Date must be YYYY-MM-DD.';
    else if(X.serverErr)f.err='CRM: 422 – could not publish. Check the fee and the date.';
    if(f.err){renderJobForm();return}
    if(X.offline){offlineFail();return}
    const off=f.date?Math.max(0,Math.round((new Date(f.date)-new Date(2026,9,20))/864e5)):null;
    const j={id:Date.now(),off,when:off==null?(f.when.trim()||'Date to agree'):dlab(off)+' · '+(f.time||'09:00')+(f.when?' · '+f.when:''),title:f.title.trim(),fee:+f.fee,place:f.place.trim(),tags:[],role:f.role,status:'open',brief:f.brief.trim(),materials:f.materials.trim()?f.materials.split(',').map(s=>s.trim()):null};
    X.jobs.unshift(j);X.jf=null;A.closeSheet();
    setTimeout(()=>alertSheet('Job published',`Self-employed ${f.role==='any'?'florists and couriers':f.role+'s'} with a signed agreement get a push: ${gbp(j.fee)} · ${j.title}.`,'OK'),200);
    setTimeout(()=>A.push('New job · '+gbp(j.fee),j.title+' · '+j.when,{icon:'flower',to:f.role==='courier'?'Dana':'Mira'}),1300);rerenderJobs()},
  cancelJob(id){const j=X.jobs.find(x=>x.id==id);A.sheet(`${shHead('Cancel this job?')}<div class="sh-body"><p class="soft" style="margin:0 0 8px">Whoever took it gets a push. Nothing is paid.</p></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Keep</button><button class="btn --accent" onclick="WX.x('cancelJobDo',${id})">Cancel it</button></div>`)},
  cancelJobDo(id){A.closeSheet();if(X.offline){offlineFail();return}X.inFlight['mj'+id]=true;rerenderJobs();setTimeout(()=>{const j=X.jobs.find(x=>x.id==id);const by=j.by;j.status='cancelled';delete X.inFlight['mj'+id];A.toast('Job cancelled');if(by)setTimeout(()=>A.push('Job cancelled',j.title+' · nothing is paid',{icon:'close',to:first(by)}),500);rerenderJobs()},800)},
  /* catalog */
  catF(k){X.catF=k;window.mount_wx_catalog()},
  catDemo(k){X.catDemo=k;window.mount_wx_catalog()},
  catRefresh(){A.toast('Catalog refreshed');window.mount_wx_catalog()},
  catTake(id){const c=X.catalog.find(x=>x.id===id);if(!c||X.inFlight['c'+id])return;if(X.offline){offlineFail();return}X.inFlight['c'+id]=true;window.mount_wx_catalog();
    setTimeout(()=>{delete X.inFlight['c'+id];const t=A.addTask({title:c.title,assignee:meId(),by:'valeria',due:A.T(16,0),desc:c.desc+' · '+c.pts+' points when checked.',tags:['shop']});if(t){alertSheet('Taken!','“'+c.title+'” is on your list for this shift. '+c.pts+' points when the manager checks it.','Open task',()=>A.go('task',{id:t.id}))}window.mount_wx_catalog()},700)},
  /* tasks tab */
  scope(k){X.scope=k;X.questions=false;if(k==='pool')window.TSK.setView('pool');else if(k==='mine')window.TSK.setView(X.view==='board'?'board':'mine');else decorateTasks()},
  toggleView(){X.view=X.view==='board'?'list':'board';const b=$('#tk-act .wx-tact');if(b)b.innerHTML=A.icon(X.view==='board'?'list':'board');if(X.scope==='mine')window.TSK.setView(X.view==='board'?'board':'mine');else decorateTasks()},
  questions(v){X.questions=v;decorateTasks();const b=$('#tk-tbody');if(b)b.scrollTop=0},
  tdemo(k){if(k==='offline'){X.offline=!X.offline;A.toast(X.offline?'Offline – every write fails, nothing is queued':'Back online')}else X.tdemo=k;A.closeSheet();window.mount_tasks()},
  tdemoSheet(){const d=X.tdemo;A.sheet(`${shHead('Demo states')}<div class="sh-body">${[['normal','Normal'],['loading','Loading'],['error','Loading error'],['empty','Empty'],['forbidden','Admin only (403 on “All”)'],['failed','Tab failed – error boundary']].map(([k,l])=>`<button class="radio ${d===k?'on':''}" onclick="WX.x('tdemo','${k}')"><span class="rd"></span><span>${l}</span></button>`).join('')}<button class="radio ${X.offline?'on':''}" onclick="WX.x('tdemo','offline')"><span class="rd"></span><span>Offline (writes fail)</span></button></div>`)},
  qaOpen(){X.qa={title:'',body:'',who:[meId()],due:'shift',dueIso:A.T(16,0),err:''};decorateTasks();setTimeout(()=>{const i=$('#wx-qat');if(i)i.focus()},50)},
  qaClose(){X.qa=null;decorateTasks()},
  qaSet(k,v){X.qa[k]=v;if(k==='due'){X.qa.dueIso=v==='shift'?A.T(16,0):v==='today'?A.T(18,0):A.T(9,0,1);decorateTasks()}},
  qaWho(){peopleSheet(X.qa.who,false,sel=>{X.qa.who=sel;decorateTasks()})},
  qaDue(){dueSheet(X.qa.dueIso,iso=>{X.qa.due='pick';X.qa.dueIso=iso;decorateTasks()})},
  qaAll(){const q=X.qa;X.qa=null;A.go('task-new',{title:q.title,body:q.body,who:q.who})},
  qaCreate(){const q=X.qa;if(!q||q.busy)return;q.err='';
    if(!q.title.trim())q.err='Title is required.';else if(q.title.length>191)q.err='Title is too long (191).';
    if(q.err){decorateTasks();return}
    if(X.offline){q.err='Could not create – no connection.';decorateTasks();return}
    q.busy=true;decorateTasks();
    setTimeout(()=>{const who=q.who.length?q.who[0]:null;
      if(!who){A.toast('Added to the pool');X.qa=null;decorateTasks();return}
      const t=A.addTask({title:q.title.trim(),assignee:who,also:q.who.slice(1),desc:q.body.trim(),due:q.dueIso,tags:[]});A.haptic();X.qa=null;A.toast('Task created');decorateTasks()},500)},
  dictate(){dictate()},
  recCancel(){clearInterval(X.rec.timer);X.rec=null;A.closeSheet();A.toast('Recording discarded')},
  recStop(){if(!X.rec||X.rec.t<1)return;clearInterval(X.rec.timer);X.rec=null;
    A.sheet(`${shHead('Transcribing…')}<div class="sh-body"><div class="wx-sk" style="margin:8px 0 16px"><i style="height:20px"></i><i style="height:20px;width:70%"></i></div><div class="sm soft">Sending the recording and building the draft (up to 90 s).</div></div>`);
    setTimeout(()=>{A.closeSheet();A.go('task-new',{title:'Restock ribbons before the weekend',body:'Check the drawer under the wrapping station, write what is below 20.',voice:{transcript:'Sofia, please restock the ribbons before the weekend, check the drawer under the wrapping station and write what is below twenty, by Friday evening',warnings:['unknown_assignee'],unknownNames:['Sofia']}})},1600)},
  askOpt(id,i){X.ans=Object.assign({id,opt:null,text:'',fields:{},free:false},X.ans&&X.ans.id===id?X.ans:{});X.ans.opt=i;redrawAsk(id)},
  askField(id,f,v){X.ans=Object.assign({id,opt:null,text:'',fields:{},free:false},X.ans&&X.ans.id===id?X.ans:{});X.ans.fields[f]=v},
  askText(id,v){X.ans=Object.assign({id,opt:null,text:'',fields:{},free:false},X.ans&&X.ans.id===id?X.ans:{});X.ans.text=v},
  askFree(id){X.ans=Object.assign({id,opt:null,text:'',fields:{},free:false},X.ans&&X.ans.id===id?X.ans:{});X.ans.free=true;redrawAsk(id)},
  askSend(id){const a=ASK(id);const an=X.ans&&X.ans.id===id?X.ans:{opt:null,text:'',fields:{},free:false};
    let answer='';
    if(an.free||(!a.options&&!a.fields)){if(!an.text.trim()){A.toast('Write an answer first');return}answer=an.text.trim()}
    else if(a.options){if(an.opt==null){A.toast('Pick an option');return}answer=a.options[an.opt]}
    else if(a.fields){const miss=a.fields.find(f=>!(an.fields[f]||'').trim());if(miss){A.toast('Fill in all fields');return}answer=a.fields.map(f=>f+': '+an.fields[f]).join(' · ')}
    if(X.offline){offlineFail();return}
    X.answered[id]=answer;X.ans=null;A.haptic();A.toast('Answer sent to '+first(a.from));setTimeout(()=>A.push(first(meId())+' answered',a.title+' – '+answer,{icon:'chat',to:first(a.from)}),600);
    if(A.state.current==='task')renderAskDetail(a);else decorateTasks()},
  move(id,k){A.closeSheet();const t=A.task(id);if(!t)return;
    if(k==='start')A.setTaskStatus(id,'doing');
    else if(k==='finish'){const need=t.photo&&!(t.comments||[]).some(c=>c.photo)?'photo':t.proof==='comment'&&!(X.proofNote[id]||'').trim()?'comment':null;if(need){A.go('task',{id});setTimeout(()=>A.toast(need==='photo'?'Add the photo first':'Write the proof comment first'),400);return}A.setTaskStatus(id,(t.photo||(t.checklist||[]).length)&&t.by!==meId()?'review':'done')}
    else if(k==='approve')window.TSK.approve(id);
    else if(k==='reopen')reasonSheet('Send back','Say what should change – '+first(t.assignee)+' sees the reason on the task.',v=>{t.comments.push({by:meId(),t:'Sent back – '+v,at:NOWI()});A.setTaskStatus(id,'doing',{silent:true});A.toast('Moved to In progress');setTimeout(()=>A.push(first(meId())+' sent it back',t.title+' · '+v,{icon:'swap',to:first(t.assignee),go:['task',{id}]}),600)});
    else if(k==='undo'){A.setTaskStatus(id,'doing',{silent:true});A.toast('Moved to In progress')}},
  ppl(id){const p=X.ppl;if(p.single){A.closeSheet();p.fn([id==='__free'?null:id].filter(Boolean));return}
    if(id==='__free'){p.picked.clear()}else{p.picked.delete('__free');if(p.picked.has(id))p.picked.delete(id);else p.picked.add(id)}
    $$('#sheet .check').forEach(c=>{const m=/WX\.x\('ppl','([^']+)'\)/.exec(c.getAttribute('onclick'));if(m)c.classList.toggle('on',m[1]==='__free'?p.picked.size===0:p.picked.has(m[1]))})},
  pplDone(){const p=X.ppl;A.closeSheet();p.fn([...p.picked])},
  dueD(i){X.due.d=i;renderDue()},
  dueT(m){X.due.h=Math.floor(m/60);X.due.m=m%60;renderDue()},
  dueReset(){A.closeSheet();X.due.fn(A.T(16,0));A.toast('Due reset to end of shift')},
  dueSet(){const s=X.due;A.closeSheet();s.fn(A.T(s.h,s.m,s.d))},
  tplSheet(){A.sheet(`${shHead('Templates')}<div class="sh-body">${TEMPLATES.map(tp=>`<button class="tk-mrow" onclick="App.closeSheet();TSK.tpl('${tp.id}')">${A.icon('layers')}<div class="f1"><div>${esc(tp.title)}</div><div class="d">${tp.n} steps · ${esc(tp.repeat)} · ${tp.role}</div></div></button>`).join('')}</div>`)},
  /* task detail */
  edSave(id){const t=A.task(id);const ti=$('#wx-et').value.trim(),d=$('#wx-ed').value;if(!ti){alertSheet('Title can’t be empty','Give the task a name before saving.','OK',()=>editSheet(id));return}if(X.offline){offlineFail();return}t.title=ti;t.desc=d;A.closeSheet();A.toast('Saved');document.dispatchEvent(new CustomEvent('tasks',{detail:{id}}))},
  edAss(id){const t=A.task(id);peopleSheet([t.assignee].concat(t.also||[]).filter(Boolean),false,sel=>{if(X.offline){offlineFail();return}if(!sel.length){A.toast('A task with no assignee goes to the pool – use “Hand back” instead');return}t.assignee=sel[0];t.also=sel.slice(1);A.toast('Assignees saved');document.dispatchEvent(new CustomEvent('tasks',{detail:{id}}))})},
  edDue(id){const t=A.task(id);dueSheet(t.due,iso=>{if(X.offline){offlineFail();return}t.due=iso;A.toast('Due moved to '+A.fmtDue(iso));document.dispatchEvent(new CustomEvent('tasks',{detail:{id}}))})},
  edPri(id){const t=A.task(id);A.sheet(`${shHead('Priority')}<div class="sh-body"><button class="radio ${!t.urgent?'on':''}" onclick="WX.x('edPriSet',${id},false)"><span class="rd"></span><span>Normal</span></button><button class="radio ${t.urgent?'on':''}" onclick="WX.x('edPriSet',${id},true)"><span class="rd"></span><span>Urgent<small class="muted" style="display:block;font-size:12px">Priority push, ignores quiet hours · managers only</small></span></button></div>`)},
  edPriSet(id,v){A.closeSheet();if(X.offline){offlineFail();return}const t=A.task(id);t.urgent=v||undefined;A.toast(v?'Marked urgent':'Priority: normal');document.dispatchEvent(new CustomEvent('tasks',{detail:{id}}))},
  edProof(id){const t=A.task(id);const cur=t.photo?'photo':t.proof==='comment'?'comment':'none';A.sheet(`${shHead('Proof to close')}<div class="sh-body">${[['photo','Photo','A photo is required before it can be sent'],['comment','Comment','A written note is required'],['none','Not needed','Photo or note optional']].map(([k,l,d])=>`<button class="radio ${cur===k?'on':''}" onclick="WX.x('edProofSet',${id},'${k}')"><span class="rd"></span><span>${l}<small class="muted" style="display:block;font-size:12px">${d}</small></span></button>`).join('')}</div>`)},
  edProofSet(id,k){A.closeSheet();if(X.offline){offlineFail();return}const t=A.task(id);t.photo=k==='photo'||undefined;t.proof=k==='comment'?'comment':undefined;A.toast('Proof: '+({photo:'photo',comment:'comment',none:'not needed'})[k]);document.dispatchEvent(new CustomEvent('tasks',{detail:{id}}))},
  proofNote(id,v){X.proofNote[id]=v;const cta=$('#tk-cta .btn:not(.--ghost)');const hint=$('#tk-cta .tk-hint');if(cta){cta.disabled=!v.trim();if(v.trim()&&hint)hint.remove()}},
  clip(){if(X.cmtPhotos.length>=5){A.toast('Up to 5 photos per comment');return}A.sheet(`${shHead('Attach')}<div class="sh-body"><button class="tk-mrow" onclick="WX.x('clipAdd')">${A.icon('camera')}<div class="f1"><div>Take a photo</div></div></button><button class="tk-mrow" onclick="WX.x('clipAdd')">${A.icon('photo')}<div class="f1"><div>From the library</div><div class="d">Up to 5 per comment · ${X.cmtPhotos.length} added</div></div></button></div>`)},
  clipAdd(){A.closeSheet();X.cmtPhotos.push(ORDERS[(X.cmtPhotos.length+4)%ORDERS.length].img);decorateFromEvent()},
  clipRm(i){X.cmtPhotos.splice(i,1);decorateFromEvent()},
  skip(id){A.closeSheet();const t=A.task(id);reasonSheet('Skip today’s routine','Why is it skipped today? '+first(t.by)+' sees the reason; tomorrow’s one still comes.',v=>{t.comments.push({by:meId(),t:'Skipped today – '+v,at:NOWI()});A.setTaskStatus(id,'done',{silent:true});A.toast('Skipped for today');setTimeout(()=>A.push('Routine skipped',t.title+' · '+v,{icon:'moon',to:first(t.by)}),600)})},
  askCancel(id){A.closeSheet();const t=A.task(id);reasonSheet('Ask to cancel','Only '+first(t.by)+' or a manager can cancel it. Say why.',v=>{t.comments.push({by:meId(),t:'Asked to cancel – '+v,at:NOWI()});t.cancelAsked=true;A.toast('Request sent to '+first(t.by));setTimeout(()=>A.push(first(meId())+' asks to cancel',t.title+' · '+v,{icon:'close',to:first(t.by),go:['task',{id}]}),600);document.dispatchEvent(new CustomEvent('tasks',{detail:{id}}))})},
  cancelTask(id){A.closeSheet();const t=A.task(id);A.sheet(`${shHead('Cancel this task?')}<div class="sh-body"><p class="soft" style="margin:0 0 8px">${first(t.assignee)} is told and the task leaves the board. It can’t be undone.</p></div><div class="sh-foot"><button class="btn --secondary" onclick="App.closeSheet()">Keep</button><button class="btn --accent" onclick="App.closeSheet();TSK.cancelAsk()">Yes, cancel</button></div>`);setTimeout(()=>{const ok=$('#sheet .btn.--accent');if(ok)ok.onclick=()=>{A.closeSheet();if(X.offline){offlineFail();return}const i=TASKS.indexOf(t);if(i>=0)TASKS.splice(i,1);A.renderBadges();A.back('tasks');A.toast('Task cancelled');setTimeout(()=>A.push('Task cancelled',t.title,{icon:'close',to:first(t.assignee)}),600)}},0)}
};
function redrawAsk(id){const a=ASK(id);const el=$('#wx-ask-'+id);if(el)el.outerHTML=askCard(a,A.state.current==='task')}
function decorateFromEvent(){const c=A.state.current;if(c==='task')window.mount_task(A.state.params);else if(c==='tasks')decorateTasks()}
document.addEventListener('tasks',()=>{const c=A.state.current;if(c==='tasks')decorateTasks();else if(c==='task')decorateTask()});
document.addEventListener('user',()=>{X.scope=null;X.questions=false;X.qa=null;X.workView=null;X.seenParam=null;X.cmtPhotos=[];X.ans=null;X.ordTab=null});
const chainTasks=window.mount_tasks;
window.mount_tasks=function(p){chainTasks(p);decorateTasks()};
})();
</script>
