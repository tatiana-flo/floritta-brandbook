<script>
(function(){
'use strict';
const A=window.App, ic=A.icon, L=window.LR, GL=window.T21;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const {sic,chev}=L;
const E=GL.E, SEASONS=GL.SEASONS, MN=GL.MN, NOWM=GL.NOWM;
const segs=(on,tot)=>Array.from({length:tot},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('');
const ricon=n=>ic(n).replace('<svg','<svg class="ic"');
/* ================= Azbuka home ================= */
let GH={demo:'live'};
window.mount_gl_home=function(){
const b=$('#gh-body');
const chips=`<div class="lr-demo" style="padding-top:4px">${[['live','Live'],['offline','Offline copy'],['loading','Loading'],['error','Error'],['none','No cards']].map(d=>`<button class="chip ${GH.demo===d[0]?'on':''}" onclick="T57.ghDemo('${d[0]}')">${d[1]}</button>`).join('')}</div><button class="lr-ptr" onclick="App.haptic();App.toast('Glossary refreshed · copy on the phone updated, photos cached')">${ic('repeat')} Pull to refresh</button>`;
if(GH.demo==='loading'){b.innerHTML=chips+`<div class="lr-sk skeleton"></div><div class="lr-sk skeleton" style="height:120px"></div>`;return}
if(GH.demo==='error'){b.innerHTML=chips+`<div class="pad"><div class="panel --accent"><div class="h4 accent">Didn't load</div><div class="sm soft mt4">Pull down to try again. Retried twice already; not retried on a 4xx.</div></div></div>`;return}
if(GH.demo==='none'){b.innerHTML=chips+`<div class="pad"><div class="panel"><div class="h3">No cards yet</div><div class="sm soft mt4">CRM has not published any glossary cards. On Learn the Азбука card and its heading are not shown at all.</div></div></div>`;return}
const learned=L.glossKnown, tot=GL.total, q=GL.deckQueue(''), newN=q.filter(e=>e.st==='new').length, rev=q.length-newN, quizN=GL.quizQueue().length, peakN=SEASONS.filter(s=>s.peak.includes(NOWM)&&s.peak.length<10).length;
const secs=GL.SECS.map(s=>{const all=E.filter(e=>e.sec===s.k).length, l=E.filter(e=>e.sec===s.k&&e.st==='learned').length;return `<button class="gh-sec" onclick="App.go('gl-list',{sec:'${s.k}'})">${ricon(s.k==='cut'?'flower':s.k==='green'?'leaf':s.k==='pot'?'sun':s.k==='balloon'?'star':s.k==='wrap'?'tag':s.k==='tools'?'edit':s.k==='gift'?'star':'leaf')}<div class="rt f1"><div class="sm">${s.n}</div></div><span class="xs muted num">${all?`${l} / ${all}`:'soon'}</span>${chev}</button>`}).join('');
b.innerHTML=chips+GL.offBar()+`<div class="lr-hero" style="padding-top:4px">${A.ring(learned/tot,96,'lr-big')}<div class="f1"><div class="caps muted">Learned</div><div class="h2 mt4">${learned} of ${tot}</div><div class="xs muted mt4">Counted only after a right answer in the quiz</div><div class="mt8">${A.pill('done',`${GL.streak} days in a row`)}</div></div></div>
<div class="sec-head"><div class="h2">Today</div></div>
<button class="gh-tile big" onclick="App.go('glossary',{fresh:true,tab:'deck'})">${ricon('book')}<div class="f1"><div class="h3">Deck of the day</div><div class="sm mt4" style="opacity:.8">${L.glossDone?'All done for today':`${newN} new + ${rev} to review · ~${Math.max(1,Math.round(q.length*.4))} min`}</div></div><span class="lr-link" style="color:var(--paper);border-color:rgba(253,253,253,.5)">Start</span></button>
<button class="gh-tile" onclick="App.go('glossary',{fresh:true,tab:'photo'})">${ricon('camera')}<div class="f1"><div class="h4">What is it?</div><div class="sm muted mt4">${quizN} photos waiting to be checked</div></div>${chev}</button>
<button class="gh-tile" onclick="App.go('gl-list')">${ricon('search')}<div class="f1"><div class="h4">Reference</div><div class="sm muted mt4">Search by EN / RU / Latin</div></div>${chev}</button>
<button class="gh-tile" onclick="App.go('glossary',{fresh:true,tab:'seasons'})">${ricon('sun')}<div class="f1"><div class="h4">Seasons</div><div class="sm muted mt4">${GL.noSeasons?'Not published yet':`October: ${peakN} at peak`}</div></div>${chev}</button>
<div class="sec-head"><div class="h2">Sections</div></div>${secs}<div class="pad xs muted mt12">Saved on this phone · works in the cold room without signal.</div><div style="height:16px"></div>`;
};
const T57=window.T57={};
T57.ghDemo=v=>{GH.demo=v;GL.offline=v==='offline';L.noSeasons=GL.noSeasons;window.mount_gl_home()};
/* ================= Reference list ================= */
let GS={q:'',f:'all'};
window.mount_gl_list=function(p){
p=p||{};if(p.sec)GS.f=p.sec;
const b=$('#gls-body');
const F=[['all','All'],['learn','Learn'],['new','New']].concat(GL.SECS.filter(s=>E.some(e=>e.sec===s.k)).map(s=>[s.k,s.n]));
const norm=s=>(s||'').toLowerCase().replace(/ё/g,'е');
const q=norm(GS.q);
let list=E.filter(e=>GS.f==='all'?true:GS.f==='learn'?e.st==='learn'||e.st==='check':GS.f==='new'?e.st==='new':e.sec===GS.f);
if(q)list=list.filter(e=>[e.n,e.ru,e.lat,e.genus].some(x=>norm(x).includes(q)));
b.innerHTML=`<div class="gl-search mt4">${ic('search')}<input class="input" id="gls-q" placeholder="Rose, роза, Rosa…" autocorrect="off" autocapitalize="none" spellcheck="false" value="${GS.q.replace(/"/g,'&quot;')}" oninput="T57.glsQ(this.value)">${GS.q?`<button class="clr" aria-label="Clear" onclick="T57.glsQ('')">${ic('close')}</button>`:''}</div>

h=`<div class="pad lr-slide"><div class="flex ai-c mt16" style="gap:22px">${m?`<div id="lx-ring">${A.ring(0,112,'lr-big'+(pass?' --ok':''))}</div>`:`<span style="font-size:56px;line-height:1" class="${pass?'ok':needs?'':'accent'}">${sic(pass?'check':needs?'clock':'close',56,1.2)}</span>`}<div class="f1"><div class="caps muted">Result</div><h1 class="h1 mt4">${pass?'Passed!':needs?'Sent':'Not yet'}</h1><div class="sm soft mt4">${m?`${ok} of ${m} right`:''}${reason?` · ${reason}`:''}</div></div></div>
${needs?`<div class="panel --warn mt16"><div class="h4">Awaiting manager countersign</div><div class="sm soft mt4">Vanessa countersigns declarations within a shift. You will get a push.</div></div>`:''}
${l.proof==='declaration'?`<div class="panel mt12 sm">Signed: ${X.name} · 20 Oct 11:12<div class="xs muted mt8">Your choices: ${X.choices.map((c,i)=>c?'yes':'no').join(' · ')}</div></div>`:''}
${pass?`<div class="panel --ok mt12 flex ai-c g12"><span class="ok">${sic('timer',20)}</span><div class="sm">+${l.mins} min of work time</div></div>`:''}
${!l.consent?`<div class="lx-cmp"><div><span class="caps">You wrote</span>${X.words||'—'}</div><div><span class="caps">As in the lesson</span>${l.ref}</div></div>`:''}
${m?`<div class="mt16" style="border-top:1px solid var(--hair)">${rows}</div>`:''}
${!pass&&!needs?`<div class="flex g8 mt16" style="flex-wrap:wrap">${m?`<button class="btn --xs --secondary" onclick="T57.lxRetry()">Answer again</button>`:''}${l.consent?'':`<button class="btn --xs --secondary" onclick="T57.lxGo('words')">Rewrite the main idea</button>`}<button class="btn --xs --ghost" onclick="T57.lxGo('read')">Re-read the lesson</button></div>`:''}</div>`;
c=`<button class="btn" onclick="App.back('learn')">Back to learning</button>`;hi=pass?'Counted everywhere: B, classic and the freelance app':'';
}
b.innerHTML=chipsBar()+h;b.scrollTop=0;cta.innerHTML=prev+c;hint.textContent=hi;
if(st==='result'&&l.questions.length)L.animRing($('#lx-ring .ring'),X.verdict.ok/l.questions.length);
if(st==='proof'&&l.proof==='declaration')sigInit();
}
function sigInit(){
const box=$('#lx-sig'),cv=$('canvas',box);if(!cv)return;const body=$('#lx-body');
const r=box.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;const ctx=cv.getContext('2d');ctx.scale(2,2);ctx.lineWidth=1.8;ctx.lineCap='round';ctx.strokeStyle='#1e1a17';
let on=false,lx=0,ly=0;
cv.onpointerdown=e=>{on=true;body.style.overflowY='hidden';const q=cv.getBoundingClientRect();lx=e.clientX-q.left;ly=e.clientY-q.top;cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!on)return;const q=cv.getBoundingClientRect(),x=e.clientX-q.left,y=e.clientY-q.top;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();X.sig+=Math.hypot(x-lx,y-ly);lx=x;ly=y};
cv.onpointerup=cv.onpointercancel=()=>{on=false;body.style.overflowY='';X.sigShort=X.sig>0&&X.sig<120;const m=$('#lx-sigmsg');if(m){m.textContent=X.sigShort?'Too short – sign again':'Signature captured';m.className='xs '+(X.sigShort?'accent':'ok')}};
}
T57.lxLang=v=>{X.lang=v;lxPaint()};
T57.lxCk=i=>{X.ck=X.ck||[];X.ck[i]=!X.ck[i];A.haptic();lxPaint()};
T57.lxWords=v=>{X.words=v;const wc=v.trim().split(/\s+/).filter(Boolean).length,ok=wc>=5;$('#lx-dots').innerHTML=[0,1,2,3,4].map(i=>`<i class="${i<wc?'on':''}"></i>`).join('')+`<span>${Math.min(wc,5)} of 5 words</span>`;$('#lx-wc').textContent=ok?'Looks good':'Minimum 5 words';$('#lx-wc').className='xs '+(ok?'ok':'muted');$('#lx-next').disabled=!ok};
T57.lxPick=k=>{X.answers[X.qi]=k;A.haptic();lxPaint()};
T57.lxUrl=v=>{X.url=v};
T57.lxName=v=>{X.name=v};
T57.lxAccept=()=>{X.accept=!X.accept;A.haptic();lxPaint()};
T57.lxChoice=(i,v)=>{X.choices[i]=v;A.haptic();lxPaint()};
T57.lxSigClear=()=>{X.sig=0;X.sigShort=false;lxPaint()};
T57.lxPhotoSheet=()=>A.sheet(`<div class="sh-head"><div class="h3">Photo</div><button class="ib" onclick="App.closeSheet()">${ic('close')}</button></div><div class="sh-body"><button class="row" style="padding-left:0;padding-right:0" onclick="App.closeSheet();T57.lxPhoto()">${ricon('camera')}<div class="rt"><div class="l">Take a photo</div></div></button><button class="row" style="padding-left:0;padding-right:0" onclick="App.closeSheet();T57.lxPhoto()">${ricon('image')}<div class="rt"><div class="l">Choose from library</div></div></button><div class="xs muted mt12">Camera refused → the phone's own alert with a link to Settings.</div></div>`);
T57.lxPhoto=()=>{X.photo=true;A.toast('Photo attached');lxPaint()};
T57.lxNext=()=>{const st=X.steps[X.step];if(st==='quiz'&&X.qi<X.l.questions.length-1){X.qi++;lxPaint();return}if(st==='quiz'&&X.steps[X.step+1]==='result'){T57.lxSubmit();return}X.step++;if(X.steps[X.step]==='quiz')X.qi=0;lxPaint()};
T57.lxPrev=()=>{const st=X.steps[X.step];if(st==='quiz'&&X.qi>0){X.qi--;lxPaint();return}if(X.step>0)X.step--;if(X.steps[X.step]==='quiz')X.qi=X.l.questions.length-1;lxPaint()};
T57.lxSubmit=()=>{
const l=X.l;X.err='';
const wc=X.words.trim().split(/\s+/).filter(Boolean).length;
const missingAns=l.questions.some((q,i)=>X.answers[i]==null);
if(l.proof==='declaration'&&(X.choices.some(c=>c===null)||!X.accept||X.name.trim().split(/\s+/).length<2||X.sig<120)){X.err='Answer every question, write your full name, accept the text and sign.';X.sigShort=X.sig>0&&X.sig<120;lxPaint();return}
if(l.proof==='link'&&!/^https?:\/\/\S+/.test(X.url)){X.err='Paste a link that starts with https://';A.toast(X.err);return}
if(l.proof==='photo'&&!X.photo){A.toast('Attach the photo first');return}
if(missingAns||(!l.consent&&wc<5)){A.toast('Answer every question and write the main idea');return}
if(GL.offline){A.toast('Couldn\'t send. Check the connection – your answers are kept');return}
const ok=l.questions.filter((q,i)=>X.answers[i]===q.ok).length, n=l.questions.length;
const pass=(n?ok/n>=.6:true)&&(l.consent||wc>=5);
X.verdict={v:l.proof==='declaration'?'needs_review':pass?'pass':'fail',ok,n};
if(!pass)X.last={answers:X.answers.slice()};
X.step=X.steps.indexOf('result');A.haptic();lxPaint();
if(pass&&l.proof!=='declaration'){const real=A.lesson(l.id);if(real&&real.status!=='done')A.completeLesson(l.id,n?ok/n:1)}
if(l.proof==='declaration'&&L.R()==='courier')L.alcoholSigned=true;
};
T57.lxRetry=()=>{const i=X.l.questions.findIndex((q,k)=>X.answers[k]!==q.ok);X.qi=Math.max(0,i);X.step=X.steps.indexOf('quiz');lxPaint()};
T57.lxGo=s=>{X.step=X.steps.indexOf(s);lxPaint()};
T57.lxReopen=i=>{X.qi=i;X.step=X.steps.indexOf('quiz');lxPaint()};

$('#lxg-body').innerHTML=`<div class="lr-hero" style="padding-top:4px">${A.ring(d/n,96,'lr-big')}<div class="f1"><div class="caps muted">Development plan</div><div class="h2 mt4">${d} of ${n} goals</div><div class="sm soft mt4">Written with Vanessa · 6 Oct</div></div></div>
