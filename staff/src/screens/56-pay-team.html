<!-- 56-pay-team.html – B: Pay, Pay → week, Statements, Business profile, Tax & status, My agreement, Shift offers.
     Static replacements for the dynamic screens the shell builds with mk() (pay / statements / bizprofile / taxstatus / agreement).
     Shared helpers: window.PT (used by 56-pay-team-2.html at mount time). -->
<style>
.pt .demo{display:flex;gap:6px;padding:8px var(--gutter) 4px;overflow-x:auto;scrollbar-width:none;align-items:center}
.pt .demo::-webkit-scrollbar{display:none}
.pt .demo small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);flex:none;margin-right:4px}
.pt .demo .chip{height:26px;font-size:11px;padding:0 10px;flex:none}
.pt .ptr{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);text-align:center;padding:6px 0 0}
.pt .ptr.busy{color:var(--ink)}
.pt .stt{padding:40px var(--gutter);text-align:center;color:var(--graphite);font-size:14px;line-height:1.5}
.pt .stt .sp{width:22px;height:22px;border:1.5px solid var(--light);border-top-color:var(--ink);border-radius:50%;margin:0 auto 14px;animation:ptspin .9s linear infinite}
@keyframes ptspin{to{transform:rotate(360deg)}}
.pt .stt.err{color:var(--accent)}
.pt .wrow{display:flex;align-items:center;gap:12px;padding:14px var(--gutter);border-bottom:1px solid var(--hair);width:100%;text-align:left}
.pt .wrow .l{font-size:15px}.pt .wrow .d{font-size:13px;color:var(--grey);margin-top:2px}
.pt .wrow .amt{font-size:15px;white-space:nowrap;text-align:right}.pt .wrow .amt .pill{margin-top:4px}
.pt .display{font-family:var(--f-display);font-size:44px;font-weight:300;line-height:1}
.pt .line{display:flex;justify-content:space-between;gap:12px;padding:11px var(--gutter);border-bottom:1px solid var(--hair);font-size:14px}
.pt .line.t{font-weight:500}
.pt .line .sub{font-size:12px;color:var(--grey);display:block;margin-top:2px}
.pt .chips.wrap{flex-wrap:wrap;overflow:visible}
.pt .input.bad{border-color:var(--accent)}
.pt .errt{font-size:12px;color:var(--accent);margin-top:-8px;margin-bottom:12px}
.pt .signed{margin:0 var(--gutter);padding:16px;background:var(--ok-bg)}
.pt .signed.exp{background:var(--accent-bg)}
.pt .body{margin:0 var(--gutter);padding:14px 16px;border:1px solid var(--hair);font-size:13.5px;line-height:1.55;color:var(--graphite);user-select:text;-webkit-user-select:text;white-space:pre-line}
.pt .ag-sig{position:relative;margin:0 var(--gutter);border:1px solid var(--ink);background:#fff;height:160px}
.pt .ag-sig canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pt .ag-sig .ph{position:absolute;left:16px;bottom:12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);pointer-events:none}
.pt .ag-check{display:flex;gap:12px;align-items:flex-start;margin:0 var(--gutter);text-align:left;font-size:14px;color:var(--graphite);width:calc(100% - 2*var(--gutter))}
.pt .ag-check i{flex:none;width:20px;height:20px;border:1px solid var(--ink);margin-top:1px}
.pt .ag-check.on i{background:var(--ink)}
.pt .offer{border:1px solid var(--hair);padding:14px var(--gutter);margin:0 var(--gutter) 10px;background:var(--paper)}
.pt .offer.mine{border-color:var(--ink)}.pt .offer.gone{opacity:.55}
.pt .offer .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pt .offer .hrs{font-family:var(--f-display);font-size:26px;font-weight:300;line-height:1.05;margin-top:4px}
.pt .offer .meta{font-size:13px;color:var(--graphite);margin-top:6px}
.pt .offer .btns{display:flex;gap:8px;margin-top:14px}.pt .offer .btns .btn{flex:1}
.pt .alerts{margin:0 var(--gutter);border:1px solid var(--hair);padding:14px 16px}
.pt .alerts .r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.pt .jobrow{display:flex;justify-content:space-between;gap:12px;padding:10px var(--gutter) 10px calc(var(--gutter) + 16px);font-size:13px;border-bottom:1px solid var(--hair);background:var(--silver)}
.pt .jobrow .d{color:var(--grey);font-size:12px;margin-top:2px}
.pt .lensnote{margin:0 var(--gutter) 10px;padding:10px 12px;background:var(--warn-bg);font-size:12px;color:var(--graphite)}
</style>

</section>

<script>
(function(){
const A=window.App;const P=window.PT=window.PT||{};
/* ---------- shared helpers (also used by 56-pay-team-2.html) ---------- */
P.st=P.st||{};
P.$=(s,r)=>(r||document).querySelector(s);
P.contour=u=>{u=u||A.me();return u.engagement==='contractor'?'self_employed':(u.engagement||'employee')};
P.isAdmin=u=>(u||A.me()).role==='owner';
P.isMgr=u=>{const r=(u||A.me()).role;return r==='manager'||r==='owner'};
P.limited=u=>{u=u||A.me();return u.staff_type==='seasonal'||u.staff_type==='trainee'};
P.gbp=p=>'£'+(p/100).toFixed(2);
P.ic=(n,c)=>A.icon(n).replace('<svg','<svg class="'+(c||'ic')+'"');
P.esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
P.mountOf=key=>window['mount_'+key];
P.demo=(key,states)=>{const cur=P.st[key]||states[0][0];return `<div class="demo"><small>Demo</small>${states.map(s=>`<button class="chip ${cur===s[0]?'on':''}" onclick="PT.setDemo('${key}','${s[0]}')">${s[1]}</button>`).join('')}</div>`};
P.setDemo=(key,v)=>{P.st[key]=v;A.haptic();const f=P.mountOf(key);if(f)f(A.state.params)};
P.d=key=>P.st[key]||'ok';
P.stt=(kind,msg)=>kind==='loading'?`<div class="stt"><div class="sp"></div>Loading…</div>`:kind==='error'?`<div class="stt err">${msg}</div>`:`<div class="stt">${msg}</div>`;
P.refresh=key=>{const body=P.$('#s-'+key.replace(/_/g,'-')+' .scr-body');const h=body&&body.querySelector('.ptr');if(h){h.textContent='Refreshing…';h.classList.add('busy')}setTimeout(()=>{const f=P.mountOf(key);if(f)f(A.state.params);A.toast('Refreshed')},600)};
P.ptrHint=key=>`<div class="ptr" data-ptr="${key}">Pull down to refresh</div>`;
P.ptr=(el,key)=>{if(el.dataset.ptr)return;el.dataset.ptr=key;let y0=null,armed=false;
  el.addEventListener('pointerdown',e=>{if(el.scrollTop<=0){y0=e.clientY;armed=false}else y0=null});
  el.addEventListener('pointermove',e=>{if(y0===null)return;const dy=e.clientY-y0;const h=el.querySelector('.ptr');if(dy>70&&!armed){armed=true;if(h){h.textContent='Release to refresh';h.classList.add('busy')}}});
  const up=()=>{if(y0!==null&&armed){P.refresh(key)}y0=null;armed=false};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)};
P.alert=(title,text,btns)=>{A.sheet(`<div class="sh-head"><div class="h3">${title}</div></div><div class="sh-body"><p class="soft" style="margin:0">${text}</p></div><div class="sh-foot">${btns.map((b,i)=>`<button class="btn ${b.primary?'':'--secondary'} ${b.danger?'--accent':''}" id="pt-al-${i}">${b.l}</button>`).join('')}</div>`);btns.forEach((b,i)=>{P.$('#pt-al-'+i).onclick=()=>{A.closeSheet();b.fn&&b.fn()}})};
P.lens=(allowed,why)=>`<div class="lensnote">${why}</div>`;
P.pill=s=>({Draft:'--todo',Approved:'--doing',Paid:'--done',Issued:'--done',open:'--todo',taken:'--doing',done:'--done',cancelled:'--late'}[s]||'--plain');

/* ---------- data ---------- */
const RATE=1321,HOL=0.1207;
P.weeks=[
  {ws:'2026-10-19',label:'19–25 Oct',h:21.5,learn:30,bonus:510,status:'Draft',shifts:[['Mon 19',7,7.5],['Thu 22',8,7],['Sat 24',7,7]]},
  {ws:'2026-10-12',label:'12–18 Oct',h:14,learn:0,bonus:250,status:'Approved',shifts:[['Tue 13',7,7],['Fri 16',7,7]]},
  {ws:'2026-10-05',label:'5–11 Oct',h:21,learn:45,bonus:0,status:'Paid',shifts:[['Mon 5',7,7],['Wed 7',7,7],['Sat 10',7,7]]},
  {ws:'2026-09-28',label:'28 Sep – 4 Oct',h:7,learn:0,bonus:120,status:'Paid',shifts:[['Sat 3',7,7]]}
];
P.wk=w=>{const hrs=Math.round(w.h*RATE);const hol=Math.round(hrs*HOL);return {hrs,hol,total:hrs+w.bonus+hol}};

/* ======================================================= PAY ======================================================= */
window.mount_pay_w=function(){
  const el=P.$('#pay-w-body'),u=A.me(),c=P.contour(u),d=P.d('pay_w');
  P.ptr(el,'pay_w');
  const demo=P.demo('pay_w',[['ok','Normal'],['loading','Loading'],['error','Error'],['empty','No shifts yet']]);
  if(c!=='worker'){el.innerHTML=demo+P.ptrHint()+P.lens(0,`You are <b>${u.n}</b> · ${c.replace('_',' ')}. CRM answers 403 for this contour – in Me the Pay link is hidden; opened by link you see the load error below.`)+P.stt('error','Could not load your pay. Pull to try again.');return}
  if(d==='loading'){el.innerHTML=demo+P.ptrHint()+P.stt('loading');return}
  if(d==='error'){el.innerHTML=demo+P.ptrHint()+P.stt('error','Could not load your pay. Pull to try again.');return}
  const latest=P.weeks[0],L=P.wk(latest);
  const rows=d==='empty'?P.stt('empty','No shifts worked yet – your first week appears here after it.'):P.weeks.map(w=>{const x=P.wk(w);return `<button class="wrow" onclick="App.go('pay-wk',{week:'${w.ws}'})"><span class="f1"><div class="l">${w.label}</div><div class="d">${w.h} h${w.learn?` · learning ${w.learn} min`:''}${w.bonus?` · bonus ${P.gbp(w.bonus)}`:''}</div></span><span class="amt">${P.gbp(x.total)}<br><span class="pill ${P.pill(w.status)}">${w.status}</span></span></button>`}).join('');
  el.innerHTML=demo+P.ptrHint()+`
    <div class="pad" style="padding-top:8px"><p class="sm soft" style="margin:0">Paid by the hour for the shifts you took. Learning inside a shift is paid time, the bouquet bonus comes on top, and holiday is accrued on top of that.</p></div>
    <div class="stats" style="margin-top:18px"><div><b>£${(RATE/100).toFixed(2)}</b><span>Rate /h</span></div><div><b>${d==='empty'?'0':latest.h} h</b><span>This week</span></div><div><b>${d==='empty'?'£0':P.gbp(L.total)}</b><span>${d==='empty'?'Nothing yet':latest.status}</span></div></div>
    <div class="note">“This week” is the newest week in the list, not always the calendar week.</div>
    <div class="sec-head"><div class="h2">Weeks</div><span class="xs muted">${d==='empty'?0:P.weeks.length}</span></div>
    <div class="rows">${rows}</div>
    <div class="grp">How pay works</div>
    <div class="wk-kv --info">
      <span>Hours</span><span>Counted inside the shift you took, ±30 minutes around it</span>
      <span>Rate</span><span>Never below the National Living Wage</span>
      <span>Holiday</span><span>12.07 % of the hours you work, accrued on top</span>
      <span>Status</span><span>Draft → Approved by the manager → Paid</span>
    </div>`;
};

window.mount_pay_wk=function(p){
  const el=P.$('#pay-wk-body'),w=P.weeks.find(x=>x.ws===(p&&p.week));
  const demo=P.demo('pay_wk',[['ok','Normal'],['unknown','Unknown week (404)']]);
  if(!w||P.d('pay_wk')==='unknown'){el.innerHTML=demo+P.stt('error','Could not load your pay. Pull to try again.')+`<div class="note">Old link or a week the CRM no longer has. The app shows the generic line; a clearer “There is no such week” is proposed for the redesign.</div>`;return}
  const x=P.wk(w);
  el.innerHTML=demo+`
    <div class="pad" style="padding-top:8px"><div class="caps muted">${w.label}</div><div class="display mt8">${P.gbp(x.total)}</div><div class="mt8"><span class="pill ${P.pill(w.status)}">${w.status}</span></div></div>
    <div class="stats" style="margin-top:18px"><div><b>${w.h} h</b><span>Hours</span></div><div><b>£${(RATE/100).toFixed(2)}</b><span>Rate /h</span></div><div><b>${w.shifts.length}</b><span>Shifts</span></div></div>
    <div class="sec-head"><div class="h2">Shifts</div></div>
    <div class="rows">${w.shifts.map(s=>`<div class="line"><span>${s[0]}<span class="sub">booked ${s[1]} h · clocked ${s[2]} h</span></span><span>${s[2]} h</span></div>`).join('')}</div>
    <div class="sec-head"><div class="h2">Breakdown</div></div>
    <div class="rows">
      <div class="line"><span>Hours · ${w.h} h × £${(RATE/100).toFixed(2)}</span><span>${P.gbp(x.hrs)}</span></div>
      ${w.learn?`<div class="line"><span>Learning · ${w.learn} min, paid time<span class="sub">already inside the hours above</span></span><span>–</span></div>`:''}
      ${w.bonus?`<div class="line"><span>Bouquet bonus</span><span>${P.gbp(w.bonus)}</span></div>`:''}
      <div class="line"><span>Holiday · 12.07 %<span class="sub">value comes from the CRM</span></span><span>${P.gbp(x.hol)}</span></div>
      <div class="line t"><span>Total</span><span>${P.gbp(x.total)}</span></div>
    </div>
    <div class="note">Rows are not tappable. Questions about a shift – ask Valeria.</div>`;
};

/* ======================================================= STATEMENTS ======================================================= */
P.months=[
  {m:'2026-10',label:'October 2026',status:'Draft',jobs:[{t:'Wedding table flowers · Bermondsey',d:'Sat 24 Oct',s:'taken',fee:9000},{t:'Shop cover · SE1 studio',d:'Tue 13 Oct',s:'done',fee:6500},{t:'Autumn window · SW6',d:'date to agree',s:'open',fee:3000}]},
  {m:'2026-09',label:'September 2026',status:'Issued',jobs:[{t:'Corporate reception · EC2',d:'Fri 25 Sep',s:'done',fee:12000},{t:'Shop cover · SE1 studio',d:'Mon 14 Sep',s:'done',fee:6500},{t:'Shop cover · SE1 studio',d:'Tue 8 Sep',s:'done',fee:6500},{t:'Funeral tribute · SE16',d:'Thu 3 Sep',s:'cancelled',fee:0}]},
  {m:'2026-08',label:'August 2026',status:'Issued',jobs:[]}
];
let stOpen=null;
window.mount_se_statements=function(){
  const el=P.$('#se-st-body'),u=A.me(),c=P.contour(u),d=P.d('se_statements');P.ptr(el,'se_statements');
  const demo=P.demo('se_statements',[['ok','Normal'],['loading','Loading'],['error','Error'],['empty','No jobs yet']]);
  if(c!=='self_employed'){el.innerHTML=demo+P.ptrHint()+P.lens(0,`You are <b>${u.n}</b> · ${c.replace('_',' ')}. The statements query runs only on the self-employed contour – the Me link is hidden; by link you get the error line.`)+P.stt('error','Could not load the statements. Pull to try again.');return}
  if(d==='loading'){el.innerHTML=demo+P.ptrHint()+P.stt('loading');return}
  if(d==='error'){el.innerHTML=demo+P.ptrHint()+P.stt('error','Could not load the statements. Pull to try again.');return}
  const list=d==='empty'?P.stt('empty','No jobs yet – your first statement appears after the first job is done.'):P.months.map(mo=>{const sum=mo.jobs.filter(j=>j.s!=='cancelled').reduce((s,j)=>s+j.fee,0);const open=stOpen===mo.m;
    return `<div class="wrow"><span class="f1"><div class="l">${mo.label}</div><div class="d">${mo.jobs.length} job${mo.jobs.length===1?'':'s'}${mo.jobs.length?` · <button class="textbtn" onclick="PT.stToggle('${mo.m}')">${open?'Hide jobs':'Jobs'}</button>`:''}</div></span><span class="amt">${P.gbp(sum)}<br><span class="pill ${P.pill(mo.status)}">${mo.status}</span></span></div>
      ${open?mo.jobs.map(j=>`<div class="jobrow"><span><div>${j.t}</div><div class="d">${j.d} · ${j.s}</div></span><span>${P.gbp(j.fee)}</span></div>`).join(''):''}`}).join('');
  el.innerHTML=demo+P.ptrHint()+`
    <div class="sec-head" style="margin-top:12px"><div class="h2">Months</div><span class="xs muted">${d==='empty'?0:P.months.length}</span></div>
    <div class="rows">${list}</div>
    <div class="grp">How it works</div>
    <div class="blk"><div class="panel"><p class="sm soft" style="margin:0">You either invoice Floritta yourself or Floritta self-bills for you – choose in your <button class="textbtn" onclick="App.go('se-bizprofile')">business profile</button>. A job marked “Done” waits for the statement; the draft becomes “Issued” at the end of the month.</p></div></div>
    <div class="grp">Linked to Work → Jobs</div>
    <div class="blk"><div class="panel"><div class="sm"><b>Mark as done</b> on a job refreshes this list straight away.</div><div class="xs soft mt4">Demo: pretend the Bermondsey wedding was just marked done.</div><button class="btn --sm --secondary mt16" onclick="PT.stJobDone()">${A.icon('check')} Simulate “Mark as done”</button></div></div>`;
};
P.stToggle=m=>{stOpen=stOpen===m?null:m;A.haptic();window.mount_se_statements()};
P.stJobDone=()=>{const j=P.months[0].jobs[0];if(j.s!=='done'){j.s='done';stOpen='2026-10';A.toast('Statement updated · October draft');window.mount_se_statements()}else A.toast('Already done')};

/* ======================================================= BUSINESS PROFILE ======================================================= */

      <span>Holiday</span><span>12.07 % of your hours, up to 28 days</span>
    </div>
    <div class="note">Skipping is private – managers don’t see it and nothing is recorded.</div>`;
};
P.ofAnswer=(id,act)=>{if(busy[id])return;const o=P.offers.find(x=>x.id===id);busy[id]=1;
  const done=()=>{busy[id]=0;window.mount_pay_offers()};
  if(act==='take'){const d=P.d('pay_offers');
    if(d==='unsigned'){busy[id]=0;P.alert('Sign your agreement first – then you can take shifts.','The CRM answered 403 agreement_required.',[{l:'Not now'},{l:'Open agreement',primary:true,fn:()=>App.go('pay-agreement')}]);return}
    if(d==='full409'){busy[id]=0;P.alert('All places on this shift are taken.','Someone was faster – the CRM answered 409 full. The list reloads.',[{l:'OK',primary:true,fn:()=>{o.st='full';o.taken=o.spots;window.mount_pay_offers()}}]);return}
    o.mine=true;o.taken++;A.haptic();A.toast(`Booked · ${o.day}, ${o.hrs}`);setTimeout(()=>A.push('Shift booked',`${o.day} · ${o.hrs} · ${o.place}`,{icon:'check'}),600);return done()}
  if(act==='skip'){o.skipped=true;A.toast('Skipped – nothing recorded');return done()}
  if(act==='unskip'){o.skipped=false;return done()}
  if(act==='release'){o.mine=false;o.taken--;A.toast('Released – back on the board');return done()}
};
P.ofRelease=id=>{const o=P.offers.find(x=>x.id===id);P.alert('Release this shift?',`${o.day} · ${o.hrs}. It goes back to the board for a colleague. Please release 24 h before – no fee, no rating.`,[{l:'Keep it'},{l:'Release',primary:true,danger:true,fn:()=>P.ofAnswer(id,'release')}])};

/* persona change re-renders the open screen */
document.addEventListener('user',()=>{const id=A.state.current;if(/^(pay-w|pay-wk|se-statements|se-bizprofile|se-taxstatus|pay-agreement|pay-offers)$/.test(id)){P.ag.kind=null;const f=P.mountOf(id.replace(/-/g,'_'));if(f)f(A.state.params)}});
})();
</script>
