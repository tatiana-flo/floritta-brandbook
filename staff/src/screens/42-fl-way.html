<section class="scr fl fl" id="s-fl-way" data-tab="fl-way" data-nav="Where are you going?" data-group="Freelance · On my way">
  <div class="appbar"><div class="ttl">On my way</div><button class="ib" aria-label="Saved routes" onclick="App.go('fl-saved')"><svg class="i"><use href="#fl-i-route"/></svg></button><button class="ib" aria-label="Profile" onclick="App.tab('fl-me')"><span style="width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:11px;font-weight:500;letter-spacing:.04em">SK</span></button></div>
  <div class="scr-body has-tab">
    <div class="pad">
      <h1 class="h1" style="margin:4px 0 16px">Where are you going?</h1>
      <div class="field"><label for="fl-w-from">From</label><input class="input" id="fl-w-from" value="My location · Bermondsey SE1"></div>
      <div class="field"><label for="fl-w-to">To</label><input class="input" id="fl-w-to" value="SW11 1AJ · Clapham Junction"><span class="hint">A postcode, or drop a pin on the map.</span></div>
      <div class="seg" style="margin-bottom:14px"><button>Walk</button><button class="on">Bike</button><button>Transit</button></div>
      <button class="btn --block" onclick="document.getElementById('way-res').hidden=false">Show deliveries on my way</button>
    </div>
    <div id="fl-way-res">
      <div class="sec-head"><div><div class="caps muted">2 deliveries fit · 34 min trip</div></div></div>
      <div class="dlist">
        <button class="dcard" onclick="App.go('fl-dlv')"><div class="top"><div><div class="when">Today · 17:00–19:00</div><div class="where">Battersea SW11</div></div><div class="pay">£9</div></div><div class="meta"><span><svg class="i"><use href="#fl-i-clock"/></svg>+6 min detour</span><span>Pick up at the studio on your way</span></div></button>
        <button class="dcard" onclick="App.go('fl-dlv')"><div class="top"><div><div class="when">Today · 18:00–20:00</div><div class="where">Vauxhall SW8</div></div><div class="pay">£7</div></div><div class="meta"><span><svg class="i"><use href="#fl-i-clock"/></svg>+9 min detour</span></div></button>
      </div>
      <p class="hint pad" style="margin-top:12px">Navigation opens in Google Maps. Trip times are estimates.</p>
    </div>
  </div>
</section>
