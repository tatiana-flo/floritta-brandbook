<style>
/* ---------- courier: consents, tracking, unsent queue, zones, order delivery blocks (cr-) ---------- */
.cr-cons{padding:0 var(--gutter)}
.cr-cons p{font-size:15px;line-height:1.5;color:var(--graphite);margin:12px 0 0}
.cr-cons ol{margin:16px 0 0;padding:0;list-style:none;counter-reset:c}
.cr-cons ol li{counter-increment:c;display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--hair);font-size:14px;line-height:1.45}
.cr-cons ol li::before{content:counter(c);width:28px;height:28px;border:1px solid var(--light);display:grid;place-items:center;font-size:12px}
.cr-cons .pr{margin-top:16px;padding:14px 16px;background:var(--silver);font-size:14px;line-height:1.45}
.cr-chk{display:flex;gap:12px;align-items:flex-start;padding:14px 0;font-size:14px;line-height:1.45;text-align:left;width:100%}
.cr-chk .bx{width:22px;height:22px;border:1px solid var(--light);flex:none;display:grid;place-items:center;margin-top:1px}
.cr-chk .bx svg{width:14px;height:14px;stroke:var(--paper);fill:none;stroke-width:2;opacity:0}
.cr-chk.on .bx{background:var(--ink);border-color:var(--ink)}
.cr-chk.on .bx svg{opacity:1}
.cr-denied{margin-top:16px;padding:14px 16px;background:var(--accent-bg)}
.cr-denied .h4{color:var(--accent)}
.cr-os{border:1px solid var(--light);padding:18px 16px;text-align:center}
.cr-os .t{font-size:16px;font-weight:500}
.cr-os .d{font-size:13px;color:var(--graphite);margin-top:6px;line-height:1.4}
.cr-os .bt{display:grid;gap:1px;margin-top:16px;background:var(--hair);border:1px solid var(--hair)}
.cr-os .bt button{background:var(--paper);height:46px;font-size:15px}
.cr-os .bt button.b{font-weight:500}
.cr-track{margin:16px var(--gutter) 0;padding:16px;border:1px solid var(--light)}
.cr-track .st{display:flex;align-items:center;gap:10px;font-size:16px}
.cr-track .st i{width:10px;height:10px;border-radius:50%;background:var(--grey);flex:none}
.cr-track .st i.on{background:var(--ok)}.cr-track .st i.off{background:var(--accent)}
.cr-track .d{font-size:13px;color:var(--graphite);margin-top:6px;line-height:1.45}
.cr-track .ios{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--grey)}
.cr-track .ios span.b{display:inline-block;height:14px;padding:0 8px;background:var(--ink);color:var(--paper);font-size:9px;letter-spacing:.08em;text-transform:uppercase;line-height:14px}
.cr-how{margin:0 var(--gutter)}
.cr-how .r{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair);font-size:14px;line-height:1.45}
.cr-how .r svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.5}
.cr-how .r .d{font-size:12px;color:var(--grey);margin-top:3px}
.cr-q{margin:0 var(--gutter);padding:14px 0;border-bottom:1px solid var(--hair)}
.cr-q .t{font-size:15px}
.cr-q .m{font-size:12px;color:var(--grey);margin-top:3px}
.cr-q .s{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:8px;color:var(--warn)}
.cr-q .s.--rej{color:var(--accent)}.cr-q .s.--held{color:var(--grey)}
.cr-q .s svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}
.cr-q .bt{display:flex;gap:8px;margin-top:10px}
.cr-zone{margin:0 var(--gutter);padding:14px 16px;border:1px solid var(--hair);margin-bottom:10px;text-align:left;width:calc(100% - 2*var(--gutter));display:block}
.cr-zone.--mine{border-color:var(--accent)}
.cr-zone .t{display:flex;align-items:center;gap:8px;font-size:16px}
.cr-zone .o{font-size:13px;color:var(--graphite);margin-top:3px}
.cr-zone .kv{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--grey);margin-top:10px}
.cr-zone .kv b{font-weight:400;color:var(--ink)}
.cr-zone .kv b.acc{color:var(--accent)}
.cr-rep{margin:16px var(--gutter) 0;padding:16px;background:var(--silver)}
.cr-rep .field{margin-bottom:10px}
.cr-rep .input{height:46px;font-size:15px}
.cr-blk{margin:0 var(--gutter);padding:16px 0;border-bottom:1px solid var(--hair)}
.cr-blk .hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cr-blk .hd .caps{color:var(--grey)}
.cr-blk .hd .textbtn{font-size:12px}
.cr-blk .v{font-size:16px;margin-top:6px}
.cr-blk .m{font-size:12px;color:var(--grey);margin-top:4px;line-height:1.4}
.cr-blk .sw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:14px}
.cr-blk .adv{margin-top:10px;padding:10px 12px;background:var(--silver);font-size:13px;line-height:1.4}
.cr-blk .pod{width:100%;aspect-ratio:16/10;background:var(--silver);position:relative;overflow:hidden;margin-top:10px}
.cr-blk .pod img{width:100%;height:100%;object-fit:cover;display:block}
.cr-blk .pod .tg{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
.cr-blk .row3{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.cr-blk .row3 .btn{flex:1;min-width:0;padding:0 10px}
.cr-imp{padding:12px 0;border-bottom:1px solid var(--hair);font-size:14px;line-height:1.45}
.cr-imp .acc{color:var(--accent)}
.cr-imp .ok{color:var(--ok)}
</style>

<script>
(function(){
'use strict';
const A=window.App, I=n=>A.icon(n), $=id=>document.getElementById(id), C=window.CR;
const ic=C.ic, sh=C.sh, alert=C.alert, stamp=C.stamp;
document.querySelector('#s-cr-loc-consent .ib').innerHTML=I('back');

/* ================= geo consent (signed) ================= */
const GC={name:'Anton Melnyk',agree:false,err:null};
window.mount_cr_geo_consent=function(){
  $('gc-body').innerHTML=`<div class="cr-cons"><div class="caps muted">A quick read, then your sign-off</div>
    <p>Floritta uses your approximate location while you’re clocked in on a delivery — to dispatch orders, give customers a live ETA, and support you on the road. Just your sign-off below and you’re ready to go.</p>
    <ol><li>It starts when you clock in on a delivery and stops the moment you clock out or take a break — never off-shift.</li><li>Your managers see it for dispatch only; the customer of an order sees just your first name and your position on the map for their own delivery.</li><li>Location history is kept for 30 days, then deleted automatically.</li><li>You can change your mind and withdraw this at any time. You also have the right to access, correct or erase your data, and to complain to the ICO.</li></ol>
    <div class="field" style="margin-top:20px"><label>Full name</label><input class="input" value="${GC.name}" placeholder="Type your full name to sign" oninput="CR.gc.name(this.value)"></div>${GC.err==='name'?'<div class="cr-err" style="margin-top:-8px">Enter your full name to sign.</div>':''}
    <button class="cr-chk ${GC.agree?'on':''}" onclick="CR.gc.toggle()"><span class="bx">${I('check')}</span><span>I’ve read the above and I’m happy for my location to be tracked while I’m clocked in on a delivery shift.</span></button>${GC.err==='agree'?'<div class="cr-err">Please tick the box to agree.</div>':''}
    <div class="xs muted mt16">No back button and no swipe: this screen comes right after a password change and before anything else in the app. Signing stores an immutable record and a PDF in the CRM.</div><div style="height:24px"></div></div>`;
  $('gc-cta').innerHTML=`<button class="btn" onclick="CR.gc.sign()">Agree &amp; continue</button>`;
};
C.gc={name(v){GC.name=v},toggle(){GC.agree=!GC.agree;GC.err=null;mount_cr_geo_consent()},
  sign(){if(GC.name.trim().length<2){GC.err='name';mount_cr_geo_consent();return}if(!GC.agree){GC.err='agree';mount_cr_geo_consent();return}
    C.demo.geoConsent=false;A.haptic();alert('Thank you — you’re all set.','Signed '+stamp()+' as '+GC.name.trim()+'. The record and its PDF are stored in the CRM.','Continue',"App.go('route',{},{replace:true})")}};

/* ================= location notice before the OS prompt ================= */
const LC={denied:false};
window.mount_cr_loc_consent=function(){
  $('lc-body').innerHTML=`<div class="cr-cons">
    <p>To dispatch deliveries, give customers a live ETA, and record proof of delivery, Floritta shares your device location only while you’re clocked in and on an active delivery.</p>
    <ol><li>It starts when you clock in and stops the moment you clock out or take a break — never off-shift.</li><li>While it’s on, iOS shows a blue location indicator at the top of your screen.</li><li>Your managers see your location only for dispatch and delivery — nothing else. History is kept for up to 30 days, then automatically deleted.</li><li>Sharing your location is simply part of how deliveries are run here: our legal basis is Floritta’s legitimate interest in running deliveries. You can ask what we hold about you, or object — see the Worker Privacy Notice.</li></ol>
    <div class="pr">On the next screen iOS will ask about location. Choose “Allow While Using App”, then “Change to Always Allow” when iOS asks again — that’s the setting deliveries need to route to you correctly. You can change it anytime in Settings.</div>
    ${LC.denied?`<div class="cr-denied"><div class="h4">Location is off</div><div class="sm mt4">Deliveries won’t route to you and customers can’t see an ETA until you enable Always location in Settings › Floritta › Location.</div><button class="textbtn mt12" onclick="App.toast('Settings › Floritta › Location')">Open Settings</button></div>`:''}
    <div style="height:24px"></div></div>`;
  $('lc-cta').innerHTML=`<button class="btn --secondary" onclick="App.back('me')">Not now</button><button class="btn" onclick="CR.lc.accept()">I understand — continue</button>`;
};
C.lc={accept(){
    A.sheet(`<div class="sh-body"><div class="cr-os"><div class="t">Allow “Floritta Team” to use your location?</div><div class="d">Deliveries are routed to you and customers see a live ETA only while you are clocked in.</div><div class="bt"><button class="b" onclick="CR.lc.step2()">Allow While Using App</button><button onclick="CR.lc.step2()">Allow Once</button><button onclick="CR.lc.deny()">Don’t Allow</button></div></div><p class="xs muted" style="margin:12px 0 0;text-align:center">System dialog (demo)</p></div>`)},
  step2(){A.sheet(`<div class="sh-body"><div class="cr-os"><div class="t">Allow “Floritta Team” to also use your location when you are not using the app?</div><div class="d">Needed so the run keeps updating while the phone is in your pocket.</div><div class="bt"><button class="b" onclick="CR.lc.always()">Change to Always Allow</button><button onclick="CR.lc.deny()">Keep Only While Using</button></div></div></div>`)},
  always(){A.closeSheet();LC.denied=false;C.track.perm='always';C.track.state='sharing';A.haptic();A.toast('Location sharing on · while you are on shift');setTimeout(()=>A.back('me'),300)},
  deny(){A.closeSheet();LC.denied=true;C.track.perm='denied';C.track.state='noperm';mount_cr_loc_consent()}};

/* ================= background tracking status ================= */
C.track={state:'sharing',perm:'always',buffered:0,shift:'on'};
window.mount_cr_tracking=function(){
  const t=C.track;const S={sharing:['on','Location · sharing','Points go to the CRM every 30 s or 25 m while you are on shift.'],auto:['on','Location · sharing (auto break)','On an automatic break the location keeps flowing so the CRM sees you set off again.'],noperm:['off','Location · no “Always” permission','Deliveries won’t route to you until Always location is on in Settings › Floritta › Location.'],stopped:['off','Location · stopped','Off shift, on a normal break, or after sign-out nothing is collected.']}[t.state];
  $('tr-bar').innerHTML=`<button class="ib" aria-label="Back" onclick="App.back('me')">${I('back')}</button><div class="ttl">Location sharing</div>`;
  $('tr-body').innerHTML=`<div class="cr-track"><div class="st"><i class="${S[0]}"></i>${S[1]}</div><div class="d">${S[2]}</div>${t.buffered?`<div class="d" style="color:var(--warn)">${t.buffered} points waiting for signal · saved on device (courier-pings.json, up to 500 points / 2 h, newest win)</div>`:''}
      <div class="flex g8 mt12" style="flex-wrap:wrap">${t.state==='noperm'?`<button class="btn --sm" onclick="App.toast('Settings › Floritta › Location')">Open Settings</button>`:''}${t.state==='stopped'?`<button class="btn --sm" onclick="CR.tr.set('sharing')">Turn on</button>`:''}${t.state==='sharing'||t.state==='auto'?`<button class="btn --sm --ghost" onclick="CR.tr.flush()">Send waiting points</button>`:''}</div>
      <div class="ios"><span class="b">${t.state==='sharing'||t.state==='auto'?'iOS · blue bar':'no indicator'}</span><span>${t.state==='sharing'||t.state==='auto'?'Android: persistent notification “Floritta – on shift”':'Nothing is collected now'}</span></div></div>
    <div class="sec-head"><h2 class="h3 f1">Demo states</h2></div><div class="pad"><div class="cr-chipw">${[['sharing','Sharing'],['auto','Auto break'],['noperm','No permission'],['stopped','Stopped']].map(x=>`<button class="chip ${t.state===x[0]?'on':''}" onclick="CR.tr.set('${x[0]}')">${x[1]}</button>`).join('')}<button class="chip ${t.buffered?'on':''}" onclick="CR.tr.buffer()">${t.buffered?'Signal back':'Lose signal (buffer)'}</button></div></div>
    <div class="sec-head"><h2 class="h3 f1">How it works</h2></div><div class="cr-how">
      <div class="r">${I('pin')}<div>Background task “floritta-courier-location”<div class="d">Balanced accuracy, every 30 s or 25 m, automotive navigation, no auto-pause. Registered at app start.</div></div></div>
      <div class="r">${I('send')}<div>Batches of up to 100 points<div class="d">POST /courier/location {lat, lng, recorded_at, accuracy, speed}. The CRM accepts them only with an open shift, your consent and the presence + geo flags on.</div></div></div>
      <div class="r">${I('box')}<div>No signal – points wait on the phone<div class="d">Up to 500 points and 2 hours, duplicates merged, newest win; sent with the next batch or when the app comes back to the front.</div></div></div>
      <div class="r">${I('flag')}<div>What a failed send means<div class="d">0 / 408 / 429 / 5xx – retry later. 401 / 403 / 404 / 409 – the task stops and the buffer is wiped (shift closed in the CRM, feature off, no consent). Other 4xx – that batch is dropped.</div></div></div>
      <div class="r">${I('repeat')}<div>Checked at launch and every return to the app<div class="d">Shift from the time clock, OS permission and the task state decide start / stop / nothing; offline = leave as is. A killed app or a late “Always” no longer leaves the shift without points.</div></div></div>
      <div class="r">${I('clock')}<div>Breaks<div class="d">Normal break – sharing stops (GDPR). Automatic idle break – keeps going so the CRM sees you drive off.</div></div></div>
      <div class="r">${I('logout')}<div>Sign-out, end of shift, break<div class="d">Stop the task and wipe the buffer – not a single point outside the shift.</div></div></div>
      <div class="r">${I('users')}<div>Only the real courier role<div class="d">A manager viewing as Anton never starts tracking on their own phone.</div></div></div></div>
    <div class="pad mt16"><button class="btn --ghost --block" onclick="App.go('cr-loc-consent')">Show the notice before the OS prompt</button></div><div style="height:24px"></div>`;
};
C.tr={set(s){C.track.state=s;if(s==='noperm')C.track.perm='denied';else C.track.perm='always';if(s==='stopped')C.track.buffered=0;mount_cr_tracking()},
  buffer(){if(C.track.buffered){C.track.buffered=0;A.toast('Signal back · 37 points sent in one batch')}else{C.track.buffered=37}mount_cr_tracking()},
  flush(){A.toast(C.track.buffered?`Sent ${C.track.buffered} points`:'Nothing waiting');C.track.buffered=0;mount_cr_tracking()}};

/* ================= not sent ================= */
const WQ=()=>C.demo.writeQueue>0?[{id:'w1',order:'715602',action:'Status → ready',made:'10:58',status:'waiting',attempts:3},{id:'w2',order:'715602',action:'Bouquet photo',made:'10:59',status:'blocked'}].slice(0,C.demo.writeQueue):[];
window.mount_cr_unsent=function(){
  const wq=WQ().filter(w=>!(C._wqDone||[]).includes(w.id)), ob=C.outbox.filter(o=>o.ownerId===A.state.me);
  $('un-bar').innerHTML=`<button class="ib" aria-label="Back" onclick="App.back('route')">${I('back')}</button><div class="ttl">Not sent</div>`;
  const rowW=w=>`<div class="cr-q"><div class="t">Order ${w.order} · ${w.action}</div><div class="m">Made at ${w.made}</div><div class="s ${w.status==='blocked'?'--held':''}">${ic(w.status==='blocked'?'lock':'clock',14)} ${w.status==='blocked'?'Held back: an earlier action for this order was not sent.':`Waiting to send · CRM did not answer (${w.attempts} of 12)`}</div><div class="bt"><button class="btn --xs --ghost" onclick="CR.un.retry('${w.id}')">Retry</button><button class="btn --xs --ghost" onclick="CR.un.discardW('${w.id}')">Discard</button></div></div>`;
  const rowO=o=>`<div class="cr-q"><div class="t">#${o.code} · ${o.kind==='deliver'?'Delivered (photo + who took it + GPS)':'Message to the manager'}</div><div class="m">Saved on device · ${o.at}${o.text?' · “'+o.text+'”':''}</div><div class="s ${o.status==='rejected'?'--rej':''}">${ic(o.status==='rejected'?'flag':'clock',14)} ${o.status==='rejected'?'Refused by the CRM: '+o.reason+' – needs you':'Waiting to send · retries by itself on reconnect, on return to the app and when Deliveries opens'}</div><div class="bt"><button class="btn --xs" onclick="CR.un.resendO('${o.code}','${o.kind}')">Send now</button><button class="btn --xs --ghost" onclick="CR.un.discardO('${o.code}','${o.kind}')">Discard</button></div></div>`;
  $('un-body').innerHTML=`<div class="pad mt8"><p class="sm soft" style="margin:0">Order actions made without a connection wait here and go by themselves in order. Payments, cancellations and stock are never queued.</p></div>
    ${wq.length||ob.length?`${wq.length?`<div class="sec-head"><h2 class="h3 f1">Order actions</h2><span class="xs muted">${wq.length}</span></div>${wq.map(rowW).join('')}`:''}${ob.length?`<div class="sec-head"><h2 class="h3 f1">Deliveries &amp; notes</h2><span class="xs muted">${ob.length} of 30</span></div>${ob.map(rowO).join('')}`:''}`:`<div class="cr-empty"><b>Everything is sent.</b>Nothing is waiting on this phone.</div>`}
    <div class="pad mt16"><div class="xs muted">${ic('lock',12)} This queue belongs to ${A.me().n}. Another courier signing in on this phone does not see it and cannot send it under their own name.</div><div class="xs muted mt8">Delivery outbox: delivery-outbox.json in the app documents (the OS does not clear it), up to 30 entries; handover receipts up to 100.</div></div><div style="height:24px"></div>`;
  $('un-cta').innerHTML=`<button class="btn" onclick="CR.un.sync()">${I('repeat')} Sync now</button>`;
};
C.un={sync(){if(C.demo.offline){A.toast('No connection – still waiting');return}A.toast('Syncing…');setTimeout(()=>{C._wqDone=WQ().map(w=>w.id);C.outbox.filter(o=>o.status==='queued').forEach(o=>{if(o.kind==='deliver'){const s=C.stop(o.code);s.hasPod=true;s.podLocal=true;s.deliveredAt=o.at;s.photoAt=o.at;s.handover=o.payload&&o.payload.handover||{kind:'recipient'}}});C.outbox=C.outbox.filter(o=>o.status!=='queued');A.toast('Everything is sent.');mount_cr_unsent()},600)},
  retry(id){if(C.demo.offline){A.toast('No connection');return}C._wqDone=(C._wqDone||[]).concat(id);A.toast('Sent');mount_cr_unsent()},
  discardW(id){A.confirm('Discard this action?','It will not be sent to the CRM. Do it again by hand if it is still needed.','Discard',()=>{C._wqDone=(C._wqDone||[]).concat(id);mount_cr_unsent()})},
  resendO(code,kind){if(kind==='deliver'){C.stopActions.resend(code);mount_cr_unsent();return}if(C.demo.offline){A.toast('No connection');return}C.outbox=C.outbox.filter(o=>!(o.code===code&&o.kind==='note'));A.toast('Sent to the manager.');mount_cr_unsent()},
  discardO(code,kind){A.confirm(kind==='deliver'?'Discard the saved delivery?':'Discard the message?',kind==='deliver'?'You will have to take the photo again.':'It will not reach the manager.','Discard',()=>{C.outbox=C.outbox.filter(o=>!(o.code===code&&o.kind===kind));mount_cr_unsent()})}};

/* ================= zones ================= */
const ZN={load:'ok',sent:false,f:['','',''],zones:[
  {id:'floor',n:'Shop floor & window',owner:'katrina',metric:'Display refreshed by 9:00',open:3,overdue:0,limit:120},
  {id:'delivery',n:'Delivery',owner:'anton',metric:'Drops on time ≥ 95 %',open:2,overdue:1,limit:200},
  {id:'stock',n:'Stock & conditioning',owner:'vicky',metric:'Waste under 6 %',open:4,overdue:0,limit:400},
  {id:'market',n:'Marketplaces',owner:null,metric:'Accept within 2 min',open:1,overdue:1,limit:0},
  {id:'team',n:'Team & schedule',owner:'vanessa',metric:'Shifts covered',open:2,overdue:0,limit:0}]};
window.mount_cr_zones=function(){
  const me=A.state.me;const mine=ZN.zones.find(z=>z.owner===me);
  $('zn-bar').innerHTML=`<button class="ib" aria-label="Back" onclick="App.back('me')">${I('back')}</button><div class="ttl">Zones</div><button class="ib" aria-label="Refresh" onclick="CR.zn.refresh()">${I('repeat')}</button>`;
  let body='';
  if(ZN.load==='loading')body=`<div class="cr-skel"><i class="skeleton"></i><i class="skeleton"></i></div>`;
  else if(ZN.load==='error')body=`<div class="cr-empty --err"><b>Could not load zones.</b>Pull to retry.<div class="mt12"><button class="btn --sm --ghost" onclick="CR.zn.set('ok')">Retry</button></div></div>`;
  else if(ZN.load==='empty')body=`<div class="cr-empty"><b>No zones yet.</b>Managers set zone owners on the web.</div>`;
  else{
    const rep=mine&&!ZN.sent?`<div class="cr-rep"><div class="h3">Your weekly report</div><div class="sm soft mt4">Three lines about your zone: the number, what broke, what you are changing.</div>
      <div class="field mt12"><label>Metric this week</label><input class="input" placeholder="${mine.metric}" value="${ZN.f[0]}" oninput="CR.zn.f(0,this.value)"></div><div class="field"><label>What broke</label><input class="input" value="${ZN.f[1]}" oninput="CR.zn.f(1,this.value)"></div><div class="field"><label>What I am changing</label><input class="input" value="${ZN.f[2]}" oninput="CR.zn.f(2,this.value)"></div>
      <button class="btn --block" onclick="CR.zn.send()">Send report</button><div class="xs muted mt8">Monday’s task “Weekly report · ${mine.n}” closes and goes to a manager for approval like any handed-in work.</div></div>`:'';
    body=`${rep}<div class="sec-head"><h2 class="h3 f1">Who owns which area of the shop</h2></div>${ZN.zones.map(z=>{const u=z.owner&&A.user(z.owner);return `<div class="cr-zone ${z.owner===me?'--mine':''}"><div class="t">${z.n}${z.owner===me?'<span class="pill cr-pill-acc">My zone</span>':''}</div><div class="o">${u?`${A.avatar(u,'--sm')} ${u.n}`:'No owner yet'}</div><div class="kv"><span>Metric <b>${z.metric}</b></span><span><b>${z.open}</b> in progress</span><span><b class="${z.overdue?'acc':''}">${z.overdue}</b> overdue</span>${z.limit?`<span>Limit <b>£${z.limit}/wk</b></span>`:''}</div></div>`}).join('')}<div class="pad"><div class="xs muted">Read only in the app – owners are set on the web. Refreshes every 60 s while open.</div></div>`;
  }
  $('zn-body').innerHTML=`${body}<div class="pad mt16"><div class="cr-note" style="margin-bottom:8px">Demo</div><div class="cr-chipw">${[['ok','Loaded'],['loading','Loading'],['error','Error'],['empty','No zones']].map(x=>`<button class="chip ${ZN.load===x[0]?'on':''}" onclick="CR.zn.set('${x[0]}')">${x[1]}</button>`).join('')}<button class="chip" onclick="CR.zn.reset()">Report again</button></div></div><div style="height:24px"></div>`;
};
C.zn={set(s){ZN.load=s;mount_cr_zones()},f(i,v){ZN.f[i]=v},reset(){ZN.sent=false;ZN.f=['','',''];mount_cr_zones()},
  refresh(){A.toast('Refreshing…');setTimeout(()=>{A.toast('Zones updated · '+stamp());mount_cr_zones()},500)},
  send(){if(ZN.f.some(x=>!x.trim())){alert('Fill in all three lines.','The report is sent as one text: 1. Metric this week … 2. What broke … 3. What I am changing …');return}
    ZN.sent=true;A.haptic();A.toast('Sent. Thank you.');setTimeout(()=>A.push('Weekly report · '+A.me().n,'1. '+ZN.f[0]+' 2. '+ZN.f[1]+' 3. '+ZN.f[2],{icon:'checksq',to:'Vanessa'}),700);mount_cr_zones()}};

/* ================= order card – delivery blocks ================= */
const CO={code:'715602',first:false,freelancer:false,market:false,booking:null,queue:{florist:'katrina',pos:2,when:'today'},pod:null,podMissing:null,advisor:true};
const COUR_TRIP={anton:'confirmed',ollie:'on_road',max:null};
window.mount_cr_order=function(p){
  if(p&&p.code)CO.code=p.code;const s=C.stop(CO.code)||C.stops[2];CO.code=s.code;const o=A.order(s.code)||{n:s.name,img:s.img,window:s.slot,area:s.area,price:0};
  const r=C.rk(), mgr=r==='manager', cour=r==='courier';
  $('co-bar').innerHTML=`<button class="ib" aria-label="Back" onclick="App.back(${cour?"'stop'":"'cr-dispatch'"})">${I('back')}</button><div class="ttl">Order ${s.code}</div><button class="ib" aria-label="Demo" onclick="CR.co.demo()">${I('dots')}</button>`;
  const courName=CO.freelancer?'Freelancer (outside courier)':s.courier===null?'Not assigned':A.user(s.courier||'anton').n;
  const adv=CO.advisor&&mgr&&!CO.freelancer?`<div class="adv">${ic('sparkle',14)} Advisor: Ollie · run 2 · leaves 12:10${(s.courier||'anton')==='ollie'?' <span class="muted">(advisor)</span>':''}</div>`:'';
  const courier=`<div class="cr-blk"><div class="hd"><span class="caps">Delivery courier</span>${mgr?`<button class="textbtn" onclick="CR.co.pick()">${s.courier===null&&!CO.freelancer?'Assign':'Change'}</button>`:''}</div><div class="v">${courName}</div>${CO.freelancer?'<div class="m">No in-house run and no “deliver first” for an outside courier.</div>':''}${adv}${mgr&&!CO.freelancer&&s.courier!==null?`<div class="sw"><span>Deliver first<div class="m">The courier takes this drop first, whatever the best route says.</div></span><button class="switch ${CO.first?'on':''}" onclick="CR.co.first()"></button></div>`:''}</div>`;
  const b=CO.booking;
  const market=`<div class="cr-blk"><div class="hd"><span class="caps">Courier (Relay / Uber Direct)</span></div>${b?`<div class="v">${b.carrier} · ${b.status}</div><div class="m">Courier: ${b.name}</div><button class="textbtn mt8" onclick="App.toast('Opening the carrier tracking page')">Open tracking</button>`:`<div class="m">No courier booked yet.</div>${mgr?`<button class="btn --sm --ghost mt12" onclick="CR.co.callCourier()">${I('phone')} Call a courier</button>`:''}`}</div>`;
  const mp=CO.market?`<div class="cr-blk"><div class="hd"><span class="caps">Marketplace</span></div><div class="v">Deliveroo · accepted</div><div class="m">Prep time promised 25 min. On Android the reason text goes as the default.</div>${mgr?`<div class="row3"><button class="btn --sm" onclick="App.toast('Sent to the platform · Ready for pickup')">Ready for pickup</button><button class="btn --sm --ghost" onclick="CR.co.mpPrompt('deny')">Deny</button><button class="btn --sm --ghost" onclick="CR.co.mpPrompt('cancel')">Cancel on platform</button></div>`:''}</div>`:'';
  const q=CO.queue;const fl=q.florist&&A.user(q.florist);
  const queue=`<div class="cr-blk"><div class="hd"><span class="caps">Queue</span>${mgr?`<button class="textbtn" onclick="CR.co.queue()">${fl?'Change':'Put in queue'}</button>`:''}</div><div class="v">${fl?`№${q.pos} · ${fl.n} · ${q.when==='today'?'today':'on the delivery day'}`:'Not in the queue'}</div></div>`;
  const pod=`<div class="cr-blk" style="border-bottom:0"><div class="hd"><span class="caps">Proof of delivery</span></div>${s.hasPod||CO.pod?`<div class="pod"><img src="${s.img}" alt="Proof of delivery"><div class="tg"><span class="tag --ink">${CO.pod?CO.pod.by:'Anton'}</span><span class="tag --soft">${CO.pod?CO.pod.at:(s.photoAt||s.deliveredAt)}</span></div></div>`:CO.podMissing?`<div class="v">No photo</div><div class="m">Reason: ${CO.podMissing}</div>`:`<div class="m">No proof photo yet.</div>`}${mgr?`<div class="row3"><button class="btn --sm --ghost" onclick="CR.co.addPod()">${I('camera')} Add photo</button><button class="btn --sm --ghost" onclick="CR.co.noPod()">No photo</button>${(s.hasPod||CO.pod)?`<button class="btn --sm --ghost" ${C.demo.offline?'disabled':''} onclick="CR.co.delPod()">${I('trash')} Delete</button>`:''}</div>${C.demo.offline?'<div class="m">Photo and “no photo” queue offline; delete works online only.</div>':''}`:''}</div>`;
  $('co-body').innerHTML=`<div class="pad mt8"><div class="flex g12"><img class="wk-th" src="${s.img}" alt=""><div class="f1"><div class="h4">${o.n}</div><div class="xs muted mt4">${s.slot} · ${s.area}</div><div class="xs muted mt4">${s.who} · ${s.line1}, ${s.pc}</div>${s.isAlcohol?'<div class="mt8"><span class="pill cr-pill-acc">Alcohol · 18+</span></div>':''}</div></div></div>
    <div class="sec-head"><h2 class="h3 f1">Delivery</h2>${cour?'<span class="xs muted">read only</span>':''}</div>${courier}${market}${mp}${queue}${pod}
    ${!mgr&&!cour?`<div class="pad mt16"><div class="panel"><div class="sm soft">Florists read these blocks; assigning couriers and the queue is for managers.</div><button class="btn --sm mt12" onclick="App.setUser('vanessa')">View as Vanessa</button></div></div>`:''}<div style="height:24px"></div>`;
};
C.co={
  demo(){A.sheet(sh('Demo · order blocks',`<div class="cr-chipw"><button class="chip ${CO.market?'on':''}" onclick="CR.co.set('market',${!CO.market})">Marketplace order</button><button class="chip ${CO.advisor?'on':''}" onclick="CR.co.set('advisor',${!CO.advisor})">Advisor available</button><button class="chip ${C.demo.offline?'on':''}" onclick="CR.demo.offline=${!C.demo.offline};App.closeSheet();CR.remount()">Offline</button><button class="chip" onclick="CR.co.set('booking',null);CR.co.set('pod',null);CR.co.set('podMissing',null)">Reset</button></div>`,`<button class="btn --block" onclick="App.closeSheet()">Done</button>`))},
  set(k,v){CO[k]=v;A.closeSheet();mount_cr_order()},
  pick(){const s=C.stop(CO.code);const cur=CO.freelancer?'fl':(s.courier===null?null:(s.courier||'anton'));
    const rows=[['none','Unassign','Takes the order off every run'],['anton','Anton','Route confirmed · 3 open stops'],['ollie','Ollie','On the road · back ≈ 12:05'],['max','Milo','Not on shift today'],['fl','Freelancer (outside courier)','Shown only when the CRM sends the freelancer field']];
    A.sheet(sh('Assign courier',`${rows.map(r=>`<button class="wk-pick" ${r[0]==='max'?'disabled':''} onclick="CR.co.assign('${r[0]}')">${r[0]==='none'||r[0]==='fl'?`<span class="avatar">${r[0]==='fl'?'FL':'–'}</span>`:A.avatar(r[0],'--shift')}<span class="f1"><b class="h4">${r[1]}${cur===r[0]?' · current':''}${r[0]==='ollie'&&CO.advisor?' <span class="xs muted">(advisor)</span>':''}</b><span class="xs">${r[2]}</span></span>${I('chev')}</button>`).join('')}`),{full:true})},
  assign(id){const s=C.stop(CO.code);
    if(CO.advisor&&id!=='ollie'&&id!=='none'){A.confirm('The advisor suggested otherwise',`The advisor suggested Ollie (run 2, leaves 12:10). Assign ${id==='fl'?'a freelancer':A.user(id).n}?`,'Assign anyway',()=>{CO.advisor=false;C.co.assign(id);CO.advisor=true});return}
    if(id==='anton'&&COUR_TRIP.anton==='confirmed'){C.co.impact('anton');return}
    if(id==='ollie'){C.co.impactNext('ollie');return}
    C.co.doAssign(id)},
  impact(id){A.closeSheet();A.sheet(sh(`Add to Anton's run? The route is already confirmed`,`<div class="cr-imp">#${CO.code} becomes stop 3 of 5 · ETA ≈ 12:41</div><div class="cr-imp">The run gets <span class="acc">14 min longer</span>, back at the shop ≈ 13:54</div><div class="cr-imp">#715611 moves +14 min · <span class="acc">6 min late</span> (window 15:00–18:00 is still met)</div><div class="cr-imp"><span class="ok">Nobody else on the run is noticeably delayed</span></div><p class="xs muted" style="margin:12px 0 0">Approximate times – straight lines, no traffic. Anton gets a push with the new order.</p>`,`<button class="btn --secondary" onclick="App.closeSheet()">Back</button><button class="btn" onclick="CR.co.doAssign('anton')">Assign anyway</button>`),{full:true})},
  impactNext(id){A.closeSheet();A.sheet(sh(`Ollie is on the road – the order can only go on the next run`,`<div class="cr-imp">Ollie is back at the shop ≈ 12:05, the next run leaves ≈ 12:10</div><div class="cr-imp">#${CO.code}: ETA on the next run ≈ 12:40 · <span class="ok">within the window 14:00–17:00</span></div><div class="cr-imp">Advice: give it to Ollie for the next run</div>`,`<button class="btn --secondary" onclick="App.closeSheet()">Back</button><button class="btn --ghost" onclick="CR.co.uber()">${I('truck')} Call Uber for #${CO.code}</button><button class="btn" onclick="CR.co.doAssign('ollie')">Assign</button>`),{full:true})},
  doAssign(id){A.closeSheet();const s=C.stop(CO.code);
    if(id==='none'){s.courier=null;CO.freelancer=false;CO.first=false;A.toast('Courier removed · back to Not assigned')}
    else if(id==='fl'){s.courier=null;CO.freelancer=true;CO.first=false;A.toast('Freelancer · outside courier')}
    else{s.courier=id;CO.freelancer=false;A.toast('Assigned to '+A.user(id).n);setTimeout(()=>A.push('New drop for you','#'+CO.code+' · '+s.area+' · '+s.slot,{icon:'truck',to:A.user(id).n}),700)}
    mount_cr_order()},
  first(){CO.first=!CO.first;A.haptic();A.toast(CO.first?'Deliver first · the courier sees the “First” badge':'Deliver first off');mount_cr_order()},
  uber(){A.closeSheet();A.confirm('Call Uber for #'+CO.code+'?','Book a marketplace courier (Relay / Uber Direct) for this order? This costs money. The in-house courier stays as is.','Book',()=>{CO.booking={carrier:'Uber Direct',status:'courier assigned',name:'Jamal'};A.toast('Courier booked: Uber Direct');mount_cr_order()})},
  callCourier(){A.confirm('Call a courier','Book a marketplace courier (Relay / Uber Direct) for this order? This costs money.','Book',()=>{const s=C.stop(CO.code);if(s.isAlcohol&&C.NOWM>21*60+30){alert('Could not book','Alcohol: outside licensed hours (couriers only 08:00–21:30).');return}CO.booking={carrier:'Relay',status:'looking for a courier',name:'—'};A.toast('Courier booked: Relay');setTimeout(()=>{CO.booking={carrier:'Relay',status:'courier assigned',name:'Priya'};mount_cr_order()},1500);mount_cr_order()})},
  mpPrompt(kind){A.sheet(sh(kind==='deny'?'Deny':'Cancel on platform',`<div class="field"><label>${kind==='deny'?'Tell the platform why (e.g. item unavailable):':'Reason code for the platform (e.g. ITEM_AVAILABILITY):'}</label><input class="input" id="co-mp" value="${kind==='deny'?'Item unavailable':'ITEM_AVAILABILITY'}"></div>`,`<button class="btn --secondary" onclick="App.closeSheet()">Back</button><button class="btn" onclick="App.closeSheet();App.toast('Sent to the platform')">Send</button>`))},
  queue(){const q=CO.queue;const fls=STAFF.filter(u=>u.role==='florist'&&u.staff_type!=='trainee');
    const html=()=>sh('Production queue',`<div class="caps muted" style="margin-bottom:4px">Florist</div><div class="cr-chipw">${fls.map(u=>`<button class="chip ${q.florist===u.id?'on':''}" onclick="CR.co.q('florist','${u.id}')">${u.n}</button>`).join('')}${q.florist?`<button class="chip" onclick="CR.co.q('florist',null)">Nobody</button>`:''}</div><div class="caps muted" style="margin:16px 0 4px">Position</div><div class="cr-chipw"><button class="chip ${q.pos===1?'on':''}" onclick="CR.co.q('pos',1)">First</button><button class="chip ${q.pos===99?'on':''}" onclick="CR.co.q('pos',99)">Last</button><button class="chip" onclick="CR.co.q('pos',${Math.max(1,(q.pos===99?6:q.pos)-1)})">№ −</button><span class="chip" style="pointer-events:none">№ ${q.pos===99?'last':q.pos}</span><button class="chip" onclick="CR.co.q('pos',${(q.pos===99?6:q.pos)+1})">№ +</button></div>${/Tomorrow/.test((A.order(CO.code)||{}).window||'')?`<div class="caps muted" style="margin:16px 0 4px">Make</div><div class="cr-chipw"><button class="chip ${q.when==='today'?'on':''}" onclick="CR.co.q('when','today')">Today</button><button class="chip ${q.when==='delivery'?'on':''}" onclick="CR.co.q('when','delivery')">On the delivery day</button></div>`:''}`,`<button class="btn --secondary" onclick="App.closeSheet()">Cancel</button><button class="btn" onclick="App.closeSheet();App.toast('Queue updated');mount_cr_order()">Save</button>`);
    C._qHtml=html;A.sheet(html(),{full:true})},
  q(k,v){CO.queue[k]=v;$('sheet-inner').innerHTML=C._qHtml()},
  addPod(){A.sheet(sh('Add proof photo',`<button class="wk-act" onclick="CR.co.podFrom('camera')">${I('camera')}<span><div class="t">Camera</div></span></button><button class="wk-act" onclick="CR.co.podFrom('gallery')">${I('photo')}<span><div class="t">Gallery</div><div class="d">Managers may add a photo the courier sent by message</div></span></button>`))},
  podFrom(src){A.closeSheet();CO.podMissing=null;CO.pod={by:A.me().n,at:stamp(),src};A.toast(C.demo.offline?'Saved on the phone – it will be sent by itself when the connection is back.':'Photo added');mount_cr_order()},
  noPod(){A.sheet(sh('No photo – why?',`${['Courier forgot','Phone battery died','Recipient asked not to photograph','Other'].map(r=>`<button class="wk-pick" onclick="CR.co.noPodSave('${r}')"><span class="f1"><b class="h4" style="font-weight:400">${r}</b></span>${I('chev')}</button>`).join('')}`))},
  noPodSave(r){A.closeSheet();CO.pod=null;CO.podMissing=r;const s=C.stop(CO.code);s.hasPod=false;A.toast(C.demo.offline?'Saved on the phone – sent later':'Saved');mount_cr_order()},
  delPod(){A.confirm('Delete the proof photo?','This cannot be undone and works online only.','Delete',()=>{CO.pod=null;const s=C.stop(CO.code);s.hasPod=false;s.podLocal=false;A.toast('Photo deleted');mount_cr_order()})}
};
})();
</script>
