<style>

.pt .grid .days .gr{padding-left:0}
.pt .grid .nm{height:38px;display:flex;align-items:center;font-size:13px;padding-right:6px;border-bottom:1px solid var(--hair);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pt .grid .hd span{width:34px;flex:none;font-size:10px;text-align:center;line-height:28px;color:var(--grey);border-left:1px solid var(--hair)}
.pt .grid .hd span.we{background:var(--silver)}
.pt .grid .cell{width:34px;height:38px;flex:none;border-left:1px solid var(--hair);font-size:11px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink)}
.pt .grid .cell.we{background:var(--silver)}
.pt .grid .cell.h{color:var(--light)}
.pt .grid .cell.lead{box-shadow:inset 0 0 0 1.5px var(--accent)}
.pt .grid .cell.lead::after{content:"★";position:absolute;top:1px;right:3px;font-size:8px;color:var(--accent)}
.pt .grid .cell.dot{color:var(--grey)}
.pt .grid .cell.today{font-weight:500;text-decoration:underline}
.pt .daystrip{display:flex;gap:4px;overflow-x:auto;padding:0 var(--gutter);scrollbar-width:none}

.pt .daystrip button{flex:none;width:40px;height:48px;border:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;gap:2px}
.pt .daystrip button small{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.pt .daystrip button.we{background:var(--silver)}.pt .daystrip button.on{background:var(--ink);color:var(--paper)}.pt .daystrip button.on small{color:var(--paper)}
.pt .code{display:inline-block;min-width:22px;padding:2px 6px;border:1px solid var(--light);font-size:11px;text-align:center}

.pt .trk.bad i{background:var(--accent)}.pt .trk.off i{background:var(--grey)}
.pt .idle{margin:0 var(--gutter) 14px;padding:14px 16px;background:var(--warn-bg)}

.pt .fold>button.hd{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:14px;text-align:left}
.pt .fold .bd{border-top:1px solid var(--hair);padding:4px 14px 10px;font-size:13px}

.pt .fold .bd .r:last-child{border-bottom:0}

.pt .medal{display:inline-flex;width:22px;height:22px;border:1px solid var(--ink);align-items:center;justify-content:center;font-size:11px;margin-right:10px;flex:none}
.pt .medal.g{background:var(--ink);color:var(--paper)}
.pt .toprow{display:flex;align-items:center;padding:8px var(--gutter);font-size:14px}
.pt .tsrow{padding:12px var(--gutter);border-bottom:1px solid var(--hair)}
.pt .tsrow .tp{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.pt .tsrow .fl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

</style>

<script>
(function(){
const A=window.App;const P=window.PT=window.PT||{};
const $=(s,r)=>(r||document).querySelector(s);
const nm=id=>{const u=A.user(id);return u?u.n:id};
const lensOn=()=>!!(window.ME5&&ME5.realAdmin&&ME5.realAdmin!==A.state.me);
const effRole=()=>A.role();
const canApprove=()=>P.isMgr();
const canManageOrders=()=>P.isMgr();
const sheetHead=(t)=>`<div class="sh-head"><div class="h3">${t}</div><button class="ib" onclick="App.closeSheet()">${A.icon('close')}</button></div>`;

/* ======================================================= SCHEDULE ======================================================= */
const GROUPS=[{k:'florists',l:'Florists',ids:['sylvia','katrina','vicky','sonia','zhanna','ayla','mina']},{k:'managers',l:'Managers',ids:['vanessa','sabrina']},{k:'support',l:'Support',ids:[]},{k:'couriers',l:'Couriers',ids:['anton','ollie','max']}];
const MONTHS=[['2026-09','September 2026',30,2],['2026-10','October 2026',31,4],['2026-11','November 2026',30,0]]; /* key,label,days,weekday of the 1st (0=Mon) */
const S=P.sch={mi:1,mode:'month',day:20,edits:{},leads:{'sylvia-2026-10-20':1,'vicky-2026-10-22':1,'sylvia-2026-10-24':1}};
const codeOf=(id,mi,d)=>{const k=id+'-'+MONTHS[mi][0]+'-'+d;if(k in S.edits)return S.edits[k];const g=GROUPS.find(g=>g.ids.includes(id));if(!g)return '';const i=g.ids.indexOf(id);const x=(d+i*2+mi)%7;if(g.k==='couriers')return x>=5?'H':(x%2?'08:00':'12:00');if(g.k==='managers')return x>=5?'H':'D';return x>=5?'H':(x%3===0?'L':'D')};
const isWe=(mi,d)=>((MONTHS[mi][3]+d-1)%7)>=5;
const dow=(mi,d)=>['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][(MONTHS[mi][3]+d-1)%7];
const visGroups=()=>{const u=A.me(),r=effRole();const all=P.isMgr(u)&&!lensOn();if(all)return GROUPS.map(g=>({...g,editable:true}));if(r==='courier')return GROUPS.filter(g=>g.k==='couriers').map(g=>({...g,editable:false}));return GROUPS.filter(g=>g.k==='florists').map(g=>({...g,editable:false}))};
window.mount_tm_schedule=function(){
  const el=$('#tm-sch-body'),u=A.me(),d=P.d('tm_schedule'),M=MONTHS[S.mi],c=P.contour(u);
  const demo=P.demo('tm_schedule',[['ok','Normal'],['unlinked','Not linked'],['error','Load error'],['saveerr','Save fails']]);
  const lens=lensOn()?P.lens(0,`Admin lens: viewing as <b>${u.n}</b> – the grid is cut to this role’s section, no editing, no star (scope own).`):'';
  const who=c==='worker'?`<div class="lensnote">Casual workers have no Schedule row in Me – they see Shift offers. Opened by link, the grid shows their florists’ section read-only.</div>`:'';
  if(d==='error'){el.innerHTML=demo+lens+P.stt('error','Could not load the schedule. Pull to try again.')+`<div class="note">There is nowhere to pull: the classic screen has no RefreshControl. Proposed: pull-to-refresh on the page.</div>`;return}
  const groups=visGroups();const canLead=P.isMgr(u)&&!lensOn();const anyEdit=groups.some(g=>g.editable);
  if(d==='unlinked'){el.innerHTML=demo+lens+P.stt('empty','Your account is not linked to the schedule yet – ask a manager.');return}
  const days=Array.from({length:M[2]},(_,i)=>i+1);
  const head=`<div class="bar" style="margin-top:8px"><button class="ib" aria-label="Previous month" onclick="PT.schMonth(-1)">${A.icon('back')}</button><b>${M[1]}</b><button class="ib" aria-label="Next month" onclick="PT.schMonth(1)" style="transform:scaleX(-1)">${A.icon('back')}</button></div>
    <div class="chips" style="margin-top:10px"><button class="chip ${S.mode==='month'?'on':''}" onclick="PT.schMode('month')">Month</button><button class="chip ${S.mode==='day'?'on':''}" onclick="PT.schMode('day')">Everyone</button></div>`;
  let body='';
  if(S.mode==='month'){
    const names=groups.map(g=>g.ids.length?`<div class="gr">${g.l}</div>`+g.ids.map(id=>`<div class="nm ${id===u.id?'me':''}">${nm(id)}${id===u.id?' · you':''}</div>`).join(''):'').join('');
    const rows=groups.map(g=>g.ids.length?`<div class="gr" style="width:${M[2]*34}px"></div>`+g.ids.map(id=>`<div class="ln ${id===u.id?'me':''}">${days.map(dd=>{const code=codeOf(id,S.mi,dd);const lead=S.leads[id+'-'+M[0]+'-'+dd];const emp=!code||code==='';const cls=`cell ${isWe(S.mi,dd)?'we':''} ${code==='H'?'h':''} ${lead?'lead':''} ${emp&&g.editable?'dot':''} ${S.mi===1&&dd===20?'today':''}`;const txt=emp?(g.editable?'·':''):code;return `<button class="${cls}" onclick="${g.editable?`PT.schCell('${id}','${g.k}',${dd})`:`App.toast('Only managers edit the rota')`}">${txt}</button>`}).join('')}</div>`).join(''):'').join('');
    body=`<div class="grid" style="margin-top:14px"><div class="names"><div class="gr" style="background:transparent"></div>${names}</div><div class="days"><div class="hd">${days.map(dd=>`<span class="${isWe(S.mi,dd)?'we':''}">${dd}</span>`).join('')}</div>${rows}</div></div>
      <div class="note">Names stay fixed, days scroll sideways. Codes: D day · L late · E evening · H day off; couriers show start time. ★ with a red frame – lead of the shift.${anyEdit?' Tap a cell in a section you manage to set a shift.':''}</div>`;
  }else{
    const sel=Math.min(S.day,M[2]);const on=[];groups.forEach(g=>g.ids.forEach(id=>{const code=codeOf(id,S.mi,sel);if(code&&code!=='H')on.push({id,code,g:g.l,lead:!!S.leads[id+'-'+M[0]+'-'+sel]})}));
    body=`<div class="daystrip" style="margin-top:14px">${days.map(dd=>`<button class="${isWe(S.mi,dd)?'we':''} ${dd===sel?'on':''}" onclick="PT.schDay(${dd})"><small>${dow(S.mi,dd)}</small>${dd}</button>`).join('')}</div>
      <div class="sec-head"><div class="h2">Working on ${dow(S.mi,sel)} ${sel}</div><span class="xs muted">${on.length}</span></div>

    <div class="goal" style="margin-top:14px"><div class="sm"><b>Meeting with your mentor · ${pl.meeting}</b></div><div class="xs soft mt4">Talk through what worked.</div></div>
    <div class="chips" style="margin-top:6px">${[['month',`Month · to 31 Oct · ${cnt.month}`],['quarter',`3 months · to 31 Dec · ${cnt.quarter}`],['all',`All · ${cnt.all}`]].map(h=>`<button class="chip ${hz===h[0]?'on':''}" onclick="PT.goHz('${h[0]}')">${h[1]}</button>`).join('')}</div>
    <div style="height:14px"></div>
    ${list.map(g=>`<div class="goal ${g.st==='done'?'done':''}"><div class="flex ai-c jc-sb"><span class="sm"><b>${g.t}</b></span>${g.st!=='dropped'?`<button class="ib" aria-label="More" onclick="PT.goMenu(${g.id})">${A.icon('dots')}</button>`:''}</div>
      <div class="kv"><span>How we’ll know</span><span>${g.how}</span>${g.give?`<span>What we give</span><span>${g.give}</span>`:''}<span>Due</span><span>${g.due}</span><span>Status</span><span>${g.st==='open'?'In progress':g.st==='done'?'Done ✓':'Dropped'}</span>${g.lesson?`<span>Lesson</span><span><button class="textbtn" onclick="App.go('learn')">${g.lesson}</button></span>`:''}</div>
      ${g.st==='dropped'?'':`<button class="btn --sm ${g.st==='done'?'--secondary':''} mt12" onclick="PT.goStatus(${g.id},'${g.st==='done'?'open':'done'}')">${g.st==='done'?'Back to in progress':'Mark as done'}</button>`}</div>`).join('')}
    <div class="grp">My strengths</div><div class="chips wrap">${pl.strengths.split(';').map(s=>`<span class="chip">${s.trim()}</span>`).join('')}</div>
    <div class="blk" style="margin-top:14px"><div class="panel"><div class="caps muted">Mentor’s note</div><div class="sm mt8">${pl.note}</div></div></div>
    <div class="grp">Suggestions for your situation</div>
    ${pl.sugg.map((s,i)=>`<div class="sugg"><div class="caps muted">Suggestion</div><div class="sm mt8"><b>${s.t}</b></div><div class="xs soft mt4">Why: ${s.why}</div>${s.taken?`<button class="btn --sm --secondary mt12" disabled>Already in the plan</button>`:limit?`<div class="xs accent mt12">Your plan already has ${GO.max} goals – finish or drop one first.</div>`:`<button class="btn --sm mt12" onclick="PT.goTake(${i})">Add to my plan</button>`}</div>`).join('')}
    <div class="note">The plan is written and edited in the CRM; a plan re-saved on the web changes the ids – the app refetches quietly.</div>`;
};
P.goHz=h=>{GO.horizon=h;A.haptic();window.mount_tm_goals()};
P.goStatus=(id,st)=>{const g=GO.plan.goals.find(x=>x.id===id);g.st=st;A.haptic();A.toast(st==='done'?'Marked as done':'Back in progress');window.mount_tm_goals()};
P.goMenu=id=>A.sheet(sheetHead('Goal')+`<div class="sh-body" style="padding:0"><div class="rows"><button class="row" onclick="PT.goDrop(${id})">${P.ic('trash')}<span class="rt"><div class="l">Drop this goal</div><div class="d">Status “dropped”, no confirmation – as in the app</div></span></button></div></div>`);

      <div class="caps muted" style="margin-top:14px">Fund split (preliminary)</div>${g.shares.map(s=>`<div class="line" style="padding:8px 0"><span>${nm(s[0])}</span><span class="xs muted">${s[1]} pts · ${P.gbp(s[2])}</span></div>`).join('')}
      ${mgr&&g.st!=='closed'?`<div class="flex mt16" style="gap:8px"><button class="btn --sm --secondary" onclick="PT.acUpd()">Update progress</button><button class="btn --sm" onclick="PT.acClose()">Close the goal</button></div><div class="xs muted mt8">“Close” fixes the fund split between people – no confirmation in the app.</div>`:''}</div>

      <div class="caps muted" style="margin-top:12px">To</div><div class="chips wrap" style="padding:0;margin-top:8px">${people.map(p=>`<button class="chip ${k.to===p.id?'on':''}" onclick="PT.acTo('${p.id}')">${p.n}</button>`).join('')}</div>

};

P.acPts=n=>{AC.kudos.pts=n;A.haptic();window.mount_tm_active()};

P.acBadge=(id,code)=>{AC.badges=AC.badges||{};const k=id+code;if(AC.badges[k]){P.alert('Badge already awarded','',[{l:'OK',primary:true}]);return}AC.badges[k]=1;const row=AC.lb.find(x=>x[0]===id);if(row)row[1]++;A.closeSheet();P.alert('Badge awarded',nm(id)+' · '+code,[{l:'OK',primary:true}]);window.mount_tm_active()};

    <div class="grp">Roles *</div>${chips(OPTS.roles,D.roles,'PT.cnRole',true)}${p.roles?`<div class="errt" style="margin:8px var(--gutter) 0">${p.roles}</div>`:''}
    ${D.roles.includes('Other')?`<div class="blk" style="margin-top:14px">${F('pos','Desired position *','')}</div>`:''}

    <div class="grp">Links · up to 3</div><div class="blk">${D.links.map((l,i)=>`<div class="field"><label>Link ${i+1}</label><input class="input" value="${P.esc(l)}" placeholder="instagram.com/… (https:// is added)" onblur="PT.cnLink(${i},this.value)"></div>`).join('')}${D.links.length<3?`<button class="textbtn" onclick="PT.cnAddLink()">Add a link</button>`:''}</div>

    <div class="blk" style="margin-top:14px"><div class="field"><label>Note · up to 2,000</label><textarea class="input ${p.note?'bad':''}" oninput="PT.cnSet('note',this.value)">${P.esc(D.note)}</textarea></div>${err('note')}</div>
    <div class="grp">Consent *</div>
    <div class="blk"><div class="panel sm soft">${OPTS.consent}</div></div>

    <div class="caps muted" style="margin:16px var(--gutter) 8px">How the consent was given *</div>${chips(OPTS.how,D.how,'PT.cnHow')}${p.how?`<div class="errt" style="margin:8px var(--gutter) 0">${p.how}</div>`:''}

  cta.innerHTML=`<button class="btn --block" ${CN.sending?'disabled':''} onclick="PT.cnSubmit()">${CN.sending?'Sending…':'Add'}</button>`;

window.mount_tm_cand_mine=function(){
  const el=$('#tm-cm-body'),d=P.d('tm_cand_mine');P.ptr(el,'tm_cand_mine');
  const demo=P.demo('tm_cand_mine',[['ok','Normal'],['empty','Empty'],['error','Error'],['rawroles','Options not loaded']]);
  if(d==='error'){el.innerHTML=demo+P.ptrHint()+P.stt('error','Could not load the list.');return}
  const list=d==='empty'?[]:P.mine;
  el.innerHTML=demo+P.ptrHint()+`<div class="rows" style="margin-top:12px">${list.length?list.map(c=>`<div class="urow"><span class="f1"><div class="sm"><b>${P.esc(c.n)}</b></div><div class="d">${d==='rawroles'?c.roles.map(r=>r.toLowerCase().replace(' ','_')).join(', '):c.roles.join(', ')} · ${c.date}</div></span><span class="pill --plain">${c.stage}</span></div>`).join(''):P.stt('empty','You have not added anyone yet.')}</div><div class="note">The stage label comes from the server. Until the options list loads, roles show as raw values.</div>`;
};

/* persona change re-renders the open screen */
document.addEventListener('user',()=>{const id=A.state.current;if(/^tm-/.test(id)){const f=P.mountOf(id.replace(/-/g,'_'));if(f)f(A.state.params)}});
})();
</script>
