<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdfdfd">
<title>Kassa – брендбук приложения</title>
<meta name="description" content="Кликабельный прототип мобильного приложения Kassa (бухгалтерия Floritta) в палитре сайта floritta.uk. Все данные вымышленные.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@300;400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Токены = брендбук сайта (site/index.html): палитра floritta.uk, квадратные углы, без теней у карточек. */
:root{
  --paper:#fdfdfd; --silver:#f2f2f4; --hair:#e6e6e6; --light:#cecece;
  --ink:#1e1a17; --graphite:#5c5450; --grey:#8b8378;
  --accent:#b4595f; --accent-bg:#f3e1e1; --ok:#7a8a6b; --ok-bg:#eef0e9;
  --f-display:"Cormorant Infant",Georgia,serif; --f-body:"Jost","Helvetica Neue",Arial,sans-serif;
  --ls-btn:.12em; --ls-caps:.04em; --ls-eyebrow:.14em;
  --m-fast:180ms; --m-base:320ms; --m-ease:cubic-bezier(.22,1,.36,1);
  --gutter:16px; --tab-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#ececee;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;font-weight:300;-webkit-font-smoothing:antialiased}
b,strong{font-weight:400}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== стенд: слева экраны, в центре телефон, справа заметки ===== */
.stage{min-height:100%;display:grid;grid-template-columns:1fr 430px 1fr;align-items:start;gap:40px;padding:40px 24px}
.gutter-l{justify-self:end;width:100%;max-width:290px;padding-top:12px}
.gutter-r{justify-self:start;width:100%;max-width:390px;padding-top:12px}
.phone{position:relative;width:430px;height:900px;background:#141210;border-radius:52px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.3),inset 0 0 0 2px #2b2724;flex:none}
.screen-wrap{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:var(--paper)}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#141210;border-radius:20px;z-index:80;pointer-events:none}
.statusbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:15px;font-weight:400;z-index:75;pointer-events:none}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:var(--ink);border-radius:3px;z-index:80;pointer-events:none}
.stage-title{font-family:var(--f-display);font-weight:300;font-size:44px;line-height:1.02;letter-spacing:var(--ls-caps);text-transform:uppercase;margin:0 0 10px}
.stage-sub{color:var(--graphite);font-size:14px;margin:0 0 22px}
.eyebrow{display:block;font-size:12px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);font-weight:400}
.nav-list{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:1px}
.nav-list button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 12px;font-size:14px;transition:background var(--m-fast)}
.nav-list button:hover{background:var(--silver)}
.nav-list button.on{background:var(--ink);color:var(--paper)}
.nav-list small{opacity:.55;font-size:12px}
.notes{font-size:13.5px;color:var(--graphite);line-height:1.5}
.notes h4{font-size:12px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);font-weight:400;margin:22px 0 8px}
.notes ul{padding-left:16px;margin:0}
.notes li{margin:0 0 5px}
.notes li b{color:var(--ink)}
.notes .scr-note{border-left:1px solid var(--hair);padding:2px 0 2px 12px;margin:0 0 10px;transition:border-color var(--m-fast)}
.notes .scr-note.on{border-color:var(--ink)}
.notes .scr-note.on h5{color:var(--ink)}
.notes h5{margin:0 0 4px;font-size:13px;font-weight:400;color:var(--graphite);letter-spacing:.06em;text-transform:uppercase}
.notes code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--silver);padding:1px 4px}
.cur-box{border:1px solid var(--hair);background:var(--paper);padding:14px 16px;margin-bottom:6px}
.cur-box .t{font-family:var(--f-display);font-size:26px;line-height:1.05;text-transform:uppercase;letter-spacing:var(--ls-caps)}
@media (max-width:1100px){.stage{grid-template-columns:1fr;justify-items:center}.gutter-l,.gutter-r{max-width:430px;justify-self:center}}
@media (max-width:520px){
  body{background:var(--paper)}
  .stage{display:block;padding:0}
  .gutter-l,.gutter-r{display:none}
  .phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .screen-wrap{border-radius:0}
  .notch,.statusbar,.homebar{display:none}
}

/* ===== приложение ===== */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:58px var(--gutter) calc(var(--tab-h) + 40px);opacity:1;transition:opacity var(--m-base) var(--m-ease),transform var(--m-base) var(--m-ease)}
.view::-webkit-scrollbar{display:none}
.view.enter{opacity:0;transform:translateX(16px)}
.view.no-tab{padding-bottom:40px}
@media (max-width:520px){.view{padding-top:16px}}
.back{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:400;letter-spacing:var(--ls-btn);text-transform:uppercase;color:var(--graphite);margin:4px 0 8px;padding:6px 0}
.back:hover{color:var(--ink)}
.h1{font-family:var(--f-display);font-weight:300;font-size:36px;line-height:1.04;letter-spacing:var(--ls-caps);text-transform:uppercase;margin:4px 0 2px}
.h1row{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:18px;line-height:1;margin-top:4px}
.sub{color:var(--grey);font-size:13px;margin:0 0 8px}
.card{display:block;width:100%;background:var(--paper);border:1px solid var(--hair);padding:14px;margin-top:10px;text-align:left}
button.card{transition:background var(--m-fast),border-color var(--m-fast)}
button.card:hover{border-color:var(--light)}
button.card:active{background:var(--silver)}
.card.--silver{background:var(--silver);border-color:var(--silver)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.b{font-weight:400;font-size:15px;color:var(--ink)}
.mute{color:var(--grey);font-size:13px}
.soft{color:var(--graphite)}
.big{font-family:var(--f-display);font-weight:300;font-size:40px;line-height:1.05;letter-spacing:.02em;margin:4px 0 2px;font-variant-numeric:lining-nums tabular-nums}
.num{font-variant-numeric:tabular-nums}
.acc{color:var(--accent)}.okc{color:var(--ok)}
.mt4{margin-top:4px}.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--light);background:var(--paper);color:var(--graphite);font-size:11px;font-weight:400;line-height:1;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;flex:none}
.chip.--ok::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.chip.--n{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.chip.--on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.bar{height:4px;background:var(--silver);margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.--w i{background:var(--accent)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:14px;width:100%;text-align:left}
.kv:last-child{border-bottom:0}
.kv .k{flex:1;color:var(--ink)}
.kv .v{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.kv.--bold .k,.kv.--bold .v{font-weight:400}
.kv.--bold{border-bottom-color:var(--light)}
button.kv:hover .k{color:var(--graphite)}
.kv .chev{color:var(--grey)}
.kv .ki{display:inline-flex;align-items:center;gap:10px}
.seg{display:flex;border:1px solid var(--light);margin-top:10px}
.seg button{flex:1;padding:8px 4px;font-size:12px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;text-align:center;color:var(--graphite);transition:background var(--m-fast),color var(--m-fast)}
.seg button+button{border-left:1px solid var(--light)}
.seg button.on{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.pick{height:32px;padding:0 12px;border:1px solid var(--light);font-size:13px;color:var(--ink);white-space:nowrap;transition:all var(--m-fast)}
.pick:hover{border-color:var(--ink)}
.pick.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.agent{background:var(--silver);padding:11px 12px;margin-top:10px;font-size:13.5px;color:var(--ink)}
.agent b{font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--graphite);margin-right:6px}
.empty{background:var(--silver);padding:12px 14px;margin-top:10px;font-size:13.5px;color:var(--graphite)}
.bars{display:flex;align-items:flex-end;gap:5px;margin-top:10px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bars .c i{display:block;width:100%;background:var(--ink)}
.bars .c i.neg{background:var(--accent)}
.bars .c i.fade{opacity:.28}
.bars .c span{font-size:10px;color:var(--grey);margin-top:3px}
.search{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--light);margin-top:12px;padding:0 2px}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;border:0;background:transparent;height:40px;outline:0;font-size:15px}
.search input::placeholder,.field::placeholder{color:var(--grey)}
.txl{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair);width:100%;text-align:left}
.txl:hover .tn{color:var(--graphite)}
.txl .ic{width:38px;height:38px;background:var(--silver);display:flex;align-items:center;justify-content:center;flex:none;color:var(--graphite)}
.txl .tn{font-weight:400;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txl .tm{color:var(--grey);font-size:12.5px}
.txl .ta{font-size:11px;color:var(--grey)}
.txl .r{text-align:right;max-width:140px;flex:none}
.txl .am{font-weight:400;font-variant-numeric:tabular-nums}
.txl .am.pos{color:var(--ok)}
.txl .cat{font-size:11.5px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f1{flex:1;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;padding:0 18px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:12.5px;font-weight:400;letter-spacing:var(--ls-btn);text-transform:uppercase;text-align:center;transition:background var(--m-fast),color var(--m-fast),border-color var(--m-fast)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.--primary{background:var(--ink);color:var(--paper)}
.btn.--primary:hover{background:var(--graphite);border-color:var(--graphite)}
.btn.--ghost{border-color:var(--hair);color:var(--graphite)}
.btn.--ghost:hover{background:var(--silver);color:var(--ink)}
.btn.--sm{height:40px;font-size:11.5px;padding:0 10px}
.btn:disabled,.btn:disabled:hover{background:transparent;border-color:var(--light);color:var(--grey);cursor:default}
.btn.--primary:disabled{background:var(--light);border-color:var(--light);color:var(--paper)}
.btns{display:flex;gap:6px;margin-top:8px}
.field{width:100%;height:46px;border:0;border-bottom:1px solid var(--light);background:transparent;outline:0;font-size:15px;padding:0;margin-top:8px}
.field:focus{border-color:var(--ink)}
textarea.field{height:auto;min-height:74px;padding-top:10px;resize:none}
.label{display:block;font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);font-weight:400;margin:18px 0 8px}
.ready{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 10px;font-size:12.5px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-bg)}
.ready.--ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.doc{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--hair)}
.hist{font-size:12px;color:var(--grey);margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;background:var(--ok)}
.dot.--y{background:var(--light)}.dot.--r{background:var(--accent)}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair);width:100%;font-size:15px}
.box{width:18px;height:18px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.box svg{width:14px;height:14px;stroke:var(--paper);stroke-width:2;fill:none;opacity:0}
.check.on .box{background:var(--ink)}
.check.on .box svg{opacity:1}
.cmt{border:1px solid var(--hair);padding:10px 12px;margin-top:8px}
.send{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.send .field{margin:0;min-height:44px;height:44px}
.send .btn{width:48px;height:44px;padding:0;flex:none}
.textlink{font-size:12px;font-weight:400;letter-spacing:var(--ls-btn);text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:3px}

/* таб-бар: 6 вкладок, как в App.tsx */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab-h) + 18px);padding-bottom:18px;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(253,253,253,.96);border-top:1px solid var(--hair);z-index:40;transition:transform var(--m-base) var(--m-ease)}
.tabbar.hide{transform:translateY(110%)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);font-weight:400;text-align:center}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab.on svg{stroke-width:1.9}
@media (max-width:520px){.tabbar{height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}}

/* шторка (pageSheet) и тост */
.scrim{position:absolute;inset:0;background:rgba(30,26,23,.32);opacity:0;visibility:hidden;transition:opacity var(--m-base),visibility 0s linear var(--m-base);z-index:60}
.scrim.on{opacity:1;visibility:visible;transition-delay:0s}
.sheet{position:absolute;left:0;right:0;bottom:0;height:93%;background:var(--paper);border-top:1px solid var(--hair);transform:translateY(102%);transition:transform var(--m-base) var(--m-ease);z-index:70;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:4px;background:var(--light);margin:8px auto 0;flex:none}
.sheet-in{flex:1;overflow-y:auto;padding:12px var(--gutter) 40px;scrollbar-width:none}
.sheet-in::-webkit-scrollbar{display:none}
.toast{position:absolute;left:var(--gutter);right:var(--gutter);bottom:calc(var(--tab-h) + 30px);background:var(--ink);color:var(--paper);padding:12px 14px;font-size:13.5px;z-index:90;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity var(--m-fast),transform var(--m-fast)}
.toast.on{opacity:1;transform:none}

/* вход */
.login{display:flex;flex-direction:column;justify-content:center;min-height:100%;padding:0 8px}
.login .logo{width:150px;margin-bottom:28px}
.err{font-size:13px;color:var(--accent);margin-top:10px;border-left:1px solid var(--accent);padding-left:10px}
</style>
</head>
<body>
<div class="stage">
  <aside class="gutter-l">
    <img src="logo.svg" alt="Floritta" style="width:160px;margin-bottom:22px">
    <h1 class="stage-title">Kassa</h1>
    <p class="stage-sub">Мобильная бухгалтерия Floritta · iOS / Android · палитра сайта floritta.uk · квадратные углы. Кликабельный прототип, данные вымышленные.</p>
    <span class="eyebrow" style="margin-bottom:8px">Экраны</span>
    <ul class="nav-list" id="nav-list"></ul>
    <p class="stage-sub" style="font-size:12px">Каждый экран открывается и по адресу: <code style="font-size:11px">#tx</code>, <code style="font-size:11px">#txcard</code>, <code style="font-size:11px">#tax</code>… На телефоне – во весь экран.</p>
  </aside>

  <div class="phone">
    <div class="screen-wrap">
      <div class="notch"></div>
      <div class="statusbar"><span>9:41</span><span style="display:flex;gap:5px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" fill="#1e1a17"/><rect x="5" y="5" width="3" height="7" fill="#1e1a17"/><rect x="10" y="2" width="3" height="10" fill="#1e1a17"/><rect x="15" y="0" width="3" height="12" fill="#1e1a17"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#1e1a17"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#1e1a17"/><rect x="23.5" y="3.5" width="2" height="5" rx="1" fill="#1e1a17"/></svg></span></div>
      <div class="app">
        <div class="view" id="view"></div>
        <nav class="tabbar" id="tabbar"></nav>
        <div class="scrim" id="scrim" onclick="App.closeSheet()"></div>
        <div class="sheet" id="sheet"><div class="grab"></div><div class="sheet-in" id="sheet-in"></div></div>
        <div class="toast" id="toast"></div>
      </div>
      <div class="homebar"></div>
    </div>
  </div>

  <aside class="gutter-r notes" id="notes"></aside>
</div>

<script>
/* =====================================================================
   Kassa – прототип. Экраны и тексты сняты с кода tatiana-flo/kassa (app/App.tsx, app/src/**).
   Все цифры, контрагенты, люди и банки ВЫМЫШЛЕННЫЕ – репозиторий публичный.
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- иконки (inline SVG, stroke 1.5) ---------- */
const P={
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  tx:'<path d="M7 20V4M3 8l4-4 4 4"/><path d="M17 4v16M13 16l4 4 4-4"/>',
  cash:'<rect x="3" y="6" width="18" height="13"/><path d="M3 10h18M16 15h2"/>',
  pay:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.3 0 4 1.5 4.5 4"/>',
  tasks:'<rect x="4" y="4" width="16" height="16"/><path d="M8 12l3 3 5-6"/>',
  more:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  camera:'<path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  image:'<rect x="4" y="5" width="16" height="14"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/>',

const since=p=>{if(!p)return'';const d=new Date(NOW);if(p==='month')d.setDate(1);else d.setDate(d.getDate()-Number(p));return d.toISOString().slice(0,10)};
const ACC_F=[['','Все счета'],['Bank A','Bank A'],['Bank B','Bank B'],['Карта C','Карта C'],['Bank D','Bank D']];
const PER_F=[['','За всё время'],['7','7 дней'],['30','30 дней'],['month','Этот месяц']];
const RND_F=[['','Все расходы'],['any','R&D']];
function txFound(){
  const q=S.q.trim().toLowerCase();const from=since(S.period);
  return TXS.filter(x=>(S.txFilter==='all'||(S.txFilter==='posted'?x.status==='posted':x.status!=='posted'))
    &&(!S.account||x.account===S.account)&&(!from||x.date>=from)&&(!S.rnd||x.rnd)
    &&(!q||x.counterparty.toLowerCase().includes(q)||String(Math.abs(x.amount)).includes(q.replace(',','.').replace('£',''))||dm(x.date).includes(q)||catLabel(x.category).toLowerCase().includes(q)));
}
const chipsRow=(items,val,key)=>`<div class="chips">${items.map(([k,l])=>`<button class="pick ${val===k?'on':''}" onclick="App.set('${key}','${k}')">${l}</button>`).join('')}</div>`;

function pnlBlock(title,ms,ok){const s=k=>ms.reduce((a,m)=>a+m[k],0);const inc=s('income');const g={};ms.forEach(m=>Object.entries(m.groups).forEach(([k,v])=>g[k]=(g[k]||0)+v));const other=s('opex_other')-Object.values(g).reduce((a,v)=>a+v,0);
  return `<div class="card"><div class="row"><span class="b">${title}</span>${chip(ok?'книги полные':'книги неполные',ok?'ok':'n')}</div>

R.budget=()=>{const base=PNL.filter(m=>!INCOMPLETE.has(m.month)),cur=PNL[PNL.length-1];const passed=1;
  const avg=f=>base.reduce((a,m)=>a+f(m),0)/base.length;
  const lines=[['Закупка цветов, упаковка, газ',m=>m.goods],['Доставка (прямые)',m=>m.delivery],['Субподряд – флористы, курьеры',m=>m.subcontract],...Object.keys(cur.groups).map(g=>[g,m=>m.groups[g]])].map(([n,f])=>[n,avg(f),f(cur)]);
  const plan=lines.reduce((a,l)=>a+l[1],0),fact=lines.reduce((a,l)=>a+l[2],0);
  return `${head(t('План расходов'),`${mlabel(cur.month)} · план = среднее за ${base.map(m=>MONTHS[+m.month.slice(5)-1]).join(', ')}`,{back:1})}

  <div class="card">${lines.map(([n,p,f])=>{const over=p>0&&f/p>passed*1.15;return `<div style="padding:8px 0;border-bottom:1px solid var(--hair)"><div class="row"><span class="f1">${n}</span><span class="num ${over?'acc':''}" style="font-weight:400">${money(f)}</span><span class="mute num">&nbsp;/ ${money(p)}</span></div>${bar(p?f/p:0,over)}</div>`}).join('')}</div>
  ${empty('Факт этого месяца занижен: книги разнесены не полностью. Когда подключим банки напрямую, факт будет считаться по операциям в день траты.')}
  ${empty('Регулярные платежи, план закупок от заказов CRM и согласование трат больше £100 до оплаты – следующим шагом, после банков и токена CRM.')}`;
};

  <span class="label">Чек или счёт</span>

  <div id="ready" class="ready ${missing.length?'':'--ok'}">${missing.length?`к проверке не хватает: ${missing.join(', ')}`:`${ic('check','i').replace('class="i"','class="i" style="width:14px;height:14px"')} готово к проверке HMRC`}</div>
  ${locked?`<button class="btn --primary mt14" style="margin-top:18px" onclick="App.closeSheet()">Закрыть</button>`:`

  <div class="mute" style="text-align:center;margin-top:6px;font-size:12px">после «Провести» агент сам разнесёт строку выписки в Xero и приложит чек</div>
  <button class="btn mt8" ${can?'':'disabled'} onclick="App.save(true,true)">Всегда так разносить «${esc(x.counterparty)}»</button>
  <button class="btn --ghost mt8" onclick="App.save(false)">Сохранить без проведения</button>
  <button class="btn --ghost mt8" onclick="App.closeSheet()">Закрыть</button>`}`;
}
function taskCard(id){const x=TASKS.find(t=>t.id===id);const mine=x.scope==='for_me';

  <div class="b mt14" style="margin-top:20px">Обсуждение</div>

/* ---------- навигация (как App.go в staff/) ---------- */
const SCREENS=[
  ['Вход','login','Вход учёткой CRM'],['Вход','login-denied','Вход · нет доступа к Kassa'],
  ['Вкладки','home','Главная'],['Вкладки','tx','Операции'],['Вкладки','cash','Касса'],['Вкладки','pay','Выплаты'],['Вкладки','tasks','Задачи'],['Вкладки','more','Ещё'],
  ['Ещё →','events','События'],['Ещё →','pnl','P&L'],['Ещё →','budget','План расходов'],['Ещё →','tax','Налоги и сроки'],['Ещё →','docs','Документы и чеки'],['Ещё →','audit','Проверка HMRC'],
  ['Шторки','txcard','Карточка операции'],['Шторки','task','Задача'],['Шторки','task-new','Новая задача']
];
const TABS=[['home','home','Главная'],['tx','tx','Операции'],['cash','cash','Касса'],['pay','pay','Выплаты'],['tasks','tasks','Задачи'],['more','more','Ещё']];
const SUB_PARENT={events:'more',pnl:'more',budget:'more',tax:'more',docs:'more',audit:'more'};
const App=(()=>{
  const st={cur:null,tab:'home',hist:[],sheet:null};
  let toastT,searchT;
  function render(){
    const v=$('#view');v.innerHTML=R[st.cur]();
    const noTab=st.cur.startsWith('login');v.classList.toggle('no-tab',noTab);$('#tabbar').classList.toggle('hide',noTab);
    $('#tabbar').innerHTML=TABS.map(([k,i,l])=>`<button class="tab ${st.tab===k&&!SUB_PARENT[st.cur]?'on':''}" onclick="App.tab('${k}')">${ic(i,'')}<span>${t(l)}</span></button>`).join('');
  }
  function mark(id){document.querySelectorAll('#nav-list button').forEach(b=>b.classList.toggle('on',b.dataset.s===id));document.querySelectorAll('.scr-note').forEach(n=>n.classList.toggle('on',n.dataset.s===id));const c=NOTES_CUR[id];$('#cur-t').textContent=c?c[0]:'';$('#cur-d').innerHTML=c?c[1]:''}
  function go(id,p={},o={}){
    if(id==='txcard'){if(!['tx','docs','audit','events','pay'].includes(st.cur))go('tx',{},{quiet:1});return openTx(p.id||1)}
    if(id==='task'){if(st.cur!=='tasks')go('tasks',{},{quiet:1});return openSheet('task',p.id||TASKS[1].id)}
    if(id==='task-new'){if(st.cur!=='tasks')go('tasks',{},{quiet:1});NT={title:'',body:'',due:'',urgent:false,who:[],find:''};return openSheet('task-new')}
    if(!R[id])return console.warn('нет экрана',id);
    closeSheet(true);
    if(id==='login')S.loginError=false;
    if(st.cur&&st.cur!==id&&!o.replace)st.hist.push(st.cur);
    st.cur=id;if(TABS.some(x=>x[0]===id))st.tab=id;
    const v=$('#view');v.classList.add('enter');render();v.scrollTop=0;requestAnimationFrame(()=>requestAnimationFrame(()=>v.classList.remove('enter')));
    if(!o.quiet){mark(id);history.replaceState(null,'','#'+id)}
  }
  function back(){const prev=st.hist.pop()||SUB_PARENT[st.cur]||'home';go(prev,{},{replace:1})}
  function tab(k){st.hist=[];go(k)}
  function openSheet(kind,id){st.sheet={kind,id};redrawSheet();$('#sheet').classList.add('on');$('#scrim').classList.add('on');$('#sheet-in').scrollTop=0;mark(kind);history.replaceState(null,'','#'+kind)}
  function redrawSheet(){if(!st.sheet)return;const sc=$('#sheet-in').scrollTop;const k=st.sheet.kind;$('#sheet-in').innerHTML=k==='txcard'?txCard():k==='task'?taskCard(st.sheet.id):newTask();$('#sheet-in').scrollTop=sc}
  function closeSheet(silent){if(!st.sheet)return;st.sheet=null;$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');if(!silent){render();mark(st.cur);history.replaceState(null,'','#'+st.cur)}}
  function toast(msg,ms){const el=$('#toast');el.innerHTML=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),ms||2600)}
  function openTx(id){if(!id)return;const x=tx(id);D={id,kind:x.kind||(x.amount>0?'income':'expense'),category:x.category||'',purpose:x.purpose||'',vat:x.vat||'',needs_doc:x.needs_doc,documents:[...x.documents],rnd:x.rnd||''};openSheet('txcard',id)}
  const locked=()=>tx(D.id).status==='posted';
  const guard=()=>{if(locked()){toast('У проведённой операции меняется только метка R&amp;D');return true}return false};
  return {go,back,tab,toast,openTx,closeSheet,redrawSheet,
    login(){const e=($('#lg-email')||{}).value||'';const p=($('#lg-pass')||{}).value||'';if(!e.trim()||!p){toast('Введите email и пароль');return}if(/courier/i.test(e)){S.loginError=true;render();return}S.loginError=false;st.hist=[];go('home')},
    logout(){st.hist=[];go('login');toast('Вы вышли – токен CRM удалён с устройства')},
    set(k,v){S[k]=v;render()},
    setTx(k){S.txFilter=k;render()},
    search(v,clear){S.q=v;clearTimeout(searchT);if(clear){render();return}searchT=setTimeout(()=>{const pos=$('#tx-q').selectionStart;render();const i=$('#tx-q');i.focus();i.setSelectionRange(pos,pos)},300)},
    setPay(k){S.payTab=k;render()},setPnl(k){S.pnlTab=k;render()},setScope(k){S.taskScope=k;render()},
    setReview(k){S.review=k==='1';render()},setWho(k){S.evWho=k;render()},setKind(k){S.evKind=k;render()},
    mark(id){const e=EVENTS.find(x=>x.id===id);if(e.needs_review){e.needs_review=false;e.reviewed_by=ME.name}else{e.needs_review=true;e.reviewed_by=''}render();toast(e.needs_review?'Отметка снята':'Отмечено: проверено')},
    setMode(k){S.limit=+k;render();toast(`Сохранено: ${S.limit===0?'всё подтверждаю сама':`до £${S.limit} агент проводит сам`}`)},
    setLang(k){lang=k;render();toast(k==='ru'?'Язык: русский':k==='uk'?'Мова: українська · в прототипі перекладено вкладки й заголовки':'Language: English · tabs and titles are translated in the prototype',3400)},
    decide(i){toast(`«${TAX.decisions[i][0]}» – решение остаётся за вами: агент ничего не делает без вашего «да»`,3400)},
    dKind(k){if(guard())return;D.kind=k;D.category='';redrawSheet()},
    dCat(k){if(guard())return;D.category=k;redrawSheet()},
    dVat(k){if(guard())return;D.vat=k;redrawSheet()},
    dPurpose(v){D.purpose=v;const el=$('#ready');const hasDoc=!D.needs_doc||D.documents.length>0;const miss=[!hasDoc&&'документ',!D.category&&'категория',!D.vat&&'НДС',v.trim().length<3&&'назначение'].filter(Boolean);el.className='ready '+(miss.length?'':'--ok');el.innerHTML=miss.length?`к проверке не хватает: ${miss.join(', ')}`:'готово к проверке HMRC'},
    dRnd(k){const x=tx(D.id);D.rnd=D.rnd===k?'':k;if(locked()){x.rnd=D.rnd;toast(D.rnd?'Метка R&amp;D сохранена':'Метка R&amp;D снята')}redrawSheet()},
    dNoDoc(){if(guard())return;D.needs_doc=!D.needs_doc;redrawSheet()},
    shoot(cam){if(guard())return;const f=cam?`receipt_${D.id}.jpg`:`IMG_${4000+D.id}.jpg`;D.documents.push(doc(f,cam?'camera':'upload'));const x=tx(D.id);x.documents=[...D.documents];x.hist.push(`01.11 09:41 · ${ME.name} приложил(а) чек`);x.last={who:'Владелец',action:'приложил(а) чек',at:'01.11 09:41'};redrawSheet();toast(cam?'Чек сфотографирован и загружен':'Фото из галереи загружено')},
    save(post,always){const x=tx(D.id);Object.assign(x,{kind:D.kind,category:D.category,purpose:D.purpose,vat:D.vat,needs_doc:D.needs_doc,documents:D.documents,rnd:D.rnd});
      if(post){x.status='posted';x.last={who:'Владелец',action:'утвердил(а)',at:'01.11 09:41'};x.hist.push(`01.11 09:41 · ${ME.name} утвердил(а)`);x.xero='агент разнесёт строку выписки и приложит чек';EVENTS.unshift({id:Date.now(),at:'01.11 09:41',who:'Владелец',kind:'approve',text:`утвердил(а) ${x.counterparty} · ${money(x.amount)}`,tx:x.id,needs_review:true,reviewed_by:''})}
      else x.hist.push(`01.11 09:41 · ${ME.name} изменил(а)`);
      closeSheet();toast(post?(always?`Проведено. Новое правило: «${esc(x.counterparty)}» всегда так`:'Проведено – агент разнесёт строку выписки в Xero'):'Сохранено без проведения',3000)},
    tAct(id,verb){const x=TASKS.find(t=>t.id===id);
      if(verb==='start'){x.board='doing';toast('Взято в работу – автор увидит в CRM')}
      if(verb==='done'){const note=($('#tk-text')||{}).value||'';if(note.trim())x.comments.push({by:ME.name,at:'01.11 09:41',body:note.trim()});x.board='done';x.scope='done';toast('Готово – задача закрыта')}
      if(verb==='approve'){x.board='done';x.scope='done';toast('Принято')}
      if(verb==='reopen'){const r=($('#tk-text')||{}).value.trim()||'Нужно доработать';x.comments.push({by:ME.name,at:'01.11 09:41',body:`Вернула в работу: ${r}`});x.board='doing';x.scope='from_me';toast('Возвращено в работу')}
      redrawSheet()},
    tComment(id){const el=$('#tk-text');const b=el.value.trim();if(!b)return;TASKS.find(t=>t.id===id).comments.push({by:ME.name,at:'01.11 09:41',body:b});redrawSheet();toast('Комментарий отправлен')},
    ntDue(k){NT.due=k;redrawSheet()},
    ntFind(v){NT.find=v;redrawSheet();const i=$('#nt-find');i.focus();i.setSelectionRange(v.length,v.length)},
    ntWho(id){NT.who=NT.who.includes(id)?NT.who.filter(x=>x!==id):[...NT.who,id];redrawSheet()},
    ntSave(){if(!NT.title.trim()||!NT.who.length){toast('Нужно название и хотя бы один исполнитель');return}
