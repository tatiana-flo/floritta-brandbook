<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floritta CRM · календарь команды</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../crm/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@300;400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS (Floritta Brandbook 2026-11 · site palette · square) ============ */
:root{
  --paper:#fdfdfd; --ink:#1e1a17; --graphite:#5c5450; --grey:#8b8378; --light:#cecece; --hair:#e6e6e6; --silver:#f2f2f4;
  --accent:#b4595f; --accent-dark:#9a474c; --accent-bg:#f3e1e1;
  --sel:#1e1a17; --sel-h:#5c5450; --on-sel:#fff;
  --f-display:"Cormorant Infant",Georgia,serif; --f-body:"Jost","Helvetica Neue",Arial,sans-serif;
  --btn-h:40px; --btn-h-s:32px; --row-h:44px; --input-h:36px; --sidebar-w:232px; --topbar-h:56px; --notes-w:330px; --pad:24px;
  --ls-btn:.12em; --ls-caps:.04em; --ls-eyebrow:.14em;
  --m-fast:160ms; --m-base:280ms; --m-ease:cubic-bezier(.22,1,.36,1);
  --shadow-sheet:-12px 0 40px rgba(30,26,23,.14);
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{height:100%}
body{font-family:var(--f-body);font-weight:300;font-size:14px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden}
b,strong{font-weight:500}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:14px;height:14px}
.num{font-variant-numeric:tabular-nums}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr) var(--notes-w);height:100vh}
.app.no-notes{grid-template-columns:var(--sidebar-w) minmax(0,1fr) 0}
.app.no-notes .notes{display:none}
.sidebar{border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.sidebar .logo{height:var(--topbar-h);display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--hair);flex:none}
.sidebar .logo img{height:18px}
.sidebar nav{flex:1;overflow-y:auto;padding:12px 10px;scrollbar-width:none}
.sb-group{font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);padding:16px 10px 6px}
.sb-item{display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 10px;font-size:14px;color:var(--graphite)}
.sb-item:hover{background:var(--silver);color:var(--ink)}
.sb-item.on{background:var(--sel);color:var(--on-sel)}
.sb-foot{border-top:1px solid var(--hair);padding:12px 14px;display:flex;align-items:center;gap:10px;flex:none}
.sb-foot b{display:block;font-size:13px}.sb-foot small{font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:.06em}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;overflow:clip}
.topbar{height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 var(--pad);border-bottom:1px solid var(--hair);flex:none}
.topbar .ttl{font-family:var(--f-display);font-weight:300;font-size:28px;line-height:1;letter-spacing:.01em;white-space:nowrap}
.sp{flex:1}
.roles{display:inline-flex;border:1px solid var(--light);height:var(--btn-h-s)}
.roles button{padding:0 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite);border-right:1px solid var(--light);white-space:nowrap}
.roles button:last-child{border-right:0}
.roles button.on{background:var(--sel);color:var(--on-sel)}
.subnav{display:flex;gap:4px;padding:0 var(--pad);border-bottom:1px solid var(--hair);flex:none;overflow-x:auto;scrollbar-width:none}
.subnav button{height:44px;padding:0 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subnav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.view{flex:1;min-height:0;overflow-y:auto;padding:var(--pad);scrollbar-width:thin;scrollbar-color:var(--light) transparent}
.ib{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:var(--silver)}

/* ============ NOTES ============ */
.notes{border-left:1px solid var(--hair);background:var(--silver);overflow:auto;min-width:0}
.notes .nh{height:var(--topbar-h);display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:var(--silver);z-index:2}
.notes .nh b{font-size:12px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;font-weight:400}
.notes .nb{padding:18px 20px 40px;font-size:13px;color:var(--graphite)}
.notes h4{font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink);font-weight:500;margin:18px 0 6px}
.notes h4:first-child{margin-top:0}
.notes p{margin:0 0 8px}.notes ul{margin:0 0 8px 16px}.notes li{margin:0 0 4px}
.notes .st{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;margin-right:4px;border:1px solid var(--light);background:var(--paper);color:var(--graphite)}
.notes .st.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.notes-toggle{position:fixed;right:16px;bottom:16px;z-index:40;height:32px;padding:0 14px;background:var(--ink);color:#fff;font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:none;align-items:center}
.app.no-notes ~ .notes-toggle{display:inline-flex}

/* ============ COMPONENTS (as crm/src/shell.html) ============ */
.h1{font-family:var(--f-display);font-weight:300;font-size:32px;line-height:1.05;letter-spacing:.01em}
.h2{font-family:var(--f-display);font-weight:300;font-size:26px;line-height:1.08}
.h3{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.15}
.h4{font-weight:500;font-size:15px;line-height:1.3}
.caps{font-size:12px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;font-weight:400;color:var(--grey)}
.sm{font-size:13px}.xs{font-size:12px}.muted{color:var(--grey)}.soft{color:var(--graphite)}.accent{color:var(--accent)}
.row{display:flex;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--btn-h);padding:0 18px;font-size:13px;font-weight:400;letter-spacing:var(--ls-btn);text-transform:uppercase;border:1px solid var(--sel);background:var(--sel);color:var(--on-sel);transition:background var(--m-fast),border-color var(--m-fast);white-space:nowrap;text-align:center}
.btn:hover{background:var(--sel-h);border-color:var(--sel-h)}
.btn.--secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.--secondary:hover{background:var(--silver)}
.btn.--ghost{background:transparent;border-color:var(--light);color:var(--ink)}
.btn.--ghost:hover{border-color:var(--sel);background:transparent}
.btn.--sm{height:var(--btn-h-s);padding:0 12px;font-size:11.5px;letter-spacing:.1em}
.btn.--block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.textbtn{font-size:12px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--light);padding-bottom:1px}
.textbtn:hover{border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey)}
.input,.select,.textarea{height:var(--input-h);width:100%;padding:0 10px;border:1px solid var(--light);background:var(--paper);color:var(--ink);font-size:14px;outline:none;font-weight:300}
.textarea{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:1.4}
.input:focus,.select:focus,.textarea:focus{border-color:var(--sel)}
.check{display:inline-flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;user-select:none}
.check input{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--light);background:var(--paper);display:grid;place-items:center;flex:none}
.check input:checked{background:var(--sel);border-color:var(--sel)}
.check input:checked::after{content:"";width:10px;height:6px;border-left:1.5px solid var(--paper);border-bottom:1.5px solid var(--paper);transform:translateY(-1px) rotate(-45deg)}
.seg-ctl{display:inline-flex;border:1px solid var(--light);height:var(--btn-h-s)}
.seg-ctl button{padding:0 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite);border-right:1px solid var(--light);white-space:nowrap}
.seg-ctl button:last-child{border-right:0}
.seg-ctl button.on{background:var(--sel);color:var(--on-sel)}
.seg-ctl button:hover:not(.on){background:var(--silver)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--light);font-size:13px;color:var(--ink);white-space:nowrap;background:var(--paper)}
.chip:hover{border-color:var(--grey)}
.chip.on{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.chip .n{font-size:11px;color:var(--grey)}.chip.on .n{color:var(--on-sel);opacity:.85}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--silver);color:var(--graphite);font-weight:400;white-space:nowrap}
.tag.--ink{background:var(--sel);color:var(--on-sel)}.tag.--accent{background:var(--accent);color:#fff}.tag.--line{background:transparent;box-shadow:inset 0 0 0 1px var(--light)}
.tag.--soft{background:var(--accent-bg);color:var(--accent-dark)}
.card{border:1px solid var(--hair);background:var(--paper);padding:16px;min-width:0}
.card .caps{display:block;margin-bottom:6px}
.callout{border-left:2px solid var(--accent);padding:10px 14px;background:var(--accent-bg);color:var(--accent-dark);font-size:13px}
.callout.--plain{border-color:var(--ink);background:var(--silver);color:var(--graphite)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--grey)}.kv dd{min-width:0}
.hr{height:1px;background:var(--hair);margin:16px 0}
.avatar{width:28px;height:28px;background:var(--silver);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex:none;border:1px solid var(--hair)}
.avatar.--l{width:40px;height:40px;font-size:14px}
.scrim{position:absolute;inset:0;background:rgba(30,26,23,.28);z-index:50;opacity:0;pointer-events:none;transition:opacity var(--m-base) var(--m-ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;top:0;right:0;bottom:0;width:560px;max-width:100%;background:var(--paper);z-index:51;display:flex;flex-direction:column;transform:translateX(100%);transition:transform var(--m-base) var(--m-ease);box-shadow:var(--shadow-sheet)}
.sheet.on{transform:none}
.sheet .sh-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--hair);flex:none;min-height:60px}
.sheet .sh-body{overflow-y:auto;padding:20px;flex:1;min-height:0}
.sheet .sh-foot{padding:12px 20px;border-top:1px solid var(--hair);flex:none;display:flex;gap:8px;align-items:center}
.sh-tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--hair);overflow-x:auto;scrollbar-width:none;flex:none}
.sh-tabs button{height:40px;padding:0 10px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.sh-tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;font-size:13px;z-index:60;transition:all var(--m-base) var(--m-ease);pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ CALENDAR ============ */
.cal-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cal-head .per{font-family:var(--f-display);font-weight:300;font-size:26px;min-width:210px}
.cal-layers{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.banner{display:flex;align-items:center;gap:14px;border:1px solid var(--accent);padding:12px 16px;margin-bottom:16px;flex-wrap:wrap}
.banner .big{font-family:var(--f-display);font-weight:300;font-size:30px;line-height:1;color:var(--accent)}
.my{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.day{border-top:1px solid var(--hair);display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:12px 0}
.day:first-child{border-top:0;padding-top:0}
.day .d b{display:block;font-family:var(--f-display);font-weight:300;font-size:30px;line-height:1}
.day .d small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.day.today .d b{color:var(--ink)}.day.today .d small{color:var(--ink);font-weight:500}
.day.peak .d b{color:var(--accent)}
.ev{display:flex;align-items:center;gap:10px;min-height:36px;padding:5px 10px;width:100%;border-left:2px solid var(--light);background:var(--paper)}
.ev+.ev{margin-top:4px}
.ev:hover{background:var(--silver)}
.ev .tm{width:86px;flex:none;font-size:12.5px;color:var(--graphite);font-variant-numeric:tabular-nums}
.ev .tx{flex:1;min-width:0}
.ev .tx b{display:block;font-weight:400;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .tx small{display:block;font-size:12px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev svg.i{color:var(--graphite)}
/* layers differ by ink / silver tone, icon and label – not by colour; accent only for peak, blackout, late */
.ev.l-meeting{border-left-color:var(--ink)}
.ev.l-booking{border-left-color:var(--ink);background:var(--ink);color:#fff}
.ev.l-booking:hover{background:var(--graphite)}
.ev.l-booking .tm,.ev.l-booking .tx small,.ev.l-booking svg.i{color:#e6e6e6}
.ev.l-booking.busy{background:var(--paper);color:var(--grey);border:1px dashed var(--light);border-left:2px solid var(--light)}
.ev.l-booking.busy .tm,.ev.l-booking.busy svg.i{color:var(--grey)}
.ev.l-delivery{background:var(--silver);border-left-color:var(--graphite)}
.ev.l-delivery:hover{background:var(--hair)}
.ev.l-shift{border-left-color:var(--light);color:var(--graphite)}
.ev.l-leave{border:1px dashed var(--light);border-left:2px solid var(--grey);color:var(--graphite)}
.ev.l-birthday,.ev.l-hr{border-left-color:var(--hair)}
.ev.l-commercial{border-left-color:var(--grey)}
.ev.l-commercial.peak{border-left-color:var(--accent);background:var(--accent-bg);color:var(--accent-dark)}
.ev.l-commercial.peak svg.i,.ev.l-commercial.peak .tm,.ev.l-commercial.peak .tx small{color:var(--accent-dark)}
.ev.alert{border-left-color:var(--accent)}
.side-card{border:1px solid var(--hair);padding:16px;margin-bottom:16px}
.side-card.peak{border-color:var(--accent)}
.side-card>.caps,.sh-body>.caps{display:block;margin-bottom:6px}
.ms{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--hair);font-size:13px}
.ms:first-of-type{border-top:0}
.ms .bx{width:16px;height:16px;border:1px solid var(--light);flex:none;display:grid;place-items:center}
.ms.done .bx{background:var(--ink);border-color:var(--ink)}
.ms.done .bx::after{content:"";width:8px;height:5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.ms.done span.t{color:var(--grey);text-decoration:line-through}
.ms.late span.w{color:var(--accent)}
.ms span.t{flex:1;min-width:0}.ms span.w{font-size:12px;color:var(--grey);white-space:nowrap}
/* month */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--hair);border-top:1px solid var(--hair)}
.month .wd{font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);padding:8px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.cell{min-height:112px;padding:6px 6px 8px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer}
.cell:hover{background:var(--silver)}
.cell.out{background:var(--silver)}.cell.out .dn{color:var(--light)}
.cell .dn{font-size:13px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.cell.today .dn b{background:var(--ink);color:#fff;padding:0 6px;font-weight:400}
.cell.peak{box-shadow:inset 0 2px 0 var(--accent)}
.cell.peak .dn b{color:var(--accent)}
.cell .bl{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.mini{font-size:11.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 4px;border-left:2px solid var(--light)}
.mini.l-meeting{border-left-color:var(--ink)}
.mini.l-booking{background:var(--ink);color:#fff;border-left-color:var(--ink)}
.mini.l-booking.busy{background:none;color:var(--grey);border-left-color:var(--light)}
.mini.l-delivery{background:var(--silver);border-left-color:var(--graphite)}
.mini.l-commercial.peak{background:var(--accent-bg);color:var(--accent-dark);border-left-color:var(--accent)}
.mini.l-shift,.mini.l-leave,.mini.l-birthday,.mini.l-hr{color:var(--graphite)}
.more{font-size:11px;color:var(--grey);padding-left:6px}
/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--hair);border-top:1px solid var(--hair)}
.wcol{border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);min-height:420px;min-width:0}
.wcol .wh{padding:8px 10px;border-bottom:1px solid var(--hair);display:flex;align-items:baseline;gap:8px}
.wcol .wh b{font-family:var(--f-display);font-weight:300;font-size:26px;line-height:1}
.wcol .wh small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.wcol .wh{flex-wrap:wrap}.wcol .wh .bl{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);width:100%}.wcol.today .wh .bl{color:#fff}
.wcol.today .wh{background:var(--ink);color:#fff}.wcol.today .wh small{color:#e6e6e6}
.wcol.peak .wh b{color:var(--accent)}.wcol.today.peak .wh b{color:#fff}
.wcol .wb{padding:6px;display:flex;flex-direction:column;gap:4px}
.wev{padding:6px 8px;border-left:2px solid var(--light);font-size:12.5px;min-width:0;width:100%}
.wev:hover{background:var(--silver)}
.wev b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis}
.wev small{display:block;font-size:11px;color:var(--grey)}
.wev.l-meeting{border-left-color:var(--ink)}
.wev.l-booking{background:var(--ink);color:#fff;border-left-color:var(--ink)}.wev.l-booking small{color:#e6e6e6}
.wev.l-booking.busy{background:none;color:var(--grey);border:1px dashed var(--light);border-left:2px solid var(--light)}.wev.l-booking.busy small{color:var(--grey)}
.wev.l-delivery{background:var(--silver);border-left-color:var(--graphite)}
.wev.l-commercial.peak{background:var(--accent-bg);color:var(--accent-dark);border-left-color:var(--accent)}.wev.l-commercial.peak small{color:var(--accent-dark)}
.wev.l-leave{border:1px dashed var(--light);border-left:2px solid var(--grey)}
/* booking */
.host{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--hair);margin-bottom:8px}
.host:hover{border-color:var(--ink)}
.host .t{flex:1;min-width:0}.host .t b{display:block;font-weight:400;font-size:15px}.host .t small{display:block;font-size:12px;color:var(--grey)}
.slots-day{margin-bottom:14px}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.slot{height:36px;min-width:72px;padding:0 12px;border:1px solid var(--light);font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.slot:hover{border-color:var(--ink)}

<script>
/* ===== Календарь команды – демо-данные и расчёт дат. Имена, поставщики и события вымышлены. ===== */
const pad=n=>String(n).padStart(2,'0');
const D=(y,m,d)=>new Date(y,m-1,d,12);
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{const[a,b,c]=s.split('-').map(Number);return D(a,b,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dow=d=>(d.getDay()+6)%7; // 0 = понедельник
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
const WD=['пн','вт','ср','чт','пт','сб','вс'];
const WDF=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const fmtD=d=>`${d.getDate()} ${MON[d.getMonth()]}`;
const fmtS=d=>`${d.getDate()} ${MON[d.getMonth()].slice(0,3)}`;
const fmtDW=d=>`${WD[dow(d)]}, ${fmtD(d)}`;
const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return m>10&&m<20?c:k===1?a:k>1&&k<5?b:c};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY=D(2026,11,15);

/* ---------- даты считаются кодом ---------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return D(y,mo,da)}
function orthodoxEaster(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,mo=Math.floor((d+e+114)/31),da=((d+e+114)%31)+1;return addDays(D(y,mo,da),13)}
function nthWd(y,m,wd,n){let d=D(y,m,1);while(dow(d)!==wd)d=addDays(d,1);return addDays(d,7*(n-1))}
function lastWd(y,m,wd){let d=D(y,m+1,0);while(dow(d)!==wd)d=addDays(d,-1);return d}
function bankHolidays(y){
  const e=easter(y),out=[];
  let ny=D(y,1,1);if(dow(ny)===5)ny=D(y,1,3);else if(dow(ny)===6)ny=D(y,1,2);
  out.push([ny,'New Year’s Day'],[addDays(e,-2),'Good Friday'],[addDays(e,1),'Easter Monday'],[nthWd(y,5,0,1),'Early May bank holiday'],[lastWd(y,5,0),'Spring bank holiday'],[lastWd(y,8,0),'Summer bank holiday']);
  const x=dow(D(y,12,25));
  if(x===5)out.push([D(y,12,27),'Christmas Day (перенос)'],[D(y,12,28),'Boxing Day (перенос)']);
  else if(x===6)out.push([D(y,12,26),'Boxing Day'],[D(y,12,27),'Christmas Day (перенос)']);
  else if(x===4)out.push([D(y,12,25),'Christmas Day'],[D(y,12,28),'Boxing Day (перенос)']);
  else out.push([D(y,12,25),'Christmas Day'],[D(y,12,26),'Boxing Day']);
  return out;
}
/* пики: даты, окно запрета отпусков, cut-off. Окна и смещения вех – настройки, здесь значения по умолчанию */
const MS_TPL=[{k:'content',t:'Контент и промо',off:-35,owner:'Маркетинг'},{k:'pack',t:'Упаковка и расходники',off:-28,owner:'Закупки'},{k:'flowers',t:'Заказ цветов у поставщиков',off:-21,owner:'Закупки'},{k:'shifts',t:'Усиление смен',off:-14,owner:'Управляющая студией'},{k:'couriers',t:'Дополнительные курьеры',off:-7,owner:'Менеджер смены'}];

function peaks(y){
  const ms=addDays(easter(y),-21),w8=D(y,3,8),list=[];
  list.push({key:'valentine-'+y,title:'День святого Валентина',dates:[D(y,2,14)],blackout:[D(y,2,14),D(y,2,14)],cutoffs:[{d:D(y,2,13),t:'Последний день приёма заказов на 14.02'}]});
  if(Math.abs(daysBetween(ms,w8))<=3){const a=ms<w8?ms:w8,b=ms<w8?w8:ms;
    list.push({key:'march-'+y,title:'Mothering Sunday + 8 марта',double:true,dates:[ms,w8].sort((p,q)=>p-q),blackout:[a,b],cutoffs:[{d:addDays(a,-1),t:'Последний день приёма заказов на оба дня'}]});
  }else{
    list.push({key:'mothering-'+y,title:'Mothering Sunday',dates:[ms],blackout:[ms,ms],cutoffs:[{d:addDays(ms,-1),t:'Последний день приёма заказов'}]});
    list.push({key:'women-'+y,title:'8 марта',dates:[w8],blackout:[w8,w8],cutoffs:[{d:D(y,3,7),t:'Последний день приёма заказов'}]});
  }
  list.push({key:'christmas-'+y,title:'Рождество',dates:[D(y,12,25)],blackout:[D(y,12,14),D(y,12,24)],cutoffs:[{d:D(y,12,18),t:'Cut-off: доставка по стране'},{d:D(y,12,24),t:'Cut-off: доставка по Лондону'}]});
  list.forEach(p=>{p.milestones=MS_TPL.map(m=>({...m,d:addDays(p.dates[0],m.off),id:p.key+':'+m.k}))});
  return list;
}
const allPeaks=()=>[...peaks(2026),...peaks(2027),...peaks(2028)];
function blackoutOf(d){const t=iso(d);return allPeaks().find(p=>iso(p.blackout[0])<=t&&t<=iso(p.blackout[1]))||null}
function isPeakDay(d){const t=iso(d);return allPeaks().some(p=>p.dates.some(x=>iso(x)===t))}
function nextPeak(from){return allPeaks().filter(p=>p.dates[p.dates.length-1]>=from).sort((a,b)=>a.dates[0]-b.dates[0])[0]}

    else push({d:b.d,tm:b.t,end,layer:'booking',cls:'busy',title:h.busy,sub:'Подробности скрыты',ref:{type:'busy',host:b.host}});
  });
  // отпуска: без типа и причины
  LEAVES.forEach(l=>{for(let d=fromIso(l.from);d<=fromIso(l.to);d=addDays(d,1))if(inR(d))push({d:iso(d),layer:'leave',title:l.name===me().name?'Мой отпуск':`В отпуске – ${l.name}`,sub:l.team,ref:{type:'leave',name:l.name,from:l.from,to:l.to}})});
  // мои смены

  // дни рождения и годовщины – только по согласию
  for(let y=from.getFullYear();y<=to.getFullYear();y++)BDAYS.forEach(b=>{const d=fromIso(`${y}-${b.md}`);if(inR(d))push({d:iso(d),layer:'birthday',title:`${b.k} – ${b.name}`,sub:'Показано с согласия сотрудника',ref:{type:'bday',name:b.name,k:b.k}})});
  // HR-даты – только HR и владелец
  if(r==='hr'||r==='owner')HRDATES.forEach(h=>{if(inR(fromIso(h.d)))push({d:h.d,layer:'hr',title:h.t,sub:h.s,alert:h.alert,ref:{type:'hr',t:h.t,s:h.s}})});
  return out.sort((a,b)=>a.d.localeCompare(b.d)||(a.tm||'').localeCompare(b.tm||''));
}
function isMyLeave(d){const t=iso(d);return LEAVES.some(l=>l.name===me().name&&l.from<=t&&t<=l.to)}
const NOW_MIN=10*60+30;
const fmtH=m=>`${Math.floor(m/60)} ч${m%60?` ${m%60} мин`:''}`;
function shiftInfo(d){const sh=me().shift;if(!sh||!sh.wd.includes(dow(d))||isMyLeave(d))return null;const plan=mins(sh.to)-mins(sh.from),k=iso(d),t=iso(TODAY),base={plan,from:sh.from,to:sh.to};
  if(k<t)return{...base,state:'done',fact:plan+[-10,5,0,10,-5][d.getDate()%5]};
  if(k===t)return{...base,state:S.clock.on?'on':'closed',since:hm(mins(sh.from)-2),fact:NOW_MIN-mins(sh.from)+2};
  return{...base,state:'plan',fact:null}}
function paidMeetings(from,to){const out=[];if(S.role!=='florist')return out;SERIES.filter(s=>s.paid).forEach(s=>occurrences(s,from,to).forEach(d=>{if(!onShift(d,s.time,s.dur)&&!blackoutOf(d))out.push({d,dur:s.dur,title:s.title})}));return out}
function weekHours(mon){let plan=0,fact=0;for(let i=0;i<7;i++){const x=shiftInfo(addDays(mon,i));if(x){plan+=x.plan;if(x.fact)fact+=x.fact}}return{plan,fact,meet:paidMeetings(mon,addDays(mon,6)).reduce((a,x)=>a+x.dur,0)}}
function onShift(d,time,dur){const sh=me().shift;if(!sh||!sh.wd.includes(dow(d))||isMyLeave(d))return false;const a=mins(time),b=a+dur;return a<mins(sh.to)&&b>mins(sh.from)}
/* свободные слоты адресата: окна → слоты, занятые скрыты, слоты на смене сотрудника недоступны */
function slotsFor(h){
  const days=[];
  for(let d=addDays(TODAY,1);daysBetween(TODAY,d)<=h.ahead;d=addDays(d,1)){
    if(blackoutOf(d))continue;
    const list=[];
    h.windows.filter(w=>w.wd===dow(d)).forEach(w=>{for(let a=mins(w.from);a+h.slot<=mins(w.to);a+=h.slot+h.buf){const t=hm(a);
      if(S.bookings.some(b=>b.host===h.id&&b.d===iso(d)&&b.t===t))continue;
      list.push({t,shift:onShift(d,t,h.slot)});
    }});

}

/* ---------- панель ---------- */
function sheet(o){
  $('sheet').innerHTML=`<div class="sh-head">${o.back?`<button class="ib" data-act="${o.back}">${ic('back')}</button>`:''}<div style="flex:1;min-width:0">${o.eyebrow?`<div class="caps">${o.eyebrow}</div>`:''}<div class="h2">${o.title}</div></div><button class="ib" data-close>${ic('close')}</button></div>${o.tabs||''}<div class="sh-body">${o.body}</div>${o.foot?`<div class="sh-foot">${o.foot}</div>`:''}`;
  $('sheet').classList.add('on');$('scrim').classList.add('on');
}
const closeSheet=()=>{$('sheet').classList.remove('on');$('scrim').classList.remove('on')};
function openRef(r){
  ({meeting:sheetMeeting,peak:sheetPeak,delivery:sheetDelivery,booking:sheetBookingView,busy:sheetBusy,
    regular:r=>sheet({eyebrow:'Поставка по расписанию',title:r.sup,body:`<dl class="kv"><dt>Когда</dt><dd>${fmtDW(fromIso(r.d))}</dd><dt>Что</dt><dd>Регулярная поставка цветов</dd><dt>Откуда</dt><dd>Дни поставщика заданы в настройках календаря</dd></dl><div class="callout --plain mt16">В день поставки флористы видят «приёмка и обработка» – место в холодильнике и время в смене планируются заранее.</div>`}),
    date:r=>sheet({eyebrow:'Коммерческий календарь',title:r.title,body:`<dl class="kv"><dt>Дата</dt><dd>${fmtDW(fromIso(r.d))}</dd><dt>Влияние</dt><dd>${LEVEL[r.lv]}</dd><dt>Откуда</dt><dd>Дата считается кодом на любой год</dd></dl><p class="sm soft mt16">Уровень влияния сейчас задан по умолчанию. На этапе v3 он считается по истории заказов CRM. Суммы в календаре не показываются – только уровень.</p>`}),
    leave:r=>sheet({eyebrow:'Отсутствие',title:r.name===me().name?'Мой отпуск':r.name,body:`<dl class="kv"><dt>Даты</dt><dd>${fmtD(fromIso(r.from))} – ${fmtD(fromIso(r.to))}</dd><dt>Статус</dt><dd>В отпуске</dd></dl><div class="callout --plain mt16">Команда видит только факт «в отпуске». Тип и причина отсутствия видны HR в разделе «Документы и отсутствия».</div>`}),
    shift:r=>sheet({eyebrow:'График',title:'Моя смена',body:`<dl class="kv"><dt>Когда</dt><dd>${fmtDW(fromIso(r.d))}, ${me().shift.from}–${me().shift.to}</dd><dt>Где</dt><dd>Студия SE1</dd><dt>Часы</dt><dd>${(x=>x.fact?`${fmtH(x.fact)} отработано из ${fmtH(x.plan)}`:`${fmtH(x.plan)} по плану`)(shiftInfo(fromIso(r.d)))}</dd></dl><p class="sm soft mt16">Смены берутся из экрана «График». Здесь они только показываются; на время смены слоты 1:1 недоступны.</p>`,foot:'<button class="btn --sm --ghost" data-toast="Открывается экран «График» – уже есть в CRM">Открыть график</button>'}),
    bday:r=>sheet({eyebrow:r.k,title:r.name,body:`<div class="callout --plain">Показано, потому что сотрудник сам разрешил это в настройках признания. Возраст не показывается никогда.</div>`}),
    hr:r=>sheet({eyebrow:'HR-дата',title:r.t,body:`<dl class="kv"><dt>Раздел</dt><dd>${r.s}</dd><dt>Кто видит</dt><dd>Только HR и владелец</dd></dl>`,foot:'<button class="btn --sm --ghost" data-toast="Открывается HR-календарь – уже есть в CRM">Открыть в HR</button>'}),
  })[r.type](r);
}

/* ---------- встреча ---------- */
function sheetMeeting(r){
  const s=SERIES.find(x=>x.id===r.series),d0=fromIso(r.date),sug=blackoutOf(d0)?suggestMove(d0):null,mv=S.moves[r.id],d=mv==='moved'?sug:d0;
  const att=S.attend[r.id]||(S.attend[r.id]={}),ag=S.agreements[r.id]||(S.agreements[r.id]=[]);
  const lead=canManage();
  const offShift=n=>n.length%2===0; // демо: часть флористов вне смены
  sheet({eyebrow:`${s.aud} · ${s.ruleText}`,title:s.title,body:`
    ${sug&&!mv?`<div class="callout mb16"><b>Встреча попала на пиковое окно (${blackoutOf(d0).title}).</b><br>Система предлагает перенос на ${fmtDW(sug)}, ${s.time}. Молча встреча не переносится.${lead?`<div class="row mt8"><button class="btn --sm" data-move="moved" data-id="${r.id}">Перенести на ${fmtD(sug)}</button><button class="btn --sm --ghost" data-move="kept" data-id="${r.id}">Оставить как есть</button></div>`:'<div class="mt8 xs">Решение принимает HR или владелец.</div>'}</div>`:''}
    <dl class="kv"><dt>Когда</dt><dd><b>${fmtDW(d)}, ${s.time}–${hm(mins(s.time)+s.dur)}</b> по Лондону</dd><dt>Где</dt><dd>${s.format}</dd><dt>Ссылка</dt><dd><button class="textbtn" data-toast="Открывается Google Meet">Подключиться к Meet</button></dd><dt>Ведёт</dt><dd>${s.host}</dd><dt>Участники</dt><dd>${s.people.length} – все из группы «${s.aud}». Новый сотрудник группы попадает в серию сам.</dd>${s.paid?'<dt>Оплата</dt><dd>Встреча оплачивается. Кто на смене – в студии, кто вне смены – онлайн; им время встречи попадает в график часами.</dd>':''}</dl>
    <div class="row mt16"><span class="caps">Вы придёте?</span><button class="btn --sm ${S.rsvp[r.id]==='yes'?'':'--secondary'}" data-rsvp="yes" data-id="${r.id}">Буду</button><button class="btn --sm ${S.rsvp[r.id]==='no'?'':'--ghost'}" data-rsvp="no" data-id="${r.id}">Не смогу</button></div>
    <div class="hr"></div><span class="caps">Повестка</span><pre class="dg mt8">${AGENDA}</pre>
    ${lead?`<div class="hr"></div><span class="caps">Явка</span><table class="t mt8"><tr><th>Сотрудник</th><th>Ответ</th><th>Был</th><th>Часы в график</th></tr>${s.people.map((n,i)=>`<tr><td>${n}</td><td class="muted">${['буду','буду','нет ответа','не смогу','буду'][i%5]}</td><td><label class="check"><input type="checkbox" data-att="${r.id}" data-n="${n}" ${att[n]?'checked':''}></label></td><td class="num">${s.paid&&att[n]&&offShift(n)?`${s.dur} мин · вне смены`:s.paid&&att[n]?'на смене':'–'}</td></tr>`).join('')}</table>
    <div class="hr"></div><div class="field"><label>Протокол</label><textarea class="textarea" placeholder="Коротко: что решили">${esc(S.minutes[r.id]||'')}</textarea></div>
    <div class="mt16"><span class="caps">Договорённости → задачи</span>${ag.map(a=>`<div class="ms"><span class="t">${esc(a.t)}</span><span class="w">${a.o} · до ${a.due}</span><span class="tag --line">задача создана</span></div>`).join('')}
    <div class="grid g2 mt8"><input class="input" id="ag-t" placeholder="Что сделать"><select class="select" id="ag-o">${s.people.map(n=>`<option>${n}</option>`).join('')}</select></div><div class="row mt8"><input class="input" id="ag-d" type="date" value="${iso(addDays(d,7))}" style="max-width:170px"><button class="btn --sm --secondary" data-ag="${r.id}">Добавить задачу</button></div></div>`:''}`,
    foot:lead?'<button class="btn --sm" data-toast="Протокол и явка сохранены">Сохранить</button><span class="sp"></span><span class="xs muted">Явку и протокол ведёт ведущий, HR или владелец</span>':''});
  sheetMeeting.last=r;
}

/* ---------- пик ---------- */
function sheetPeak(r){
  const p=allPeaks().find(x=>x.key===r.key),edit=S.role==='manager'||S.role==='owner';
  sheet({eyebrow:p.double?'Двойной пик':'Пик продаж',title:p.title,body:`
    <dl class="kv"><dt>${p.dates.length>1?'Даты':'Дата'}</dt><dd><b>${p.dates.map(fmtDW).join(' и ')}</b> ${p.dates[0].getFullYear()}</dd>${p.cutoffs.map(c=>`<dt>Cut-off</dt><dd>${fmtDW(c.d)} – ${c.t}</dd>`).join('')}<dt>Отпуск закрыт</dt><dd>${fmtD(p.blackout[0])}${iso(p.blackout[0])!==iso(p.blackout[1])?' – '+fmtD(p.blackout[1]):''}. Больничный и отгул по семейным обстоятельствам не блокируются.</dd></dl>
    ${p.double?'<div class="callout mt16">Mothering Sunday и 8 марта идут подряд: воскресенье и понедельник. Смены, курьеры и закупка планируются на оба дня сразу.</div>':''}
    <div class="hr"></div><span class="caps">Вехи подготовки – каждая стоит задачей</span>
    <div class="mt8">${p.milestones.map(m=>{const done=!!msDone[m.id],late=!done&&m.d<TODAY;return `<div class="ms ${done?'done':''} ${late?'late':''}"><button class="bx" ${edit?`data-ms="${m.id}" data-key="${p.key}"`:''} title="${edit?'Отметить':'Отмечает ответственный'}"></button><span class="t">${m.t}<br><small class="muted">${m.owner} · за ${-m.off} ${plural(-m.off,'день','дня','дней')}</small></span><span class="w num">${late?'просрочено · ':''}${fmtDW(m.d)}</span></div>`}).join('')}</div>
    <p class="xs muted mt16">Смещения вех и ответственные задаются в настройках. Суммы закупок и выручка в календаре не показываются.</p>`,
    foot:`<button class="btn --sm --ghost" data-toast="Открывается список задач с фильтром по этому пику">Задачи пика</button>`});
  sheetPeak.last=r;
}
function sheetDelivery(r){
  const p=POS.find(x=>x.code===r.code);
  sheet({eyebrow:`Поставка · ${p.code}`,title:p.sup,body:`<dl class="kv"><dt>Ожидается</dt><dd><b>${fmtDW(fromIso(p.d))}</b></dd><dt>Что везут</dt><dd>${p.what}</dd><dt>Статус</dt><dd>${p.st}</dd></dl>
    <div class="callout --plain mt16">${S.role==='florist'?'В этот день на смене – приёмка и обработка. Подготовьте место в холодильнике.':'Флористы видят этот день как «приёмка и обработка».'}</div>
    <p class="xs muted mt16">Цены и суммы закупок в календаре не показываются никому. Они остаются на складе у тех, у кого есть доступ.</p>`,
    foot:'<button class="btn --sm --secondary" data-toast="Открывается экран «Ожидается» на складе – уже есть в CRM">Открыть в «Ожидается»</button>'});
}
function sheetBusy(r){const h=host(r.host);sheet({eyebrow:'1:1',title:h.busy,body:`<div class="callout --plain">У ${h.name} в это время личная встреча. С кем и о чём – видят только двое: сотрудник и тот, к кому он записался. Руководитель о записи не узнаёт.</div><p class="sm soft mt16">Так же запись выглядит в чужой iCal-ленте: «занято», без имён и темы.</p>`})}

/* ---------- запись на 1:1: три нажатия ---------- */
let BK={};
function sheetBook(step){
  if(step===1||!step){BK={};
    return sheet({eyebrow:'Запись на 1:1 · шаг 1 из 3',title:'С кем поговорить',body:`<div class="steps"><i class="on"></i><i></i><i></i></div>
      ${HOSTS.filter(h=>h.name!==me().name).map(h=>{const n=slotsFor(h).reduce((a,x)=>a+x.list.filter(s=>!s.shift).length,0),has=S.bookings.some(b=>b.host===h.id&&b.by===me().name&&!b.regular&&b.d>=iso(TODAY));return `<button class="host" data-host="${h.id}" ${has?'data-has="1"':''}><span class="avatar --l">${initials(h.name)}</span><span class="t"><b>${h.name}</b><small>${h.role} · ${h.format}</small></span><span class="xs muted">${has?'вы уже записаны':n+' '+plural(n,'слот','слота','слотов')}</span>${ic('chev')}</button>`}).join('')}
      <div class="hr"></div><button class="textbtn" data-act="talk">Хочу поговорить, без даты</button>
      <p class="xs muted mt16">Тему и сам факт встречи видят только вы и тот, к кому вы записались. Срочный вопрос или жалоба – не через календарь: <button class="textbtn" data-toast="Открывается политика обращений и жалоб в HR-модуле">порядок обращений</button>.</p>`});
  }
  const h=host(BK.host);
  if(step===2){const days=slotsFor(h);
    return sheet({back:'book',eyebrow:'Шаг 2 из 3 · время по Лондону',title:h.name,body:`<div class="steps"><i class="on"></i><i class="on"></i><i></i></div>
      ${days.length?days.map(x=>`<div class="slots-day"><span class="caps">${fmtDW(x.d)}</span><div class="slots">${x.list.map(s=>`<button class="slot num" ${s.shift?'disabled title="В это время у вас смена"':`data-slot="${iso(x.d)} ${s.t}"`}>${s.t}</button>`).join('')}</div></div>`).join(''):'<p class="muted">Свободных слотов нет. Оставьте запрос «без даты».</p>'}
      <p class="xs muted mt16">Встреча ${h.slot} минут. Зачёркнутые слоты выпадают на вашу смену. Занятые слоты не показываются. Запись открыта на ${h.ahead} ${plural(h.ahead,'день','дня','дней')} вперёд.</p>`});
  }
  const[d,t]=BK.slot.split(' ');
  sheet({back:'book2',eyebrow:'Шаг 3 из 3',title:'Подтвердите запись',body:`<div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div>
    <dl class="kv"><dt>С кем</dt><dd><b>${h.name}</b> · ${h.role}</dd><dt>Когда</dt><dd><b>${fmtDW(fromIso(d))}, ${t}–${hm(mins(t)+h.slot)}</b></dd><dt>Где</dt><dd>${h.format}</dd></dl>
    <div class="field mt16"><label>Тема – по желанию</label><textarea class="textarea" id="bk-topic" placeholder="Можно оставить пустым"></textarea><span class="xs muted">Тему увидит только ${h.name}.</span></div>
    <p class="xs muted mt16">Напомним за день и за час. Перенести или отменить можно не позже чем за ${h.cancel} ${plural(h.cancel,'час','часа','часов')} до встречи.</p>`,
    foot:'<button class="btn" data-act="book-ok">Записаться</button>'});
}
function sheetBookingView(r){
  const b=S.bookings.find(x=>x.id===r.id),h=host(b.host),mine=b.by===me().name;
  sheet({eyebrow:'1:1',title:mine?h.name:b.by,body:`<dl class="kv"><dt>Когда</dt><dd><b>${fmtDW(fromIso(b.d))}, ${b.t}–${hm(mins(b.t)+h.slot)}</b></dd><dt>Где</dt><dd>${h.format}</dd><dt>Тема</dt><dd>${b.topic?esc(b.topic):'<span class="muted">не указана</span>'}</dd></dl>
    <div class="callout --plain mt16">Эту запись видят двое: ${b.by===me().name?'вы':b.by} и ${h.name===me().name?'вы':h.name}. Остальные видят «${h.busy}».</div>`,
    foot:`<button class="btn --sm --secondary" data-rebook="${b.id}">Перенести</button><button class="btn --sm --ghost" data-cancel="${b.id}">Отменить запись</button>`});
}
function sheetTalk(){
  sheet({back:'book',eyebrow:'Без даты',title:'Хочу поговорить',body:`<div class="field"><label>С кем</label><select class="select" id="tk-h">${HOSTS.filter(h=>h.name!==me().name).map(h=>`<option value="${h.id}">${h.name} – ${h.role}</option>`).join('')}</select></div><div class="field mt16"><label>О чём хотите поговорить</label><textarea class="textarea" id="tk-t" placeholder="Одной-двумя фразами – чтобы к разговору подготовились"></textarea><span class="xs muted">Обязательное поле. Увидит только адресат.</span></div><p class="xs muted mt16">Адресат получит запрос и сам предложит время. Запрос видите только вы и он.</p>`,foot:'<button class="btn" id="tk-send" data-act="talk-ok" disabled>Отправить запрос</button>'});
}
/* ---------- адресат: слоты и записи ---------- */
function sheetHost(){
  const h=host(me().host),inbox=S.bookings.filter(b=>b.host===h.id&&b.d>=iso(TODAY)),talk=S.talk.filter(x=>x.host===h.id);
  sheet({eyebrow:h.role,title:'Мои слоты и записи',body:`
    <span class="caps">Окна доступности</span>
    <table class="t mt8"><tr><th>Когда</th><th>Время</th><th>Слот</th><th>Буфер</th><th></th></tr>${h.windows.map(w=>`<tr><td>Каждый ${WDF[w.wd]}</td><td class="num">${w.from}–${w.to}</td><td class="num">${h.slot} мин</td><td class="num">${h.buf} мин</td><td><button class="textbtn" data-toast="Окно удалено – уже сделанные записи остаются">Убрать</button></td></tr>`).join('')}</table>
    <div class="grid g2 mt16"><div class="field"><label>День</label><select class="select"><option>Каждую неделю: понедельник</option><option>Каждую неделю: вторник</option><option>Один раз: выбрать дату</option></select></div><div class="field"><label>Время</label><div class="row"><input class="input" type="time" value="10:00"><input class="input" type="time" value="12:00"></div></div>
    <div class="field"><label>Длительность и буфер</label><div class="row"><select class="select"><option>30 мин</option><option>45 мин</option><option>60 мин</option></select><select class="select"><option>без буфера</option><option>10 мин</option><option>15 мин</option></select></div></div><div class="field"><label>Формат</label><select class="select"><option>Студия SE1</option><option>Google Meet</option></select></div></div>
    <div class="row mt16"><button class="btn --sm --secondary" data-toast="Окно добавлено – слоты появились у сотрудников">Добавить окно</button><span class="xs muted">Открыто на ${h.ahead} ${plural(h.ahead,'день','дня','дней')} вперёд · отмена не позже ${h.cancel} ч</span></div>
    <div class="hr"></div><span class="caps">Записаны ко мне</span>
    ${inbox.length?inbox.map(b=>`<button class="ev l-meeting mt8" ${refAttr({type:'booking',id:b.id})}><span class="tm num">${fmtS(fromIso(b.d))} ${b.t}</span><span class="tx"><b>${b.by}</b><small>${b.topic?esc(b.topic):'Тема не указана'}</small></span></button>`).join(''):'<p class="sm muted mt8">Пока никто не записан.</p>'}
    <div class="hr"></div><span class="caps">Хотят поговорить, без даты</span>
    ${talk.length?talk.map(x=>`<div class="ms"><span class="t"><b>${x.by}</b> · <span class="muted">${fmtD(fromIso(x.d))}</span><br><small>${esc(x.topic)}</small></span><button class="btn --sm --ghost" data-toast="Сотруднику ушло предложение времени">Предложить время</button></div>`).join(''):'<p class="sm muted mt8">Запросов нет.</p>'}`});
}
/* ---------- отпуск: жёсткий запрет на пики ---------- */
function sheetLeave(){
  sheet({eyebrow:'Команда → Отпуск',title:'Заявка на отсутствие',body:`
    <div class="field"><label>Тип</label><select class="select" id="lv-type"><option value="holiday">Ежегодный отпуск</option><option value="sick">Больничный</option><option value="dep">Отгул по семейным обстоятельствам</option><option value="unpaid">За свой счёт</option></select></div>
    <div class="grid g2 mt16"><div class="field"><label>С</label><input class="input" type="date" id="lv-from" value="2027-03-05"></div><div class="field"><label>По</label><input class="input" type="date" id="lv-to" value="2027-03-09"></div></div>
    <div id="lv-msg" class="mt16"></div>
    <div class="hr"></div><span class="caps">Дни, когда отпуск закрыт</span>
    ${allPeaks().filter(p=>p.blackout[1]>=TODAY).slice(0,4).map(p=>`<div class="ms"><span class="t">${p.title}</span><span class="w num">${fmtD(p.blackout[0])}${iso(p.blackout[0])!==iso(p.blackout[1])?' – '+fmtD(p.blackout[1]):''} ${p.blackout[0].getFullYear()}</span></div>`).join('')}
    <p class="xs muted mt16">Правило записано в политике отпусков и известно заранее. Запрет касается только ежегодного отпуска: больничный и отгул по семейным обстоятельствам оформляются в любой день.</p>`,
    foot:'<button class="btn" id="lv-send" data-act="leave-ok">Отправить заявку</button>'});
  checkLeave();
}
function checkLeave(){
  const ty=$('lv-type').value,a=$('lv-from').value,b=$('lv-to').value,box=$('lv-msg'),btn=$('lv-send');if(!a||!b){return}
  let hit=null;for(let d=fromIso(a);d<=fromIso(b);d=addDays(d,1)){const p=blackoutOf(d);if(p){hit=p;break}}
  if(ty==='holiday'&&hit){box.innerHTML=`<div class="callout"><b>На эти даты отпуск не оформляется.</b><br>${hit.title}: отпуск закрыт ${fmtD(hit.blackout[0])}${iso(hit.blackout[0])!==iso(hit.blackout[1])?' – '+fmtD(hit.blackout[1]):''}. Выберите другие дни.</div>`;btn.disabled=true}
  else if(hit){box.innerHTML='<div class="callout --plain">Даты попадают на пик, но этот тип отсутствия не блокируется.</div>';btn.disabled=false}
  else{box.innerHTML='';btn.disabled=false}
}
/* ---------- iCal ---------- */
function sheetIcal(){
  const tok='k7f3'+'•'.repeat(18)+['q9','x2','m5'][S.icalRev%3];
  sheet({eyebrow:'Только чтение',title:'Подписка iCal',body:`
    <p class="sm soft">Личная ссылка показывает ваш календарь в Google Calendar или Apple Calendar. Обратно из них в CRM ничего не записывается.</p>
    <div class="field mt16"><label>Моя ссылка</label><div class="row"><input class="input num" readonly value="https://app.floritta.ai/calendar/ical/${tok}.ics"><button class="btn --sm --secondary" data-toast="Ссылка скопирована">Копировать</button></div></div>
    <div class="row mt8"><button class="textbtn" data-act="ical-rotate">Перевыпустить ссылку</button><span class="xs muted">старая перестанет работать</span></div>
    <div class="hr"></div><span class="caps">Что попадает в ленту</span>
    <div class="ms"><span class="t">Мои смены, встречи команды, мои записи на 1:1</span><span class="w">полностью</span></div>
    <div class="ms"><span class="t">Пики, cut-off, банковские выходные, поставки</span><span class="w">название и дата</span></div>
    <div class="ms"><span class="t">Тема моей записи на 1:1</span><span class="w">не передаётся</span></div>
    <div class="ms"><span class="t">Чужие записи на 1:1</span><span class="w">«занято»</span></div>
    <div class="ms"><span class="t">Суммы, причины отсутствий, HR-заметки</span><span class="w">никогда</span></div>`});
}
/* ---------- настройки (HR и владелец) ---------- */
let ST='meet';
function sheetSettings(){
  const tabs=[['meet','Встречи'],['peak','Пики и отпуска'],['hosts','Адресаты 1:1'],['sup','Поставки'],['dig','Дайджест']];
  const p=nextPeak(TODAY),wk=events(D(2026,11,16),D(2026,11,22));
  const body={
    meet:`${SERIES.map(s=>`<div class="card mb16"><div class="row"><b style="flex:1">${s.title}</b>${s.paid?'<span class="tag --line">оплачивается</span>':''}</div><div class="grid g2 mt8"><div class="field"><label>Повторение</label><select class="select"><option>${s.ruleText}</option><option>Каждую неделю</option><option>Раз в месяц</option></select></div><div class="field"><label>Время и длительность</label><div class="row"><input class="input" type="time" value="${s.time}"><select class="select"><option>${s.dur} мин</option><option>30 мин</option><option>60 мин</option></select></div></div><div class="field"><label>Участники</label><select class="select"><option>${s.aud} – по группе графика</option></select></div><div class="field"><label>Ведёт</label><select class="select"><option>${s.host}</option></select></div></div><div class="xs muted mt8">${s.format} · ссылка Meet задаётся один раз на серию</div></div>`).join('')}<p class="xs muted">День, время и длительность – данные, а не код. Если встреча попадает на пиковое окно, система предлагает перенос и ждёт подтверждения.</p>`,
    peak:`<span class="caps">Когда отпуск закрыт</span><table class="t mt8"><tr><th>Пик</th><th>Окно</th><th></th></tr><tr><td>День святого Валентина</td><td class="num">14 февраля</td><td><button class="textbtn" data-toast="Окно можно расширить, например 12–14 февраля">Изменить</button></td></tr><tr><td>Mothering Sunday + 8 марта</td><td class="num">оба дня и дни между ними</td><td><button class="textbtn" data-toast="Окно меняется здесь">Изменить</button></td></tr><tr><td>Рождество</td><td class="num">14–24 декабря</td><td><button class="textbtn" data-toast="Окно меняется здесь">Изменить</button></td></tr></table>
      <div class="callout --plain mt16">Запрет жёсткий и только для ежегодного отпуска. Больничный и отгул по семейным обстоятельствам не блокируются – это право по закону.</div>
      <div class="hr"></div><span class="caps">Вехи подготовки</span><table class="t mt8"><tr><th>Веха</th><th>За сколько дней</th><th>Ответственный</th></tr>${MS_TPL.map(m=>`<tr><td>${m.t}</td><td><input class="input num" style="width:70px" value="${-m.off}"></td><td>${m.owner}</td></tr>`).join('')}</table><p class="xs muted mt8">Каждая веха автоматически становится задачей ответственному.</p>`,
    hosts:`<p class="sm soft">К этим людям сотрудник может записаться сам. Каждый открывает свои свободные часы.</p><div class="mt16">${HOSTS.map(h=>`<div class="ms"><span class="avatar">${initials(h.name)}</span><span class="t"><b>${h.name}</b><br><small class="muted">${h.role}</small></span><span class="w">${h.id==='hr'?'по роли HR – автоматически':'<button class="textbtn" data-toast="Адресат убран из списка">убрать</button>'}</span></div>`).join('')}</div><div class="row mt16"><select class="select"><option>Добавить сотрудника…</option><option>Denis Orlov – менеджер</option><option>Alina Moroz – поддержка</option></select><button class="btn --sm --secondary" data-toast="Адресат добавлен">Добавить</button></div><p class="xs muted mt16">Все с ролью HR попадают в список сами. Остальных выбирает владелец.</p>`,
    sup:`<span class="caps">Регулярные дни поставок</span><table class="t mt8"><tr><th>Поставщик</th><th>День</th><th>Что</th><th></th></tr>${REGULAR.map(g=>`<tr><td>${g.sup}</td><td>${WDF[g.wd]}</td><td>${g.what}</td><td><button class="textbtn" data-toast="День убран">Убрать</button></td></tr>`).join('')}</table><button class="btn --sm --secondary mt16" data-toast="Форма: поставщик, день недели, что везут">Добавить день</button><p class="xs muted mt16">Разовые поставки берутся со склада из «Ожидается» сами. Здесь – только повторяющиеся дни.</p>`,
    dig:`<div class="grid g2"><div class="field"><label>Когда</label><div class="row"><select class="select"><option>Понедельник</option></select><input class="input" type="time" value="09:00"></div></div><div class="field"><label>Куда</label><select class="select"><option>Общий чат команды</option></select></div></div>
      <div class="mt16"><span class="caps">Так выглядит сообщение</span><pre class="dg mt8"><b>Неделя 16–22 ноября</b>

Встречи
${wk.filter(e=>e.layer==='meeting').map(e=>`· ${fmtDW(fromIso(e.d))}, ${e.tm} – ${e.title}`).join('\n')||'· на этой неделе встреч нет'}

Поставки
${POS.filter(x=>x.d>='2026-11-16'&&x.d<='2026-11-22').map(x=>`· ${fmtDW(fromIso(x.d))} – ${x.sup}`).join('\n')}

Ближайший пик
· ${p.title}, ${fmtD(p.dates[0])} – через ${daysBetween(D(2026,11,16),p.dates[0])} ${plural(daysBetween(D(2026,11,16),p.dates[0]),'день','дня','дней')}
${p.milestones.filter(m=>m.d>=D(2026,11,16)&&m.d<=D(2026,11,29)).map(m=>`· веха: ${m.t} – до ${fmtD(m.d)}`).join('\n')}</pre></div><p class="xs muted mt8">В дайджесте нет имён, личных данных и сумм.</p>`,
  };
  sheet({eyebrow:'HR и владелец',title:'Настройки календаря',tabs:`<div class="sh-tabs">${tabs.map(([k,t])=>`<button class="${ST===k?'on':''}" data-st="${k}">${t}</button>`).join('')}</div>`,body:body[ST],foot:'<button class="btn --sm" data-toast="Настройки сохранены">Сохранить</button>'});
}
function sheetDay(k){
  const d=fromIso(k),evs=events(d,d),p=blackoutOf(d);
  sheet({eyebrow:WDF[dow(d)],title:fmtD(d)+' '+d.getFullYear(),body:`${p?`<div class="callout mb16">${p.title}: отпуск на этот день закрыт.</div>`:''}${evs.map(evRow).join('')||'<p class="muted">Событий нет.</p>'}`});
}

/* ---------- заметки ---------- */
const NOTES=`
<h4>Что это</h4><p>Вкладка «Календарь» в разделе «Задачи». Одно место, где каждый видит встречи, пики продаж, поставки, свои смены и отпуска – и сам записывается на 1:1.</p>
<h4>Как смотреть</h4><ul><li>Переключатель «Смотреть как» вверху: флорист, менеджер, HR, владелец – видно, что скрыто от каждого.</li><li>Запись на 1:1 – три нажатия: с кем, время, «Записаться».</li><li>«К двойному пику» – март 2027: Mothering Sunday 7-го и 8 марта подряд.</li><li>«Отпуск» – заявка на 5–9 марта 2027 не проходит.</li></ul>
<h4>Уже есть в CRM – переиспользуем</h4><ul><li>HR-календарь и его источники дат</li><li>График смен и группы</li><li>Отпуска и журнал отсутствий</li><li>Склад «Ожидается»</li><li>Задачи – для вех и договорённостей</li><li>Согласие на показ дня рождения</li></ul>
<h4>Новое</h4><ul><li>Серии встреч команды, явка, протокол</li><li>Слоты и самозапись на 1:1 к четырём адресатам</li><li>Коммерческий календарь: пики, cut-off, вехи</li><li>Запрет ежегодного отпуска на пики</li><li>Личная iCal-лента, дайджест недели</li></ul>
<h4>Кто что видит</h4><ul><li><b>Запись на 1:1</b> – только двое. Остальным «занято».</li><li><b>Отпуск</b> – команде только факт, без типа и причины.</li><li><b>Поставки</b> – флористы, менеджеры, владелец. Без цен.</li><li><b>HR-даты</b> – HR и владелец.</li><li><b>Дни рождения</b> – только с согласия, без возраста.</li><li>Денег в календаре нет.</li></ul>
<h4>Этапы</h4><p><span class="st ink">MVP</span> всё, что на этом экране.</p><p><span class="st">v2</span> лимит одновременных отсутствий, обучение с записью, онбординг для самого сотрудника, экран в приложении Floritta Team.</p><p><span class="st">v3</span> уровень влияния дат по истории заказов, проверки помещения с журналом.</p>
<h4>Приложение</h4><p><a class="textbtn" href="mobile.html">Как это выглядит в Floritta Team</a></p>
<h4>Данные</h4><p>Имена, поставщики и события вымышлены. Даты праздников и банковских выходных считаются настоящим расчётом.</p>`;

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-day],[data-close]');if(!el)return;const ds=el.dataset;
  if(el.id==='notes-hide'){$('app').classList.add('no-notes');$('app').classList.remove('notes-open');return}
  if(el.id==='notes-toggle'){$('app').classList.remove('no-notes');$('app').classList.toggle('notes-open');return}
  if('close' in ds)return closeSheet();
  if(ds.toast)return toast(ds.toast);
  if(ds.role){S.role=ds.role;closeSheet();return render()}
  if(ds.view){S.view=ds.view;return render()}
  if(ds.layer){S.layers.has(ds.layer)?S.layers.delete(ds.layer):S.layers.add(ds.layer);return render()}
  if(ds.nav!==undefined){const n=+ds.nav;if(S.view==='month')S.cursor=n?D(S.cursor.getFullYear(),S.cursor.getMonth()+1+n,1):D(2026,11,1);else S.weekStart=n?addDays(S.weekStart,7*n):D(2026,11,16);return render()}
  if(ds.jump){S.view='month';S.cursor=D(2027,3,1);return render()}
  if(ds.ref!==undefined)return openRef(REFS[+ds.ref]);
  if(ds.day)return sheetDay(ds.day);
  if(ds.rsvp){S.rsvp[ds.id]=ds.rsvp;toast(ds.rsvp==='yes'?'Отмечено: буду':'Отмечено: не смогу');render();if($('sheet').classList.contains('on')&&sheetMeeting.last)sheetMeeting(sheetMeeting.last);return}
  if(ds.move){S.moves[ds.id]=ds.move;toast(ds.move==='moved'?'Встреча перенесена – участники получили уведомление':'Встреча оставлена на прежней дате');render();return sheetMeeting(sheetMeeting.last)}
  if(ds.ag){const t=$('ag-t').value.trim();if(!t)return toast('Напишите, что сделать');S.agreements[ds.ag].push({t,o:$('ag-o').value,due:fmtD(fromIso($('ag-d').value))});toast('Задача создана и назначена');return sheetMeeting(sheetMeeting.last)}
  if(ds.ms){msDone[ds.ms]=!msDone[ds.ms];render();return sheetPeak(sheetPeak.last)}
  if(ds.host){if(ds.has)return toast('К этому человеку у вас уже есть запись – перенесите или отмените её');BK.host=ds.host;return sheetBook(2)}
  if(ds.slot){BK.slot=ds.slot;return sheetBook(3)}
  if(ds.rebook){const b=S.bookings.find(x=>x.id===+ds.rebook);S.bookings=S.bookings.filter(x=>x!==b);BK={host:b.host};render();toast('Выберите новое время');return sheetBook(2)}
  if(ds.cancel){S.bookings=S.bookings.filter(x=>x.id!==+ds.cancel);closeSheet();render();return toast('Запись отменена – слот снова свободен')}
  if(ds.st){ST=ds.st;return sheetSettings()}
  const act={book:()=>sheetBook(1),book2:()=>sheetBook(2),host:sheetHost,leave:sheetLeave,ical:sheetIcal,settings:sheetSettings,talk:sheetTalk,
    'book-ok':()=>{const[d,t]=BK.slot.split(' ');S.bookings.push({id:Date.now(),host:BK.host,d,t,by:me().name,topic:$('bk-topic').value.trim()});closeSheet();S.view='my';render();toast(`Вы записаны: ${fmtD(fromIso(d))}, ${t}. Напомним за день и за час`)},
    'talk-ok':()=>{S.talk.push({host:$('tk-h').value,by:me().name,topic:$('tk-t').value.trim(),d:iso(TODAY)});closeSheet();toast('Запрос отправлен – вам предложат время')},
    'leave-ok':()=>{closeSheet();toast('Заявка отправлена на согласование')},
    'ical-rotate':()=>{S.icalRev++;sheetIcal();toast('Новая ссылка готова, старая отключена')},
  }[ds.act];
  if(act)act();
});
document.addEventListener('input',e=>{if(e.target.id==='tk-t')$('tk-send').disabled=e.target.value.trim().length<5});
document.addEventListener('change',e=>{
  if(['lv-type','lv-from','lv-to'].includes(e.target.id))checkLeave();
  if(e.target.dataset.att){(S.attend[e.target.dataset.att]||(S.attend[e.target.dataset.att]={}))[e.target.dataset.n]=e.target.checked;sheetMeeting(sheetMeeting.last)}
});
$('scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
render();

</script>
</body>
</html>
