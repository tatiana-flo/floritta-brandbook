];
// overtime hours above the rota, last 8 weeks (clock-in vs rota)
const OT={mila:[0,1,0,2,1,1,2,1],daria:[0,0,1,0,1,0,1,1],nika:[0,1,1,2,1,4,4,5],alina:[0,0,0,0,0,0,0,0],yana:[0,0,0,0,0,0,0,0],polina:[1,2,1,2,2,3,3,3],irina:[2,1,2,1,1,2,1,2],kira:[0,1,0,0,1,0,1,0],ruslan:[1,0,1,1,0,1,1,1],jake:[0,0,0,0,0,0,0,0],bogdan:[1,1,0,1,0,1,1,0]};
const WEEKS=['16 сен','23 сен','30 сен','7 окт','14 окт','21 окт','28 окт','4 нояб'];
const LASTK={mila:'2026-11-05',daria:'2026-11-04',nika:'2026-09-14',alina:'2026-11-10',yana:'2026-09-25',polina:'2026-11-08',irina:'2026-10-22',kira:'2026-11-06',ruslan:'2026-11-09',jake:'2026-08-21',bogdan:'2026-10-16',artem:'2026-11-07',vera:'2026-10-28',denis:'2026-10-20'};
const OVERDUE={nika:21,jake:34,ruslan:9}; // days overdue on assigned lessons
const LATEMIN={studio:7,delivery:11,shop:6};
const CADD=(p)=>/Еженед/.test(p.cad)?7:/2 недел/.test(p.cad)?14:30;
const sinceLast=(p)=>daysBetween(dd(p.last),NOW);
const lastKudos=(p)=>{const k=D.kudos.filter(x=>x.to===p.id).map(x=>x.d).sort().pop();const a=LASTK[p.id]||'2026-01-01';return k&&k>a?k:a};
const PER={m:{t:'30 дней',days:30,abs:1,pk:2,months:1},q:{t:'Квартал',days:91,abs:2.6,pk:3,months:3},y:{t:'Год',days:365,abs:9.1,pk:6,months:12}};
const st={per:'q',team:'all',thr:{pulse:3,ot:3,one:2,kudos:60,train:14,prob:14,late:3}};
const fx=(n,d=1)=>n.toFixed(d).replace('.',',');
const pct=(a,b)=>b?Math.round(a/b*100):0;
const cap=(src,extra='')=>`<div class="cap">${ic('link')}<span>Источник в CRM:</span>${src.map(s=>`<code>${s}</code>`).join('')}${extra?`<span>· ${extra}</span>`:''}</div>`;
const people=()=>st.team==='all'?D.people:D.people.filter(p=>p.team===st.team);

/* ---------- rules: transparent, editable thresholds ---------- */
const RULES=[
 {k:'pulse',t:'Пульс упал',u:'пунктов за 4 недели',pre:'≥',src:'оценки после смены',
  f:(p,x)=>{const a=p.pulse;if(!a||a.length<2)return null;const b=a[Math.max(0,a.length-5)],l=a[a.length-1];return b-l>=x?`${b} → ${l} за 4 недели`:null}},
 {k:'ot',t:'Переработка',u:'ч сверх графика в неделю, 3 недели подряд',pre:'≥',src:'клок-ин и график смен',
  f:(p,x)=>{const o=OT[p.id];if(!o)return null;const l=o.slice(-3);return l.every(v=>v>=x)?`${l.join(' + ')} = ${l.reduce((a,b)=>a+b,0)} ч за 3 недели`:null}},
 {k:'one',t:'Нет 1:1 дольше',u:'× ритма',pre:'>',src:'встречи 1:1',
  f:(p,x)=>{const s=sinceLast(p),c=CADD(p);return s>x*c?`${s} дн. при ритме ${c} дн.`:null}},
 {k:'kudos',t:'Нет благодарностей',u:'дней',pre:'≥',src:'благодарности',
  f:(p,x)=>{const n=daysBetween(dd(lastKudos(p)),NOW);return n>=x?`последняя ${n} дн. назад`:null}},
 {k:'train',t:'Обучение просрочено',u:'дней',pre:'>',src:'назначенные уроки',
  f:(p,x)=>OVERDUE[p.id]>x?`урок просрочен на ${OVERDUE[p.id]} дн.`:null},
 {k:'prob',t:'Испытательный кончается через',u:'дней',pre:'≤',src:'дата конца испытательного (новое)',
  f:(p,x)=>{if(!p.probEnd)return null;const n=daysBetween(NOW,dd(p.probEnd));return n>=0&&n<=x?`ревью ${fmtD(p.probEnd)} – через ${n} дн.`:null}},
 {k:'late',t:'Опоздания за месяц',u:'раз и больше',pre:'≥',src:'клок-ин и график смен (новый расчёт)',
  f:(p,x)=>p.att&&p.att.late!=null&&p.att.late>=x?`${p.att.late} опоздания из ${p.att.shifts} смен`:null}
];
const fired=(r)=>people().map(p=>({p,why:r.f(p,st.thr[r.k])})).filter(x=>x.why);

/* ---------- charts ---------- */
function chHeadcount(){
 const ps=people(), lv=LEAV.filter(l=>st.team==='all'||l.team===st.team);
 const months=[];for(let i=11;i>=0;i--){const d=new Date(Date.UTC(2026,10-i,1));months.push(d)}
 const lab=(d)=>d.toLocaleDateString('ru-RU',{month:'short',timeZone:'UTC'}).replace('.','');
 const rows=months.map((m,i)=>{
  const end=i===11?NOW:new Date(Date.UTC(m.getUTCFullYear(),m.getUTCMonth()+1,0,23));
  const ym=m.toISOString().slice(0,7);
  const hc=ps.filter(p=>dd(p.start)<=end).length+lv.filter(l=>dd(l.start)<=end&&dd(l.left)>end).length;
  return {l:lab(m),hc,hi:ps.filter(p=>p.start.slice(0,7)===ym).length+lv.filter(l=>l.start.slice(0,7)===ym).length,lo:lv.filter(l=>l.left.slice(0,7)===ym).length,win:i>=12-PER[st.per].months,ym}});
 const W=560,HT=190,base=130,max=Math.max(...rows.map(r=>r.hc),1),sl=(W-20)/12,bw=Math.min(24,sl*.5);
 let s=`<svg class="ch" viewBox="0 0 ${W} ${HT}" role="img" aria-label="Численность по месяцам">`;
 const win=rows.filter(r=>r.win);const x0=10+rows.indexOf(win[0])*sl;
 s+=`<rect x="${x0}" y="4" width="${win.length*sl}" height="${base-4}" fill="var(--silver)"/><text x="${x0+4}" y="16">${PER[st.per].t}</text>`;
 s+=`<line x1="10" x2="${W-10}" y1="${base}" y2="${base}" stroke="var(--light)"/>`;
 rows.forEach((r,i)=>{const cx=10+i*sl+sl/2,h=r.hc/max*(base-30);
  s+=`<g><title>${r.l}: ${r.hc} чел. · пришли ${r.hi} · ушли ${r.lo}</title><rect class="m" x="${cx-bw/2}" y="${base-h}" width="${bw}" height="${h}" fill="${r.win?'var(--v1)':'var(--v4)'}"/><rect x="${cx-sl/2}" y="4" width="${sl}" height="${HT-8}" fill="transparent"/>
  <text class="v" x="${cx}" y="${base-h-5}" text-anchor="middle">${r.hc}</text><text x="${cx}" y="${base+15}" text-anchor="middle">${r.l}</text>
  ${r.hi?`<text x="${cx}" y="${base+36}" text-anchor="middle" style="fill:var(--ok)">+${r.hi}</text>`:''}${r.lo?`<text x="${cx}" y="${base+54}" text-anchor="middle" style="fill:var(--accent-dark)">−${r.lo}</text>`:''}</g>`});
 s+=`<text x="${W-10}" y="${base+36}" text-anchor="end" style="font-size:10px">пришли</text><text x="${W-10}" y="${base+54}" text-anchor="end" style="font-size:10px">ушли</text></svg>`;
 return s+`<div class="lgd"><span><i style="background:var(--v1);border-color:var(--v1)"></i>период</span><span><i style="background:var(--v4);border-color:var(--v4)"></i>до периода</span><span>уходы без имён – только месяц и команда</span></div>`+cap(['даты найма','уходы из графика','карточки сотрудников']);
}
function chTenure(){
 const ps=people();const B=[['< 3 мес',0,3],['3–12 мес',3,12],['1–2 г',12,24],['2–3 г',24,36],['3 г +',36,999]];
 const rows=B.map(([l,a,b])=>{const xs=ps.filter(p=>{const m=daysBetween(dd(p.start),NOW)/30.4;return m>=a&&m<b});return{l,n:xs.length,names:xs.map(p=>p.name.split(' ')[0]).join(', ')}});
 const W=560,HT=170,base=140,max=Math.max(...rows.map(r=>r.n),1),sl=(W-20)/rows.length,bw=Math.min(56,sl*.45);
 let s=`<svg class="ch" viewBox="0 0 ${W} ${HT}" role="img" aria-label="Распределение стажа"><line x1="10" x2="${W-10}" y1="${base}" y2="${base}" stroke="var(--light)"/>`;
 rows.forEach((r,i)=>{const cx=10+i*sl+sl/2,h=r.n/max*(base-34);
  s+=`<g><title>${r.l}: ${r.n} чел.${r.names?' – '+r.names:''}</title><rect class="m" x="${cx-bw/2}" y="${base-h}" width="${bw}" height="${Math.max(h,0)}" fill="var(--v3)"/><rect x="${cx-sl/2}" y="0" width="${sl}" height="${HT}" fill="transparent"/><text class="vb" x="${cx}" y="${base-h-6}" text-anchor="middle">${r.n}</text><text x="${cx}" y="${base+16}" text-anchor="middle">${r.l}</text></g>`});
 const early=ps.filter(p=>daysBetween(dd(p.start),NOW)<90).length;
 return s+`</svg><div class="lgd"><span>Первые 90 дней – зона риска раннего ухода: сейчас ${early} ${plural(early,'человек','человека','человек')}</span></div>`+cap(['даты найма']);
}
function chPulse(){
 const T=D.pulseTeam,n={studio:6,delivery:3,shop:2,tech:3};
 const avg=(keys)=>T.weeks.map((_,i)=>{let s=0,c=0;keys.forEach(k=>{s+=T[k][i]*n[k];c+=n[k]});return s/c});
 let G=[{t:'Вся компания',v:avg(['studio','delivery','shop','tech']),n:14,ks:['studio','delivery','shop','tech']},{t:'Студия',v:T.studio,n:6,ks:['studio']},{t:'Доставка + магазин',v:avg(['delivery','shop']),n:5,ks:['delivery','shop'],x:'объединены: по отдельности меньше 5'},{t:'Продукт и разработка',v:null,n:3,ks:['tech']}];
 if(st.team!=='all')G=G.filter((g,i)=>i===0||g.ks.includes(st.team));
 const W=220,HT=70,y=(v)=>HT-6-((v-6)/3)*(HT-14);
 const mini=(g)=>{if(!g.v||g.n<5)return `<div><div class="t">${g.t}<span class="muted sm">n = ${g.n}</span></div><div class="lockbox">${ic('lock')}<span>Меньше 5 человек – срез скрыт. Входит в общий итог компании.</span></div></div>`;
  const pts=g.v.map((v,i)=>`${(8+i*(W-16)/7).toFixed(1)},${y(v).toFixed(1)}`).join(' ');const l=g.v[g.v.length-1],d=l-g.v[0];
  return `<div><div class="t">${g.t}<span class="muted sm">n = ${g.n}</span><b>${fx(l)}</b></div><svg class="ch" viewBox="0 0 ${W} ${HT}"><line x1="8" x2="${W-8}" y1="${y(7)}" y2="${y(7)}" stroke="var(--hair)" stroke-dasharray="3 3"/><text x="${W-8}" y="${y(7)-3}" text-anchor="end" style="font-size:9px">7</text><polyline points="${pts}" fill="none" stroke="${H.pulseColor(l)}" stroke-width="2"/>${g.v.map((v,i)=>`<g><title>${WEEKS[i]}: ${fx(v)}</title><circle cx="${8+i*(W-16)/7}" cy="${y(v)}" r="${i===7?4:2.5}" fill="${i===7?H.pulseColor(l):'var(--paper)'}" stroke="${H.pulseColor(l)}" stroke-width="1.5"/></g>`).join('')}</svg><div class="muted sm">${d>=0?'+':'−'}${fx(Math.abs(d))} за 8 недель${g.x?' · '+g.x:''}</div></div>`};
 return `<div class="mini">${G.map(mini).join('')}</div><div class="lgd"><span>Шкала 6–9 одинаковая у всех графиков</span><span>Срезы < 5 человек скрыты – график можно показывать руководителям</span></div>`+cap(['оценки после смены (новое)','участие в eNPS']);
}
function chPunct(){
 const T=['studio','delivery','shop'].filter(t=>st.team==='all'||st.team===t);
 const rows=T.map(t=>{const ps=D.people.filter(p=>p.team===t&&p.att&&p.att.shifts);const sh=ps.reduce((a,p)=>a+p.att.shifts,0),lt=ps.reduce((a,p)=>a+p.att.late,0);return{t,sh,lt,v:sh?(1-lt/sh)*100:0}});
 if(!rows.length)return `<div class="lockbox">${ic('clock')}<span>У команды «${D.teams[st.team]}» нет смен и клок-ина – удалённые работают по задачам. Пунктуальность не считается; вместо неё – задачи в срок.</span></div>`+cap(['задачи и их приёмка']);
 const W=560,X=(v)=>140+(v-80)/20*(W-170),HT=rows.length*44+34;
 let s=`<svg class="ch" viewBox="0 0 ${W} ${HT}" role="img" aria-label="Пунктуальность по командам">`;
 [80,85,90,95,100].forEach(v=>{s+=`<line x1="${X(v)}" x2="${X(v)}" y1="6" y2="${HT-24}" stroke="${v===95?'var(--ok)':'var(--hair)'}" ${v===95?'stroke-dasharray="4 3"':''}/><text x="${X(v)}" y="${HT-8}" text-anchor="middle">${v} %</text>`});

 return s+'</svg>'+cap(['назначенные уроки','результаты уроков'],'то же, что «Обучение → Журнал обучения»');

function kpis(){
 const ps=people(),n=ps.length,P=PER[st.per],from=new Date(NOW-P.days*DAY);
 const hires=ps.filter(p=>dd(p.start)>=from).length;
 const lv=LEAV.filter(l=>st.team==='all'||l.team===st.team);const avgHc=n+lv.length/2;
 const ten=ps.reduce((a,p)=>a+daysBetween(dd(p.start),NOW),0)/Math.max(n,1)/365;
 const pv=ps.map(p=>p.pulse.slice(-P.pk)).flat();const pAvg=pv.reduce((a,b)=>a+b,0)/Math.max(pv.length,1);
 const prevV=ps.map(p=>p.pulse.slice(-P.pk*2,-P.pk)).flat();const pPrev=prevV.length?prevV.reduce((a,b)=>a+b,0)/prevV.length:null;
 const inR=ps.filter(p=>p.status!=='leave'&&sinceLast(p)<=CADD(p)+3).length,act=ps.filter(p=>p.status!=='leave').length;
 const tr=[ps.reduce((a,p)=>a+p.train[0],0),ps.reduce((a,p)=>a+p.train[1],0)];
 const abs=ps.reduce((a,p)=>a+(p.att?p.att.abs||0:0),0)/Math.max(n,1)*P.abs;
 const small=n<5;
 const K=[
  ['Численность',n,'',`+${hires} за период · ушли ${lv.filter(l=>dd(l.left)>=from).length}`],
  ['Текучесть за 12 мес',Math.round(lv.length/avgHc*100),'%',`${lv.length} ${plural(lv.length,'уход','ухода','уходов')} · ранних (< 90 дн.) ${lv.filter(l=>daysBetween(dd(l.start),dd(l.left))<90).length}`],
  ['Средний стаж',fx(ten),'г',`новичков < 90 дн.: ${ps.filter(p=>daysBetween(dd(p.start),NOW)<90).length}`],
  small?['Пульс','скрыто','','меньше 5 человек в срезе',1]:['Пульс',fx(pAvg),'/10',pPrev?`<span class="${pAvg>=pPrev?'up':'dn'}">${pAvg>=pPrev?'+':'−'}${fx(Math.abs(pAvg-pPrev))}</span> к прошлому периоду`:'пульс собираем 6 недель – сравнения за год нет'],
  st.team!=='all'?['eNPS','—','','только по компании – без срезов (n ≥ 5)',1]:['eNPS','+'+D.enps.score,'',`<span class="up">+${D.enps.score-D.enps.prev}</span> к прошлому опросу · n = ${D.enps.n}`],
  ['Охват 1:1',pct(inR,act),'%',`${inR} из ${act} в своём ритме`],
  ['Обучение выполнено',pct(tr[0],tr[1]),'%',`${tr[0]} из ${tr[1]} уроков`],
  ['Дней отсутствия на человека',fx(abs),'',`за ${P.t.toLowerCase()} · только даты, без причин`]
 ];
 return K.map(([k,v,u,d,h])=>`<div class="kpi ${h?'hid':''}"><div class="k">${k}</div><div class="v">${v}${u?`<small>${u}</small>`:''}</div><div class="d">${d}</div></div>`).join('');
}

  how:`Окно – 6 недель.\nОценка после смены – личный тренд, видит только HR.\nЧасы сверх графика = факт по клок-ину минус план по графику, по неделям.\nНезакрытое – договорённости прошлых 1:1, которые не отмечены сделанными.\nЗаметки «Только я» и «+ руководитель» не читаются.`,

 }
 if(k==='rate') return {deny:1,title:'Финансовые данные недоступны для роли HR',body:`<p>Ставки, расчёты, бонусы и суммы заказов закрыты на сервере для роли HR – не только в меню, но и в отчётах и в «Спроси у CRM». Запрос записан в журнал доступа.</p><p>Могу показать по Ruslan без денег: стаж, график смен, % доставок вовремя, план развития.</p>${App.role==='admin'?`<p class="sm">Вы админ: ставку можно посмотреть в обычном «Спроси у CRM» или в «Команда → Люди».</p>`:''}`,

 return {ai:1,body:`<p>В демо я отвечаю только на примеры выше. В рабочей версии HR-режим понимает вопросы о людях, 1:1, обучении, развитии, графике и благодарностях – без денег и здоровья.</p><p class="muted sm">Попробуйте: «Кого давно не благодарили?» или «Подготовь меня к 1:1 с Nika».</p>`,src:['—'],how:`вопрос не распознан – ответ-заглушка, данные не читались`};

 grow:['Мой рост','Человек видит свой уровень, что ждут на следующем и один конкретный следующий шаг – а не просто «процент плана».',['Уровень и ожидания – из карьерного трека флориста (новое; сейчас есть только денежные тиры).','План развития и шаги – уже есть в CRM (раздел «Развитие»), здесь – в приложении.','«Сделано» уходит наставнику на подтверждение – сам себе не ставишь галочку.','Навыки – та же шкала 0–3, что в Матрице навыков.']],
 one:['Мой 1:1','Общая повестка: сотрудник сам добавляет темы до встречи, после – видит договорённости и кто что делает.',['Темы, добавленные здесь, сразу видны HR в экране 1:1.','Личные заметки HR сюда не попадают – только «Видит сотрудник».','Договорённости с владельцем и сроком – чтобы обещания HR тоже были видны.','Встречи 1:1 в CRM есть, но без повестки и действий – это новое.']],
 pulse:['Пульс','Один тап после смены – 5 лиц, комментарий по желанию. Без длинных опросов.',['Оценку видит только HR – как личный тренд, чтобы заметить усталость рано. Сотрудник знает об этом.','Руководитель – только среднее по команде, если в срезе 5+ человек.','Комментарий – анонимно, без имени.','Не анализируем эмоции по лицу, голосу или сообщениям – только то, что человек поставил сам.']],
 kudos:['Спасибо','Полученные благодарности и отправка своей – с ценностью Floritta.',['Благодарности уже есть в CRM (Floritta Active) – здесь удобный вход с телефона.','HR видит, кого давно не благодарили («кого не замечают»), но не пишет за людей.','Без денежных наград и сумм.']],
 hr:['Что обо мне видит HR','Экран прозрачности: что HR видит и чего не видит, какие сигналы считает CRM, кто открывал карточку.',['Основа доверия к внешнему HR-подрядчику.','Заметки «Видит сотрудник» – здесь же.','«Запросить мои данные» – запуск запроса доступа к данным (DSAR, ответ в течение месяца).','Список сигналов совпадает с «Аналитикой людей» – никаких скрытых правил.']]
};

function grow(){
 const p=P(ME),L=D.ladders[p.ladder].levels;
 return `<div class="blk"><h5>${ic('target')}Мой уровень</h5><div class="row"><div><div class="big">${L[p.lvl-1].split(' ')[0]}</div><div class="sm">${L[p.lvl-1].replace(/^L\d /,'')}</div></div><span class="sp"></span>${ic('arrow')}<span class="sp"></span><div style="text-align:right"><div class="big" style="color:var(--accent-dark)">${L[p.lvl].split(' ')[0]}</div><div class="sm">${L[p.lvl].replace(/^L\d /,'')}</div></div></div></div>
 <div class="blk"><h5>${ic('sprout')}Цель плана развития</h5><b style="font-weight:500">${p.pdp.goal}</b><div class="row" style="margin-top:8px">${H.bar(p.pdp.pct,'ac')}<span class="sm">${p.pdp.pct} %</span></div></div>
 <div class="blk"><h5>${ic('flag')}Шаги</h5>${STEPS.map((s,i)=>{const pend=st.pend[i];return `<div class="li ${s.s==='done'?'done':'todo'}" ${s.s==='todo'?`data-step="${i}"`:''}><span class="ic">${ic(s.s==='done'?'check':pend?'clock':'target')}</span><div style="flex:1">${s.t}<small>${pend?'на подтверждении у Mila':s.w}</small></div>${s.s==='todo'&&!pend?'<span class="tag">отметить</span>':''}</div>`}).join('')}</div>
 <div class="blk"><h5>${ic('star')}Что ждут на ${L[p.lvl].split(' ')[0]}</h5>${EXP.map(([t,s])=>`<div class="li"><span class="ic" style="color:${s==='ok'?'var(--ok)':s==='part'?'var(--warn)':'var(--grey)'}">${ic(s==='ok'?'check':s==='part'?'clock':'dots')}</span><div>${t}<small>${s==='ok'?'уже получается':s==='part'?'в процессе':'ещё не начато'}</small></div></div>`).join('')}</div>
 <div class="blk"><h5>${ic('chart')}Навыки: сейчас → цель</h5>${Object.keys(TARGET).map(k=>`<div class="sk"><span>${H.skillNames[k]}</span><span class="dots">${[1,2,3].map(n=>`<i class="${n<=p.skills[k]?'f':n<=TARGET[k]?'t':''}"></i>`).join('')}</span><span class="sm muted">${p.skills[k]} → ${TARGET[k]}</span></div>`).join('')}</div>
 <button class="btn" data-toast="Запрос отправлен Mila и Irina – ответ придёт в приложение">${ic('chat')}Попросить обратную связь</button>`;
}
function one(){
 const o=D.ones.find(x=>x.who===ME&&x.status!=='done');
 const by={emp:'Ты',hr:'Eva',auto:'Из CRM'};
 return `<div class="blk"><h5>${ic('cal')}Следующая встреча</h5><div class="big">${fmtD(o.d)}, ${o.time}</div><div class="sm" style="margin-top:4px">${o.d==='2026-11-11'?'Сегодня · ':''}с Eva Marin, People Partner · видеозвонок</div>
  <div class="row" style="gap:6px;margin-top:8px"><button class="btn s" style="width:auto;margin:0" data-toast="Добавлено в календарь телефона">${ic('cal')}В календарь</button><button class="btn s" style="width:auto;margin:0" data-toast="Запрос на перенос отправлен Eva">${ic('clock')}Перенести</button></div></div>
 <div class="blk"><h5>${ic('note')}Общая повестка</h5>${o.agenda.map(a=>`<div class="li"><span class="tag">${by[a.by]}</span><div>${H.esc(a.t)}</div></div>`).join('')}
  <form id="em-add" style="margin-top:8px"><input class="inp" id="em-topic" placeholder="Добавить тему…" autocomplete="off"><button class="btn pr" type="submit">${ic('plus')}Добавить тему</button></form></div>
 <div class="blk"><h5>${ic('check')}Договорённости</h5>${o.actions.map(a=>`<div class="li ${a.done?'done':''}"><span class="ic">${ic(a.done?'check':'clock')}</span><div>${H.esc(a.t)}<small>${a.owner===ME?'Ты':P(a.owner)?P(a.owner).name.split(' ')[0]:'Eva'} · до ${fmtD(a.due)}</small></div></div>`).join('')}
  <div class="li done"><span class="ic">${ic('check')}</span><div>Пройти урок «Свадебные арки и подвесы»<small>Ты · сделано 3 нояб</small></div></div>
  <div class="li done"><span class="ic">${ic('check')}</span><div>Поставить на свадьбу ассистентом к Mila<small>Eva · сделано 30 окт</small></div></div></div>
 <div class="blk"><h5>${ic('eye')}Итоги 28 окт</h5>${H.vis('shared')}<p style="margin-top:6px">${D.notes.find(n=>n.id==='n-d1').t}</p></div>`;
}
function pulse(){
 const p=P(ME);
 if(st.sent)return `<div class="blk" style="text-align:center;padding:24px 12px"><div style="color:var(--ok)">${ic('check')}</div><div class="big" style="margin:8px 0">Спасибо!</div><p class="sm">Следующий вопрос – после следующей смены.</p></div>
  <div class="blk"><h5>${ic('chart')}Мой тренд</h5>${H.spark(p.pulse,{w:300,h:50,color:H.pulseColor(p.pulse[p.pulse.length-1])})}<p class="sm muted" style="margin-top:6px">Видишь только ты и HR.</p></div>
  <button class="btn" id="em-again">Изменить ответ</button>`;
 return `<div class="blk"><h5>${ic('heart')}После смены</h5><b style="font-weight:500">Как прошла смена сегодня?</b>
  <div class="faces">${FACES.map(([l,v,d],i)=>`<button data-face="${i}" class="${st.face===i?'on':''}" aria-label="${l}">${face(d)}<span>${l}</span></button>`).join('')}</div>
  <p class="sm muted">Оценку видит только HR – как твой тренд. Руководитель – только среднее по команде от 5 человек.</p></div>
 <div class="blk" style="${st.face===null?'opacity:.5':''}"><h5>${ic('note')}Комментарий <span class="vis shared" style="margin-left:auto">${ic('lock')}анонимно</span></h5><textarea class="ta" id="em-cm" placeholder="Что помогло или мешало? Необязательно" ${st.face===null?'disabled':''}></textarea><p class="sm muted" style="margin-top:6px">Уходит без имени, показывается только в общей сводке, если ответили 5+ человек.</p></div>
 <button class="btn pr" id="em-send" ${st.face===null?'disabled':''}>${ic('send')}Отправить</button><button class="btn ghost" data-toast="Пропущено – спросим после следующей смены">Пропустить</button>`;
}
function kudos(){
 const sent=D.kudos.filter(k=>k.from===ME);
 const got=[...D.kudos.filter(k=>k.to===ME),...KIN];
 return `<div class="blk"><h5>${ic('star')}Мне сказали спасибо · ${got.length}</h5>${got.map(k=>`<div class="li">${H.av(P(k.from),'s')}<div>${H.esc(k.t)}<small>${P(k.from).name.split(' ')[0]} · ${k.val} · ${fmtD(k.d)}</small></div></div>`).join('')}</div>
 <div class="blk"><h5>${ic('send')}Сказать спасибо</h5>
  <select class="sel" id="em-to">${D.people.filter(p=>p.id!==ME).map(p=>`<option value="${p.id}">${p.name} – ${p.role}</option>`).join('')}</select>
  <div class="vals">${D.values.map(v=>`<button data-val="${v}" class="${st.val===v?'on':''}">${v}</button>`).join('')}</div>
  <input class="inp" id="em-kt" placeholder="За что? Например: помогла с аркой" autocomplete="off">
  <button class="btn pr" id="em-ks">${ic('heart')}Отправить</button><p class="sm muted" style="margin-top:6px">Благодарность видна в ленте команды.</p></div>
 ${sent.length?`<div class="blk"><h5>${ic('check')}Я отправила · ${sent.length}</h5>${sent.map(k=>`<div class="li">${H.av(P(k.to),'s')}<div>${H.esc(k.t)}<small>${P(k.to).name.split(' ')[0]} · ${k.val} · ${fmtD(k.d)}</small></div></div>`).join('')}</div>`:''}`;
}
function hr(){
 const sh=D.notes.filter(n=>n.who===ME&&n.vis==='shared');
 const Y=['Профиль, роль, стаж','Навыки, обучение, план развития','Повестка и договорённости 1:1','Рабочие метрики без денег: букеты, переделки, опоздания','Тренд оценки после смены','Даты отсутствий – без причин'];
 const N=['Ставки, выплаты, бонусы','Причины болезни и диагнозы','Твои ответы eNPS по имени','Личные сообщения и чаты'];
 return `<div class="blk"><h5>${ic('eye')}HR видит</h5>${Y.map(t=>`<div class="li"><span class="ic" style="color:var(--ok)">${ic('check')}</span><div>${t}</div></div>`).join('')}</div>
 <div class="blk"><h5>${ic('lock')}HR не видит</h5>${N.map(t=>`<div class="li"><span class="ic" style="color:var(--accent-dark)">${ic('lock')}</span><div>${t}</div></div>`).join('')}</div>
 <div class="blk"><h5>${ic('alert')}Сигналы, которые считает CRM</h5><p class="sm">Оценка после смены падает 4 недели · переработка 3 недели подряд · давно не было 1:1 · обучение просрочено · 3+ опоздания за месяц.</p><p class="sm muted" style="margin-top:6px">Это повод поговорить, а не оценка. Решения принимают люди.</p></div>
 <div class="blk"><h5>${ic('note')}Заметки, которые видишь ты · ${sh.length}</h5>${sh.map(n=>`<div class="li"><div style="flex:1">${H.esc(n.t)}<small>${P(n.by)?P(n.by).name:'Eva Marin'} · ${fmtD(n.d)} · ${n.cat}</small><div style="margin-top:4px">${H.vis(n.vis)}</div></div></div>`).join('')||'<p class="sm muted">Пока нет</p>'}</div>
 <div class="blk"><h5>${ic('clock')}Кто открывал мою карточку</h5><div class="li"><div>Eva Marin (HR)<small>11 нояб · подготовка к 1:1</small></div></div><div class="li"><div>Irina Petrova (руководитель)<small>4 нояб · график смен</small></div></div></div>
 <button class="btn pr" id="em-dsar">${ic('file')}Запросить мои данные</button>`;
}
function draw(el){
 const T=TABS.find(t=>t[0]===st.tab),E=EXPL[st.tab];
 el.querySelector('#em-ttl').textContent=T[3];
 el.querySelector('#em-bd').innerHTML={grow,one,pulse,kudos,hr}[st.tab]();
 el.querySelector('#em-bd').scrollTop=0;
 el.querySelectorAll('.ph-tb button,.tabs-m button').forEach(b=>b.classList.toggle('on',b.dataset.t===st.tab));
 el.querySelector('#em-ex').innerHTML=`<div class="eyebrow">Экран приложения</div><h3>${E[0]}</h3><p style="margin-bottom:10px">${E[1]}</p><ul>${E[2].map(x=>`<li>${x}</li>`).join('')}</ul>`;
 bind(el);
}
function bind(el){
 const bd=el.querySelector('#em-bd');
 bd.querySelectorAll('[data-step]').forEach(s=>s.addEventListener('click',()=>{st.pend[s.dataset.step]=1;App.toast('Отправлено Mila на подтверждение');draw(el)}));
 const f=bd.querySelector('#em-add');if(f)f.addEventListener('submit',e=>{e.preventDefault();const v=bd.querySelector('#em-topic').value.trim();if(!v){App.toast('Напишите тему');return}D.ones.find(x=>x.who===ME&&x.status!=='done').agenda.push({by:'emp',t:v});App.toast('Тема добавлена – Eva увидит её до встречи');draw(el)});
 bd.querySelectorAll('[data-face]').forEach(b=>b.addEventListener('click',()=>{st.face=+b.dataset.face;draw(el)}));
 const s=bd.querySelector('#em-send');if(s)s.addEventListener('click',()=>{if(st.face===null)return;P(ME).pulse.push(FACES[st.face][1]);st.sent=true;App.toast('Спасибо! Ответ учтён'+(bd.querySelector('#em-cm').value.trim()?' – комментарий ушёл без имени':''));draw(el)});
 const a=bd.querySelector('#em-again');if(a)a.addEventListener('click',()=>{P(ME).pulse.pop();st.sent=false;st.face=null;draw(el)});
 bd.querySelectorAll('[data-val]').forEach(b=>b.addEventListener('click',()=>{st.val=b.dataset.val;bd.querySelectorAll('[data-val]').forEach(x=>x.classList.toggle('on',x===b))}));
 const k=bd.querySelector('#em-ks');if(k)k.addEventListener('click',()=>{const t=bd.querySelector('#em-kt').value.trim();if(!t){App.toast('Напишите, за что спасибо');return}const to=bd.querySelector('#em-to').value;D.kudos.unshift({from:ME,to,d:'2026-11-11',val:st.val,t});P(to).kudos++;App.toast('Спасибо отправлено – '+P(to).name.split(' ')[0]+' увидит в приложении');draw(el)});
 const d=bd.querySelector('#em-dsar');if(d)d.addEventListener('click',()=>{if(!HRX.dsar){HRX.dsar=1;HRX.audit.unshift({who:'Daria Lis',what:'Запрос своих данных (DSAR)',when:'сегодня, 10:30',why:'Ответ до 11 дек'})}App.toast('Запрос отправлен – копия данных придёт в течение месяца')});
}

App.reg('employee',{

 crumb:()=>App.role==='employee'?'Floritta Team':'Приложение сотрудника',
 render(el){

  <div class="acts">${H.chip('доработать','warn')}</div></div>
  <div class="em-wrap"><div class="phone"><div class="ph-sb"><span>10:30</span><i></i><span>5G</span></div>
   <div class="ph-hd"><div class="ey">Floritta Team · Daria</div><h2 id="em-ttl"></h2></div>
   <div class="ph-bd" id="em-bd"></div>

  <div class="ex"><div class="tabs-m">${TABS.map(([k,,,l])=>`<button data-t="${k}">${l}</button>`).join('')}</div><div id="em-ex"></div>
   <div class="callout info" style="margin-top:8px">Всё в приложении – только свои данные. Чужие оценки, заметки HR «Только я» и «HR + основатель», деньги других людей сюда не попадают.</div></div></div>`;
  el.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b&&el.contains(b)){st.tab=b.dataset.t;draw(el)}});
  draw(el);
 },
 notes:`<h4>Что это</h4><p>Что сотрудник видит в «Floritta Team»: рост, 1:1, пульс после смены, благодарности и экран прозрачности «Что обо мне видит HR».</p>

<h4>Откуда идея</h4><p><span class="src">Lattice</span><span class="src">15Five</span><span class="src">Officevibe</span><span class="src">Connecteam</span><span class="src">Culture Amp</span></p>
<h4>Данные из нашей CRM</h4><ul><li>Есть в приложении: обучение, развитие, благодарности, график, табель.</li><li>Новое: общая повестка 1:1, пульс после смены, экран прозрачности, запрос своих данных.</li></ul>
<h4>Доступы</h4><p>Только свои данные. Комментарий пульса анонимен; оценку видит HR как тренд – об этом сказано прямо в приложении.</p>
<h4>Приоритет</h4><p><span class="pri p1">MVP</span> 1:1 и «Обо мне» <span class="pri p2">Следующий шаг</span> пульс, рост</p>`
});
})();
</script>
