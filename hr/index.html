<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floritta CRM · роль HR</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../crm/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ===================== TOKENS (site palette, 01.11.2026) ===================== */
:root{
  --paper:#fdfdfd; --ink:#1e1a17; --graphite:#5c5450; --grey:#8b8378; --light:#cecece; --hair:#e6e6e6; --silver:#f2f2f4;
  --accent:#b4595f; --accent-dark:#9a474c; --accent-bg:#f3e1e1; --ok:#5f7350; --ok-bg:#eef0e9; --warn:#9a6a0a; --warn-bg:#fbf1d4;
  --info:#3f5f7a; --info-bg:#e7eef4;
  --sel:#1e1a17; --sel-bg:#f2f2f4; --on-sel:#fff;
  --f-display:"Cormorant Infant",Georgia,serif; --f-body:"Jost","Helvetica Neue",Arial,sans-serif;
  --r:0px; --btn-h:36px; --btn-h-s:28px; --row-h:44px; --sidebar-w:232px; --topbar-h:56px; --notes-w:340px; --pad:24px;
  --ls-caps:.08em; --ls-eyebrow:.14em;
  --m-fast:160ms; --m-base:280ms; --m-ease:cubic-bezier(.22,1,.36,1);
  --shadow-sheet:-12px 0 40px rgba(30,26,23,.14); --shadow-pop:0 6px 24px rgba(30,26,23,.16);
  /* data-viz: one hue family + status */
  --v1:#b4595f; --v2:#d9a2a6; --v3:#8b8378; --v4:#cecece; --v-good:#5f7350; --v-mid:#c9a227; --v-bad:#b4595f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f-body);font-weight:400;font-size:14px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}

/* ===================== LAYOUT ===================== */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr var(--notes-w);height:100vh}
.app.no-notes{grid-template-columns:var(--sidebar-w) 1fr 0}
.side{border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.side .brand{height:var(--topbar-h);display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--hair);flex:none}
.side .brand b{font-family:var(--f-display);font-weight:500;font-size:22px;letter-spacing:.02em}
.side .brand span{font-size:10px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);margin-top:4px}
.side nav{flex:1;overflow:auto;padding:10px 10px 20px}
.side .grp{font-size:10px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);padding:16px 10px 6px}
.side .it{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;font-size:13.5px;color:var(--graphite);text-align:left;position:relative}
.side .it:hover{background:var(--silver);color:var(--ink)}
.side .it.on{background:var(--sel);color:var(--on-sel)}
.side .it .b{margin-left:auto;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff}
.side .it.on .b{background:#fff;color:var(--ink)}
.side .it .ro{margin-left:auto;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.side .it.on .ro{color:#cfc8c2}
.side .locked{margin:14px 10px 0;padding:12px;border:1px dashed var(--light);font-size:12px;color:var(--grey)}
.side .locked .lk{display:flex;align-items:center;gap:8px;height:24px;color:var(--light);text-decoration:line-through}
.side .locked .lk svg{stroke:var(--grey)}
.side .locked p{margin-top:6px;line-height:1.4}
.side .me{border-top:1px solid var(--hair);padding:12px 16px;display:flex;align-items:center;gap:10px;flex:none}
.side .me small{display:block;color:var(--grey);font-size:11.5px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:var(--topbar-h);border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:14px;padding:0 var(--pad);flex:none}
.top .crumb{font-size:12px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb b{color:var(--ink);font-weight:500}
.top .srch{margin-left:auto;display:flex;align-items:center;gap:8px;height:34px;border:1px solid var(--hair);padding:0 10px;width:260px;color:var(--grey);font-size:13px;cursor:text}
.top .srch kbd{margin-left:auto;font-family:inherit;font-size:11px;border:1px solid var(--hair);padding:0 5px}
.roles{display:flex;border:1px solid var(--hair)}
.roles button{height:32px;padding:0 10px;font-size:11px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--grey)}
.roles button.on{background:var(--sel);color:var(--on-sel)}
.top .ib{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--hair);position:relative}
.top .ib:hover{background:var(--silver)}
.top .ib .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;background:var(--accent)}
.view{flex:1;overflow:auto;min-height:0;position:relative}
.scr{padding:var(--pad);max-width:1400px}
.scr-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.scr-h h1{font-family:var(--f-display);font-weight:500;font-size:34px;line-height:1.05;letter-spacing:.005em}
.scr-h .sub{color:var(--grey);font-size:13px;margin-top:4px}
.scr-h .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:10.5px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey)}

/* ===================== NOTES PANEL ===================== */
.notes{border-left:1px solid var(--hair);background:var(--silver);overflow:auto;min-width:0}
.app.no-notes .notes{display:none}
.notes .nh{height:var(--topbar-h);display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--hair);gap:8px;position:sticky;top:0;background:var(--silver);z-index:2}
.notes .nh b{font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;font-weight:500}
.notes .nh button{margin-left:auto}
.notes .nb{padding:18px 20px 40px;font-size:13px;color:var(--graphite)}
.notes .nb h4{font-size:10.5px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink);font-weight:500;margin:18px 0 6px}
.notes .nb h4:first-child{margin-top:0}
.notes .nb p{margin:0 0 8px}
.notes .nb ul{margin:0 0 8px 16px}
.notes .nb li{margin:0 0 4px}
.notes .nb .src{display:inline-block;font-size:11px;border:1px solid var(--light);padding:0 6px;margin:0 4px 4px 0;background:var(--paper);color:var(--graphite)}
.notes .nb .pri{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;margin-right:4px}
.pri.p1{background:var(--ink);color:#fff}.pri.p2{background:var(--accent-bg);color:var(--accent-dark)}.pri.p3{background:var(--paper);color:var(--grey);border:1px solid var(--light)}
.notes-toggle{position:fixed;right:16px;bottom:16px;z-index:40;height:36px;padding:0 14px;background:var(--ink);color:#fff;font-size:11px;letter-spacing:var(--ls-caps);text-transform:uppercase;display:none;align-items:center;gap:8px}
.app.no-notes ~ .notes-toggle{display:inline-flex}

/* ===================== COMPONENTS ===================== */
.btn{height:var(--btn-h);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:11.5px;letter-spacing:var(--ls-caps);text-transform:uppercase;border:1px solid var(--hair);background:var(--paper);white-space:nowrap;transition:background var(--m-fast)}
.btn:hover{background:var(--silver)}
.btn.pr{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pr:hover{background:#3a332e}
.btn.ac{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.s{height:var(--btn-h-s);padding:0 10px;font-size:10.5px}
.btn.ghost{border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.inp,.sel,.ta{height:var(--btn-h);border:1px solid var(--hair);padding:0 10px;background:var(--paper);font-size:13.5px;width:100%;outline:none;border-radius:0}
.ta{height:auto;min-height:84px;padding:8px 10px;resize:vertical;line-height:1.45}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--ink)}
label.f{display:block;font-size:11px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--grey);margin:0 0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;font-size:11.5px;background:var(--silver);color:var(--graphite);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--accent-bg);color:var(--accent-dark)}.chip.info{background:var(--info-bg);color:var(--info)}.chip.ink{background:var(--ink);color:#fff}.chip.line{background:transparent;border:1px solid var(--hair)}
.dotc{display:inline-block;width:8px;height:8px;flex:none}
.card{border:1px solid var(--hair);background:var(--paper)}
.card .ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--hair);min-height:46px}
.card .ch h3{font-size:11px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;font-weight:500}
.card .ch .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card .cb{padding:14px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{border:1px solid var(--hair);padding:14px 16px;background:var(--paper)}
.kpi .k{font-size:10.5px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey)}
.kpi .v{font-family:var(--f-display);font-size:34px;line-height:1.1;margin-top:4px;font-variant-numeric:lining-nums tabular-nums}
.kpi .d{font-size:12px;color:var(--grey);margin-top:2px}
.kpi .d .up{color:var(--ok)}.kpi .d .dn{color:var(--accent)}
.av{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;letter-spacing:.02em;flex:none;color:var(--ink);background:var(--silver);border:1px solid var(--hair)}
.av.l{width:56px;height:56px;font-size:18px}.av.xl{width:72px;height:72px;font-size:22px;font-family:var(--f-display)}.av.s{width:24px;height:24px;font-size:10px}
.pr-line{display:flex;align-items:center;gap:10px}
.pr-line .who{min-width:0}
.pr-line .who b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-line .who small{display:block;color:var(--grey);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:var(--silver);position:relative;overflow:hidden;min-width:60px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar.ac i{background:var(--accent)}.bar.ok i{background:var(--ok)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:400;font-size:10.5px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);height:38px;padding:0 12px;border-bottom:1px solid var(--hair);white-space:nowrap;position:sticky;top:0;background:var(--paper);z-index:1}
table.t td{height:var(--row-h);padding:6px 12px;border-bottom:1px solid var(--hair);vertical-align:middle}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:var(--silver)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--hair);overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:40px;padding:0 12px;font-size:11.5px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--grey);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button .n{font-size:11px;color:var(--grey)}
.seg{display:inline-flex;border:1px solid var(--hair)}
.seg button{height:30px;padding:0 10px;font-size:11px;letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--grey)}
.seg button.on{background:var(--sel);color:#fff}
.vis{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--hair);color:var(--graphite);white-space:nowrap}
.vis.priv{border-color:var(--ink);color:var(--ink)}.vis.hr{border-color:var(--accent);color:var(--accent-dark)}.vis.shared{border-color:var(--ok);color:var(--ok)}.vis.mgr{border-color:var(--info);color:var(--info)}
.empty{padding:28px;text-align:center;color:var(--grey);font-size:13px}
.muted{color:var(--grey)}
.sm{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.hr-line{height:1px;background:var(--hair);margin:14px 0}
.ai{border:1px solid var(--accent);background:linear-gradient(0deg,rgba(180,89,95,.04),rgba(180,89,95,.04)),var(--paper)}
.ai .ch h3{color:var(--accent-dark)}
.ai-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark)}
.lockbox{border:1px dashed var(--light);padding:14px 16px;color:var(--grey);font-size:12.5px;display:flex;gap:10px;align-items:flex-start;background:repeating-linear-gradient(-45deg,transparent 0 8px,rgba(0,0,0,.018) 8px 16px)}
.callout{border-left:2px solid var(--accent);padding:10px 14px;background:var(--accent-bg);color:var(--accent-dark);font-size:13px}
.callout.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.callout.info{border-color:var(--info);background:var(--info-bg);color:var(--info)}

/* sheet / modal / toast */
.scrim{position:fixed;inset:0;background:rgba(30,26,23,.28);z-index:50;opacity:0;pointer-events:none;transition:opacity var(--m-base) var(--m-ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--paper);box-shadow:var(--shadow-sheet);z-index:51;transform:translateX(100%);transition:transform var(--m-base) var(--m-ease);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .sh{height:var(--topbar-h);display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--hair);flex:none}
.sheet .sh h2{font-family:var(--f-display);font-weight:500;font-size:24px}
.sheet .sh .x{margin-left:auto}
.sheet .sb{flex:1;overflow:auto;padding:20px}
.sheet .sf{border-top:1px solid var(--hair);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;flex:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);opacity:0;pointer-events:none;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 64px);overflow:auto;background:var(--paper);box-shadow:var(--shadow-pop);z-index:52;transition:all var(--m-base) var(--m-ease)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal .mh{padding:18px 20px 0;font-family:var(--f-display);font-size:24px}
.modal .mb{padding:12px 20px 4px}
.modal .mf{padding:14px 20px 18px;display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;font-size:13px;z-index:60;transition:all var(--m-base) var(--m-ease);pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cmdk{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--paper);box-shadow:var(--shadow-pop);z-index:53;display:none}
.cmdk.on{display:block}
.cmdk input{width:100%;height:52px;border:0;border-bottom:1px solid var(--hair);padding:0 18px;font-size:16px;outline:none}
.cmdk .res{max-height:50vh;overflow:auto}
.cmdk .res button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 18px;text-align:left}
.cmdk .res button:hover,.cmdk .res button.on{background:var(--silver)}

/* ===================== RESPONSIVE ===================== */
@media (max-width:1280px){ .app{grid-template-columns:var(--sidebar-w) 1fr 0} .app .notes{display:none} .notes-toggle{display:inline-flex} .app.notes-open .notes{display:block;position:fixed;right:0;top:0;bottom:0;width:min(360px,100vw);z-index:45;box-shadow:var(--shadow-sheet)} }
@media (max-width:900px){
  body{overflow:auto}
  .app{display:block;height:auto}
  .side{position:sticky;top:0;z-index:30;border-right:0;border-bottom:1px solid var(--hair)}
  .side nav{display:flex;overflow-x:auto;padding:6px 8px;gap:2px}
  .side .grp,.side .locked,.side .me{display:none}
  .side .it{width:auto;white-space:nowrap;flex:none}
  .side .brand{height:48px}
  .top{height:auto;flex-wrap:wrap;padding:10px 16px}
  .top .srch{display:none}
  .view{overflow:visible}
  .scr{padding:16px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .grid>*,.card,.kpi{min-width:0;max-width:100%}
  .card .cb{overflow-x:auto}
  .card .ch{flex-wrap:wrap}
  .card .ch .r{margin-left:0;flex-wrap:wrap}
  .seg{flex-wrap:wrap;max-width:100%}
  .scr-h .acts{margin-left:0}
  .scr-h>*{min-width:0}
  .scr-h h1{font-size:28px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><b>Floritta</b><span>CRM · People</span></div>
    <nav id="nav"></nav>
    <div class="me"><span class="av s" id="me-av">EM</span><div><b id="me-name" style="font-weight:500">Eva Marin</b><small id="me-role">People Partner · HR</small></div></div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="crumb" id="crumb"></div>
      <div class="srch" id="srch-open"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Поиск людей, заметок, 1:1</span><kbd>⌘K</kbd></div>
      <a class="btn s" href="concept.html" title="Ресёрч, каталог функций, доступы, дорожная карта">Концепция</a>
      <div class="roles" id="roles" title="Посмотреть ту же CRM глазами другой роли">
        <button data-r="hr" class="on">HR</button><button data-r="admin">Админ</button><button data-r="employee">Сотрудник</button>
      </div>
      <button class="ib" id="bell" title="Уведомления"><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="dot"></span></button>
      <button class="ib" id="notes-btn" title="Пояснения к экрану"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M14 4v5h5M8 13h8M8 17h5"/></svg></button>
    </header>
    <div class="view" id="view"></div>
  </main>
  <aside class="notes" id="notes"><div class="nh"><b>Пояснения к экрану</b><button class="btn s ghost" id="notes-close">Скрыть</button></div><div class="nb" id="notes-body"></div></aside>
</div>
<button class="notes-toggle" id="notes-show"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M14 4v5h5M8 13h8"/></svg>Пояснения</button>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet"><div class="sh"><h2 id="sheet-t"></h2><button class="btn s ghost x" id="sheet-x">Закрыть</button></div><div class="sb" id="sheet-b"></div><div class="sf" id="sheet-f"></div></aside>
<div class="modal" id="modal"><div class="mh" id="modal-t"></div><div class="mb" id="modal-b"></div><div class="mf" id="modal-f"></div></div>
<div class="cmdk" id="cmdk"><input id="cmdk-in" placeholder="Поиск людей и экранов…" autocomplete="off"><div class="res" id="cmdk-res"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== ICONS ===================== */

/* ===================== HELPERS ===================== */

 av:(p,size='')=>`<span class="av ${size}" title="${p.name}">${initials(p.name)}</span>`,
 who:(p,sub)=>`<div class="pr-line">${H.av(p)}<div class="who"><b>${p.name}</b><small>${sub??(p.role+(D.teams[p.team]?' · '+D.teams[p.team]:''))}</small></div></div>`,
 type:(p)=>D.types[p.type]||p.type,
 skillNames:{design:'Дизайн букета',wedding:'Свадьбы и инсталляции',speed:'Скорость и стандарты',care:'Общение с клиентом',coach:'Наставничество'},
 chip:(t,k='')=>`<span class="chip ${k}">${t}</span>`,
 bar:(pct,k='')=>`<div class="bar ${k}"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`,
 spark:(vals,{w=88,h=26,min=0,max=10,color='var(--ink)'}={})=>{ if(!vals||!vals.length) return ''; const st=w/(vals.length-1||1); const y=v=>h-2-((v-min)/(max-min))*(h-4); const pts=vals.map((v,i)=>`${(i*st).toFixed(1)},${y(v).toFixed(1)}`).join(' '); const last=vals[vals.length-1]; return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/><circle cx="${((vals.length-1)*st).toFixed(1)}" cy="${y(last).toFixed(1)}" r="2.5" fill="${color}"/></svg>`},
 pulseColor:(v)=>v>=7.5?'var(--v-good)':v>=6?'var(--v-mid)':'var(--v-bad)',
 vis:(k)=>({priv:`<span class="vis priv">${ic('lock')}Только я</span>`,hr:`<span class="vis hr">${ic('shield')}HR + основатель</span>`,mgr:`<span class="vis mgr">${ic('users')}+ руководитель</span>`,shared:`<span class="vis shared">${ic('eye')}Видит сотрудник</span>`})[k]||'',
 sig:(s)=>`<span class="chip ${s.lvl==='bad'?'bad':s.lvl==='warn'?'warn':'info'}">${ic(s.lvl==='info'?'flag':'alert')}${s.t}</span>`,
 esc:(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]),
 lvl:(p)=>D.ladders[p.ladder].levels[p.lvl-1]||'',
 tenure:(p)=>{const m=Math.round(daysBetween(dd(p.start),NOW)/30.4);return m<12?m+' мес':(Math.floor(m/12)+' г '+(m%12?m%12+' мес':''))},
 statusChip:(p)=>p.status==='probation'?H.chip('Испытательный','info'):p.status==='leave'?H.chip('В отпуске','line'):p.status==='onboarding'?H.chip('Онбординг','info'):H.chip('Работает','ok'),
 aiLabel:()=>`<span class="ai-tag">${ic('spark')}Черновик AI – проверьте перед использованием</span>`

/* ===================== APP RUNTIME ===================== */
const App={
 screens:{}, order:[], cur:null, params:{}, role:'hr',
 reg(id,def){this.screens[id]=def; if(!this.order.includes(id)) this.order.push(id)},
 nav:[
  {g:'Люди'},
  {id:'home',t:'HR-центр',i:'home'},
  {id:'people',t:'Люди',i:'users'},
  {id:'oneonones',t:'1:1',i:'chat',b:3},
  {id:'growth',t:'Развитие',i:'sprout'},
  {id:'reviews',t:'Ревью',i:'clip'},
  {id:'pulse',t:'Пульс и признание',i:'heart'},
  {id:'lifecycle',t:'Онбординг и даты',i:'cal'},
  {g:'Аналитика'},
  {id:'analytics',t:'Аналитика людей',i:'chart'},
  {id:'askhr',t:'Спроси у CRM · HR',i:'spark'},
  {g:'Контроль'},
  {id:'access',t:'Доступы и журнал',i:'shield'},
  {id:'employee',t:'Приложение сотрудника',i:'phone',ro:'превью'}
 ],
 renderNav(){
  const el=document.getElementById('nav'); let h='';
  const role=this.role;
  for(const n of this.nav){
   if(n.g){h+=`<div class="grp">${n.g}</div>`;continue}
   if(role==='employee' && !['employee'].includes(n.id)) continue;
   if(!this.screens[n.id]) continue;
   h+=`<button class="it ${this.cur===n.id?'on':''}" data-go="${n.id}">${ic(n.i)}<span>${n.t}</span>${n.b?`<span class="b">${n.b}</span>`:''}${n.ro?`<span class="ro">${n.ro}</span>`:''}</button>`;
  }
  if(role==='hr'){
   h+=`<div class="locked"><div class="eyebrow" style="margin-bottom:6px">Нет в роли HR</div>${['Kassa и финансы','Расчёты, ставки, бонусы','Аналитика продаж','Клиенты и заказы'].map(x=>`<div class="lk">${ic('lock')}<span>${x}</span></div>`).join('')}<p>HR видит людей и рабочие сигналы, но не деньги. Запрет на сервере, не только в меню.</p></div>`;
  }
  if(role==='admin'){
   h+=`<div class="grp">Только админ</div>${['Kassa','Расчёты','Бонус флористов'].map(x=>`<button class="it" data-toast="${x} – раздел админа, этот проект его не меняет">${ic('coin')}<span>${x}</span></button>`).join('')}`;
  }
  el.innerHTML=h;
 },
 go(id,params={},push=true){
  if(!this.screens[id]) id='home';
  if(this.role==='employee') id='employee';
  this.cur=id; this.params=params;
  const s=this.screens[id];
  const v=document.getElementById('view'); v.scrollTop=0;
  v.innerHTML=`<div class="scr" id="s-${id}"></div>`;
  try{ s.render(document.getElementById('s-'+id),params) }catch(e){ console.error(e); v.innerHTML=`<div class="scr"><div class="callout">Ошибка экрана: ${H.esc(e.message)}</div></div>` }
  document.getElementById('crumb').innerHTML=`Люди <span style="margin:0 6px">/</span> <b>${s.crumb?s.crumb(params):s.title}</b>`;
  document.getElementById('notes-body').innerHTML=typeof s.notes==='function'?s.notes(params):(s.notes||'<p class="muted">—</p>');
  this.renderNav();
  if(push){const hs='#'+id+(params.id?'/'+params.id:'')+(params.tab?'/'+params.tab:''); if(location.hash!==hs) history.pushState(null,'',hs)}
 },
 fromHash(){const [id,pid,tab]=location.hash.replace('#','').split('/'); this.go(id||'home',{id:pid,tab},false)},
 toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.remove('on'),2400)},
 sheet(title,body,foot=''){document.getElementById('sheet-t').textContent=title;document.getElementById('sheet-b').innerHTML=body;document.getElementById('sheet-f').innerHTML=foot||'<button class="btn" data-close>Закрыть</button>';document.getElementById('sheet-f').style.display='flex';requestAnimationFrame(()=>{document.getElementById('sheet').classList.add('on');document.getElementById('scrim').classList.add('on')})},
 modal(title,body,foot=''){document.getElementById('modal-t').textContent=title;document.getElementById('modal-b').innerHTML=body;document.getElementById('modal-f').innerHTML=foot||'<button class="btn" data-close>Закрыть</button>';document.getElementById('modal').classList.add('on');document.getElementById('scrim').classList.add('on')},
 close(){['sheet','modal','scrim','cmdk'].forEach(i=>document.getElementById(i).classList.remove('on'))},
 setRole(r){this.role=r;document.querySelectorAll('#roles button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));
  const me={hr:['Eva Marin','People Partner · HR','EM'],admin:['Основатель','Админ · полный доступ','ОС'],employee:['Daria Lis','Флорист · только свои данные','DL']}[r];
  document.getElementById('me-name').textContent=me[0];document.getElementById('me-role').textContent=me[1];document.getElementById('me-av').textContent=me[2];
  this.go(r==='employee'?'employee':(this.cur&&this.cur!=='employee'?this.cur:'home'),r==='employee'?{}:this.params);
  this.toast(r==='hr'?'Вы смотрите как HR – без финансов':r==='admin'?'Вы смотрите как админ – видно всё, кроме личных заметок HR':'Вы смотрите как сотрудник – только свой профиль')},
 cmdk(){const c=document.getElementById('cmdk');c.classList.add('on');document.getElementById('scrim').classList.add('on');const i=document.getElementById('cmdk-in');i.value='';this.cmdkList('');setTimeout(()=>i.focus(),20)},
 cmdkList(q){q=q.toLowerCase();const items=[...D.people.map(p=>({t:p.name,s:p.role,go:['person',{id:p.id}],a:H.av(p,'s')})),...this.nav.filter(n=>n.id&&this.screens[n.id]).map(n=>({t:n.t,s:'Экран',go:[n.id,{}],a:ic(n.i)}))].filter(x=>!q||x.t.toLowerCase().includes(q)||x.s.toLowerCase().includes(q)).slice(0,12);
  document.getElementById('cmdk-res').innerHTML=items.map((x,i)=>`<button class="${i?'':'on'}" data-cgo='${JSON.stringify(x.go)}'>${x.a}<span>${x.t}</span><span class="muted sm" style="margin-left:auto">${x.s}</span></button>`).join('')||'<div class="empty">Ничего не найдено</div>'}
};

/* global delegation */
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]'); if(g){e.preventDefault();App.close();App.go(g.dataset.go,g.dataset.id?{id:g.dataset.id,tab:g.dataset.tab}:{});return}
 const pg=e.target.closest('[data-person]'); if(pg){e.preventDefault();App.close();App.go('person',{id:pg.dataset.person,tab:pg.dataset.tab});return}
 const t=e.target.closest('[data-toast]'); if(t){App.toast(t.dataset.toast);return}
 const c=e.target.closest('[data-cgo]'); if(c){const [id,p]=JSON.parse(c.dataset.cgo);App.close();App.go(id,p);return}
 if(e.target.closest('[data-close]')||e.target.id==='scrim'||e.target.closest('#sheet-x')){App.close();return}
 const r=e.target.closest('#roles button'); if(r){App.setRole(r.dataset.r);return}
 if(e.target.closest('#srch-open')){App.cmdk();return}
 if(e.target.closest('#bell')){App.sheet('Уведомления',[
   ['alert','Nika Fedorova – пульс упал до 4/10','2 ч назад','nika'],
   ['clip','Alina Moroz – ревью испытательного срока через 12 дней','сегодня','alina'],
   ['chat','Artem Gromov добавил тему в ваш 1:1: «Переключения контекста»','вчера','artem'],
   ['star','Polina Sokol получила 3 благодарности за неделю','вчера','polina'],
   ['file','Ruslan Tairov – проверка прав до 2 дек','2 дня назад','ruslan']
  ].map(([i,t,w,p])=>`<button class="row" data-person="${p}" style="width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--hair)">${ic(i)}<span style="flex:1">${t}</span><span class="muted sm">${w}</span></button>`).join(''));return}
 if(e.target.closest('#notes-btn')||e.target.closest('#notes-show')){const a=document.getElementById('app'); if(window.innerWidth<=1280){a.classList.toggle('notes-open')} else a.classList.toggle('no-notes');return}
 if(e.target.closest('#notes-close')){const a=document.getElementById('app'); a.classList.remove('notes-open'); if(window.innerWidth>1280) a.classList.add('no-notes');return}
});
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();App.cmdk()}
 if(e.key==='Escape')App.close();
 if(e.key==='Enter'&&document.getElementById('cmdk').classList.contains('on')){const b=document.querySelector('#cmdk-res button');if(b)b.click()}
});
document.addEventListener('input',e=>{if(e.target.id==='cmdk-in')App.cmdkList(e.target.value)});
window.addEventListener('popstate',()=>App.fromHash());
</script>

<script>
/* Shared helpers for my three screens (home, people, person). Unique global name. */
window.HRP=(()=>{
 const SEV={bad:3,warn:2,info:1};
 const MALE=['ruslan','jake','bogdan','artem','denis'];
 const myKudos=[];
 const R={
  SEV,
  me:()=>App.role==='admin'?'founder':'eva',
  name:(id)=>id==='eva'?'Eva Marin':id==='founder'?'Основатель':(P(id)?P(id).name:String(id)),
  first:(id)=>R.name(id).split(' ')[0],
  avS:(id)=>P(id)?H.av(P(id),'s'):`<span class="av s">${id==='eva'?'EM':'ОС'}</span>`,
  g:(p,m,f)=>MALE.includes(p.id)?m:f,
  kudos:()=>[...myKudos,...D.kudos].sort((a,b)=>b.d.localeCompare(a.d)),
  cats:['Наблюдение','1:1','Развитие','Работа','Похвала','Риск','Благополучие','Онбординг'],
  VIS:{priv:['Только я','Черновик мыслей. Не видит никто, даже основатель'],hr:['HR + основатель','Риски и личные обстоятельства'],mgr:['+ руководитель','Рабочие договорённости, которые нужны руководителю'],shared:['Видит сотрудник','Итоги 1:1, похвала, общие договорённости']},
  canRead:(n)=>!(n.vis==='priv'&&n.by!==R.me()),
  sev:(p)=>p.signals.reduce((m,s)=>Math.max(m,SEV[s.lvl]||0),0)*10+p.signals.length,
  attn:(p)=>p.signals.some(s=>s.lvl!=='info'),
  nextOne:(pid)=>D.ones.filter(o=>o.who===pid&&o.status!=='done').sort((a,b)=>(a.d+a.time).localeCompare(b.d+b.time))[0],
  rule(s){const t=s.t;
   if(/Пульс/.test(t)) return ['пульс упал на 3+ пункта за 4–6 недель против своей нормы','еженедельный пульс'];
   if(/Переработка/.test(t)) return ['часы сверх плана 3 недели подряд','клок-ин против графика смен'];
   if(/Нет 1:1/.test(t)) return ['нет 1:1 дольше 30 дней','история 1:1'];
   if(/Вовремя/.test(t)) return ['доля доставок в слот на 5+ пунктов ниже команды за 4 недели','доставки и оценки рейсов'];
   if(/плана развития/.test(t)) return ['нет активного плана развития','планы развития'];
   if(/переключений/.test(t)) return ['одна и та же тема в 2 из 3 последних 1:1','повестки 1:1'];
   if(/испытательного/.test(t)) return ['до конца испытательного срока меньше 14 дней','даты найма'];
   if(/Проверка прав/.test(t)) return ['документ истекает в ближайшие 30 дней','документы курьеров'];
   if(/день 45/.test(t)) return ['контрольная точка онбординга: 30, 45 и 90 дней','план онбординга'];
   return ['правило HR','данные CRM'];
  },
  recs(p){const h=[...p.id].reduce((a,c)=>a+c.charCodeAt(0),0);
   const r={studio:[['Смена','10 нояб, утро'],['Смена','7 нояб, вечер'],['Проблема с букетом','#48'+(100+h%800)]],
    delivery:[['Смена курьера','10 нояб'],['Разбор рейса','9 нояб'],['Доставка','#48'+(100+h%800)]],
    shop:[['Смена','10 нояб'],['Жалоба клиента','#48'+(100+h%800)],['Задача','T-'+(2100+h%90)]],
    tech:[['Задача','T-'+(2200+h%90)],['Задача','T-'+(2150+h%90)],['Релиз','11 нояб']]}[p.team].slice();
   if(p.id==='nika') r[2]=['Проблема с букетом','#48213'];
   return r.map(([k,ref])=>({k,ref}));
  },
  visRadios(sel,name){return ['priv','hr','mgr','shared'].map(k=>`<label class="${k===sel?'on':''}" data-v="${k}"><input type="radio" name="${name}" value="${k}" ${k===sel?'checked':''}><span>${H.vis(k)}<small>${R.VIS[k][1]}</small></span></label>`).join('')},
  wireVis(box,catSel,hint){
   const sync=()=>{const sens=catSel&&catSel.value==='Благополучие';
    box.querySelectorAll('label').forEach(l=>{const k=l.dataset.v,inp=l.querySelector('input'),dis=sens&&(k==='mgr'||k==='shared');inp.disabled=dis;l.classList.toggle('dis',dis);if(dis&&inp.checked){box.querySelector('input[value="hr"]').checked=true}});
    box.querySelectorAll('label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));
    if(hint){hint.textContent=sens?'Здоровье и личные обстоятельства – особая категория данных (UK GDPR): не шире «HR + основатель».':'';hint.classList.toggle('warn',sens)}};
   box.addEventListener('change',sync); if(catSel) catSel.addEventListener('change',sync); sync();
  },
  copy(text,ok){try{navigator.clipboard.writeText(text).then(()=>App.toast(ok||'Скопировано'),()=>App.toast('Буфер обмена недоступен – выделите текст вручную'))}catch(e){App.toast('Буфер обмена недоступен – выделите текст вручную')}},
  noteSheet(pid,onSave){
   const opts=D.people.map(p=>`<option value="${p.id}"${p.id===pid?' selected':''}>${p.name} – ${p.role}</option>`).join('');

    <div class="hrp-f"><label class="f">Текст</label><textarea class="ta" id="hrp-t" rows="5" placeholder="Факты и договорённости. Без диагнозов и оценок личности."></textarea></div>
    <div class="hrp-f"><label class="f">Привязать к записи CRM · необязательно</label><select class="sel" id="hrp-link"></select><div class="hrp-hint">Смена, проблема с букетом или задача – контекст, которого нет в отдельных HR-системах. Суммы заказов HR не видит.</div></div>
    ${App.role==='admin'?'<div class="callout info sm">Вы пишете как основатель. Заметку «Только я» не увидит даже HR.</div>':''}
   </div>`,`<button class="btn" data-close>Отмена</button><button class="btn pr" id="hrp-save">${ic('check')}Сохранить</button>`);
   const who=document.getElementById('hrp-who'),link=document.getElementById('hrp-link');

   who.addEventListener('change',fill); fill();
   R.wireVis(document.getElementById('hrp-vis'),document.getElementById('hrp-cat'),document.getElementById('hrp-hint'));
   document.getElementById('hrp-save').addEventListener('click',()=>{

  },
  kudosSheet(pid,onSave){

   App.sheet('Благодарность',`<div>

    <div class="hrp-f"><label class="f">За что</label><textarea class="ta" id="hrp-kt" rows="4" placeholder="Конкретный поступок: что сделал(а) и почему это важно"></textarea></div>

   const kv=document.getElementById('hrp-kv');
   kv.addEventListener('change',()=>kv.querySelectorAll('label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked)));

 };
 return R;
})();

    <div class="card"><div class="ch"><h3>Ближайшие даты</h3><div class="r">${H.chip('доработать','warn')}<button class="btn s ghost" data-go="lifecycle">Календарь ${ic('arrow')}</button></div></div>
     ${D.events.map(evRow).join('')}</div>
   </div>

   <div class="grid g2 hm-sec">
    <div class="card"><div class="ch"><h3>Пульс по командам</h3><div class="r"><button class="btn s ghost" data-go="pulse">Подробнее ${ic('arrow')}</button></div></div>
     ${TEAMS.map(ptRow).join('')}
     <div class="hm-cap">${ic('eye')}<span>Команду показываем, только если ответили 5+ человек. Ответы анонимны – HR не видит, кто что ответил.</span></div></div>
    <div class="card"><div class="ch"><h3>Свежие благодарности</h3><div class="r">${H.chip('уже есть в CRM','ok')}<button class="btn s" data-a="kudos">${ic('heart')}Сказать спасибо</button></div></div>
     ${HRP.kudos().slice(0,6).map(kRow).join('')}
     <div class="hm-cap">${ic('star')}<span>Благодарности уже живут в мотивации сотрудников. Здесь – только слова и ценности, без баллов и наград.</span></div></div>
   </div>`;
  };
  el.onclick=(ev)=>{
   const b=ev.target.closest('[data-a]'); if(!b||!el.contains(b)) return;
   const a=b.dataset.a, p=b.dataset.p&&P(b.dataset.p);
   if(a==='note') HRP.noteSheet(null);
   else if(a==='weekly') weekly();
   else if(a==='kudos') HRP.kudosSheet(null,draw);
   else if(a==='one'){const o=HRP.nextOne(p.id); App.go('oneonones',o?{id:o.id}:{}); App.toast(o?`У ${p.name.split(' ')[0]} уже есть 1:1 ${fmtD(o.d)} – открыла подготовку`:`Назначьте 1:1 с ${p.name.split(' ')[0]}`)}
   else if(a==='done'){HM.dismissed.add(p.id); draw(); App.toast(`${p.name} – сигнал разобран, отметка в журнале`)}
   else if(a==='more'){HM.more=!HM.more; draw()}
   else if(a==='prep') App.go('oneonones',{id:b.dataset.o});
   else if(a==='card') cardModal(D.events[+b.dataset.i]);
   else if(a==='rem'){const e=D.events[+b.dataset.i],d=dd(e.d);d.setUTCDate(d.getUTCDate()-14);HM.rem[b.dataset.i]=1;draw();App.toast(`Напоминание: задача Irina на ${fmtD(d.toISOString().slice(0,10))} – «${e.t}», ${P(e.who).name}`)}
   else if(a==='unrem'){delete HM.rem[b.dataset.i];draw();App.toast('Напоминание снято')}
  };
  draw();
 },
 notes:`<h4>Что это</h4><p>Стартовый экран People Partner: кому нужно внимание, ближайшие 1:1, кадровые даты, пульс команд и свежие благодарности. Денег здесь нет.</p>
<h4>Зачем HR</h4><p>За 5 минут понять, с кем поговорить сегодня, и раз в неделю отправить основателю короткую сводку по людям.</p>
<h4>Откуда идея</h4><p><span class="src">Lattice</span><span class="src">Culture Amp</span><span class="src">15Five</span><span class="src">Bitrix24</span></p>
<ul><li>Lattice – на главной ближайшие 1:1 и бриф перед встречей.</li><li>Culture Amp – 1–3 названных сигнала вместо балла «риска ухода»: на 25 людях модель не обучить.</li><li>Bitrix24 – виджет дней рождения и благодарностей.</li></ul>
<h4>Данные из нашей CRM</h4><ul><li>eNPS – уже есть в «Мотивации», раз в квартал; еженедельного пульса по командам пока нет.</li><li>Переработка – клок-ин против графика смен; опоздания сейчас не считаются, хотя план и факт есть.</li><li>1:1 – сейчас только даты, создать встречу из интерфейса нельзя.</li><li>Дни рождения и годовщины – уже есть («Дни заботы»); права и право на работу – в карточке курьера.</li><li>Благодарности – мотивация сотрудников (благодарности коллег и признание от руководителя).</li></ul>
<h4>Приоритет</h4><p><span class="pri p1">MVP</span>внимание, 1:1, даты</p><p><span class="pri p2">Следующий шаг</span>пульс по командам, сводка основателю с AI</p>
<h4>Доступы</h4><p>Сигналы видят HR и основатель. AI-сводка – только черновик: без денег, здоровья и оценок личности; отправляет человек.</p>`
});
})();
</script>

</style>
<script>
(()=>{
const S={team:'all',q:'',attn:false,view:'table',sort:'sig',dir:-1};
const TEAMS=[['all','Все'],['studio','Студия'],['delivery','Доставка'],['shop','Магазин и сервис'],['tech','Продукт и разработка']];
const VIEWS=[['table','Таблица'],['cards','Карточки'],['tree','Структура']];
const days=p=>daysBetween(dd(p.last),NOW);
const lastP=p=>p.pulse[p.pulse.length-1];
const sevCls=p=>{const m=Math.floor(HRP.sev(p)/10);return m>=3?'bad':m===2?'warn':m===1?'info':''};
const KEY={name:p=>p.name,team:p=>D.teams[p.team],tenure:p=>daysBetween(dd(p.start),NOW),last:p=>days(p),pulse:p=>lastP(p),pdp:p=>p.pdp.pct,train:p=>p.train[0]/p.train[1],sig:p=>HRP.sev(p)};
const match=p=>{const q=S.q.trim().toLowerCase();return (S.team==='all'||p.team===S.team)&&(!S.attn||HRP.attn(p))&&(!q||[p.name,p.role,D.teams[p.team],H.type(p),...p.tags].join(' ').toLowerCase().includes(q))};
const list=()=>D.people.filter(match).sort((a,b)=>{const x=KEY[S.sort](a),y=KEY[S.sort](b);return ((x>y)-(x<y))*S.dir||a.name.localeCompare(b.name)});
const pulseCell=p=>{const v=lastP(p),c=H.pulseColor(v);return `<span class="pp-pl">${H.spark(p.pulse,{w:46,h:20,color:c})}<b style="color:${c}">${v}</b></span>`};
const lastCell=p=>{const n=days(p);return `${n>30?H.chip(ago(p.last),'warn'):ago(p.last)}<br><small>след. ${fmtD(p.next)}</small>`};
const sigCell=p=>p.signals.length?`<span class="chip ${sevCls(p)}" title="${H.esc(p.signals.map(s=>s.t).join(' · '))}">${ic(sevCls(p)==='info'?'flag':'alert')}${p.signals.length}</span>`:'<span class="muted">—</span>';
const pdpCell=p=>p.pdp.goal==='—'?'<span class="chip warn">нет плана</span>':`<div title="${H.esc(p.pdp.goal)}" style="min-width:80px">${H.bar(p.pdp.pct,p.pdp.pct<25?'ac':'')}<small>${p.pdp.pct} %</small></div>`;
const trainCell=p=>`<div style="min-width:64px">${H.bar(p.train[0]/p.train[1]*100,p.train[0]===p.train[1]?'ok':'')}<small>${p.train[0]} из ${p.train[1]}</small></div>`;
const subLine=p=>p.role+(p.status!=='active'?' · '+({probation:'испытательный',leave:'в отпуске до '+(p.leaveTo?fmtD(p.leaveTo):''),onboarding:'онбординг'})[p.status]:'');

const COLS=[['name','Человек'],['team','Команда'],[null,'Контур'],[null,'Уровень'],['tenure','Стаж'],['last','Последний 1:1'],['pulse','Пульс'],['pdp','План развития'],['train','Обучение'],['sig','Сигналы']];
const table=rows=>`<div class="card"><div class="pp-wrap"><table class="t"><thead><tr>${COLS.map(([k,t])=>k?`<th class="srt ${S.sort===k?'on':''}" data-s="${k}">${t}${S.sort===k?(S.dir>0?' ↑':' ↓'):''}</th>`:`<th>${t}</th>`).join('')}</tr></thead><tbody>
 ${rows.map(p=>`<tr class="clk" data-person="${p.id}"><td>${H.who(p,subLine(p))}</td><td><span class="pp-tm">${ic(TEAM_IC[p.team])}${D.teams[p.team]}</span></td><td class="ct">${H.type(p)}</td><td class="lv">${H.lvl(p)}</td><td style="white-space:nowrap">${H.tenure(p)}</td><td style="white-space:nowrap">${lastCell(p)}</td><td>${pulseCell(p)}</td><td>${pdpCell(p)}</td><td>${trainCell(p)}</td><td>${sigCell(p)}</td></tr>`).join('')}
 </tbody></table></div></div>`;

const cards=rows=>`<div class="pp-cards">${rows.map(p=>`<div class="card pp-card" data-person="${p.id}" role="button" tabindex="0">
 <div class="row">${H.av(p,'l')}<div class="nm"><b>${p.name}</b><small>${p.role}</small><small>${H.lvl(p)}</small></div></div>
 <div class="chips">${H.statusChip(p)}${H.chip(D.teams[p.team],'line')}${H.chip(H.type(p),'line')}</div>
 <dl><dt>Стаж</dt><dd>${H.tenure(p)}</dd><dt>1:1</dt><dd>${days(p)>30?H.chip(ago(p.last),'warn'):ago(p.last)}</dd><dt>Пульс</dt><dd>${pulseCell(p)}</dd><dt>План</dt><dd>${pdpCell(p)}</dd><dt>Обучение</dt><dd>${p.train[0]} из ${p.train[1]}</dd></dl>
 ${p.signals.length?`<div class="sigs">${p.signals.map(H.sig).join('')}</div>`:''}
</div>`).join('')}</div>`;

const tree=()=>{
 const ok=new Set(D.people.filter(match).map(p=>p.id));
 const kids=id=>D.people.filter(p=>(p.mgr||null)===id);
 const node=p=>{const k=kids(p.id),n=days(p);return `<li><button class="pp-node ${ok.has(p.id)?'':'dim'}" data-person="${p.id}">${H.av(p,'s')}<span class="nm"><b>${p.name}</b><small>${p.role}</small></span><span class="meta">${n>30?H.chip('1:1 '+n+' дн.','warn'):'1:1 '+n+' дн.'}${p.signals.length?`<span class="dotc" style="background:var(--${sevCls(p)==='bad'?'accent':sevCls(p)==='warn'?'v-mid':'info'})" title="${H.esc(p.signals.map(s=>s.t).join(' · '))}"></span>`:''}</span></button>${k.length?`<ul>${k.map(node).join('')}</ul>`:''}</li>`};
 return `<div class="card"><div class="pp-tree"><button class="pp-node root" data-a="root"><span class="av s">ОС</span><span class="nm"><b>Основатель</b><small>Админ · вне охвата HR</small></span></button><ul>${kids(null).map(node).join('')}</ul></div>
 <div class="pp-leg"><span>${ic('chat')}дни с последнего 1:1 (жёлтое – больше 30)</span><span><i class="dotc" style="background:var(--accent)"></i>сильный сигнал</span><span><i class="dotc" style="background:var(--v-mid)"></i>сигнал</span><span><i class="dotc" style="background:var(--info)"></i>для сведения</span><span>Разработка и удалённые подрядчики подчиняются основателю напрямую. Фильтры приглушают, а не прячут.</span></div></div>`;
};

App.reg('people',{
 title:'Люди',
 render(el){
  const res=()=>{const rows=list(),box=el.querySelector('.pp-res');
   el.querySelector('.pp-cnt').textContent=`${rows.length} из ${D.people.length}`;
   box.innerHTML=S.view==='tree'?tree():rows.length?(S.view==='cards'?cards(rows):table(rows)):`<div class="card pp-empty">Никого не нашли по этим фильтрам.<div style="margin-top:10px"><button class="btn s" data-a="reset">Сбросить фильтры</button></div></div>`};
  const draw=()=>{
   const N=D.people.length, remote=D.people.filter(p=>p.att.shifts===null).length, old=D.people.filter(p=>days(p)>30).length, attn=D.people.filter(HRP.attn).length;
   const cnt=k=>k==='all'?N:D.people.filter(p=>p.team===k).length;
   el.innerHTML=`
   <div class="scr-h"><div><div class="eyebrow">Команда</div><h1>Люди</h1><div class="sub">${N} человек · 4 команды · удалённо ${remote} · без 1:1 больше 30 дней: ${old} · требуют внимания: ${attn}</div></div>
    <div class="acts"><button class="btn" data-a="export">${ic('file')}Экспорт без денег</button><button class="btn pr" data-a="note">${ic('note')}Новая заметка</button></div></div>
   <div class="callout info pp-call">${H.chip('доработать','warn')}<span class="tx">Тир и ставка убраны из экрана для роли HR – остаются в «Расчётах» у админа. Поля не приходят с сервера вовсе, а не прячутся в браузере.</span>${App.role==='admin'?`<button class="btn s" data-a="pay">${ic('coin')}Открыть «Расчёты»</button>`:''}</div>
   <div class="pp-ctl">
    <div class="seg">${TEAMS.map(([k,t])=>`<button class="${S.team===k?'on':''}" data-team="${k}">${t}<span class="n">${cnt(k)}</span></button>`).join('')}</div>
    <input class="inp pp-q" type="search" placeholder="Поиск: имя, роль, тег" value="${H.esc(S.q)}">
    <label class="pp-tg ${S.attn?'on':''}"><input type="checkbox" class="pp-attn" ${S.attn?'checked':''}>Только требующие внимания</label>
    <span class="sp"></span><span class="muted sm pp-cnt"></span>
    <div class="seg">${VIEWS.map(([k,t])=>`<button class="${S.view===k?'on':''}" data-view="${k}">${t}</button>`).join('')}</div>
   </div>
   <div class="pp-res"></div>`;
   el.querySelector('.pp-q').addEventListener('input',e=>{S.q=e.target.value;res()});
   el.querySelector('.pp-attn').addEventListener('change',e=>{S.attn=e.target.checked;draw()});
   res();
  };
  el.onclick=(e)=>{
   const t=e.target.closest('[data-team],[data-view],[data-s],[data-a]'); if(!t||!el.contains(t)) return;
   if(t.dataset.team){S.team=t.dataset.team;draw()}
   else if(t.dataset.view){S.view=t.dataset.view;draw()}
   else if(t.dataset.s){const k=t.dataset.s;if(S.sort===k)S.dir=-S.dir;else{S.sort=k;S.dir=(k==='name'||k==='team')?1:-1}res()}
   else if(t.dataset.a==='reset'){Object.assign(S,{team:'all',q:'',attn:false});draw()}
   else if(t.dataset.a==='note') HRP.noteSheet(null,()=>res());
   else if(t.dataset.a==='export') App.toast(`Выгрузка готова: ${list().length} строк – люди, команды, 1:1, планы, обучение. Без тира, ставок и реквизитов`);
   else if(t.dataset.a==='pay') App.toast('«Расчёты» – раздел админа, этот проект его не меняет');
   else if(t.dataset.a==='root') App.toast('Основатель – админ: в охват HR не входит, его карточку HR не ведёт');
  };
  el.onkeydown=(e)=>{if(e.key==='Enter'&&e.target.classList.contains('pp-card'))e.target.click()};
  draw();
 },
 notes:`<h4>Что это</h4><p>Экран «Команда → Люди», переделанный для HR: вместо тира и ставки – 1:1, пульс, план развития, обучение и сигналы. Три вида: таблица, карточки, структура.</p>
<h4>Зачем HR</h4><p>Один список, чтобы видеть, у кого давно не было 1:1, у кого падает пульс и кто застрял в плане развития.</p>
<h4>Откуда идея</h4><p><span class="src">BambooHR</span><span class="src">HiBob</span><span class="src">ChartHop</span><span class="src">Personio</span></p><p>Справочник плюс оргструктура. На оргструктуре – один слой: дни с последнего 1:1 и открытый сигнал. Поля разбиты по категориям доступа: деньги – отдельная категория, которую HR не выдают.</p>
<h4>Данные из нашей CRM</h4><ul><li>Сейчас «Люди» видит только админ, и на строке – тир и личная ставка.</li><li>Уже есть: контур, форма занятости, стаж, матрица навыков, обучение, планы развития.</li><li>Новое: пульс, история 1:1, сигналы, поле «руководитель». Разработчики и подрядчики сейчас не заведены как люди – нужна карточка без логина.</li></ul>
<h4>Приоритет</h4><p><span class="pri p1">MVP</span>таблица, фильтры, без денег</p><p><span class="pri p2">Следующий шаг</span>карточки и структура</p>
<h4>Доступы</h4><p>HR видит всех, кроме админов-основателей. Денежные поля вырезаются на сервере: запрет плюс автотест, а не скрытая колонка.</p>`
});
})();
</script>

<style>

<script>
(()=>{
const S={cat:'all',form:false,tl:false,ms:{},ci:{},added:{}};
const TABS=[['overview','Обзор'],['ones','1:1'],['growth','Развитие'],['notes','Заметки'],['kudos','Признание'],['skills','Навыки и обучение'],['work','Работа'],['docs','Документы и даты']];
const hs=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%997,7);
const fy=s=>fmtD(s)+(s.slice(0,4)!=='2026'?' '+s.slice(0,4):'');
const addM=(s,m)=>{const d=dd(s);d.setUTCMonth(d.getUTCMonth()+m);return d.toISOString().slice(0,10)};
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
const num=v=>String(v).replace('.',',');
const first=p=>p.name.split(' ')[0];
const card=(title,body,o={})=>`<div class="card ${o.cls||''}"><div class="ch"><h3>${title}</h3>${o.r?`<div class="r">${o.r}</div>`:''}</div>${body}${o.cap?`<div class="ps-cap">${ic(o.ci||'eye')}<span>${o.cap}</span></div>`:''}</div>`;
const linkChip=l=>`<button class="chip line ps-link" data-a="link" data-k="${H.esc(l.k)}" data-r="${H.esc(l.ref)}">${ic('link')}${H.esc(l.k)} ${H.esc(l.ref)}</button>`;
const sortedOnes=p=>D.ones.filter(o=>o.who===p.id).sort((a,b)=>b.d.localeCompare(a.d));
const notesOf=p=>D.notes.filter(n=>n.who===p.id).sort((a,b)=>b.d.localeCompare(a.d));
const BY={emp:'Сотрудник',hr:'HR',auto:'Из CRM'};
const LEVELS=['нет','с помощью','сам(а)','учит других'];

/* ---------- reference data for the prototype (fictional) ---------- */
const COURSE={florist:'Уход за срезом и вёдрами',courier:'Доставка алкоголя: Challenge 25',care:'Работа с жалобами',tech:'Безопасность данных (UK GDPR)'};
const LESSONS={florist:['Базовые стили Floritta','Уход за срезом и вёдрами','Упаковка и фото до отправки','Работа с пионами','Свадебная бутоньерка','Каскадный букет'],
 courier:['Маршруты Central','Доставка алкоголя: Challenge 25','Фото у двери и подпись','Хрупкие и крупные заказы','Безопасность на дороге','Разбор сложных адресов'],
 care:['Тон общения Floritta','Работа с жалобами','Заказы с открыткой','Срочные заказы день в день','Уход за цветами: что советовать','Защита данных клиентов'],
 tech:['Безопасность данных (UK GDPR)','Доступы и секреты','Как устроены заказы','Релизы и откат','Как работает студия','Доставка изнутри']};
const CERT={florist:[['Безопасная работа с ножом и шипами','2027-03-01'],['Токсичные и аллергенные растения','2027-01-15'],['Журнал обучения: подпись','2026-12-05']],
 courier:[['Доставка алкоголя: Challenge 25','2026-12-02'],['Безопасность на дороге','2027-04-10']],
 care:[['Работа с жалобами','2027-05-01'],['Защита данных клиентов','2027-02-01']],
 tech:[['Безопасность данных (UK GDPR)','2027-03-31'],['Доступы и секреты','2027-06-30']]};
const MS={nika:[['Записаться на курс по колористике',0],['3 авторских букета для витрины (готов 1)',0],['Показать работы на ретро студии',0]],
 daria:[['Ассистировать на 2 свадебных заказах',1],['Собрать арку под присмотром Polina',0],['Подтвердить «Свадьбы» на уровне 2 в матрице навыков',0]],
 mila:[['План мастер-класса и список материалов',1],['Пробный мастер-класс для команды',1],['Рождественский мастер-класс для клиентов – 12 дек',0]],
 alina:[['4 базовых стиля подтверждены наставником',1],['Ещё 2 стиля: пионы и каскад',0],['Ревью испытательного срока – 23 нояб',0]],
 artem:[['«Дежурный день» для срочных задач',1],['Описать границы сервиса маршрутизации – до 14 нояб',0],['Передать срочные баги дежурному',0]],

 denis:[['Доступы и знакомство с командами (день 1–14)',1],['Первый еженедельный отчёт по доставке (день 15–30)',1],['Свой дашборд для операционного утра (день 31–60)',0]]};
const EXP={florist:[null,['Собирает весь стандартный ассортимент без помощи','Переделок по гамме и упаковке – меньше 1 %','Знает уход за 30 основными сортами'],['Свадьбы и инсталляции самостоятельно','Наставляет новичка в программе «Напарник»','Авторская работа на витрину раз в месяц'],['Ведёт смену: распределяет заказы, 97 %+ отправок вовремя','Разбирает проблемы с букетами вместе с командой','Проводит ретро смены'],['Отвечает за стиль студии и сезонные коллекции','Обучает флористов, ведёт мастер-классы','Участвует в найме']],
 courier:[null,['Наставник новых курьеров','Сложные маршруты Central','97 %+ доставок вовремя 3 месяца подряд'],['Планирует маршруты на день','Разбирает проблемные доставки','Отвечает за стандарты доставки']],
 care:[null,['Сам(а) закрывает жалобы без эскалации','Ведёт инструкцию по сервису','Обучает новичков сервиса'],['Управляет магазином: график, люди, стандарты','Ведёт 1:1 с командой магазина','Отвечает за сервис по отзывам']],
 tech:[null,['Ведёт задачу от постановки до релиза сам(а)','Тесты и ревью без возвратов','Понимает процессы магазина'],['Отвечает за сервис целиком','Ревьюит чужой код, предлагает решения','Поддерживает новичков'],['Ведёт направление и планирует работу','Растит других разработчиков','Говорит с бизнесом на его языке']]};
const RM={artem:['84 %','89 %','2,4 дня'],vera:['95 %','97 %','1,1 дня'],denis:['100 %','75 %','3 дня']};
const RTW={mila:['Паспорт UK – ручная проверка','2023-03-01',null],daria:['Share code – eVisa','2024-08-12','2027-08-11'],nika:['Share code – EUSS, settled','2024-01-10',null],alina:['Share code – Graduate visa','2026-08-20','2027-06-30'],yana:['Share code – EUSS, pre-settled','2025-05-06','2026-12-21'],polina:['Паспорт UK – ручная проверка','2022-09-28',null],irina:['Паспорт UK – ручная проверка','2021-04-08',null],kira:['Share code – eVisa','2025-02-12','2027-03-15'],ruslan:['Share code – EUSS, settled','2024-10-30',null],jake:['Паспорт UK – ручная проверка','2025-08-28',null],bogdan:['Share code – EUSS, settled','2023-06-07',null]};
const LIC={ruslan:['Категория B · фургон','2026-12-02'],bogdan:['Категория B · фургон','2027-06-12'],jake:['Велосипед – права не нужны',null]};
const WEEKS=['21 сен','28 сен','5 окт','12 окт','19 окт','26 окт','2 нояб','9 нояб'];

/* ---------- small builders ---------- */
const bars=(vals,lbl,o={})=>{const w=o.w||420,h=o.h||140,plan=o.plan??null,mx=(Math.max(...vals,plan||0)||1)*1.2,n=vals.length,bw=w/n,base=h-20,y=v=>base-(v/mx)*(base-14);
 let s=`<svg class="ps-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.label||''}">`;
 vals.forEach((v,i)=>{const x=i*bw,over=plan!=null&&v>plan;s+=`<rect x="${(x+bw*.22).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw*.56).toFixed(1)}" height="${Math.max(0,base-y(v)).toFixed(1)}" style="fill:${over?'var(--v-mid)':i===n-1?'var(--ink)':'var(--v3)'}"/><text x="${(x+bw/2).toFixed(1)}" y="${h-5}" text-anchor="middle" style="fill:var(--grey);font-size:10px">${lbl[i]}</text><text x="${(x+bw/2).toFixed(1)}" y="${(y(v)-4).toFixed(1)}" text-anchor="middle" style="fill:var(--graphite);font-size:10px">${v}</text>`});
 if(plan!=null){const py=y(plan);s+=`<line x1="0" x2="${w}" y1="${py.toFixed(1)}" y2="${py.toFixed(1)}" style="stroke:var(--accent);stroke-dasharray:4 3"/><text x="2" y="${(py-4).toFixed(1)}" style="fill:var(--accent-dark);font-size:10px">план ${plan}${o.unit||''}</text>`}
 return s+'</svg>'};
const hours=p=>{const a=p.att,plan=Math.round(a.shifts/4*7),ot=a.ot||0,t=Math.floor(ot/3),tail=ot>=6?[t,t,ot-2*t]:ot>0?[0,Math.floor(ot/2),Math.ceil(ot/2)]:[0,0,0],nz=[0,-1,1,0,-1],v=[];
 for(let i=0;i<5;i++)v.push(plan+nz[(i+hs(p.id))%5]); tail.forEach(x=>v.push(plan+x)); if(a.abs)v[5]-=7*a.abs; return {plan,v}};
const strip=p=>{const a=p.att,N=28,st=Array(N).fill('off'),w=[];for(let k=0;k<a.shifts;k++){const d=Math.floor(k*N/a.shifts);st[d]='work';w.push(d)}
 for(let j=0;j<a.late;j++)st[w[Math.floor((j+.5)*w.length/a.late)]]='late';
 for(let j=0;j<a.abs;j++)st[w[Math.max(0,w.length-2-j*4)]]='abs';
 return `<div class="ps-days">${['пн','вт','ср','чт','пт','сб','вс'].map(d=>`<span class="wd">${d}</span>`).join('')}${st.map((s,i)=>`<span class="${s}" title="${s==='late'?'опоздание':s==='abs'?'пропуск':s==='work'?'смена':'выходной'}"></span>`).join('')}</div>
 <div class="ps-leg"><span><i style="background:var(--ok-bg)"></i>смена</span><span><i style="background:var(--warn-bg);border-color:var(--warn)"></i>опоздание 5+ мин</span><span><i style="background:var(--accent-bg);border-color:var(--accent)"></i>пропуск</span><span><i></i>выходной</span></div>`};

/* ---------- brief + timeline ---------- */
const openActions=p=>{const seen=new Set();return D.ones.filter(o=>o.who===p.id).flatMap(o=>o.actions.filter(a=>!a.done)).filter(a=>!seen.has(a.t)&&seen.add(a.t))};
const brief=p=>{const out=[],last=sortedOnes(p).find(o=>o.status==='done');
 out.push(last?{t:'На прошлом 1:1: '+last.summary.split('. ')[0]+'.',s:'1:1 от '+fmtD(last.d)}:{t:`Последний 1:1 – ${fmtD(p.last)} (${ago(p.last)}); итогов в CRM нет – начать с открытого вопроса «как тебе сейчас?»`,s:'история 1:1'});
 const pl=p.pulse,f=pl[0],l=pl[pl.length-1];
 out.push({t:l-f<=-2?`Пульс снизился: ${f} → ${l} за ${pl.length} нед. Спросить про нагрузку и интерес к работе, не про «настроение».`:l-f>=1?`Пульс растёт: ${f} → ${l} – отметить, что изменилось к лучшему.`:`Пульс ровный: ${l}/10 последние ${pl.length} нед.`,s:'пульс, '+pl.length+' нед.'});

   else if(a==='tl'){S.tl=!S.tl;draw()}

   else if(a==='nf'){S.form=!S.form;draw()}

    const vis=el.querySelector('#ps-vis input:checked').value,li=el.querySelector('#ps-link').value,n={id:'n'+Date.now(),who:p.id,by:HRP.me(),d:'2026-11-11',vis,cat:el.querySelector('#ps-cat').value,t};

 },

};

/* meetings that live only on this screen (consistent with p.next / p.last) */
const X=[
 {id:'x-alina',who:'alina',d:'2026-11-11',time:'12:00',status:'today',tpl:'Испытательный срок',agenda:[{by:'hr',t:'Испытательный срок: до ревью 12 дней – что ещё неуверенно?'},{by:'auto',src:'Благодарности',t:'Из CRM: благодарность от Polina за первую самостоятельную утреннюю волну'},{by:'auto',src:'Матрица навыков',t:'Из CRM: подтверждено 4 из 6 базовых стилей'}],actions:[]},
 {id:'x-artem',who:'artem',d:'2026-11-14',time:'13:00',status:'planned',agenda:[{by:'emp',t:'Переключения контекста'}],actions:[]},
 {id:'x-ruslan',who:'ruslan',d:'2026-11-14',time:'17:30',status:'planned',agenda:[{by:'hr',t:'Пробный лид маршрутов по субботам – как идёт?'},{by:'auto',src:'Документы',t:'Из CRM: проверка водительских прав до 2 дек'}],actions:[]},
 {id:'x-yana',who:'yana',d:'2026-11-15',time:'10:00',status:'planned',agenda:[{by:'hr',t:'Видео-уроки: что получилось в октябре'}],actions:[]},
 {id:'x-daria-p',who:'daria',d:'2026-10-28',time:'15:00',status:'done',summary:'Daria хочет расти в свадьбы и инсталляции, цель – L3 к лету. Договорились о практике на свадебных заказах и уроке по бутоньеркам.',agenda:[{by:'emp',t:'Хочу больше сложных заказов',done:true},{by:'hr',t:'План развития на Q4',done:true}],actions:[{t:'Пройти урок «Свадебная бутоньерка» в Обучении',owner:'daria',due:'2026-11-08',done:false},{t:'Спросить Mila про совместную сборку арки',owner:'eva',due:'2026-11-04',done:true}]}
];

X.forEach(x=>{if(!D.ones.some(o=>o.id===x.id))D.ones.push(x)}); // share with other screens
const all=()=>D.ones;
const byId=id=>all().find(o=>o.id===id);
const fn=p=>p?p.name.split(' ')[0]:'';
const addD=(s,n)=>{const d=dd(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const wd=s=>{const w=dd(s).toLocaleDateString('ru-RU',{weekday:'short',timeZone:'Europe/London'});return w.charAt(0).toUpperCase()+w.slice(1)};
const slotL=(d,t)=>(d===TODAY?'Сегодня':wd(d)+', '+fmtD(d))+', '+t;

const clean=t=>t.replace(/^Из CRM:\s*/,'');
const srcOf=a=>{if(a.src)return a.src;const t=a.t.toLowerCase();if(t.includes('благодарн'))return 'Благодарности и отзывы';if(t.includes('переработ')||t.includes('пульс'))return 'Табель и пульс';if(t.includes('незакрыто'))return 'Прошлая 1:1';return 'CRM'};
const prevOf=m=>all().filter(o=>o.who===m.who&&o.status==='done'&&o.id!==m.id&&o.d<=m.d).sort((a,b)=>b.d.localeCompare(a.d))[0];

const tplOf=m=>m.tpl||(P(m.who).status==='probation'?'Испытательный срок':'Регулярная');

 if(id&&byId(id))return id;
 if(id&&P(id)){const nx=nextOf(id);const ls=all().filter(o=>o.who===id&&o.status==='done').sort((a,b)=>b.d.localeCompare(a.d))[0];if(nx||ls)return (nx||ls).id}
 return 'o1';
}
function carry(m){
 if(m._c||m.status==='done')return; m._c=1; const pv=prevOf(m); if(!pv)return;
 pv.actions.filter(a=>!a.done).slice().reverse().forEach(a=>{const ex=m.actions.find(x=>x.t===a.t);if(ex){ex.from=pv.d;ex.ref=a}else m.actions.unshift({t:a.t,owner:a.owner,due:a.due,done:false,from:pv.d,ref:a})});
}
function draft(m){
 const p=P(m.who);const disc=m.agenda.filter(a=>a.done).map(a=>clean(a.t));const acts=m.actions.filter(a=>!a.done);
 let s=`Итог 1:1 – ${p.name}, ${fmtD(m.d)}\n\nОбсудили:\n`+(disc.length?disc.map(t=>'– '+t).join('\n'):'– (отметьте темы повестки галочкой «обсудили»)');

 s+=`\n\nСледующая встреча: ~${fmtD(addD(m.d,CAD[p.cad]||14))}.`;
 return s;
}

App.reg('oneonones',{
 title:'1:1',
 crumb:(pr)=>{const m=byId(resolve(pr&&pr.id));return '1:1'+(m?' · '+P(m.who).name:'')},
