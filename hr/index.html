  function rowM(m){const p=P(m.who);const sub=m.status==='done'?fmtD(m.d)+' · состоялась':(m.d===TODAY?'Сегодня, '+m.time:wd(m.d)+', '+fmtD(m.d)+', '+m.time);
   return `<div class="mrow ${m.id===curId?'on':''}" data-m="${m.id}">${H.av(p)}<div class="mi"><b>${p.name}</b><small>${sub} · ${tplOf(m)}</small>${m.status==='done'?`<small>${p.cad}</small>`:cadSel(p)}</div></div>`}
  function renderList(){
   const A=all(),act=A.filter(m=>m.status!=='done');
   const g=[['Сегодня',act.filter(m=>m.d<=TODAY).sort(byDT)],['На этой неделе',act.filter(m=>m.d>TODAY&&m.d<=WEEK_END).sort(byDT)],['Позже',act.filter(m=>m.d>WEEK_END).sort(byDT)]];
   const od=D.people.filter(overdue);
   const past=A.filter(m=>m.status==='done').sort((a,b)=>b.d.localeCompare(a.d));
   let h='';
   g.forEach(([n,l],i)=>{if(!l.length&&i===2)return;h+=`<div class="gh">${n}<span class="n">${l.length}</span></div>`+(l.length?l.map(rowM).join(''):'<div class="empty" style="padding:10px 14px;text-align:left">Встреч нет</div>')});
   h+=`<div class="gh warn">${ic('alert')}Пора встретиться<span class="n">${od.length}</span></div>`+(od.length?od.map(p=>{const nx=nextOf(p.id);return `<div class="mrow" data-op="${p.id}">${H.av(p)}<div class="mi"><b>${p.name}</b><small class="w">Последняя 1:1 ${ago(p.last)} · норма: ${p.cad.toLowerCase()}</small>${nx?`<small>Назначена: ${fmtD(nx.d)}, ${nx.time}</small>`:''}${cadSel(p)}</div><button class="btn s" data-sched="${p.id}">${nx?'Открыть':'Назначить'}</button></div>`}).join(''):'<div class="empty" style="padding:10px 14px;text-align:left">Все встречаются по графику</div>');
   h+=`<div class="gh">Прошедшие<span class="n">${past.length}</span></div>`+past.map(rowM).join('');
   el.querySelector('#oo-lst').innerHTML=h;
   el.querySelector('#oo-sub').textContent=`${g[0][1].length} сегодня · ${g[1][1].length} на этой неделе · ${od.length} ${plural(od.length,'человек','человека','человек')} давно без 1:1`;
  }
  const byL=(a,p)=>a.by==='emp'?`${ic('user')}${fn(p)} · сотрудник`:a.by==='auto'?`${H.chip('из CRM','info')}${H.chip(srcOf(a),'line')}`:a.tpl?`${ic('note')}шаблон «${a.tpl}»`:`${ic('chat')}Eva · HR`;
  const privCard=(m,ro)=>App.role==='admin'
   ?`<div class="lockbox">${ic('lock')}<div><b style="color:var(--ink);font-weight:500">Личные заметки HR скрыты</b><br>Их видит только автор. Админ не видит даже с полным доступом – только через аварийный доступ с записью в журнал.</div></div>`
   :`<div class="card"><div class="ch"><h3>Личные заметки</h3>${H.vis('priv')}</div><div class="cb">${ro?`<p class="sm">${H.esc(m._priv??PRIV[m.id]??'Заметок нет')}</p>`:`<textarea class="ta" id="oo-pn" placeholder="Что важно помнить – только для себя">${H.esc(m._priv??PRIV[m.id]??'')}</textarea>`}
     <div class="row sm muted" style="margin-top:8px;flex-wrap:wrap">${ic('lock')}<span style="flex:1;min-width:200px">Видите только вы; даже админ не видит. Не попадают в итог, AI-черновики и ревью.</span>${ro?'':'<button class="btn s" id="oo-pn-save">Сохранить</button>'}</div></div></div>`;
  function wsDone(m){
   const p=P(m.who);const nx=nextOf(p.id);
   return `<div class="card"><div class="cb"><div class="whd">${H.who(p,H.lvl(p)+' · '+D.teams[p.team])}${H.chip('Состоялась · '+fmtD(m.d),'ok')}<div class="sp"></div>
     <button class="btn s ghost" data-person="${p.id}">${ic('user')}Карточка</button>${nx?`<button class="btn s pr" data-m="${nx.id}">${ic('arrow')}Следующая: ${fmtD(nx.d)}</button>`:`<button class="btn s pr" data-sched="${p.id}">${ic('plus')}Назначить следующую</button>`}</div>
     <div class="meta"><span>${ic('cal')}${wd(m.d)}, ${fmtD(m.d)}, ${m.time}</span><span>${ic('note')}${tplOf(m)}</span><span>${ic('clock')}${p.cad}</span></div></div></div>
    <div class="card"><div class="ch"><h3>Итог</h3>${H.vis('shared')}<div class="r"><span class="muted sm">Итог видят оба</span></div></div><div class="cb"><p class="pre">${H.esc(m.summary||'Итог не записан')}</p></div></div>
    <div class="card"><div class="ch"><h3>Повестка</h3>${H.vis('shared')}</div><div class="cb">${m.agenda.map(a=>`<div class="li"><span class="${a.done!==false?'ok':'muted'}">${ic(a.done!==false?'check':'dots')}</span><div class="t"><span class="tx">${H.esc(clean(a.t))}</span><div class="by">${byL(a,p)}</div></div></div>`).join('')}</div></div>
    <div class="card"><div class="ch"><h3>Договорённости</h3>${H.vis('shared')}</div><div class="cb">${m.actions.length?m.actions.map(a=>`<div class="li"><div class="t"><span class="tx">${H.esc(a.t)}</span><div class="by">${owner(a.owner)} · до ${fmtD(a.due)}</div></div>${a.done?H.chip('выполнено','ok'):H.chip('открыто – перенесётся','warn')}</div>`).join(''):'<p class="muted sm">Договорённостей не было</p>'}</div></div>
    ${privCard(m,true)}`;
  }
  function wsActive(m){
   const p=P(m.who);carry(m);const pv=prevOf(m);const tpl=tplOf(m);
   const kd=D.kudos.filter(k=>k.to===p.id&&(!pv||k.d>=pv.d));
   const last=p.pulse[p.pulse.length-1],tr=last-p.pulse[0];
   m._qs=(QS[p.id]||TPL[tpl]).slice(0,3);
   const open=m.actions.filter(a=>!a.done);
   return `<div class="card"><div class="cb">
     <div class="whd">${H.who(p,H.lvl(p)+' · '+D.teams[p.team])}${H.statusChip(p)}<div class="sp"></div>
      <div class="tplw"><span class="eyebrow">Шаблон</span><select class="sel" id="oo-tpl">${Object.keys(TPL).map(k=>`<option ${k===tpl?'selected':''}>${k}</option>`).join('')}</select></div></div>
     <div class="meta"><span>${ic('cal')}${slotL(m.d,m.time)}</span><span>${ic(p.team==='tech'?'link':'flower')}${p.team==='tech'?'Google Meet':'Студия'}</span><span>${ic('clock')}${p.cad}</span><span>${ic('chat')}Прошлая 1:1: ${fmtD(pv?pv.d:p.last)}</span></div>
     ${p.signals.length?`<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">${p.signals.map(H.sig).join('')}</div>`:''}
     <div class="row" style="margin-top:14px;flex-wrap:wrap;gap:8px"><button class="btn s pr" id="oo-finish">${ic('check')}Завершить встречу</button><button class="btn s" id="oo-resched">${ic('clock')}Перенести</button><button class="btn s ghost" data-person="${p.id}">${ic('user')}Карточка</button></div>
    </div></div>
    <div class="card ai"><div class="ch"><h3>Подготовка</h3><div class="r">${H.aiLabel()}</div></div><div class="cb">
     <div class="prep">
      <div><h5>Прошлая встреча${pv?' · '+fmtD(pv.d):''}</h5><p class="sm">${pv?H.esc(pv.summary||'Итог не записан'):'Записи нет – встречи до запуска 1:1 в CRM не сохранялись.'}</p></div>
      <div><h5>Открытые договорённости</h5>${open.length?`<ul>${open.map(a=>`<li>${H.esc(a.t)} <span class="muted">– ${owner(a.owner)}</span></li>`).join('')}</ul>`:'<p class="sm muted">Всё закрыто</p>'}</div>
      <div><h5>Пульс · ${p.pulse.length} нед.</h5><div class="row">${H.spark(p.pulse,{color:H.pulseColor(last)})}<span class="sm">${p.pulse[0]} → ${last} · ${tr<=-2?'падает':tr>=1?'растёт':'стабильно'}</span></div><p class="sm muted" style="margin-top:4px">Личный пульс видит только HR, в итог не попадает</p></div>
      <div><h5>Благодарности с прошлой встречи</h5>${kd.length?kd.map(k=>`<p class="sm">«${H.esc(k.t)}» – ${fn(P(k.from))}, ${fmtD(k.d)}</p>`).join(''):'<p class="sm muted">От коллег – нет. Отзывы клиентов – в повестке «из CRM».</p>'}</div>
     </div>
     <div class="hr-line"></div>
     <h5 class="e">Что спросить</h5>
     <ul class="qs">${m._qs.map((q,i)=>`<li><span style="flex:1">${H.esc(q)}</span><button class="btn s ghost" data-q="${i}">${ic('plus')}В повестку</button></li>`).join('')}</ul>
     <p class="sm muted" style="margin-top:8px">Источники: прошлая 1:1, договорённости, пульс, благодарности, план развития. Без денег и без чужих личных заметок. AI ничего не решает и не оценивает человека.</p>
    </div></div>
    <div class="card"><div class="ch"><h3>Общая повестка</h3>${H.vis('shared')}<div class="r"><span class="muted sm">${fn(p)} добавляет темы из приложения</span></div></div><div class="cb">
     ${m.agenda.length?m.agenda.map((a,i)=>`<div class="li ${a.done?'done':''}"><div class="t"><span class="tx">${H.esc(clean(a.t))}</span><div class="by">${byL(a,p)}</div></div><label class="ck"><input type="checkbox" data-ag="${i}" ${a.done?'checked':''}>обсудили</label></div>`).join(''):'<p class="muted sm">Тем пока нет</p>'}
     <div class="add"><input class="inp" id="oo-ag-in" placeholder="Добавить тему…"><button class="btn" id="oo-ag-add">${ic('plus')}Добавить</button></div>
    </div></div>
    <div class="card"><div class="ch"><h3>Договорённости</h3>${H.vis('shared')}<div class="r"><span class="muted sm">${open.length} ${plural(open.length,'открыта','открыты','открыто')}</span></div></div><div class="cb">
     ${m.actions.length?m.actions.map((a,i)=>`<div class="li ${a.done?'done':''}"><input type="checkbox" data-act="${i}" ${a.done?'checked':''} title="Выполнено"><div class="t"><span class="tx">${H.esc(a.t)}</span><div class="by">${ic('user')}${owner(a.owner)} · до ${fmtD(a.due)}${a.from?H.chip('перенесено с '+fmtD(a.from),'warn'):''}</div></div></div>`).join(''):'<p class="muted sm">Пока нет договорённостей</p>'}
     <div class="add"><input class="inp" id="oo-ac-in" placeholder="Новая договорённость…"><select class="sel" id="oo-ac-own"><option value="eva">Eva · HR</option><option value="${p.id}">${fn(p)}</option>${p.mgr?`<option value="${p.mgr}">${fn(P(p.mgr))} · руководитель</option>`:''}</select><select class="sel" id="oo-ac-due"><option value="3">через 3 дня</option><option value="7" selected>через неделю</option><option value="14">через 2 недели</option></select><button class="btn" id="oo-ac-add">${ic('plus')}Добавить</button></div>
    </div></div>
    ${privCard(m,false)}
    <div class="card"><div class="ch"><h3>После встречи</h3></div><div class="cb">
     <label class="sw"><input type="checkbox" id="oo-consent" ${consent[m.id]?'checked':''}><span><b>Сотрудник согласен на расшифровку</b><small>Аудио не храним. Расшифровка удаляется через 30 дней. Итог видят оба.</small></span></label>
     <div id="oo-tr">${consent[m.id]?trBox(p):''}</div>
     <div class="card ai" style="margin-top:14px"><div class="ch"><h3>Итог встречи</h3><div class="r">${H.aiLabel()}</div></div><div class="cb">
      <textarea class="ta sum" id="oo-sum">${H.esc(m._draft??draft(m))}</textarea>
      <p class="sm muted" style="margin:6px 0 10px">Собрано из отмеченных тем и договорённостей${consent[m.id]?' и расшифровки':''}. Личные заметки и пульс не используются. Можно править.</p>
      <div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn s" id="oo-regen">${ic('spark')}Собрать заново</button><span class="sp"></span><span class="sm muted" id="oo-sent">${m._sent?'Отправлено '+m._sent:''}</span><button class="btn s ac" id="oo-send">${ic('send')}Отправить итог сотруднику</button></div>
     </div></div>
    </div></div>`;
  }
  const trBox=p=>`<div class="callout ok" style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:200px">Подтверждение от ${fn(p)} получено в приложении. Запись идёт только во время звонка.</span><button class="btn s" id="oo-tr-go">${ic('mic')}Начать расшифровку</button></div>`;
  function renderWs(){const m=cur();el.querySelector('#oo-ws').innerHTML=m.status==='done'?wsDone(m):wsActive(m)}
  function refreshDraft(){const m=cur();if(m._edited)return;m._draft=null;const ta=el.querySelector('#oo-sum');if(ta)ta.value=draft(m)}
  function addAgenda(){const i=el.querySelector('#oo-ag-in');const v=i.value.trim();if(!v){App.toast('Напишите тему');i.focus();return}cur().agenda.push({by:'hr',t:v});renderWs();App.toast('Тема добавлена – сотрудник увидит её в приложении');const n=el.querySelector('#oo-ag-in');if(n)n.focus()}
  function addAction(){const i=el.querySelector('#oo-ac-in');const v=i.value.trim();if(!v){App.toast('Напишите договорённость');i.focus();return}
   const m=cur();m.actions.push({t:v,owner:el.querySelector('#oo-ac-own').value,due:addD(TODAY,+el.querySelector('#oo-ac-due').value),done:false});renderWs();refreshDraft();App.toast('Договорённость добавлена')}
  function slotSel(id){return `<select class="sel" id="${id}">${SLOTS.map((s,i)=>`<option value="${i}">${slotL(s[0],s[1])}</option>`).join('')}</select>`}
  function schedule(pid){
   if(pid){const nx=nextOf(pid);if(nx){App.go('oneonones',{id:nx.id});return}}
   App.modal(pid?'1:1 с '+P(pid).name:'Новая встреча 1:1',`${pid?'':`<label class="f">С кем</label><select class="sel" id="oo-sc-p">${D.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><div style="height:10px"></div>`}
    <label class="f">Когда</label>${slotSel('oo-sc-d')}<div style="height:10px"></div>
    <label class="f">Шаблон</label><select class="sel" id="oo-sc-t">${Object.keys(TPL).map(k=>`<option>${k}</option>`).join('')}</select>
    <p class="sm muted" style="margin-top:10px">Сотрудник получит приглашение в приложении и сможет заранее добавить свои темы. Сигналы из CRM попадут в повестку сами.</p>`,
    `<button class="btn" data-close>Отмена</button><button class="btn pr" id="oo-sc-ok">Назначить</button>`);
   document.getElementById('oo-sc-ok').onclick=()=>{
    const who=pid||document.getElementById('oo-sc-p').value;const s=SLOTS[+document.getElementById('oo-sc-d').value];const tp=document.getElementById('oo-sc-t').value;const p=P(who);
    const m={id:'m'+Date.now().toString(36),who,d:s[0],time:s[1],status:s[0]===TODAY?'today':'planned',tpl:tp,agenda:p.signals.filter(x=>!/пульс/i.test(x.t)).map(x=>({by:'auto',src:'Сигналы',t:x.t})).concat(TPL[tp].map(q=>({by:'hr',t:q,tpl:tp}))),actions:[]};
    D.ones.push(m);p.next=s[0];App.close();App.go('oneonones',{id:m.id});App.toast(`1:1 с ${fn(p)} – ${slotL(s[0],s[1])}. Приглашение ушло в приложение`)};
  }
  function resched(){
   const m=cur();const p=P(m.who);
   App.modal('Перенести встречу',`<p class="sm muted" style="margin-bottom:10px">${p.name} · сейчас: ${slotL(m.d,m.time)}</p><label class="f">Новое время</label>${slotSel('oo-rs-d')}<div style="height:10px"></div>
    <label class="f">Причина (видит сотрудник)</label><select class="sel" id="oo-rs-r"><option>Смена или срочный заказ</option><option>Сотрудник попросил</option><option>Без причины</option></select>`,
    `<button class="btn" data-close>Отмена</button><button class="btn pr" id="oo-rs-ok">Перенести</button>`);
   document.getElementById('oo-rs-ok').onclick=()=>{const s=SLOTS[+document.getElementById('oo-rs-d').value];m.d=s[0];m.time=s[1];m.status=s[0]===TODAY?'today':'planned';p.next=s[0];App.close();renderList();renderWs();App.toast(`Перенесено на ${slotL(s[0],s[1])} – ${fn(p)} получит уведомление`)};
  }
  function finish(){
   const m=cur();const p=P(m.who);const ta=el.querySelector('#oo-sum');
   if(m.d>TODAY)m.d=TODAY;m.summary=(m._edited&&ta?ta.value:draft(m)).trim();m.status='done';p.last=m.d;const nd=addD(m.d,CAD[p.cad]||14);p.next=nd;
   if(!nextOf(p.id))D.ones.push({id:'m'+Date.now().toString(36),who:p.id,d:nd,time:m.time,status:'planned',agenda:[],actions:[]});
   renderList();renderWs();App.toast(`Встреча с ${fn(p)} завершена – итог в карточке. Следующая ~${fmtD(nd)}`);
  }
  el.addEventListener('click',e=>{
   const t=e.target;if(t.closest('select'))return;
   const sc=t.closest('[data-sched]');if(sc){schedule(sc.dataset.sched);return}
   const mm=t.closest('[data-m]');if(mm){App.go('oneonones',{id:mm.dataset.m});return}
   const op=t.closest('[data-op]');if(op){schedule(op.dataset.op);return}
   const q=t.closest('[data-q]');if(q){const m=cur();m.agenda.push({by:'hr',t:m._qs[+q.dataset.q]});renderWs();App.toast('Вопрос добавлен в общую повестку');return}
   const id=(t.closest('button')||{}).id;
   if(id==='oo-ag-add')addAgenda();
   else if(id==='oo-ac-add')addAction();
   else if(id==='oo-pn-save')App.toast('Личная заметка сохранена – видите только вы');
   else if(id==='oo-regen'){const m=cur();m._edited=false;refreshDraft();App.toast('Черновик итога собран заново')}
   else if(id==='oo-send'){const m=cur();const ta=el.querySelector('#oo-sum');m._draft=ta.value;m._sent='сегодня';el.querySelector('#oo-sent').textContent='Отправлено '+m._sent;App.toast(`Итог отправлен ${fn(P(m.who))} в приложение – видят оба`)}
   else if(id==='oo-finish')finish();
   else if(id==='oo-resched')resched();
   else if(id==='oo-tr-go')App.toast('Расшифровка идёт. Аудио не сохраняется, текст удалится через 30 дней');
   else if(id==='oo-new')schedule(null);
   else if(id==='oo-tpls')App.sheet('Шаблоны 1:1',Object.keys(TPL).map(k=>`<div style="margin-bottom:18px"><div class="eyebrow" style="margin-bottom:6px">${k}</div>${TPL[k].map(x=>`<div class="sm" style="padding:6px 0;border-bottom:1px solid var(--hair)">${H.esc(x)}</div>`).join('')}</div>`).join('')+'<p class="sm muted">Шаблон добавляет вопросы в общую повестку – их видит сотрудник. Удалить или поменять вопрос можно прямо во встрече.</p>');
  });
  el.addEventListener('change',e=>{
   const t=e.target;
   if(t.dataset.cad){const p=P(t.dataset.cad);p.cad=t.value;renderList();if(cur().who===p.id)renderWs();App.toast(`${fn(p)}: 1:1 ${t.value.toLowerCase()}. Напомню за день до встречи`);return}
   if(t.id==='oo-tpl'){const m=cur();const n=t.value;m.agenda=m.agenda.filter(a=>!(a.tpl&&!a.done));TPL[n].forEach(x=>m.agenda.push({by:'hr',t:x,tpl:n}));m.tpl=n;renderWs();App.toast(`Шаблон «${n}»: ${TPL[n].length} ${plural(TPL[n].length,'вопрос','вопроса','вопросов')} в повестке`);return}
   if(t.dataset.ag!==undefined){const a=cur().agenda[+t.dataset.ag];a.done=t.checked;t.closest('.li').classList.toggle('done',t.checked);refreshDraft();return}
   if(t.dataset.act!==undefined){const a=cur().actions[+t.dataset.act];a.done=t.checked;if(a.ref)a.ref.done=t.checked;t.closest('.li').classList.toggle('done',t.checked);refreshDraft();App.toast(t.checked?'Отмечено выполненным':'Снова открыто');return}
   if(t.id==='oo-consent'){const m=cur();consent[m.id]=t.checked;el.querySelector('#oo-tr').innerHTML=t.checked?trBox(P(m.who)):'';refreshDraft();App.toast(t.checked?'Расшифровка включена – аудио не сохраняется':'Без расшифровки – итог только из повестки и договорённостей');return}
  });
  el.addEventListener('input',e=>{const t=e.target;if(t.id==='oo-sum'){const m=cur();m._draft=t.value;m._edited=true}if(t.id==='oo-pn')cur()._priv=t.value});
  el.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='oo-ag-in'){e.preventDefault();addAgenda()}if(e.target.id==='oo-ac-in'){e.preventDefault();addAction()}});
  renderList();renderWs();
 },
 notes:`<h4>Что это</h4><p>Рабочее место для регулярных 1:1: список по каденции, общая повестка, договорённости с автопереносом, личные заметки, подготовка и итог.</p>
<h4>Зачем HR</h4><p>1:1 – главный инструмент People Partner: ранние сигналы, рост, доверие. Сейчас в CRM у человека есть только даты последней и следующей встречи – без повестки и договорённостей.</p>
<h4>Откуда идея</h4><p><span class="src">Small Improvements</span><span class="src">Lattice</span><span class="src">15Five</span><span class="src">Leapsome</span> – автоперенос незакрытого, напоминание о похвале, итог «видят оба», расшифровка только с согласием.</p>

   const p=P(pid);const lv=p.skills[k];const tg=Math.min(3,lv+1);const steps=(p.ladder==='courier'&&STc[k])||STEPS[k];
   const ass=D.people.filter(q=>q.id!==pid&&q.skills[k]===3&&REL[q.ladder].includes(k));
   App.sheet('Подтвердить навык',`<div class="gw-sh">${H.who(p,H.lvl(p))}
    <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:6px">${H.chip(H.skillNames[k],'ink')}${lv<3?H.chip('сейчас '+lv+' → подтверждаем '+tg,'info'):H.chip('уровень 3 – повторная проверка','info')}</div>
    <h4>Практическая проверка на смене</h4>${steps.map((s,i)=>`<label class="chk"><input type="checkbox" data-st="${i}">${s}</label>`).join('')}
    <h4>Фото работы</h4><div class="ph" id="gw-ph">${ic('flower','')}<b>фото работы</b><span>Фото готового букета уже делается для клиента – возьмите его из заказа или загрузите</span><button class="btn s" id="gw-phb">Взять фото из заказа</button></div>
    <h4>Кто проверяет</h4><select class="sel" id="gw-as">${(ass.length?ass:[P('irina')]).map(q=>`<option>${q.name} · может обучать</option>`).join('')}</select>
    <h4>Комментарий</h4><textarea class="ta" id="gw-cm" placeholder="Что получилось, что подтянуть"></textarea>
    <h4>Решение</h4><div class="seg" id="gw-dec"><button data-dec="pass">Сдал</button><button data-dec="retry">Ещё раз</button></div>
    <p class="sm muted" style="margin-top:8px">Решение ставит проверяющий, AI в этом не участвует. Повторная проверка – через 6 месяцев, как сертификаты в Обучении.</p></div>`,
    `<button class="btn" data-close>Отмена</button><button class="btn pr" id="gw-sos">Сохранить решение</button>`);
   let dec=null;const sb=document.getElementById('sheet-b'),sf=document.getElementById('sheet-f');
   sb.onclick=e=>{if(!sb.querySelector('.gw-sh'))return;const b=e.target.closest('button');if(!b)return;
    if(b.id==='gw-phb'){const ph=sb.querySelector('#gw-ph');ph.classList.add('got');ph.innerHTML=`${ic('check')}<b>Фото прикреплено</b><span>Заказ #48231 · 11 нояб, утренняя волна</span>`;App.toast('Фото взято из заказа – клиентские данные не копируются');return}
    if(b.dataset.dec){dec=b.dataset.dec;sb.querySelectorAll('#gw-dec button').forEach(x=>x.classList.toggle('on',x===b))}};
   sf.onclick=e=>{if(!sb.querySelector('.gw-sh')||!e.target.closest('#gw-sos'))return;
    if(!dec){App.toast('Выберите решение: «Сдал» или «Ещё раз»');return}

    if(dec==='pass'&&!all){App.toast('Не все шаги отмечены – отметьте их или выберите «Ещё раз»');return}
    App.close();sb.onclick=sf.onclick=null;
    if(dec==='pass'){p.skills[k]=tg;draw();const c=el.querySelector(`[data-sk="${pid}|${k}"]`);if(c)c.classList.add('flash');App.toast(lv<3?`${fn(p)} · ${H.skillNames[k]}: ${lv} → ${tg} подтверждено`:`${fn(p)} · ${H.skillNames[k]}: уровень 3 подтверждён повторно`)}
    else App.toast(`Повтор через 2 недели – задача создана для проверяющего, ${fn(p)} получит подсказку, что подтянуть`)};
  }
  /* ---------- edit track sheet ---------- */
  function openEdit(){
   const t=TR[trk];const rowH=(r)=>`<div class="etr"><input class="inp et-rn" value="${H.esc(r.n)}" placeholder="Компетенция">${t.cols.map((c,i)=>`<label class="f" style="margin-top:4px">${c.n}</label><input class="inp et-c" value="${H.esc(r.e[i]||'')}">`).join('')}</div>`;
   App.sheet('Редактировать трек',`<div class="gw-sh"><label class="f">Название трека</label><input class="inp" id="gw-tn" value="${H.esc(t.name||D.ladders[trk].name)}">
    <p class="sm muted" style="margin:8px 0 12px">Уровни – колонки, компетенции – строки. 3–6 слов в ячейке: что человек делает на этом уровне. Без ставок – деньги ведёт админ отдельно.</p>
    <div id="gw-rows">${t.rows.map(rowH).join('')}</div><button class="btn s" id="gw-addr">${ic('plus')}Компетенция</button></div>`,
    `<button class="btn" data-close>Отмена</button><button class="btn pr" id="gw-tsave">Сохранить</button>`);
   const sb=document.getElementById('sheet-b'),sf=document.getElementById('sheet-f');
   sb.onclick=e=>{if(sb.querySelector('.gw-sh')&&e.target.closest('#gw-addr')){sb.querySelector('#gw-rows').insertAdjacentHTML('beforeend',rowH({n:'',e:[]}));App.toast('Строка добавлена')}};
   sf.onclick=e=>{if(!sb.querySelector('.gw-sh')||!e.target.closest('#gw-tsave'))return;
    const rows=[...sb.querySelectorAll('.etr')].map((d,i)=>({n:d.querySelector('.et-rn').value.trim(),sk:(t.rows[i]||{}).sk,e:[...d.querySelectorAll('.et-c')].map(x=>x.value.trim()||'–')})).filter(r=>r.n);
    t.rows=rows;t.name=sb.querySelector('#gw-tn').value.trim()||D.ladders[trk].name;App.close();sb.onclick=sf.onclick=null;draw();App.toast(`Трек «${t.name}» сохранён как черновик – сотрудники увидят после согласования основателем`)};
  }
  el.addEventListener('click',e=>{
   const t=e.target;
   const pd=t.closest('[data-pdp]');if(pd){openPdp(pd.dataset.pdp);return}
   const f=t.closest('[data-pf]');if(f){pf=f.dataset.pf;draw();return}
   const tr=t.closest('[data-trk]');if(tr){trk=tr.dataset.trk;foc=null;draw();return}
   const pp=t.closest('[data-pp]');if(pp){foc={pid:pp.dataset.pp,_trk:trk};draw();return}
   const lv=t.closest('[data-lv]');if(lv){foc={lv:lv.dataset.lv,_trk:trk};draw();return}
   if(t.closest('#gw-fx')){foc={lv:'__none',_trk:trk};const c=t.closest('.card');if(c)c.remove();return}
   const mfb=t.closest('[data-mf]');if(mfb){mf=mfb.dataset.mf;draw();return}
   const sk=t.closest('[data-sk]');if(sk){const [a,b]=sk.dataset.sk.split('|');openSo(a,b);return}
   if(t.closest('#gw-edit')){openEdit();return}
   if(t.closest('#gw-so')){
    const cand=D.people.filter(p=>REL[p.ladder].length);
    App.modal('Подтвердить навык',`<label class="f">Кто</label><select class="sel" id="gw-mp">${cand.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><div style="height:10px"></div><label class="f">Навык</label><select class="sel" id="gw-mk">${SK.map(k=>`<option value="${k}">${H.skillNames[k]}</option>`).join('')}</select>`,`<button class="btn" data-close>Отмена</button><button class="btn pr" id="gw-mgo">Далее</button>`);
    document.getElementById('gw-mgo').onclick=()=>{const pid=document.getElementById('gw-mp').value,k=document.getElementById('gw-mk').value;if(!REL[P(pid).ladder].includes(k)){App.toast('Этот навык не входит в трек человека');return}App.close();setTimeout(()=>openSo(pid,k),60)};return}
  });
  if(tab==='tracks'&&foc&&foc.lv==='__none')foc=null;
  draw();
  if(openPid){setTimeout(()=>openPdp(openPid),30)}
 },
 notes:(pr)=>{const t=tabOf(pr);
  if(t==='tracks')return `<h4>Что это</h4><p>Карьерные треки по ролям: уровни – колонки, 5 компетенций – строки. У флористов после L3 развилка: «Старшая смены» (люди) или «Мастер-флорист» (ремесло).</p>
<h4>Зачем HR</h4><p>Человек видит, где он и что нужно для следующего шага; план развития строится от пробелов следующего уровня. Сейчас в CRM есть только денежная лестница флористов – её HR не видит, трек от денег отделён.</p>
<h4>Откуда идея</h4><p><span class="src">Lattice Grow</span><span class="src">Leapsome</span><span class="src">Employment Hero</span> двойной трек в рознице; <span class="src">City &amp; Guilds</span> Level 2–5 по флористике как внешняя опция.</p>
<h4>Данные из нашей CRM</h4><p>Матрица навыков 0–3 (строки трека ссылаются на её навыки), планы развития в «Развитии». Сами треки – новое.</p>
<h4>Приоритет</h4><p><span class="pri p2">Следующий шаг</span> после планов и 1:1. Правка трека – черновик, согласует основатель.</p>`;
  if(t==='matrix')return `<h4>Что это</h4><p>Существующая матрица навыков 0–3 в виде тепловой карты с пробелами относительно уровня человека и практическим подтверждением навыка.</p>
<h4>Зачем HR</h4><p>Видно, кого учить, кто может обучать и кого ставить напарником. Пробелы сразу становятся целями плана развития.</p>
<h4>Откуда идея</h4><p><span class="src">Opus</span><span class="src">Mitti</span> практический sign-off с фото и «сдал / ещё раз»; <span class="src">AG5</span> матрица в рознице.</p>
<h4>Данные из нашей CRM</h4><p>Матрица навыков у человека, допуски станций и наблюдение на смене в «Обучении», фото букета, которое и так делается для клиента. Три системы навыков стоит свести в одну.</p>
<h4>Приоритет</h4><p><span class="pri p1">MVP</span> доступ HR и подсветка пробелов; <span class="pri p2">Следующий шаг</span> подтверждение с фото.</p>`;
  return `<h4>Что это</h4><p>Сводка всех планов развития: главная цель, прогресс, последний check-in, статус. Клик – план человека с целями, навыками, действиями и историей check-in.</p>
<h4>Зачем HR</h4><p>Сразу видно, чей план отстаёт или его нет (Jake). AI предлагает цели от пробелов до следующего уровня – HR принимает или правит.</p>
<h4>Откуда идея</h4><p><span class="src">Culture Amp Develop</span><span class="src">Lattice Grow</span><span class="src">Leapsome</span> – цели привязаны к компетенциям следующего уровня, AI-черновик плана.</p>
<h4>Данные из нашей CRM</h4><p>Экран «Развитие» уже есть: до 3 целей с мерой успеха и поддержкой, check-in, квартальный машинный черновик плана. Доработать: доступ HR, связь с 1:1 и ревью.</p>
<h4>Приоритет</h4><p><span class="pri p1">MVP</span> открыть HR существующие планы. <span class="pri p2">Следующий шаг</span> AI-цели.</p>`}
});
function tabOf(pr){const k=pr&&(pr.tab||pr.id);return ['plans','tracks','matrix'].includes(k)?k:'plans'}
})();

<script>

let view='sim',formPid='daria',formMode='mgr',started=false,pbDec=null;

function drafts(p,mode){
 const self=mode==='self';
 const kd=D.kudos.filter(k=>k.to===p.id);
 const one=D.ones.filter(o=>o.who===p.id);

 const o=p.ops,a=p.att;const pre=self?'Факты из CRM, чтобы было проще вспомнить: ':'Факты за квартал: ';
 const sig=p.signals.filter(s=>!/пульс/i.test(s.t)&&s.lvl!=='info');
 const work=nt.filter(n=>n.cat==='Работа');

 return [

 ];

App.reg('reviews',{
 title:'Ревью',
 render(el,params){
  if(params&&params.id&&P(params.id))formPid=params.id;
  el.innerHTML=`<div class="scr-h"><div><div class="eyebrow">Развитие</div><h1>Ревью</h1><div class="sub">Лёгкое квартальное ревью и испытательный срок – без оценок «в деньгах» и без 9-box</div></div>
   <div class="acts"><button class="btn" id="rv-remind">${ic('send')}Напомнить</button><button class="btn pr" id="rv-start">${ic('clip')}Запустить раньше</button></div></div>
   <div id="rv-cycle"></div><div style="height:16px"></div><div id="rv-parts"></div><div style="height:16px"></div>
   <div class="grid g2"><div id="rv-set"></div><div id="rv-sum"></div></div><div style="height:16px"></div>
   <div id="rv-prob"></div><div style="height:16px"></div><div id="rv-form"></div>`;

  el.addEventListener('click',e=>{
   const t=e.target;

   else if(id==='rv-fsend')App.toast(started?'Ответ отправлен':'Это предпросмотр – форма откроется участникам 9 дек');

 notes:`<h4>Что это</h4><p>Лёгкое квартальное ревью (самооценка → взгляд руководителя → встреча → обновление плана развития) и испытательный срок с вехами 30/60/90.</p>
<h4>Зачем HR</h4><p>Сейчас в CRM ревью нет. Для команды из 25 человек – 3–4 открытых вопроса без 360 и калибровки; испытательный срок – самое ценное из-за текучки флористов и курьеров.</p>

function lineChart(series,labels,{min=6,max=8.5,w=660,h=240}={}){
 const L=34,R=150,T=10,B=26,iw=w-L-R,ih=h-T-B;
 const x=i=>L+i*iw/(labels.length-1), y=v=>T+ih-(v-min)/(max-min)*ih;
 let s='';
 for(let v=min;v<=max+1e-9;v+=0.5) s+=`<line x1="${L}" x2="${L+iw}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--hair)"/><text x="${L-6}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--grey)">${f1(v)}</text>`;
 labels.forEach((l,i)=>{ if(i%2===0||i===labels.length-1) s+=`<text x="${x(i).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--grey)">${l}</text>` });
 const ends=[];
 series.forEach(se=>{
  const pts=se.vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="${se.color}" stroke-width="${se.w||1.8}" ${se.dash?'stroke-dasharray="4 3"':''}/>`;
  se.vals.forEach((v,i)=>{s+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===se.vals.length-1?3:2}" fill="${se.color}"><title>${se.name} · ${labels[i]}: ${f1(v)}</title></circle>`});
  ends.push({y:y(se.vals[se.vals.length-1]),t:`${se.name} ${f1(se.vals[se.vals.length-1])}`,c:se.color});
 });
 ends.sort((a,b)=>a.y-b.y); for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<13) ends[i].y=ends[i-1].y+13;
 ends.forEach(e=>{s+=`<text x="${L+iw+8}" y="${(e.y+4).toFixed(1)}" font-size="11" fill="${e.c}">${e.t}</text>`});
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img" aria-label="Линейный график пульса по командам">${s}</svg>`;
}

R.kudos=()=>{
 const counts=D.values.map(v=>[v,D.kudos.filter(k=>k.val===v).length]);
 const mx=Math.max(1,...counts.map(c=>c[1]));
 const list=D.kudos.filter(k=>S.kv==='all'||k.val===S.kv);
 const cutoff=new Date(NOW-14*864e5);
 const lastK=id=>{const r=D.kudos.filter(k=>k.to===id).map(k=>k.d).sort().pop();return r||LASTK[id]||null};
 const quiet=D.people.filter(p=>{const l=lastK(p.id);return !l||dd(l)<cutoff}).sort((a,b)=>a.kudos-b.kudos).slice(0,4);
 const y=NOW.getUTCFullYear();
 const nextD=(md)=>{let d=dd(y+'-'+md);if(daysBetween(d,NOW)>7)d=dd((y+1)+'-'+md);return d};
 const care=[];
 D.people.forEach(p=>{
  const b=nextD(p.bday.slice(5)), n=daysBetween(NOW,b);
  if(n>=-7&&n<=35) care.push({p,k:'День рождения',n,d:b});
  const a=nextD(p.start.slice(5)), na=daysBetween(NOW,a), yrs=a.getUTCFullYear()-+p.start.slice(0,4);
  if(yrs>0&&na>=-7&&na<=35) care.push({p,k:'Годовщина · '+yrs+' '+plural(yrs,'год','года','лет'),n:na,d:a});
 });
 care.sort((a,b)=>a.n-b.n);
 const when=n=>n<0?'отправлено':n===0?'сегодня':n===1?'завтра':'через '+n+' '+plural(n,'день','дня','дней');
 return `<div class="two">
 <div class="card"><div class="ch"><h3>Лента благодарностей</h3>${H.chip('уже есть в CRM: kudos, баллы, бейджи','ok')}<div class="r"><button class="btn s pr" data-a="thanks">${ic('heart')}Сказать спасибо</button></div></div><div class="cb">
  <div class="drv"><button data-a="kv" data-v="all" class="${S.kv==='all'?'on':''}">Все · ${D.kudos.length}</button>${counts.map(([v,c])=>`<button data-a="kv" data-v="${v}" class="${S.kv===v?'on':''}">${v} · ${c}</button>`).join('')}</div>
  ${list.length?list.map(k=>{const f=P(k.from),t=P(k.to);return `<div class="kd"><div class="hd">${f?H.av(f,'s'):''}<b>${f?f.name:pname(k.from)}</b><span class="muted">→</span>${t?`<button class="row" data-person="${k.to}" style="gap:8px">${H.av(t,'s')}<b>${t.name}</b></button>`:''}<span class="chip info">${k.val}</span><span class="sp"></span>${k.priv?'<span class="vis priv">'+ic('lock')+'Лично</span>':'<span class="muted sm">в ленте команды</span>'}<span class="muted sm">${ago(k.d)}</span></div><p>${H.esc(k.t)}</p></div>`}).join(''):'<div class="empty">Пока нет благодарностей с этой ценностью</div>'}
 </div></div>
 <div class="stack">
  <div class="card"><div class="ch"><h3>По ценностям · 30 дней</h3></div><div class="cb">
   ${counts.map(([v,c])=>`<div class="vrow"><span>${v}</span>${H.bar(c/mx*100,'ac')}<span class="num muted">${c}</span></div>`).join('')}
   <div class="cap">Если какую-то ценность месяц никто не отмечает – тема для общего собрания, а не для оценки людей.</div>
  </div></div>
  ${App.role==='hr'?`<div class="card"><div class="ch"><h3>Кого давно не благодарили</h3><div class="r"><span class="vis priv">${ic('lock')}Только HR</span></div></div><div class="cb">
   ${quiet.map(p=>{const l=lastK(p.id);return `<div class="prow"><button class="row who" data-person="${p.id}" style="text-align:left">${H.av(p,'s')}<span><b style="font-weight:500">${p.name}</b><small class="muted" style="display:block;font-size:12px">${l?'последняя – '+ago(l):'ни одной за 30 дней'} · ${D.teams[p.team]}</small></span></button><button class="btn s ghost" data-a="nudge" data-id="${p.id}">Подсказать</button></div>`}).join('')}
   <div class="cap">Мало благодарностей ≠ плохая работа: курьеры и удалёнка реже на виду. «Подсказать» – мягкое напоминание руководителю, без этого списка.</div>
  </div></div>`:`<div class="lockbox">${ic('lock')}<div>Список «кого давно не благодарили» видит только HR – чтобы он не превратился в рейтинг.</div></div>`}
  <div class="callout">Публичного рейтинга нет специально: в команде из 25 человек лидеры всегда одни и те же, а флористов, курьеров и разработчиков не сравнить. Рейтинг в «Задачах» – только у руководителей.</div>
  <div class="card"><div class="ch"><h3>Дни заботы</h3>${H.chip('уже есть в CRM','ok')}</div><div class="cb">
   ${care.map(c=>{const opt=S.optOut[c.p.id];const leave=c.p.status==='leave';return `<div class="prow"><button class="row who" data-person="${c.p.id}" style="text-align:left">${H.av(c.p,'s')}<span><b style="font-weight:500">${c.p.name}</b><small class="muted" style="display:block;font-size:12px">${c.k} · ${fmtD(c.d.toISOString().slice(0,10))} · ${when(c.n)}${leave?' · в отпуске':''}</small></span></button>${c.n<0?H.chip('отправлено','ok'):leave&&c.n===0?`<button class="btn s" data-a="card" data-id="${c.p.id}">Открытка от команды</button>`:`<button class="btn s ghost" data-a="opt" data-id="${c.p.id}" title="Сотрудник сам выбирает в приложении">${opt?'Только лично':'В ленте команды'}</button>`}</div>`}).join('')}
   <div class="cap">Авто-поздравление от команды + задача руководителю (как сейчас в «Днях заботы»). Сотрудник может отказаться от публичного поздравления в приложении. Возраст не показываем.</div>
  </div></div>
 </div></div>`;
};

 pulse:`<h4>Что это</h4><p>Еженедельный микропульс: 3 вопроса из библиотеки по 7 драйверам + постоянный «Как вы в целом?». Около минуты в приложении сотрудника.</p><h4>Зачем HR</h4><p>Увидеть, какая команда проседает и по какому драйверу, раньше, чем человек уйдёт. Темы – в 1:1 и план действий.</p><h4>Откуда идея</h4><p><span class="src">Peakon – драйверы</span><span class="src">Officevibe – еженедельный пульс</span><span class="src">Culture Amp – порог 5, защита от вычитания</span><span class="src">Glint – блок настроек</span></p><h4>Данные из нашей CRM</h4><p>Сейчас есть только квартальный анонимный eNPS. Рассылка – через уведомления приложения сотрудника. Пульс – новое.</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span> Для 25 человек исследование советует раз в месяц – частоту оставили настраиваемой, CRM следит за откликом.</p><h4>Доступы</h4><p>Драйверы – только средние от 5 ответов, никто не видит сырые. «Как вы в целом?» по человеку – только HR, с честной пометкой в опросе.</p>`,
 after:`<h4>Что это</h4><p>Одна отметка настроения после клок-аута – 5 лиц, можно пропустить.</p><h4>Зачем HR</h4><p>Флористы и курьеры не отвечают на длинные опросы. Отметка показывает «тяжёлые» смены (сейчас – вечер), а не людей.</p><h4>Откуда идея</h4><p><span class="src">7shifts – Shift Feedback</span><span class="src">Deputy</span><span class="src">HappyOrNot</span></p><h4>Данные из нашей CRM</h4><p>Отметка ухода со смены в приложении – только как момент показа. Ответ к смене и человеку не привязывается.</p><h4>Приоритет</h4><p><span class="pri p2">Следующий шаг</span></p>`,
 enps:`<h4>Что это</h4><p>Квартальный eNPS, который уже есть на «Мотивации», + темы комментариев и анонимные ответы.</p><h4>Зачем HR</h4><p>Сейчас eNPS видит только админ, и рядом таблица бонусов. HR нужен опрос без денег.</p><h4>Откуда идея</h4><p><span class="src">Officevibe – подписанный ответ</span><span class="src">Peakon – случайная задержка</span><span class="src">Culture Amp – AI-темы с цитатами</span><span class="src">Glint – нет сводки при &lt; 10</span></p><h4>Данные из нашей CRM</h4><p>Анонимный eNPS: балл и комментарий хранятся без имени, отдельно – только факт «ответил». Запуск – раз в квартал.</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span> перенос · <span class="pri p2">Следующий шаг</span> AI-темы</p>`,
 actions:`<h4>Что это</h4><p>Тема из опроса → действие → владелец → срок → статус. Публикация «Вы сказали – мы сделали».</p><h4>Зачем HR</h4><p>Без видимых действий отклик падает уже ко второму опросу. Это главный инструмент доверия.</p><h4>Откуда идея</h4><p><span class="src">Leapsome – action plans</span><span class="src">Culture Amp – AI Coach</span><span class="src">Officevibe</span></p><h4>Данные из нашей CRM</h4><p>«Объявления» – уже есть. Владельцу – задача в «Задачах».</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span></p>`,
 kudos:`<h4>Что это</h4><p>Лента «спасибо» с тегом ценности, разрез по ценностям, «Дни заботы».</p><h4>Зачем HR</h4><p>Видеть, кого не замечают, и поддерживать ценности. Новое – только разрез и список «давно не благодарили» (видит только HR).</p><h4>Откуда идея</h4><p><span class="src">Workleap Good Vibes</span><span class="src">Bonusly – праздники с opt-out</span><span class="src">15Five High Fives</span></p><h4>Данные из нашей CRM</h4><p>Благодарности, баллы и бейджи, признание от руководителя, «Дни заботы» – всё уже есть. Денежные награды и фонд HR не видит.</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span> перенос. Публичного рейтинга нет специально – для 25 человек это давление, а не признание.</p>`
};

function addAction(a){S.actions.push(a);App.toast('Добавлено в план действий: '+a.th)}
function aiSheet(draw){
 const SUG=[['Нагрузка','Предупреждать о пиковых днях за 2 недели и открывать доп. смены в «Смены и работы»','irina'],['Рост и обучение','Час наставника в неделю для флористов L2, которые хотят расти','mila'],['Связь магазина и продукта','Канал вопросов в продукт с ответом в течение дня','vera']];
 App.sheet('Черновик плана',`<div class="card ai"><div class="ch"><h3>По темам комментариев Q4</h3></div><div class="cb"><div style="margin-bottom:10px">${H.aiLabel()}</div>
  ${SUG.map(([th,t,o],i)=>`<div style="padding:10px 0;border-bottom:1px solid var(--hair)"><div class="eyebrow">${th}</div><div style="margin:4px 0 8px">${t}</div><div class="row"><span class="muted sm">Владелец: ${pname(o)}</span><span class="sp"></span><button class="btn s" data-sug="${i}">${ic('plus')}В план</button></div></div>`).join('')}
  <p class="muted sm" style="margin-top:10px">AI только предлагает – решает HR. В «Объявления» ничего не уходит без вашей правки.</p></div></div>`);
 document.querySelectorAll('#sheet-b [data-sug]').forEach(b=>b.onclick=()=>{const [th,t,o]=SUG[+b.dataset.sug];addAction({th,src:'AI-черновик · eNPS Q4',t,own:o,due:'2026-12-02',st:'plan'});b.disabled=true;b.innerHTML=ic('check')+'Добавлено';draw()});
}
function thanksSheet(go){
 App.sheet('Сказать спасибо',`<label class="f">Кому</label><select class="sel" id="pu-k-to">${D.people.map(p=>`<option value="${p.id}">${p.name} – ${p.role}</option>`).join('')}</select>
  <label class="f" style="margin-top:14px">Ценность</label><select class="sel" id="pu-k-val">${D.values.map(v=>`<option>${v}</option>`).join('')}</select>
  <label class="f" style="margin-top:14px">За что</label><textarea class="ta" id="pu-k-t" placeholder="Конкретно: что сделал и чем помогло"></textarea>
  <label class="f" style="margin-top:14px">Где показать</label><select class="sel" id="pu-k-vis"><option value="pub">В ленте команды</option><option value="priv">Лично – видит только получатель</option></select>
  <p class="muted sm" style="margin-top:12px">Баллы за благодарность начисляются как сейчас. От кого: ${meSign()}.</p>`,
  `<button class="btn" data-close>Отмена</button><button class="btn pr" id="pu-k-go">${ic('send')}Отправить</button>`);
 document.getElementById('pu-k-go').onclick=()=>{
  const t=document.getElementById('pu-k-t').value.trim(); if(!t){App.toast('Напишите, за что спасибо');return}
  const to=document.getElementById('pu-k-to').value, val=document.getElementById('pu-k-val').value, priv=document.getElementById('pu-k-vis').value==='priv';
  const from=ensureMe(); D.kudos.unshift({from,to,d:'2026-11-11',val,t,priv}); if(P(to)) P(to).kudos++;
  App.close(); App.toast('Спасибо отправлено: '+P(to).name+(priv?' – лично':' – в ленте команды')); go();
 };
}

App.reg('pulse',{
 title:'Пульс и признание',
 crumb:()=>'Пульс и признание',
 render(el,params){
  const t=params.tab||params.id; if(t&&TABS.some(x=>x[0]===t)) S.tab=t; if(!S.tab) S.tab='pulse';
  el.innerHTML=`<div class="scr-h"><div><div class="eyebrow">Команда · Мотивация</div><h1>Пульс и признание</h1><div class="sub">Как команда себя чувствует – только агрегаты от 5 ответов. Пульс недели 46 открыт до вс, 15 нояб.</div></div>
   <div class="acts"><button class="btn" data-a="preview">${ic('phone')}Предпросмотр опроса</button><button class="btn pr" data-a="thanks">${ic('heart')}Сказать спасибо</button></div></div>
   <div class="tabs">${TABS.map(([k,n])=>`<button data-pt="${k}">${n}</button>`).join('')}</div><div id="pu-body"></div>`;
  const body=el.querySelector('#pu-body');
  const draw=()=>{body.innerHTML=R[S.tab](); el.querySelectorAll('[data-pt]').forEach(b=>b.classList.toggle('on',b.dataset.pt===S.tab))};
  const setTab=k=>{S.tab=k;App.params={tab:k};history.replaceState(null,'','#pulse/'+k);draw();document.getElementById('notes-body').innerHTML=NOTES[k];document.getElementById('view').scrollTop=0};
  el.addEventListener('change',e=>{const s=e.target.closest('[data-a="st"]'); if(s){const a=S.actions[+s.dataset.i];a.st=s.value;App.toast(`${a.th}: ${ST[a.st][0].toLowerCase()} – владелец получит уведомление`);draw()}});
  el.addEventListener('click',e=>{
   const tb=e.target.closest('[data-pt]'); if(tb){setTab(tb.dataset.pt);return}
   const b=e.target.closest('[data-a]'); if(!b||b.tagName==='SELECT') return;
   const a=b.dataset.a, v=b.dataset.v, i=+b.dataset.i;
   if(a==='freq'){S.freq=v;draw();App.toast(v==='week'?'Каждую неделю: 3 вопроса':v==='two'?'Раз в 2 недели: 4 вопроса':'Раз в месяц: 5 вопросов – меньше риск усталости от опросов')}
   else if(a==='swap'){const w=S.week[i];w[1]=(w[1]+1)%LIB[w[0]].length;let g=0;while(S.off[w[0]+w[1]]&&g++<3)w[1]=(w[1]+1)%LIB[w[0]].length;draw();App.toast('Вопрос заменён на другой из драйвера «'+w[0]+'»')}
   else if(a==='cut'){S.cut=v;draw()}
   else if(a==='loclock') App.toast('Заблокировано: «вся компания минус магазин» = 3 удалённых человека – их ответы можно было бы вычислить');
   else if(a==='hidden') App.toast('Скрыто: в группе меньше 5 ответов. Порог нельзя понизить после запуска опроса');
   else if(a==='cell'){
    const cols=[{n:'Вся компания',v:COMPANY,all:true},...CUTS[S.cut].cols]; const c=cols[+b.dataset.c], ri=+b.dataset.r, d=DRV[ri], sc=c.v[ri];
    App.sheet(d+' · '+c.n,`<div class="row" style="margin-bottom:14px"><div class="kpi" style="flex:1"><div class="k">Средний балл</div><div class="v num">${f1(sc)}</div><div class="d">${c.all?'к прошлому месяцу '+(DELTA[ri]>=0?'+':'–')+f1(Math.abs(DELTA[ri])):'вся компания – '+f1(COMPANY[ri])}</div></div></div>
     <div class="eyebrow" style="margin-bottom:6px">Вопросы драйвера · 8 недель</div>
     ${LIB[d].map((q,k)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--hair)"><span style="flex:1">${q}</span><b class="num" style="font-weight:500">${f1(Math.min(9.6,Math.max(3,sc+[0.3,-0.4,0.1][k])))}</b></div>`).join('')}
     <div class="eyebrow" style="margin:16px 0 6px">Комментарии</div>
     ${c.all?`<p class="sm">2 комментария по драйверу – во вкладке eNPS и в темах AI.</p>`:`<p class="sm muted">Комментарии показываем только на уровне всей компании – в группе их автора легко узнать.</p>`}
     <p class="muted sm" style="margin-top:14px">Средние от 5+ ответов. Сырые ответы не хранятся рядом с именем.</p>`,
     `<button class="btn" data-close>Закрыть</button><button class="btn pr" id="pu-cell-plan">${ic('plus')}В план действий</button>`);
    document.getElementById('pu-cell-plan').onclick=()=>{addAction({th:d,src:'Пульс · '+c.n+' '+f1(sc),t:'Обсудить на собрании: что мешает по теме «'+d.toLowerCase()+'» – собрать 3 идеи',own:'eva',due:'2026-11-25',st:'plan'});App.close()};
   }
   else if(a==='drv'){S.drv=v;draw()}
   else if(a==='qoff'){const k=S.drv+i;if(S.week.some(([d,x])=>d===S.drv&&x===i)){App.toast('Вопрос уже в опросе этой недели – уберите его со следующей');return}S.off[k]=!S.off[k];draw();App.toast(S.off[k]?'Вопрос убран из ротации':'Вопрос вернулся в ротацию')}
   else if(a==='addq'){
    App.sheet('Новый вопрос',`<label class="f">Драйвер</label><select class="sel" id="pu-q-d">${DRV.map(d=>`<option ${d===S.drv?'selected':''}>${d}</option>`).join('')}</select><label class="f" style="margin-top:14px">Утверждение (шкала 0–10)</label><textarea class="ta" id="pu-q-t" placeholder="Например: «Мне хватает инструментов, чтобы делать работу хорошо»"></textarea><p class="muted sm" style="margin-top:10px">Формулируйте от первого лица, одна мысль в вопросе. Новый вопрос попадёт в ротацию со следующей недели.</p>`,`<button class="btn" data-close>Отмена</button><button class="btn pr" id="pu-q-go">Добавить</button>`);
    document.getElementById('pu-q-go').onclick=()=>{const t=document.getElementById('pu-q-t').value.trim();if(!t){App.toast('Впишите вопрос');return}const d=document.getElementById('pu-q-d').value;LIB[d].push(t);S.drv=d;App.close();draw();App.toast('Вопрос добавлен в драйвер «'+d+'»')};
   }
   else if(a==='preview'){
    App.modal('Пульс · неделя 46',`<p class="muted sm" style="margin-bottom:12px">Так опрос видят в приложении. Около минуты.</p>
     ${[['Как вы в целом?','Видит HR – чтобы вовремя предложить помощь'],...S.week.map(([d,k])=>[LIB[d][k],'Анонимно · показываем только средние от 5 человек'])].map(([q,s])=>`<div style="padding:10px 0;border-bottom:1px solid var(--hair)"><div>${q}</div><div class="row" style="gap:3px;margin:8px 0 4px;flex-wrap:wrap">${Array.from({length:11},(_,n)=>`<span style="width:26px;height:26px;border:1px solid var(--hair);display:inline-flex;align-items:center;justify-content:center;font-size:11.5px">${n}</span>`).join('')}</div><div class="muted" style="font-size:11.5px">${s}</div></div>`).join('')}
     <p class="sm" style="margin-top:10px">+ комментарий по желанию. Комментарии видны только на уровне всей компании.</p>`);
   }
   else if(a==='thanks') thanksSheet(()=>{S.tab='kudos';App.params={tab:'kudos'};history.replaceState(null,'','#pulse/kudos');draw();document.getElementById('notes-body').innerHTML=NOTES.kudos});
   else if(a==='face'){S.face=i;draw();App.toast('Ответ «'+FACE_L[i]+'» записан анонимно')}
   else if(a==='skip'){S.face=null;draw();App.toast('Пропущено – напоминаний не будет')}
   else if(a==='aftset'){
    App.sheet('Отметка после смены',`${[['Показывать после клок-аута',true],['Показывать курьеру после маршрута',true],['Поле для комментария',true],['Напоминание, если не ответил',false]].map(([t,on],k)=>`<label class="row" style="padding:10px 0;border-bottom:1px solid var(--hair);cursor:pointer"><input type="checkbox" ${on?'checked':''} ${k===3?'disabled':''}><span style="flex:1">${t}</span>${k===3?'<span class="muted sm">выкл. специально</span>':''}</label>`).join('')}
     <div class="lockbox" style="margin-top:14px">${ic('lock')}<div>Порог 5 ответов для среза по утру, дню и вечеру – фиксирован.</div></div>`,`<button class="btn" data-close>Отмена</button><button class="btn pr" data-close data-toast="Настройки отметки после смены сохранены">Сохранить</button>`);
   }
   else if(a==='eveplan'){addAction({th:'Вечерние смены',src:'После смены · вечер – тяжелее всего',t:'Поставку – на утро, к 17:00 вся упаковка и лента на столе',own:'polina',due:'2026-11-20',st:'plan'});draw()}
   else if(a==='runenps') App.toast('Опрос Q4 уже проведён – CRM запускает eNPS раз в квартал, следующий в январе');
   else if(a==='theme'){S.themeF=S.themeF===v?null:v;draw()}
   else if(a==='thall'){S.themeF=null;draw()}
   else if(a==='reply'){
    const c=COMMENTS[i];
    App.modal('Ответить анонимно',`<div class="callout info" style="margin-bottom:12px">«${c.t}»</div>
     <ul style="margin:0 0 12px 16px;font-size:13px;color:var(--graphite)"><li>Автор остаётся анонимным – вы не узнаете, кто он.</li><li>Ваш ответ подписан: <b style="font-weight:500;color:var(--ink)">${meSign()}</b>.</li><li>Доставим со случайной задержкой от 1 до 24 часов, чтобы по времени прочтения нельзя было угадать автора.</li><li>Автор может ответить – с его стороны переписка тоже анонимна.</li></ul>
     <label class="f">Ваш ответ</label><textarea class="ta" id="pu-r-t" placeholder="Спасибо, что написали. Вот что мы уже делаем…"></textarea>`,
     `<button class="btn" data-close>Отмена</button><button class="btn pr" id="pu-r-go">${ic('send')}Отправить</button>`);
    document.getElementById('pu-r-go').onclick=()=>{if(!document.getElementById('pu-r-t').value.trim()){App.toast('Напишите ответ');return}S.replied[i]=true;App.close();draw();App.toast('Ответ отправлен – придёт автору со случайной задержкой')};
   }
   else if(a==='aiplan') aiSheet(draw);
   else if(a==='addact'){
    App.sheet('Новое действие',`<label class="f">Тема</label><select class="sel" id="pu-a-th">${[...DRV,'Вечерние смены','Связь магазина и продукта'].map(d=>`<option>${d}</option>`).join('')}</select>
     <label class="f" style="margin-top:14px">Что делаем</label><textarea class="ta" id="pu-a-t" placeholder="Одно конкретное действие"></textarea>
     <label class="f" style="margin-top:14px">Владелец</label><select class="sel" id="pu-a-o">${OWNERS.map(o=>`<option value="${o}">${pname(o)}</option>`).join('')}</select>
     <label class="f" style="margin-top:14px">Срок</label><select class="sel" id="pu-a-d">${DUES.map(d=>`<option value="${d}">${fmtD(d)}</option>`).join('')}</select>
     <p class="muted sm" style="margin-top:10px">Владелец получит задачу в «Задачах».</p>`,`<button class="btn" data-close>Отмена</button><button class="btn pr" id="pu-a-go">Добавить</button>`);
    document.getElementById('pu-a-go').onclick=()=>{const t=document.getElementById('pu-a-t').value.trim();if(!t){App.toast('Опишите действие');return}addAction({th:document.getElementById('pu-a-th').value,src:'Добавлено вручную',t,own:document.getElementById('pu-a-o').value,due:document.getElementById('pu-a-d').value,st:'plan'});App.close();draw()};
   }
   else if(a==='tell'){
    const xs=S.actions.filter(x=>x.st!=='plan'); if(!xs.length){App.toast('Сначала возьмите хотя бы одно действие в работу');return}
    App.modal('Вы сказали – мы сделали',`<p class="muted sm" style="margin-bottom:10px">Черновик объявления по итогам опроса Q4 и пульса. Без цитат и цифр по маленьким группам.</p>
     ${xs.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--hair)"><div class="muted sm">Вы сказали: ${x.th.toLowerCase()}</div><div class="row" style="align-items:flex-start;margin-top:3px"><span style="flex:1">Мы: ${x.t}</span>${H.chip(ST[x.st][0],ST[x.st][1])}</div></div>`).join('')}
     <p class="sm" style="margin-top:10px">Спасибо всем, кто ответил – ${D.enps.n} человек. Следующий пульс – в понедельник.</p>`,
     `<button class="btn" data-close>Отмена</button><button class="btn pr" id="pu-pub">${ic('send')}Опубликовать в «Объявления»</button>`);
    document.getElementById('pu-pub').onclick=()=>{S.pub=true;App.close();draw();App.toast('Опубликовано в «Объявления» – всем придёт пуш в приложении')};
   }
   else if(a==='kv'){S.kv=v;draw()}

 onb:`<h4>Что это</h4><p>План первых 90 дней по шаблону: пункты с владельцами, напарник, встречи на 7/30/45/90 день, прогресс.</p><h4>Зачем HR</h4><p>Сейчас онбординг – это набор уроков и чекпоинты напарника, без общего плана и ответственных. Половина уходов – в первые месяцы.</p><h4>Откуда идея</h4><p><span class="src">HiBob – task lists</span><span class="src">Personio – шаблоны по типу занятости</span><span class="src">CharlieHR</span><span class="src">Humaans</span></p><h4>Данные из нашей CRM</h4><p>Уже есть: «Напарник» с чекпоинтами, онбординг-уроки, договор с подписью, резерв с проверкой права на работу, тур по приложению.</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span></p>`,
 prob:`<h4>Что это</h4><p>Трекер окончания испытательного срока и ревью, шкала до 6 месяцев.</p><h4>Зачем HR</h4><p>С 1 янв 2027 защита от необоснованного увольнения начинается после 6 месяцев (Employment Rights Act 2025). Решение о прохождении нужно принять до этой отметки – CRM напоминает на 5-м месяце.</p><h4>Откуда идея</h4><p><span class="src">CharlieHR – шаблон ревью пробации</span><span class="src">Personio – длина пробации</span></p><h4>Данные из нашей CRM</h4><p>Дата найма и тип занятости из профиля (защита – только у employee), матрица навыков и замер знаний – для критериев ревью.</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span></p>`,
 docs:`<h4>Что это</h4><p>Сводный трекер проверок: право на работу, права и страховка курьеров, сертификаты.</p><h4>Зачем HR</h4><p>Работа без действующей проверки права на работу – штраф; просроченные права или страховка – незастрахованная доставка.</p><h4>Откуда идея</h4><p><span class="src">Sage HR – right to work</span><span class="src">HiBob – конфиденциальные папки</span><span class="src">Deputy – сертификаты как допуск к сменам</span></p><h4>Данные из нашей CRM</h4><p>Уже есть: проверка права на работу в резерве и у курьеров, сроки сертификатов в обучении, договоры с подписью. Новое – одна таблица со статусами.</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span></p><h4>Доступы</h4><p>Копии – HR и админ. Реквизиты и налоги – только админ.</p>`,
 abs:`<h4>Что это</h4><p>Типы отсутствий поверх «Отпуска», календарь месяца, разговор после болезни, Bradford factor только для HR.</p><h4>Зачем HR</h4><p>Сейчас в «Отпуске» только отпуск – больничные и отгулы по уходу нигде не видны, разговоров после болезни нет.</p><h4>Откуда идея</h4><p><span class="src">Breathe – fit notes и шаблон разговора</span><span class="src">BrightHR – Bradford</span><span class="src">Ciphr – уход за близкими не в Bradford</span><span class="src">ICO – факт отсутствия вместо диагноза</span></p><h4>Данные из нашей CRM</h4><p>«Отпуск» с одобрением, «График», отметки прихода и ухода со смены.</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span> типы и журнал · <span class="pri p2">Следующий шаг</span> Bradford</p>`,
 exit:`<h4>Что это</h4><p>Чек-лист ухода, шаблон exit-интервью, причины ухода за год.</p><h4>Зачем HR</h4><p>Сейчас в CRM нет дат и причин ухода – текучесть не считается. Уход без чек-листа – это забытые доступы и ключи.</p><h4>Откуда идея</h4><p><span class="src">CharlieHR – offboarding</span><span class="src">Personio – шаги от последнего дня</span><span class="src">Lattice – exit-опрос идентифицируемый</span></p><h4>Данные из нашей CRM</h4><p>Активность учётки, дата ухода из «Графика», приглашения и доступы.</p><h4>Приоритет</h4><p><span class="pri p2">Следующий шаг</span></p>`,
 cal:`<h4>Что это</h4><p>Все кадровые даты одним списком по месяцам: дни рождения, годовщины, проверки документов, ревью, отпуска.</p><h4>Зачем HR</h4><p>Ничего не пропустить: поздравить, вовремя проверить документ, подготовить ревью.</p><h4>Откуда идея</h4><p><span class="src">BambooHR – who's out и celebrations</span><span class="src">HiBob</span></p><h4>Данные из нашей CRM</h4><p>День рождения и дата найма из профиля, «Дни заботы», «Отпуск», сроки документов.</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span></p>`
};

function ciSheet(pid,i){
 const p=P(pid),c=J[pid].ci[i],done=dd(c[1])<dd(today);
 App.sheet(c[0]+' · '+p.name,`<div class="row" style="margin-bottom:14px">${H.chip(done?'проведена':'запланирована '+fmtD(c[1]),done?'ok':'info')}${H.vis('shared')}</div>
  ${['Что оказалось не так, как ожидал(а)?','Хватает ли доступов, инструментов, информации?','Как работается с напарником?','Что одно мы можем улучшить уже сейчас?','Адаптация по ощущениям: 1–5'].map(q=>`<div style="padding:10px 0;border-bottom:1px solid var(--hair)"><div>${q}</div>${done?`<div class="muted sm" style="margin-top:4px">Ответ записан на встрече</div>`:''}</div>`).join('')}
  <p class="muted sm" style="margin-top:12px">Встреча идентифицируемая: ответы видит сотрудник, HR и руководитель.</p>`,
  `<button class="btn" data-close>Закрыть</button><button class="btn pr" data-go="oneonones">${ic('chat')}Открыть в 1:1</button>`);
}

App.reg('lifecycle',{

 crumb:()=>'Онбординг и даты',
 render(el,params){
  const t=params.tab||params.id; if(t&&TABS.some(x=>x[0]===t)) S.tab=t; if(!S.tab) S.tab='onb';
  el.innerHTML=`<div class="scr-h"><div><div class="eyebrow">Команда · жизненный цикл</div><h1>Онбординг и даты</h1><div class="sub">Первые 90 дней, испытательный срок, документы, отсутствия, уход и календарь кадровых дат</div></div>
   <div class="acts"><button class="btn" data-a="tocal">${ic('cal')}Ближайшие даты</button><button class="btn pr" data-a="startonb">${ic('plus')}Запустить онбординг</button></div></div>
   <div class="tabs">${TABS.map(([k,n])=>`<button data-lt="${k}">${n}</button>`).join('')}</div><div id="lc-body"></div>`;
  const body=el.querySelector('#lc-body');
  const draw=()=>{body.innerHTML=R[S.tab]();el.querySelectorAll('[data-lt]').forEach(b=>b.classList.toggle('on',b.dataset.lt===S.tab))};
  const setTab=k=>{S.tab=k;App.params={tab:k};history.replaceState(null,'','#lifecycle/'+k);draw();document.getElementById('notes-body').innerHTML=NOTES[k];document.getElementById('view').scrollTop=0};
  el.addEventListener('change',e=>{if(e.target.id==='lc-tpl'){S.tpl[S.j]=e.target.value;draw()}});
  el.addEventListener('click',e=>{
   const tb=e.target.closest('[data-lt]'); if(tb){setTab(tb.dataset.lt);return}
   if(e.target.closest('[data-person],[data-go]')) return;
   const b=e.target.closest('[data-a]'); if(!b||b.tagName==='SELECT') return;
   const a=b.dataset.a,v=b.dataset.v,i=+b.dataset.i;
   if(a==='pick'){S.j=b.dataset.id;draw();const c=el.querySelector('#lc-tpl');if(c)c.closest('.card').scrollIntoView({behavior:'smooth',block:'start'})}
   else if(a==='ci'){e.stopPropagation();ciSheet(b.dataset.id,i)}
   else if(a==='chk'){const t=S.tpl[S.j]||J[S.j].tpl,k=S.j+':'+t,set=S.doneSets[k]||(S.doneSets[k]=new Set());set.has(i)?set.delete(i):set.add(i);draw()}
   else if(a==='applytpl'){J[S.j].tpl=S.tpl[S.j];App.toast('Шаблон «'+TPL[J[S.j].tpl].n+'» применён – владельцы получат задачи');draw()}
   else if(a==='additem'){
    const t=S.tpl[S.j]||J[S.j].tpl;
    App.sheet('Новый пункт · '+TPL[t].n,`<label class="f">Период</label><select class="sel" id="lc-i-g">${TPL[t].g.map((g,k)=>`<option value="${k}">${g[0]}</option>`).join('')}</select><label class="f" style="margin-top:14px">Что сделать</label><input class="inp" id="lc-i-t" placeholder="Например: показать, где лежат расходники"><label class="f" style="margin-top:14px">Кто отвечает</label><select class="sel" id="lc-i-o">${Object.entries(OWN).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><p class="muted sm" style="margin-top:10px">Пункт добавится в шаблон – для всех будущих онбордингов.</p>`,`<button class="btn" data-close>Отмена</button><button class="btn pr" id="lc-i-go">Добавить</button>`);
    document.getElementById('lc-i-go').onclick=()=>{const tx=document.getElementById('lc-i-t').value.trim();if(!tx){App.toast('Опишите пункт');return}
     const g=+document.getElementById('lc-i-g').value; let pos=0; for(let k=0;k<=g;k++) pos+=TPL[t].g[k][1].length;
     Object.keys(S.doneSets).filter(k=>k.endsWith(':'+t)).forEach(k=>{S.doneSets[k]=new Set([...S.doneSets[k]].map(x=>x>=pos?x+1:x))});
     Object.keys(OVERDUE).filter(k=>k.endsWith(':'+t)&&OVERDUE[k]>=pos).forEach(k=>OVERDUE[k]++);
     TPL[t].g[g][1].push([tx,document.getElementById('lc-i-o').value]);App.close();draw();App.toast('Пункт добавлен в шаблон «'+TPL[t].n+'»')};
   }
   else if(a==='startonb'){
    App.sheet('Запустить онбординг',`<label class="f">Кто выходит</label><select class="sel"><option>Кандидат из «Найма» – оффер принят</option><option>Человек из резерва</option></select>
     <label class="f" style="margin-top:14px">Шаблон</label><select class="sel" id="lc-o-t">${TPLKEY.map(k=>`<option value="${k}">${TPL[k].n}</option>`).join('')}</select>
     <label class="f" style="margin-top:14px">Напарник</label><select class="sel">${D.people.filter(p=>p.tags.includes('Наставник')||p.lvl>=3).map(p=>`<option>${p.name}</option>`).join('')}</select>
     <label class="f" style="margin-top:14px">Первый день</label><select class="sel">${['2026-11-16','2026-11-23','2026-11-30','2026-12-07'].map(d=>`<option>${fmtD(d)}</option>`).join('')}</select>
     <p class="muted sm" style="margin-top:12px">Пункты «До выхода» уйдут владельцам сразу, встречи 7/30/45/90 встанут в календарь HR.</p>`,`<button class="btn" data-close>Отмена</button><button class="btn pr" id="lc-o-go">Запустить</button>`);
    document.getElementById('lc-o-go').onclick=()=>{const t=document.getElementById('lc-o-t').value;App.close();App.toast('Онбординг запущен: '+flat(t).length+' пунктов по шаблону «'+TPL[t].n+'», задачи ушли владельцам')};
   }
   else if(a==='tocal'){S.cal='all';setTab('cal');const f=el.querySelector('.ev:not(.past)');if(f)f.scrollIntoView({block:'center'})}
   else if(a==='toonb'){S.j='denis';setTab('onb')}
   else if(a==='rem'){S.rem=!S.rem;draw();App.toast(S.rem?'Напоминание на 5-м месяце включено для всех employee':'Напоминание выключено – решение о прохождении легко пропустить')}
   else if(a==='probdoc'){const p=P(b.dataset.id);App.toast(p.name+': испытательный пройден, итог подписан руководителем и сотрудником')}
   else if(a==='review'){
    const p=P('alina');
    App.sheet('Ревью испытательного · Alina Moroz',`<div class="row" style="margin-bottom:12px">${H.chip('ревью '+fmtD(p.probEnd),'warn')}${H.vis('mgr')}</div>
     <div class="eyebrow" style="margin-bottom:6px">Критерии из CRM</div>
     ${[['6 базовых стилей','4 из 6 подтверждены наставником','warn'],['Утренняя волна без переделок','да, 6 нояб – отметила Polina','ok'],['Опоздания за 3 месяца','1','ok'],['Обучение','8 из 12 уроков','warn'],['Пульс по 1:1','стабильно 7–8','ok']].map(([k,v,c])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--hair)"><span style="flex:1">${k}</span>${H.chip(v,c)}</div>`).join('')}
     <label class="f" style="margin-top:16px">Отзыв напарника (Mila Novak)</label><textarea class="ta" placeholder="Что получается, над чем работать"></textarea>
     <label class="f" style="margin-top:14px">Решение</label>
     ${[['pass','Пройден'],['ext','Продлить на 4 недели – с причиной и планом'],['fail','Не пройден – только после разговора, письменно']].map(([k,t],n)=>`<label class="row" style="padding:6px 0;cursor:pointer"><input type="radio" name="lc-dec" value="${k}" ${n===0?'checked':''}><span>${t}</span></label>`).join('')}
     <div class="callout" style="margin-top:10px">Продление тоже должно закончиться до ${fmtY(addMonths(p.start,6))} – после 6 месяцев действует защита от необоснованного увольнения.</div>`,
     `<button class="btn" data-close>Отмена</button><button class="btn" data-close data-toast="Черновик ревью сохранён – видят HR и руководитель">Сохранить черновик</button><button class="btn pr" data-close data-toast="Встреча-ревью 23 нояб назначена: Alina, Polina, HR">Назначить встречу</button>`);
   }
   else if(a==='dk'){S.docK=v;draw()}
   else if(a==='ds'){S.docS=S.docS===v?null:v;draw()}
   else if(a==='docok'){e.stopPropagation();const d=DOCS[i];d.checked=today;if(d.next&&d.next!=='na')d.next=addMonths(today,12);draw();App.toast(P(d.who).name+': «'+d.name+'» – проверка отмечена сегодня, копия в защищённой папке')}
   else if(a==='doc'){
    const d=DOCS[i],p=P(d.who),st=dstat(d);
    App.sheet(d.name,`<div class="row" style="margin-bottom:14px">${H.av(p)}<div><b style="font-weight:500">${p.name}</b><div class="muted sm">${p.role} · ${H.type(p)}</div></div><span class="sp"></span>${H.chip(DS[st][0],DS[st][1])}</div>
     ${[['Способ',d.method],['Проверено',d.checked?fmtY(d.checked):'—'],['Кто проверял',d.by?pname(d.by):'—'],['Следующая проверка',d.next==='na'?'не требуется':d.next?fmtY(d.next):'бессрочно'],['Копия',d.checked?'PDF в защищённой папке – HR и админ':'—'],['Храним',d.kind==='rtw'?'2 года после ухода':'пока действует + 1 год']].map(([k,v])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--hair)"><span class="muted" style="width:150px">${k}</span><span style="flex:1">${v}</span></div>`).join('')}
     ${d.kind==='rtw'&&st!=='na'?`<p class="muted sm" style="margin-top:12px">Способы проверки: оригинал документа при сотруднике, share code онлайн или цифровой провайдер. Скан без проверки не считается.</p>`:''}`,
     st==='na'?'<button class="btn" data-close>Закрыть</button>':`<button class="btn" data-close data-toast="Сотруднику ушла задача в приложении: прислать документ или share code">Запросить у сотрудника</button><button class="btn pr" id="lc-d-ok">${ic('check')}Отметить проверку</button>`);
    const ok=document.getElementById('lc-d-ok'); if(ok) ok.onclick=()=>{d.checked=today;if(d.next&&d.next!=='na')d.next=addMonths(today,12);App.close();draw();App.toast('Проверка отмечена сегодня')};
   }
   else if(a==='addabs'){
    App.sheet('Отметить отсутствие',`<label class="f">Кто</label><select class="sel" id="lc-a-p">${D.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
     <label class="f" style="margin-top:14px">Тип</label><select class="sel" id="lc-a-t">${Object.entries(AT).map(([k,[t]])=>`<option value="${k}">${t}</option>`).join('')}</select>
     <div class="grid g2" style="margin-top:14px"><div><label class="f">С</label><select class="sel" id="lc-a-f">${Array.from({length:30},(_,n)=>`<option value="${n+1}" ${n+1===12?'selected':''}>${n+1} нояб</option>`).join('')}</select></div><div><label class="f">По</label><select class="sel" id="lc-a-to">${Array.from({length:30},(_,n)=>`<option value="${n+1}" ${n+1===12?'selected':''}>${n+1} нояб</option>`).join('')}</select></div></div>
     <label class="f" style="margin-top:14px">Оформление</label><select class="sel" id="lc-a-c"><option value="">Не нужно</option><option value="self">Самосертификация (до 7 дней)</option><option value="fit">Fit note – загрузить в защищённую папку</option></select>

     <div class="callout info" style="margin-top:12px">Храним факт отсутствия, не диагноз. После больничного CRM предложит разговор о возвращении.</div>`,
     `<button class="btn" data-close>Отмена</button><button class="btn pr" id="lc-a-go">Сохранить</button>`);

   else if(a==='rtw'){
    const r=ABS[i],p=P(r.id);
    App.sheet('Разговор после отсутствия',`<div class="row" style="margin-bottom:12px">${H.av(p)}<div><b style="font-weight:500">${p.name}</b><div class="muted sm">${AT[r.type][0]} · ${fmtD(r.from)}${r.to!==r.from?' – '+fmtD(r.to):''}</div></div><span class="sp"></span>${H.vis('hr')}</div>
     ${['Как самочувствие, готов(а) ли вернуться к обычным задачам','Есть ли рекомендации в fit note: меньше часов, лёгкие задачи – договориться о плане','Нужна ли поддержка: постепенный выход, другой график, перерывы','Связано ли с работой (нагрузка, травма, тяжести) – если да, оценить риски','Рассказать, что изменилось за время отсутствия','Зафиксировать договорённости и дату следующего разговора'].map((q,n)=>`<label class="row" style="padding:8px 0;border-bottom:1px solid var(--hair);cursor:pointer;align-items:flex-start"><input type="checkbox" class="lc-rtw" style="margin-top:3px"><span>${q}</span></label>`).join('')}
     <label class="f" style="margin-top:14px">Договорённости</label><textarea class="ta" placeholder="Только договорённости. Диагноз не записываем."></textarea>

    document.getElementById('lc-rtw-go').onclick=()=>{r.rtw='done';App.close();draw();App.toast('Разговор отмечен. Запись видят только HR и сотрудник по запросу')};

   }
  });

 },
 notes:()=>NOTES[S.tab||'onb']

<script>
(()=>{

const DAY=864e5;
const LEAV=[ // fictional leavers, anonymous: only month, team, tenure
 {start:'2025-10-06',left:'2026-02-27',team:'delivery',why:'Переезд'},
