<style>
#s-analytics .an-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
#s-analytics .an-f .sel{width:auto;min-width:210px;height:32px}
#s-analytics .an-kpis{margin-bottom:16px}
#s-analytics .kpi .v small{font-size:15px;color:var(--grey);margin-left:2px}
#s-analytics .kpi.hid .v{color:var(--light)}
#s-analytics .an-row{margin-bottom:16px}
#s-analytics .cap{font-size:11.5px;color:var(--grey);margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;line-height:1.5}
#s-analytics .cap code,#s-analytics .sg code{font-family:inherit;font-size:11px;background:var(--silver);padding:1px 6px;color:var(--graphite)}
#s-analytics svg.ch{width:100%;height:auto;display:block;overflow:visible}
#s-analytics svg.ch text{font-family:var(--f-body);font-size:11px;fill:var(--grey)}
#s-analytics svg.ch text.v{fill:var(--ink);font-size:11.5px}
#s-analytics svg.ch text.vb{fill:var(--ink);font-size:12px;font-weight:500}
#s-analytics svg.ch .m{transition:opacity var(--m-fast)}
#s-analytics svg.ch .m:hover,#s-analytics svg.ch g.clk:hover .m{opacity:.72}
#s-analytics svg.ch g.clk{cursor:pointer}
#s-analytics .mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#s-analytics .mini > div{border:1px solid var(--hair);padding:10px 12px}
#s-analytics .mini .t{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--graphite)}
#s-analytics .mini .t b{font-family:var(--f-display);font-size:24px;font-weight:500;color:var(--ink);margin-left:auto}
#s-analytics .mini .lockbox{padding:10px;font-size:12px;margin-top:6px}
#s-analytics .lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--grey);margin-top:8px;align-items:center}
#s-analytics .lgd i{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-2px;border:1px solid var(--hair)}
#s-analytics .plist .pr{display:grid;grid-template-columns:minmax(120px,170px) 1fr 74px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--hair);cursor:pointer}
#s-analytics .plist .pr:hover{background:var(--silver)}
#s-analytics .plist .pr .nm{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#s-analytics .plist .pr .vv{text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}
#s-analytics .sg{width:100%;border-collapse:collapse;font-size:13px}
#s-analytics .sg th{text-align:left;font-weight:400;font-size:10.5px;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--grey);padding:0 12px;height:36px;border-bottom:1px solid var(--hair);white-space:nowrap}
#s-analytics .sg td{padding:10px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
#s-analytics .sg td.rl{min-width:220px}
#s-analytics .sg .thr{display:flex;align-items:center;gap:6px;white-space:nowrap}
#s-analytics .sg .thr input{width:58px;height:30px;text-align:center;padding:0 4px}
#s-analytics .sg .who{display:flex;gap:4px;flex-wrap:wrap;min-width:120px}
#s-analytics .sg .who .av{cursor:pointer}
#s-analytics .sg .ex{color:var(--graphite);font-size:12.5px;min-width:240px}
#s-analytics .ovx{overflow:auto}
#s-analytics .ch .r .chip{height:20px;font-size:10.5px}
@media (max-width:900px){#s-analytics .mini{grid-template-columns:1fr}#s-analytics .plist .pr{grid-template-columns:110px 1fr 64px}}
</style>
<script>
(()=>{
window.HRX=window.HRX||{audit:[]};
const DAY=864e5;
const LEAV=[ // fictional leavers, anonymous: only month, team, tenure
 {start:'2025-10-06',left:'2026-02-27',team:'delivery',why:'Переезд'},
 {start:'2026-01-12',left:'2026-03-20',team:'studio',why:'Ушла в другую сферу (ранний уход < 90 дн)'},
 {start:'2024-05-01',left:'2026-07-31',team:'shop',why:'Учёба'}
];
// overtime hours above the rota, last 8 weeks (clock-in vs rota)
const OT={mila:[0,1,0,2,1,1,2,1],daria:[0,0,1,0,1,0,1,1],nika:[0,1,1,2,1,4,4,5],alina:[0,0,0,0,0,0,0,0],yana:[0,0,0,0,0,0,0,0],polina:[1,2,1,2,2,3,3,3],irina:[2,1,2,1,1,2,1,2],kira:[0,1,0,0,1,0,1,0],ruslan:[1,0,1,1,0,1,1,1],jake:[0,0,0,0,0,0,0,0],bogdan:[1,1,0,1,0,1,1,0]};
const WEEKS=['16 сен','23 сен','30 сен','7 окт','14 окт','21 окт','28 окт','4 нояб'];
const LASTK={mila:'2026-11-05',daria:'2026-11-04',nika:'2026-09-14',alina:'2026-11-10',yana:'2026-09-25',polina:'2026-11-08',irina:'2026-10-22',kira:'2026-11-06',ruslan:'2026-11-09',jake:'2026-08-21',bogdan:'2026-10-16',artem:'2026-11-07',vera:'2026-10-28',denis:'2026-10-20'};
const OVERDUE={nika:21,jake:34,ruslan:9}; // days overdue on assigned lessons
const LATEMIN={studio:7,delivery:11,shop:6};
const CADD=(p)=>/Еженед/.test(p.cad)?7:/2 недел/.test(p.cad)?14:30;
const sinceLast=(p)=>daysBetween(dd(p.last),NOW);
const lastKudos=(p)=>{const k=D.kudos.filter(x=>x.to===p.id).map(x=>x.d).sort().pop();const a=LASTK[p.id]||'2026-01-01';return k&&k>a?k:a};
const PER={m:{t:'30 дней',days:30,abs:1,pk:2,months:1},q:{t:'Квартал',days:91,abs:2.6,pk:3,months:3},y:{t:'Год',days:365,abs:9.1,pk:6,months:12}};
const st={per:'q',team:'all',thr:{pulse:3,ot:3,one:2,kudos:60,train:14,prob:14,late:3}};
const fx=(n,d=1)=>n.toFixed(d).replace('.',',');
const pct=(a,b)=>b?Math.round(a/b*100):0;
const cap=(src,extra='')=>`<div class="cap">${ic('link')}<span>Источник в CRM:</span>${src.map(s=>`<code>${s}</code>`).join('')}${extra?`<span>· ${extra}</span>`:''}</div>`;
const people=()=>st.team==='all'?D.people:D.people.filter(p=>p.team===st.team);

/* ---------- rules: transparent, editable thresholds ---------- */
const RULES=[
 {k:'pulse',t:'Пульс упал',u:'пунктов за 4 недели',pre:'≥',src:'оценки после смены',
  f:(p,x)=>{const a=p.pulse;if(!a||a.length<2)return null;const b=a[Math.max(0,a.length-5)],l=a[a.length-1];return b-l>=x?`${b} → ${l} за 4 недели`:null}},
 {k:'ot',t:'Переработка',u:'ч сверх графика в неделю, 3 недели подряд',pre:'≥',src:'клок-ин и график смен',
  f:(p,x)=>{const o=OT[p.id];if(!o)return null;const l=o.slice(-3);return l.every(v=>v>=x)?`${l.join(' + ')} = ${l.reduce((a,b)=>a+b,0)} ч за 3 недели`:null}},
 {k:'one',t:'Нет 1:1 дольше',u:'× ритма',pre:'>',src:'встречи 1:1',
  f:(p,x)=>{const s=sinceLast(p),c=CADD(p);return s>x*c?`${s} дн. при ритме ${c} дн.`:null}},
 {k:'kudos',t:'Нет благодарностей',u:'дней',pre:'≥',src:'благодарности',
  f:(p,x)=>{const n=daysBetween(dd(lastKudos(p)),NOW);return n>=x?`последняя ${n} дн. назад`:null}},
 {k:'train',t:'Обучение просрочено',u:'дней',pre:'>',src:'назначенные уроки',
  f:(p,x)=>OVERDUE[p.id]>x?`урок просрочен на ${OVERDUE[p.id]} дн.`:null},
 {k:'prob',t:'Испытательный кончается через',u:'дней',pre:'≤',src:'дата конца испытательного (новое)',
  f:(p,x)=>{if(!p.probEnd)return null;const n=daysBetween(NOW,dd(p.probEnd));return n>=0&&n<=x?`ревью ${fmtD(p.probEnd)} – через ${n} дн.`:null}},
 {k:'late',t:'Опоздания за месяц',u:'раз и больше',pre:'≥',src:'клок-ин и график смен (новый расчёт)',
  f:(p,x)=>p.att&&p.att.late!=null&&p.att.late>=x?`${p.att.late} опоздания из ${p.att.shifts} смен`:null}
];
const fired=(r)=>people().map(p=>({p,why:r.f(p,st.thr[r.k])})).filter(x=>x.why);

/* ---------- charts ---------- */
function chHeadcount(){
 const ps=people(), lv=LEAV.filter(l=>st.team==='all'||l.team===st.team);
 const months=[];for(let i=11;i>=0;i--){const d=new Date(Date.UTC(2026,10-i,1));months.push(d)}
 const lab=(d)=>d.toLocaleDateString('ru-RU',{month:'short',timeZone:'UTC'}).replace('.','');
 const rows=months.map((m,i)=>{
  const end=i===11?NOW:new Date(Date.UTC(m.getUTCFullYear(),m.getUTCMonth()+1,0,23));
  const ym=m.toISOString().slice(0,7);
  const hc=ps.filter(p=>dd(p.start)<=end).length+lv.filter(l=>dd(l.start)<=end&&dd(l.left)>end).length;
  return {l:lab(m),hc,hi:ps.filter(p=>p.start.slice(0,7)===ym).length+lv.filter(l=>l.start.slice(0,7)===ym).length,lo:lv.filter(l=>l.left.slice(0,7)===ym).length,win:i>=12-PER[st.per].months,ym}});
 const W=560,HT=190,base=130,max=Math.max(...rows.map(r=>r.hc),1),sl=(W-20)/12,bw=Math.min(24,sl*.5);
 let s=`<svg class="ch" viewBox="0 0 ${W} ${HT}" role="img" aria-label="Численность по месяцам">`;
 const win=rows.filter(r=>r.win);const x0=10+rows.indexOf(win[0])*sl;
 s+=`<rect x="${x0}" y="4" width="${win.length*sl}" height="${base-4}" fill="var(--silver)"/><text x="${x0+4}" y="16">${PER[st.per].t}</text>`;
 s+=`<line x1="10" x2="${W-10}" y1="${base}" y2="${base}" stroke="var(--light)"/>`;
 rows.forEach((r,i)=>{const cx=10+i*sl+sl/2,h=r.hc/max*(base-30);
  s+=`<g><title>${r.l}: ${r.hc} чел. · пришли ${r.hi} · ушли ${r.lo}</title><rect class="m" x="${cx-bw/2}" y="${base-h}" width="${bw}" height="${h}" fill="${r.win?'var(--v1)':'var(--v4)'}"/><rect x="${cx-sl/2}" y="4" width="${sl}" height="${HT-8}" fill="transparent"/>
  <text class="v" x="${cx}" y="${base-h-5}" text-anchor="middle">${r.hc}</text><text x="${cx}" y="${base+15}" text-anchor="middle">${r.l}</text>
  ${r.hi?`<text x="${cx}" y="${base+36}" text-anchor="middle" style="fill:var(--ok)">+${r.hi}</text>`:''}${r.lo?`<text x="${cx}" y="${base+54}" text-anchor="middle" style="fill:var(--accent-dark)">−${r.lo}</text>`:''}</g>`});
 s+=`<text x="${W-10}" y="${base+36}" text-anchor="end" style="font-size:10px">пришли</text><text x="${W-10}" y="${base+54}" text-anchor="end" style="font-size:10px">ушли</text></svg>`;
 return s+`<div class="lgd"><span><i style="background:var(--v1);border-color:var(--v1)"></i>период</span><span><i style="background:var(--v4);border-color:var(--v4)"></i>до периода</span><span>уходы без имён – только месяц и команда</span></div>`+cap(['даты найма','уходы из графика','карточки сотрудников']);
}
function chTenure(){
 const ps=people();const B=[['< 3 мес',0,3],['3–12 мес',3,12],['1–2 г',12,24],['2–3 г',24,36],['3 г +',36,999]];
 const rows=B.map(([l,a,b])=>{const xs=ps.filter(p=>{const m=daysBetween(dd(p.start),NOW)/30.4;return m>=a&&m<b});return{l,n:xs.length,names:xs.map(p=>p.name.split(' ')[0]).join(', ')}});
 const W=560,HT=170,base=140,max=Math.max(...rows.map(r=>r.n),1),sl=(W-20)/rows.length,bw=Math.min(56,sl*.45);
 let s=`<svg class="ch" viewBox="0 0 ${W} ${HT}" role="img" aria-label="Распределение стажа"><line x1="10" x2="${W-10}" y1="${base}" y2="${base}" stroke="var(--light)"/>`;
 rows.forEach((r,i)=>{const cx=10+i*sl+sl/2,h=r.n/max*(base-34);
  s+=`<g><title>${r.l}: ${r.n} чел.${r.names?' – '+r.names:''}</title><rect class="m" x="${cx-bw/2}" y="${base-h}" width="${bw}" height="${Math.max(h,0)}" fill="var(--v3)"/><rect x="${cx-sl/2}" y="0" width="${sl}" height="${HT}" fill="transparent"/><text class="vb" x="${cx}" y="${base-h-6}" text-anchor="middle">${r.n}</text><text x="${cx}" y="${base+16}" text-anchor="middle">${r.l}</text></g>`});
 const early=ps.filter(p=>daysBetween(dd(p.start),NOW)<90).length;
 return s+`</svg><div class="lgd"><span>Первые 90 дней – зона риска раннего ухода: сейчас ${early} ${plural(early,'человек','человека','человек')}</span></div>`+cap(['даты найма']);
}
function chPulse(){
 const T=D.pulseTeam,n={studio:6,delivery:3,shop:2,tech:3};
 const avg=(keys)=>T.weeks.map((_,i)=>{let s=0,c=0;keys.forEach(k=>{s+=T[k][i]*n[k];c+=n[k]});return s/c});
 let G=[{t:'Вся компания',v:avg(['studio','delivery','shop','tech']),n:14,ks:['studio','delivery','shop','tech']},{t:'Студия',v:T.studio,n:6,ks:['studio']},{t:'Доставка + магазин',v:avg(['delivery','shop']),n:5,ks:['delivery','shop'],x:'объединены: по отдельности меньше 5'},{t:'Продукт и разработка',v:null,n:3,ks:['tech']}];
 if(st.team!=='all')G=G.filter((g,i)=>i===0||g.ks.includes(st.team));
 const W=220,HT=70,y=(v)=>HT-6-((v-6)/3)*(HT-14);
 const mini=(g)=>{if(!g.v||g.n<5)return `<div><div class="t">${g.t}<span class="muted sm">n = ${g.n}</span></div><div class="lockbox">${ic('lock')}<span>Меньше 5 человек – срез скрыт. Входит в общий итог компании.</span></div></div>`;
  const pts=g.v.map((v,i)=>`${(8+i*(W-16)/7).toFixed(1)},${y(v).toFixed(1)}`).join(' ');const l=g.v[g.v.length-1],d=l-g.v[0];
  return `<div><div class="t">${g.t}<span class="muted sm">n = ${g.n}</span><b>${fx(l)}</b></div><svg class="ch" viewBox="0 0 ${W} ${HT}"><line x1="8" x2="${W-8}" y1="${y(7)}" y2="${y(7)}" stroke="var(--hair)" stroke-dasharray="3 3"/><text x="${W-8}" y="${y(7)-3}" text-anchor="end" style="font-size:9px">7</text><polyline points="${pts}" fill="none" stroke="${H.pulseColor(l)}" stroke-width="2"/>${g.v.map((v,i)=>`<g><title>${WEEKS[i]}: ${fx(v)}</title><circle cx="${8+i*(W-16)/7}" cy="${y(v)}" r="${i===7?4:2.5}" fill="${i===7?H.pulseColor(l):'var(--paper)'}" stroke="${H.pulseColor(l)}" stroke-width="1.5"/></g>`).join('')}</svg><div class="muted sm">${d>=0?'+':'−'}${fx(Math.abs(d))} за 8 недель${g.x?' · '+g.x:''}</div></div>`};
 return `<div class="mini">${G.map(mini).join('')}</div><div class="lgd"><span>Шкала 6–9 одинаковая у всех графиков</span><span>Срезы < 5 человек скрыты – график можно показывать руководителям</span></div>`+cap(['оценки после смены (новое)','участие в eNPS']);
}
function chPunct(){
 const T=['studio','delivery','shop'].filter(t=>st.team==='all'||st.team===t);
 const rows=T.map(t=>{const ps=D.people.filter(p=>p.team===t&&p.att&&p.att.shifts);const sh=ps.reduce((a,p)=>a+p.att.shifts,0),lt=ps.reduce((a,p)=>a+p.att.late,0);return{t,sh,lt,v:sh?(1-lt/sh)*100:0}});
 if(!rows.length)return `<div class="lockbox">${ic('clock')}<span>У команды «${D.teams[st.team]}» нет смен и клок-ина – удалённые работают по задачам. Пунктуальность не считается; вместо неё – задачи в срок.</span></div>`+cap(['задачи и их приёмка']);
 const W=560,X=(v)=>140+(v-80)/20*(W-170),HT=rows.length*44+34;
 let s=`<svg class="ch" viewBox="0 0 ${W} ${HT}" role="img" aria-label="Пунктуальность по командам">`;
 [80,85,90,95,100].forEach(v=>{s+=`<line x1="${X(v)}" x2="${X(v)}" y1="6" y2="${HT-24}" stroke="${v===95?'var(--ok)':'var(--hair)'}" ${v===95?'stroke-dasharray="4 3"':''}/><text x="${X(v)}" y="${HT-8}" text-anchor="middle">${v} %</text>`});
 s+=`<text x="${X(95)+4}" y="14" style="fill:var(--ok);font-size:10px">цель 95 %</text>`;
 rows.forEach((r,i)=>{const cy=28+i*44;s+=`<g><title>${D.teams[r.t]}: вовремя ${fx(r.v)} % · опозданий ${r.lt} из ${r.sh} смен · в среднем ${LATEMIN[r.t]} мин</title><rect x="0" y="${cy-18}" width="${W}" height="36" fill="transparent"/><text class="v" x="0" y="${cy+4}">${D.teams[r.t]}</text><line x1="${X(80)}" x2="${X(r.v)}" y1="${cy}" y2="${cy}" stroke="var(--hair)" stroke-width="2"/><circle class="m" cx="${X(r.v)}" cy="${cy}" r="6" fill="${r.v>=95?'var(--v-good)':r.v>=90?'var(--v-mid)':'var(--v-bad)'}" stroke="var(--paper)" stroke-width="2"/><text class="vb" x="${X(r.v)+10}" y="${cy-8}">${fx(r.v)} %</text><text x="${X(r.v)+10}" y="${cy+14}" style="font-size:10px">${r.lt} из ${r.sh} смен · ~${LATEMIN[r.t]} мин</text></g>`});
 return s+`</svg><div class="lgd"><span>Вовремя = клок-ин не позже начала смены + 5 мин</span><span>Удалённые не входят</span></div>`+cap(['график смен','клок-ин'],'новый расчёт');
}
function chHeat(){
 const ps=people().filter(p=>OT[p.id]);const rem=people().filter(p=>!OT[p.id]).length;
 if(!ps.length)return `<div class="lockbox">${ic('clock')}<span>У выбранной команды нет табеля – удалённые работают по задачам. Часы и переработку по ним не считаем (ICO: мониторинг удалённых – только соразмерный).</span></div>`;
 const W=620,lw=140,cw=(W-lw-40)/8,ch=24,HT=ps.length*(ch+3)+30;
 const col=(v)=>v>=5?'var(--accent-dark)':v>=3?'var(--v1)':v>=1?'var(--v2)':'var(--silver)';
 let s=`<svg class="ch" viewBox="0 0 ${W} ${HT}" role="img" aria-label="Переработка по неделям">`;
 WEEKS.forEach((w,i)=>{s+=`<text x="${lw+i*cw+cw/2}" y="12" text-anchor="middle">${w}</text>`});
 ps.forEach((p,r)=>{const y=20+r*(ch+3),o=OT[p.id],hot=o.slice(-3).every(v=>v>=st.thr.ot);
  s+=`<g class="clk" data-person="${p.id}"><rect x="0" y="${y}" width="${W}" height="${ch}" fill="transparent"/><text class="v" x="0" y="${y+16}">${p.name}</text>`;
  o.forEach((v,i)=>{s+=`<g><title>${p.name} · неделя ${WEEKS[i]}: ${v?'+'+v+' ч сверх графика':'по графику'}</title><rect class="m" x="${lw+i*cw+1}" y="${y}" width="${cw-2}" height="${ch}" fill="${col(v)}"/>${v>=3?`<text x="${lw+i*cw+cw/2}" y="${y+16}" text-anchor="middle" style="fill:#fff;font-size:10.5px">${v}</text>`:''}</g>`});
  s+=`${hot?`<text x="${W-4}" y="${y+16}" text-anchor="end" style="fill:var(--accent-dark);font-size:10.5px">3 нед.</text>`:''}</g>`});
 return s+`</svg><div class="lgd"><span><i style="background:var(--silver)"></i>по графику</span><span><i style="background:var(--v2);border-color:var(--v2)"></i>+1–2 ч</span><span><i style="background:var(--v1);border-color:var(--v1)"></i>+3–4 ч</span><span><i style="background:var(--accent-dark);border-color:var(--accent-dark)"></i>+5 ч и больше</span><span>«3 нед.» – порог правила «Переработка» (${st.thr.ot} ч) три недели подряд</span>${rem?`<span>${rem} удалённых без табеля – не входят</span>`:''}</div>`+cap(['клок-ин','график смен','смены курьеров'],'последние 8 недель, не зависит от периода');
}
function chTrain(){
 const T=Object.keys(D.teams).filter(t=>st.team==='all'||st.team===t);
 const rows=T.map(t=>{const ps=D.people.filter(p=>p.team===t);const a=ps.reduce((s,p)=>s+p.train[0],0),b=ps.reduce((s,p)=>s+p.train[1],0);return{t,a,b,v:pct(a,b),od:ps.filter(p=>OVERDUE[p.id]>14).length}});
 const W=560,X=(v)=>170+v/100*(W-230),HT=rows.length*38+26;
 let s=`<svg class="ch" viewBox="0 0 ${W} ${HT}" role="img" aria-label="Обучение по командам">`;
 [0,50,100].forEach(v=>{s+=`<line x1="${X(v)}" x2="${X(v)}" y1="4" y2="${HT-20}" stroke="var(--hair)"/><text x="${X(v)}" y="${HT-6}" text-anchor="middle">${v} %</text>`});
 rows.forEach((r,i)=>{const y=8+i*38;s+=`<g><title>${D.teams[r.t]}: пройдено ${r.a} из ${r.b} уроков · просрочено > 14 дн.: ${r.od}</title><rect x="0" y="${y-4}" width="${W}" height="34" fill="transparent"/><text class="v" x="0" y="${y+15}">${D.teams[r.t]}</text><rect x="${X(0)}" y="${y+4}" width="${X(100)-X(0)}" height="14" fill="var(--silver)"/><rect class="m" x="${X(0)}" y="${y+4}" width="${X(r.v)-X(0)}" height="14" fill="var(--v1)"/><text class="vb" x="${X(100)+8}" y="${y+16}">${r.v} %</text>${r.od?`<text x="${X(100)+42}" y="${y+16}" style="fill:var(--accent-dark);font-size:10.5px">${r.od} просроч.</text>`:''}</g>`});
 return s+'</svg>'+cap(['назначенные уроки','результаты уроков'],'то же, что «Обучение → Журнал обучения»');
}
function chOnes(){
 const ps=people().filter(p=>p.status!=='leave').map(p=>({p,s:sinceLast(p),c:CADD(p)})).sort((a,b)=>b.s/b.c-a.s/a.c);
 const W=560,lw=130,mx=Math.max(60,...ps.map(x=>x.s)),X=(v)=>lw+v/mx*(W-lw-60),rh=26,HT=ps.length*rh+28;
 let s=`<svg class="ch" viewBox="0 0 ${W} ${HT}" role="img" aria-label="Дней с последнего 1:1">`;
 [0,30,60].filter(v=>v<=mx).forEach(v=>{s+=`<line x1="${X(v)}" x2="${X(v)}" y1="2" y2="${HT-20}" stroke="var(--hair)"/><text x="${X(v)}" y="${HT-6}" text-anchor="middle">${v} дн.</text>`});
 ps.forEach((x,i)=>{const y=4+i*rh,r=x.s/x.c,c=r<=1.2?'var(--v-good)':r<=2?'var(--v-mid)':'var(--v-bad)';
  s+=`<g class="clk" data-person="${x.p.id}" data-tab="ones"><title>${x.p.name}: ${x.s} дн. с последнего 1:1 · ритм ${x.p.cad.toLowerCase()} (${x.c} дн.) · следующая ${fmtD(x.p.next)}</title><rect x="0" y="${y}" width="${W}" height="${rh-2}" fill="transparent"/><text class="v" x="0" y="${y+15}">${x.p.name}</text><rect class="m" x="${X(0)}" y="${y+6}" width="${Math.max(2,X(x.s)-X(0))}" height="10" fill="${c}"/><line x1="${X(x.c)}" x2="${X(x.c)}" y1="${y+2}" y2="${y+20}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(Math.min(mx,x.c*2))}" x2="${X(Math.min(mx,x.c*2))}" y1="${y+2}" y2="${y+20}" stroke="var(--ink)" stroke-dasharray="2 2"/><text x="${W-2}" y="${y+15}" text-anchor="end" class="v">${x.s} дн.</text></g>`});
 return s+`</svg><div class="lgd"><span>│ ритм</span><span>┆ 2× ритма – порог сигнала</span><span><i style="background:var(--v-good);border-color:var(--v-good)"></i>в ритме</span><span><i style="background:var(--v-mid);border-color:var(--v-mid)"></i>до 2×</span><span><i style="background:var(--v-bad);border-color:var(--v-bad)"></i>дольше 2×</span></div>`+cap(['встречи 1:1','ритм 1:1 (новое)']);
}
function chPdp(){
 const ps=people().slice().sort((a,b)=>b.pdp.pct-a.pdp.pct);
 return `<div class="plist">${ps.map(p=>`<div class="pr" data-person="${p.id}" data-tab="growth" title="${H.esc(p.pdp.goal)}"><div class="nm">${H.av(p,'s')}${p.name}</div>${p.pdp.pct?H.bar(p.pdp.pct,p.pdp.pct>=60?'ok':''):`<span>${H.chip('нет плана','warn')}</span>`}<div class="vv">${p.pdp.pct?p.pdp.pct+' %':'—'}</div></div>`).join('')}</div>`+cap(['планы развития','цели и check-in'],'экран «Развитие» уже есть');
}
function chKudos(){
 const ps=people().map(p=>({p,n:p.kudos,last:daysBetween(dd(lastKudos(p)),NOW)})).sort((a,b)=>b.last-a.last);
 const mx=Math.max(...ps.map(x=>x.n),1);
 return `<div class="plist">${ps.map(x=>`<div class="pr" data-person="${x.p.id}" data-tab="pulse"><div class="nm">${H.av(x.p,'s')}${x.p.name}</div><div class="row" style="gap:8px">${H.bar(x.n/mx*100,x.last>=st.thr.kudos?'ac':'')}<span class="sm muted" style="white-space:nowrap">${x.n}</span></div><div class="vv" style="${x.last>=st.thr.kudos?'color:var(--accent-dark)':''}">${x.last} дн.</div></div>`).join('')}</div><div class="lgd"><span>Полоса – благодарностей за 90 дней</span><span>Справа – дней с последней</span><span style="color:var(--accent-dark)">${st.thr.kudos}+ дн. – сигнал</span></div>`+cap(['благодарности','похвала в отзывах клиентов'],'Floritta Active');
}
function kpis(){
 const ps=people(),n=ps.length,P=PER[st.per],from=new Date(NOW-P.days*DAY);
 const hires=ps.filter(p=>dd(p.start)>=from).length;
 const lv=LEAV.filter(l=>st.team==='all'||l.team===st.team);const avgHc=n+lv.length/2;
 const ten=ps.reduce((a,p)=>a+daysBetween(dd(p.start),NOW),0)/Math.max(n,1)/365;
 const pv=ps.map(p=>p.pulse.slice(-P.pk)).flat();const pAvg=pv.reduce((a,b)=>a+b,0)/Math.max(pv.length,1);
 const prevV=ps.map(p=>p.pulse.slice(-P.pk*2,-P.pk)).flat();const pPrev=prevV.length?prevV.reduce((a,b)=>a+b,0)/prevV.length:null;
 const inR=ps.filter(p=>p.status!=='leave'&&sinceLast(p)<=CADD(p)+3).length,act=ps.filter(p=>p.status!=='leave').length;
 const tr=[ps.reduce((a,p)=>a+p.train[0],0),ps.reduce((a,p)=>a+p.train[1],0)];
 const abs=ps.reduce((a,p)=>a+(p.att?p.att.abs||0:0),0)/Math.max(n,1)*P.abs;
 const small=n<5;
 const K=[
  ['Численность',n,'',`+${hires} за период · ушли ${lv.filter(l=>dd(l.left)>=from).length}`],
  ['Текучесть за 12 мес',Math.round(lv.length/avgHc*100),'%',`${lv.length} ${plural(lv.length,'уход','ухода','уходов')} · ранних (< 90 дн.) ${lv.filter(l=>daysBetween(dd(l.start),dd(l.left))<90).length}`],
  ['Средний стаж',fx(ten),'г',`новичков < 90 дн.: ${ps.filter(p=>daysBetween(dd(p.start),NOW)<90).length}`],
  small?['Пульс','скрыто','','меньше 5 человек в срезе',1]:['Пульс',fx(pAvg),'/10',pPrev?`<span class="${pAvg>=pPrev?'up':'dn'}">${pAvg>=pPrev?'+':'−'}${fx(Math.abs(pAvg-pPrev))}</span> к прошлому периоду`:'пульс собираем 6 недель – сравнения за год нет'],
  st.team!=='all'?['eNPS','—','','только по компании – без срезов (n ≥ 5)',1]:['eNPS','+'+D.enps.score,'',`<span class="up">+${D.enps.score-D.enps.prev}</span> к прошлому опросу · n = ${D.enps.n}`],
  ['Охват 1:1',pct(inR,act),'%',`${inR} из ${act} в своём ритме`],
  ['Обучение выполнено',pct(tr[0],tr[1]),'%',`${tr[0]} из ${tr[1]} уроков`],
  ['Дней отсутствия на человека',fx(abs),'',`за ${P.t.toLowerCase()} · только даты, без причин`]
 ];
 return K.map(([k,v,u,d,h])=>`<div class="kpi ${h?'hid':''}"><div class="k">${k}</div><div class="v">${v}${u?`<small>${u}</small>`:''}</div><div class="d">${d}</div></div>`).join('');
}
function sigRows(){
 return RULES.map(r=>{const f=fired(r);return `<tr data-rule="${r.k}"><td class="rl"><b style="font-weight:500">${r.t}</b><div class="muted sm"><code>${r.src}</code></div></td>
 <td><div class="thr">${r.pre}<input class="inp" type="number" min="0" step="1" value="${st.thr[r.k]}" data-thr="${r.k}"><span class="sm muted">${r.u}</span></div></td>
 <td><div class="who">${f.length?f.map(x=>`<span data-person="${x.p.id}" title="${x.p.name}: ${H.esc(x.why)}">${H.av(x.p,'s')}</span>`).join(''):'<span class="muted sm">ни у кого</span>'}</div></td>
 <td class="ex">${f.length?f.map(x=>`<div><b style="font-weight:500">${x.p.name.split(' ')[0]}</b> – ${x.why}</div>`).join(''):'<span class="muted">Порог не достигнут</span>'}</td></tr>`}).join('');
}
function bindSig(el){
 el.querySelectorAll('[data-thr]').forEach(i=>i.addEventListener('change',()=>{const v=Math.max(0,+i.value||0);st.thr[i.dataset.thr]=v;
  const tb=el.querySelector('#an-sig');tb.innerHTML=sigRows();bindSig(el);
  if(i.dataset.thr==='ot')el.querySelector('#an-heat').innerHTML=chHeat();
  if(i.dataset.thr==='kudos')el.querySelector('#an-kudos').innerHTML=chKudos();
  App.toast('Порог изменён – сигнал пересчитан. В журнале: кто и когда менял правило')}));
}
function draw(el){
 el.querySelector('#an-kpis').innerHTML=kpis();
 [['#an-hc',chHeadcount],['#an-ten',chTenure],['#an-pulse',chPulse],['#an-punct',chPunct],['#an-heat',chHeat],['#an-train',chTrain],['#an-ones',chOnes],['#an-pdp',chPdp],['#an-kudos',chKudos]].forEach(([s,f])=>el.querySelector(s).innerHTML=f());
 el.querySelector('#an-sig').innerHTML=sigRows();bindSig(el);
}
