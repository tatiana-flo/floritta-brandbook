#s-lifecycle .cal th.td{color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--ink)}

#s-lifecycle .cal td.tdc{box-shadow:inset 1px 0 0 var(--ink),inset -1px 0 0 var(--ink)}

#s-lifecycle .bft{position:relative;height:10px;background:var(--silver)}
#s-lifecycle .bft i{position:absolute;left:0;top:0;bottom:0;background:var(--v3)}

 onb:`<h4>Что это</h4><p>План первых 90 дней по шаблону: пункты с владельцами, напарник, встречи на 7/30/45/90 день, прогресс.</p><h4>Зачем HR</h4><p>Сейчас онбординг – это набор уроков и чекпоинты напарника, без общего плана и ответственных. Половина уходов – в первые месяцы.</p><h4>Откуда идея</h4><p><span class="src">HiBob – task lists</span><span class="src">Personio – шаблоны по типу занятости</span><span class="src">CharlieHR</span><span class="src">Humaans</span></p><h4>Данные из нашей CRM</h4><p>Уже есть: «Напарник» с чекпоинтами, онбординг-уроки, договор с подписью, резерв с проверкой права на работу, тур по приложению.</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span></p>`,
 prob:`<h4>Что это</h4><p>Трекер окончания испытательного срока и ревью, шкала до 6 месяцев.</p><h4>Зачем HR</h4><p>С 1 янв 2027 защита от необоснованного увольнения начинается после 6 месяцев (Employment Rights Act 2025). Решение о прохождении нужно принять до этой отметки – CRM напоминает на 5-м месяце.</p><h4>Откуда идея</h4><p><span class="src">CharlieHR – шаблон ревью пробации</span><span class="src">Personio – длина пробации</span></p><h4>Данные из нашей CRM</h4><p>Дата найма и тип занятости из профиля (защита – только у employee), матрица навыков и замер знаний – для критериев ревью.</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span></p>`,
 docs:`<h4>Что это</h4><p>Сводный трекер проверок: право на работу, права и страховка курьеров, сертификаты.</p><h4>Зачем HR</h4><p>Работа без действующей проверки права на работу – штраф; просроченные права или страховка – незастрахованная доставка.</p><h4>Откуда идея</h4><p><span class="src">Sage HR – right to work</span><span class="src">HiBob – конфиденциальные папки</span><span class="src">Deputy – сертификаты как допуск к сменам</span></p><h4>Данные из нашей CRM</h4><p>Уже есть: проверка права на работу в резерве и у курьеров, сроки сертификатов в обучении, договоры с подписью. Новое – одна таблица со статусами.</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span></p><h4>Доступы</h4><p>Копии – HR и админ. Реквизиты и налоги – только админ.</p>`,
 abs:`<h4>Что это</h4><p>Типы отсутствий поверх «Отпуска», календарь месяца, разговор после болезни, Bradford factor только для HR.</p><h4>Зачем HR</h4><p>Сейчас в «Отпуске» только отпуск – больничные и отгулы по уходу нигде не видны, разговоров после болезни нет.</p><h4>Откуда идея</h4><p><span class="src">Breathe – fit notes и шаблон разговора</span><span class="src">BrightHR – Bradford</span><span class="src">Ciphr – уход за близкими не в Bradford</span><span class="src">ICO – факт отсутствия вместо диагноза</span></p><h4>Данные из нашей CRM</h4><p>«Отпуск» с одобрением, «График», отметки прихода и ухода со смены.</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span> типы и журнал · <span class="pri p2">Следующий шаг</span> Bradford</p>`,
 exit:`<h4>Что это</h4><p>Чек-лист ухода, шаблон exit-интервью, причины ухода за год.</p><h4>Зачем HR</h4><p>Сейчас в CRM нет дат и причин ухода – текучесть не считается. Уход без чек-листа – это забытые доступы и ключи.</p><h4>Откуда идея</h4><p><span class="src">CharlieHR – offboarding</span><span class="src">Personio – шаги от последнего дня</span><span class="src">Lattice – exit-опрос идентифицируемый</span></p><h4>Данные из нашей CRM</h4><p>Активность учётки, дата ухода из «Графика», приглашения и доступы.</p><h4>Приоритет</h4><p><span class="pri p2">Следующий шаг</span></p>`,
 cal:`<h4>Что это</h4><p>Все кадровые даты одним списком по месяцам: дни рождения, годовщины, проверки документов, ревью, отпуска.</p><h4>Зачем HR</h4><p>Ничего не пропустить: поздравить, вовремя проверить документ, подготовить ревью.</p><h4>Откуда идея</h4><p><span class="src">BambooHR – who's out и celebrations</span><span class="src">HiBob</span></p><h4>Данные из нашей CRM</h4><p>День рождения и дата найма из профиля, «Дни заботы», «Отпуск», сроки документов.</p><h4>Приоритет</h4><p><span class="pri p1">MVP</span></p>`
};

function ciSheet(pid,i){
 const p=P(pid),c=J[pid].ci[i],done=dd(c[1])<dd(today);
 App.sheet(c[0]+' · '+p.name,`<div class="row" style="margin-bottom:14px">${H.chip(done?'проведена':'запланирована '+fmtD(c[1]),done?'ok':'info')}${H.vis('shared')}</div>
  ${['Что оказалось не так, как ожидал(а)?','Хватает ли доступов, инструментов, информации?','Как работается с напарником?','Что одно мы можем улучшить уже сейчас?','Адаптация по ощущениям: 1–5'].map(q=>`<div style="padding:10px 0;border-bottom:1px solid var(--hair)"><div>${q}</div>${done?`<div class="muted sm" style="margin-top:4px">Ответ записан на встрече</div>`:''}</div>`).join('')}
  <p class="muted sm" style="margin-top:12px">Встреча идентифицируемая: ответы видит сотрудник, HR и руководитель.</p>`,
  `<button class="btn" data-close>Закрыть</button><button class="btn pr" data-go="oneonones">${ic('chat')}Открыть в 1:1</button>`);
}

App.reg('lifecycle',{

 crumb:()=>'Онбординг и даты',
 render(el,params){
  const t=params.tab||params.id; if(t&&TABS.some(x=>x[0]===t)) S.tab=t; if(!S.tab) S.tab='onb';
  el.innerHTML=`<div class="scr-h"><div><div class="eyebrow">Команда · жизненный цикл</div><h1>Онбординг и даты</h1><div class="sub">Первые 90 дней, испытательный срок, документы, отсутствия, уход и календарь кадровых дат</div></div>
   <div class="acts"><button class="btn" data-a="tocal">${ic('cal')}Ближайшие даты</button><button class="btn pr" data-a="startonb">${ic('plus')}Запустить онбординг</button></div></div>
   <div class="tabs">${TABS.map(([k,n])=>`<button data-lt="${k}">${n}</button>`).join('')}</div><div id="lc-body"></div>`;
  const body=el.querySelector('#lc-body');
  const draw=()=>{body.innerHTML=R[S.tab]();el.querySelectorAll('[data-lt]').forEach(b=>b.classList.toggle('on',b.dataset.lt===S.tab))};
  const setTab=k=>{S.tab=k;App.params={tab:k};history.replaceState(null,'','#lifecycle/'+k);draw();document.getElementById('notes-body').innerHTML=NOTES[k];document.getElementById('view').scrollTop=0};
  el.addEventListener('change',e=>{if(e.target.id==='lc-tpl'){S.tpl[S.j]=e.target.value;draw()}});
  el.addEventListener('click',e=>{
   const tb=e.target.closest('[data-lt]'); if(tb){setTab(tb.dataset.lt);return}
   if(e.target.closest('[data-person],[data-go]')) return;
   const b=e.target.closest('[data-a]'); if(!b||b.tagName==='SELECT') return;
   const a=b.dataset.a,v=b.dataset.v,i=+b.dataset.i;
   if(a==='pick'){S.j=b.dataset.id;draw();const c=el.querySelector('#lc-tpl');if(c)c.closest('.card').scrollIntoView({behavior:'smooth',block:'start'})}
   else if(a==='ci'){e.stopPropagation();ciSheet(b.dataset.id,i)}
   else if(a==='chk'){const t=S.tpl[S.j]||J[S.j].tpl,k=S.j+':'+t,set=S.doneSets[k]||(S.doneSets[k]=new Set());set.has(i)?set.delete(i):set.add(i);draw()}
   else if(a==='applytpl'){J[S.j].tpl=S.tpl[S.j];App.toast('Шаблон «'+TPL[J[S.j].tpl].n+'» применён – владельцы получат задачи');draw()}
   else if(a==='additem'){
    const t=S.tpl[S.j]||J[S.j].tpl;
    App.sheet('Новый пункт · '+TPL[t].n,`<label class="f">Период</label><select class="sel" id="lc-i-g">${TPL[t].g.map((g,k)=>`<option value="${k}">${g[0]}</option>`).join('')}</select><label class="f" style="margin-top:14px">Что сделать</label><input class="inp" id="lc-i-t" placeholder="Например: показать, где лежат расходники"><label class="f" style="margin-top:14px">Кто отвечает</label><select class="sel" id="lc-i-o">${Object.entries(OWN).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><p class="muted sm" style="margin-top:10px">Пункт добавится в шаблон – для всех будущих онбордингов.</p>`,`<button class="btn" data-close>Отмена</button><button class="btn pr" id="lc-i-go">Добавить</button>`);
    document.getElementById('lc-i-go').onclick=()=>{const tx=document.getElementById('lc-i-t').value.trim();if(!tx){App.toast('Опишите пункт');return}
     const g=+document.getElementById('lc-i-g').value; let pos=0; for(let k=0;k<=g;k++) pos+=TPL[t].g[k][1].length;
     Object.keys(S.doneSets).filter(k=>k.endsWith(':'+t)).forEach(k=>{S.doneSets[k]=new Set([...S.doneSets[k]].map(x=>x>=pos?x+1:x))});
     Object.keys(OVERDUE).filter(k=>k.endsWith(':'+t)&&OVERDUE[k]>=pos).forEach(k=>OVERDUE[k]++);
     TPL[t].g[g][1].push([tx,document.getElementById('lc-i-o').value]);App.close();draw();App.toast('Пункт добавлен в шаблон «'+TPL[t].n+'»')};
   }
   else if(a==='startonb'){
    App.sheet('Запустить онбординг',`<label class="f">Кто выходит</label><select class="sel"><option>Кандидат из «Найма» – оффер принят</option><option>Человек из резерва</option></select>
     <label class="f" style="margin-top:14px">Шаблон</label><select class="sel" id="lc-o-t">${TPLKEY.map(k=>`<option value="${k}">${TPL[k].n}</option>`).join('')}</select>
     <label class="f" style="margin-top:14px">Напарник</label><select class="sel">${D.people.filter(p=>p.tags.includes('Наставник')||p.lvl>=3).map(p=>`<option>${p.name}</option>`).join('')}</select>
     <label class="f" style="margin-top:14px">Первый день</label><select class="sel">${['2026-11-16','2026-11-23','2026-11-30','2026-12-07'].map(d=>`<option>${fmtD(d)}</option>`).join('')}</select>
     <p class="muted sm" style="margin-top:12px">Пункты «До выхода» уйдут владельцам сразу, встречи 7/30/45/90 встанут в календарь HR.</p>`,`<button class="btn" data-close>Отмена</button><button class="btn pr" id="lc-o-go">Запустить</button>`);
    document.getElementById('lc-o-go').onclick=()=>{const t=document.getElementById('lc-o-t').value;App.close();App.toast('Онбординг запущен: '+flat(t).length+' пунктов по шаблону «'+TPL[t].n+'», задачи ушли владельцам')};
   }
   else if(a==='tocal'){S.cal='all';setTab('cal');const f=el.querySelector('.ev:not(.past)');if(f)f.scrollIntoView({block:'center'})}
   else if(a==='toonb'){S.j='denis';setTab('onb')}
   else if(a==='rem'){S.rem=!S.rem;draw();App.toast(S.rem?'Напоминание на 5-м месяце включено для всех employee':'Напоминание выключено – решение о прохождении легко пропустить')}
   else if(a==='probdoc'){const p=P(b.dataset.id);App.toast(p.name+': испытательный пройден, итог подписан руководителем и сотрудником')}
   else if(a==='review'){
    const p=P('alina');
    App.sheet('Ревью испытательного · Alina Moroz',`<div class="row" style="margin-bottom:12px">${H.chip('ревью '+fmtD(p.probEnd),'warn')}${H.vis('mgr')}</div>
     <div class="eyebrow" style="margin-bottom:6px">Критерии из CRM</div>
     ${[['6 базовых стилей','4 из 6 подтверждены наставником','warn'],['Утренняя волна без переделок','да, 6 нояб – отметила Polina','ok'],['Опоздания за 3 месяца','1','ok'],['Обучение','8 из 12 уроков','warn'],['Пульс по 1:1','стабильно 7–8','ok']].map(([k,v,c])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--hair)"><span style="flex:1">${k}</span>${H.chip(v,c)}</div>`).join('')}
     <label class="f" style="margin-top:16px">Отзыв напарника (Mila Novak)</label><textarea class="ta" placeholder="Что получается, над чем работать"></textarea>
     <label class="f" style="margin-top:14px">Решение</label>
     ${[['pass','Пройден'],['ext','Продлить на 4 недели – с причиной и планом'],['fail','Не пройден – только после разговора, письменно']].map(([k,t],n)=>`<label class="row" style="padding:6px 0;cursor:pointer"><input type="radio" name="lc-dec" value="${k}" ${n===0?'checked':''}><span>${t}</span></label>`).join('')}
     <div class="callout" style="margin-top:10px">Продление тоже должно закончиться до ${fmtY(addMonths(p.start,6))} – после 6 месяцев действует защита от необоснованного увольнения.</div>`,
     `<button class="btn" data-close>Отмена</button><button class="btn" data-close data-toast="Черновик ревью сохранён – видят HR и руководитель">Сохранить черновик</button><button class="btn pr" data-close data-toast="Встреча-ревью 23 нояб назначена: Alina, Polina, HR">Назначить встречу</button>`);
   }
   else if(a==='dk'){S.docK=v;draw()}
   else if(a==='ds'){S.docS=S.docS===v?null:v;draw()}
   else if(a==='docok'){e.stopPropagation();const d=DOCS[i];d.checked=today;if(d.next&&d.next!=='na')d.next=addMonths(today,12);draw();App.toast(P(d.who).name+': «'+d.name+'» – проверка отмечена сегодня, копия в защищённой папке')}
   else if(a==='doc'){
    const d=DOCS[i],p=P(d.who),st=dstat(d);
    App.sheet(d.name,`<div class="row" style="margin-bottom:14px">${H.av(p)}<div><b style="font-weight:500">${p.name}</b><div class="muted sm">${p.role} · ${H.type(p)}</div></div><span class="sp"></span>${H.chip(DS[st][0],DS[st][1])}</div>
     ${[['Способ',d.method],['Проверено',d.checked?fmtY(d.checked):'—'],['Кто проверял',d.by?pname(d.by):'—'],['Следующая проверка',d.next==='na'?'не требуется':d.next?fmtY(d.next):'бессрочно'],['Копия',d.checked?'PDF в защищённой папке – HR и админ':'—'],['Храним',d.kind==='rtw'?'2 года после ухода':'пока действует + 1 год']].map(([k,v])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--hair)"><span class="muted" style="width:150px">${k}</span><span style="flex:1">${v}</span></div>`).join('')}
     ${d.kind==='rtw'&&st!=='na'?`<p class="muted sm" style="margin-top:12px">Способы проверки: оригинал документа при сотруднике, share code онлайн или цифровой провайдер. Скан без проверки не считается.</p>`:''}`,
     st==='na'?'<button class="btn" data-close>Закрыть</button>':`<button class="btn" data-close data-toast="Сотруднику ушла задача в приложении: прислать документ или share code">Запросить у сотрудника</button><button class="btn pr" id="lc-d-ok">${ic('check')}Отметить проверку</button>`);
    const ok=document.getElementById('lc-d-ok'); if(ok) ok.onclick=()=>{d.checked=today;if(d.next&&d.next!=='na')d.next=addMonths(today,12);App.close();draw();App.toast('Проверка отмечена сегодня')};
   }
   else if(a==='addabs'){
    App.sheet('Отметить отсутствие',`<label class="f">Кто</label><select class="sel" id="lc-a-p">${D.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
     <label class="f" style="margin-top:14px">Тип</label><select class="sel" id="lc-a-t">${Object.entries(AT).map(([k,[t]])=>`<option value="${k}">${t}</option>`).join('')}</select>
     <div class="grid g2" style="margin-top:14px"><div><label class="f">С</label><select class="sel" id="lc-a-f">${Array.from({length:30},(_,n)=>`<option value="${n+1}" ${n+1===12?'selected':''}>${n+1} нояб</option>`).join('')}</select></div><div><label class="f">По</label><select class="sel" id="lc-a-to">${Array.from({length:30},(_,n)=>`<option value="${n+1}" ${n+1===12?'selected':''}>${n+1} нояб</option>`).join('')}</select></div></div>
     <label class="f" style="margin-top:14px">Оформление</label><select class="sel" id="lc-a-c"><option value="">Не нужно</option><option value="self">Самосертификация (до 7 дней)</option><option value="fit">Fit note – загрузить в защищённую папку</option></select>

     <div class="callout info" style="margin-top:12px">Храним факт отсутствия, не диагноз. После больничного CRM предложит разговор о возвращении.</div>`,
     `<button class="btn" data-close>Отмена</button><button class="btn pr" id="lc-a-go">Сохранить</button>`);

   else if(a==='rtw'){
    const r=ABS[i],p=P(r.id);
    App.sheet('Разговор после отсутствия',`<div class="row" style="margin-bottom:12px">${H.av(p)}<div><b style="font-weight:500">${p.name}</b><div class="muted sm">${AT[r.type][0]} · ${fmtD(r.from)}${r.to!==r.from?' – '+fmtD(r.to):''}</div></div><span class="sp"></span>${H.vis('hr')}</div>
     ${['Как самочувствие, готов(а) ли вернуться к обычным задачам','Есть ли рекомендации в fit note: меньше часов, лёгкие задачи – договориться о плане','Нужна ли поддержка: постепенный выход, другой график, перерывы','Связано ли с работой (нагрузка, травма, тяжести) – если да, оценить риски','Рассказать, что изменилось за время отсутствия','Зафиксировать договорённости и дату следующего разговора'].map((q,n)=>`<label class="row" style="padding:8px 0;border-bottom:1px solid var(--hair);cursor:pointer;align-items:flex-start"><input type="checkbox" class="lc-rtw" style="margin-top:3px"><span>${q}</span></label>`).join('')}
     <label class="f" style="margin-top:14px">Договорённости</label><textarea class="ta" placeholder="Только договорённости. Диагноз не записываем."></textarea>

    document.getElementById('lc-rtw-go').onclick=()=>{r.rtw='done';App.close();draw();App.toast('Разговор отмечен. Запись видят только HR и сотрудник по запросу')};

   else if(a==='offchk'){S.offDone[i]=!S.offDone[i];draw()}
   else if(a==='startoff'){
    App.sheet('Начать оффбординг',`<label class="f">Кто уходит</label><select class="sel" id="lc-x-p">${D.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
     <label class="f" style="margin-top:14px">Последний рабочий день</label><select class="sel">${['2026-11-27','2026-12-04','2026-12-11','2026-12-18'].map(d=>`<option>${fmtD(d)}</option>`).join('')}</select>
     <label class="f" style="margin-top:14px">Инициатива</label><select class="sel"><option>Сотрудника</option><option>Компании – только после разговора и по процедуре ACAS</option><option>Конец договора</option></select>
     <p class="muted sm" style="margin-top:12px">Финальный расчёт и остаток отпуска считает админ. HR видит только «передано админу».</p>`,
     `<button class="btn" data-close>Отмена</button><button class="btn pr" id="lc-x-go">Начать</button>`);
    document.getElementById('lc-x-go').onclick=()=>{const p=P(document.getElementById('lc-x-p').value);App.close();App.toast('Оффбординг '+p.name+' создан в черновике – видит только HR, пока не подтвердите')};
   }
   else if(a==='exitq'){
    App.sheet('Exit-интервью · шаблон',`<div class="callout info" style="margin-bottom:12px">Идентифицируемо: человек знает, что ответы видит HR. В отчёт основателю – только темы, цитаты без имени и с согласия.</div>
     ${['Что стало главной причиной ухода?','Был ли момент, когда вы решили уйти? Что тогда произошло?','Что было лучшим в работе здесь?','Что мы могли сделать иначе?','Как вам поддержка руководителя: 1–5','Хватало ли роста и обучения?','Порекомендуете ли Floritta как место работы?','Вернулись бы? Можно ли вам написать через полгода?'].map((q,n)=>`<div style="padding:9px 0;border-bottom:1px solid var(--hair)"><span class="muted num" style="margin-right:8px">${n+1}</span>${q}</div>`).join('')}
     <p class="muted sm" style="margin-top:10px">Ведёт HR, а не прямой руководитель. Лучше через 1–2 недели после последнего дня.</p>`,
     `<button class="btn" data-close data-toast="Шаблон открыт для правки – изменения применятся к следующим интервью">Править</button><button class="btn pr" data-close data-toast="Ссылка на интервью отправлена в приложение – ответить можно до 2 недель">Отправить ссылку</button>`);
   }
   else if(a==='cf'){S.cal=v;draw()}
   else if(a==='ical') App.toast('Ссылка на календарь скопирована – только даты и имена, без деталей');
   else if(a==='addev'){
    App.sheet('Новое событие',`<label class="f">Что</label><input class="inp" id="lc-e-t" placeholder="Например: ревью Q4 со студией"><label class="f" style="margin-top:14px">Когда</label><select class="sel" id="lc-e-d">${Array.from({length:19},(_,n)=>addDays(today,n+1)).map(d=>`<option value="${d}">${fmtD(d)}</option>`).join('')}</select><label class="f" style="margin-top:14px">Кто</label><select class="sel" id="lc-e-p"><option value="">Вся команда</option>${D.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>`,
     `<button class="btn" data-close>Отмена</button><button class="btn pr" id="lc-e-go">Добавить</button>`);
    document.getElementById('lc-e-go').onclick=()=>{const t=document.getElementById('lc-e-t').value.trim();if(!t){App.toast('Назовите событие');return}D.events.push({d:document.getElementById('lc-e-d').value,t,who:document.getElementById('lc-e-p').value||null,k:'clip'});App.close();S.cal='all';draw();App.toast('Событие добавлено в календарь')};
   }
  });
  draw();
 },
 notes:()=>NOTES[S.tab||'onb']
});
})();
</script>
