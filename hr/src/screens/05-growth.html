    <h4>Кто проверяет</h4><select class="sel" id="gw-as">${(ass.length?ass:[P('irina')]).map(q=>`<option>${q.name} · может обучать</option>`).join('')}</select>
    <h4>Комментарий</h4><textarea class="ta" id="gw-cm" placeholder="Что получилось, что подтянуть"></textarea>
    <h4>Решение</h4><div class="seg" id="gw-dec"><button data-dec="pass">Сдал</button><button data-dec="retry">Ещё раз</button></div>
    <p class="sm muted" style="margin-top:8px">Решение ставит проверяющий, AI в этом не участвует. Повторная проверка – через 6 месяцев, как сертификаты в Обучении.</p></div>`,
    `<button class="btn" data-close>Отмена</button><button class="btn pr" id="gw-sos">Сохранить решение</button>`);
   let dec=null;const sb=document.getElementById('sheet-b'),sf=document.getElementById('sheet-f');
   sb.onclick=e=>{if(!sb.querySelector('.gw-sh'))return;const b=e.target.closest('button');if(!b)return;
    if(b.id==='gw-phb'){const ph=sb.querySelector('#gw-ph');ph.classList.add('got');ph.innerHTML=`${ic('check')}<b>Фото прикреплено</b><span>Заказ #48231 · 11 нояб, утренняя волна</span>`;App.toast('Фото взято из заказа – клиентские данные не копируются');return}
    if(b.dataset.dec){dec=b.dataset.dec;sb.querySelectorAll('#gw-dec button').forEach(x=>x.classList.toggle('on',x===b))}};
   sf.onclick=e=>{if(!sb.querySelector('.gw-sh')||!e.target.closest('#gw-sos'))return;
    if(!dec){App.toast('Выберите решение: «Сдал» или «Ещё раз»');return}
    const all=[...sb.querySelectorAll('[data-st]')].every(c=>c.checked);
    if(dec==='pass'&&!all){App.toast('Не все шаги отмечены – отметьте их или выберите «Ещё раз»');return}
    App.close();sb.onclick=sf.onclick=null;
    if(dec==='pass'){p.skills[k]=tg;draw();const c=el.querySelector(`[data-sk="${pid}|${k}"]`);if(c)c.classList.add('flash');App.toast(lv<3?`${fn(p)} · ${H.skillNames[k]}: ${lv} → ${tg} подтверждено`:`${fn(p)} · ${H.skillNames[k]}: уровень 3 подтверждён повторно`)}
    else App.toast(`Повтор через 2 недели – задача создана для проверяющего, ${fn(p)} получит подсказку, что подтянуть`)};
  }
  /* ---------- edit track sheet ---------- */
  function openEdit(){
   const t=TR[trk];const rowH=(r)=>`<div class="etr"><input class="inp et-rn" value="${H.esc(r.n)}" placeholder="Компетенция">${t.cols.map((c,i)=>`<label class="f" style="margin-top:4px">${c.n}</label><input class="inp et-c" value="${H.esc(r.e[i]||'')}">`).join('')}</div>`;
   App.sheet('Редактировать трек',`<div class="gw-sh"><label class="f">Название трека</label><input class="inp" id="gw-tn" value="${H.esc(t.name||D.ladders[trk].name)}">
    <p class="sm muted" style="margin:8px 0 12px">Уровни – колонки, компетенции – строки. 3–6 слов в ячейке: что человек делает на этом уровне. Без ставок – деньги ведёт админ отдельно.</p>
    <div id="gw-rows">${t.rows.map(rowH).join('')}</div><button class="btn s" id="gw-addr">${ic('plus')}Компетенция</button></div>`,
    `<button class="btn" data-close>Отмена</button><button class="btn pr" id="gw-tsave">Сохранить</button>`);
   const sb=document.getElementById('sheet-b'),sf=document.getElementById('sheet-f');
   sb.onclick=e=>{if(sb.querySelector('.gw-sh')&&e.target.closest('#gw-addr')){sb.querySelector('#gw-rows').insertAdjacentHTML('beforeend',rowH({n:'',e:[]}));App.toast('Строка добавлена')}};
   sf.onclick=e=>{if(!sb.querySelector('.gw-sh')||!e.target.closest('#gw-tsave'))return;
    const rows=[...sb.querySelectorAll('.etr')].map((d,i)=>({n:d.querySelector('.et-rn').value.trim(),sk:(t.rows[i]||{}).sk,e:[...d.querySelectorAll('.et-c')].map(x=>x.value.trim()||'–')})).filter(r=>r.n);
    t.rows=rows;t.name=sb.querySelector('#gw-tn').value.trim()||D.ladders[trk].name;App.close();sb.onclick=sf.onclick=null;draw();App.toast(`Трек «${t.name}» сохранён как черновик – сотрудники увидят после согласования основателем`)};
  }
  el.addEventListener('click',e=>{
   const t=e.target;
   const pd=t.closest('[data-pdp]');if(pd){openPdp(pd.dataset.pdp);return}
   const f=t.closest('[data-pf]');if(f){pf=f.dataset.pf;draw();return}
   const tr=t.closest('[data-trk]');if(tr){trk=tr.dataset.trk;foc=null;draw();return}
   const pp=t.closest('[data-pp]');if(pp){foc={pid:pp.dataset.pp,_trk:trk};draw();return}
   const lv=t.closest('[data-lv]');if(lv){foc={lv:lv.dataset.lv,_trk:trk};draw();return}
   if(t.closest('#gw-fx')){foc={lv:'__none',_trk:trk};const c=t.closest('.card');if(c)c.remove();return}
   const mfb=t.closest('[data-mf]');if(mfb){mf=mfb.dataset.mf;draw();return}
   const sk=t.closest('[data-sk]');if(sk){const [a,b]=sk.dataset.sk.split('|');openSo(a,b);return}
   if(t.closest('#gw-edit')){openEdit();return}
   if(t.closest('#gw-so')){
    const cand=D.people.filter(p=>REL[p.ladder].length);
    App.modal('Подтвердить навык',`<label class="f">Кто</label><select class="sel" id="gw-mp">${cand.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><div style="height:10px"></div><label class="f">Навык</label><select class="sel" id="gw-mk">${SK.map(k=>`<option value="${k}">${H.skillNames[k]}</option>`).join('')}</select>`,`<button class="btn" data-close>Отмена</button><button class="btn pr" id="gw-mgo">Далее</button>`);
    document.getElementById('gw-mgo').onclick=()=>{const pid=document.getElementById('gw-mp').value,k=document.getElementById('gw-mk').value;if(!REL[P(pid).ladder].includes(k)){App.toast('Этот навык не входит в трек человека');return}App.close();setTimeout(()=>openSo(pid,k),60)};return}
  });
  if(tab==='tracks'&&foc&&foc.lv==='__none')foc=null;
  draw();
  if(openPid){setTimeout(()=>openPdp(openPid),30)}
 },
 notes:(pr)=>{const t=tabOf(pr);
  if(t==='tracks')return `<h4>Что это</h4><p>Карьерные треки по ролям: уровни – колонки, 5 компетенций – строки. У флористов после L3 развилка: «Старшая смены» (люди) или «Мастер-флорист» (ремесло).</p>
<h4>Зачем HR</h4><p>Человек видит, где он и что нужно для следующего шага; план развития строится от пробелов следующего уровня. Сейчас в CRM есть только денежная лестница флористов – её HR не видит, трек от денег отделён.</p>
<h4>Откуда идея</h4><p><span class="src">Lattice Grow</span><span class="src">Leapsome</span><span class="src">Employment Hero</span> двойной трек в рознице; <span class="src">City &amp; Guilds</span> Level 2–5 по флористике как внешняя опция.</p>
<h4>Данные из нашей CRM</h4><p>Матрица навыков 0–3 (строки трека ссылаются на её навыки), планы развития в «Развитии». Сами треки – новое.</p>
<h4>Приоритет</h4><p><span class="pri p2">Следующий шаг</span> после планов и 1:1. Правка трека – черновик, согласует основатель.</p>`;
  if(t==='matrix')return `<h4>Что это</h4><p>Существующая матрица навыков 0–3 в виде тепловой карты с пробелами относительно уровня человека и практическим подтверждением навыка.</p>
<h4>Зачем HR</h4><p>Видно, кого учить, кто может обучать и кого ставить напарником. Пробелы сразу становятся целями плана развития.</p>
<h4>Откуда идея</h4><p><span class="src">Opus</span><span class="src">Mitti</span> практический sign-off с фото и «сдал / ещё раз»; <span class="src">AG5</span> матрица в рознице.</p>
<h4>Данные из нашей CRM</h4><p>Матрица навыков у человека, допуски станций и наблюдение на смене в «Обучении», фото букета, которое и так делается для клиента. Три системы навыков стоит свести в одну.</p>
<h4>Приоритет</h4><p><span class="pri p1">MVP</span> доступ HR и подсветка пробелов; <span class="pri p2">Следующий шаг</span> подтверждение с фото.</p>`;
  return `<h4>Что это</h4><p>Сводка всех планов развития: главная цель, прогресс, последний check-in, статус. Клик – план человека с целями, навыками, действиями и историей check-in.</p>
<h4>Зачем HR</h4><p>Сразу видно, чей план отстаёт или его нет (Jake). AI предлагает цели от пробелов до следующего уровня – HR принимает или правит.</p>
<h4>Откуда идея</h4><p><span class="src">Culture Amp Develop</span><span class="src">Lattice Grow</span><span class="src">Leapsome</span> – цели привязаны к компетенциям следующего уровня, AI-черновик плана.</p>
<h4>Данные из нашей CRM</h4><p>Экран «Развитие» уже есть: до 3 целей с мерой успеха и поддержкой, check-in, квартальный машинный черновик плана. Доработать: доступ HR, связь с 1:1 и ревью.</p>
<h4>Приоритет</h4><p><span class="pri p1">MVP</span> открыть HR существующие планы. <span class="pri p2">Следующий шаг</span> AI-цели.</p>`}
});
function tabOf(pr){const k=pr&&(pr.tab||pr.id);return ['plans','tracks','matrix'].includes(k)?k:'plans'}
})();
</script>
