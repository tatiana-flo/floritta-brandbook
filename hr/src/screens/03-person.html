 let s=`<svg class="ps-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.label||''}">`;
 vals.forEach((v,i)=>{const x=i*bw,over=plan!=null&&v>plan;s+=`<rect x="${(x+bw*.22).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw*.56).toFixed(1)}" height="${Math.max(0,base-y(v)).toFixed(1)}" style="fill:${over?'var(--v-mid)':i===n-1?'var(--ink)':'var(--v3)'}"/><text x="${(x+bw/2).toFixed(1)}" y="${h-5}" text-anchor="middle" style="fill:var(--grey);font-size:10px">${lbl[i]}</text><text x="${(x+bw/2).toFixed(1)}" y="${(y(v)-4).toFixed(1)}" text-anchor="middle" style="fill:var(--graphite);font-size:10px">${v}</text>`});

    p.pdp={goal:g,pct:5};p.signals=p.signals.filter(s=>!/плана развития/.test(s.t));delete S.ms[p.id];App.close();draw();App.toast(`План создан – ${first(p)} увидит его в приложении и сможет поправить`)}};
  el.onclick=(e)=>{
   const tb=e.target.closest('[data-tabk]');if(tb&&el.contains(tb)){App.go('person',{id:p.id,tab:tb.dataset.tabk});return}
   const b=e.target.closest('[data-a]');if(!b||!el.contains(b))return;const a=b.dataset.a;
   if(a==='note')HRP.noteSheet(p.id,draw);
   else if(a==='one'){const o=HRP.nextOne(p.id);App.go('oneonones',o?{id:o.id}:{})}
   else if(a==='kudos')HRP.kudosSheet(p.id,draw);
   else if(a==='more')more();
   else if(a==='open-one')App.go('oneonones',{id:b.dataset.id});
   else if(a==='act'){const ac=D.ones.find(o=>o.id===b.dataset.o).actions[+b.dataset.i];ac.done=!ac.done;draw();App.toast(ac.done?'Договорённость выполнена':'Договорённость снова открыта')}
   else if(a==='brief-copy')HRP.copy(brief(p).map(x=>'• '+x.t+' ['+x.s+']').join('\n'),'Бриф скопирован');
   else if(a==='brief-add'){const o=HRP.nextOne(p.id);if(!o){App.toast('Запланированного 1:1 нет – сначала назначьте встречу');return}
    if(S.added[o.id]){App.toast('Бриф уже в повестке 1:1 '+fmtD(o.d));return}
    brief(p).slice(1,3).forEach(x=>o.agenda.push({by:'auto',t:x.t}));S.added[o.id]=1;App.toast(`2 пункта добавлены в повестку 1:1 ${fmtD(o.d)}, ${o.time}`)}
   else if(a==='tl'){S.tl=!S.tl;draw()}
   else if(a==='cat'){S.cat=b.dataset.c;draw()}
   else if(a==='nf'){S.form=!S.form;draw()}
   else if(a==='nf-save'){const t=el.querySelector('#ps-t').value.trim();if(!t){App.toast('Напишите текст заметки');return}
    const vis=el.querySelector('#ps-vis input:checked').value,li=el.querySelector('#ps-link').value,n={id:'n'+Date.now(),who:p.id,by:HRP.me(),d:'2026-11-11',vis,cat:el.querySelector('#ps-cat').value,t};
    if(li!=='')n.link=HRP.recs(p)[+li];D.notes.push(n);S.form=false;S.cat='all';draw();App.toast('Заметка сохранена · видимость: '+HRP.VIS[vis][0])}
   else if(a==='link')App.toast(`«${b.dataset.k} ${b.dataset.r}» откроется в своём разделе CRM – HR видит факты и статусы, без сумм`);
   else if(a==='ms'){const m=S.ms[p.id][+b.dataset.i];m.d=!m.d;const dn=S.ms[p.id].filter(x=>x.d).length;p.pdp.pct=Math.max(p.pdp.pct,Math.round(dn/S.ms[p.id].length*90));draw();App.toast(m.d?'Шаг отмечен – прогресс плана обновлён':'Отметка снята')}
   else if(a==='ci'){App.modal('Check-in по плану',`<label class="f">Что изменилось</label><textarea class="ta" id="ps-ci-t" rows="4" placeholder="Коротко: что сделано, что мешает, следующий шаг"></textarea>`,`<button class="btn" data-close>Отмена</button><button class="btn pr" id="ps-ci-ok">Сохранить</button>`);
    document.getElementById('ps-ci-ok').onclick=()=>{const t=document.getElementById('ps-ci-t').value.trim();if(!t){App.toast('Напишите пару слов');return}(S.ci[p.id]=S.ci[p.id]||[]).unshift({d:'2026-11-11',t,by:HRP.me()});App.close();draw();App.toast('Check-in сохранён – виден '+first(p)+' и руководителю')}}
   else if(a==='pdp-draft')draft();
   else if(a==='growth')App.go('growth',{id:p.id});
   else if(a==='remind')App.toast(`${b.dataset.t}: напоминание HR и руководителю за 14 дней`);
   else if(a==='file')App.toast('Документ конфиденциальный – просмотр записан в журнал доступа');
   else if(a==='cert')App.toast(`«${b.dataset.t}» – урок на продление назначен ${first(p)}`);
   else if(a==='bday')App.toast(`Открытка для ${first(p)} ушла команде на подпись`);
   else if(a==='pay')App.toast('«Расчёты» – раздел админа, этот проект его не меняет');
  };
  draw();
 },
 notes:(pr)=>{const t=TABS.some(x=>x[0]===pr.tab)?pr.tab:'overview',n=NB[t],nm=(TABS.find(x=>x[0]===t)||[])[1];
  return `<h4>Что это</h4><p>Карточка 360 для HR: рост, общение и работа человека в одном месте, без денег. Сейчас открыта вкладка «${nm}».</p>
<h4>Зачем HR</h4><p>Подготовиться к 1:1 за 2 минуты и видеть человека целиком: чего хочет, как растёт, как ему сейчас.</p>
<h4>Откуда идея</h4>${n[0]}<h4>Данные из нашей CRM</h4>${n[1]}<h4>Приоритет</h4><p>${n[2]}</p><h4>Доступы</h4><p>${n[3]}</p>`}
});
})();
</script>
